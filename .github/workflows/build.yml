name: Build APK

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Package Name
        required: false
        default: com.example.app
      app_name:
        description: App Name
        required: false
        default: MyApp
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get Package Name
        id: pkg
        run: |
          PKG="com.example.app"
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            PKG="${{ github.event.client_payload.package_name }}"
          elif [ -n "${{ github.event.inputs.package_name }}" ]; then
            PKG="${{ github.event.inputs.package_name }}"
          fi
          echo "name=$PKG" >> $GITHUB_OUTPUT
          echo "path=$(echo $PKG | tr '.' '/')" >> $GITHUB_OUTPUT

      - name: Get App Name
        id: app
        run: |
          APP="MyApp"
          if [ -n "${{ github.event.client_payload.app_name }}" ]; then
            APP="${{ github.event.client_payload.app_name }}"
          elif [ -n "${{ github.event.inputs.app_name }}" ]; then
            APP="${{ github.event.inputs.app_name }}"
          fi
          echo "name=$APP" >> $GITHUB_OUTPUT

      - name: Fix Java Package Names
        run: |
          if [ -d "app/src/main/java" ]; then
            find app/src/main/java -name "*.java" -exec sed -i "s/^package .*;/package ${{ steps.pkg.outputs.name }};/" {} \;
          fi

      - name: Update Manifest Label
        run: |
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i "s/android:label=\".*\"/android:label=\"${{ steps.app.outputs.name }}\"/" app/src/main/AndroidManifest.xml
          fi

      - name: Update Strings
        run: |
          if [ -f "app/src/main/res/values/strings.xml" ]; then
            sed -i "s/<string name=\"app_name\">.*</<string name=\"app_name\">${{ steps.app.outputs.name }}</" app/src/main/res/values/strings.xml
          fi

      - name: Process Icon
        run: |
          if [ -f "build_assets/app_icon.png" ]; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
            mkdir -p app/src/main/res/mipmap-mdpi
            mkdir -p app/src/main/res/mipmap-hdpi
            mkdir -p app/src/main/res/mipmap-xhdpi
            mkdir -p app/src/main/res/mipmap-xxhdpi
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            convert build_assets/app_icon.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Create build.gradle
        run: |
          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "${{ steps.pkg.outputs.name }}"
              compileSdk 34

              defaultConfig {
                  applicationId "${{ steps.pkg.outputs.name }}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
          }
          EOF
          touch app/proguard-rules.pro

      - name: Create settings.gradle
        run: |
          cat > settings.gradle << EOF
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyApp"
          include ':app'
          EOF

      - name: Create build.gradle root
        run: |
          cat > build.gradle << EOF
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties << EOF
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          android.enableJetifier=false
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            App: ${{ steps.app.outputs.name }}
            Package: ${{ steps.pkg.outputs.name }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
