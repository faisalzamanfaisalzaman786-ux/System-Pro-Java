name: Build APK Only

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.counter.app'
      app_name:
        description: 'App Name'
        required: false
        default: 'Counter_1'
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check build_assets
        run: |
          echo "=== Checking build_assets ==="
          ls -la build_assets/ 2>/dev/null || echo "build_assets folder not found"
          echo ""
          echo "Files in build_assets:"
          find build_assets -type f 2>/dev/null || echo "No files"

      - name: Setup Project
        env:
          PKG: ${{ github.event.inputs.package_name }}
          APP_NAME: ${{ github.event.inputs.app_name }}
        run: |
          PKG="${PKG:-com.counter.app}"
          APP_NAME="${APP_NAME:-Counter_1}"
          PKG_PATH=$(echo $PKG | tr '.' '/')
          
          # Create directories
          mkdir -p app/src/main/java/$PKG_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          
          # Copy files from build_assets if they exist
          if [ -f "build_assets/MainActivity.java" ]; then
            sed "s/package .*;/package $PKG;/" build_assets/MainActivity.java > app/src/main/java/$PKG_PATH/MainActivity.java
            echo "✅ MainActivity.java copied"
          else
            echo "❌ MainActivity.java not found"
            exit 1
          fi
          
          if [ -f "build_assets/activity_main.xml" ]; then
            cp build_assets/activity_main.xml app/src/main/res/layout/activity_main.xml
            echo "✅ activity_main.xml copied"
          else
            echo "❌ activity_main.xml not found"
            exit 1
          fi
          
          if [ -f "build_assets/AndroidManifest.xml" ]; then
            sed -i 's/package="[^"]*"//g' build_assets/AndroidManifest.xml
            sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/" build_assets/AndroidManifest.xml
            cp build_assets/AndroidManifest.xml app/src/main/AndroidManifest.xml
            echo "✅ AndroidManifest.xml copied"
          else
            echo "❌ AndroidManifest.xml not found"
            exit 1
          fi
          
          # Default colors.xml if not exists
          if [ ! -f "build_assets/colors.xml" ]; then
            cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#6200EE</color>
              <color name="colorPrimaryDark">#3700B3</color>
              <color name="colorAccent">#03DAC6</color>
          </resources>
          EOF
          else
            cp build_assets/colors.xml app/src/main/res/values/colors.xml
          fi
          
          # Default themes.xml if not exists
          if [ ! -f "build_assets/themes.xml" ]; then
            cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          EOF
          else
            cp build_assets/themes.xml app/src/main/res/values/themes.xml
          fi
          
          # strings.xml
          if [ -f "build_assets/strings.xml" ]; then
            sed -i "s/<string name=\"app_name\">.*</<string name=\"app_name\">$APP_NAME</" build_assets/strings.xml
            cp build_assets/strings.xml app/src/main/res/values/strings.xml
          else
            cat > app/src/main/res/values/strings.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">$APP_NAME</string>
          </resources>
          EOF
          fi
          
          # Icon
          if [ -f "build_assets/app_icon.png" ]; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
            convert build_assets/app_icon.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "✅ Icon applied"
          fi

      - name: Create build.gradle
        env:
          PKG: ${{ github.event.inputs.package_name }}
        run: |
          PKG="${PKG:-com.counter.app}"
          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application' version '8.2.2'
          }

          android {
              namespace "$PKG"
              compileSdk 34

              defaultConfig {
                  applicationId "$PKG"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
          }
          EOF
          touch app/proguard-rules.pro

      - name: Create Gradle files
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "App"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            App: ${{ github.event.inputs.app_name }}
            Package: ${{ github.event.inputs.package_name }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
