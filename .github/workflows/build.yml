name: Build Android APK + AAB (Release Only)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.example.app'
        type: string
      app_name:
        description: 'App Name'
        required: false
        default: 'MyApp'
        type: string
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write
  actions: write

concurrency:
  group: android-build-${{ github.run_id }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get Package Name from Payload
        id: pkg
        run: |
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            PKG="${{ github.event.client_payload.package_name }}"
          elif [ -n "${{ github.event.inputs.package_name }}" ]; then
            PKG="${{ github.event.inputs.package_name }}"
          else
            PKG="com.example.app"
          fi
          
          # Clean package name
          PKG=$(echo "$PKG" | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "package_name=$PKG" >> $GITHUB_OUTPUT
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          echo "package_path=$PKG_PATH" >> $GITHUB_OUTPUT
          echo "Using package: $PKG"

      - name: Get App Name from Payload
        id: app
        run: |
          if [ -n "${{ github.event.client_payload.app_name }}" ]; then
            APP_NAME="${{ github.event.client_payload.app_name }}"
          elif [ -n "${{ github.event.inputs.app_name }}" ]; then
            APP_NAME="${{ github.event.inputs.app_name }}"
          else
            APP_NAME="MyApp"
          fi
          
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "Using app name: $APP_NAME"

      - name: Create Project Directories
        run: |
          rm -rf app
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/assets

      - name: Decode Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "WARNING: No keystore found, creating debug keystore"
            keytool -genkey -v -keystore keystore.jks -alias release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown" -storepass android -keypass android
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=release" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          else
            KEYSTORE_ABS="$GITHUB_WORKSPACE/keystore.jks"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 -d > "$KEYSTORE_ABS"
            echo "KEYSTORE_PATH=$KEYSTORE_ABS" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Generate and Fix Package Names Everywhere
        run: |
          export NEW_PKG="${{ steps.pkg.outputs.package_name }}"
          export APP_NAME="${{ steps.app.outputs.app_name }}"
          export PKG_PATH="${{ steps.pkg.outputs.package_path }}"
          
          cat > /tmp/payload.json << 'PAYLOAD_EOF'
          ${{ toJson(github.event.client_payload.files) }}
          PAYLOAD_EOF

          cat > generate_and_fix.py << 'EOF'
          import json
          import os
          import re
          import sys
          import traceback
          import shutil

          def fix_package_in_content(content, old_pkg_pattern, new_pkg):
              """Fix package names in file content"""
              # Fix package declaration
              content = re.sub(r'^package\s+[\w.]+;', f'package {new_pkg};', content, flags=re.MULTILINE)
              
              # Fix import statements
              if old_pkg_pattern:
                  content = re.sub(f'import\\s+{old_pkg_pattern}\\.', f'import {new_pkg}.', content)
              
              # Fix fully qualified class names
              content = re.sub(f'{old_pkg_pattern}\\.', f'{new_pkg}.', content)
              
              return content

          def extract_package_from_content(content):
              """Extract package name from file content"""
              match = re.search(r'^package\s+([\w.]+);', content, re.MULTILINE)
              return match.group(1) if match else None

          def main():
              try:
                  target_pkg = os.environ.get("NEW_PKG", "com.example.app")
                  app_name = os.environ.get("APP_NAME", "MyApp")
                  pkg_path = target_pkg.replace(".", "/")
                  
                  print(f"📦 Target Package: {target_pkg}")
                  print(f"📱 Target App Name: {app_name}")
                  print(f"📁 Package Path: {pkg_path}")
                  
                  # Load payload files
                  files = {}
                  payload_file = "/tmp/payload.json"
                  if os.path.exists(payload_file):
                      with open(payload_file, 'r') as f:
                          content = f.read().strip()
                          if content and content != "null" and content != "{}":
                              try:
                                  files = json.loads(content)
                                  print(f"✓ Loaded {len(files)} files from payload")
                              except:
                                  print("⚠️ No valid files in payload")
                  
                  created_count = 0
                  updated_count = 0
                  
                  # First pass: process all payload files
                  for path, content in files.items():
                      clean_path = path.strip("/")
                      print(f"\n📄 Processing: {clean_path}")
                      
                      # Handle Java files
                      if clean_path.endswith(".java"):
                          # Extract old package if exists
                          old_pkg = extract_package_from_content(content)
                          if old_pkg and old_pkg != target_pkg:
                              print(f"   🔄 Fixing package: {old_pkg} -> {target_pkg}")
                              content = fix_package_in_content(content, old_pkg, target_pkg)
                              updated_count += 1
                          elif not old_pkg:
                              # Add package declaration if missing
                              content = f'package {target_pkg};\n\n{content}'
                              print(f"   ➕ Added package declaration: {target_pkg}")
                              updated_count += 1
                          
                          filename = os.path.basename(clean_path)
                          new_path = f"app/src/main/java/{pkg_path}/{filename}"
                          os.makedirs(os.path.dirname(new_path), exist_ok=True)
                          with open(new_path, "w", encoding="utf-8") as out:
                              out.write(content)
                          print(f"   ✓ Java file: {filename}")
                          created_count += 1
                      
                      # Handle XML files
                      elif clean_path.endswith(".xml"):
                          if "AndroidManifest.xml" in clean_path:
                              new_path = "app/src/main/AndroidManifest.xml"
                              # Fix package in manifest
                              content = re.sub(r'package="[^"]*"', f'package="{target_pkg}"', content)
                              # Ensure manifest has package
                              if 'package="' not in content:
                                  content = content.replace('<manifest', f'<manifest package="{target_pkg}"')
                              # Add xmlns if missing
                              if 'xmlns:android' not in content:
                                  content = content.replace('<manifest', '<manifest xmlns:android="http://schemas.android.com/apk/res/android"')
                              # Fix app name
                              content = re.sub(r'android:label="[^"]*"', f'android:label="{app_name}"', content)
                              
                              os.makedirs(os.path.dirname(new_path), exist_ok=True)
                              with open(new_path, "w", encoding="utf-8") as out:
                                  out.write(content)
                              print(f"   ✓ AndroidManifest.xml (package: {target_pkg})")
                              created_count += 1
                              
                          elif "layout" in clean_path and ".xml" in clean_path:
                              filename = os.path.basename(clean_path)
                              new_path = f"app/src/main/res/layout/{filename}"
                              # Fix any hardcoded package names in layout
                              content = re.sub(r'package="[^"]*"', f'package="{target_pkg}"', content)
                              os.makedirs(os.path.dirname(new_path), exist_ok=True)
                              with open(new_path, "w", encoding="utf-8") as out:
                                  out.write(content)
                              print(f"   ✓ Layout: {filename}")
                              created_count += 1
                              
                          elif "values/strings.xml" in clean_path:
                              new_path = "app/src/main/res/values/strings.xml"
                              os.makedirs(os.path.dirname(new_path), exist_ok=True)
                              if '<string name="app_name">' in content:
                                  content = re.sub(r'<string name="app_name">.*?</string>', f'<string name="app_name">{app_name}</string>', content)
                              else:
                                  content = content.replace('</resources>', f'    <string name="app_name">{app_name}</string>\n</resources>')
                              with open(new_path, "w", encoding="utf-8") as out:
                                  out.write(content)
                              print(f"   ✓ strings.xml (app_name: {app_name})")
                              created_count += 1
                          else:
                              # Other XML files
                              new_path = f"app/src/main/res/{clean_path}"
                              os.makedirs(os.path.dirname(new_path), exist_ok=True)
                              with open(new_path, "w", encoding="utf-8") as out:
                                  out.write(content)
                              print(f"   ✓ XML: {clean_path}")
                              created_count += 1
                      else:
                          # Other files
                          new_path = f"app/src/main/{clean_path}"
                          os.makedirs(os.path.dirname(new_path), exist_ok=True)
                          with open(new_path, "w", encoding="utf-8") as out:
                              out.write(content)
                          print(f"   ✓ File: {clean_path}")
                          created_count += 1
                  
                  # Second pass: Create default MainActivity with correct package
                  main_activity_path = f"app/src/main/java/{pkg_path}/MainActivity.java"
                  if not os.path.exists(main_activity_path):
                      print(f"\n📝 Creating default MainActivity.java")
                      with open(main_activity_path, "w", encoding="utf-8") as f:
                          f.write(f'''package {target_pkg};

import android.os.Bundle;
import android.view.View;
import android.widget.TextView;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {{
    
    @Override
    protected void onCreate(Bundle savedInstanceState) {{
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);
        
        TextView textView = findViewById(R.id.textView);
        if (textView != null) {{
            textView.setText("Welcome to {app_name}");
        }}
    }}
}}
''')
                      print(f"   ✓ Created MainActivity.java with package: {target_pkg}")
                      created_count += 1
                  
                  # Create default layout if missing
                  layout_path = "app/src/main/res/layout/activity_main.xml"
                  if not os.path.exists(layout_path):
                      print(f"\n📝 Creating default activity_main.xml")
                      with open(layout_path, "w", encoding="utf-8") as f:
                          f.write('''<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:orientation="vertical"
    android:gravity="center"
    android:padding="16dp">
    
    <TextView
        android:id="@+id/textView"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="Hello World!"
        android:textSize="24sp"
        android:textColor="@android:color/black"/>
    
    <Button
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="Click Me"
        android:layout_marginTop="20dp"
        android:onClick="onButtonClick"/>
        
</LinearLayout>
''')
                      print(f"   ✓ Created activity_main.xml")
                      created_count += 1
                  
                  # Create strings.xml if missing
                  strings_path = "app/src/main/res/values/strings.xml"
                  if not os.path.exists(strings_path):
                      os.makedirs(os.path.dirname(strings_path), exist_ok=True)
                      with open(strings_path, "w", encoding="utf-8") as f:
                          f.write('<?xml version="1.0" encoding="utf-8"?>\n')
                          f.write('<resources>\n')
                          f.write(f'    <string name="app_name">{app_name}</string>\n')
                          f.write('</resources>\n')
                      print(f"   ✓ Created strings.xml")
                      created_count += 1
                  
                  # Create colors.xml if missing
                  colors_path = "app/src/main/res/values/colors.xml"
                  if not os.path.exists(colors_path):
                      os.makedirs(os.path.dirname(colors_path), exist_ok=True)
                      with open(colors_path, "w", encoding="utf-8") as f:
                          f.write('''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="colorPrimary">#6200EE</color>
    <color name="colorPrimaryDark">#3700B3</color>
    <color name="colorAccent">#03DAC6</color>
    <color name="white">#FFFFFF</color>
    <color name="black">#000000</color>
</resources>
''')
                      print(f"   ✓ Created colors.xml")
                      created_count += 1
                  
                  # Create themes.xml if missing
                  themes_path = "app/src/main/res/values/themes.xml"
                  if not os.path.exists(themes_path):
                      os.makedirs(os.path.dirname(themes_path), exist_ok=True)
                      with open(themes_path, "w", encoding="utf-8") as f:
                          f.write('''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
        <item name="colorPrimary">@color/colorPrimary</item>
        <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
        <item name="colorAccent">@color/colorAccent</item>
    </style>
</resources>
''')
                      print(f"   ✓ Created themes.xml")
                      created_count += 1
                  
                  # Create AndroidManifest.xml if missing or fix existing
                  manifest_path = "app/src/main/AndroidManifest.xml"
                  if not os.path.exists(manifest_path):
                      with open(manifest_path, "w", encoding="utf-8") as f:
                          f.write(f'''<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="{target_pkg}">
    
    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="{app_name}"
        android:theme="@style/AppTheme">
        
        <activity
            android:name=".MainActivity"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
    
</manifest>
''')
                      print(f"   ✓ Created AndroidManifest.xml with package: {target_pkg}")
                      created_count += 1
                  else:
                      # Fix existing manifest
                      with open(manifest_path, 'r') as f:
                          manifest_content = f.read()
                      manifest_content = re.sub(r'package="[^"]*"', f'package="{target_pkg}"', manifest_content)
                      if 'package="' not in manifest_content:
                          manifest_content = manifest_content.replace('<manifest', f'<manifest package="{target_pkg}"')
                      with open(manifest_path, 'w') as f:
                          f.write(manifest_content)
                      print(f"   ✓ Fixed existing AndroidManifest.xml package to: {target_pkg}")
                  
                  # Final verification
                  print("\n" + "="*50)
                  print("✅ FINAL VERIFICATION")
                  print("="*50)
                  
                  # Check all Java files for correct package
                  java_files = []
                  for root, dirs, files in os.walk("app/src/main/java"):
                      for file in files:
                          if file.endswith(".java"):
                              java_files.append(os.path.join(root, file))
                  
                  print(f"\n📋 Checking {len(java_files)} Java file(s):")
                  for java_file in java_files:
                      with open(java_file, 'r') as f:
                          content = f.read()
                          pkg_match = re.search(r'^package\s+([\w.]+);', content, re.MULTILINE)
                          if pkg_match:
                              pkg_found = pkg_match.group(1)
                              if pkg_found == target_pkg:
                                  print(f"   ✓ {os.path.basename(java_file)}: {pkg_found}")
                              else:
                                  print(f"   ⚠️ {os.path.basename(java_file)}: {pkg_found} (should be {target_pkg})")
                          else:
                              print(f"   ⚠️ {os.path.basename(java_file)}: No package declaration")
                  
                  print(f"\n📋 Manifest package:")
                  with open(manifest_path, 'r') as f:
                      manifest_content = f.read()
                      pkg_match = re.search(r'package="([^"]*)"', manifest_content)
                      if pkg_match:
                          print(f"   ✓ {pkg_match.group(1)}")
                  
                  print(f"\n📋 App Name: {app_name}")
                  print(f"\n📊 Summary: {created_count} file(s) created, {updated_count} package update(s)")
                  
              except Exception as e:
                  print(f"❌ Error: {e}")
                  traceback.print_exc()
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          EOF

          python3 generate_and_fix.py

      - name: Final Package Name Verification
        run: |
          TARGET_PKG="${{ steps.pkg.outputs.package_name }}"
          echo "=== FINAL PACKAGE VERIFICATION ==="
          echo "Target Package: $TARGET_PKG"
          
          # Verify all Java files
          find app/src/main/java -name "*.java" -type f | while read file; do
            echo -n "Checking $file: "
            if grep -q "^package $TARGET_PKG;" "$file"; then
              echo "✓ OK"
            else
              echo "⚠️ WRONG PACKAGE - Fixing..."
              sed -i "s/^package .*;/package $TARGET_PKG;/" "$file"
            fi
          done
          
          # Verify Manifest
          echo -n "Manifest package: "
          if grep -q "package=\"$TARGET_PKG\"" app/src/main/AndroidManifest.xml; then
            echo "✓ OK"
          else
            echo "⚠️ FIXING..."
            sed -i "s/package=\"[^\"]*\"/package=\"$TARGET_PKG\"/" app/src/main/AndroidManifest.xml
          fi
          
          echo "✅ All package names are consistent: $TARGET_PKG"

      - name: Generate App Icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true
          
          ICON_B64="${{ github.event.client_payload.icon }}"
          
          if [ -n "$ICON_B64" ] && [ "$ICON_B64" != "null" ] && [ "$ICON_B64" != "" ]; then
            echo "$ICON_B64" | base64 -d > /tmp/icon.png
            if file /tmp/icon.png | grep -q 'PNG image'; then
              echo "✅ Custom icon detected, generating all densities..."
              
              convert /tmp/icon.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
              cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
              convert /tmp/icon.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
              cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
              convert /tmp/icon.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
              cp app/src/main/res/mipmap-xhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
              convert /tmp/icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
              cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
              convert /tmp/icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
              
              echo "✅ Custom icon applied successfully"
              exit 0
            fi
          fi
          
          echo "⚠️ No valid custom icon, generating fallback icons..."
          for size in 48 72 96 144 192; do
            case $size in
              48) density="mdpi" ;;
              72) density="hdpi" ;;
              96) density="xhdpi" ;;
              144) density="xxhdpi" ;;
              192) density="xxxhdpi" ;;
            esac
            convert -size ${size}x${size} xc:#6200EE -gravity center \
              -font Helvetica -pointsize $((size/3)) -fill white -annotate 0 "A" \
              app/src/main/res/mipmap-${density}/ic_launcher.png 2>/dev/null || true
            cp app/src/main/res/mipmap-${density}/ic_launcher.png app/src/main/res/mipmap-${density}/ic_launcher_round.png 2>/dev/null || true
          done
          echo "✅ Fallback icons generated"

      - name: Create build.gradle with Correct Package
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          
          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "${PKG}"
              compileSdk 34

              defaultConfig {
                  applicationId "${PKG}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  multiDexEnabled true
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH") ?: "none")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }

              buildFeatures {
                  buildConfig true
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          EOF
          
          cat > app/proguard-rules.pro << 'EOF'
          -keep class * extends androidx.appcompat.app.AppCompatActivity
          -keepattributes Signature
          EOF

      - name: Create Gradle Settings
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AppBuilder"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          android.enableJetifier=false
          org.gradle.parallel=false
          org.gradle.caching=false
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Clean and Verify Build
        run: |
          ./gradlew clean --no-daemon
          echo "=== Build Configuration Verification ==="
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon 2>&1 | head -20 || true

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon --no-parallel --no-build-cache

      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace --no-daemon --no-parallel --no-build-cache

      - name: Verify APK Package Name
        run: |
          echo "=== APK Package Verification ==="
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            # Use aapt2 to check package name if available
            if command -v aapt2 &> /dev/null; then
              PACKAGE=$(aapt2 dump packagename app/build/outputs/apk/release/app-release.apk 2>/dev/null || echo "unknown")
              echo "APK Package: $PACKAGE"
              echo "Expected: ${{ steps.pkg.outputs.package_name }}"
            else
              echo "aapt2 not available, skipping APK verification"
            fi
            echo "✅ APK generated successfully"
          else
            echo "❌ APK not found!"
            exit 1
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-release
          name: Latest Release
          body: |
            ## 🚀 APK and AAB Files
            
            ### APK
            - Package: ${{ steps.pkg.outputs.package_name }}
            - App Name: ${{ steps.app.outputs.app_name }}
            - Download the APK file below
            
            ### AAB  
            - Download the AAB file below
            
            Generated by CodeForge Pro Build System
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
