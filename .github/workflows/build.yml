name: Build Android APK (Professional Clean Slate)

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get dynamic package name
        id: pkg
        run: |
          NEW_PKG="${{ github.event.client_payload.package_name }}"
          if [ -z "$NEW_PKG" ]; then
            NEW_PKG="com.systempro.app"
          fi
          echo "package_name=$NEW_PKG" >> $GITHUB_OUTPUT

      - name: Create project structure
        run: |
          PKG_PATH=$(echo "${{ steps.pkg.outputs.package_name }}" | tr '.' '/')
          mkdir -p "app/src/main/java/${PKG_PATH}"
          mkdir -p app/src/main/res/{layout,values,drawable}
          mkdir -p gradle/wrapper

      - name: Create MainActivity.java
        run: |
          cat > "app/src/main/java/$(echo ${{ steps.pkg.outputs.package_name }} | tr '.' '/')/MainActivity.java" <<JAVA
          package ${{ steps.pkg.outputs.package_name }};
          import androidx.appcompat.app.AppCompatActivity;
          import android.os.Bundle;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
              }
          }
          JAVA

      - name: Create resources and manifest
        run: |
          # Layout file
          cat > app/src/main/res/layout/activity_main.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          XML
          
          # Strings file
          cat > app/src/main/res/values/strings.xml <<STR
          <resources>
              <string name="app_name">SystemPro App</string>
          </resources>
          STR

          # AndroidManifest.xml (Fixing the crash)
          cat > app/src/main/AndroidManifest.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="${{ steps.pkg.outputs.package_name }}">
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

      - name: Create Gradle configuration
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > settings.gradle << 'EOF'
          rootProject.name = "SystemProProject"
          include ':app'
          EOF

          cat > app/build.gradle << EOF
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace '${{ steps.pkg.outputs.package_name }}'
              defaultConfig {
                  applicationId '${{ steps.pkg.outputs.package_name }}'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # Setup Gradle Wrapper
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          mkdir -p gradle/wrapper
          # Creating a basic gradlew file
          cat > gradlew << 'EOF'
          #!/usr/bin/env sh
          ./gradle-8.5/bin/gradle "$@"
          EOF
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
