name: Build APK

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create full Android project
        run: |
          # Create directory structure
          mkdir -p app/src/main/java/com/counter/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
          # MainActivity.java
          cat > app/src/main/java/com/counter/app/MainActivity.java << 'EOF'
          package com.counter.app;
          
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          
          public class MainActivity extends AppCompatActivity {
              private TextView tv;
              private Button minus, reset, plus;
              private int count = 0;
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  tv = findViewById(R.id.tv);
                  minus = findViewById(R.id.minus);
                  reset = findViewById(R.id.reset);
                  plus = findViewById(R.id.plus);
                  
                  tv.setText("0");
                  
                  minus.setOnClickListener(v -> { count--; tv.setText(count+""); });
                  reset.setOnClickListener(v -> { count=0; tv.setText("0"); });
                  plus.setOnClickListener(v -> { count++; tv.setText(count+""); });
              }
          }
          EOF
          
          # activity_main.xml
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">
              <TextView
                  android:id="@+id/tv"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="0"
                  android:textSize="80sp"
                  android:layout_marginBottom="40dp" />
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal">
                  <Button
                      android:id="@+id/minus"
                      android:layout_width="0dp"
                      android:layout_height="60dp"
                      android:layout_weight="1"
                      android:text="-"
                      android:textSize="32sp"
                      android:layout_marginEnd="8dp" />
                  <Button
                      android:id="@+id/reset"
                      android:layout_width="0dp"
                      android:layout_height="60dp"
                      android:layout_weight="1"
                      android:text="Reset"
                      android:textSize="16sp"
                      android:layout_marginStart="4dp"
                      android:layout_marginEnd="4dp" />
                  <Button
                      android:id="@+id/plus"
                      android:layout_width="0dp"
                      android:layout_height="60dp"
                      android:layout_weight="1"
                      android:text="+"
                      android:textSize="32sp"
                      android:layout_marginStart="8dp" />
              </LinearLayout>
          </LinearLayout>
          EOF
          
          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.counter.app">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Counter App"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # settings.gradle
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CounterApp"
          include ':app'
          EOF
          
          # build.gradle (project level)
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF
          
          # app/build.gradle
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.counter.app'
              compileSdk 34
              
              defaultConfig {
                  applicationId 'com.counter.app'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          
          # gradle.properties
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF
          
          echo "✅ Project created successfully"

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
