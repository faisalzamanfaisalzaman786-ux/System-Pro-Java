name: Android CI/CD with Dispatch

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.example.app'
      app_name:
        description: 'App Name'
        required: false
        default: 'MyApp'
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write
  actions: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Get Package Name
        id: pkg
        run: |
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            PKG="${{ github.event.client_payload.package_name }}"
          elif [ -n "${{ github.event.inputs.package_name }}" ]; then
            PKG="${{ github.event.inputs.package_name }}"
          else
            PKG="com.example.app"
          fi
          echo "package_name=$PKG" >> $GITHUB_OUTPUT
          echo "✅ Package: $PKG"

      - name: Get App Name
        id: app
        run: |
          if [ -n "${{ github.event.client_payload.app_name }}" ]; then
            APP_NAME="${{ github.event.client_payload.app_name }}"
          elif [ -n "${{ github.event.inputs.app_name }}" ]; then
            APP_NAME="${{ github.event.inputs.app_name }}"
          else
            APP_NAME="MyApp"
          fi
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "✅ App Name: $APP_NAME"

      - name: Create Directories
        run: |
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

      - name: Generate Files from Payload
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          APP_NAME="${{ steps.app.outputs.app_name }}"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          
          # Create MainActivity.java if exists in payload
          echo '${{ toJson(github.event.client_payload.files) }}' > /tmp/files.json
          
          # Process files using python
          python3 << 'EOF'
          import json, os, re
          
          with open('/tmp/files.json', 'r') as f:
              content = f.read().strip()
              files = json.loads(content) if content and content != 'null' else {}
          
          pkg = os.environ.get('PKG', 'com.example.app')
          app_name = os.environ.get('APP_NAME', 'MyApp')
          pkg_path = pkg.replace('.', '/')
          
          for path, file_content in files.items():
              clean_path = path.strip('/')
              
              if clean_path.endswith('.java'):
                  # Fix package name
                  file_content = re.sub(r'^package .*?;', f'package {pkg};', file_content, flags=re.MULTILINE)
                  filename = os.path.basename(clean_path)
                  new_path = f"app/src/main/java/{pkg_path}/{filename}"
                  os.makedirs(os.path.dirname(new_path), exist_ok=True)
                  with open(new_path, 'w') as out:
                      out.write(file_content)
                  print(f"✅ Java: {filename}")
                  
              elif 'AndroidManifest.xml' in clean_path:
                  new_path = "app/src/main/AndroidManifest.xml"
                  os.makedirs(os.path.dirname(new_path), exist_ok=True)
                  with open(new_path, 'w') as out:
                      out.write(file_content)
                  print("✅ AndroidManifest.xml")
                  
              elif 'layout' in clean_path and clean_path.endswith('.xml'):
                  filename = os.path.basename(clean_path)
                  new_path = f"app/src/main/res/layout/{filename}"
                  os.makedirs(os.path.dirname(new_path), exist_ok=True)
                  with open(new_path, 'w') as out:
                      out.write(file_content)
                  print(f"✅ Layout: {filename}")
                  
              elif 'strings.xml' in clean_path:
                  new_path = "app/src/main/res/values/strings.xml"
                  os.makedirs(os.path.dirname(new_path), exist_ok=True)
                  with open(new_path, 'w') as out:
                      out.write(file_content)
                  print("✅ strings.xml")
                  
              elif 'colors.xml' in clean_path:
                  new_path = "app/src/main/res/values/colors.xml"
                  os.makedirs(os.path.dirname(new_path), exist_ok=True)
                  with open(new_path, 'w') as out:
                      out.write(file_content)
                  print("✅ colors.xml")
                  
              elif 'themes.xml' in clean_path:
                  new_path = "app/src/main/res/values/themes.xml"
                  os.makedirs(os.path.dirname(new_path), exist_ok=True)
                  with open(new_path, 'w') as out:
                      out.write(file_content)
                  print("✅ themes.xml")
          
          # Create fallback files if missing
          if not os.path.exists("app/src/main/res/values/strings.xml"):
              os.makedirs("app/src/main/res/values", exist_ok=True)
              with open("app/src/main/res/values/strings.xml", 'w') as f:
                  f.write(f'''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">{app_name}</string>
</resources>''')
              print("⚠️ Created fallback strings.xml")
          
          if not os.path.exists("app/src/main/res/values/colors.xml"):
              with open("app/src/main/res/values/colors.xml", 'w') as f:
                  f.write('''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="colorPrimary">#6200EE</color>
    <color name="colorPrimaryDark">#3700B3</color>
    <color name="colorAccent">#03DAC6</color>
</resources>''')
              print("⚠️ Created fallback colors.xml")
          
          if not os.path.exists("app/src/main/AndroidManifest.xml"):
              with open("app/src/main/AndroidManifest.xml", 'w') as f:
                  f.write(f'''<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="{pkg}">
    <application android:label="{app_name}" android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>''')
              print("⚠️ Created fallback AndroidManifest.xml")
          EOF

      - name: Generate App Icons
        run: |
          ICON_B64="${{ github.event.client_payload.icon }}"
          if [ -n "$ICON_B64" ] && [ "$ICON_B64" != "null" ]; then
            echo "$ICON_B64" | base64 -d > icon.png
            for size in 48 72 96 144 192; do
              case $size in
                48) density="mdpi" ;;
                72) density="hdpi" ;;
                96) density="xhdpi" ;;
                144) density="xxhdpi" ;;
                192) density="xxxhdpi" ;;
              esac
              convert icon.png -resize ${size}x${size} app/src/main/res/mipmap-${density}/ic_launcher.png
              cp app/src/main/res/mipmap-${density}/ic_launcher.png app/src/main/res/mipmap-${density}/ic_launcher_round.png
            done
            echo "✅ Custom icon applied"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build APK Release
        run: ./gradlew assembleRelease --no-daemon

      - name: Build AAB Release
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-release
          name: Latest Build - ${{ steps.app.outputs.app_name }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ github.token }}
