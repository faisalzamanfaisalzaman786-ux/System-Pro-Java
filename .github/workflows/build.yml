name: Complete Java Project Generator

on:
  workflow_dispatch:

jobs:
  generate-full-project:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Delete everything except .git
      run: |
        find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

    - name: Create complete Java project structure
      run: |
        # Standard Maven project structure
        mkdir -p src/main/java/com/example/app
        mkdir -p src/main/resources
        mkdir -p src/test/java/com/example/app
        mkdir -p src/test/resources

    - name: Create pom.xml (Maven build file)
      run: |
        cat > pom.xml << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0"
         xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
         xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 
         http://maven.apache.org/xsd/maven-4.0.0.xsd">
    <modelVersion>4.0.0</modelVersion>

    <groupId>com.example</groupId>
    <artifactId>java-app</artifactId>
    <version>1.0-SNAPSHOT</version>
    <packaging>jar</packaging>

    <properties>
        <maven.compiler.source>17</maven.compiler.source>
        <maven.compiler.target>17</maven.compiler.target>
        <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
    </properties>

    <dependencies>
        <dependency>
            <groupId>org.junit.jupiter</groupId>
            <artifactId>junit-jupiter</artifactId>
            <version>5.10.0</version>
            <scope>test</scope>
        </dependency>
    </dependencies>

    <build>
        <plugins>
            <plugin>
                <groupId>org.apache.maven.plugins</groupId>
                <artifactId>maven-compiler-plugin</artifactId>
                <version>3.11.0</version>
            </plugin>
            <plugin>
                <groupId>org.apache.maven.plugins</groupId>
                <artifactId>maven-jar-plugin</artifactId>
                <version>3.3.0</version>
                <configuration>
                    <archive>
                        <manifest>
                            <mainClass>com.example.app.Main</mainClass>
                        </manifest>
                    </archive>
                </configuration>
            </plugin>
        </plugins>
    </build>
</project>
EOF

    - name: Create main Java class
      run: |
        cat > src/main/java/com/example/app/Main.java << 'EOF'
package com.example.app;

public class Main {
    public static void main(String[] args) {
        System.out.println("Hello from Java Project!");
        System.out.println("Project successfully restored.");
        
        Calculator calc = new Calculator();
        System.out.println("10 + 5 = " + calc.add(10, 5));
    }
}
EOF

    - name: Create additional Java class
      run: |
        cat > src/main/java/com/example/app/Calculator.java << 'EOF'
package com.example.app;

public class Calculator {
    public int add(int a, int b) {
        return a + b;
    }
    
    public int subtract(int a, int b) {
        return a - b;
    }
    
    public int multiply(int a, int b) {
        return a * b;
    }
    
    public int divide(int a, int b) {
        if (b == 0) {
            throw new IllegalArgumentException("Cannot divide by zero");
        }
        return a / b;
    }
}
EOF

    - name: Create test class
      run: |
        cat > src/test/java/com/example/app/CalculatorTest.java << 'EOF'
package com.example.app;

import org.junit.jupiter.api.Test;
import static org.junit.jupiter.api.Assertions.*;

class CalculatorTest {
    
    private final Calculator calc = new Calculator();
    
    @Test
    void testAdd() {
        assertEquals(15, calc.add(10, 5));
        assertEquals(0, calc.add(-5, 5));
    }
    
    @Test
    void testSubtract() {
        assertEquals(5, calc.subtract(10, 5));
        assertEquals(-15, calc.subtract(-10, 5));
    }
    
    @Test
    void testMultiply() {
        assertEquals(50, calc.multiply(10, 5));
        assertEquals(0, calc.multiply(0, 5));
    }
    
    @Test
    void testDivide() {
        assertEquals(2, calc.divide(10, 5));
        assertThrows(IllegalArgumentException.class, () -> calc.divide(10, 0));
    }
}
EOF

    - name: Create application properties
      run: |
        cat > src/main/resources/application.properties << 'EOF'
app.name=Java Restored Application
app.version=1.0.0
app.author=GitHub Actions
EOF

    - name: Create .gitignore
      run: |
        cat > .gitignore << 'EOF'
# Compiled files
target/
*.class

# IDE files
.idea/
*.iml
.settings/
.project
.classpath
.vscode/

# Logs
*.log

# OS files
.DS_Store
Thumbs.db

# Maven wrapper (optional to track)
!/.mvn/wrapper/maven-wrapper.jar
EOF

    - name: Generate Maven Wrapper
      run: |
        mvn -N wrapper:wrapper
        chmod +x mvnw

    - name: Create README.md
      run: |
        cat > README.md << 'EOF'
# Java Project

This project was automatically generated by GitHub Actions.

## Build and Run

```bash
# Build the project
./mvnw clean compile

# Run tests
./mvnw test

# Package JAR
./mvnw package

# Run the application
./mvnw exec:java -Dexec.mainClass="com.example.app.Main"
