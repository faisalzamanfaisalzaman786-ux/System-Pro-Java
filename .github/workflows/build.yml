name: Build Android APK (Clean Slate, Gradle 8.5)

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get package name from payload
        id: pkg
        run: |
          NEW_PKG="${{ github.event.client_payload.package_name }}"
          if [ -z "$NEW_PKG" ]; then
            NEW_PKG="com.systempro.app"
          fi
          echo "package_name=$NEW_PKG" >> $GITHUB_OUTPUT
          echo "Using package: $NEW_PKG"

      # مکمل صفائی – تمام Gradle فائلیں اور source فولڈرز
      - name: Clean everything
        run: |
          rm -rf app/build.gradle app/src/main
          rm -rf build.gradle settings.gradle gradle.properties gradlew gradle

      - name: Create directory structure
        run: |
          PKG_PATH=$(echo "${{ steps.pkg.outputs.package_name }}" | tr '.' '/')
          mkdir -p "app/src/main/java/${PKG_PATH}"
          mkdir -p app/src/main/res/layout app/src/main/res/values
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi

      - name: Create MainActivity.java
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          cat > "app/src/main/java/${PKG_PATH}/MainActivity.java" <<JAVA
          package ${PKG};
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  TextView tv = findViewById(R.id.helloText);
                  tv.setText("CodeForge Pro - Clean Build!");
              }
          }
          JAVA

      - name: Create layout and strings
        run: |
          cat > app/src/main/res/layout/activity_main.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">
              <TextView
                  android:id="@+id/helloText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Hello CodeForge"
                  android:textSize="28sp"
                  android:textColor="#00FFCC" />
          </LinearLayout>
          XML
          cat > app/src/main/res/values/strings.xml <<STR
          <resources>
              <string name="app_name">CodeForge Pro</string>
          </resources>
          STR

      - name: Create AndroidManifest.xml
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          cat > app/src/main/AndroidManifest.xml <<MAN
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="${PKG}">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MAN

      - name: Generate app icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ -f build_assets/app_icon.png ]; then
            convert build_assets/app_icon.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
            convert -size 72x72 xc:#00FFCC app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert -size 48x48 xc:#00FFCC app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert -size 96x96 xc:#00FFCC app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert -size 144x144 xc:#00FFCC app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert -size 192x192 xc:#00FFCC app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Create Gradle files from scratch
        run: |
          # Root build.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          tasks.register('clean', Delete) { delete rootProject.buildDir }
          EOF

          # settings.gradle
          cat > settings.gradle << 'EOF'
          rootProject.name = "CodeForgePro"
          include ':app'
          EOF

          # gradle.properties
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=34
          EOF

          # gradle wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          wget -q https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          cat > gradlew << 'EOF'
          #!/bin/sh
          GRADLE_OPTS="-Dorg.gradle.appname=gradlew"
          exec java $GRADLE_OPTS -classpath "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

      - name: Create app/build.gradle with sourceSets
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          cat > app/build.gradle << APPGRADLE
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace '${PKG}'
              defaultConfig {
                  applicationId '${PKG}'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              sourceSets {
                  main {
                      java.srcDirs = ['src/main/java']
                      res.srcDirs = ['src/main/res']
                      manifest.srcFile 'src/main/AndroidManifest.xml'
                  }
              }
          }
          dependencies {}
          APPGRADLE

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Check APK size
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          if [ -z "$APK" ]; then
            echo "❌ No APK found!"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          SIZE_KB=$((SIZE / 1024))
          echo "APK size: ${SIZE_KB} KB"
          if [ $SIZE_KB -lt 100 ]; then
            echo "❌ APK too small (${SIZE_KB} KB), compilation failed"
            exit 1
          else
            echo "✅ APK size is normal"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          files: app/build/outputs/apk/debug/*.apk
