name: Add Missing Gradle Files

on:
  workflow_dispatch:

jobs:
  add-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create root build.gradle if missing
        run: |
          if [ ! -f build.gradle ]; then
            cat > build.gradle << 'EOF'
            buildscript {
                repositories { google(); mavenCentral() }
                dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
            }
            allprojects { repositories { google(); mavenCentral() } }
            tasks.register('clean', Delete) { delete rootProject.buildDir }
            EOF
          fi

      - name: Create settings.gradle if missing
        run: |
          if [ ! -f settings.gradle ]; then
            cat > settings.gradle << 'EOF'
            pluginManagement {
                repositories { google(); mavenCentral(); gradlePluginPortal() }
            }
            dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                repositories { google(); mavenCentral() }
            }
            rootProject.name = "CodeForgePro"
            include ':app'
            EOF
          fi

      - name: Create gradle.properties if missing
        run: |
          if [ ! -f gradle.properties ]; then
            cat > gradle.properties << 'EOF'
            org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
            android.useAndroidX=true
            android.enableJetifier=true
            android.suppressUnsupportedCompileSdk=34
            EOF
          fi

      - name: Create app/build.gradle if missing
        run: |
          if [ ! -f app/build.gradle ]; then
            mkdir -p app
            cat > app/build.gradle << 'EOF'
            plugins { id 'com.android.application' }
            android {
                compileSdk 34
                namespace 'com.systempro.app'
                defaultConfig {
                    applicationId 'com.systempro.app'
                    minSdk 21
                    targetSdk 34
                    versionCode 1
                    versionName '1.0'
                }
                buildTypes { release { minifyEnabled false } }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            dependencies { }
            EOF
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.gradle settings.gradle gradle.properties app/build.gradle
          git diff --staged --quiet || git commit -m "Add missing Gradle files"
          git push
