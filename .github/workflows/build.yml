name: Build Android APK (Debug Only)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.counter.app'
        type: string
      app_name:
        description: 'App Name'
        required: false
        default: 'Counter App'
        type: string
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get Package Name
        id: pkg
        run: |
          PKG="com.counter.app"
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            PKG="${{ github.event.client_payload.package_name }}"
          elif [ -n "${{ github.event.inputs.package_name }}" ]; then
            PKG="${{ github.event.inputs.package_name }}"
          fi
          PKG=$(echo "$PKG" | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "package_name=$PKG" >> $GITHUB_OUTPUT
          echo "package_path=$(echo $PKG | tr '.' '/')" >> $GITHUB_OUTPUT

      - name: Get App Name
        id: app
        run: |
          APP="Counter App"
          if [ -n "${{ github.event.client_payload.app_name }}" ]; then
            APP="${{ github.event.client_payload.app_name }}"
          elif [ -n "${{ github.event.inputs.app_name }}" ]; then
            APP="${{ github.event.inputs.app_name }}"
          fi
          echo "app_name=$APP" >> $GITHUB_OUTPUT

      - name: Create Project Directories
        run: |
          rm -rf app
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

      - name: Generate Counter App Files
        env:
          PKG: ${{ steps.pkg.outputs.package_name }}
          PKG_PATH: ${{ steps.pkg.outputs.package_path }}
          APP_NAME: ${{ steps.app.outputs.app_name }}
        run: |
          # Create package directory
          mkdir -p app/src/main/java/$PKG_PATH
          
          # Create MainActivity.java with Counter functionality
          cat > app/src/main/java/$PKG_PATH/MainActivity.java << 'EOF'
          package PKG_PLACEHOLDER;
          
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          
          public class MainActivity extends AppCompatActivity {
              private TextView counterTextView;
              private Button incrementButton;
              private Button decrementButton;
              private Button resetButton;
              private int counter = 0;
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  // Initialize views
                  counterTextView = findViewById(R.id.counterTextView);
                  incrementButton = findViewById(R.id.incrementButton);
                  decrementButton = findViewById(R.id.decrementButton);
                  resetButton = findViewById(R.id.resetButton);
                  
                  // Set initial counter value
                  updateCounterDisplay();
                  
                  // Set click listeners
                  incrementButton.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          counter++;
                          updateCounterDisplay();
                      }
                  });
                  
                  decrementButton.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          counter--;
                          updateCounterDisplay();
                      }
                  });
                  
                  resetButton.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          counter = 0;
                          updateCounterDisplay();
                      }
                  });
              }
              
              private void updateCounterDisplay() {
                  counterTextView.setText(String.valueOf(counter));
              }
          }
          EOF
          
          # Replace placeholders
          sed -i "s/PKG_PLACEHOLDER/$PKG/g" app/src/main/java/$PKG_PATH/MainActivity.java
          
          # Create activity_main.xml with Counter UI
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">
              
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Counter App"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:textColor="@android:color/black"
                  android:layout_marginBottom="40dp"/>
              
              <TextView
                  android:id="@+id/counterTextView"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="0"
                  android:textSize="80sp"
                  android:textStyle="bold"
                  android:textColor="#6200EE"
                  android:layout_marginBottom="40dp"/>
              
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center"
                  android:layout_marginBottom="20dp">
                  
                  <Button
                      android:id="@+id/decrementButton"
                      android:layout_width="80dp"
                      android:layout_height="80dp"
                      android:text="-"
                      android:textSize="32sp"
                      android:layout_marginEnd="20dp"/>
                  
                  <Button
                      android:id="@+id/incrementButton"
                      android:layout_width="80dp"
                      android:layout_height="80dp"
                      android:text="+"
                      android:textSize="32sp"/>
              </LinearLayout>
              
              <Button
                  android:id="@+id/resetButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Reset"
                  android:textSize="18sp"
                  android:paddingLeft="32dp"
                  android:paddingRight="32dp"/>
              
          </LinearLayout>
          EOF
          
          # Create strings.xml
          cat > app/src/main/res/values/strings.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">$APP_NAME</string>
          </resources>
          EOF
          
          # Create colors.xml
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#6200EE</color>
              <color name="colorPrimaryDark">#3700B3</color>
              <color name="colorAccent">#03DAC6</color>
          </resources>
          EOF
          
          # Create themes.xml
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          EOF
          
          # Create AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="$APP_NAME"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          echo "Counter app files generated successfully"

      - name: Generate App Icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          
          for size in 48 72 96 144 192; do
            case $size in
              48) density="mdpi" ;;
              72) density="hdpi" ;;
              96) density="xhdpi" ;;
              144) density="xxhdpi" ;;
              192) density="xxxhdpi" ;;
            esac
            convert -size ${size}x${size} xc:#6200EE -gravity center \
              -font Helvetica -pointsize $((size/3)) -fill white -annotate 0 "C" \
              app/src/main/res/mipmap-${density}/ic_launcher.png 2>/dev/null || true
            cp app/src/main/res/mipmap-${density}/ic_launcher.png app/src/main/res/mipmap-${density}/ic_launcher_round.png 2>/dev/null || true
          done

      - name: Create build.gradle
        env:
          PKG: ${{ steps.pkg.outputs.package_name }}
        run: |
          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "$PKG"
              compileSdk 34

              defaultConfig {
                  applicationId "$PKG"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
          }
          EOF
          
          touch app/proguard-rules.pro

      - name: Create Gradle Settings
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CounterApp"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          android.enableJetifier=false
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: counter-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: counter-app-${{ github.run_number }}
          name: Counter App - ${{ steps.app.outputs.app_name }}
          body: |
            ## Counter App Built Successfully! 🎉
            
            ### Features:
            - **+ Button** - Increment counter
            - **- Button** - Decrement counter  
            - **Reset Button** - Reset to zero
            - Large counter display
            
            **App:** ${{ steps.app.outputs.app_name }}
            **Package:** ${{ steps.pkg.outputs.package_name }}
            
            ### How to Use:
            1. Download and install APK
            2. Open the app
            3. Click + to increase count
            4. Click - to decrease count
            5. Click Reset to start over
          files: |
            app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
