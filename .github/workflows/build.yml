name: Build APK
on: repository_dispatch
types: [trigger_b64_build]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: { distribution: 'temurin', java-version: '17' }
    - name: Build
      run: |
        mkdir -p gradle/wrapper
        curl -L https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip" > gradle/wrapper/gradle-wrapper.properties
        chmod +x gradlew 2>/dev/null || echo "#!/bin/bash" > gradlew && chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
    - uses: actions/upload-artifact@v4
      with: { name: app-debug, path: app/build/outputs/apk/debug/*.apk }