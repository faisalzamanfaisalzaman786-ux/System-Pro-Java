name: Build APK from Repository Files

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Package Name
        required: false
        default: com.example.app
        type: string
      app_name:
        description: App Name
        required: false
        default: MyApp
        type: string
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get Parameters
        id: params
        run: |
          PKG="com.example.app"
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            PKG="${{ github.event.client_payload.package_name }}"
          elif [ -n "${{ github.event.inputs.package_name }}" ]; then
            PKG="${{ github.event.inputs.package_name }}"
          fi
          echo "package_name=$PKG" >> $GITHUB_OUTPUT
          echo "package_path=$(echo $PKG | tr '.' '/')" >> $GITHUB_OUTPUT
          
          APP="MyApp"
          if [ -n "${{ github.event.client_payload.app_name }}" ]; then
            APP="${{ github.event.client_payload.app_name }}"
          elif [ -n "${{ github.event.inputs.app_name }}" ]; then
            APP="${{ github.event.inputs.app_name }}"
          fi
          echo "app_name=$APP" >> $GITHUB_OUTPUT

      - name: Verify Files
        run: |
          echo "Checking repository files..."
          if [ -d "app/src/main/java" ]; then
            echo "Java files:"
            find app/src/main/java -name "*.java" -type f 2>/dev/null || echo "None"
          fi
          if [ -d "app/src/main/res/layout" ]; then
            echo "Layout files:"
            find app/src/main/res/layout -name "*.xml" -type f 2>/dev/null || echo "None"
          fi

      - name: Fix Package Names
        env:
          PKG: ${{ steps.params.outputs.package_name }}
        run: |
          if [ -d "app/src/main/java" ]; then
            for file in $(find app/src/main/java -name "*.java"); do
              echo "Fixing $file"
              sed -i "s/^package .*;/package $PKG;/" "$file"
            done
          fi

      - name: Update App Name
        env:
          APP_NAME: ${{ steps.params.outputs.app_name }}
        run: |
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/" app/src/main/AndroidManifest.xml
          fi
          if [ -f "app/src/main/res/values/strings.xml" ]; then
            sed -i "s/<string name=\"app_name\">.*</<string name=\"app_name\">$APP_NAME</" app/src/main/res/values/strings.xml
          fi

      - name: Handle Icons
        run: |
          if [ -f "build_assets/app_icon.png" ]; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
            for size in 48 72 96 144 192; do
              case $size in
                48) d=mdpi ;;
                72) d=hdpi ;;
                96) d=xhdpi ;;
                144) d=xxhdpi ;;
                192) d=xxxhdpi ;;
              esac
              mkdir -p app/src/main/res/mipmap-$d
              convert build_assets/app_icon.png -resize ${size}x${size} app/src/main/res/mipmap-$d/ic_launcher.png 2>/dev/null || true
            done
          fi

      - name: Create build.gradle
        env:
          PKG: ${{ steps.params.outputs.package_name }}
        run: |
          if [ ! -f "app/build.gradle" ]; then
            echo "plugins {
    id 'com.android.application'
}

android {
    namespace \"$PKG\"
    compileSdk 34

    defaultConfig {
        applicationId \"$PKG\"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName \"1.0\"
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
}" > app/build.gradle
            touch app/proguard-rules.pro
          fi

      - name: Create Gradle Files
        run: |
          if [ ! -f "settings.gradle" ]; then
            echo "pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = \"MyApp\"
include ':app'" > settings.gradle
          fi
          
          if [ ! -f "build.gradle" ]; then
            echo "plugins {
    id 'com.android.application' version '8.2.2' apply false
}" > build.gradle
          fi
          
          if [ ! -f "gradle.properties" ]; then
            echo "org.gradle.jvmargs=-Xmx4096m
android.useAndroidX=true
android.enableJetifier=false" > gradle.properties
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            APK built from repository files.
            App: ${{ steps.params.outputs.app_name }}
            Package: ${{ steps.params.outputs.package_name }}
          files: |
            app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
