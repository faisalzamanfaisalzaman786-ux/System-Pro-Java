name: Clean Duplicate Files

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Remove duplicate resource files
        run: |
          rm -f app/src/main/res/values/colors.xml
          rm -f app/src/main/res/values/themes.xml
          rm -f app/src/main/res/values/strings.xml
          
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Remove duplicate resource files" || echo "No changes to commit"
          git push
