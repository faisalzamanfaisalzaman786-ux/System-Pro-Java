name: Build APK

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.counter.app'
      app_name:
        description: 'App Name'
        required: false
        default: 'Counter App'
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (Simple)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Get Parameters
        id: params
        run: |
          PKG="${{ github.event.client_payload.package_name }}"
          if [ -z "$PKG" ] || [ "$PKG" = "null" ]; then
            PKG="${{ github.event.inputs.package_name }}"
          fi
          if [ -z "$PKG" ] || [ "$PKG" = "null" ]; then
            PKG="com.counter.app"
          fi
          echo "name=$PKG" >> $GITHUB_OUTPUT
          echo "path=$(echo $PKG | tr '.' '/')" >> $GITHUB_OUTPUT
          
          APP="${{ github.event.client_payload.app_name }}"
          if [ -z "$APP" ] || [ "$APP" = "null" ]; then
            APP="${{ github.event.inputs.app_name }}"
          fi
          if [ -z "$APP" ] || [ "$APP" = "null" ]; then
            APP="Counter App"
          fi
          echo "app_name=$APP" >> $GITHUB_OUTPUT

      - name: Create Project Structure
        env:
          PKG_PATH: ${{ steps.params.outputs.path }}
        run: |
          rm -rf app
          mkdir -p app/src/main/java/$PKG_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi

      - name: Create Files from build_assets
        env:
          PKG: ${{ steps.params.outputs.name }}
          PKG_PATH: ${{ steps.params.outputs.path }}
          APP_NAME: ${{ steps.params.outputs.app_name }}
        run: |
          # MainActivity.java
          if [ -f "build_assets/MainActivity.java" ]; then
            sed "s/package .*;/package $PKG;/" build_assets/MainActivity.java > app/src/main/java/$PKG_PATH/MainActivity.java
          else
            echo "No MainActivity.java found"
            exit 1
          fi
          
          # activity_main.xml
          if [ -f "build_assets/activity_main.xml" ]; then
            cp build_assets/activity_main.xml app/src/main/res/layout/activity_main.xml
          else
            echo "No activity_main.xml found"
            exit 1
          fi
          
          # AndroidManifest.xml
          if [ -f "build_assets/AndroidManifest.xml" ]; then
            sed -i 's/package="[^"]*"//g' build_assets/AndroidManifest.xml
            sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/" build_assets/AndroidManifest.xml
            cp build_assets/AndroidManifest.xml app/src/main/AndroidManifest.xml
          else
            echo "No AndroidManifest.xml found"
            exit 1
          fi
          
          # colors.xml
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#6200EE</color>
              <color name="colorPrimaryDark">#3700B3</color>
              <color name="colorAccent">#03DAC6</color>
          </resources>
          EOF
          
          # themes.xml
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          EOF
          
          # strings.xml
          cat > app/src/main/res/values/strings.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">$APP_NAME</string>
          </resources>
          EOF
          
          # Icon
          if [ -f "build_assets/app_icon.png" ]; then
            cp build_assets/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi

      - name: Create build.gradle
        env:
          PKG: ${{ steps.params.outputs.name }}
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2'
          }

          android {
              namespace "PKG_PLACEHOLDER"
              compileSdk 34

              defaultConfig {
                  applicationId "PKG_PLACEHOLDER"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          sed -i "s/PKG_PLACEHOLDER/$PKG/g" app/build.gradle
          touch app/proguard-rules.pro

      - name: Create Gradle Files
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "App"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ steps.params.outputs.app_name }}
          body: |
            **App:** ${{ steps.params.outputs.app_name }}
            **Package:** ${{ steps.params.outputs.name }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
