name: Build Android APK + AAB

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.example.app'
        type: string
      app_name:
        description: 'App Name'
        required: false
        default: 'MyApp'
        type: string
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get Package Name
        id: pkg
        run: |
          PKG="com.example.app"
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            PKG="${{ github.event.client_payload.package_name }}"
          elif [ -n "${{ github.event.inputs.package_name }}" ]; then
            PKG="${{ github.event.inputs.package_name }}"
          fi
          echo "package_name=$PKG" >> $GITHUB_OUTPUT
          echo "package_path=$(echo $PKG | tr '.' '/')" >> $GITHUB_OUTPUT

      - name: Get App Name
        id: app
        run: |
          APP="MyApp"
          if [ -n "${{ github.event.client_payload.app_name }}" ]; then
            APP="${{ github.event.client_payload.app_name }}"
          elif [ -n "${{ github.event.inputs.app_name }}" ]; then
            APP="${{ github.event.inputs.app_name }}"
          fi
          echo "app_name=$APP" >> $GITHUB_OUTPUT

      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

      - name: Decode Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            keytool -genkey -v -keystore keystore.jks -alias release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown" -storepass android -keypass android
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=release" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          else
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Create MainActivity
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          PKG_PATH="${{ steps.pkg.outputs.package_path }}"
          APP_NAME="${{ steps.app.outputs.app_name }}"
          
          mkdir -p app/src/main/java/$PKG_PATH
          
          cat > app/src/main/java/$PKG_PATH/MainActivity.java << JAVA_EOF
          package $PKG;
          
          import android.os.Bundle;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  TextView textView = findViewById(R.id.textView);
                  if (textView != null) {
                      textView.setText("Welcome to $APP_NAME");
                  }
              }
          }
          JAVA_EOF

      - name: Create Layout
        run: |
          cat > app/src/main/res/layout/activity_main.xml << XML_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center">
              <TextView
                  android:id="@+id/textView"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Hello World!"
                  android:textSize="24sp"/>
          </LinearLayout>
          XML_EOF

      - name: Create Strings XML
        run: |
          APP_NAME="${{ steps.app.outputs.app_name }}"
          cat > app/src/main/res/values/strings.xml << XML_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">$APP_NAME</string>
          </resources>
          XML_EOF

      - name: Create Colors XML
        run: |
          cat > app/src/main/res/values/colors.xml << XML_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#6200EE</color>
              <color name="colorPrimaryDark">#3700B3</color>
              <color name="colorAccent">#03DAC6</color>
          </resources>
          XML_EOF

      - name: Create Themes XML
        run: |
          cat > app/src/main/res/values/themes.xml << XML_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          XML_EOF

      - name: Create Android Manifest
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          APP_NAME="${{ steps.app.outputs.app_name }}"
          cat > app/src/main/AndroidManifest.xml << XML_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="$PKG">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="$APP_NAME"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML_EOF

      - name: Create Icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          
          for size in 48 72 96 144 192; do
            case $size in
              48) density="mdpi" ;;
              72) density="hdpi" ;;
              96) density="xhdpi" ;;
              144) density="xxhdpi" ;;
              192) density="xxxhdpi" ;;
            esac
            convert -size ${size}x${size} xc:#6200EE -gravity center \
              -font Helvetica -pointsize $((size/3)) -fill white -annotate 0 "App" \
              app/src/main/res/mipmap-${density}/ic_launcher.png 2>/dev/null || true
            cp app/src/main/res/mipmap-${density}/ic_launcher.png app/src/main/res/mipmap-${density}/ic_launcher_round.png 2>/dev/null || true
          done

      - name: Create build.gradle
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          cat > app/build.gradle << GRADLE_EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "$PKG"
              compileSdk 34

              defaultConfig {
                  applicationId "$PKG"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  multiDexEnabled true
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          GRADLE_EOF
          
          touch app/proguard-rules.pro

      - name: Create Gradle Settings
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyApp"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          android.enableJetifier=false
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Clean Project
        run: ./gradlew clean --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Release AAB
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-release
          name: Latest Release
          body: |
            ## Build Complete
            
            - Package: ${{ steps.pkg.outputs.package_name }}
            - App Name: ${{ steps.app.outputs.app_name }}
            
            ### Files:
            - APK file attached below
            - AAB file attached below
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
