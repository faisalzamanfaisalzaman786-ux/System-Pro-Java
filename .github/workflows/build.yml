name: Build Android APK (Fresh Build with Correct Package)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Get package name from payload
        id: pkg
        run: |
          PKG="${{ github.event.client_payload.package_name }}"
          if [ -z "$PKG" ]; then
            PKG="com.systempro.app"
          fi
          echo "package_name=$PKG" >> $GITHUB_OUTPUT
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          echo "package_path=$PKG_PATH" >> $GITHUB_OUTPUT

      # مکمل صفائی: پرانی Java اور app/build.gradle ہٹائیں
      - name: Clean old source and build.gradle
        run: |
          rm -rf app/src/main/java
          rm -f app/build.gradle
          PKG_PATH="${{ steps.pkg.outputs.package_path }}"
          mkdir -p "app/src/main/java/${PKG_PATH}"
          mkdir -p app/src/main/res/layout app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi

      # پے لوڈ سے فائلیں (Java, XML, Manifest) بنائیں
      - name: Generate files from payload
        run: |
          echo '${{ toJson(github.event.client_payload.files) }}' > payload_files.json
          NEW_PKG="${{ steps.pkg.outputs.package_name }}"
          cat > generate.py << 'EOF'
          import json, os, re
          new_pkg = os.environ['NEW_PKG']
          with open('payload_files.json', 'r') as f:
              files = json.load(f)
          for path, content in files.items():
              if path.endswith('.java'):
                  # پیکج لائن تبدیل کریں
                  content = re.sub(r'^package .*;', f'package {new_pkg};', content, flags=re.MULTILINE)
                  # نئے پاتھ میں ڈال دیں (پیکج نیم کے مطابق ڈائریکٹری)
                  filename = os.path.basename(path)
                  new_path = f"app/src/main/java/{new_pkg.replace('.', '/')}/{filename}"
              else:
                  new_path = path
              os.makedirs(os.path.dirname(new_path), exist_ok=True)
              with open(new_path, 'w', encoding='utf-8') as out:
                  out.write(content)
              print(f"Written: {new_path}")
          # Manifest کا package attribute بھی درست کریں
          manifest = "app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest):
              with open(manifest, 'r') as mf:
                  man_content = mf.read()
              man_content = re.sub(r'package="[^"]*"', f'package="{new_pkg}"', man_content)
              with open(manifest, 'w') as mf:
                  mf.write(man_content)
              print("Manifest package updated")
          EOF
          export NEW_PKG
          python3 generate.py

      # نئی app/build.gradle فائل بنائیں (مکمل کنٹرول)
      - name: Create fresh app/build.gradle
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              compileSdk 34
              namespace "__PKG__"

              defaultConfig {
                  applicationId "__PKG__"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              sourceSets {
                  main {
                      java.srcDirs = ['src/main/java']
                      res.srcDirs = ['src/main/res']
                      manifest.srcFile 'src/main/AndroidManifest.xml'
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          # پلیس ہولڈر کو اصل پیکج سے بدلیں
          sed -i "s/__PKG__/${PKG}/g" app/build.gradle
          echo "app/build.gradle created with namespace=${PKG}"

      # آئیکن جنریٹ کریں (اگر پے لوڈ میں ہو)
      - name: Process app icon from payload
        run: |
          ICON_B64="${{ github.event.client_payload.icon }}"
          if [ -n "$ICON_B64" ] && [ "$ICON_B64" != "" ]; then
            echo "$ICON_B64" | base64 -d > app_icon.png
            sudo apt-get update && sudo apt-get install -y imagemagick
            convert app_icon.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert app_icon.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert app_icon.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert app_icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert app_icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "Icon generated"
          else
            # ڈیفالٹ سبز آئیکن
            convert -size 72x72 xc:#00FFCC app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert -size 48x48 xc:#00FFCC app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert -size 96x96 xc:#00FFCC app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert -size 144x144 xc:#00FFCC app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert -size 192x192 xc:#00FFCC app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "Default icon generated"
          fi

      # Gradle wrapper سیٹ کریں (Gradle 8.5)
      - name: Setup Gradle 8.5 wrapper
        run: |
          if [ ! -f gradlew ]; then
            mkdir -p gradle/wrapper
            wget -q https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo '#!/bin/sh' > gradlew
            echo 'GRADLE_OPTS="-Dorg.gradle.appname=gradlew"' >> gradlew
            echo 'exec java $GRADLE_OPTS -classpath "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          files: app/build/outputs/apk/debug/*.apk
