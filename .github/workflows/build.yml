name: CodeForge Pro Builder

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y android-sdk
        echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV

    - name: Create Android Project Structure
      run: |
        rm -rf app build.gradle settings.gradle gradle.properties 2>/dev/null || true
        mkdir -p app/src/main/java
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/mipmap-mdpi
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/mipmap-xhdpi
        mkdir -p app/src/main/res/mipmap-xxhdpi
        mkdir -p app/src/main/res/mipmap-xxxhdpi

    - name: Process Java Files
      run: |
        PKG_NAME="${{ github.event.client_payload.package_name }}"
        if [ -z "$PKG_NAME" ]; then PKG_NAME="com.example.app"; fi
        DIR_PATH=$(echo "$PKG_NAME" | tr '.' '/')
        TARGET_DIR="app/src/main/java/$DIR_PATH"
        mkdir -p "$TARGET_DIR"
        
        if [ -d "build_assets" ]; then
          find build_assets/ -maxdepth 1 -name "*.java" -exec cp {} "$TARGET_DIR/" \; 2>/dev/null || true
        fi
        
        if [ -z "$(ls -A "$TARGET_DIR" 2>/dev/null)" ]; then
          echo "package $PKG_NAME;" > "$TARGET_DIR/MainActivity.java"
          echo "" >> "$TARGET_DIR/MainActivity.java"
          echo "import android.os.Bundle;" >> "$TARGET_DIR/MainActivity.java"
          echo "import android.widget.TextView;" >> "$TARGET_DIR/MainActivity.java"
          echo "import androidx.appcompat.app.AppCompatActivity;" >> "$TARGET_DIR/MainActivity.java"
          echo "" >> "$TARGET_DIR/MainActivity.java"
          echo "public class MainActivity extends AppCompatActivity {" >> "$TARGET_DIR/MainActivity.java"
          echo "    @Override" >> "$TARGET_DIR/MainActivity.java"
          echo "    protected void onCreate(Bundle savedInstanceState) {" >> "$TARGET_DIR/MainActivity.java"
          echo "        super.onCreate(savedInstanceState);" >> "$TARGET_DIR/MainActivity.java"
          echo "        setContentView(R.layout.activity_main);" >> "$TARGET_DIR/MainActivity.java"
          echo "        TextView tv = findViewById(R.id.textView);" >> "$TARGET_DIR/MainActivity.java"
          echo "        tv.setText(\"Hello World!\");" >> "$TARGET_DIR/MainActivity.java"
          echo "    }" >> "$TARGET_DIR/MainActivity.java"
          echo "}" >> "$TARGET_DIR/MainActivity.java"
        fi

    - name: Process Layout Files
      run: |
        if [ -f "build_assets/activity_main.xml" ]; then
          cp build_assets/activity_main.xml app/src/main/res/layout/
        else
          echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/res/layout/activity_main.xml
          echo '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"' >> app/src/main/res/layout/activity_main.xml
          echo '    android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
          echo '    android:layout_height="match_parent"' >> app/src/main/res/layout/activity_main.xml
          echo '    android:orientation="vertical"' >> app/src/main/res/layout/activity_main.xml
          echo '    android:gravity="center"' >> app/src/main/res/layout/activity_main.xml
          echo '    android:padding="24dp"' >> app/src/main/res/layout/activity_main.xml
          echo '    android:background="#F5F5F5">' >> app/src/main/res/layout/activity_main.xml
          echo '    <TextView' >> app/src/main/res/layout/activity_main.xml
          echo '        android:id="@+id/textView"' >> app/src/main/res/layout/activity_main.xml
          echo '        android:layout_width="wrap_content"' >> app/src/main/res/layout/activity_main.xml
          echo '        android:layout_height="wrap_content"' >> app/src/main/res/layout/activity_main.xml
          echo '        android:text="Hello World!"' >> app/src/main/res/layout/activity_main.xml
          echo '        android:textSize="24sp"' >> app/src/main/res/layout/activity_main.xml
          echo '        android:textStyle="bold"' >> app/src/main/res/layout/activity_main.xml
          echo '        android:textColor="#212121" />' >> app/src/main/res/layout/activity_main.xml
          echo '</LinearLayout>' >> app/src/main/res/layout/activity_main.xml
        fi

    - name: Process Resource Files
      run: |
        if [ -f "build_assets/colors.xml" ]; then
          cp build_assets/colors.xml app/src/main/res/values/
        else
          echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/res/values/colors.xml
          echo '<resources>' >> app/src/main/res/values/colors.xml
          echo '    <color name="colorPrimary">#6200EE</color>' >> app/src/main/res/values/colors.xml
          echo '    <color name="colorPrimaryDark">#3700B3</color>' >> app/src/main/res/values/colors.xml
          echo '    <color name="colorAccent">#03DAC6</color>' >> app/src/main/res/values/colors.xml
          echo '    <color name="background">#F5F5F5</color>' >> app/src/main/res/values/colors.xml
          echo '    <color name="text_primary">#212121</color>' >> app/src/main/res/values/colors.xml
          echo '    <color name="white">#FFFFFF</color>' >> app/src/main/res/values/colors.xml
          echo '    <color name="black">#000000</color>' >> app/src/main/res/values/colors.xml
          echo '</resources>' >> app/src/main/res/values/colors.xml
        fi
        
        APP_NAME="${{ github.event.client_payload.app_name }}"
        if [ -z "$APP_NAME" ]; then APP_NAME="MyApp"; fi
        if [ -f "build_assets/strings.xml" ]; then
          cp build_assets/strings.xml app/src/main/res/values/
        else
          echo '<resources>' > app/src/main/res/values/strings.xml
          echo "    <string name=\"app_name\">$APP_NAME</string>" >> app/src/main/res/values/strings.xml
          echo '    <string name="hello_world">Hello World!</string>' >> app/src/main/res/values/strings.xml
          echo '</resources>' >> app/src/main/res/values/strings.xml
        fi
        
        if [ -f "build_assets/themes.xml" ]; then
          cp build_assets/themes.xml app/src/main/res/values/
        else
          echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/res/values/themes.xml
          echo '<resources>' >> app/src/main/res/values/themes.xml
          echo '    <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">' >> app/src/main/res/values/themes.xml
          echo '        <item name="colorPrimary">@color/colorPrimary</item>' >> app/src/main/res/values/themes.xml
          echo '        <item name="colorPrimaryDark">@color/colorPrimaryDark</item>' >> app/src/main/res/values/themes.xml
          echo '        <item name="colorAccent">@color/colorAccent</item>' >> app/src/main/res/values/themes.xml
          echo '    </style>' >> app/src/main/res/values/themes.xml
          echo '</resources>' >> app/src/main/res/values/themes.xml
        fi

    - name: Process AndroidManifest
      run: |
        PKG_NAME="${{ github.event.client_payload.package_name }}"
        if [ -z "$PKG_NAME" ]; then PKG_NAME="com.example.app"; fi
        APP_NAME="${{ github.event.client_payload.app_name }}"
        if [ -z "$APP_NAME" ]; then APP_NAME="MyApp"; fi
        
        if [ -f "build_assets/AndroidManifest.xml" ]; then
          sed -i 's/ android:roundIcon="[^"]*"//g' build_assets/AndroidManifest.xml
          cp build_assets/AndroidManifest.xml app/src/main/
        else
          echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"' >> app/src/main/AndroidManifest.xml
          echo "    package=\"$PKG_NAME\">" >> app/src/main/AndroidManifest.xml
          echo '    <application' >> app/src/main/AndroidManifest.xml
          echo '        android:allowBackup="true"' >> app/src/main/AndroidManifest.xml
          echo '        android:icon="@mipmap/ic_launcher"' >> app/src/main/AndroidManifest.xml
          echo "        android:label=\"$APP_NAME\"" >> app/src/main/AndroidManifest.xml
          echo '        android:theme="@style/AppTheme">' >> app/src/main/AndroidManifest.xml
          echo '        <activity android:name=".MainActivity" android:exported="true">' >> app/src/main/AndroidManifest.xml
          echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
          echo '                <action android:name="android.intent.action.MAIN" />' >> app/src/main/AndroidManifest.xml
          echo '                <category android:name="android.intent.category.LAUNCHER" />' >> app/src/main/AndroidManifest.xml
          echo '            </intent-filter>' >> app/src/main/AndroidManifest.xml
          echo '        </activity>' >> app/src/main/AndroidManifest.xml
          echo '    </application>' >> app/src/main/AndroidManifest.xml
          echo '</manifest>' >> app/src/main/AndroidManifest.xml
        fi

    - name: Handle App Icon
      run: |
        ICON_B64="${{ github.event.client_payload.icon }}"
        
        if [ ! -z "$ICON_B64" ]; then
          echo "$ICON_B64" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        else
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        fi
        
        for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
          if [ "$density" != "xxxhdpi" ]; then
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-${density}/ic_launcher.png 2>/dev/null || true
          fi
          cp app/src/main/res/mipmap-${density}/ic_launcher.png app/src/main/res/mipmap-${density}/ic_launcher_round.png 2>/dev/null || true
        done

    - name: Generate Gradle Files
      run: |
        PKG_NAME="${{ github.event.client_payload.package_name }}"
        if [ -z "$PKG_NAME" ]; then PKG_NAME="com.example.app"; fi
        
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
        
        echo "pluginManagement {" > settings.gradle
        echo "    repositories {" >> settings.gradle
        echo "        google()" >> settings.gradle
        echo "        mavenCentral()" >> settings.gradle
        echo "        gradlePluginPortal()" >> settings.gradle
        echo "    }" >> settings.gradle
        echo "}" >> settings.gradle
        echo "dependencyResolutionManagement {" >> settings.gradle
        echo "    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)" >> settings.gradle
        echo "    repositories {" >> settings.gradle
        echo "        google()" >> settings.gradle
        echo "        mavenCentral()" >> settings.gradle
        echo "    }" >> settings.gradle
        echo "}" >> settings.gradle
        echo "rootProject.name = \"CodeForgeApp\"" >> settings.gradle
        echo "include ':app'" >> settings.gradle
        
        echo "plugins {" > build.gradle
        echo "    id 'com.android.application' version '8.2.2' apply false" >> build.gradle
        echo "    id 'com.android.library' version '8.2.2' apply false" >> build.gradle
        echo "}" >> build.gradle
        
        echo "plugins {" > app/build.gradle
        echo "    id 'com.android.application'" >> app/build.gradle
        echo "}" >> app/build.gradle
        echo "" >> app/build.gradle
        echo "android {" >> app/build.gradle
        echo "    namespace \"$PKG_NAME\"" >> app/build.gradle
        echo "    compileSdk 34" >> app/build.gradle
        echo "" >> app/build.gradle
        echo "    defaultConfig {" >> app/build.gradle
        echo "        applicationId \"$PKG_NAME\"" >> app/build.gradle
        echo "        minSdk 21" >> app/build.gradle
        echo "        targetSdk 34" >> app/build.gradle
        echo "        versionCode 1" >> app/build.gradle
        echo "        versionName \"1.0\"" >> app/build.gradle
        echo "        multiDexEnabled true" >> app/build.gradle
        echo "    }" >> app/build.gradle
        echo "" >> app/build.gradle
        echo "    buildTypes {" >> app/build.gradle
        echo "        release {" >> app/build.gradle
        echo "            minifyEnabled false" >> app/build.gradle
        echo "            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'" >> app/build.gradle
        echo "        }" >> app/build.gradle
        echo "    }" >> app/build.gradle
        echo "    compileOptions {" >> app/build.gradle
        echo "        sourceCompatibility JavaVersion.VERSION_11" >> app/build.gradle
        echo "        targetCompatibility JavaVersion.VERSION_11" >> app/build.gradle
        echo "    }" >> app/build.gradle
        echo "}" >> app/build.gradle
        echo "" >> app/build.gradle
        echo "dependencies {" >> app/build.gradle
        echo "    implementation 'androidx.appcompat:appcompat:1.6.1'" >> app/build.gradle
        echo "    implementation 'com.google.android.material:material:1.10.0'" >> app/build.gradle
        echo "    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'" >> app/build.gradle
        echo "    implementation 'androidx.multidex:multidex:2.0.1'" >> app/build.gradle
        echo "}" >> app/build.gradle

    - name: Setup Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
        echo '#!/bin/sh' > gradlew
        echo 'exec java -cp "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
        chmod +x gradlew

    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace --no-daemon

    - name: Deploy Artifacts
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest-release
        name: "Latest Build"
        draft: false
        prerelease: false
        files: |
          app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ github.token }}
