name: Build Android APK (Universal Crash-Proof Builder)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Get package name
        id: pkg
        run: |
          PKG="${{ github.event.client_payload.package_name }}"
          if [ -z "$PKG" ]; then
            PKG="com.systempro.app"
          fi

          echo "package_name=$PKG" >> $GITHUB_OUTPUT

          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          echo "package_path=$PKG_PATH" >> $GITHUB_OUTPUT

      - name: Get app name
        id: app
        run: |
          APP_NAME="${{ github.event.client_payload.app_name }}"

          if [ -z "$APP_NAME" ]; then
            APP_NAME="CodeForge Pro"
          fi

          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

      - name: Clean old project
        run: |
          rm -rf app/src/main/java
          rm -rf app/src/main/res
          rm -rf app/src/main/AndroidManifest.xml
          rm -rf app/build.gradle

          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

      - name: Generate files safely
        run: |
          cat > payload_files.json << 'EOF'
          ${{ toJson(github.event.client_payload.files) }}
          EOF

          NEW_PKG="${{ steps.pkg.outputs.package_name }}"
          APP_NAME="${{ steps.app.outputs.app_name }}"

          cat > generate.py << 'PY'
          import json
          import os
          import re

          pkg = os.environ["NEW_PKG"]
          app_name = os.environ["APP_NAME"]

          pkg_path = pkg.replace(".", "/")

          with open("payload_files.json", "r") as f:
              files = json.load(f)

          java_found = False
          layout_found = False

          for path, content in files.items():

              if path.endswith(".java"):

                  java_found = True

                  content = re.sub(
                      r'^package .*?;',
                      'package ' + pkg + ';',
                      content,
                      flags=re.MULTILINE
                  )

                  content = content.replace(
                      "extends AppCompatActivity",
                      "extends Activity"
                  )

                  content = content.replace(
                      "import androidx.appcompat.app.AppCompatActivity;",
                      "import android.app.Activity;"
                  )

                  filename = os.path.basename(path)

                  new_path = "app/src/main/java/" + pkg_path + "/" + filename

              elif path.endswith(".xml"):

                  if "layout" in path:
                      layout_found = True

                  new_path = path

              else:
                  new_path = path

              os.makedirs(os.path.dirname(new_path), exist_ok=True)

              with open(new_path, "w", encoding="utf-8") as out:
                  out.write(content)

              print("Written:", new_path)

          # fallback layout
          if not layout_found:

              layout_path = "app/src/main/res/layout/activity_main.xml"

              with open(layout_path, "w") as f:
                  f.write("""<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:gravity="center"
              android:orientation="vertical">

              <TextView
                  android:id="@+id/textView"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="APK Build Success"
                  android:textSize="24sp"/>

          </LinearLayout>""")

          # fallback activity
          if not java_found:

              java_dir = "app/src/main/java/" + pkg_path
              os.makedirs(java_dir, exist_ok=True)

              with open(java_dir + "/MainActivity.java", "w") as f:
                  f.write(f'''package {pkg};

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;

          public class MainActivity extends Activity {{

              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  try {{
                      setContentView(R.layout.activity_main);
                  }} catch(Exception e) {{
                      TextView tv = new TextView(this);
                      tv.setText("Runtime Error: " + e.toString());
                      setContentView(tv);
                  }}
              }}
          }}
          ''')

          # strings.xml
          os.makedirs("app/src/main/res/values", exist_ok=True)

          with open("app/src/main/res/values/strings.xml", "w") as f:
              f.write(f'''<resources>
              <string name="app_name">{app_name}</string>
          </resources>''')

          # colors.xml
          with open("app/src/main/res/values/colors.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#6200EE</color>
          </resources>''')

          # themes.xml
          with open("app/src/main/res/values/themes.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.Light.NoActionBar" />
          </resources>''')

          # safe manifest
          manifest = f'''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="{pkg}">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>'''

          with open("app/src/main/AndroidManifest.xml", "w") as f:
              f.write(manifest)

          print("Safe manifest generated")
          PY

          export NEW_PKG
          export APP_NAME

          python3 generate.py

      - name: Create app build.gradle
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace "__PKG__"

              compileSdk 34

              defaultConfig {

                  applicationId "__PKG__"

                  minSdk 21
                  targetSdk 34

                  versionCode 1
                  versionName "1.0"

                  multiDexEnabled true
              }

              buildTypes {

                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              sourceSets {
                  main {
                      manifest.srcFile 'src/main/AndroidManifest.xml'
                      java.srcDirs = ['src/main/java']
                      res.srcDirs = ['src/main/res']
                  }
              }
          }

          dependencies {
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          EOF

          sed -i "s/__PKG__/${PKG}/g" app/build.gradle

      - name: Process app icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

          ICON_B64="${{ github.event.client_payload.icon }}"

          if [ -n "$ICON_B64" ] && [ "$ICON_B64" != "" ]; then

            echo "$ICON_B64" | base64 -d > icon.png

            convert icon.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert icon.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert icon.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          else

            convert -size 48x48 xc:#00FFCC app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert -size 72x72 xc:#00FFCC app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert -size 96x96 xc:#00FFCC app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert -size 144x144 xc:#00FFCC app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert -size 192x192 xc:#00FFCC app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          fi

      - name: Setup Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper

          wget -q https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar \
          -O gradle/wrapper/gradle-wrapper.jar

          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > gradlew << 'EOF'
          #!/bin/sh
          exec java -classpath "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF

          chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          files: app/build/outputs/apk/debug/*.apk
```
