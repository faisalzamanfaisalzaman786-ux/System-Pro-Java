name: Build with Dynamic Package Name

on:
  workflow_dispatch:
    inputs:
      base_package:
        description: 'Base Package (e.g., com.myapp)'
        required: false
        default: 'com.example.app'
      app_name:
        description: 'App Name'
        required: false
        default: 'MyApp'
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate Unique Package Name
        id: pkg
        run: |
          BASE_PKG="${{ github.event.inputs.base_package }}"
          if [ -z "$BASE_PKG" ] || [ "$BASE_PKG" = "null" ]; then
            BASE_PKG="com.example.app"
          fi
          
          # Generate unique suffix using timestamp and run number
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          RUN_NUM=${{ github.run_number }}
          RANDOM_ID=$(openssl rand -hex 4)
          
          # Option 1: Using timestamp
          UNIQUE_PKG="${BASE_PKG}.${TIMESTAMP}"
          
          # Option 2: Using run number
          # UNIQUE_PKG="${BASE_PKG}.build.${RUN_NUM}"
          
          # Option 3: Using random ID
          # UNIQUE_PKG="${BASE_PKG}.${RANDOM_ID}"
          
          echo "package_name=$UNIQUE_PKG" >> $GITHUB_OUTPUT
          echo "package_path=$(echo $UNIQUE_PKG | tr '.' '/')" >> $GITHUB_OUTPUT
          echo "Generated Unique Package: $UNIQUE_PKG"

      - name: Replace Package Name in Files
        env:
          PKG: ${{ steps.pkg.outputs.package_name }}
          PKG_PATH: ${{ steps.pkg.outputs.package_path }}
        run: |
          echo "Replacing package name with: $PKG"
          
          # Create correct directory structure
          mkdir -p app/src/main/java/$PKG_PATH
          
          # Move files to new package directory if they exist
          if [ -d "app/src/main/java/com" ]; then
            # Copy all Java files to new package
            find app/src/main/java/com -name "*.java" -type f | while read file; do
              filename=$(basename "$file")
              cp "$file" "app/src/main/java/$PKG_PATH/$filename"
            done
          fi
          
          # Update package names in all Java files
          find app/src/main/java -name "*.java" -type f -exec sed -i "s/^package .*;/package $PKG;/" {} \;
          
          # Update build.gradle
          if [ -f "app/build.gradle" ]; then
            sed -i "s/namespace \".*\"/namespace \"$PKG\"/" app/build.gradle
            sed -i "s/applicationId \".*\"/applicationId \"$PKG\"/" app/build.gradle
          fi
          
          # Update AndroidManifest.xml (remove package attribute)
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/package="[^"]*"//' app/src/main/AndroidManifest.xml
          fi
          
          echo "✅ Package name updated to: $PKG"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create build.gradle
        env:
          PKG: ${{ steps.pkg.outputs.package_name }}
        run: |
          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "$PKG"
              compileSdk 34

              defaultConfig {
                  applicationId "$PKG"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
          }
          EOF

      - name: Create Gradle Files
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyApp"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          android.enableJetifier=false
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.pkg.outputs.package_name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            **Package:** ${{ steps.pkg.outputs.package_name }}
            **App Name:** ${{ github.event.inputs.app_name }}
            **Unique ID:** ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
