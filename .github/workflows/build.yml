name: Build APK from Repository Files

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.example.app'
        type: string
      app_name:
        description: 'App Name'
        required: false
        default: 'MyApp'
        type: string
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get Build Parameters
        id: params
        run: |
          PKG="${{ github.event.client_payload.package_name }}"
          if [ -z "$PKG" ] || [ "$PKG" = "null" ]; then
            PKG="${{ github.event.inputs.package_name }}"
          fi
          if [ -z "$PKG" ] || [ "$PKG" = "null" ]; then
            PKG="com.example.app"
          fi
          echo "package_name=$PKG" >> $GITHUB_OUTPUT
          echo "package_path=$(echo $PKG | tr '.' '/')" >> $GITHUB_OUTPUT
          
          APP="${{ github.event.client_payload.app_name }}"
          if [ -z "$APP" ] || [ "$APP" = "null" ]; then
            APP="${{ github.event.inputs.app_name }}"
          fi
          if [ -z "$APP" ] || [ "$APP" = "null" ]; then
            APP="MyApp"
          fi
          echo "app_name=$APP" >> $GITHUB_OUTPUT
          
          echo "Package: $PKG"
          echo "App Name: $APP"

      - name: Verify Repository Structure
        run: |
          echo "=== Checking repository files ==="
          echo ""
          echo "Java files in repository:"
          find app/src/main/java -name "*.java" -type f 2>/dev/null || echo "No Java files found"
          echo ""
          echo "Layout files:"
          find app/src/main/res/layout -name "*.xml" -type f 2>/dev/null || echo "No layout files"
          echo ""
          echo "Values files:"
          find app/src/main/res/values -name "*.xml" -type f 2>/dev/null || echo "No values files"

      - name: Fix Package Names in Java Files
        env:
          PKG: ${{ steps.params.outputs.package_name }}
        run: |
          if [ -d "app/src/main/java" ]; then
            find app/src/main/java -name "*.java" -type f | while read file; do
              echo "Fixing package in: $file"
              sed -i "s/^package .*;/package $PKG;/" "$file"
            done
            echo "✅ Package names fixed to: $PKG"
          else
            echo "⚠️ No Java files found"
          fi

      - name: Update AndroidManifest
        env:
          APP_NAME: ${{ steps.params.outputs.app_name }}
        run: |
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:label="[^"]*"/android:label="'"$APP_NAME"'"/g' app/src/main/AndroidManifest.xml
            echo "✅ AndroidManifest updated"
          fi

      - name: Update strings.xml
        env:
          APP_NAME: ${{ steps.params.outputs.app_name }}
        run: |
          if [ -f "app/src/main/res/values/strings.xml" ]; then
            sed -i 's/<string name="app_name">.*</<string name="app_name">'"$APP_NAME"'</g' app/src/main/res/values/strings.xml
            echo "✅ strings.xml updated"
          fi

      - name: Process Icons
        run: |
          if [ -d "app/src/main/res/mipmap-hdpi" ] && [ -f "app/src/main/res/mipmap-hdpi/ic_launcher.png" ]; then
            echo "✅ Icons already present"
          elif [ -f "build_assets/app_icon.png" ]; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
            for size in 48 72 96 144 192; do
              case $size in
                48) density="mdpi" ;;
                72) density="hdpi" ;;
                96) density="xhdpi" ;;
                144) density="xxhdpi" ;;
                192) density="xxxhdpi" ;;
              esac
              mkdir -p app/src/main/res/mipmap-${density}
              convert build_assets/app_icon.png -resize ${size}x${size} app/src/main/res/mipmap-${density}/ic_launcher.png 2>/dev/null || true
            done
            echo "✅ Icons generated from custom icon"
          else
            echo "⚠️ No icons found"
          fi

      - name: Create build.gradle
        env:
          PKG: ${{ steps.params.outputs.package_name }}
        run: |
          if [ ! -f "app/build.gradle" ]; then
            echo "Creating build.gradle..."
            echo 'plugins {
    id "com.android.application"
}

android {
    namespace "'$PKG'"
    compileSdk 34

    defaultConfig {
        applicationId "'$PKG'"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.10.0"
}' > app/build.gradle
            touch app/proguard-rules.pro
            echo "✅ build.gradle created"
          else
            echo "Using existing build.gradle"
            sed -i "s/namespace \".*\"/namespace \"$PKG\"/" app/build.gradle
            sed -i "s/applicationId \".*\"/applicationId \"$PKG\"/" app/build.gradle
          fi

      - name: Create Gradle Files
        run: |
          if [ ! -f "settings.gradle" ]; then
            echo 'pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "MyApp"
include ":app"' > settings.gradle
          fi
          
          if [ ! -f "build.gradle" ]; then
            echo 'plugins {
    id "com.android.application" version "8.2.2" apply false
}' > build.gradle
          fi
          
          if [ ! -f "gradle.properties" ]; then
            echo 'org.gradle.jvmargs=-Xmx4096m
android.useAndroidX=true
android.enableJetifier=false' > gradle.properties
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Clean and Build
        run: |
          ./gradlew clean --no-daemon
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            ## APK Built from Repository Files
            
            **App:** ${{ steps.params.outputs.app_name }}
            **Package:** ${{ steps.params.outputs.package_name }}
            
            Download APK below.
          files: |
            app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
