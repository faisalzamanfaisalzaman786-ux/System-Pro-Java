name: Build Android APK (Dynamic Package Name, Gradle 8.5)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 1. پے لوڈ سے فائلیں (Java, XML, Manifest) جنریٹ کریں
      - name: Generate Files from Payload
        run: |
          echo '${{ toJson(github.event.client_payload.files) }}' > payload_files.json
          python3 << 'PY'
          import json, os
          with open('payload_files.json', 'r', encoding='utf-8') as f:
              files = json.load(f)
          for path, content in files.items():
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w', encoding='utf-8') as out:
                  out.write(content)
          print("All source files generated")
          PY

      # 2. پے لوڈ سے پیکج نیم حاصل کریں
      - name: Read package name from payload
        id: pkg
        run: |
          PKG="${{ github.event.client_payload.package_name }}"
          if [ -z "$PKG" ]; then
            PKG="com.systempro.app"
          fi
          echo "package_name=$PKG" >> $GITHUB_OUTPUT
          echo "Using package: $PKG"

      # 3. app/build.gradle میں namespace اور applicationId اپ ڈیٹ کریں
      - name: Update app/build.gradle with correct namespace
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          if [ -f app/build.gradle ]; then
            sed -i "s/namespace \".*\"/namespace \"${PKG}\"/" app/build.gradle
            sed -i "s/applicationId \".*\"/applicationId \"${PKG}\"/" app/build.gradle
            echo "Updated app/build.gradle with package: ${PKG}"
          else
            echo "WARNING: app/build.gradle not found, will use existing"
          fi

      # 4. آئیکن کو پے لوڈ سے ڈی کوڈ کریں
      - name: Process App Icon from Payload
        run: |
          ICON_B64="${{ github.event.client_payload.icon }}"
          if [ -n "$ICON_B64" ] && [ "$ICON_B64" != "" ]; then
            echo "$ICON_B64" | base64 -d > app_icon.png
            sudo apt-get update && sudo apt-get install -y imagemagick
            mkdir -p app/src/main/res/mipmap-hdpi
            mkdir -p app/src/main/res/mipmap-mdpi
            mkdir -p app/src/main/res/mipmap-xhdpi
            mkdir -p app/src/main/res/mipmap-xxhdpi
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            convert app_icon.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert app_icon.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert app_icon.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert app_icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert app_icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "Icon generated from payload"
          else
            echo "No icon in payload"
          fi

      # 5. AndroidManifest.xml میں پیکج نیم درست ہے (پے لوڈ سے آئی ہے)
      - name: Ensure Manifest has correct package (backup)
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          # اگر manifest میں پہلے سے صحیح پیکج نہ ہو تو درست کریں
          sed -i "s/package=\"[^\"]*\"/package=\"${PKG}\"/" app/src/main/AndroidManifest.xml

      # 6. Gradle Wrapper سیٹ کریں (Gradle 8.5)
      - name: Setup Gradle 8.5 Wrapper
        run: |
          if [ ! -f gradlew ]; then
            mkdir -p gradle/wrapper
            wget -q https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo '#!/bin/sh' > gradlew
            echo 'GRADLE_OPTS="-Dorg.gradle.appname=gradlew"' >> gradlew
            echo 'exec java $GRADLE_OPTS -classpath "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      # 7. APK بلڈ کریں
      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon

      # 8. APK اپ لوڈ کریں
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # 9. GitHub Release بنائیں
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          files: app/build/outputs/apk/debug/*.apk
