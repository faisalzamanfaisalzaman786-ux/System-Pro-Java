name: Build Android APK (Gradle 8.5 Locked)

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get package name from payload
        id: pkg
        run: |
          NEW_PKG="${{ github.event.client_payload.package_name }}"
          if [ -z "$NEW_PKG" ]; then
            NEW_PKG="com.systempro.app"
          fi
          echo "package_name=$NEW_PKG" >> $GITHUB_OUTPUT
          echo "Using package: $NEW_PKG"

      - name: Clean and create source directories
        run: |
          rm -rf app/src/main/java app/src/main/res
          PKG_PATH=$(echo "${{ steps.pkg.outputs.package_name }}" | tr '.' '/')
          mkdir -p "app/src/main/java/${PKG_PATH}"
          mkdir -p app/src/main/res/layout app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi

      - name: Create MainActivity.java
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          cat > "app/src/main/java/${PKG_PATH}/MainActivity.java" << 'JAVAEOF'
          package __PACKAGE__;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  TextView tv = findViewById(R.id.helloText);
                  tv.setText("CodeForge Pro - Gradle 8.5 Success!");
              }
          }
          JAVAEOF
          sed -i "s/__PACKAGE__/${PKG}/g" "app/src/main/java/${PKG_PATH}/MainActivity.java"

      - name: Create layout and string resources
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">
              <TextView
                  android:id="@+id/helloText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Hello from CodeForge"
                  android:textSize="28sp"
                  android:textColor="#00FFCC" />
          </LinearLayout>
          XMLEOF
          cat > app/src/main/res/values/strings.xml << 'STRXML'
          <resources>
              <string name="app_name">CodeForge Pro</string>
          </resources>
          STRXML

      - name: Create AndroidManifest.xml
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          cat > app/src/main/AndroidManifest.xml << MANIFEST
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="${PKG}">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

      - name: Create default app icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ -f build_assets/app_icon.png ]; then
            convert build_assets/app_icon.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
            convert -size 72x72 xc:#00FFCC app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert -size 48x48 xc:#00FFCC app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert -size 96x96 xc:#00FFCC app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert -size 144x144 xc:#00FFCC app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert -size 192x192 xc:#00FFCC app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Update app/build.gradle with correct namespace and applicationId
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          # Ensure app/build.gradle exists
          if [ ! -f app/build.gradle ]; then
            echo "Error: app/build.gradle not found. Please run setup first." && exit 1
          fi
          sed -i "s/namespace \".*\"/namespace \"${PKG}\"/" app/build.gradle
          sed -i "s/applicationId \".*\"/applicationId \"${PKG}\"/" app/build.gradle
          # Also ensure sourceSets point to the correct Java directory
          if ! grep -q "sourceSets" app/build.gradle; then
            echo '' >> app/build.gradle
            echo 'android {' >> app/build.gradle
            echo '    sourceSets {' >> app/build.gradle
            echo '        main {' >> app/build.gradle
            echo '            java.srcDirs = ["src/main/java"]' >> app/build.gradle
            echo '        }' >> app/build.gradle
            echo '    }' >> app/build.gradle
            echo '}' >> app/build.gradle
          fi

      - name: Create gradlew if missing
        run: |
          if [ ! -f gradlew ]; then
            echo '#!/bin/sh' > gradlew
            echo 'GRADLE_OPTS="-Dorg.gradle.appname=gradlew"' >> gradlew
            echo 'exec java $GRADLE_OPTS -classpath "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
            chmod +x gradlew
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add gradlew
            git diff --staged --quiet || git commit -m "Add gradlew script"
            git push
          else
            chmod +x gradlew
          fi

      - name: Verify Java source file exists
        run: |
          PKG_PATH=$(echo "${{ steps.pkg.outputs.package_name }}" | tr '.' '/')
          if [ ! -f "app/src/main/java/${PKG_PATH}/MainActivity.java" ]; then
            echo "ERROR: MainActivity.java not found at app/src/main/java/${PKG_PATH}/MainActivity.java"
            exit 1
          fi
          echo "Java source file found, proceeding to build."

      - name: Build APK
        run: |
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          files: app/build/outputs/apk/debug/*.apk
