name: Build Android APK (with Dynamic Package Name)

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # پوری پرانی پروجیکٹ صاف کریں
      - name: Clean previous build
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties gradlew gradle
          mkdir -p app/src/main/java/com/systempro/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi

      # Gradle Wrapper 8.5
      - name: Setup Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          wget -q https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo '#!/bin/sh' > gradlew
          echo 'GRADLE_OPTS="-Dorg.gradle.appname=gradlew"' >> gradlew
          echo 'exec java $GRADLE_OPTS -classpath "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
          chmod +x gradlew

      # 100% Pure Android App (No AppCompat, No Themes)
      - name: Create simple app without any theme
        run: |
          # MainActivity - Plain Activity
          cat > app/src/main/java/com/systempro/app/MainActivity.java << 'JAVAEOF'
          package com.systempro.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  TextView textView = findViewById(R.id.helloText);
                  textView.setText("CodeForge Pro is working fine!");
              }
          }
          JAVAEOF

          # activity_main.xml - simple layout
          cat > app/src/main/res/layout/activity_main.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">
              <TextView
                  android:id="@+id/helloText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Hello CodeForge Pro"
                  android:textSize="28sp"
                  android:textColor="#00FFCC" />
          </LinearLayout>
          XMLEOF

          # strings.xml
          cat > app/src/main/res/values/strings.xml << 'STRXML'
          <resources>
              <string name="app_name">CodeForge Pro</string>
          </resources>
          STRXML

          # AndroidManifest.xml - No theme, only icon and label
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.systempro.app">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

      # Gradle files (no AppCompat dependency)
      - name: Create Gradle files
        run: |
          echo 'include ":app"' > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:7.4.2" }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          cat > app/build.gradle << 'APPGRADLE'
          apply plugin: 'com.android.application'
          android {
              compileSdk 34
              namespace 'com.systempro.app'
              defaultConfig {
                  applicationId "com.systempro.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
          }
          // No dependencies - pure Android
          APPGRADLE

      # آئیکن بنائیں (اگر صارف نے اپ لوڈ کیا ہے تو وہ استعمال ہو گا)
      - name: Generate app icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ -f build_assets/app_icon.png ]; then
            convert build_assets/app_icon.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
            # Default green square icon
            convert -size 72x72 xc:#00FFCC app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert -size 48x48 xc:#00FFCC app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert -size 96x96 xc:#00FFCC app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert -size 144x144 xc:#00FFCC app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert -size 192x192 xc:#00FFCC app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      # پیکیج نیم تبدیل کریں (اگر ضرورت ہو)
      - name: Replace package name
        run: |
          NEW_PKG="${{ github.event.client_payload.package_name }}"
          if [ -z "$NEW_PKG" ]; then
            NEW_PKG="com.systempro.app"
          fi
          echo "Setting package to: $NEW_PKG"
          sed -i "s/package=\"[^\"]*\"/package=\"$NEW_PKG\"/" app/src/main/AndroidManifest.xml
          sed -i "s/package .*;/package $NEW_PKG;/" app/src/main/java/com/systempro/app/MainActivity.java
          sed -i "s/applicationId \".*\"/applicationId \"$NEW_PKG\"/" app/build.gradle
          sed -i "s/namespace \".*\"/namespace \"$NEW_PKG\"/" app/build.gradle

      # APK بلڈ کریں
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # APK اپ لوڈ کریں
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # Release بنائیں
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          files: app/build/outputs/apk/debug/*.apk
