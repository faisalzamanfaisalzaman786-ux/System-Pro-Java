name: Build Android APK (with Dynamic Package Name)

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Replace Package Name in All Files
        run: |
          NEW_PKG="${{ github.event.client_payload.package_name }}"
          echo "Using Package Name: $NEW_PKG"
          if [ -z "$NEW_PKG" ]; then
            NEW_PKG="com.systempro.app"
          fi
          # Update manifest package
          sed -i "s/package=\"[^\"]*\"/package=\"$NEW_PKG\"/" app/src/main/AndroidManifest.xml
          # Update Java files
          find app/src/main/java -name "*.java" -exec sed -i "s/package .*;/package $NEW_PKG;/g" {} \;
          # Update app/build.gradle
          if [ -f app/build.gradle ]; then
            sed -i "s/applicationId \".*\"/applicationId \"$NEW_PKG\"/" app/build.gradle
            sed -i "s/namespace \".*\"/namespace \"$NEW_PKG\"/" app/build.gradle
          fi

      - name: Setup Gradle Wrapper (locked to 8.5)
        run: |
          mkdir -p gradle/wrapper
          wget -q https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo '#!/bin/sh' > gradlew
          echo 'GRADLE_OPTS="-Dorg.gradle.appname=gradlew"' >> gradlew
          echo 'exec java $GRADLE_OPTS -classpath "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
          chmod +x gradlew

      - name: Create complete Android source files
        run: |
          # Create directories
          mkdir -p app/src/main/java/com/systempro/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          # Create MainActivity.java
          cat > app/src/main/java/com/systempro/app/MainActivity.java << 'JAVAEOF'
          package com.systempro.app;
          import android.os.Bundle;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  TextView tv = findViewById(R.id.textView);
                  tv.setText("CodeForge Pro Build Success!");
              }
          }
          JAVAEOF
          # Create activity_main.xml
          cat > app/src/main/res/layout/activity_main.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="16dp">
              <TextView
                  android:id="@+id/textView"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="CodeForge Pro"
                  android:textSize="24sp"
                  android:textColor="#00FFCC" />
          </LinearLayout>
          XMLEOF
          # Create strings.xml
          cat > app/src/main/res/values/strings.xml << 'STRXML'
          <resources>
              <string name="app_name">CodeForge Pro</string>
          </resources>
          STRXML
          # Create AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.systempro.app">
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

      - name: Create Gradle project files
        run: |
          # settings.gradle
          echo 'include ":app"' > settings.gradle
          # root build.gradle
          echo 'buildscript {' > build.gradle
          echo '    repositories { google(); mavenCentral() }' >> build.gradle
          echo '    dependencies { classpath "com.android.tools.build:gradle:7.4.2" }' >> build.gradle
          echo '}' >> build.gradle
          echo 'allprojects { repositories { google(); mavenCentral() } }' >> build.gradle
          # gradle.properties
          echo 'android.suppressUnsupportedCompileSdk=34' > gradle.properties
          # app/build.gradle
          cat > app/build.gradle << 'APPGRADLE'
          apply plugin: 'com.android.application'
          android {
              compileSdk 34
              namespace 'com.systempro.app'
              defaultConfig {
                  applicationId "com.systempro.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          APPGRADLE

      - name: Generate App Icon (if present)
        if: hashFiles('build_assets/app_icon.png') != ''
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          convert build_assets/app_icon.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert build_assets/app_icon.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert build_assets/app_icon.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert build_assets/app_icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert build_assets/app_icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release and Attach APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          files: app/build/outputs/apk/debug/*.apk
