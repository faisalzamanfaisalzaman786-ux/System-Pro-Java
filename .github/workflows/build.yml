name: CodeForge Pro Builder

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Clean and Initialize Android Structure
      run: |
        rm -rf app settings.gradle build.gradle
        mkdir -p app/src/main/java
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/mipmap-xxxhdpi

    - name: Process Package Structure & Move Java Files
      run: |
        PKG_NAME="${{ github.event.client_payload.package_name }}"
        DIR_PATH=$(echo "$PKG_NAME" | tr '.' '/')
        TARGET_DIR="app/src/main/java/$DIR_PATH"
        mkdir -p "$TARGET_DIR"
        
        if [ -d "build_assets" ]; then
          find build_assets/ -name "*.java" -exec cp {} "$TARGET_DIR/" \;
        fi

    - name: Move Android Resources & Manifest
      run: |
        if [ -f "build_assets/activity_main.xml" ]; then
          cp build_assets/activity_main.xml app/src/main/res/layout/
        fi
        if [ -f "build_assets/strings.xml" ]; then
          cp build_assets/strings.xml app/src/main/res/values/
        fi
        if [ -f "build_assets/colors.xml" ]; then
          cp build_assets/colors.xml app/src/main/res/values/
        fi
        if [ -f "build_assets/themes.xml" ]; then
          cp build_assets/themes.xml app/src/main/res/values/
        fi
        if [ -f "build_assets/AndroidManifest.xml" ]; then
          cp build_assets/AndroidManifest.xml app/src/main/
        fi

    - name: Decode and Inject Custom App Icon
      run: |
        ICON_B64="${{ github.event.client_payload.icon }}"
        if [ ! -z "$ICON_B64" ]; then
          echo "$ICON_B64" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        elif [ -f "build_assets/app_icon.png" ]; then
          cp build_assets/app_icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        fi

    - name: Generate Dynamic Build Configuration
      run: |
        PKG_NAME="${{ github.event.client_payload.package_name }}"
        APP_NAME="${{ github.event.client_payload.app_name }}"
        
        cat <<EOF > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "$APP_NAME"
        include ':app'
        EOF

        cat <<EOF > build.gradle
        plugins {
            id 'com.android.application' version '8.3.0' apply false
            id 'com.android.library' version '8.3.0' apply false
        }
        EOF

        cat <<EOF > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace "$PKG_NAME"
            compileSdk 34

            defaultConfig {
                applicationId "$PKG_NAME"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
                testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
            }

            buildTypes {
                release {
                    minifyEnabled false
                    shrinkResources false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                    signingConfig signingConfigs.debug
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

    - name: Setup Wrapper and Build Project
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace --full-stacktrace
        ./gradlew bundleRelease --stacktrace --full-stacktrace

    - name: Clear Prior Releases
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete latest-release --yes || true
        git push --delete origin latest-release || true

    - name: Deploy Production Artifacts
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest-release
        name: "Latest Production Build"
        draft: false
        prerelease: false
        files: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/bundle/release/app-release.aab
      env:
        GITHUB_TOKEN: ${{ github.token }}
