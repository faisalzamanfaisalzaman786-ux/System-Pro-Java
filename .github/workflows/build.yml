name: Build Android APK (Professional Clean Slate)

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get dynamic package name
        id: pkg
        run: |
          NEW_PKG="${{ github.event.client_payload.package_name }}"
          if [ -z "$NEW_PKG" ]; then
            NEW_PKG="com.systempro.app"
          fi
          echo "package_name=$NEW_PKG" >> $GITHUB_OUTPUT

      - name: Create project structure
        run: |
          PKG_PATH=$(echo "${{ steps.pkg.outputs.package_name }}" | tr '.' '/')
          mkdir -p "app/src/main/java/${PKG_PATH}"
          mkdir -p app/src/main/res/{layout,values,drawable}
          mkdir -p gradle/wrapper

      - name: Create MainActivity.java
        run: |
          cat > "app/src/main/java/$(echo ${{ steps.pkg.outputs.package_name }} | tr '.' '/')/MainActivity.java" <<JAVA
          package ${{ steps.pkg.outputs.package_name }};
          import androidx.appcompat.app.AppCompatActivity;
          import android.os.Bundle;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
              }
          }
          JAVA

      - name: Create resource files
        run: |
          cat > app/src/main/res/layout/activity_main.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
          </RelativeLayout>
          XML
          
          cat > app/src/main/res/values/strings.xml <<STR
          <resources>
              <string name="app_name">SystemPro App</string>
          </resources>
          STR

      - name: Create Gradle configuration
        run: |
          # Root build.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # settings.gradle
          cat > settings.gradle << 'EOF'
          rootProject.name = "SystemProProject"
          include ':app'
          EOF

          # app/build.gradle
          cat > app/build.gradle << EOF
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace '${{ steps.pkg.outputs.package_name }}'
              defaultConfig {
                  applicationId '${{ steps.pkg.outputs.package_name }}'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # Gradle Wrapper
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
