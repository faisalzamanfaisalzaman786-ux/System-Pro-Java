name: CodeForge Pro Builder

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    - name: Clean build_assets and Recreate Structure
      run: |
        # Remove old files
        rm -rf build_assets app settings.gradle build.gradle gradle.properties gradle wrapper 2>/dev/null || true
        
        # Create fresh directories
        mkdir -p app/src/main/java
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/mipmap-mdpi
        mkdir -p app/src/main/res/mipmap-xhdpi
        mkdir -p app/src/main/res/mipmap-xxhdpi
        mkdir -p app/src/main/res/mipmap-xxxhdpi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Process Java Files
      run: |
        PKG_NAME="${{ github.event.client_payload.package_name }}"
        if [ -z "$PKG_NAME" ]; then PKG_NAME="com.example.app"; fi
        DIR_PATH=$(echo "$PKG_NAME" | tr '.' '/')
        TARGET_DIR="app/src/main/java/$DIR_PATH"
        mkdir -p "$TARGET_DIR"
        
        # Copy only if build_assets exists
        if [ -d "build_assets" ]; then
          find build_assets/ -maxdepth 1 -name "*.java" -exec cp {} "$TARGET_DIR/" \; 2>/dev/null || true
        fi
        
        # Create default MainActivity if no Java files
        if [ -z "$(ls -A "$TARGET_DIR" 2>/dev/null)" ]; then
          cat > "$TARGET_DIR/MainActivity.java" << 'JAVAEOF'
package PKG_PLACEHOLDER;

import android.os.Bundle;
import android.widget.TextView;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);
        TextView tv = findViewById(R.id.textView);
        tv.setText("Hello World!");
    }
}
JAVAEOF
          sed -i "s/PKG_PLACEHOLDER/$PKG_NAME/g" "$TARGET_DIR/MainActivity.java"
        fi

    - name: Setup Layout (activity_main.xml)
      run: |
        if [ -f "build_assets/activity_main.xml" ]; then
          cp build_assets/activity_main.xml app/src/main/res/layout/
        else
          cat > app/src/main/res/layout/activity_main.xml << 'XMLEOF'
<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:orientation="vertical"
    android:gravity="center"
    android:padding="24dp">
    <TextView
        android:id="@+id/textView"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="Hello World!"
        android:textSize="32sp"
        android:textStyle="bold"
        android:textColor="#6200EE" />
</LinearLayout>
XMLEOF
        fi

    - name: Setup Colors
      run: |
        cat > app/src/main/res/values/colors.xml << 'XMLEOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="colorPrimary">#6200EE</color>
    <color name="colorPrimaryDark">#3700B3</color>
    <color name="colorAccent">#03DAC6</color>
</resources>
XMLEOF

    - name: Setup Strings
      run: |
        APP_NAME="${{ github.event.client_payload.app_name }}"
        if [ -z "$APP_NAME" ]; then APP_NAME="Hello World"; fi
        cat > app/src/main/res/values/strings.xml << XMLEOF
<resources>
    <string name="app_name">$APP_NAME</string>
</resources>
XMLEOF

    - name: Setup Themes
      run: |
        cat > app/src/main/res/values/themes.xml << 'XMLEOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
        <item name="colorPrimary">@color/colorPrimary</item>
        <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
        <item name="colorAccent">@color/colorAccent</item>
    </style>
</resources>
XMLEOF

    - name: Setup AndroidManifest
      run: |
        PKG_NAME="${{ github.event.client_payload.package_name }}"
        if [ -z "$PKG_NAME" ]; then PKG_NAME="com.example.app"; fi
        APP_NAME="${{ github.event.client_payload.app_name }}"
        if [ -z "$APP_NAME" ]; then APP_NAME="Hello World"; fi
        
        if [ -f "build_assets/AndroidManifest.xml" ]; then
          sed -i 's/ android:roundIcon="[^"]*"//g' build_assets/AndroidManifest.xml
          cp build_assets/AndroidManifest.xml app/src/main/
        else
          cat > app/src/main/AndroidManifest.xml << XMLEOF
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="$PKG_NAME">
    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="$APP_NAME"
        android:theme="@style/AppTheme">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
XMLEOF
        fi

    - name: Handle App Icon
      run: |
        ICON_B64="${{ github.event.client_payload.icon }}"
        
        if [ ! -z "$ICON_B64" ]; then
          echo "$ICON_B64" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png 2>/dev/null || true
        fi

    - name: Generate Gradle Files
      run: |
        PKG_NAME="${{ github.event.client_payload.package_name }}"
        if [ -z "$PKG_NAME" ]; then PKG_NAME="com.example.app"; fi
        
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
        
        cat > settings.gradle << 'GRADLE'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "MyApp"
include ':app'
GRADLE
        
        cat > build.gradle << 'GRADLE'
plugins {
    id 'com.android.application' version '8.1.4' apply false
}
GRADLE
        
        cat > app/build.gradle << GRADLE
plugins {
    id 'com.android.application'
}

android {
    namespace "$PKG_NAME"
    compileSdk 34

    defaultConfig {
        applicationId "$PKG_NAME"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
GRADLE

    - name: Setup Gradle Wrapper and Build
      run: |
        mkdir -p gradle/wrapper
        echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.0-bin.zip" > gradle/wrapper/gradle-wrapper.properties
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
        echo '#!/bin/sh' > gradlew
        echo 'exec java -cp "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Deploy Artifacts
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest-release
        name: "Latest Build"
        draft: false
        prerelease: false
        files: |
          app/build/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ github.token }}
