name: Build Android APK (Clean Recreate Package Dirs)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Read package name from payload
        id: pkg
        run: |
          PKG="${{ github.event.client_payload.package_name }}"
          if [ -z "$PKG" ]; then
            PKG="com.systempro.app"
          fi
          echo "package_name=$PKG" >> $GITHUB_OUTPUT
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          echo "package_path=$PKG_PATH" >> $GITHUB_OUTPUT

      # 🟢 نئی ڈائرکٹری صاف اور نئے پیکج نیم کے مطابق بنائیں
      - name: Clean and recreate Java source directory
        run: |
          rm -rf app/src/main/java
          PKG_PATH="${{ steps.pkg.outputs.package_path }}"
          mkdir -p "app/src/main/java/${PKG_PATH}"
          echo "Created fresh directory: app/src/main/java/${PKG_PATH}"

      - name: Generate Files from Payload (with package correction)
        run: |
          echo '${{ toJson(github.event.client_payload.files) }}' > payload_files.json
          NEW_PKG="${{ steps.pkg.outputs.package_name }}"
          python3 << PY
import json, os, re
with open('payload_files.json', 'r', encoding='utf-8') as f:
    files = json.load(f)

for orig_path, content in files.items():
    # اگر فائل Java ہے تو پیکج لائن تبدیل کریں
    if orig_path.endswith('.java'):
        # پیکج لائن بدلیں
        content = re.sub(r'^package .*;', f'package {NEW_PKG};', content, flags=re.MULTILINE)
        # نئے پاتھ میں پیکج نیم کے مطابق ڈائریکٹری بنائیں
        java_file_name = os.path.basename(orig_path)
        new_path = f"app/src/main/java/{NEW_PKG.replace('.', '/')}/{java_file_name}"
    else:
        new_path = orig_path  # باقی فائلیں ویسے ہی رکھیں (manifest, xml, etc.)
    
    os.makedirs(os.path.dirname(new_path), exist_ok=True)
    with open(new_path, 'w', encoding='utf-8') as out:
        out.write(content)
    print(f"Written: {new_path}")

# خاص طور پر AndroidManifest.xml کا package ایٹریبیوٹ بھی اپ ڈیٹ کریں
manifest_path = "app/src/main/AndroidManifest.xml"
if os.path.exists(manifest_path):
    with open(manifest_path, 'r', encoding='utf-8') as mf:
        manifest_content = mf.read()
    manifest_content = re.sub(r'package="[^"]*"', f'package="{NEW_PKG}"', manifest_content)
    with open(manifest_path, 'w', encoding='utf-8') as mf:
        mf.write(manifest_content)
    print("AndroidManifest.xml package updated")
PY

      - name: Update app/build.gradle namespace and applicationId
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          if [ -f app/build.gradle ]; then
            sed -i "s/namespace \".*\"/namespace \"${PKG}\"/" app/build.gradle
            sed -i "s/applicationId \".*\"/applicationId \"${PKG}\"/" app/build.gradle
          fi

      - name: Process App Icon from Payload
        run: |
          ICON_B64="${{ github.event.client_payload.icon }}"
          if [ -n "$ICON_B64" ] && [ "$ICON_B64" != "" ]; then
            echo "$ICON_B64" | base64 -d > app_icon.png
            sudo apt-get update && sudo apt-get install -y imagemagick
            mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
            for d in 72 48 96 144 192; do
              size="${d}x${d}"
              density=""
              case $d in
                72) density="hdpi" ;;
                48) density="mdpi" ;;
                96) density="xhdpi" ;;
                144) density="xxhdpi" ;;
                192) density="xxxhdpi" ;;
              esac
              convert app_icon.png -resize $size "app/src/main/res/mipmap-${density}/ic_launcher.png"
            done
            echo "Icon generated"
          fi

      - name: Setup Gradle 8.5 Wrapper
        run: |
          if [ ! -f gradlew ]; then
            mkdir -p gradle/wrapper
            wget -q https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo '#!/bin/sh' > gradlew
            echo 'GRADLE_OPTS="-Dorg.gradle.appname=gradlew"' >> gradlew
            echo 'exec java $GRADLE_OPTS -classpath "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          files: app/build/outputs/apk/debug/*.apk
