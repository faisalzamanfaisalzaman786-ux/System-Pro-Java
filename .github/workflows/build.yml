name: Build APK Only

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.counter.app'
      app_name:
        description: 'App Name'
        required: false
        default: 'Counter_1'
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Skip setup-android - use pre-installed SDK
      - name: Set ANDROID_HOME
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Clean old Java files
        run: |
          rm -rf app/src/main/java/com/example 2>/dev/null || true
          rm -rf app/src/main/java/com/systempro 2>/dev/null || true
          echo "Cleaned old files"

      - name: Setup project from build_assets
        env:
          PKG: ${{ github.event.inputs.package_name }}
          APP_NAME: ${{ github.event.inputs.app_name }}
        run: |
          PKG="${PKG:-com.counter.app}"
          APP_NAME="${APP_NAME:-Counter_1}"
          PKG_PATH=$(echo $PKG | tr '.' '/')
          
          mkdir -p app/src/main/java/$PKG_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          
          if [ -f "build_assets/MainActivity.java" ]; then
            sed "s/package .*;/package $PKG;/" build_assets/MainActivity.java > app/src/main/java/$PKG_PATH/MainActivity.java
            echo "✅ MainActivity.java copied"
          fi
          
          if [ -f "build_assets/activity_main.xml" ]; then
            cp build_assets/activity_main.xml app/src/main/res/layout/activity_main.xml
            echo "✅ activity_main.xml copied"
          fi
          
          if [ -f "build_assets/AndroidManifest.xml" ]; then
            cp build_assets/AndroidManifest.xml app/src/main/AndroidManifest.xml
            echo "✅ AndroidManifest.xml copied"
          fi
          
          # Default resources
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#6200EE</color>
              <color name="colorPrimaryDark">#3700B3</color>
              <color name="colorAccent">#03DAC6</color>
          </resources>
          EOF
          
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          EOF
          
          cat > app/src/main/res/values/strings.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">$APP_NAME</string>
          </resources>
          EOF
          
          if [ -f "build_assets/app_icon.png" ]; then
            cp build_assets/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            echo "✅ Icon copied"
          fi

      - name: Create build.gradle
        env:
          PKG: ${{ github.event.inputs.package_name }}
        run: |
          PKG="${PKG:-com.counter.app}"
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2'
          }

          android {
              namespace "PKG_PLACEHOLDER"
              compileSdk 34

              defaultConfig {
                  applicationId "PKG_PLACEHOLDER"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
          }
          EOF
          sed -i "s/PKG_PLACEHOLDER/$PKG/g" app/build.gradle
          touch app/proguard-rules.pro

      - name: Create Gradle files
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CounterApp"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          android.enableJetifier=false
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: counter-app
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: counter-${{ github.run_number }}
          name: Counter App
          body: |
            **App:** ${{ github.event.inputs.app_name }}
            **Package:** ${{ github.event.inputs.package_name }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
