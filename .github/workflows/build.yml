name: Build Android APK + AAB (Release Only)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write
  actions: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get Package Name
        id: pkg
        run: |
          PKG="${{ github.event.client_payload.package_name }}"
          if [ -z "$PKG" ]; then
            PKG="com.systempro.app"
          fi
          PKG=$(echo "$PKG" | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "package_name=$PKG" >> $GITHUB_OUTPUT
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          echo "package_path=$PKG_PATH" >> $GITHUB_OUTPUT

      - name: Get App Name
        id: app
        run: |
          APP_NAME="${{ github.event.client_payload.app_name }}"
          if [ -z "$APP_NAME" ]; then
            APP_NAME="MyApp"
          fi
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

      - name: Create Project Directories
        run: |
          rm -rf app
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/assets

      - name: Decode Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "WARNING: No keystore found, creating debug keystore"
            keytool -genkey -v -keystore keystore.jks -alias release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown" -storepass android -keypass android
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=release" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          else
            KEYSTORE_ABS="$GITHUB_WORKSPACE/keystore.jks"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 -d > "$KEYSTORE_ABS"
            echo "KEYSTORE_PATH=$KEYSTORE_ABS" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Generate Files with Smart Fallbacks
        run: |
          cat > payload_files.json << 'EOF'
          ${{ toJson(github.event.client_payload.files) }}
          EOF

          export NEW_PKG="${{ steps.pkg.outputs.package_name }}"
          export APP_NAME="${{ steps.app.outputs.app_name }}"

          cat > generate.py << 'PY'
import json
import os
import re
import sys
import traceback

def main():
    try:
        pkg = os.environ.get("NEW_PKG", "com.systempro.app")
        app_name = os.environ.get("APP_NAME", "MyApp")
        pkg_path = pkg.replace(".", "/")

        files = {}
        payload_file = "payload_files.json"
        if os.path.exists(payload_file):
            with open(payload_file, "r") as f:
                content = f.read().strip()
                if content:
                    files = json.loads(content)

        existing = {
            "java": False,
            "layout": False,
            "manifest": False,
            "strings": False,
            "colors": False,
            "themes": False
        }

        for path, content in files.items():
            clean_path = path.strip("/")
            if clean_path.endswith(".java"):
                existing["java"] = True
                content = re.sub(r'^package .*?;', f'package {pkg};', content, flags=re.MULTILINE)
                if not re.search(r'^package ', content, re.MULTILINE):
                    content = f'package {pkg};\n\n{content}'
                filename = os.path.basename(clean_path)
                new_path = f"app/src/main/java/{pkg_path}/{filename}"
                os.makedirs(os.path.dirname(new_path), exist_ok=True)
                with open(new_path, "w", encoding="utf-8") as out:
                    out.write(content)

            elif clean_path.endswith(".xml"):
                if "AndroidManifest.xml" in clean_path:
                    existing["manifest"] = True
                    new_path = "app/src/main/AndroidManifest.xml"
                    content = re.sub(r'\s+package="[^"]*"', '', content)
                    content = re.sub(r'android:roundIcon="[^"]*"', '', content)
                    os.makedirs(os.path.dirname(new_path), exist_ok=True)
                    with open(new_path, "w", encoding="utf-8") as out:
                        out.write(content)
                elif "layout" in clean_path:
                    existing["layout"] = True
                    filename = os.path.basename(clean_path)
                    new_path = f"app/src/main/res/layout/{filename}"
                    os.makedirs(os.path.dirname(new_path), exist_ok=True)
                    with open(new_path, "w", encoding="utf-8") as out:
                        out.write(content)
                elif "values/strings.xml" in clean_path:
                    existing["strings"] = True
                    new_path = "app/src/main/res/values/strings.xml"
                    os.makedirs(os.path.dirname(new_path), exist_ok=True)
                    with open(new_path, "w", encoding="utf-8") as out:
                        out.write(content)
                elif "values/colors.xml" in clean_path:
                    existing["colors"] = True
                    new_path = "app/src/main/res/values/colors.xml"
                    os.makedirs(os.path.dirname(new_path), exist_ok=True)
                    with open(new_path, "w", encoding="utf-8") as out:
                        out.write(content)
                elif "values/themes.xml" in clean_path or "values/styles.xml" in clean_path:
                    existing["themes"] = True
                    filename = os.path.basename(clean_path)
                    new_path = f"app/src/main/res/values/{filename}"
                    os.makedirs(os.path.dirname(new_path), exist_ok=True)
                    with open(new_path, "w", encoding="utf-8") as out:
                        out.write(content)

        strings_path = "app/src/main/res/values/strings.xml"
        if not existing["strings"]:
            os.makedirs(os.path.dirname(strings_path), exist_ok=True)
            with open(strings_path, "w", encoding="utf-8") as f:
                f.write(f'''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">{app_name}</string>
</resources>''')
        else:
            with open(strings_path, "r", encoding="utf-8") as f:
                content = f.read()
            if 'name="app_name"' not in content:
                content = content.replace('</resources>', f'    <string name="app_name">{app_name}</string>\n</resources>')
                with open(strings_path, "w", encoding="utf-8") as f:
                    f.write(content)

        colors_path = "app/src/main/res/values/colors.xml"
        default_colors = {
            "colorPrimary": "#6200EE",
            "colorPrimaryDark": "#3700B3",
            "colorAccent": "#03DAC5",
            "background": "#FFFFFF",
            "titleColor": "#000000",
            "textColor": "#333333",
            "hintColor": "#999999",
            "white": "#FFFFFF",
            "black": "#000000"
        }
        if not existing["colors"]:
            os.makedirs(os.path.dirname(colors_path), exist_ok=True)
            with open(colors_path, "w", encoding="utf-8") as f:
                f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
                for name, value in default_colors.items():
                    f.write(f'    <color name="{name}">{value}</color>\n')
                f.write('</resources>')

        themes_path = "app/src/main/res/values/themes.xml"
        if not existing["themes"]:
            os.makedirs(os.path.dirname(themes_path), exist_ok=True)
            with open(themes_path, "w", encoding="utf-8") as f:
                f.write('''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
        <item name="colorPrimary">@color/colorPrimary</item>
        <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
        <item name="colorAccent">@color/colorAccent</item>
    </style>
</resources>''')

        if not existing["layout"]:
            layout_path = "app/src/main/res/layout/activity_main.xml"
            os.makedirs(os.path.dirname(layout_path), exist_ok=True)
            with open(layout_path, "w", encoding="utf-8") as f:
                f.write('''<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:orientation="vertical"
    android:gravity="center"
    android:padding="16dp">
    <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="Hello World"
        android:textSize="24sp"
        android:textColor="@color/titleColor"/>
</LinearLayout>''')

        if not existing["java"]:
            java_dir = f"app/src/main/java/{pkg_path}"
            os.makedirs(java_dir, exist_ok=True)
            java_path = f"{java_dir}/MainActivity.java"
            with open(java_path, "w", encoding="utf-8") as f:
                f.write(f'''package {pkg};

import android.os.Bundle;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {{
    @Override
    protected void onCreate(Bundle savedInstanceState) {{
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);
    }}
}}
''')

        manifest_path = "app/src/main/AndroidManifest.xml"
        if not existing["manifest"]:
            with open(manifest_path, "w", encoding="utf-8") as f:
                f.write(f'''<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET"/>
    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="@string/app_name"
        android:theme="@style/AppTheme"
        android:supportsRtl="true">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
    </application>
</manifest>''')
        else:
            with open(manifest_path, "r", encoding="utf-8") as f:
                content = f.read()
            if 'android:label="' in content and '@string' not in content:
                content = re.sub(r'android:label="[^"]*"', 'android:label="@string/app_name"', content)
            if 'android:icon="' not in content:
                content = content.replace('<application', '<application android:icon="@mipmap/ic_launcher"')
            with open(manifest_path, "w", encoding="utf-8") as f:
                f.write(content)

        print("✅ Project generation completed successfully")

    except Exception as e:
        print(f"❌ Error: {e}")
        traceback.print_exc()
        sys.exit(1)

if __name__ == "__main__":
    main()
PY

          python3 generate.py

      - name: Generate App Icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true
          
          for size in 48 72 96 144 192; do
            case $size in
              48) density="mdpi" ;;
              72) density="hdpi" ;;
              96) density="xhdpi" ;;
              144) density="xxhdpi" ;;
              192) density="xxxhdpi" ;;
            esac
            convert -size ${size}x${size} xc:#6200EE -gravity center \
              -font Helvetica -pointsize $((size/3)) -fill white -annotate 0 "A" \
              app/src/main/res/mipmap-${density}/ic_launcher.png 2>/dev/null || true
            cp app/src/main/res/mipmap-${density}/ic_launcher.png app/src/main/res/mipmap-${density}/ic_launcher_round.png 2>/dev/null || true
          done
          echo "✅ Icons generated"

      - name: Create build.gradle
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          
          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "${PKG}"
              compileSdk 34

              defaultConfig {
                  applicationId "${PKG}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  multiDexEnabled true
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH") ?: "none")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }

              buildFeatures {
                  buildConfig true
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          EOF
          
          cat > app/proguard-rules.pro << 'EOF'
          -keep class * extends androidx.appcompat.app.AppCompatActivity
          -keepattributes Signature
          EOF
          
          echo "✅ build.gradle created"

      - name: Create Gradle Settings
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AppBuilder"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          android.enableJetifier=false
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Clean Project
        run: ./gradlew clean

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-release
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
