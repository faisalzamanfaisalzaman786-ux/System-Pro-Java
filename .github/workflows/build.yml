name: Build APK from build_assets

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.example.app'
      app_name:
        description: 'App Name'
        required: false
        default: 'MyApp'
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get Parameters
        id: params
        run: |
          PKG="${{ github.event.client_payload.package_name }}"
          if [ -z "$PKG" ] || [ "$PKG" = "null" ]; then
            PKG="${{ github.event.inputs.package_name }}"
          fi
          if [ -z "$PKG" ] || [ "$PKG" = "null" ]; then
            PKG="com.example.app"
          fi
          echo "name=$PKG" >> $GITHUB_OUTPUT
          echo "path=$(echo $PKG | tr '.' '/')" >> $GITHUB_OUTPUT
          
          APP="${{ github.event.client_payload.app_name }}"
          if [ -z "$APP" ] || [ "$APP" = "null" ]; then
            APP="${{ github.event.inputs.app_name }}"
          fi
          if [ -z "$APP" ] || [ "$APP" = "null" ]; then
            APP="MyApp"
          fi
          echo "app_name=$APP" >> $GITHUB_OUTPUT

      - name: Create Project Structure
        env:
          PKG_PATH: ${{ steps.params.outputs.path }}
        run: |
          rm -rf app
          mkdir -p app/src/main/java/$PKG_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

      - name: Move Files from build_assets to Correct Location
        env:
          PKG: ${{ steps.params.outputs.name }}
          PKG_PATH: ${{ steps.params.outputs.path }}
          APP_NAME: ${{ steps.params.outputs.app_name }}
        run: |
          echo "=== Moving files from build_assets ==="
          
          # Check if build_assets directory exists
          if [ ! -d "build_assets" ]; then
            echo "⚠️ build_assets directory not found!"
            exit 1
          fi
          
          # Move and process MainActivity.java
          if [ -f "build_assets/MainActivity.java" ]; then
            echo "Moving MainActivity.java"
            # Fix package name
            sed "s/package .*;/package $PKG;/" build_assets/MainActivity.java > app/src/main/java/$PKG_PATH/MainActivity.java
            echo "✅ MainActivity.java moved and package fixed"
          else
            echo "❌ MainActivity.java not found in build_assets"
            exit 1
          fi
          
          # Move activity_main.xml
          if [ -f "build_assets/activity_main.xml" ]; then
            echo "Moving activity_main.xml"
            cp build_assets/activity_main.xml app/src/main/res/layout/activity_main.xml
            echo "✅ activity_main.xml moved"
          else
            echo "❌ activity_main.xml not found in build_assets"
            exit 1
          fi
          
          # Move AndroidManifest.xml
          if [ -f "build_assets/AndroidManifest.xml" ]; then
            echo "Moving AndroidManifest.xml"
            # Remove package attribute to avoid conflict
            sed -i 's/package="[^"]*"//g' build_assets/AndroidManifest.xml
            # Update app name
            sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/" build_assets/AndroidManifest.xml
            cp build_assets/AndroidManifest.xml app/src/main/AndroidManifest.xml
            echo "✅ AndroidManifest.xml moved"
          else
            echo "❌ AndroidManifest.xml not found in build_assets"
            exit 1
          fi
          
          # Move strings.xml (optional)
          if [ -f "build_assets/strings.xml" ]; then
            echo "Moving strings.xml"
            sed -i "s/<string name=\"app_name\">.*</<string name=\"app_name\">$APP_NAME</" build_assets/strings.xml
            cp build_assets/strings.xml app/src/main/res/values/strings.xml
            echo "✅ strings.xml moved"
          else
            # Create default strings.xml
            cat > app/src/main/res/values/strings.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">$APP_NAME</string>
          </resources>
          EOF
            echo "✅ Default strings.xml created"
          fi
          
          # Move colors.xml (optional)
          if [ -f "build_assets/colors.xml" ]; then
            echo "Moving colors.xml"
            cp build_assets/colors.xml app/src/main/res/values/colors.xml
            echo "✅ colors.xml moved"
          else
            # Create default colors.xml
            cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#6200EE</color>
              <color name="colorPrimaryDark">#3700B3</color>
              <color name="colorAccent">#03DAC6</color>
          </resources>
          EOF
            echo "✅ Default colors.xml created"
          fi
          
          # Move themes.xml (optional)
          if [ -f "build_assets/themes.xml" ]; then
            echo "Moving themes.xml"
            cp build_assets/themes.xml app/src/main/res/values/themes.xml
            echo "✅ themes.xml moved"
          else
            # Create default themes.xml
            cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          EOF
            echo "✅ Default themes.xml created"
          fi
          
          # Process Icon
          if [ -f "build_assets/app_icon.png" ]; then
            echo "Processing custom icon"
            sudo apt-get update
            sudo apt-get install -y imagemagick
            convert build_assets/app_icon.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-xhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            echo "✅ Custom icon applied"
          fi
          
          echo "=== Files moved successfully ==="

      - name: Verify Moved Files
        run: |
          echo "=== Verification ==="
          echo "Package: ${{ steps.params.outputs.name }}"
          echo "App Name: ${{ steps.params.outputs.app_name }}"
          echo ""
          echo "Java files:"
          find app/src/main/java -name "*.java" -type f
          echo ""
          echo "Layout files:"
          find app/src/main/res/layout -name "*.xml" -type f
          echo ""
          echo "Manifest:"
          cat app/src/main/AndroidManifest.xml

      - name: Create build.gradle
        env:
          PKG: ${{ steps.params.outputs.name }}
        run: |
          cat > app/build.gradle << GRADLE_EOF
          plugins {
              id 'com.android.application' version '8.2.2'
          }

          android {
              namespace "$PKG"
              compileSdk 34

              defaultConfig {
                  applicationId "$PKG"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          GRADLE_EOF
          touch app/proguard-rules.pro

      - name: Create Gradle Files
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "App"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          android.enableJetifier=false
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            **App:** ${{ steps.params.outputs.app_name }}
            **Package:** ${{ steps.params.outputs.name }}
            **Build:** Successful
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
