name: Build Android APK (Safe Mode – Never Crash)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Get payload variables
        id: vars
        run: |
          PKG="${{ github.event.client_payload.package_name }}"
          APP_NAME="${{ github.event.client_payload.app_name }}"
          if [ -z "$PKG" ]; then PKG="com.systempro.app"; fi
          if [ -z "$APP_NAME" ]; then APP_NAME="CodeForge Pro"; fi
          echo "package_name=$PKG" >> $GITHUB_OUTPUT
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          echo "package_path=$PKG_PATH" >> $GITHUB_OUTPUT

      - name: Clean and recreate directories
        run: |
          rm -rf app/src/main/java app/src/main/res app/build.gradle
          PKG_PATH="${{ steps.vars.outputs.package_path }}"
          mkdir -p "app/src/main/java/${PKG_PATH}"
          mkdir -p app/src/main/res/layout app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi

      - name: Generate user files (Java, layouts, etc.)
        run: |
          cat > payload_files.json << 'EOF'
          ${{ toJson(github.event.client_payload.files) }}
          EOF
          NEW_PKG="${{ steps.vars.outputs.package_name }}"
          python3 -c "
          import json, os, re
          new_pkg = os.environ['NEW_PKG']
          with open('payload_files.json', 'r') as f:
              files = json.load(f)
          for orig_path, content in files.items():
              if orig_path.endswith('.java'):
                  content = re.sub(r'^package .*;', f'package {new_pkg};', content, flags=re.MULTILINE)
                  filename = os.path.basename(orig_path)
                  new_path = f'app/src/main/java/{new_pkg.replace('.', '/')}/{filename}'
              else:
                  new_path = orig_path
              os.makedirs(os.path.dirname(new_path), exist_ok=True)
              with open(new_path, 'w', encoding='utf-8') as out:
                  out.write(content)
              print(f'Written: {new_path}')
          "
          export NEW_PKG

      - name: Auto‑generate all critical resources (safe mode)
        run: |
          PKG="${{ steps.vars.outputs.package_name }}"
          APP="${{ steps.vars.outputs.app_name }}"

          # strings.xml
          cat > app/src/main/res/values/strings.xml << EOF
          <resources>
              <string name="app_name">${APP}</string>
          </resources>
          EOF

          # colors.xml
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#6200EE</color>
              <color name="colorPrimaryDark">#3700B3</color>
              <color name="colorAccent">#03DAC5</color>
          </resources>
          EOF

          # themes.xml (native, no AppCompat)
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <item name="android:colorPrimary">@color/colorPrimary</item>
                  <item name="android:colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="android:colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          EOF

          # Find any Java activity (or use fallback)
          ACTIVITY_FILE=$(find app/src/main/java -name "*.java" | xargs grep -l "extends.*Activity" | head -1)
          if [ -z "$ACTIVITY_FILE" ]; then
            echo "No Activity found, generating fallback MainActivity"
            ACTIVITY_PATH="app/src/main/java/${PKG//.//}/MainActivity.java"
            mkdir -p "$(dirname "$ACTIVITY_PATH")"
            cat > "$ACTIVITY_PATH" << 'JAVAEOF'
            package __PKG__;
            import android.app.Activity;
            import android.os.Bundle;
            import android.widget.TextView;
            public class MainActivity extends Activity {
                @Override
                protected void onCreate(Bundle savedInstanceState) {
                    super.onCreate(savedInstanceState);
                    try {
                        setContentView(R.layout.activity_main);
                    } catch(Exception e) {
                        TextView tv = new TextView(this);
                        tv.setText("APK Built Successfully\\n(no custom layout)");
                        tv.setTextSize(22);
                        setContentView(tv);
                    }
                }
            }
            JAVAEOF
            sed -i "s/__PKG__/${PKG}/g" "$ACTIVITY_PATH"
            # also create a default layout
            cat > app/src/main/res/layout/activity_main.xml << 'XMLEOF'
            <?xml version="1.0" encoding="utf-8"?>
            <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:gravity="center"
                android:orientation="vertical"
                android:padding="24dp">
                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="CodeForge Pro Build"
                    android:textSize="28sp"
                    android:textColor="#00FFCC" />
            </LinearLayout>
            XMLEOF
          fi

          # Determine the launcher activity class name
          LAUNCHER_ACTIVITY=$(find app/src/main/java -name "*.java" | head -1 | xargs basename | sed 's/\.java$//')
          if [ -z "$LAUNCHER_ACTIVITY" ]; then
            LAUNCHER_ACTIVITY="MainActivity"
          fi

          # Create clean AndroidManifest.xml (never trust user manifest)
          cat > app/src/main/AndroidManifest.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="${PKG}">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">
                  <activity
                      android:name=".${LAUNCHER_ACTIVITY}"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create app/build.gradle (no AppCompat dependency)
        run: |
          PKG="${{ steps.vars.outputs.package_name }}"
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace "__PKG__"
              defaultConfig {
                  applicationId "__PKG__"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              sourceSets {
                  main {
                      java.srcDirs = ['src/main/java']
                      res.srcDirs = ['src/main/res']
                      manifest.srcFile 'src/main/AndroidManifest.xml'
                  }
              }
          }
          dependencies {
              // No AppCompat – pure Android
          }
          EOF
          sed -i "s/__PKG__/${PKG}/g" app/build.gradle

      - name: Process app icon from payload
        run: |
          ICON_B64="${{ github.event.client_payload.icon }}"
          if [ -n "$ICON_B64" ] && [ "$ICON_B64" != "" ]; then
            echo "$ICON_B64" | base64 -d > app_icon.png
            sudo apt-get update && sudo apt-get install -y imagemagick
            convert app_icon.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert app_icon.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert app_icon.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert app_icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert app_icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
            convert -size 72x72 xc:#00FFCC app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert -size 48x48 xc:#00FFCC app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert -size 96x96 xc:#00FFCC app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert -size 144x144 xc:#00FFCC app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert -size 192x192 xc:#00FFCC app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Setup Gradle 8.5 wrapper
        run: |
          if [ ! -f gradlew ]; then
            mkdir -p gradle/wrapper
            wget -q https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo '#!/bin/sh' > gradlew
            echo 'GRADLE_OPTS="-Dorg.gradle.appname=gradlew"' >> gradlew
            echo 'exec java $GRADLE_OPTS -classpath "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          files: app/build/outputs/apk/debug/*.apk
