name: Create Files

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create directories
        run: |
          mkdir -p app/src/main/java/com/counter/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
      - name: Create MainActivity.java
        run: |
          echo 'package com.counter.app;' > app/src/main/java/com/counter/app/MainActivity.java
          echo '' >> app/src/main/java/com/counter/app/MainActivity.java
          echo 'import android.os.Bundle;' >> app/src/main/java/com/counter/app/MainActivity.java
          echo 'import android.view.View;' >> app/src/main/java/com/counter/app/MainActivity.java
          echo 'import android.widget.Button;' >> app/src/main/java/com/counter/app/MainActivity.java
          echo 'import android.widget.TextView;' >> app/src/main/java/com/counter/app/MainActivity.java
          echo 'import androidx.appcompat.app.AppCompatActivity;' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '' >> app/src/main/java/com/counter/app/MainActivity.java
          echo 'public class MainActivity extends AppCompatActivity {' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '    private TextView tv;' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '    private Button minus, reset, plus;' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '    private int count = 0;' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '    @Override' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '    protected void onCreate(Bundle savedInstanceState) {' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '        super.onCreate(savedInstanceState);' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '        setContentView(R.layout.activity_main);' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '        tv = findViewById(R.id.tv);' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '        minus = findViewById(R.id.minus);' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '        reset = findViewById(R.id.reset);' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '        plus = findViewById(R.id.plus);' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '        tv.setText("0");' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '        minus.setOnClickListener(v -> { count--; tv.setText(String.valueOf(count)); });' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '        reset.setOnClickListener(v -> { count = 0; tv.setText("0"); });' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '        plus.setOnClickListener(v -> { count++; tv.setText(String.valueOf(count)); });' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '    }' >> app/src/main/java/com/counter/app/MainActivity.java
          echo '}' >> app/src/main/java/com/counter/app/MainActivity.java
          
      - name: Create activity_main.xml
        run: |
          echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/res/layout/activity_main.xml
          echo '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"' >> app/src/main/res/layout/activity_main.xml
          echo '    android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
          echo '    android:layout_height="match_parent"' >> app/src/main/res/layout/activity_main.xml
          echo '    android:orientation="vertical"' >> app/src/main/res/layout/activity_main.xml
          echo '    android:gravity="center"' >> app/src/main/res/layout/activity_main.xml
          echo '    android:padding="24dp">' >> app/src/main/res/layout/activity_main.xml
          echo '    <TextView' >> app/src/main/res/layout/activity_main.xml
          echo '        android:id="@+id/tv"' >> app/src/main/res/layout/activity_main.xml
          echo '        android:layout_width="wrap_content"' >> app/src/main/res/layout/activity_main.xml
          echo '        android:layout_height="wrap_content"' >> app/src/main/res/layout/activity_main.xml
          echo '        android:text="0"' >> app/src/main/res/layout/activity_main.xml
          echo '        android:textSize="80sp"' >> app/src/main/res/layout/activity_main.xml
          echo '        android:layout_marginBottom="40dp" />' >> app/src/main/res/layout/activity_main.xml
          echo '    <LinearLayout' >> app/src/main/res/layout/activity_main.xml
          echo '        android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
          echo '        android:layout_height="wrap_content"' >> app/src/main/res/layout/activity_main.xml
          echo '        android:orientation="horizontal">' >> app/src/main/res/layout/activity_main.xml
          echo '        <Button' >> app/src/main/res/layout/activity_main.xml
          echo '            android:id="@+id/minus"' >> app/src/main/res/layout/activity_main.xml
          echo '            android:layout_width="0dp"' >> app/src/main/res/layout/activity_main.xml
          echo '            android:layout_height="60dp"' >> app/src/main/res/layout/activity_main.xml
          echo '            android:layout_weight="1"' >> app/src/main/res/layout/activity_main.xml
          echo '            android:text="-" />' >> app/src/main/res/layout/activity_main.xml
          echo '        <Button' >> app/src/main/res/layout/activity_main.xml
          echo '            android:id="@+id/reset"' >> app/src/main/res/layout/activity_main.xml
          echo '            android:layout_width="0dp"' >> app/src/main/res/layout/activity_main.xml
          echo '            android:layout_height="60dp"' >> app/src/main/res/layout/activity_main.xml
          echo '            android:layout_weight="1"' >> app/src/main/res/layout/activity_main.xml
          echo '            android:text="Reset" />' >> app/src/main/res/layout/activity_main.xml
          echo '        <Button' >> app/src/main/res/layout/activity_main.xml
          echo '            android:id="@+id/plus"' >> app/src/main/res/layout/activity_main.xml
          echo '            android:layout_width="0dp"' >> app/src/main/res/layout/activity_main.xml
          echo '            android:layout_height="60dp"' >> app/src/main/res/layout/activity_main.xml
          echo '            android:layout_weight="1"' >> app/src/main/res/layout/activity_main.xml
          echo '            android:text="+" />' >> app/src/main/res/layout/activity_main.xml
          echo '    </LinearLayout>' >> app/src/main/res/layout/activity_main.xml
          echo '</LinearLayout>' >> app/src/main/res/layout/activity_main.xml
          
      - name: Create AndroidManifest.xml
        run: |
          echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"' >> app/src/main/AndroidManifest.xml
          echo '    package="com.counter.app">' >> app/src/main/AndroidManifest.xml
          echo '    <application' >> app/src/main/AndroidManifest.xml
          echo '        android:allowBackup="true"' >> app/src/main/AndroidManifest.xml
          echo '        android:icon="@mipmap/ic_launcher"' >> app/src/main/AndroidManifest.xml
          echo '        android:label="Counter App"' >> app/src/main/AndroidManifest.xml
          echo '        android:theme="@style/Theme.AppCompat.Light.DarkActionBar">' >> app/src/main/AndroidManifest.xml
          echo '        <activity' >> app/src/main/AndroidManifest.xml
          echo '            android:name=".MainActivity"' >> app/src/main/AndroidManifest.xml
          echo '            android:exported="true">' >> app/src/main/AndroidManifest.xml
          echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
          echo '                <action android:name="android.intent.action.MAIN" />' >> app/src/main/AndroidManifest.xml
          echo '                <category android:name="android.intent.category.LAUNCHER" />' >> app/src/main/AndroidManifest.xml
          echo '            </intent-filter>' >> app/src/main/AndroidManifest.xml
          echo '        </activity>' >> app/src/main/AndroidManifest.xml
          echo '    </application>' >> app/src/main/AndroidManifest.xml
          echo '</manifest>' >> app/src/main/AndroidManifest.xml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add app files" || echo "No changes"
          git push
