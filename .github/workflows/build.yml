name: Build APK from build_assets

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Enter package name (e.g., com.example.app)'
        required: true
        default: 'com.mycompany.camera'
      app_name:
        description: 'Enter app name'
        required: true
        default: 'Camera App'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p android-sdk/cmdline-tools
          mv cmdline-tools android-sdk/cmdline-tools/latest
          export ANDROID_SDK_ROOT=$PWD/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1
          echo "ANDROID_SDK_ROOT=$PWD/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$PWD/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_ENV

      - name: Create gradle.properties
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Create Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"

      - name: Create project structure
        run: |
          rm -rf app
          PKG_PATH=$(echo "${{ github.event.inputs.package_name }}" | tr '.' '/')
          mkdir -p app/src/main/java/$PKG_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          echo "Project structure created"

      - name: Copy files from build_assets
        run: |
          PKG_PATH=$(echo "${{ github.event.inputs.package_name }}" | tr '.' '/')
          
          # Copy AndroidManifest.xml (if exists)
          if [ -f "build_assets/AndroidManifest.xml" ]; then
            cp build_assets/AndroidManifest.xml app/src/main/AndroidManifest.xml
            echo "✅ AndroidManifest.xml copied"
          else
            echo "❌ AndroidManifest.xml not found in build_assets!"
            exit 1
          fi
          
          # Copy MainActivity.java (if exists)
          if [ -f "build_assets/MainActivity.java" ]; then
            sed "s/{{PACKAGE_NAME}}/${{ github.event.inputs.package_name }}/g" build_assets/MainActivity.java > app/src/main/java/$PKG_PATH/MainActivity.java
            echo "✅ MainActivity.java copied"
          else
            echo "❌ MainActivity.java not found in build_assets!"
            exit 1
          fi
          
          # Copy layout files (if exists)
          if [ -f "build_assets/activity_main.xml" ]; then
            cp build_assets/activity_main.xml app/src/main/res/layout/activity_main.xml
            echo "✅ activity_main.xml copied"
          else
            echo "❌ activity_main.xml not found in build_assets!"
            exit 1
          fi
          
          # Copy values files (if exists)
          if [ -f "build_assets/strings.xml" ]; then
            cp build_assets/strings.xml app/src/main/res/values/strings.xml
            echo "✅ strings.xml copied"
          fi
          
          if [ -f "build_assets/colors.xml" ]; then
            cp build_assets/colors.xml app/src/main/res/values/colors.xml
            echo "✅ colors.xml copied"
          fi
          
          if [ -f "build_assets/themes.xml" ]; then
            cp build_assets/themes.xml app/src/main/res/values/themes.xml
            echo "✅ themes.xml copied"
          fi

      - name: Generate build.gradle files
        run: |
          # Root build.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          
          # App build.gradle with signing config
          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace '${{ github.event.inputs.package_name }}'
              compileSdk 34
              
              defaultConfig {
                  applicationId '${{ github.event.inputs.package_name }}'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              
              signingConfigs {
                  debug {
                      storeFile file('../debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          
          dependencies {
              // Read dependencies from build_assets/dependencies.txt if exists
              def depsFile = file('../build_assets/dependencies.txt')
              if (depsFile.exists()) {
                  def deps = depsFile.text.split('\\n')
                  deps.each { dep ->
                      if (dep.trim()) {
                          implementation dep.trim()
                      }
                  }
              } else {
                  implementation 'androidx.appcompat:appcompat:1.6.1'
                  implementation 'com.google.android.material:material:1.10.0'
              }
          }
          EOF
          
          echo "rootProject.name = \"MyApp\"" > settings.gradle
          echo "include ':app'" >> settings.gradle
          echo "✅ Gradle files generated"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Signed APK
        run: |
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-${{ github.event.inputs.package_name }}
          path: app/build/outputs/apk/release/*.apk
