name: Build Android APK (Auto Permissions Injection)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Get payload variables
        id: vars
        run: |
          PKG="${{ github.event.client_payload.package_name }}"
          APP_NAME="${{ github.event.client_payload.app_name }}"
          if [ -z "$PKG" ]; then PKG="com.systempro.app"; fi
          if [ -z "$APP_NAME" ]; then APP_NAME="CodeForge Pro"; fi
          echo "package_name=$PKG" >> $GITHUB_OUTPUT
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          echo "package_path=$PKG_PATH" >> $GITHUB_OUTPUT

      - name: Clean and recreate directories
        run: |
          rm -rf app/src/main/java app/src/main/res app/build.gradle
          PKG_PATH="${{ steps.vars.outputs.package_path }}"
          mkdir -p "app/src/main/java/${PKG_PATH}"
          mkdir -p app/src/main/res/layout app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi

      - name: Generate files from payload
        run: |
          cat > payload_files.json << 'EOF'
          ${{ toJson(github.event.client_payload.files) }}
          EOF
          NEW_PKG="${{ steps.vars.outputs.package_name }}"
          NEW_NAME="${{ steps.vars.outputs.app_name }}"
          cat > generate_all.py << 'PY'
          import json, os, re
          new_pkg = os.environ['NEW_PKG']
          new_name = os.environ['NEW_NAME']
          with open('payload_files.json', 'r') as f:
              files = json.load(f)
          for orig_path, content in files.items():
              if orig_path.endswith('.java'):
                  content = re.sub(r'^package .*;', f'package {new_pkg};', content, flags=re.MULTILINE)
                  filename = os.path.basename(orig_path)
                  new_path = f"app/src/main/java/{new_pkg.replace('.', '/')}/{filename}"
              else:
                  new_path = orig_path
              os.makedirs(os.path.dirname(new_path), exist_ok=True)
              with open(new_path, 'w', encoding='utf-8') as out:
                  out.write(content)
              print(f"Written: {new_path}")
          strings_path = "app/src/main/res/values/strings.xml"
          if os.path.exists(strings_path):
              with open(strings_path, 'r') as f:
                  strings_content = f.read()
              strings_content = re.sub(r'<string name="app_name">.*?</string>', f'<string name="app_name">{new_name}</string>', strings_content, flags=re.DOTALL)
              with open(strings_path, 'w') as f:
                  f.write(strings_content)
          else:
              os.makedirs(os.path.dirname(strings_path), exist_ok=True)
              with open(strings_path, 'w') as f:
                  f.write(f'<resources>\n    <string name="app_name">{new_name}</string>\n</resources>')
          colors_path = "app/src/main/res/values/colors.xml"
          if not os.path.exists(colors_path):
              with open(colors_path, 'w') as f:
                  f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="colorPrimary">#6200EE</color>\n    <color name="colorPrimaryDark">#3700B3</color>\n    <color name="colorAccent">#03DAC5</color>\n</resources>')
          PY
          export NEW_PKG NEW_NAME
          python3 generate_all.py

      - name: Create fresh app/build.gradle
        run: |
          PKG="${{ steps.vars.outputs.package_name }}"
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace "__PKG__"
              defaultConfig {
                  applicationId "__PKG__"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              sourceSets {
                  main {
                      java.srcDirs = ['src/main/java']
                      res.srcDirs = ['src/main/res']
                      manifest.srcFile 'src/main/AndroidManifest.xml'
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          sed -i "s/__PKG__/${PKG}/g" app/build.gradle

      - name: Process app icon from payload
        run: |
          ICON_B64="${{ github.event.client_payload.icon }}"
          if [ -n "$ICON_B64" ] && [ "$ICON_B64" != "" ]; then
            echo "$ICON_B64" | base64 -d > app_icon.png
            sudo apt-get update && sudo apt-get install -y imagemagick
            for d in 72 48 96 144 192; do
              size="${d}x${d}"
              case $d in
                72) density="hdpi" ;;
                48) density="mdpi" ;;
                96) density="xhdpi" ;;
                144) density="xxhdpi" ;;
                192) density="xxxhdpi" ;;
              esac
              convert app_icon.png -resize $size "app/src/main/res/mipmap-${density}/ic_launcher.png"
            done
          else
            convert -size 72x72 xc:#00FFCC app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert -size 48x48 xc:#00FFCC app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert -size 96x96 xc:#00FFCC app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert -size 144x144 xc:#00FFCC app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert -size 192x192 xc:#00FFCC app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Setup Gradle 8.5 wrapper
        run: |
          if [ ! -f gradlew ]; then
            mkdir -p gradle/wrapper
            wget -q https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo '#!/bin/sh' > gradlew
            echo 'GRADLE_OPTS="-Dorg.gradle.appname=gradlew"' >> gradlew
            echo 'exec java $GRADLE_OPTS -classpath "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          files: app/build/outputs/apk/debug/*.apk
