name: Build APK

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Simple Counter App
        run: |
          # Package name
          PKG="com.counter.app"
          APP_NAME="Counter App"
          
          # Create directories
          mkdir -p app/src/main/java/$(echo $PKG | tr '.' '/')
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
          # MainActivity.java
          cat > app/src/main/java/$(echo $PKG | tr '.' '/')/MainActivity.java << 'JAVA_EOF'
          package com.counter.app;
          
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          
          public class MainActivity extends AppCompatActivity {
              private TextView counterText;
              private Button btnPlus, btnMinus, btnReset;
              private int count = 0;
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  counterText = findViewById(R.id.counterText);
                  btnPlus = findViewById(R.id.btnPlus);
                  btnMinus = findViewById(R.id.btnMinus);
                  btnReset = findViewById(R.id.btnReset);
                  
                  updateCounter();
                  
                  btnPlus.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) { count++; updateCounter(); }
                  });
                  btnMinus.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) { count--; updateCounter(); }
                  });
                  btnReset.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) { count = 0; updateCounter(); }
                  });
              }
              
              private void updateCounter() {
                  counterText.setText(String.valueOf(count));
              }
          }
          JAVA_EOF
          
          # activity_main.xml
          cat > app/src/main/res/layout/activity_main.xml << 'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp"
              android:background="#F5F5F5">
              
              <TextView
                  android:id="@+id/counterText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="0"
                  android:textSize="80sp"
                  android:textStyle="bold"
                  android:textColor="#333333"
                  android:layout_marginBottom="40dp" />
              
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal">
                  
                  <Button
                      android:id="@+id/btnMinus"
                      android:layout_width="0dp"
                      android:layout_height="60dp"
                      android:layout_weight="1"
                      android:text="-"
                      android:textSize="32sp"
                      android:backgroundTint="#F44336"
                      android:textColor="#FFFFFF"
                      android:layout_marginEnd="8dp" />
                  
                  <Button
                      android:id="@+id/btnReset"
                      android:layout_width="0dp"
                      android:layout_height="60dp"
                      android:layout_weight="1"
                      android:text="Reset"
                      android:textSize="16sp"
                      android:backgroundTint="#FF9800"
                      android:textColor="#FFFFFF"
                      android:layout_marginStart="4dp"
                      android:layout_marginEnd="4dp" />
                  
                  <Button
                      android:id="@+id/btnPlus"
                      android:layout_width="0dp"
                      android:layout_height="60dp"
                      android:layout_weight="1"
                      android:text="+"
                      android:textSize="32sp"
                      android:backgroundTint="#4CAF50"
                      android:textColor="#FFFFFF"
                      android:layout_marginStart="8dp" />
                  
              </LinearLayout>
          </LinearLayout>
          XML_EOF
          
          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << MAN_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="${PKG}">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="${APP_NAME}"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MAN_EOF
          
          # settings.gradle with plugin management
          cat > settings.gradle << 'SET_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CounterApp"
          include ':app'
          SET_EOF
          
          # build.gradle (top level)
          cat > build.gradle << 'BLD_EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          BLD_EOF
          
          # app/build.gradle
          cat > app/build.gradle << 'APP_EOF'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.counter.app'
              compileSdk 34
              
              defaultConfig {
                  applicationId 'com.counter.app'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          APP_EOF
          
          # gradle.properties
          cat > gradle.properties << 'PRO_EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          PRO_EOF
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          echo "✅ Counter App created successfully"

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
