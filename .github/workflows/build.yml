name: Build Android APK (Gradle 8.5 Locked)

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get package name from payload
        id: pkg
        run: |
          NEW_PKG="${{ github.event.client_payload.package_name }}"
          if [ -z "$NEW_PKG" ]; then
            NEW_PKG="com.systempro.app"
          fi
          echo "package_name=$NEW_PKG" >> $GITHUB_OUTPUT
          echo "Using package: $NEW_PKG"

      - name: Clean old source folders
        run: |
          rm -rf app/src/main/java
          rm -rf app/src/main/res
          PKG_PATH=$(echo "${{ steps.pkg.outputs.package_name }}" | tr '.' '/')
          mkdir -p "app/src/main/java/${PKG_PATH}"
          mkdir -p app/src/main/res/layout app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          echo "Package path: ${PKG_PATH}"

      - name: Create MainActivity.java
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          cat > "app/src/main/java/${PKG_PATH}/MainActivity.java" <<JAVA
          package ${PKG};
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  TextView tv = findViewById(R.id.helloText);
                  tv.setText("CodeForge Pro - Success!");
              }
          }
          JAVA
          echo "Created MainActivity.java"

      - name: Create layout and strings
        run: |
          cat > app/src/main/res/layout/activity_main.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">
              <TextView
                  android:id="@+id/helloText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Hello CodeForge"
                  android:textSize="28sp"
                  android:textColor="#00FFCC" />
          </LinearLayout>
          XML
          cat > app/src/main/res/values/strings.xml <<STR
          <resources>
              <string name="app_name">CodeForge Pro</string>
          </resources>
          STR

      - name: Create AndroidManifest.xml
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          cat > app/src/main/AndroidManifest.xml <<MAN
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="${PKG}">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MAN

      - name: Generate app icon (user or default)
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ -f build_assets/app_icon.png ]; then
            convert build_assets/app_icon.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert build_assets/app_icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
            convert -size 72x72 xc:#00FFCC app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert -size 48x48 xc:#00FFCC app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert -size 96x96 xc:#00FFCC app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert -size 144x144 xc:#00FFCC app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert -size 192x192 xc:#00FFCC app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Create Gradle files (if missing) without heredoc issues
        run: |
          # root build.gradle
          if [ ! -f build.gradle ]; then
            echo 'buildscript {' > build.gradle
            echo '    repositories { google(); mavenCentral() }' >> build.gradle
            echo '    dependencies { classpath "com.android.tools.build:gradle:7.4.2" }' >> build.gradle
            echo '}' >> build.gradle
            echo 'allprojects { repositories { google(); mavenCentral() } }' >> build.gradle
            echo "tasks.register('clean', Delete) { delete rootProject.buildDir }" >> build.gradle
          fi
          # settings.gradle
          if [ ! -f settings.gradle ]; then
            echo 'rootProject.name = "CodeForgePro"' > settings.gradle
            echo "include ':app'" >> settings.gradle
          fi
          # gradle.properties
          if [ ! -f gradle.properties ]; then
            echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' > gradle.properties
            echo 'android.useAndroidX=true' >> gradle.properties
            echo 'android.enableJetifier=true' >> gradle.properties
            echo 'android.suppressUnsupportedCompileSdk=34' >> gradle.properties
          fi
          # gradle wrapper
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo 'distributionBase=GRADLE_USER_HOME' > gradle/wrapper/gradle-wrapper.properties
            echo 'distributionPath=wrapper/dists' >> gradle/wrapper/gradle-wrapper.properties
            echo 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip' >> gradle/wrapper/gradle-wrapper.properties
            echo 'zipStoreBase=GRADLE_USER_HOME' >> gradle/wrapper/gradle-wrapper.properties
            echo 'zipStorePath=wrapper/dists' >> gradle/wrapper/gradle-wrapper.properties
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            wget -q https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          fi
          if [ ! -f gradlew ]; then
            echo '#!/bin/sh' > gradlew
            echo 'GRADLE_OPTS="-Dorg.gradle.appname=gradlew"' >> gradlew
            echo 'exec java $GRADLE_OPTS -classpath "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      - name: Set namespace and applicationId in app/build.gradle
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          # if app/build.gradle doesn't exist, create it
          if [ ! -f app/build.gradle ]; then
            mkdir -p app
            echo "plugins { id 'com.android.application' }" > app/build.gradle
            echo 'android {' >> app/build.gradle
            echo '    compileSdk 34' >> app/build.gradle
            echo "    namespace '${PKG}'" >> app/build.gradle
            echo '    defaultConfig {' >> app/build.gradle
            echo "        applicationId '${PKG}'" >> app/build.gradle
            echo '        minSdk 21' >> app/build.gradle
            echo '        targetSdk 34' >> app/build.gradle
            echo '        versionCode 1' >> app/build.gradle
            echo "        versionName '1.0'" >> app/build.gradle
            echo '    }' >> app/build.gradle
            echo '    buildTypes { release { minifyEnabled false } }' >> app/build.gradle
            echo '    compileOptions {' >> app/build.gradle
            echo '        sourceCompatibility JavaVersion.VERSION_17' >> app/build.gradle
            echo '        targetCompatibility JavaVersion.VERSION_17' >> app/build.gradle
            echo '    }' >> app/build.gradle
            echo '    sourceSets {' >> app/build.gradle
            echo '        main {' >> app/build.gradle
            echo '            java.srcDirs = ["src/main/java"]' >> app/build.gradle
            echo '            res.srcDirs = ["src/main/res"]' >> app/build.gradle
            echo '            manifest.srcFile "src/main/AndroidManifest.xml"' >> app/build.gradle
            echo '        }' >> app/build.gradle
            echo '    }' >> app/build.gradle
            echo '}' >> app/build.gradle
            echo 'dependencies {}' >> app/build.gradle
          else
            sed -i "s/namespace \".*\"/namespace \"${PKG}\"/" app/build.gradle
            sed -i "s/applicationId \".*\"/applicationId \"${PKG}\"/" app/build.gradle
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Check APK size
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "❌ No APK found!"
            exit 1
          fi
          SIZE=$(du -k "$APK" | cut -f1)
          echo "APK size: ${SIZE} KB"
          if [ "$SIZE" -lt 100 ]; then
            echo "❌ APK too small, compilation failed"
            exit 1
          else
            echo "✅ APK looks good"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          files: app/build/outputs/apk/debug/*.apk
