name: Build APK

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clean old resources and create fresh ones
        run: |
          # Clean old resource directories
          rm -rf app/src/main/res/values/colors.xml
          rm -rf app/src/main/res/values/themes.xml
          rm -rf app/src/main/res/values/strings.xml
          rm -rf app/src/main/res/layout/activity_main.xml
          
          # Create fresh directories
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          
          # Create fresh colors.xml
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#6200EE</color>
              <color name="colorPrimaryDark">#3700B3</color>
              <color name="colorAccent">#03DAC6</color>
              <color name="background">#F5F5F5</color>
              <color name="text_dark">#333333</color>
              <color name="white">#FFFFFF</color>
              <color name="red">#F44336</color>
              <color name="orange">#FF9800</color>
              <color name="green">#4CAF50</color>
          </resources>
          EOF
          
          # Create fresh themes.xml
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          EOF
          
          # Create fresh strings.xml
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">MyApp</string>
          </resources>
          EOF
          
          # Create fresh activity_main.xml
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp"
              android:background="@color/background">
              <TextView
                  android:id="@+id/textView"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Hello World!"
                  android:textSize="32sp"
                  android:textStyle="bold"
                  android:textColor="@color/colorPrimary" />
          </LinearLayout>
          EOF
          
          echo "✅ Fresh resources created"

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
