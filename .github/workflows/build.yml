name: Build Android APK (User UI Priority)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.example.app'
        type: string
      app_name:
        description: 'App Name'
        required: false
        default: 'MyApp'
        type: string
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get Build Parameters
        id: params
        run: |
          # Get package name from payload or input
          PKG="${{ github.event.client_payload.package_name }}"
          if [ -z "$PKG" ] || [ "$PKG" = "null" ]; then
            PKG="${{ github.event.inputs.package_name }}"
          fi
          if [ -z "$PKG" ] || [ "$PKG" = "null" ]; then
            PKG="com.example.app"
          fi
          PKG=$(echo "$PKG" | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "package_name=$PKG" >> $GITHUB_OUTPUT
          echo "package_path=$(echo $PKG | tr '.' '/')" >> $GITHUB_OUTPUT
          
          # Get app name
          APP="${{ github.event.client_payload.app_name }}"
          if [ -z "$APP" ] || [ "$APP" = "null" ]; then
            APP="${{ github.event.inputs.app_name }}"
          fi
          if [ -z "$APP" ] || [ "$APP" = "null" ]; then
            APP="MyApp"
          fi
          echo "app_name=$APP" >> $GITHUB_OUTPUT
          
          echo "Package: $PKG"
          echo "App Name: $APP"

      - name: Setup Project Directories
        run: |
          rm -rf app
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

      - name: Process User Files from Repository
        env:
          PKG: ${{ steps.params.outputs.package_name }}
          PKG_PATH: ${{ steps.params.outputs.package_path }}
          APP_NAME: ${{ steps.params.outputs.app_name }}
        run: |
          echo "🔍 Looking for user files in repository..."
          
          # Create package directory
          mkdir -p app/src/main/java/$PKG_PATH
          
          # Check if user files exist in the repo (from previous pushes)
          USER_JAVA_FOUND=false
          USER_LAYOUT_FOUND=false
          
          # Look for Java files in the repository
          if [ -d "app/src/main/java" ]; then
            JAVA_FILES=$(find app/src/main/java -name "*.java" 2>/dev/null || echo "")
            if [ -n "$JAVA_FILES" ]; then
              echo "$JAVA_FILES" | while read file; do
                echo "📄 Found Java file: $file"
                # Fix package name in each Java file
                sed -i "s/^package .*;/package $PKG;/" "$file" 2>/dev/null || true
                USER_JAVA_FOUND=true
              done
            fi
          fi
          
          # Look for layout files
          if [ -d "app/src/main/res/layout" ]; then
            LAYOUT_FILES=$(find app/src/main/res/layout -name "*.xml" 2>/dev/null || echo "")
            if [ -n "$LAYOUT_FILES" ]; then
              echo "$LAYOUT_FILES" | while read file; do
                echo "📄 Found layout: $file"
                USER_LAYOUT_FOUND=true
              done
            fi
          fi
          
          # If no user Java file found, create default MainActivity
          if [ "$USER_JAVA_FOUND" = false ]; then
            echo "📝 Creating default MainActivity.java"
            cat > app/src/main/java/$PKG_PATH/MainActivity.java << EOF
            package $PKG;
            
            import android.os.Bundle;
            import android.widget.TextView;
            import androidx.appcompat.app.AppCompatActivity;
            
            public class MainActivity extends AppCompatActivity {
                @Override
                protected void onCreate(Bundle savedInstanceState) {
                    super.onCreate(savedInstanceState);
                    setContentView(R.layout.activity_main);
                    TextView tv = findViewById(R.id.textView);
                    if (tv != null) {
                        tv.setText("Welcome to $APP_NAME");
                    }
                }
            }
            EOF
          fi
          
          # If no user layout found, create default
          if [ "$USER_LAYOUT_FOUND" = false ]; then
            echo "📝 Creating default activity_main.xml"
            cat > app/src/main/res/layout/activity_main.xml << 'EOF'
            <?xml version="1.0" encoding="utf-8"?>
            <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:orientation="vertical"
                android:gravity="center"
                android:padding="24dp">
                <TextView
                    android:id="@+id/textView"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Hello World!"
                    android:textSize="24sp"/>
            </LinearLayout>
            EOF
          fi
          
          # Create or update strings.xml
          cat > app/src/main/res/values/strings.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">$APP_NAME</string>
          </resources>
          EOF
          
          # Create colors.xml if not exists
          if [ ! -f "app/src/main/res/values/colors.xml" ]; then
            cat > app/src/main/res/values/colors.xml << 'EOF'
            <?xml version="1.0" encoding="utf-8"?>
            <resources>
                <color name="colorPrimary">#6200EE</color>
                <color name="colorPrimaryDark">#3700B3</color>
                <color name="colorAccent">#03DAC6</color>
            </resources>
            EOF
          fi
          
          # Create themes.xml if not exists
          if [ ! -f "app/src/main/res/values/themes.xml" ]; then
            cat > app/src/main/res/values/themes.xml << 'EOF'
            <?xml version="1.0" encoding="utf-8"?>
            <resources>
                <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                    <item name="colorPrimary">@color/colorPrimary</item>
                    <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                    <item name="colorAccent">@color/colorAccent</item>
                </style>
            </resources>
            EOF
          fi
          
          # Create or update AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="$APP_NAME"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          echo "✅ Project files processed"

      - name: Process Custom Icon
        run: |
          # Check if icon exists in repository
          if [ -f "build_assets/app_icon.png" ]; then
            echo "📱 Custom icon found, processing..."
            sudo apt-get update
            sudo apt-get install -y imagemagick
            sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true
            
            for size in 48 72 96 144 192; do
              case $size in
                48) density="mdpi" ;;
                72) density="hdpi" ;;
                96) density="xhdpi" ;;
                144) density="xxhdpi" ;;
                192) density="xxxhdpi" ;;
              esac
              convert build_assets/app_icon.png -resize ${size}x${size} app/src/main/res/mipmap-${density}/ic_launcher.png 2>/dev/null || true
              cp app/src/main/res/mipmap-${density}/ic_launcher.png app/src/main/res/mipmap-${density}/ic_launcher_round.png 2>/dev/null || true
            done
            echo "✅ Custom icons applied"
          else
            echo "⚠️ No custom icon found, generating default"
            sudo apt-get update
            sudo apt-get install -y imagemagick
            for size in 48 72 96 144 192; do
              case $size in
                48) density="mdpi" ;;
                72) density="hdpi" ;;
                96) density="xhdpi" ;;
                144) density="xxhdpi" ;;
                192) density="xxxhdpi" ;;
              esac
              convert -size ${size}x${size} xc:#6200EE -gravity center \
                -font Helvetica -pointsize $((size/3)) -fill white -annotate 0 "A" \
                app/src/main/res/mipmap-${density}/ic_launcher.png 2>/dev/null || true
              cp app/src/main/res/mipmap-${density}/ic_launcher.png app/src/main/res/mipmap-${density}/ic_launcher_round.png 2>/dev/null || true
            done
          fi

      - name: Create build.gradle
        env:
          PKG: ${{ steps.params.outputs.package_name }}
        run: |
          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "$PKG"
              compileSdk 34

              defaultConfig {
                  applicationId "$PKG"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF
          touch app/proguard-rules.pro

      - name: Create Gradle Settings
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "UserApp"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          android.enableJetifier=false
          EOF

      - name: Verify Build Files
        run: |
          echo "=== BUILD VERIFICATION ==="
          echo "Package: ${{ steps.params.outputs.package_name }}"
          echo ""
          echo "Java files in build:"
          find app/src/main/java -name "*.java" -type f
          echo ""
          echo "Layout files in build:"
          find app/src/main/res/layout -name "*.xml" -type f
          echo ""
          echo "First Java file package check:"
          JAVA_FILE=$(find app/src/main/java -name "*.java" -type f | head -1)
          if [ -n "$JAVA_FILE" ]; then
            head -3 "$JAVA_FILE"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-release
          name: Latest Build - ${{ steps.params.outputs.app_name }}
          body: |
            ## 🎉 App Built Successfully!
            
            **App:** ${{ steps.params.outputs.app_name }}
            **Package:** ${{ steps.params.outputs.package_name }}
            
            Your UI has been compiled into this APK.
          files: |
            app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
