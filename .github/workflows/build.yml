name: Build Android APK (Priority to User UI)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.example.app'
        type: string
      app_name:
        description: 'App Name'
        required: false
        default: 'MyApp'
        type: string
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get Package Name
        id: pkg
        run: |
          PKG="com.example.app"
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            PKG="${{ github.event.client_payload.package_name }}"
          elif [ -n "${{ github.event.inputs.package_name }}" ]; then
            PKG="${{ github.event.inputs.package_name }}"
          fi
          PKG=$(echo "$PKG" | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "package_name=$PKG" >> $GITHUB_OUTPUT
          echo "package_path=$(echo $PKG | tr '.' '/')" >> $GITHUB_OUTPUT

      - name: Get App Name
        id: app
        run: |
          APP="MyApp"
          if [ -n "${{ github.event.client_payload.app_name }}" ]; then
            APP="${{ github.event.client_payload.app_name }}"
          elif [ -n "${{ github.event.inputs.app_name }}" ]; then
            APP="${{ github.event.inputs.app_name }}"
          fi
          echo "app_name=$APP" >> $GITHUB_OUTPUT

      - name: Create Project Directories
        run: |
          rm -rf app
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

      - name: Decode and Build User Files (Priority)
        env:
          PKG: ${{ steps.pkg.outputs.package_name }}
          PKG_PATH: ${{ steps.pkg.outputs.package_path }}
          APP_NAME: ${{ steps.app.outputs.app_name }}
        run: |
          # Create package directory
          mkdir -p app/src/main/java/$PKG_PATH
          
          # First, check if user sent files in payload
          USER_FILES_EXIST=false
          
          if [ -n "${{ github.event.client_payload.files }}" ]; then
            echo "📦 User payload detected! Processing user files..."
            
            # Save payload to temp file
            echo '${{ toJson(github.event.client_payload.files) }}' > /tmp/payload.json
            
            # Python script to process user files with priority
            python3 << 'PYTHON_SCRIPT'
            import json
            import os
            import re
            import sys
            
            target_pkg = os.environ.get("PKG", "com.example.app")
            pkg_path = target_pkg.replace(".", "/")
            app_name = os.environ.get("APP_NAME", "MyApp")
            
            print(f"🔧 Building with user UI - Package: {target_pkg}")
            
            try:
                with open('/tmp/payload.json', 'r') as f:
                    payload_data = json.load(f)
                
                files_processed = 0
                
                for file_path, content in payload_data.items():
                    if not content:
                        continue
                    
                    clean_path = file_path.strip('/')
                    print(f"  📄 Processing: {clean_path}")
                    
                    # Handle Java files
                    if clean_path.endswith('.java'):
                        # Fix package name to match target
                        content = re.sub(r'^package\s+[\w.]+;', f'package {target_pkg};', content, flags=re.MULTILINE)
                        if 'package ' not in content[:200]:
                            content = f'package {target_pkg};\n\n{content}'
                        
                        filename = os.path.basename(clean_path)
                        dest_path = f"app/src/main/java/{pkg_path}/{filename}"
                        os.makedirs(os.path.dirname(dest_path), exist_ok=True)
                        with open(dest_path, 'w', encoding='utf-8') as f:
                            f.write(content)
                        print(f"    ✅ Java: {filename}")
                        files_processed += 1
                    
                    # Handle Layout XML files
                    elif 'layout' in clean_path and clean_path.endswith('.xml'):
                        filename = os.path.basename(clean_path)
                        dest_path = f"app/src/main/res/layout/{filename}"
                        os.makedirs(os.path.dirname(dest_path), exist_ok=True)
                        with open(dest_path, 'w', encoding='utf-8') as f:
                            f.write(content)
                        print(f"    ✅ Layout: {filename}")
                        files_processed += 1
                    
                    # Handle AndroidManifest.xml
                    elif 'AndroidManifest.xml' in clean_path:
                        dest_path = "app/src/main/AndroidManifest.xml"
                        # Remove package attribute if exists (using namespace now)
                        content = re.sub(r'package="[^"]*"', '', content)
                        content = re.sub(r'android:label="[^"]*"', f'android:label="{app_name}"', content)
                        os.makedirs(os.path.dirname(dest_path), exist_ok=True)
                        with open(dest_path, 'w', encoding='utf-8') as f:
                            f.write(content)
                        print(f"    ✅ AndroidManifest.xml")
                        files_processed += 1
                    
                    # Handle other XML files (values, drawable, etc.)
                    elif clean_path.endswith('.xml'):
                        dest_path = f"app/src/main/res/{clean_path}"
                        os.makedirs(os.path.dirname(dest_path), exist_ok=True)
                        with open(dest_path, 'w', encoding='utf-8') as f:
                            f.write(content)
                        print(f"    ✅ XML: {clean_path}")
                        files_processed += 1
                    
                    # Handle other files
                    else:
                        dest_path = f"app/src/main/{clean_path}"
                        os.makedirs(os.path.dirname(dest_path), exist_ok=True)
                        with open(dest_path, 'w', encoding='utf-8') as f:
                            f.write(content)
                        print(f"    ✅ File: {clean_path}")
                        files_processed += 1
                
                print(f"\n✅ Processed {files_processed} user files")
                
                # Mark that user files were processed
                with open('/tmp/user_files_processed', 'w') as f:
                    f.write('true')
                    
            except Exception as e:
                print(f"⚠️ Error processing payload: {e}")
                print("Will use default template instead")
            PYTHON_SCRIPT
            
            if [ -f /tmp/user_files_processed ]; then
              USER_FILES_EXIST=true
              echo "✅ User files successfully integrated"
            fi
          fi
          
          # If no user files or missing critical files, create defaults
          if [ "$USER_FILES_EXIST" = false ] || [ ! -f "app/src/main/java/$PKG_PATH/MainActivity.java" ]; then
            echo "📝 Creating default MainActivity (no user Java file found)"
            cat > app/src/main/java/$PKG_PATH/MainActivity.java << EOF
            package $PKG;
            
            import android.os.Bundle;
            import android.widget.TextView;
            import androidx.appcompat.app.AppCompatActivity;
            
            public class MainActivity extends AppCompatActivity {
                @Override
                protected void onCreate(Bundle savedInstanceState) {
                    super.onCreate(savedInstanceState);
                    setContentView(R.layout.activity_main);
                    TextView textView = findViewById(R.id.textView);
                    if (textView != null) {
                        textView.setText("Welcome to $APP_NAME");
                    }
                }
            }
            EOF
          fi
          
          if [ "$USER_FILES_EXIST" = false ] || [ ! -f "app/src/main/res/layout/activity_main.xml" ]; then
            echo "📝 Creating default layout (no user layout found)"
            cat > app/src/main/res/layout/activity_main.xml << 'EOF'
            <?xml version="1.0" encoding="utf-8"?>
            <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:orientation="vertical"
                android:gravity="center"
                android:padding="24dp">
                <TextView
                    android:id="@+id/textView"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Hello World!"
                    android:textSize="24sp"/>
            </LinearLayout>
            EOF
          fi
          
          if [ "$USER_FILES_EXIST" = false ] || [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "📝 Creating default AndroidManifest"
            cat > app/src/main/AndroidManifest.xml << EOF
            <?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                <application
                    android:allowBackup="true"
                    android:icon="@mipmap/ic_launcher"
                    android:label="$APP_NAME"
                    android:theme="@style/AppTheme">
                    <activity
                        android:name=".MainActivity"
                        android:exported="true">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                    </activity>
                </application>
            </manifest>
            EOF
          fi
          
          # Always create these if missing
          if [ ! -f "app/src/main/res/values/strings.xml" ]; then
            cat > app/src/main/res/values/strings.xml << EOF
            <?xml version="1.0" encoding="utf-8"?>
            <resources>
                <string name="app_name">$APP_NAME</string>
            </resources>
            EOF
          fi
          
          if [ ! -f "app/src/main/res/values/colors.xml" ]; then
            cat > app/src/main/res/values/colors.xml << 'EOF'
            <?xml version="1.0" encoding="utf-8"?>
            <resources>
                <color name="colorPrimary">#6200EE</color>
                <color name="colorPrimaryDark">#3700B3</color>
                <color name="colorAccent">#03DAC6</color>
            </resources>
            EOF
          fi
          
          if [ ! -f "app/src/main/res/values/themes.xml" ]; then
            cat > app/src/main/res/values/themes.xml << 'EOF'
            <?xml version="1.0" encoding="utf-8"?>
            <resources>
                <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                    <item name="colorPrimary">@color/colorPrimary</item>
                    <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                    <item name="colorAccent">@color/colorAccent</item>
                </style>
            </resources>
            EOF
          fi
          
          echo "✅ Project generation complete"

      - name: Generate App Icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          
          # Check if user sent custom icon
          ICON_B64="${{ github.event.client_payload.icon }}"
          
          if [ -n "$ICON_B64" ] && [ "$ICON_B64" != "null" ] && [ "$ICON_B64" != "" ]; then
            echo "$ICON_B64" | base64 -d > /tmp/icon.png
            if file /tmp/icon.png | grep -q 'PNG image'; then
              echo "✅ Custom icon detected, generating densities..."
              for size in 48 72 96 144 192; do
                case $size in
                  48) density="mdpi" ;;
                  72) density="hdpi" ;;
                  96) density="xhdpi" ;;
                  144) density="xxhdpi" ;;
                  192) density="xxxhdpi" ;;
                esac
                convert /tmp/icon.png -resize ${size}x${size} app/src/main/res/mipmap-${density}/ic_launcher.png
                cp app/src/main/res/mipmap-${density}/ic_launcher.png app/src/main/res/mipmap-${density}/ic_launcher_round.png
              done
              echo "✅ Custom icons applied"
              exit 0
            fi
          fi
          
          # Fallback icons
          for size in 48 72 96 144 192; do
            case $size in
              48) density="mdpi" ;;
              72) density="hdpi" ;;
              96) density="xhdpi" ;;
              144) density="xxhdpi" ;;
              192) density="xxxhdpi" ;;
            esac
            convert -size ${size}x${size} xc:#6200EE -gravity center \
              -font Helvetica -pointsize $((size/3)) -fill white -annotate 0 "App" \
              app/src/main/res/mipmap-${density}/ic_launcher.png 2>/dev/null || true
            cp app/src/main/res/mipmap-${density}/ic_launcher.png app/src/main/res/mipmap-${density}/ic_launcher_round.png 2>/dev/null || true
          done

      - name: Create build.gradle
        env:
          PKG: ${{ steps.pkg.outputs.package_name }}
        run: |
          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "$PKG"
              compileSdk 34

              defaultConfig {
                  applicationId "$PKG"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF
          
          touch app/proguard-rules.pro

      - name: Create Gradle Settings
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "UserApp"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          android.enableJetifier=false
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Verify User Files
        run: |
          echo "=== VERIFICATION ==="
          echo "Package: ${{ steps.pkg.outputs.package_name }}"
          echo ""
          echo "Java files:"
          find app/src/main/java -name "*.java" -type f
          echo ""
          echo "Layout files:"
          find app/src/main/res/layout -name "*.xml" -type f
          echo ""
          echo "Manifest:"
          cat app/src/main/AndroidManifest.xml
          echo ""
          echo "✅ User files will be compiled with priority"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: user-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: user-build-${{ github.run_number }}
          name: User App Build - ${{ steps.app.outputs.app_name }}
          body: |
            ## 🎉 App Built Successfully with Your UI!
            
            **App Name:** ${{ steps.app.outputs.app_name }}
            **Package:** ${{ steps.pkg.outputs.package_name }}
            
            ### ✅ Your UI has been compiled!
            The APK contains your custom layout and Java code.
            
            ### Download
            APK file attached below - Install and test your app!
          files: |
            app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
