name: CodeForge Pro Builder (Self-Healing)

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Clean and Initialize Android Structure
      run: |
        rm -rf app settings.gradle build.gradle gradle.properties gradle wrapper 2>/dev/null || true
        mkdir -p app/src/main/java
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/mipmap-mdpi
        mkdir -p app/src/main/res/mipmap-xhdpi
        mkdir -p app/src/main/res/mipmap-xxhdpi
        mkdir -p app/src/main/res/mipmap-xxxhdpi

    - name: Process Java Files with Package Structure
      run: |
        PKG_NAME="${{ github.event.client_payload.package_name }}"
        if [ -z "$PKG_NAME" ]; then PKG_NAME="com.example.app"; fi
        DIR_PATH=$(echo "$PKG_NAME" | tr '.' '/')
        TARGET_DIR="app/src/main/java/$DIR_PATH"
        mkdir -p "$TARGET_DIR"
        
        if [ -d "build_assets" ]; then
          # Copy Java files
          find build_assets/ -name "*.java" -exec cp {} "$TARGET_DIR/" \; 2>/dev/null || true
          
          # If no Java files found, create default MainActivity
          if [ -z "$(ls -A "$TARGET_DIR" 2>/dev/null)" ]; then
            cat > "$TARGET_DIR/MainActivity.java" << 'JAVAEOF'
package PKG_PLACEHOLDER;

import android.os.Bundle;
import android.widget.TextView;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);
        TextView tv = findViewById(R.id.textView);
        tv.setText("Hello World!");
    }
}
JAVAEOF
            sed -i "s/PKG_PLACEHOLDER/$PKG_NAME/g" "$TARGET_DIR/MainActivity.java"
          fi
        fi

    - name: Setup Layout Files (Auto-create missing)
      run: |
        # activity_main.xml
        if [ -f "build_assets/activity_main.xml" ]; then
          cp build_assets/activity_main.xml app/src/main/res/layout/
        else
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:orientation="vertical"
    android:gravity="center"
    android:padding="24dp">
    <TextView
        android:id="@+id/textView"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="Hello World!"
        android:textSize="24sp"
        android:textStyle="bold" />
    <Button
        android:id="@+id/button"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:layout_marginTop="24dp"
        android:text="Click Me" />
</LinearLayout>
EOF
        fi
        
        # Copy any other layout files from build_assets
        if [ -d "build_assets" ]; then
          find build_assets/ -name "*.xml" -path "*/layout/*" -exec cp {} app/src/main/res/layout/ \; 2>/dev/null || true
        fi

    - name: Setup Drawable Resources (Auto-create missing)
      run: |
        # Auto-create ALL missing drawables that might be referenced
        cat > app/src/main/res/drawable/button_rounded.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<shape xmlns:android="http://schemas.android.com/apk/res/android"
    android:shape="rectangle">
    <solid android:color="@color/accent" />
    <corners android:radius="30dp" />
    <padding android:left="20dp" android:top="12dp" 
             android:right="20dp" android:bottom="12dp" />
</shape>
EOF

        cat > app/src/main/res/drawable/gradient_background.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<shape xmlns:android="http://schemas.android.com/apk/res/android"
    android:shape="rectangle">
    <gradient
        android:startColor="@color/primary"
        android:endColor="@color/primary_dark"
        android:angle="45" />
    <corners android:radius="8dp" />
</shape>
EOF

        cat > app/src/main/res/drawable/ic_launcher_background.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<shape xmlns:android="http://schemas.android.com/apk/res/android"
    android:shape="rectangle">
    <solid android:color="@color/primary" />
</shape>
EOF

        # Copy any user-provided drawables
        if [ -d "build_assets/drawable" ]; then
          cp -r build_assets/drawable/*.xml app/src/main/res/drawable/ 2>/dev/null || true
        fi

    - name: Setup Values Resources (Auto-create missing)
      run: |
        # colors.xml
        if [ -f "build_assets/colors.xml" ]; then
          cp build_assets/colors.xml app/src/main/res/values/
        else
          cat > app/src/main/res/values/colors.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="primary">#6200EE</color>
    <color name="primary_dark">#3700B3</color>
    <color name="accent">#03DAC6</color>
    <color name="background">#F5F5F5</color>
    <color name="text_primary">#212121</color>
    <color name="white">#FFFFFF</color>
    <color name="black">#000000</color>
    <color name="error">#B00020</color>
    <color name="success">#4CAF50</color>
    <color name="warning">#FFC107</color>
</resources>
EOF
        fi
        
        # strings.xml
        APP_NAME="${{ github.event.client_payload.app_name }}"
        if [ -z "$APP_NAME" ]; then APP_NAME="MyApp"; fi
        if [ -f "build_assets/strings.xml" ]; then
          cp build_assets/strings.xml app/src/main/res/values/
        else
          cat > app/src/main/res/values/strings.xml << EOF
<resources>
    <string name="app_name">$APP_NAME</string>
    <string name="hello_world">Hello World!</string>
</resources>
EOF
        fi
        
        # themes.xml
        if [ -f "build_assets/themes.xml" ]; then
          cp build_assets/themes.xml app/src/main/res/values/
        else
          cat > app/src/main/res/values/themes.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
        <item name="colorPrimary">@color/primary</item>
        <item name="colorPrimaryDark">@color/primary_dark</item>
        <item name="colorAccent">@color/accent</item>
    </style>
</resources>
EOF
        fi

    - name: Setup AndroidManifest.xml (Auto-fix common issues)
      run: |
        PKG_NAME="${{ github.event.client_payload.package_name }}"
        if [ -z "$PKG_NAME" ]; then PKG_NAME="com.example.app"; fi
        APP_NAME="${{ github.event.client_payload.app_name }}"
        if [ -z "$APP_NAME" ]; then APP_NAME="MyApp"; fi
        
        if [ -f "build_assets/AndroidManifest.xml" ]; then
          # Auto-fix: remove roundIcon if present
          sed -i 's/ android:roundIcon="[^"]*"//g' build_assets/AndroidManifest.xml
          # Auto-fix: add package if missing
          if ! grep -q 'package=' build_assets/AndroidManifest.xml; then
            sed -i "s/<manifest /<manifest package=\"$PKG_NAME\" /" build_assets/AndroidManifest.xml
          fi
          cp build_assets/AndroidManifest.xml app/src/main/
        else
          cat > app/src/main/AndroidManifest.xml << EOF
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="$PKG_NAME">
    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="$APP_NAME"
        android:theme="@style/AppTheme">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF
        fi

    - name: Handle App Icon (Auto-generate all densities)
      run: |
        ICON_B64="${{ github.event.client_payload.icon }}"
        
        # Create placeholder icon using ImageMagick if available, otherwise use base64
        create_icon() {
          local size=$1
          local density=$2
          local output="app/src/main/res/mipmap-${density}/ic_launcher.png"
          
          if command -v convert &> /dev/null; then
            convert -size ${size}x${size} xc:'#6200EE' \
              -gravity center -pointsize $((size/5)) -fill white -annotate 0 "APP" \
              "$output" 2>/dev/null || true
          fi
        }
        
        # If user provided icon
        if [ ! -z "$ICON_B64" ]; then
          echo "$ICON_B64" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          # Copy to all densities
          for density in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
               app/src/main/res/mipmap-${density}/ic_launcher.png 2>/dev/null || true
          done
        else
          # Create placeholder icons for all densities
          for density in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            case $density in
              mdpi) size=48 ;;
              hdpi) size=72 ;;
              xhdpi) size=96 ;;
              xxhdpi) size=144 ;;
              xxxhdpi) size=192 ;;
            esac
            create_icon $size $density
          done
        fi
        
        # Create round icon copy (same as regular icon)
        for density in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
          if [ -f "app/src/main/res/mipmap-${density}/ic_launcher.png" ]; then
            cp "app/src/main/res/mipmap-${density}/ic_launcher.png" \
               "app/src/main/res/mipmap-${density}/ic_launcher_round.png" 2>/dev/null || true
          fi
        done

    - name: Generate Gradle Build Files (Compatible versions)
      run: |
        PKG_NAME="${{ github.event.client_payload.package_name }}"
        if [ -z "$PKG_NAME" ]; then PKG_NAME="com.example.app"; fi
        APP_NAME="${{ github.event.client_payload.app_name }}"
        if [ -z "$APP_NAME" ]; then APP_NAME="MyApp"; fi
        
        cat <<EOF > gradle.properties
android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
EOF

        cat <<EOF > settings.gradle
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "$APP_NAME"
include ':app'
EOF

        cat <<EOF > build.gradle
plugins {
    id 'com.android.application' version '8.1.4' apply false
    id 'com.android.library' version '8.1.4' apply false
}
EOF

        cat <<EOF > app/build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace "$PKG_NAME"
    compileSdk 34

    defaultConfig {
        applicationId "$PKG_NAME"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
EOF

    - name: Setup Gradle Wrapper
      run: |
        # Create gradle wrapper manually (avoid download issues)
        mkdir -p gradle/wrapper
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
        # Create gradlew script
        cat > gradlew << 'EOF'
#!/bin/sh
exec java -cp "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
EOF
        chmod +x gradlew
        # Download gradle-wrapper.jar
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradle/wrapper/gradle-wrapper.jar 2>/dev/null || echo "Wrapper jar download skipped"

    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace --no-daemon || {
          echo "Build failed, trying with debug build..."
          ./gradlew assembleDebug --stacktrace --no-daemon
        }
        ./gradlew bundleRelease --stacktrace --no-daemon || {
          echo "Bundle failed, continuing..."
        }

    - name: Clear Prior Releases
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete latest-release --yes || true
        git push --delete origin latest-release || true

    - name: Deploy Production Artifacts
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest-release
        name: "Latest Production Build"
        draft: false
        prerelease: false
        files: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/bundle/release/app-release.aab
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ github.token }}
