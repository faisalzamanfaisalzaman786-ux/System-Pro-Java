name: Build APK with Dynamic Package

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.example.app'
      app_name:
        description: 'App Name'
        required: false
        default: 'MyApp'
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get Package Name
        id: pkg
        run: |
          PKG="${{ github.event.client_payload.package_name }}"
          if [ -z "$PKG" ] || [ "$PKG" = "null" ]; then
            PKG="${{ github.event.inputs.package_name }}"
          fi
          if [ -z "$PKG" ] || [ "$PKG" = "null" ]; then
            PKG="com.example.app"
          fi
          echo "name=$PKG" >> $GITHUB_OUTPUT
          echo "path=$(echo $PKG | tr '.' '/')" >> $GITHUB_OUTPUT

      - name: Get App Name
        id: app
        run: |
          APP="${{ github.event.client_payload.app_name }}"
          if [ -z "$APP" ] || [ "$APP" = "null" ]; then
            APP="${{ github.event.inputs.app_name }}"
          fi
          if [ -z "$APP" ] || [ "$APP" = "null" ]; then
            APP="MyApp"
          fi
          echo "name=$APP" >> $GITHUB_OUTPUT

      - name: Create Directory Structure
        env:
          PKG_PATH: ${{ steps.pkg.outputs.path }}
        run: |
          rm -rf app
          mkdir -p app/src/main/java/$PKG_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

      - name: Create MainActivity.java with Correct Package
        env:
          PKG: ${{ steps.pkg.outputs.name }}
          PKG_PATH: ${{ steps.pkg.outputs.path }}
        run: |
          cat > app/src/main/java/$PKG_PATH/MainActivity.java << JAVA_EOF
          package $PKG;
          
          import android.os.Bundle;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  TextView textView = findViewById(R.id.textView);
                  textView.setText("Hello World!");
              }
          }
          JAVA_EOF

      - name: Create activity_main.xml
        run: |
          cat > app/src/main/res/layout/activity_main.xml << XML_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">
              <TextView
                  android:id="@+id/textView"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Hello World!"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:textColor="#6200EE" />
          </LinearLayout>
          XML_EOF

      - name: Create strings.xml with App Name
        env:
          APP_NAME: ${{ steps.app.outputs.name }}
        run: |
          cat > app/src/main/res/values/strings.xml << XML_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">$APP_NAME</string>
          </resources>
          XML_EOF

      - name: Create colors.xml
        run: |
          cat > app/src/main/res/values/colors.xml << XML_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#6200EE</color>
              <color name="colorPrimaryDark">#3700B3</color>
              <color name="colorAccent">#03DAC6</color>
          </resources>
          XML_EOF

      - name: Create themes.xml
        run: |
          cat > app/src/main/res/values/themes.xml << XML_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          XML_EOF

      - name: Create AndroidManifest.xml
        env:
          APP_NAME: ${{ steps.app.outputs.name }}
        run: |
          cat > app/src/main/AndroidManifest.xml << XML_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="$APP_NAME"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML_EOF

      - name: Create build.gradle with Correct Package
        env:
          PKG: ${{ steps.pkg.outputs.name }}
        run: |
          cat > app/build.gradle << GRADLE_EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "$PKG"
              compileSdk 34

              defaultConfig {
                  applicationId "$PKG"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
          }
          GRADLE_EOF
          touch app/proguard-rules.pro

      - name: Create Gradle Files
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyApp"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          android.enableJetifier=false
          EOF

      - name: Generate Icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          
          for size in 48 72 96 144 192; do
            case $size in
              48) d=mdpi ;;
              72) d=hdpi ;;
              96) d=xhdpi ;;
              144) d=xxhdpi ;;
              192) d=xxxhdpi ;;
            esac
            convert -size ${size}x${size} xc:#6200EE -gravity center \
              -font Helvetica -pointsize $((size/3)) -fill white -annotate 0 "A" \
              app/src/main/res/mipmap-$d/ic_launcher.png 2>/dev/null || true
          done

      - name: Verify All Files
        run: |
          echo "=== Verification ==="
          echo "Package: ${{ steps.pkg.outputs.name }}"
          echo "App Name: ${{ steps.app.outputs.name }}"
          echo ""
          echo "Java file package:"
          find app/src/main/java -name "*.java" -exec head -1 {} \;
          echo ""
          echo "build.gradle namespace:"
          grep "namespace" app/build.gradle
          echo ""
          echo "strings.xml:"
          grep "app_name" app/src/main/res/values/strings.xml
          echo ""
          echo "AndroidManifest label:"
          grep "android:label" app/src/main/AndroidManifest.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            ## Build Successful!
            
            **Package:** ${{ steps.pkg.outputs.name }}
            **App Name:** ${{ steps.app.outputs.name }}
            
            Download APK below.
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
