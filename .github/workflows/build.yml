name: Build APK

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Simple Counter App
        run: |
          # Package name from payload
          PKG="com.counter.app"
          APP_NAME="Counter App"
          
          # Create directories
          mkdir -p app/src/main/java/$(echo $PKG | tr '.' '/')
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
          # MainActivity.java
          cat > app/src/main/java/$(echo $PKG | tr '.' '/')/MainActivity.java << 'EOF'
          package com.counter.app;
          
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          
          public class MainActivity extends AppCompatActivity {
              private TextView counterText;
              private Button btnPlus, btnMinus, btnReset;
              private int count = 0;
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  counterText = findViewById(R.id.counterText);
                  btnPlus = findViewById(R.id.btnPlus);
                  btnMinus = findViewById(R.id.btnMinus);
                  btnReset = findViewById(R.id.btnReset);
                  
                  updateCounter();
                  
                  btnPlus.setOnClickListener(v -> { count++; updateCounter(); });
                  btnMinus.setOnClickListener(v -> { count--; updateCounter(); });
                  btnReset.setOnClickListener(v -> { count = 0; updateCounter(); });
              }
              
              private void updateCounter() {
                  counterText.setText(String.valueOf(count));
              }
          }
          EOF
          
          # activity_main.xml
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">
              
              <TextView
                  android:id="@+id/counterText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="0"
                  android:textSize="80sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="32dp" />
              
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal">
                  
                  <Button
                      android:id="@+id/btnMinus"
                      android:layout_width="0dp"
                      android:layout_height="60dp"
                      android:layout_weight="1"
                      android:text="-"
                      android:textSize="32sp"
                      android:layout_marginEnd="8dp" />
                  
                  <Button
                      android:id="@+id/btnReset"
                      android:layout_width="0dp"
                      android:layout_height="60dp"
                      android:layout_weight="1"
                      android:text="Reset"
                      android:textSize="16sp"
                      android:layout_marginStart="4dp"
                      android:layout_marginEnd="4dp" />
                  
                  <Button
                      android:id="@+id/btnPlus"
                      android:layout_width="0dp"
                      android:layout_height="60dp"
                      android:layout_weight="1"
                      android:text="+"
                      android:textSize="32sp"
                      android:layout_marginStart="8dp" />
                  
              </LinearLayout>
          </LinearLayout>
          EOF
          
          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="${PKG}">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="${APP_NAME}"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # build.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android { compileSdk 34 defaultConfig { minSdk 21 targetSdk 34 versionCode 1 versionName '1.0' } }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          
          cat > settings.gradle << 'EOF'
          rootProject.name = "App"
          include ':app'
          EOF
          
          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          echo "✅ Simple Counter App created"

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
