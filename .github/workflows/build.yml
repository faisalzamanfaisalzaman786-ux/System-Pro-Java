name: CodeForge Pro Builder

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y android-sdk
        echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV

    - name: Create Android Project Structure
      run: |
        rm -rf app build.gradle settings.gradle gradle.properties 2>/dev/null || true
        mkdir -p app/src/main/java
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/mipmap-mdpi
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/mipmap-xhdpi
        mkdir -p app/src/main/res/mipmap-xxhdpi
        mkdir -p app/src/main/res/mipmap-xxxhdpi

    - name: Process Java Files
      run: |
        PKG_NAME="${{ github.event.client_payload.package_name }}"
        if [ -z "$PKG_NAME" ]; then PKG_NAME="com.example.app"; fi
        DIR_PATH=$(echo "$PKG_NAME" | tr '.' '/')
        TARGET_DIR="app/src/main/java/$DIR_PATH"
        mkdir -p "$TARGET_DIR"
        
        if [ -d "build_assets" ]; then
          find build_assets/ -maxdepth 1 -name "*.java" -exec cp {} "$TARGET_DIR/" \; 2>/dev/null || true
        fi
        
        if [ -z "$(ls -A "$TARGET_DIR" 2>/dev/null)" ]; then
          cat > "$TARGET_DIR/MainActivity.java" << JAVAEOF
package $PKG_NAME;

import android.os.Bundle;
import android.widget.TextView;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);
        TextView tv = findViewById(R.id.textView);
        tv.setText("Hello World!");
    }
}
JAVAEOF
        fi

    - name: Process Layout Files
      run: |
        if [ -f "build_assets/activity_main.xml" ]; then
          cp build_assets/activity_main.xml app/src/main/res/layout/
        else
          cat > app/src/main/res/layout/activity_main.xml << 'XMLEOF'
<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:orientation="vertical"
    android:gravity="center"
    android:padding="24dp"
    android:background="#F5F5F5">
    <TextView
        android:id="@+id/textView"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="Hello World!"
        android:textSize="24sp"
        android:textStyle="bold"
        android:textColor="#212121" />
</LinearLayout>
XMLEOF
        fi

    - name: Process Resource Files
      run: |
        # Colors
        if [ -f "build_assets/colors.xml" ]; then
          cp build_assets/colors.xml app/src/main/res/values/
        else
          cat > app/src/main/res/values/colors.xml << 'COLOREOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="colorPrimary">#6200EE</color>
    <color name="colorPrimaryDark">#3700B3</color>
    <color name="colorAccent">#03DAC6</color>
    <color name="background">#F5F5F5</color>
    <color name="text_primary">#212121</color>
    <color name="white">#FFFFFF</color>
    <color name="black">#000000</color>
</resources>
COLOREOF
        fi
        
        # Strings
        APP_NAME="${{ github.event.client_payload.app_name }}"
        if [ -z "$APP_NAME" ]; then APP_NAME="MyApp"; fi
        if [ -f "build_assets/strings.xml" ]; then
          cp build_assets/strings.xml app/src/main/res/values/
        else
          cat > app/src/main/res/values/strings.xml << STRINGEOF
<resources>
    <string name="app_name">$APP_NAME</string>
    <string name="hello_world">Hello World!</string>
</resources>
STRINGEOF
        fi
        
        # Themes
        if [ -f "build_assets/themes.xml" ]; then
          cp build_assets/themes.xml app/src/main/res/values/
        else
          cat > app/src/main/res/values/themes.xml << 'THEMEEOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
        <item name="colorPrimary">@color/colorPrimary</item>
        <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
        <item name="colorAccent">@color/colorAccent</item>
    </style>
</resources>
THEMEEOF
        fi

    - name: Process AndroidManifest
      run: |
        PKG_NAME="${{ github.event.client_payload.package_name }}"
        if [ -z "$PKG_NAME" ]; then PKG_NAME="com.example.app"; fi
        APP_NAME="${{ github.event.client_payload.app_name }}"
        if [ -z "$APP_NAME" ]; then APP_NAME="MyApp"; fi
        
        if [ -f "build_assets/AndroidManifest.xml" ]; then
          sed -i 's/ android:roundIcon="[^"]*"//g' build_assets/AndroidManifest.xml
          cp build_assets/AndroidManifest.xml app/src/main/
        else
          cat > app/src/main/AndroidManifest.xml << MANIFESTEOF
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="$PKG_NAME">
    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="$APP_NAME"
        android:theme="@style/AppTheme">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
MANIFESTEOF
        fi

    - name: Handle App Icon
      run: |
        ICON_B64="${{ github.event.client_payload.icon }}"
        
        if [ ! -z "$ICON_B64" ]; then
          echo "$ICON_B64" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        else
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        fi
        
        for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
          if [ "$density" != "xxxhdpi" ]; then
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-${density}/ic_launcher.png 2>/dev/null || true
          fi
          cp app/src/main/res/mipmap-${density}/ic_launcher.png app/src/main/res/mipmap-${density}/ic_launcher_round.png 2>/dev/null || true
        done

    - name: Generate Gradle Files
      run: |
        PKG_NAME="${{ github.event.client_payload.package_name }}"
        if [ -z "$PKG_NAME" ]; then PKG_NAME="com.example.app"; fi
        
        cat > gradle.properties << 'PROPEOF'
android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
PROPEOF

        cat > settings.gradle << 'SETEOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "CodeForgeApp"
include ':app'
SETEOF

        cat > build.gradle << 'BUILDEOF'
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'com.android.library' version '8.2.2' apply false
}
BUILDEOF

        cat > app/build.gradle << APPEOF
plugins {
    id 'com.android.application'
}

android {
    namespace "$PKG_NAME"
    compileSdk 34

    defaultConfig {
        applicationId "$PKG_NAME"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'
}
APPEOF

    - name: Setup Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        cat > gradle/wrapper/gradle-wrapper.properties << 'WRAPEOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
WRAPEOF
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
        echo '#!/bin/sh' > gradlew
        echo 'exec java -cp "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
        chmod +x gradlew

    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace --no-daemon

    - name: Deploy Artifacts
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest-release
        name: "Latest Build"
        draft: false
        prerelease: false
        files: |
          app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ github.token }}
