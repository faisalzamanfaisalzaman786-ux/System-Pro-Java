name: Build Android APK + AAB (Release Only)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write
  actions: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get Package Name
        id: pkg
        run: |
          PKG="${{ github.event.client_payload.package_name }}"
          if [ -z "$PKG" ]; then
            PKG="com.systempro.app"
          fi
          PKG=$(echo "$PKG" | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "package_name=$PKG" >> $GITHUB_OUTPUT
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          echo "package_path=$PKG_PATH" >> $GITHUB_OUTPUT

      - name: Get App Name
        id: app
        run: |
          APP_NAME="${{ github.event.client_payload.app_name }}"
          if [ -z "$APP_NAME" ]; then
            APP_NAME="MyApp"
          fi
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

      - name: Create Project Directories
        run: |
          rm -rf app
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/assets

      - name: Decode Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "WARNING: No keystore found, creating debug keystore"
            keytool -genkey -v -keystore keystore.jks -alias release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown" -storepass android -keypass android
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=release" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          else
            KEYSTORE_ABS="$GITHUB_WORKSPACE/keystore.jks"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 -d > "$KEYSTORE_ABS"
            echo "KEYSTORE_PATH=$KEYSTORE_ABS" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Generate Files (Respects Payload, Smart Fallbacks)
        run: |
          cat > payload_files.json << 'EOF'
          ${{ toJson(github.event.client_payload.files) }}
          EOF

          export NEW_PKG="${{ steps.pkg.outputs.package_name }}"
          export APP_NAME="${{ steps.app.outputs.app_name }}"

          cat > generate.py << 'EOF'
          import json
          import os
          import re
          import sys
          import traceback

          def main():
              try:
                  pkg = os.environ.get("NEW_PKG", "com.systempro.app")
                  app_name = os.environ.get("APP_NAME", "MyApp")
                  pkg_path = pkg.replace(".", "/")

                  files = {}
                  payload_file = "payload_files.json"
                  if os.path.exists(payload_file):
                      with open(payload_file, "r") as f:
                          content = f.read().strip()
                          if content:
                              files = json.loads(content)

                  existing = {
                      "java": False,
                      "layout": False,
                      "manifest": False,
                      "strings": False,
                      "colors": False,
                      "themes": False
                  }

                  # ============ PROCESS PAYLOAD FILES ============
                  for path, content in files.items():
                      clean_path = path.strip("/")
                      
                      if clean_path.endswith(".java"):
                          existing["java"] = True
                          content = re.sub(r'^package .*?;', f'package {pkg};', content, flags=re.MULTILINE)
                          if not re.search(r'^package ', content, re.MULTILINE):
                              content = f'package {pkg};\n\n{content}'
                          filename = os.path.basename(clean_path)
                          new_path = f"app/src/main/java/{pkg_path}/{filename}"
                          os.makedirs(os.path.dirname(new_path), exist_ok=True)
                          with open(new_path, "w", encoding="utf-8") as out:
                              out.write(content)
                          print(f"✓ Java: {filename}")
                          
                      elif clean_path.endswith(".xml"):
                          if "AndroidManifest.xml" in clean_path:
                              existing["manifest"] = True
                              new_path = "app/src/main/AndroidManifest.xml"
                              # Only remove package attribute (required for AGP 8+)
                              # NO other changes to respect user's manifest
                              content = re.sub(r'\s+package="[^"]*"', '', content)
                              content = re.sub(r'package="[^"]*"', '', content)
                              os.makedirs(os.path.dirname(new_path), exist_ok=True)
                              with open(new_path, "w", encoding="utf-8") as out:
                                  out.write(content)
                              print(f"✓ AndroidManifest.xml (package attribute removed only)")
                              
                          elif "layout" in clean_path:
                              existing["layout"] = True
                              filename = os.path.basename(clean_path)
                              new_path = f"app/src/main/res/layout/{filename}"
                              os.makedirs(os.path.dirname(new_path), exist_ok=True)
                              with open(new_path, "w", encoding="utf-8") as out:
                                  out.write(content)
                              print(f"✓ Layout: {filename}")
                              
                          elif "values/strings.xml" in clean_path:
                              existing["strings"] = True
                              new_path = "app/src/main/res/values/strings.xml"
                              os.makedirs(os.path.dirname(new_path), exist_ok=True)
                              with open(new_path, "w", encoding="utf-8") as out:
                                  out.write(content)
                              print("✓ strings.xml")
                              
                          elif "values/colors.xml" in clean_path:
                              existing["colors"] = True
                              new_path = "app/src/main/res/values/colors.xml"
                              os.makedirs(os.path.dirname(new_path), exist_ok=True)
                              with open(new_path, "w", encoding="utf-8") as out:
                                  out.write(content)
                              print("✓ colors.xml")
                              
                          elif "values/themes.xml" in clean_path or "values/styles.xml" in clean_path:
                              existing["themes"] = True
                              filename = os.path.basename(clean_path)
                              new_path = f"app/src/main/res/values/{filename}"
                              os.makedirs(os.path.dirname(new_path), exist_ok=True)
                              with open(new_path, "w", encoding="utf-8") as out:
                                  out.write(content)
                              print(f"✓ Theme: {filename}")

                  # ============ FALLBACKS (ONLY IF MISSING IN PAYLOAD) ============
                  
                  # Strings Fallback
                  strings_path = "app/src/main/res/values/strings.xml"
                  if not existing["strings"]:
                      os.makedirs(os.path.dirname(strings_path), exist_ok=True)
                      with open(strings_path, "w", encoding="utf-8") as f:
                          f.write('<?xml version="1.0" encoding="utf-8"?>\n')
                          f.write('<resources>\n')
                          f.write(f'    <string name="app_name">{app_name}</string>\n')
                          f.write('</resources>\n')
                      print("✓ Fallback strings.xml created")

                  # Colors Fallback (Material 3 Template)
                  colors_path = "app/src/main/res/values/colors.xml"
                  if not existing["colors"]:
                      os.makedirs(os.path.dirname(colors_path), exist_ok=True)
                      with open(colors_path, "w", encoding="utf-8") as f:
                          f.write('<?xml version="1.0" encoding="utf-8"?>\n')
                          f.write('<resources>\n')
                          f.write('    <color name="md3_primary">#6200EE</color>\n')
                          f.write('    <color name="md3_primary_dark">#3700B3</color>\n')
                          f.write('    <color name="md3_background">#FFFBFE</color>\n')
                          f.write('    <color name="md3_on_surface">#1C1B1F</color>\n')
                          f.write('    <color name="colorPrimary">#6200EE</color>\n')
                          f.write('    <color name="colorPrimaryDark">#3700B3</color>\n')
                          f.write('    <color name="colorAccent">#03DAC6</color>\n')
                          f.write('    <color name="background">#FFFBFE</color>\n')
                          f.write('    <color name="white">#FFFFFF</color>\n')
                          f.write('    <color name="black">#000000</color>\n')
                          f.write('    <color name="titleColor">#6200EE</color>\n')
                          f.write('    <color name="textColor">#1C1B1F</color>\n')
                          f.write('    <color name="hintColor">#79747E</color>\n')
                          f.write('</resources>\n')
                      print("✓ Fallback colors.xml (Material 3) created")

                  # Themes Fallback
                  themes_path = "app/src/main/res/values/themes.xml"
                  if not existing["themes"]:
                      os.makedirs(os.path.dirname(themes_path), exist_ok=True)
                      with open(themes_path, "w", encoding="utf-8") as f:
                          f.write('<?xml version="1.0" encoding="utf-8"?>\n')
                          f.write('<resources>\n')
                          f.write('    <style name="AppTheme" parent="Theme.MaterialComponents.Light">\n')
                          f.write('        <item name="colorPrimary">@color/md3_primary</item>\n')
                          f.write('        <item name="colorPrimaryDark">@color/md3_primary_dark</item>\n')
                          f.write('        <item name="colorAccent">@color/colorAccent</item>\n')
                          f.write('    </style>\n')
                          f.write('</resources>\n')
                      print("✓ Fallback themes.xml created")

                  # Layout Fallback
                  if not existing["layout"]:
                      layout_path = "app/src/main/res/layout/activity_main.xml"
                      os.makedirs(os.path.dirname(layout_path), exist_ok=True)
                      with open(layout_path, "w", encoding="utf-8") as f:
                          f.write('<?xml version="1.0" encoding="utf-8"?>\n')
                          f.write('<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"\n')
                          f.write('    android:layout_width="match_parent"\n')
                          f.write('    android:layout_height="match_parent"\n')
                          f.write('    android:orientation="vertical"\n')
                          f.write('    android:gravity="center"\n')
                          f.write('    android:background="@color/md3_background"\n')
                          f.write('    android:padding="16dp">\n')
                          f.write('    <TextView\n')
                          f.write('        android:layout_width="wrap_content"\n')
                          f.write('        android:layout_height="wrap_content"\n')
                          f.write('        android:text="Welcome"\n')
                          f.write('        android:textSize="28sp"\n')
                          f.write('        android:textColor="@color/md3_primary"\n')
                          f.write('        android:textStyle="bold"\n')
                          f.write('        android:layout_marginBottom="20dp"/>\n')
                          f.write('    <Button\n')
                          f.write('        android:id="@+id/clickButton"\n')
                          f.write('        android:layout_width="wrap_content"\n')
                          f.write('        android:layout_height="wrap_content"\n')
                          f.write('        android:text="CLICK ME"\n')
                          f.write('        android:textColor="@color/white"\n')
                          f.write('        android:backgroundTint="@color/md3_primary"\n')
                          f.write('        android:padding="12dp"/>\n')
                          f.write('    <TextView\n')
                          f.write('        android:id="@+id/counterText"\n')
                          f.write('        android:layout_width="wrap_content"\n')
                          f.write('        android:layout_height="wrap_content"\n')
                          f.write('        android:text="Button clicked: 0 times"\n')
                          f.write('        android:textSize="18sp"\n')
                          f.write('        android:textColor="@color/md3_on_surface"\n')
                          f.write('        android:layout_marginTop="20dp"/>\n')
                          f.write('</LinearLayout>\n')
                      print("✓ Fallback layout created")

                  # Java MainActivity Fallback
                  if not existing["java"]:
                      java_dir = f"app/src/main/java/{pkg_path}"
                      os.makedirs(java_dir, exist_ok=True)
                      java_path = f"{java_dir}/MainActivity.java"
                      with open(java_path, "w", encoding="utf-8") as f:
                          f.write(f'package {pkg};\n\n')
                          f.write('import android.os.Bundle;\n')
                          f.write('import android.view.View;\n')
                          f.write('import android.widget.Button;\n')
                          f.write('import android.widget.TextView;\n')
                          f.write('import androidx.appcompat.app.AppCompatActivity;\n\n')
                          f.write('public class MainActivity extends AppCompatActivity {\n')
                          f.write('    private int counter = 0;\n')
                          f.write('    private TextView counterText;\n')
                          f.write('    private Button clickButton;\n\n')
                          f.write('    @Override\n')
                          f.write('    protected void onCreate(Bundle savedInstanceState) {\n')
                          f.write('        super.onCreate(savedInstanceState);\n')
                          f.write('        setContentView(R.layout.activity_main);\n\n')
                          f.write('        counterText = findViewById(R.id.counterText);\n')
                          f.write('        clickButton = findViewById(R.id.clickButton);\n\n')
                          f.write('        clickButton.setOnClickListener(new View.OnClickListener() {\n')
                          f.write('            @Override\n')
                          f.write('            public void onClick(View v) {\n')
                          f.write('                counter++;\n')
                          f.write('                counterText.setText("Button clicked: " + counter + " times");\n')
                          f.write('            }\n')
                          f.write('        });\n')
                          f.write('    }\n')
                          f.write('}\n')
                      print("✓ Fallback MainActivity.java created")

                  # Manifest Fallback (ONLY if not in payload)
                  manifest_path = "app/src/main/AndroidManifest.xml"
                  if not existing["manifest"]:
                      with open(manifest_path, "w", encoding="utf-8") as f:
                          f.write('<?xml version="1.0" encoding="utf-8"?>\n')
                          f.write('<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n')
                          f.write('    <uses-permission android:name="android.permission.INTERNET"/>\n')
                          f.write('    <application\n')
                          f.write('        android:allowBackup="true"\n')
                          f.write('        android:icon="@mipmap/ic_launcher"\n')
                          f.write('        android:label="@string/app_name"\n')
                          f.write('        android:theme="@style/AppTheme"\n')
                          f.write('        android:supportsRtl="true">\n')
                          f.write('        <activity android:name=".MainActivity" android:exported="true">\n')
                          f.write('            <intent-filter>\n')
                          f.write('                <action android:name="android.intent.action.MAIN"/>\n')
                          f.write('                <category android:name="android.intent.category.LAUNCHER"/>\n')
                          f.write('            </intent-filter>\n')
                          f.write('        </activity>\n')
                          f.write('    </application>\n')
                          f.write('</manifest>\n')
                      print("✓ Fallback AndroidManifest.xml created")

                  print("\n✅ Project generation completed successfully")
                  print("   (Payload files respected, fallbacks used only for missing files)")

              except Exception as e:
                  print(f"❌ Error: {e}")
                  traceback.print_exc()
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          EOF

          python3 generate.py

      - name: Generate App Icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true
          
          ICON_B64="${{ github.event.client_payload.icon }}"
          
          if [ -n "$ICON_B64" ] && [ "$ICON_B64" != "null" ] && [ "$ICON_B64" != "" ]; then
            echo "$ICON_B64" | base64 -d > /tmp/icon.png
            if file /tmp/icon.png | grep -q 'PNG image'; then
              echo "Custom icon detected, generating all densities..."
              convert /tmp/icon.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
              cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
              convert /tmp/icon.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
              cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
              convert /tmp/icon.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
              cp app/src/main/res/mipmap-xhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
              convert /tmp/icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
              cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
              convert /tmp/icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
              echo "Custom icon applied successfully"
              exit 0
            fi
          fi
          
          echo "Generating fallback icons..."
          for size in 48 72 96 144 192; do
            case $size in
              48) density="mdpi" ;;
              72) density="hdpi" ;;
              96) density="xhdpi" ;;
              144) density="xxhdpi" ;;
              192) density="xxxhdpi" ;;
            esac
            convert -size ${size}x${size} xc:#6200EE -gravity center \
              -font Helvetica -pointsize $((size/3)) -fill white -annotate 0 "A" \
              app/src/main/res/mipmap-${density}/ic_launcher.png 2>/dev/null || true
            cp app/src/main/res/mipmap-${density}/ic_launcher.png app/src/main/res/mipmap-${density}/ic_launcher_round.png 2>/dev/null || true
          done
          echo "Fallback icons generated"

      - name: Create build.gradle
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          
          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "${PKG}"
              compileSdk 34

              defaultConfig {
                  applicationId "${PKG}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  multiDexEnabled true
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH") ?: "none")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }

              buildFeatures {
                  buildConfig true
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          EOF
          
          cat > app/proguard-rules.pro << 'EOF'
          -keep class * extends androidx.appcompat.app.AppCompatActivity
          -keepattributes Signature
          EOF
          
          echo "build.gradle created"

      - name: Create Gradle Settings
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AppBuilder"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          android.enableJetifier=false
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Clean Project
        run: ./gradlew clean

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-release
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
