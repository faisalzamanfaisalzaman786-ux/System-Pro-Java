name: Build Android APK + AAB (Release Only)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.systempro.app'
        type: string
      app_name:
        description: 'App Name'
        required: false
        default: 'MyApp'
        type: string
      icon:
        description: 'Icon Base64'
        required: false
        type: string
      files:
        description: 'Project Files JSON'
        required: false
        type: string
  
  # IMPORTANT: Only trigger on specific event type, NOT on push
  repository_dispatch:
    types: [system_pro_build]  # Changed from trigger_b64_build to avoid auto triggers

# Prevent multiple concurrent builds
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=false"

jobs:
  build:
    # Add condition to prevent auto triggers from file pushes
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'repository_dispatch' && github.event.action == 'system_pro_build')
    
    runs-on: ubuntu-latest

    steps:
      - name: Wait for previous builds to complete
        uses: softprops/turnstyle@v1
        with:
          poll-interval-seconds: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get Package Name
        id: pkg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PKG="${{ github.event.inputs.package_name }}"
          else
            PKG="${{ github.event.client_payload.package_name }}"
          fi
          if [ -z "$PKG" ]; then
            PKG="com.systempro.app"
          fi
          PKG=$(echo "$PKG" | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "package_name=$PKG" >> $GITHUB_OUTPUT
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          echo "package_path=$PKG_PATH" >> $GITHUB_OUTPUT

      - name: Get App Name
        id: app
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            APP_NAME="${{ github.event.inputs.app_name }}"
          else
            APP_NAME="${{ github.event.client_payload.app_name }}"
          fi
          if [ -z "$APP_NAME" ]; then
            APP_NAME="MyApp"
          fi
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

      - name: Get Icon and Files
        id: payload
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "icon=${{ github.event.inputs.icon }}" >> $GITHUB_OUTPUT
            echo "files=${{ github.event.inputs.files }}" >> $GITHUB_OUTPUT
          else
            echo "icon=${{ github.event.client_payload.icon }}" >> $GITHUB_OUTPUT
            echo "files=${{ github.event.client_payload.files }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Project Directories
        run: |
          rm -rf app
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/assets

      - name: Decode Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "WARNING: No keystore found, creating debug keystore"
            keytool -genkey -v -keystore keystore.jks -alias release -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown" -storepass android -keypass android
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=release" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          else
            KEYSTORE_ABS="$GITHUB_WORKSPACE/keystore.jks"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 -d > "$KEYSTORE_ABS"
            echo "KEYSTORE_PATH=$KEYSTORE_ABS" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Generate Files
        run: |
          export NEW_PKG="${{ steps.pkg.outputs.package_name }}"
          export APP_NAME="${{ steps.app.outputs.app_name }}"
          export FILES_JSON='${{ steps.payload.outputs.files }}'

          cat > generate.py << 'EOF'
          import json
          import os
          import re
          import sys
          import traceback

          def main():
              try:
                  pkg = os.environ.get("NEW_PKG", "com.systempro.app")
                  app_name = os.environ.get("APP_NAME", "MyApp")
                  pkg_path = pkg.replace(".", "/")
                  files_json = os.environ.get("FILES_JSON", "{}")

                  files = {}
                  if files_json and files_json != "{}" and files_json != "null":
                      try:
                          files = json.loads(files_json)
                      except:
                          pass

                  existing = {
                      "java": False,
                      "layout": False,
                      "manifest": False,
                      "strings": False,
                      "colors": False,
                      "themes": False
                  }

                  # Process payload files
                  for path, content in files.items():
                      clean_path = path.strip("/")
                      
                      if clean_path.endswith(".java"):
                          existing["java"] = True
                          content = re.sub(r'^package .*?;', f'package {pkg};', content, flags=re.MULTILINE)
                          if not re.search(r'^package ', content, re.MULTILINE):
                              content = f'package {pkg};\n\n{content}'
                          filename = os.path.basename(clean_path)
                          new_path = f"app/src/main/java/{pkg_path}/{filename}"
                          os.makedirs(os.path.dirname(new_path), exist_ok=True)
                          with open(new_path, "w", encoding="utf-8") as out:
                              out.write(content)
                          print(f"✓ Java: {filename}")
                          
                      elif clean_path.endswith(".xml"):
                          if "AndroidManifest.xml" in clean_path:
                              existing["manifest"] = True
                              new_path = "app/src/main/AndroidManifest.xml"
                              content = re.sub(r'\s+package="[^"]*"', '', content)
                              content = re.sub(r'package="[^"]*"', '', content)
                              os.makedirs(os.path.dirname(new_path), exist_ok=True)
                              with open(new_path, "w", encoding="utf-8") as out:
                                  out.write(content)
                              print(f"✓ AndroidManifest.xml")
                              
                          elif "layout" in clean_path:
                              existing["layout"] = True
                              filename = os.path.basename(clean_path)
                              new_path = f"app/src/main/res/layout/{filename}"
                              os.makedirs(os.path.dirname(new_path), exist_ok=True)
                              with open(new_path, "w", encoding="utf-8") as out:
                                  out.write(content)
                              print(f"✓ Layout: {filename}")
                              
                          elif "values/strings.xml" in clean_path:
                              existing["strings"] = True
                              new_path = "app/src/main/res/values/strings.xml"
                              os.makedirs(os.path.dirname(new_path), exist_ok=True)
                              with open(new_path, "w", encoding="utf-8") as out:
                                  out.write(content)
                              print("✓ strings.xml")
                              
                          elif "values/colors.xml" in clean_path:
                              existing["colors"] = True
                              new_path = "app/src/main/res/values/colors.xml"
                              os.makedirs(os.path.dirname(new_path), exist_ok=True)
                              with open(new_path, "w", encoding="utf-8") as out:
                                  out.write(content)
                              print("✓ colors.xml")
                              
                          elif "values/themes.xml" in clean_path or "values/styles.xml" in clean_path:
                              existing["themes"] = True
                              filename = os.path.basename(clean_path)
                              new_path = f"app/src/main/res/values/{filename}"
                              os.makedirs(os.path.dirname(new_path), exist_ok=True)
                              with open(new_path, "w", encoding="utf-8") as out:
                                  out.write(content)
                              print(f"✓ Theme: {filename}")

                  # Force update strings.xml with app name
                  strings_path = "app/src/main/res/values/strings.xml"
                  if os.path.exists(strings_path):
                      with open(strings_path, "r", encoding="utf-8") as f:
                          content = f.read()
                      if re.search(r'<string name="app_name">', content):
                          content = re.sub(r'<string name="app_name">.*?</string>', f'<string name="app_name">{app_name}</string>', content)
                      else:
                          content = content.replace('</resources>', f'    <string name="app_name">{app_name}</string>\n</resources>')
                      with open(strings_path, "w", encoding="utf-8") as f:
                          f.write(content)
                      print("✓ Updated app_name in strings.xml")
                  else:
                      os.makedirs(os.path.dirname(strings_path), exist_ok=True)
                      with open(strings_path, "w", encoding="utf-8") as f:
                          f.write('<?xml version="1.0" encoding="utf-8"?>\n')
                          f.write('<resources>\n')
                          f.write(f'    <string name="app_name">{app_name}</string>\n')
                          f.write('</resources>\n')
                      print("✓ Created strings.xml")

                  # Update package in all Java files
                  java_base_dir = "app/src/main/java"
                  if os.path.exists(java_base_dir):
                      for root, dirs, files in os.walk(java_base_dir):
                          for file in files:
                              if file.endswith(".java"):
                                  file_path = os.path.join(root, file)
                                  with open(file_path, "r", encoding="utf-8") as f:
                                      content = f.read()
                                  content = re.sub(r'^package .*?;', f'package {pkg};', content, flags=re.MULTILINE)
                                  with open(file_path, "w", encoding="utf-8") as f:
                                      f.write(content)
                                  print(f"✓ Updated package in {file}")

                  # Update manifest label
                  manifest_path = "app/src/main/AndroidManifest.xml"
                  if os.path.exists(manifest_path):
                      with open(manifest_path, "r", encoding="utf-8") as f:
                          content = f.read()
                      content = re.sub(r'android:label="[^"]*"', 'android:label="@string/app_name"', content)
                      with open(manifest_path, "w", encoding="utf-8") as f:
                          f.write(content)
                      print("✓ Updated manifest label")

                  # Fallbacks
                  if not existing["colors"]:
                      colors_path = "app/src/main/res/values/colors.xml"
                      os.makedirs(os.path.dirname(colors_path), exist_ok=True)
                      with open(colors_path, "w", encoding="utf-8") as f:
                          f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
                          f.write('    <color name="colorPrimary">#6200EE</color>\n')
                          f.write('    <color name="colorPrimaryDark">#3700B3</color>\n')
                          f.write('    <color name="colorAccent">#03DAC6</color>\n')
                          f.write('    <color name="white">#FFFFFF</color>\n')
                          f.write('    <color name="black">#000000</color>\n')
                          f.write('</resources>\n')
                      print("✓ Fallback colors.xml created")

                  if not existing["themes"]:
                      themes_path = "app/src/main/res/values/themes.xml"
                      os.makedirs(os.path.dirname(themes_path), exist_ok=True)
                      with open(themes_path, "w", encoding="utf-8") as f:
                          f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
                          f.write('    <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">\n')
                          f.write('        <item name="colorPrimary">@color/colorPrimary</item>\n')
                          f.write('        <item name="colorPrimaryDark">@color/colorPrimaryDark</item>\n')
                          f.write('        <item name="colorAccent">@color/colorAccent</item>\n')
                          f.write('    </style>\n</resources>\n')
                      print("✓ Fallback themes.xml created")

                  print(f"\n✅ Project generated: {pkg} / {app_name}")

              except Exception as e:
                  print(f"❌ Error: {e}")
                  traceback.print_exc()
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          EOF

          python3 generate.py

      - name: Generate App Icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true
          
          ICON_B64="${{ steps.payload.outputs.icon }}"
          
          if [ -n "$ICON_B64" ] && [ "$ICON_B64" != "null" ] && [ "$ICON_B64" != "" ]; then
            echo "$ICON_B64" | base64 -d > /tmp/icon.png
            if file /tmp/icon.png | grep -q 'PNG image'; then
              echo "Custom icon detected, generating all densities..."
              convert /tmp/icon.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
              cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
              convert /tmp/icon.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
              cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
              convert /tmp/icon.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
              cp app/src/main/res/mipmap-xhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
              convert /tmp/icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
              cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
              convert /tmp/icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
              echo "Custom icon applied successfully"
              exit 0
            fi
          fi
          
          echo "Generating fallback icons..."
          for size in 48 72 96 144 192; do
            case $size in
              48) density="mdpi" ;;
              72) density="hdpi" ;;
              96) density="xhdpi" ;;
              144) density="xxhdpi" ;;
              192) density="xxxhdpi" ;;
            esac
            convert -size ${size}x${size} xc:#6200EE -gravity center \
              -font Helvetica -pointsize $((size/3)) -fill white -annotate 0 "A" \
              app/src/main/res/mipmap-${density}/ic_launcher.png 2>/dev/null || true
            cp app/src/main/res/mipmap-${density}/ic_launcher.png app/src/main/res/mipmap-${density}/ic_launcher_round.png 2>/dev/null || true
          done
          echo "Fallback icons generated"

      - name: Create build.gradle
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          
          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "${PKG}"
              compileSdk 34

              defaultConfig {
                  applicationId "${PKG}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  multiDexEnabled true
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH") ?: "none")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }

              buildFeatures {
                  buildConfig true
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          EOF
          
          cat > app/proguard-rules.pro << 'EOF'
          -keep class * extends androidx.appcompat.app.AppCompatActivity
          -keepattributes Signature
          EOF

      - name: Create Gradle Settings
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AppBuilder"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          android.enableJetifier=false
          org.gradle.parallel=false
          org.gradle.caching=false
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Clean Project
        run: ./gradlew clean --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon --no-parallel --no-build-cache

      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace --no-daemon --no-parallel --no-build-cache

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-release
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
