name: Build Android APK (Auto Permissions + Theme Fix)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Get package name from payload
        id: pkg
        run: |
          PKG="${{ github.event.client_payload.package_name }}"
          if [ -z "$PKG" ]; then
            PKG="com.systempro.app"
          fi
          echo "package_name=$PKG" >> $GITHUB_OUTPUT
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          echo "package_path=$PKG_PATH" >> $GITHUB_OUTPUT

      - name: Get app name from payload
        id: app
        run: |
          APP_NAME="${{ github.event.client_payload.app_name }}"
          if [ -z "$APP_NAME" ]; then
            APP_NAME="CodeForge Pro"
          fi
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

      - name: Clean and recreate directories
        run: |
          rm -rf app/src/main/java app/src/main/res app/build.gradle
          PKG_PATH="${{ steps.pkg.outputs.package_path }}"
          mkdir -p "app/src/main/java/${PKG_PATH}"
          mkdir -p app/src/main/res/layout app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi

      - name: Generate files from payload
        run: |
          cat > payload_files.json << 'EOF'
          ${{ toJson(github.event.client_payload.files) }}
          EOF
          NEW_PKG="${{ steps.pkg.outputs.package_name }}"
          cat > generate_all.py << 'PY'
          import json, os, re
          new_pkg = os.environ['NEW_PKG']
          with open('payload_files.json', 'r') as f:
              files = json.load(f)
          PERMISSIONS = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_WIFI_STATE",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.READ_EXTERNAL_STORAGE",
              "android.permission.WRITE_EXTERNAL_STORAGE",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.VIBRATE",
              "android.permission.WAKE_LOCK",
              "android.permission.POST_NOTIFICATIONS"
          ]
          for orig_path, content in files.items():
              if orig_path.endswith('.java'):
                  content = re.sub(r'^package .*;', f'package {new_pkg};', content, flags=re.MULTILINE)
                  filename = os.path.basename(orig_path)
                  new_path = f"app/src/main/java/{new_pkg.replace('.', '/')}/{filename}"
              else:
                  new_path = orig_path
              os.makedirs(os.path.dirname(new_path), exist_ok=True)
              with open(new_path, 'w', encoding='utf-8') as out:
                  out.write(content)
              print(f"Written: {new_path}")
          manifest_path = "app/src/main/AndroidManifest.xml"
          manifest_lines = [
              '<?xml version="1.0" encoding="utf-8"?>',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android"',
              f'    package="{new_pkg}">',
              ''
          ]
          for perm in PERMISSIONS:
              manifest_lines.append(f'    <uses-permission android:name="{perm}" />')
          manifest_lines.extend([
              '',
              '    <application',
              '        android:allowBackup="true"',
              '        android:icon="@mipmap/ic_launcher"',
              '        android:label="@string/app_name"',
              '        android:supportsRtl="true">',
              '        <activity',
              '            android:name=".MainActivity"',
              '            android:exported="true">',
              '            <intent-filter>',
              '                <action android:name="android.intent.action.MAIN" />',
              '                <category android:name="android.intent.category.LAUNCHER" />',
              '            </intent-filter>',
              '        </activity>',
              '    </application>',
              '',
              '</manifest>'
          ])
          with open(manifest_path, 'w', encoding='utf-8') as mf:
              mf.write('\n'.join(manifest_lines))
          print(f"Manifest generated")
          PY
          export NEW_PKG
          python3 generate_all.py

      - name: Set app name in strings.xml
        run: |
          APP_NAME="${{ steps.app.outputs.app_name }}"
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml << EOF
          <resources>
              <string name="app_name">${APP_NAME}</string>
          </resources>
          EOF

      # NEW: Fix theme if MainActivity uses AppCompatActivity
      - name: Auto-fix theme for AppCompatActivity
        run: |
          MAIN_ACTIVITY=$(find app/src/main/java -name "MainActivity.java" | head -1)
          if grep -q "AppCompatActivity" "$MAIN_ACTIVITY"; then
            echo "AppCompatActivity detected, adding theme"
            # Add theme to manifest if not present
            MANIFEST="app/src/main/AndroidManifest.xml"
            if ! grep -q 'android:theme=' "$MANIFEST"; then
              sed -i 's|<application |<application android:theme="@style/AppTheme" |' "$MANIFEST"
            fi
            # Create themes.xml
            mkdir -p app/src/main/res/values
            cat > app/src/main/res/values/themes.xml << 'THEMES'
            <resources>
                <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                    <item name="colorPrimary">#6200EE</item>
                    <item name="colorPrimaryDark">#3700B3</item>
                    <item name="colorAccent">#03DAC5</item>
                </style>
            </resources>
            THEMES
            echo "Theme added for AppCompatActivity"
          else
            echo "Plain Activity detected, no theme needed"
          fi

      - name: Create fresh app/build.gradle
        run: |
          PKG="${{ steps.pkg.outputs.package_name }}"
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace "__PKG__"
              defaultConfig {
                  applicationId "__PKG__"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              sourceSets {
                  main {
                      java.srcDirs = ['src/main/java']
                      res.srcDirs = ['src/main/res']
                      manifest.srcFile 'src/main/AndroidManifest.xml'
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          sed -i "s/__PKG__/${PKG}/g" app/build.gradle

      - name: Process app icon from payload
        run: |
          ICON_B64="${{ github.event.client_payload.icon }}"
          if [ -n "$ICON_B64" ] && [ "$ICON_B64" != "" ]; then
            echo "$ICON_B64" | base64 -d > app_icon.png
            sudo apt-get update && sudo apt-get install -y imagemagick
            convert app_icon.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert app_icon.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert app_icon.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert app_icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert app_icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
            convert -size 72x72 xc:#00FFCC app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert -size 48x48 xc:#00FFCC app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert -size 96x96 xc:#00FFCC app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert -size 144x144 xc:#00FFCC app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert -size 192x192 xc:#00FFCC app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Setup Gradle 8.5 wrapper
        run: |
          if [ ! -f gradlew ]; then
            mkdir -p gradle/wrapper
            wget -q https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo '#!/bin/sh' > gradlew
            echo 'GRADLE_OPTS="-Dorg.gradle.appname=gradlew"' >> gradlew
            echo 'exec java $GRADLE_OPTS -classpath "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          files: app/build/outputs/apk/debug/*.apk
