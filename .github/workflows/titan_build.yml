name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Base Payload Decode
        run: |
          mkdir -p output_report
          rm -rf app/src/main/java app/src/main/res app/build
          rm -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME=${RAW_PKG:-"com.system.titan.pro"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          
          echo "TARGET_PACKAGE=$PKG_NAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$PKG_PATH" >> $GITHUB_ENV
          
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          
          echo "${{ github.event.client_payload.payload }}" | base64 -d > app_payload.zip || true
          if [ -s app_payload.zip ]; then
            unzip -o app_payload.zip -d extracted_payload/ || true
          fi

      - name: Copy User Resources
        run: |
          if [ -f extracted_payload/activity_main.xml ]; then
            cp -f extracted_payload/activity_main.xml app/src/main/res/layout/activity_main.xml
          fi
          if [ -f extracted_payload/colors.xml ]; then
            cp -f extracted_payload/colors.xml app/src/main/res/values/colors.xml
          fi
          if [ -d extracted_payload ]; then
            find extracted_payload -type f -name "*.xml" ! -name "activity_main.xml" ! -name "colors.xml" ! -name "AndroidManifest.xml" -exec cp -n {} app/src/main/res/drawable/ \; 2>/dev/null || true
          fi

      - name: Copy User Java Sources
        run: |
          if [ -d extracted_payload ]; then
            find extracted_payload -type f -name "*.java" -exec cp -f {} app/src/main/java/${{ env.TARGET_PATH }}/ \;
          fi

      - name: Fix Package Name & Imports in Java Files
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          if [ -d "$TARGET_DIR" ]; then
            find "$TARGET_DIR" -type f -name "*.java" -exec sed -i "s|^[[:space:]]*package .*;|package ${{ env.TARGET_PACKAGE }};|g" {} \;
            find "$TARGET_DIR" -type f -name "*.java" -exec sed -i "s|import .*\.R;|import ${{ env.TARGET_PACKAGE }}.R;|g" {} \;
            for file in $(find "$TARGET_DIR" -type f -name "*.java"); do
              if ! grep -q "^[[:space:]]*package" "$file"; then
                sed -i "1i package ${{ env.TARGET_PACKAGE }};" "$file"
              fi
            done
          fi

      # ========== ROBUST XML REPAIR SCRIPT (NO AI NEEDED) ==========
      - name: 🔧 Auto-Repair All XML Resources
        run: |
          python3 - << 'PYTHON_FIXER'
          import os, re, xml.etree.ElementTree as ET
          from pathlib import Path

          def log(msg): print(f"[XML FIX] {msg}")

          def fix_xml_file(filepath):
              try:
                  # Read original
                  with open(filepath, 'r', encoding='utf-8') as f:
                      content = f.read()
                  # Remove invalid characters (control chars except newline/tab)
                  content = re.sub(r'[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]', '', content)
                  # Add missing namespace if not present and not a resources file
                  if 'xmlns:android' not in content and '<manifest' not in content and '<resources' not in content:
                      content = re.sub(r'(<\w+)', r'\1 xmlns:android="http://schemas.android.com/apk/res/android"', content, count=1)
                  # Ensure all tags are closed (simple heuristic)
                  if content.count('<') > content.count('>') * 2:
                      # Add missing closing slash to the last unclosed tag
                      content = re.sub(r'<([a-zA-Z][^>]*[^/])$', r'<\1 />', content.strip())
                  # Try to parse with ET to validate
                  try:
                      ET.fromstring(content)
                      # Write back only if changed
                      with open(filepath, 'w', encoding='utf-8') as f:
                          f.write(content)
                      log(f"Valid: {filepath}")
                  except ET.ParseError as e:
                      log(f"ERROR parsing {filepath}: {e}")
                      # If parse fails, create a minimal default file
                      if 'layout' in str(filepath):
                          default = '''<?xml version="1.0" encoding="utf-8"?>
                          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:orientation="vertical">
                              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                  android:text="Fixed Layout" android:layout_gravity="center"/>
                          </LinearLayout>'''
                      elif 'values' in str(filepath):
                          if 'colors' in str(filepath):
                              default = '''<?xml version="1.0" encoding="utf-8"?><resources><color name="colorPrimary">#6200EE</color></resources>'''
                          elif 'strings' in str(filepath):
                              default = '''<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">App</string></resources>'''
                          else:
                              default = '''<?xml version="1.0" encoding="utf-8"?><resources/>'''
                      else:
                          default = '''<?xml version="1.0" encoding="utf-8"?>
                          <shape xmlns:android="http://schemas.android.com/apk/res/android">
                              <solid android:color="#FFFFFF"/>
                          </shape>'''
                      with open(filepath, 'w', encoding='utf-8') as f:
                          f.write(default)
                      log(f"Replaced broken file with default: {filepath}")
              except Exception as e:
                  log(f"Unexpected error with {filepath}: {e}")

          # Fix all XML files in res/
          res_dir = "app/src/main/res"
          if os.path.exists(res_dir):
              for root, dirs, files in os.walk(res_dir):
                  for file in files:
                      if file.endswith('.xml'):
                          fix_xml_file(os.path.join(root, file))
          else:
              log("No res directory found, creating minimal resources")
              os.makedirs("app/src/main/res/layout", exist_ok=True)
              os.makedirs("app/src/main/res/values", exist_ok=True)
              with open("app/src/main/res/layout/activity_main.xml", 'w') as f:
                  f.write('''<?xml version="1.0" encoding="utf-8"?>
                  <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="Default Layout" android:layout_gravity="center"/>
                  </LinearLayout>''')
              with open("app/src/main/res/values/strings.xml", 'w') as f:
                  f.write('''<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">SystemPro</string></resources>''')
          PYTHON_FIXER

      - name: Ensure Missing Resources (strings, colors, drawables)
        run: |
          # Ensure strings.xml has torch strings if not present
          STRINGS="app/src/main/res/values/strings.xml"
          if [ ! -f "$STRINGS" ]; then
            mkdir -p app/src/main/res/values
            cat > "$STRINGS" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">SystemPro</string>
              <string name="torch_on">Torch On</string>
              <string name="torch_off">Torch Off</string>
          </resources>
          EOF
          else
            if ! grep -q 'torch_on' "$STRINGS"; then
              sed -i '/<\/resources>/i \    <string name="torch_on">Torch On</string>\n    <string name="torch_off">Torch Off</string>' "$STRINGS"
            fi
          fi
          # Ensure colors.xml
          if [ ! -f app/src/main/res/values/colors.xml ]; then
            cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#6200EE</color>
              <color name="colorAccent">#03DAC5</color>
          </resources>
          EOF
          fi
          # Ensure styles.xml
          if [ ! -f app/src/main/res/values/styles.xml ]; then
            cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          EOF
          fi
          # Ensure button_background.xml if referenced
          if grep -q 'button_background' app/src/main/res/layout/activity_main.xml 2>/dev/null; then
            mkdir -p app/src/main/res/drawable
            cat > app/src/main/res/drawable/button_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/colorPrimary"/>
              <corners android:radius="8dp"/>
          </shape>
          EOF
          fi

      - name: Fallback MainActivity (if user didn't provide)
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          if [ ! -f "$TARGET_DIR/MainActivity.java" ]; then
            mkdir -p "$TARGET_DIR"
            cat > "$TARGET_DIR/MainActivity.java" << 'EOF'
          package ${{ env.TARGET_PACKAGE }};
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(getResources().getIdentifier("activity_main", "layout", getPackageName()));
                  Button btn = findViewById(getResources().getIdentifier("toggleButton", "id", getPackageName()));
                  if (btn != null) {
                      btn.setOnClickListener(v -> Toast.makeText(this, "Button clicked", Toast.LENGTH_SHORT).show());
                  }
              }
          }
          EOF
          fi

      - name: Create AndroidManifest (without package attribute)
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create build.gradle (Gradle 8.5 compatible)
        run: |
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace "${{ env.TARGET_PACKAGE }}"
              compileSdk 34
              defaultConfig {
                  applicationId "${{ env.TARGET_PACKAGE }}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Inject Master Permissions (add missing)
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          for perm in "android.permission.CAMERA" "android.permission.READ_EXTERNAL_STORAGE" "android.permission.WRITE_EXTERNAL_STORAGE" "android.permission.BLUETOOTH" "android.permission.BLUETOOTH_CONNECT" "android.permission.BLUETOOTH_SCAN"; do
            if ! grep -q "$perm" "$MANIFEST"; then
              sed -i "/<manifest/a \    <uses-permission android:name=\"$perm\" />" "$MANIFEST"
            fi
          done

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK
        id: build
        run: |
          gradle assembleDebug --no-daemon 2> output_report/gradle_err.log
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk
            echo "APK_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "APK_SUCCESS=false" >> $GITHUB_ENV
          fi

      - name: Validate APK Size
        run: |
          if [ -f output_report/app-debug.apk ]; then
            SIZE=$(stat -c%s output_report/app-debug.apk)
            if [ $SIZE -lt 50000 ]; then
              echo "❌ APK too small ($SIZE bytes). Build likely failed." >> output_report/build_summary.txt
              exit 1
            else
              echo "✅ APK size: $SIZE bytes - OK" >> output_report/build_summary.txt
            fi
          else
            echo "❌ No APK generated." >> output_report/build_summary.txt
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: System-Pro-V2-Final
          path: output_report/
