name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Copy from build_assets
        run: |
          mkdir -p output_report
          rm -rf app/src/main/java app/src/main/res app/build
          
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          CLEAN_PKG=$(echo "$RAW_PKG" | sed 's/[^a-zA-Z0-9._]/./g' | sed 's/\.\.*/./g' | sed 's/^\.//;s/\.$//')
          PKG_NAME=${CLEAN_PKG:-"com.system.titan.pro"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          APP_NAME=$(echo "$PKG_NAME" | awk -F'.' '{print $NF}')
          
          echo "TARGET_PACKAGE=$PKG_NAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$PKG_PATH" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable
          
          # Copy Java files
          find build_assets -type f -name "*.java" -exec cp -f {} "app/src/main/java/$PKG_PATH/" \;
          
          # Copy layout if exists
          if [ -f "build_assets/activity_main.xml" ]; then
            cp -f "build_assets/activity_main.xml" app/src/main/res/layout/activity_main.xml
          fi

      - name: Consolidate Java files
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          find app/src/main/java -type f -name "*.java" | while read f; do
            if [[ "$f" != *"/${{ env.TARGET_PATH }}/"* ]]; then
              mv "$f" "$TARGET_DIR/$(basename "$f")"
            fi
          done
          find app/src/main/java -type d -empty -delete 2>/dev/null || true

      - name: Fix Java files
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          [ ! -d "$TARGET_DIR" ] && exit 0
          
          find "$TARGET_DIR" -name "*.java" -exec sed -i 's/^package .*;/package ${{ env.TARGET_PACKAGE }};/g' {} \;
          find "$TARGET_DIR" -name "*.java" -exec sed -i 's/import .*\.R;/import ${{ env.TARGET_PACKAGE }}.R;/g' {} \;
          find "$TARGET_DIR" -name "*.java" -exec sed -i '/^[[:space:]]*\(private\|public\|protected\)/ s/\([^;{}]\)$/\1;/' {} \;
          find "$TARGET_DIR" -name "*.java" -exec sed -i 's/\(super\.[a-zA-Z]*(.*)\)$/\1;/' {} \;
          find "$TARGET_DIR" -name "*.java" -exec sed -i 's/\(setContentView(.*)\)$/\1;/' {} \;
          find "$TARGET_DIR" -name "*.java" -exec sed -i 's/})$/});/g' {} \;
          find "$TARGET_DIR" -name "*.java" -exec sed -i 's|R\.id\.torch_button|R.id.toggleButton|g' {} \;
          find "$TARGET_DIR" -name "*.java" -exec sed -i 's|R\.id\.btn_torch|R.id.toggleButton|g' {} \;
          
          for file in $(find "$TARGET_DIR" -name "*.java"); do
            grep -q "CameraManager" "$file" && ! grep -q "import android.hardware.camera2.CameraManager" "$file" && sed -i '/^package /a import android.hardware.camera2.CameraManager;' "$file"
            grep -q "CameraCharacteristics" "$file" && ! grep -q "import android.hardware.camera2.CameraCharacteristics" "$file" && sed -i '/^package /a import android.hardware.camera2.CameraCharacteristics;' "$file"
            grep -q "Toast" "$file" && ! grep -q "import android.widget.Toast" "$file" && sed -i '/^package /a import android.widget.Toast;' "$file"
          done

      - name: Ensure layout has toggleButton
        run: |
          LAYOUT="app/src/main/res/layout/activity_main.xml"
          if [ ! -f "$LAYOUT" ]; then
            mkdir -p app/src/main/res/layout
            cat > "$LAYOUT" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center">
              <Button android:id="@+id/toggleButton" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Toggle Torch" />
          </LinearLayout>
          EOF
          else
            sed -i 's|android:id="@+id/torch_button"|android:id="@+id/toggleButton"|g' "$LAYOUT"
            sed -i 's|android:id="@+id/btn_torch"|android:id="@+id/toggleButton"|g' "$LAYOUT"
          fi

      - name: Copy app icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$d
          done
          
          ICON_FILE=$(find build_assets -type f -name "*.png" | head -1)
          if [ -n "$ICON_FILE" ] && file "$ICON_FILE" | grep -q "PNG image data"; then
            echo "✅ Using user icon: $ICON_FILE"
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp -f "$ICON_FILE" app/src/main/res/mipmap-$d/ic_launcher.png
              cp -f "$ICON_FILE" app/src/main/res/mipmap-$d/ic_launcher_round.png
            done
          else
            echo "⚠️ No valid PNG icon, creating default icon"
            # Single-line base64 without heredoc
            echo "" | base64 -d > /tmp/icon.png
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp -f /tmp/icon.png app/src/main/res/mipmap-$d/ic_launcher.png
              cp -f /tmp/icon.png app/src/main/res/mipmap-$d/ic_launcher_round.png
            done
          fi

      - name: Create resources
        run: |
          cat > app/src/main/res/values/strings.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">${{ env.APP_NAME }}</string>
              <string name="torch_on">Torch On</string>
              <string name="torch_off">Torch Off</string>
          </resources>
          EOF
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="colorPrimary">#6200EE</color><color name="colorAccent">#03DAC5</color></resources>
          EOF
          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><style name="Theme.AppCompat.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar"><item name="colorPrimary">@color/colorPrimary</item><item name="colorAccent">@color/colorAccent</item></style></resources>
          EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/button_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/colorPrimary"/><corners android:radius="8dp"/></shape>
          EOF

      - name: Build AndroidManifest
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:label="@string/app_name" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build Gradle file
        run: |
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace "${{ env.TARGET_PACKAGE }}"
              compileSdk 34
              defaultConfig {
                  applicationId "${{ env.TARGET_PACKAGE }}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon 2> output_report/gradle_err.log
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk
          else
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: System-Pro-V2-Final
          path: output_report/
