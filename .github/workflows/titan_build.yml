name: System Pro Titan Master Build (from build_assets)

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Copy from build_assets to app structure
        run: |
          mkdir -p output_report
          rm -rf app/src/main/java app/src/main/res app/build
          
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME=${RAW_PKG:-"com.system.titan.pro"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          
          echo "TARGET_PACKAGE=$PKG_NAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$PKG_PATH" >> $GITHUB_ENV
          
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          
          if [ -d "build_assets/app" ]; then
            cp -rf build_assets/app/* app/
          fi
          
          if [ -f "build_assets/activity_main.xml" ]; then
            cp -f build_assets/activity_main.xml app/src/main/res/layout/activity_main.xml
          fi
          if [ -f "build_assets/colors.xml" ]; then
            cp -f build_assets/colors.xml app/src/main/res/values/colors.xml
          fi
          
          if [ -f "build_assets/app_icon.png" ]; then
            cp -f build_assets/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp -f build_assets/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          fi
          
          if [ -d "build_assets/java" ]; then
            cp -rf build_assets/java/* app/src/main/java/
          fi
          if [ -d "build_assets/src" ]; then
            cp -rf build_assets/src/* app/src/main/
          fi
          
          find build_assets -maxdepth 1 -name "*.java" -exec cp -f {} "app/src/main/java/$PKG_PATH/" \;

      - name: Consolidate Java files into correct package
        run: |
          echo "Moving stray Java files to ${{ env.TARGET_PATH }}"
          find app/src/main/java -type f -name "*.java" | while read f; do
            if [[ "$f" != *"/${{ env.TARGET_PATH }}/"* ]]; then
              filename=$(basename "$f")
              mv "$f" "app/src/main/java/${{ env.TARGET_PATH }}/$filename"
              echo "Moved $filename"
            fi
          done
          find app/src/main/java -type d -empty -delete 2>/dev/null || true

      - name: Generate fresh AndroidManifest
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="System Pro"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Fix all XML resource files with sed
        run: |
          echo "Adding xmlns:android to all XML files in res/"
          find app/src/main/res -type f -name "*.xml" | while read xmlfile; do
            if ! grep -q 'xmlns:android' "$xmlfile"; then
              sed -i '1s/\(<[a-zA-Z][^>]*\)/\1 xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android"/' "$xmlfile"
              echo "Fixed: $xmlfile"
            fi
          done
          mkdir -p app/src/main/res/values
          if [ ! -f app/src/main/res/values/strings.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">SystemPro</string></resources>' > app/src/main/res/values/strings.xml
          fi

      - name: Write Static Fixer script
        run: |
          cat > static_fixer.py << 'EOF'
          import os, re, sys
          from pathlib import Path
          from datetime import datetime

          LOG_FILE = "output_report/fixer_log.txt"
          def log(msg):
              timestamp = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
              line = f"[{timestamp}] [INFO] {msg}"
              print(line)
              with open(LOG_FILE, "a") as f:
                  f.write(line + "\n")

          TARGET_PACKAGE = os.environ.get("TARGET_PACKAGE", "com.system.titan.pro")
          JAVA_SRC_DIR = f"app/src/main/java/{TARGET_PACKAGE.replace('.', '/')}"
          GRADLE_BUILD = "app/build.gradle"

          def read_file(p): return open(p).read() if os.path.exists(p) else None
          def write_file(p, c): Path(p).parent.mkdir(parents=True, exist_ok=True); open(p, 'w').write(c); log(f"Written: {p}")

          def fix_java(fpath):
              c = read_file(fpath)
              if not c: return False
              orig = c
              # Fix package
              c = re.sub(r'^package\s+[\w.]+;', f'package {TARGET_PACKAGE};', c, flags=re.M)
              if not re.search(r'^package\s+', c, re.M):
                  c = f"package {TARGET_PACKAGE};\n" + c
                  log(f"Added package to {fpath}")
              # Fix import R
              c = re.sub(r'import\s+[\w.]+\.R;', f'import {TARGET_PACKAGE}.R;', c)
              if 'R;' not in c:
                  lines = c.split('\n')
                  for i, line in enumerate(lines):
                      if line.startswith('package '):
                          lines.insert(i+1, f'import {TARGET_PACKAGE}.R;')
                          break
                  c = '\n'.join(lines)
                  log(f"Added import R to {fpath}")
              # Add common imports
              imports = []
              if 'Toast.makeText' in c and 'android.widget.Toast' not in c:
                  imports.append('import android.widget.Toast;')
              if 'AlertDialog' in c and 'android.app.AlertDialog' not in c and 'androidx.appcompat.app.AlertDialog' not in c:
                  imports.append('import android.app.AlertDialog;')
              if 'ActivityCompat' in c and 'androidx.core.app.ActivityCompat' not in c:
                  imports.append('import androidx.core.app.ActivityCompat;')
              if 'ContextCompat' in c and 'androidx.core.content.ContextCompat' not in c:
                  imports.append('import androidx.core.content.ContextCompat;')
              if 'Build' in c and 'android.os.Build' not in c:
                  imports.append('import android.os.Build;')
              if 'CameraManager' in c and 'android.hardware.camera2.CameraManager' not in c:
                  imports.append('import android.hardware.camera2.CameraManager;')
              if 'CameraCharacteristics' in c and 'android.hardware.camera2.CameraCharacteristics' not in c:
                  imports.append('import android.hardware.camera2.CameraCharacteristics;')
              if imports:
                  lines = c.split('\n')
                  pos = 0
                  for i, line in enumerate(lines):
                      if line.startswith('package ') or line.startswith('import '):
                          pos = i+1
                  for imp in reversed(imports):
                      lines.insert(pos, imp)
                  c = '\n'.join(lines)
                  log(f"Added imports {imports} to {fpath}")
              # Fix braces
              open_b = c.count('{'); close_b = c.count('}')
              if open_b > close_b:
                  c += '\n' + '}' * (open_b - close_b)
                  log(f"Fixed braces in {fpath}")
              # Fix semicolons (skip annotations)
              lines = c.split('\n')
              new = []
              for line in lines:
                  stripped = line.strip()
                  if (stripped and 
                      not stripped.startswith('@') and 
                      not stripped.startswith('//') and 
                      not stripped.startswith('/*') and 
                      not stripped.startswith('*') and
                      not stripped.endswith('{') and 
                      not stripped.endswith('}') and 
                      not stripped.endswith(';')):
                      if not re.match(r'^@\w+(\(.*\))?$', stripped):
                          if not re.match(r'^(if|for|while|switch|try|catch|finally)\s*\(', stripped):
                              line = line.rstrip() + ';'
                  new.append(line)
              c = '\n'.join(new)
              if c != orig:
                  write_file(fpath, c)
                  return True
              return False

          def fix_gradle():
              # Always write fresh build.gradle to avoid syntax errors
              g = f'''plugins {{
    id 'com.android.application'
}}

android {{
    namespace '{TARGET_PACKAGE}'
    compileSdk 34

    defaultConfig {{
        applicationId '{TARGET_PACKAGE}'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }}

    compileOptions {{
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }}
}}

dependencies {{
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}}'''
              if os.path.exists(GRADLE_BUILD):
                  os.rename(GRADLE_BUILD, GRADLE_BUILD + ".old")
              write_file(GRADLE_BUILD, g)
              log("Created fresh build.gradle")
              return True

          def main():
              log("=== Static Fixer Started ===")
              fixes = 0
              if os.path.exists(JAVA_SRC_DIR):
                  for r,_,fs in os.walk(JAVA_SRC_DIR):
                      for f in fs:
                          if f.endswith('.java') and fix_java(os.path.join(r,f)):
                              fixes += 1
              if fix_gradle():
                  fixes += 1
              log(f"Total fixes applied: {fixes}")
              log("=== Static Fixer Finished ===")
          if __name__ == "__main__": main()
          EOF

      - name: Run Static Fixer
        run: python3 static_fixer.py

      - name: Core Environment Setup
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/values
          cat > app/src/main/res/drawable/edittext_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1AFFFFFF"/>
              <corners android:radius="8dp"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/button_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#6200EE"/>
              <corners android:radius="8dp"/>
          </shape>
          EOF
          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:android="http://schemas.android.com/apk/res/android">
              <style name="Theme.AppCompat.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="windowNoTitle">true</item>
                  <item name="windowActionBar">false</item>
              </style>
          </resources>
          EOF
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:android="http://schemas.android.com/apk/res/android">
              <color name="colorPrimary">#02040c</color>
              <color name="colorAccent">#00ffcc</color>
          </resources>
          EOF
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:android="http://schemas.android.com/apk/res/android">
              <string name="app_name">System Pro</string>
              <string name="torch_on">Torch On</string>
              <string name="torch_off">Torch Off</string>
          </resources>
          EOF

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Asset APK
        id: build
        run: |
          gradle assembleDebug --no-daemon 2> output_report/gradle_err.log
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk
            echo "APK copied successfully"
          else
            echo "APK not found after build"
            exit 1
          fi

      - name: Validate APK
        run: |
          if [ ! -f output_report/app-debug.apk ]; then
            echo "ERROR: APK file missing!"
            exit 1
          fi
          SIZE=$(stat -c%s output_report/app-debug.apk)
          if [ $SIZE -lt 50000 ]; then
            echo "WARNING: APK size is only $SIZE bytes"
          else
            echo "APK size is $SIZE bytes - OK"
          fi

      - name: Upload Artifact (Always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: System-Pro-V2-Final
          path: output_report/
