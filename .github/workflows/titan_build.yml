name: System Pro Titan Master Build (Gradle 8.5 Fixed)

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare Workspace
        run: |
          find . -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'build_assets' ! -name '.' -exec rm -rf {} +
          mkdir -p gradle/wrapper app/src/main/java app/src/main/res/layout app/src/main/res/values app/src/main/res/mipmap-mdpi

      - name: Set Package Name from Payload
        run: |
          PKG_NAME="${{ github.event.client_payload.package_name }}"
          if [ -z "$PKG_NAME" ]; then PKG_NAME="com.system.pro"; fi
          echo "PACKAGE_NAME=$PKG_NAME" >> $GITHUB_ENV
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          echo "PKG_PATH=$PKG_PATH" >> $GITHUB_ENV

      - name: Inject Gradle Configuration (Enforce Gradle 8.5)
        run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF
          
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'SystemPro'
          include ':app'
          EOF
          
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          
          cat > app/build.gradle << EOF
          plugins { id 'com.android.application' }
          android {
              namespace '${{ env.PACKAGE_NAME }}'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ env.PACKAGE_NAME }}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Copy Assets from build_assets
        run: |
          if [ -d "build_assets" ]; then
            if [ -d "build_assets/app" ]; then
              cp -r build_assets/app/* app/
            fi
            if [ -f "build_assets/AndroidManifest.xml" ]; then
              cp build_assets/AndroidManifest.xml app/src/main/AndroidManifest.xml
            fi
            if [ -f "build_assets/app_icon.png" ]; then
              cp build_assets/app_icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
            fi
          fi

      - name: Auto-Heal Script (Fix Everything)
        run: |
          cat > /tmp/auto_heal.py << 'SCRIPT'
          import os, re, sys
          from pathlib import Path

          TARGET_PACKAGE = os.environ.get("TARGET_PACKAGE", "com.system.pro")
          JAVA_SRC_DIR = f"app/src/main/java/{TARGET_PACKAGE.replace('.', '/')}"
          RES_DIR = "app/src/main/res"
          MANIFEST_FILE = "app/src/main/AndroidManifest.xml"
          GRADLE_FILE = "app/build.gradle"

          def log(msg): print(f"[AUTO-HEAL] {msg}")

          def read_file(p):
              try: return open(p, 'r', encoding='utf-8').read()
              except: return None

          def write_file(p, content):
              Path(p).parent.mkdir(parents=True, exist_ok=True)
              with open(p, 'w', encoding='utf-8') as f: f.write(content)
              log(f"Fixed: {p}")

          def fix_java_file(path):
              c = read_file(path)
              if not c: return False
              orig = c
              # Fix package
              if re.search(r'^\s*package\s+[\w.]+;', c, re.M):
                  c = re.sub(r'^\s*package\s+[\w.]+;', f'package {TARGET_PACKAGE};', c, flags=re.M)
              else:
                  c = f"package {TARGET_PACKAGE};\n" + c
              # Import R
              imp = f"import {TARGET_PACKAGE}.R;"
              if imp not in c:
                  c = re.sub(r'import\s+[\w.]+\.R;', imp, c)
                  if imp not in c:
                      c = c.replace(f"package {TARGET_PACKAGE};", f"package {TARGET_PACKAGE};\n{imp}")
              # Fix missing semicolons
              lines = c.split('\n')
              new_lines = []
              for line in lines:
                  s = line.strip()
                  if s and not s.endswith(('{', '}', ';', ':', '/', '*')) and not s.startswith(('@', 'import', 'package', 'public', 'private', 'protected', 'class', 'interface', 'enum', 'if', 'else', 'for', 'while', 'return', '//', '/*')):
                      line = line.rstrip() + ';'
                  new_lines.append(line)
              c = '\n'.join(new_lines)
              if c != orig:
                  write_file(path, c)
                  return True
              return False

          def fix_xml_file(path):
              c = read_file(path)
              if not c: return False
              orig = c
              lines = c.split('\n')
              new_lines = []
              for line in lines:
                  if '<' in line and '>' in line and not line.strip().startswith('<?'):
                      if 'android:layout_width' not in line and 'layout_width' not in line:
                          line = re.sub(r'<(\w+)', r'<\1 android:layout_width="match_parent"', line, count=1)
                      if 'android:layout_height' not in line and 'layout_height' not in line:
                          line = re.sub(r'<(\w+)', r'<\1 android:layout_height="wrap_content"', line, count=1)
                  new_lines.append(line)
              c = '\n'.join(new_lines)
              if c != orig:
                  write_file(path, c)
                  return True
              return False

          def fix_manifest():
              if not os.path.exists(MANIFEST_FILE):
                  default = f'''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="System Pro" android:icon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>'''
                  write_file(MANIFEST_FILE, default)
                  return True
              c = read_file(MANIFEST_FILE)
              orig = c
              c = re.sub(r'package="[^"]*"', '', c)
              c = re.sub(r'<manifest\s+', '<manifest ', c)
              c = re.sub(r'<activity(?!.*android:exported)', '<activity android:exported="true"', c)
              if c != orig:
                  write_file(MANIFEST_FILE, c)
                  return True
              return False

          def fix_gradle():
              if not os.path.exists(GRADLE_FILE): return False
              c = read_file(GRADLE_FILE)
              orig = c
              c = re.sub(r"namespace\s+['\"].*?['\"]", f"namespace '{TARGET_PACKAGE}'", c)
              c = re.sub(r"applicationId\s+['\"].*?['\"]", f"applicationId '{TARGET_PACKAGE}'", c)
              if c != orig:
                  write_file(GRADLE_FILE, c)
                  return True
              return False

          def ensure_default_resources():
              values = Path(RES_DIR) / "values"
              values.mkdir(parents=True, exist_ok=True)
              fixed = False
              colors = values / "colors.xml"
              if not colors.exists():
                  colors.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="purple_200">#FFBB86FC</color>
              <color name="purple_500">#FF6200EE</color>
              <color name="purple_700">#FF3700B3</color>
              <color name="teal_200">#FF03DAC5</color>
              <color name="teal_700">#FF018786</color>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
          </resources>''', encoding='utf-8')
                  log("Created default colors.xml")
                  fixed = True
              strings = values / "strings.xml"
              if not strings.exists():
                  strings.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">System Pro</string>
          </resources>''', encoding='utf-8')
                  log("Created default strings.xml")
                  fixed = True
              styles = values / "styles.xml"
              if not styles.exists():
                  styles.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.SystemPro" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#FF6200EE</item>
                  <item name="colorPrimaryDark">#FF3700B3</item>
                  <item name="colorAccent">#FF03DAC5</item>
                  <item name="android:windowBackground">#FFFFFF</item>
              </style>
          </resources>''', encoding='utf-8')
                  log("Created default styles.xml")
                  fixed = True
              return fixed

          def main():
              log("Starting Auto-Heal...")
              total = 0
              if os.path.exists(JAVA_SRC_DIR):
                  for root, _, files in os.walk(JAVA_SRC_DIR):
                      for f in files:
                          if f.endswith('.java') and fix_java_file(os.path.join(root, f)):
                              total += 1
              if os.path.exists(RES_DIR):
                  for root, _, files in os.walk(RES_DIR):
                      for f in files:
                          if f.endswith('.xml') and fix_xml_file(os.path.join(root, f)):
                              total += 1
              if fix_manifest(): total += 1
              if fix_gradle(): total += 1
              if ensure_default_resources(): total += 1
              log(f"Done. Total fixes: {total}")
              sys.exit(0)
          if __name__ == "__main__":
              main()
          SCRIPT
          
          export TARGET_PACKAGE="${{ env.PACKAGE_NAME }}"
          python3 /tmp/auto_heal.py

      - name: Force Gradle 8.5 Wrapper (Remove any existing)
        run: |
          rm -f gradlew gradlew.bat
          rm -rf gradle/wrapper
          mkdir -p gradle/wrapper
          # Generate wrapper with explicit 8.5 distribution
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          # Alternatively, manually write gradle-wrapper.properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          chmod +x gradlew

      - name: Build Debug APK with Gradle 8.5
        run: |
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final
          path: app/build/outputs/apk/debug/app-debug.apk
