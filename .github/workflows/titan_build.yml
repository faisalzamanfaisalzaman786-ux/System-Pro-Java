name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'zulu' }

      - name: Prepare Workspace
        run: |
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          mkdir -p gradle/wrapper app/src/main/java/com/system/pro app/src/main/res/layout

      - name: Inject Stable Gradle Configuration
        run: |
          # 1. settings.gradle (ریپوزٹریز کا گیٹ وے)
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'SystemPro'
          include ':app'" > settings.gradle
          
          # 2. Root build.gradle (پلگ ان کا سنگل سورس)
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          
          # 3. App build.gradle (ایپ کی ضروریات)
          echo "plugins { id 'com.android.application' }
          android {
              namespace 'com.system.pro'
              compileSdk 34
              defaultConfig { applicationId 'com.system.pro'; minSdk 24; targetSdk 34 }
          }" > app/build.gradle

      - name: Setup Wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Generate Source
        run: |
          mkdir -p app/src/main/java/com/system/pro
          echo 'package com.system.pro; import androidx.appcompat.app.AppCompatActivity; public class MainActivity extends AppCompatActivity {}' > app/src/main/java/com/system/pro/MainActivity.java
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.system.pro"></manifest>' > app/src/main/AndroidManifest.xml

      - name: Build
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with: { name: System-Pro-Titan-APK, path: app/build/outputs/apk/debug/app-debug.apk }
