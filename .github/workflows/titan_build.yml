name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Workspace
        run: |
          mkdir -p output_report
          # ضروری فولڈرز بنائیں اگر موجود نہ ہوں
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/values
          
          # پے لوڈ کو ڈیکوڈ کریں
          echo "${{ github.event.client_payload.payload }}" | base64 -d > app_payload.zip
          unzip -o app_payload.zip -d extracted_payload/ || true

      - name: Place Resources
        run: |
          # آئیکن کو یقینی بنائیں کہ وہ صحیح جگہ پر ہے
          if [ -f extracted_payload/app_icon.png ]; then
            cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          else
            # اگر آئیکن نہیں ہے تو ایک ڈمی آئیکن بنائیں تاکہ بلڈ فیل نہ ہو
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi

      - name: Create Essential Files
        run: |
          # strings.xml بنائیں تاکہ ریسورس لنکنگ فیل نہ ہو
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">SystemPro</string>
          </resources>
          EOF

          # Manifest بنائیں
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: System-Pro-V2-Final
          path: output_report/app-debug.apk
