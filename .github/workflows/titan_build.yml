name: System Pro Titan Master Build (from build_assets)

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ========== 1. Copy from build_assets ==========
      - name: Copy from build_assets to app structure
        run: |
          mkdir -p output_report
          rm -rf app/src/main/java app/src/main/res app/build
          
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME=${RAW_PKG:-"com.system.titan.pro"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          
          echo "TARGET_PACKAGE=$PKG_NAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$PKG_PATH" >> $GITHUB_ENV
          
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          
          if [ -d "build_assets/app" ]; then
            cp -rf build_assets/app/* app/
          fi
          
          if [ -f "build_assets/activity_main.xml" ]; then
            cp -f build_assets/activity_main.xml app/src/main/res/layout/activity_main.xml
          fi
          if [ -f "build_assets/colors.xml" ]; then
            cp -f build_assets/colors.xml app/src/main/res/values/colors.xml
          fi
          if [ -f "build_assets/AndroidManifest.xml" ]; then
            cp -f build_assets/AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi
          
          if [ -f "build_assets/app_icon.png" ]; then
            cp -f build_assets/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp -f build_assets/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          fi
          
          if [ -d "build_assets/java" ]; then
            cp -rf build_assets/java/* app/src/main/java/
          fi
          if [ -d "build_assets/src" ]; then
            cp -rf build_assets/src/* app/src/main/
          fi
          
          find build_assets -maxdepth 1 -name "*.java" -exec cp -f {} "app/src/main/java/$PKG_PATH/" \;

      # ========== 2. Aggressive cleanup (remove any invalid resource paths) ==========
      - name: Aggressive cleanup of invalid resource paths
        run: |
          echo "=== Starting aggressive cleanup ==="
          # Remove any 'assets' folder inside res/ completely
          find app/src/main/res -type d -name "assets" -exec rm -rf {} + 2>/dev/null || true
          # Remove any stray XML directly under res/
          find app/src/main/res -maxdepth 1 -type f -name "*.xml" -delete 2>/dev/null || true
          # Ensure standard resource directories exist
          mkdir -p app/src/main/res/values app/src/main/res/layout app/src/main/res/drawable
          # Create a safe strings.xml if missing
          if [ ! -f app/src/main/res/values/strings.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">SystemPro</string></resources>' > app/src/main/res/values/strings.xml
          fi
          echo "Cleanup completed."

      # ========== 3. Enhanced Static Fixer (Python) ==========
      - name: 🤖 Enhanced Static Fixer Agent
        run: |
          cat > static_fixer.py << 'EOF'
          import os, re, sys, xml.etree.ElementTree as ET
          from pathlib import Path
          from datetime import datetime

          LOG_FILE = "output_report/fixer_log.txt"
          def log(msg, level="INFO"):
              timestamp = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
              line = f"[{timestamp}] [{level}] {msg}"
              print(line)
              with open(LOG_FILE, "a") as f:
                  f.write(line + "\n")

          TARGET_PACKAGE = os.environ.get("TARGET_PACKAGE", "com.system.titan.pro")
          ANDROID_MANIFEST = "app/src/main/AndroidManifest.xml"
          JAVA_SRC_DIR = f"app/src/main/java/{TARGET_PACKAGE.replace('.', '/')}"
          RES_VALUES_DIR = "app/src/main/res/values"
          RES_LAYOUT_DIR = "app/src/main/res/layout"
          RES_DRAWABLE_DIR = "app/src/main/res/drawable"
          GRADLE_BUILD = "app/build.gradle"

          def read_file(p): return open(p).read() if os.path.exists(p) else None
          def write_file(p, c): Path(p).parent.mkdir(parents=True, exist_ok=True); open(p, 'w').write(c); log(f"Written: {p}")

          # Fix Java files
          def fix_java(fpath):
              c = read_file(fpath)
              if not c: return False
              orig = c
              c = re.sub(r'^package\s+[\w.]+;', f'package {TARGET_PACKAGE};', c, flags=re.M)
              if not re.search(r'^package\s+', c, re.M):
                  c = f"package {TARGET_PACKAGE};\n" + c
                  log(f"Added package to {fpath}")
              c = re.sub(r'import\s+[\w.]+\.R;', f'import {TARGET_PACKAGE}.R;', c)
              if 'R;' not in c:
                  lines = c.split('\n')
                  for i, line in enumerate(lines):
                      if line.startswith('package '):
                          lines.insert(i+1, f'import {TARGET_PACKAGE}.R;')
                          break
                  c = '\n'.join(lines)
                  log(f"Added import R to {fpath}")
              # Common imports
              imports = []
              if 'Toast.makeText' in c and 'android.widget.Toast' not in c:
                  imports.append('import android.widget.Toast;')
              if 'AlertDialog' in c and 'android.app.AlertDialog' not in c and 'androidx.appcompat.app.AlertDialog' not in c:
                  imports.append('import android.app.AlertDialog;')
              if 'ActivityCompat' in c and 'androidx.core.app.ActivityCompat' not in c:
                  imports.append('import androidx.core.app.ActivityCompat;')
              if 'ContextCompat' in c and 'androidx.core.content.ContextCompat' not in c:
                  imports.append('import androidx.core.content.ContextCompat;')
              if 'Build' in c and 'android.os.Build' not in c:
                  imports.append('import android.os.Build;')
              if 'CameraManager' in c and 'android.hardware.camera2.CameraManager' not in c:
                  imports.append('import android.hardware.camera2.CameraManager;')
              if imports:
                  lines = c.split('\n')
                  pos = 0
                  for i, line in enumerate(lines):
                      if line.startswith('package ') or line.startswith('import '):
                          pos = i+1
                  for imp in reversed(imports):
                      lines.insert(pos, imp)
                  c = '\n'.join(lines)
                  log(f"Added imports {imports} to {fpath}")
              # Braces balance
              open_b = c.count('{'); close_b = c.count('}')
              if open_b > close_b:
                  c += '\n' + '}' * (open_b - close_b)
                  log(f"Fixed braces in {fpath}")
              # Semicolons
              lines = c.split('\n')
              new = []
              for line in lines:
                  s = line.strip()
                  if s and not s.endswith('{') and not s.endswith('}') and not s.endswith(';') and not s.startswith('//') and not s.startswith('/*'):
                      if not re.match(r'^(if|for|while|switch|try|catch|finally)\s*\(', s):
                          line = line.rstrip() + ';'
                  new.append(line)
              c = '\n'.join(new)
              if c != orig:
                  write_file(fpath, c)
                  return True
              return False

          # Fix XML layouts (add missing width/height)
          def fix_xml(fpath):
              c = read_file(fpath)
              if not c: return False
              orig = c
              def add(m):
                  tag = m.group(0)
                  if 'layout_width' not in tag and 'merge' not in tag and 'include' not in tag and 'fragment' not in tag:
                      tag = re.sub(r'(<\w+)', r'\1 android:layout_width="match_parent" android:layout_height="wrap_content"', tag, count=1)
                  return tag
              c = re.sub(r'<[a-zA-Z][^>]*?>', add, c)
              if c != orig:
                  write_file(fpath, c)
                  log(f"Added layout attrs to {fpath}")
                  return True
              return False

          # Fix AndroidManifest
          def fix_manifest():
              if not os.path.exists(ANDROID_MANIFEST):
                  m = f'''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="System Pro" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>'''
                  write_file(ANDROID_MANIFEST, m)
                  log("Created default manifest")
                  return True
              c = read_file(ANDROID_MANIFEST); orig=c
              perms = ["android.permission.INTERNET","android.permission.CAMERA","android.permission.READ_EXTERNAL_STORAGE","android.permission.WRITE_EXTERNAL_STORAGE","android.permission.BLUETOOTH","android.permission.BLUETOOTH_CONNECT","android.permission.BLUETOOTH_SCAN"]
              for p in perms:
                  if p not in c:
                      c = c.replace("<manifest", f'<manifest\n    <uses-permission android:name="{p}" />', 1)
                      log(f"Added perm {p}")
              for attr,val in [('android:icon','@mipmap/ic_launcher'),('android:label','System Pro'),('android:theme','@style/Theme.AppCompat.NoActionBar'),('android:allowBackup','true')]:
                  if attr not in c:
                      c = c.replace("<application", f'<application {attr}="{val}"')
                      log(f"Added attr {attr}")
              if 'android.intent.category.LAUNCHER' not in c:
                  c = re.sub(r'(<activity[^>]*>)', r'\1\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>', c, count=1)
                  log("Added LAUNCHER")
              c = re.sub(r'package="[^"]*"\s*', '', c)
              if c != orig:
                  write_file(ANDROID_MANIFEST, c)
                  return True
              return False

          # Generate missing resources
          def gen_res():
              changed=False
              colors = f"{RES_VALUES_DIR}/colors.xml"
              if not os.path.exists(colors):
                  write_file(colors,'''<?xml version="1.0" encoding="utf-8"?>\n<resources xmlns:android="http://schemas.android.com/apk/res/android">\n    <color name="colorPrimary">#6200EE</color>\n    <color name="colorAccent">#03DAC5</color>\n</resources>''')
                  changed=True
              strings = f"{RES_VALUES_DIR}/strings.xml"
              if not os.path.exists(strings):
                  write_file(strings,'''<?xml version="1.0" encoding="utf-8"?>\n<resources xmlns:android="http://schemas.android.com/apk/res/android">\n    <string name="app_name">System Pro</string>\n</resources>''')
                  changed=True
              styles = f"{RES_VALUES_DIR}/styles.xml"
              if not os.path.exists(styles):
                  write_file(styles,'''<?xml version="1.0" encoding="utf-8"?>\n<resources xmlns:android="http://schemas.android.com/apk/res/android">\n    <style name="Theme.AppCompat.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">\n        <item name="colorPrimary">@color/colorPrimary</item>\n        <item name="colorAccent">@color/colorAccent</item>\n    </style>\n</resources>''')
                  changed=True
              drawables={"button_background.xml":'''<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android">\n    <solid android:color="#6200EE"/>\n    <corners android:radius="8dp"/>\n</shape>''',
                         "edittext_background.xml":'''<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android">\n    <solid android:color="#FFFFFF"/>\n    <stroke android:width="1dp" android:color="#6200EE"/>\n    <corners android:radius="8dp"/>\n</shape>'''}
              for name,cont in drawables.items():
                  p = f"{RES_DRAWABLE_DIR}/{name}"
                  if not os.path.exists(p):
                      write_file(p, cont)
                      changed=True
              return changed

          # Validate and fix all XML files (namespace, malformed)
          def validate_xml():
              fixed = 0
              for root_dir in [RES_VALUES_DIR, RES_DRAWABLE_DIR, RES_LAYOUT_DIR]:
                  if not os.path.exists(root_dir): continue
                  for fname in os.listdir(root_dir):
                      if not fname.endswith('.xml'): continue
                      fpath = os.path.join(root_dir, fname)
                      try:
                          tree = ET.parse(fpath)
                          root = tree.getroot()
                          if 'xmlns:android' not in root.attrib:
                              root.set('xmlns:android', 'http://schemas.android.com/apk/res/android')
                              tree.write(fpath, encoding='utf-8', xml_declaration=True)
                              log(f"Added namespace to {fpath}")
                              fixed += 1
                      except ET.ParseError as e:
                          log(f"Malformed XML {fpath}: {e}. Recreating default.", "ERROR")
                          os.rename(fpath, fpath + ".bad")
                          if 'colors' in fname:
                              write_file(fpath, '''<?xml version="1.0"?><resources><color name="colorPrimary">#6200EE</color></resources>''')
                          elif 'strings' in fname:
                              write_file(fpath, '''<?xml version="1.0"?><resources><string name="app_name">SystemPro</string></resources>''')
                          elif 'styles' in fname:
                              write_file(fpath, '''<?xml version="1.0"?><resources><style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar"/></resources>''')
                          else:
                              write_file(fpath, '''<?xml version="1.0"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#FFFFFF"/></shape>''')
                          fixed += 1
              return fixed

          # Fix build.gradle
          def fix_gradle():
              if not os.path.exists(GRADLE_BUILD):
                  g = f'''plugins {{ id 'com.android.application' }}
          android {{
              namespace '{TARGET_PACKAGE}'
              compileSdk 34
              defaultConfig {{
                  applicationId '{TARGET_PACKAGE}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }}
          }}
          dependencies {{
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }}'''
                  write_file(GRADLE_BUILD, g)
                  log("Created default build.gradle")
                  return True
              c = read_file(GRADLE_BUILD); orig=c
              if 'namespace' not in c:
                  c = c.replace('android {', f'android {{\n    namespace "{TARGET_PACKAGE}"')
                  log("Added namespace to gradle")
              if 'minSdk' not in c:
                  c = c.replace('defaultConfig {', 'defaultConfig {\n        minSdk 24')
              if 'targetSdk' not in c:
                  c = c.replace('defaultConfig {', 'defaultConfig {\n        targetSdk 34')
              if 'compileSdk' not in c:
                  c = c.replace('android {', 'android {\n    compileSdk 34')
              if 'androidx.appcompat:appcompat' not in c:
                  c = c.replace('dependencies {', 'dependencies {\n    implementation \'androidx.appcompat:appcompat:1.6.1\'')
              if c != orig:
                  write_file(GRADLE_BUILD, c)
                  return True
              return False

          def main():
              log("=== Static Fixer Started ===")
              fixes = 0
              if os.path.exists(JAVA_SRC_DIR):
                  for r,_,fs in os.walk(JAVA_SRC_DIR):
                      for f in fs:
                          if f.endswith('.java') and fix_java(os.path.join(r,f)): fixes+=1
              if os.path.exists(RES_LAYOUT_DIR):
                  for f in os.listdir(RES_LAYOUT_DIR):
                      if f.endswith('.xml') and fix_xml(os.path.join(RES_LAYOUT_DIR,f)): fixes+=1
              if fix_manifest(): fixes+=1
              if gen_res(): fixes+=1
              fixes += validate_xml()
              if fix_gradle(): fixes+=1
              log(f"Total fixes applied: {fixes}")
              log("=== Static Fixer Finished ===")
          if __name__ == "__main__": main()
          EOF
          python3 static_fixer.py

      # ========== 4. Core environment fallbacks ==========
      - name: Core Environment Setup
        run: |
          # Create default drawable if missing
          if [ ! -f app/src/main/res/drawable/edittext_background.xml ]; then
            echo -e '<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android">\n    <solid android:color="#1AFFFFFF"/>\n    <corners android:radius="8dp"/>\n</shape>' > app/src/main/res/drawable/edittext_background.xml
          fi
          # Ensure styles.xml exists with proper namespace
          if [ ! -f app/src/main/res/values/styles.xml ]; then
            echo -e '<?xml version="1.0" encoding="utf-8"?>\n<resources xmlns:android="http://schemas.android.com/apk/res/android">\n    <style name="Theme.AppCompat.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">\n        <item name="windowNoTitle">true</item>\n        <item name="windowActionBar">false</item>\n    </style>\n</resources>' > app/src/main/res/values/styles.xml
          fi
          # Ensure colors.xml exists
          if [ ! -f app/src/main/res/values/colors.xml ]; then
            echo -e '<?xml version="1.0" encoding="utf-8"?>\n<resources xmlns:android="http://schemas.android.com/apk/res/android">\n    <color name="colorPrimary">#02040c</color>\n    <color name="colorAccent">#00ffcc</color>\n</resources>' > app/src/main/res/values/colors.xml
          fi
          # Ensure AndroidManifest exists
          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo -e '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <application android:allowBackup="true" android:label="System Pro" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:theme="@style/Theme.AppCompat.NoActionBar">\n        <activity android:name=".MainActivity" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>' > app/src/main/AndroidManifest.xml
          fi
          # Ensure build.gradle exists
          if [ ! -f app/build.gradle ]; then
            echo -e 'plugins {\n    id "com.android.application"\n}\nandroid {\n    namespace "'"${{ env.TARGET_PACKAGE }}"'"\n    compileSdk 34\n    defaultConfig {\n        applicationId "'"${{ env.TARGET_PACKAGE }}"'"\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName "1.0"\n    }\n}\ndependencies {\n    implementation "androidx.appcompat:appcompat:1.6.1"\n    implementation "com.google.android.material:material:1.11.0"\n}' > app/build.gradle
          fi

      # ========== 5. Inject master permissions ==========
      - name: Inject Master Hardware & Background Permissions
        run: |
          MANIFEST_PATH="app/src/main/AndroidManifest.xml"
          PERMISSIONS=(
            "android.permission.INTERNET"
            "android.permission.ACCESS_WIFI_STATE"
            "android.permission.CHANGE_WIFI_STATE"
            "android.permission.ACCESS_NETWORK_STATE"
            "android.permission.BLUETOOTH"
            "android.permission.BLUETOOTH_ADMIN"
            "android.permission.BLUETOOTH_CONNECT"
            "android.permission.BLUETOOTH_SCAN"
            "android.permission.BLUETOOTH_ADVERTISE"
            "android.permission.CAMERA"
            "android.permission.READ_EXTERNAL_STORAGE"
            "android.permission.WRITE_EXTERNAL_STORAGE"
            "android.permission.MANAGE_EXTERNAL_STORAGE"
            "android.permission.FOREGROUND_SERVICE"
            "android.permission.SYSTEM_ALERT_WINDOW"
          )
          for PERM in "${PERMISSIONS[@]}"; do
            if ! grep -q "$PERM" "$MANIFEST_PATH"; then
              sed -i "/<manifest/a \    <uses-permission android:name=\"$PERM\" />" "$MANIFEST_PATH"
              echo "Added permission $PERM" >> output_report/fixer_log.txt
            fi
          done

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # ========== 6. Build attempt ==========
      - name: Build Asset APK
        id: build
        run: |
          gradle assembleDebug --no-daemon 2> output_report/gradle_err.log
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk
            echo "APK copied successfully" >> output_report/build_status.txt
          else
            echo "APK not found after build" >> output_report/build_status.txt
            exit 1
          fi

      # ========== 7. Validate APK ==========
      - name: Validate APK
        run: |
          if [ ! -f output_report/app-debug.apk ]; then
            echo "ERROR: APK file missing!"
            exit 1
          fi
          SIZE=$(stat -c%s output_report/app-debug.apk)
          if [ $SIZE -lt 50000 ]; then
            echo "WARNING: APK size is only $SIZE bytes (should be >50KB). Build may have failed silently."
            # We will still upload but show warning
          else
            echo "APK size is $SIZE bytes - OK"
          fi

      # ========== 8. Upload artifact (always) ==========
      - name: Upload Artifact (Always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: System-Pro-V2-Final
          path: output_report/
