name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Copy from build_assets to app structure
        run: |
          mkdir -p output_report
          rm -rf app/src/main/java app/src/main/res app/build
          
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME=${RAW_PKG:-"com.system.titan.pro"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          
          echo "TARGET_PACKAGE=$PKG_NAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$PKG_PATH" >> $GITHUB_ENV
          
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          
          if [ -d "build_assets/app" ]; then
            cp -rf build_assets/app/* app/
          fi
          if [ -f "build_assets/activity_main.xml" ]; then
            cp -f build_assets/activity_main.xml app/src/main/res/layout/activity_main.xml
          fi
          if [ -f "build_assets/colors.xml" ]; then
            cp -f build_assets/colors.xml app/src/main/res/values/colors.xml
          fi
          if [ -f "build_assets/app_icon.png" ]; then
            cp -f build_assets/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp -f build_assets/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          fi
          if [ -d "build_assets/java" ]; then
            cp -rf build_assets/java/* app/src/main/java/
          fi
          if [ -d "build_assets/src" ]; then
            cp -rf build_assets/src/* app/src/main/
          fi
          find build_assets -maxdepth 1 -name "*.java" -exec cp -f {} "app/src/main/java/$PKG_PATH/" \;

      - name: Force Custom Resources Integration (fallback)
        run: |
          if [ ! -f app/src/main/res/layout/activity_main.xml ]; then
              cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout android:background="#02040c" android:layout_height="match_parent" android:layout_width="match_parent" xmlns:android="http://schemas.android.com/apk/res/android">
              <TextView android:layout_centerInParent="true" android:layout_height="wrap_content" android:layout_width="wrap_content" android:text="System Pro Dynamic" android:textColor="#00ffcc" android:textSize="20sp"/>
          </RelativeLayout>
          EOF
          fi
          if [ ! -f app/src/main/res/values/colors.xml ]; then
              cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#02040c</color>
              <color name="colorAccent">#00ffcc</color>
          </resources>
          EOF
          fi

      # ========== FIX JAVA FILES WITH SED (DIRECT, NO PYTHON) ==========
      - name: Fix Java files (package, imports, semicolons)
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Target dir not found, skipping fixes"
            exit 0
          fi
          
          # Fix package line (replace any package with correct one)
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's/^package .*;/package ${{ env.TARGET_PACKAGE }};/g' {} \;
          
          # Fix import R
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's/import .*\.R;/import ${{ env.TARGET_PACKAGE }}.R;/g' {} \;
          
          # Add missing semicolons at end of lines that are field declarations (private/public/protected ...)
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i '/^[[:space:]]*\(private\|public\|protected\)/ s/\([^;{}]\)$/\1;/' {} \;
          
          # Add missing semicolon after super.onCreate(...) and setContentView(...)
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's/\(super\.[a-zA-Z]*(.*\)$/\1;/' {} \;
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's/\(setContentView(.*)\)$/\1;/' {} \;
          
          # Add missing semicolon after }) (anonymous class end)
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's/})$/});/g' {} \;
          
          # Add missing semicolon after variable assignments that don't end with ; { }
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i '/ = .*[^;{}]$/ s/$/;/' {} \;
          
          # Ensure CameraManager and CameraCharacteristics imports are present
          for file in $(find "$TARGET_DIR" -type f -name "*.java"); do
            if grep -q "CameraManager" "$file" && ! grep -q "import android.hardware.camera2.CameraManager" "$file"; then
              sed -i '/^package .*/a import android.hardware.camera2.CameraManager;' "$file"
            fi
            if grep -q "CameraCharacteristics" "$file" && ! grep -q "import android.hardware.camera2.CameraCharacteristics" "$file"; then
              sed -i '/^package .*/a import android.hardware.camera2.CameraCharacteristics;' "$file"
            fi
            if grep -q "Toast" "$file" && ! grep -q "import android.widget.Toast" "$file"; then
              sed -i '/^package .*/a import android.widget.Toast;' "$file"
            fi
          done

      - name: Build Main Class (Fallback if no Java file from payload)
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          if [ ! -f "$TARGET_DIR/MainActivity.java" ]; then
            mkdir -p "$TARGET_DIR"
            cat << 'EOF' > "$TARGET_DIR/MainActivity.java"
          package ${{ env.TARGET_PACKAGE }};

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import android.hardware.camera2.CameraManager;
          import android.hardware.camera2.CameraCharacteristics;

          public class MainActivity extends AppCompatActivity {
              private CameraManager cameraManager;
              private String cameraId;
              private boolean isTorchOn = false;
              private Button toggleButton;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  toggleButton = findViewById(R.id.toggleButton);
                  cameraManager = (CameraManager) getSystemService(CAMERA_SERVICE);
                  try {
                      cameraId = cameraManager.getCameraIdList()[0];
                  } catch (Exception e) {
                      Toast.makeText(this, "Error: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                  }
                  toggleButton.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                              ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.CAMERA}, 1);
                              return;
                          }
                          try {
                              if (isTorchOn) {
                                  cameraManager.setTorchMode(cameraId, false);
                                  isTorchOn = false;
                                  toggleButton.setText(R.string.torch_off);
                              } else {
                                  cameraManager.setTorchMode(cameraId, true);
                                  isTorchOn = true;
                                  toggleButton.setText(R.string.torch_on);
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Error: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                          }
                      }
                  });
              }
          }
          EOF
          fi

      - name: Core Environment Setup (Resources, Manifest, Gradle)
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/values
          cat > app/src/main/res/drawable/edittext_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1AFFFFFF"/>
              <corners android:radius="8dp"/>
          </shape>
          EOF
          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="windowNoTitle">true</item>
                  <item name="windowActionBar">false</item>
              </style>
          </resources>
          EOF
          if [ ! -f app/src/main/res/values/strings.xml ]; then
            cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">System Pro</string>
              <string name="torch_on">Torch On</string>
              <string name="torch_off">Torch Off</string>
          </resources>
          EOF
          else
            if ! grep -q 'torch_on' app/src/main/res/values/strings.xml; then
              sed -i '/<\/resources>/i \    <string name="torch_on">Torch On</string>\n    <string name="torch_off">Torch Off</string>' app/src/main/res/values/strings.xml
            fi
          fi
          cat > app/src/main/res/drawable/button_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#6200EE"/>
              <corners android:radius="8dp"/>
          </shape>
          EOF
          if [ ! -f app/src/main/res/mipmap-hdpi/ic_launcher.png ]; then
            curl -s -o app/src/main/res/mipmap-hdpi/ic_launcher.png https://raw.githubusercontent.com/actions/automating-with-github-actions/master/shared/workflow-run.png || touch app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp -f app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          fi
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace "${{ env.TARGET_PACKAGE }}"
              compileSdk 34
              defaultConfig {
                  applicationId "${{ env.TARGET_PACKAGE }}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Inject Master Permissions (add missing)
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          for perm in "android.permission.CAMERA" "android.permission.READ_EXTERNAL_STORAGE" "android.permission.WRITE_EXTERNAL_STORAGE" "android.permission.BLUETOOTH" "android.permission.BLUETOOTH_CONNECT" "android.permission.BLUETOOTH_SCAN"; do
            if ! grep -q "$perm" "$MANIFEST"; then
              sed -i "/<manifest/a \    <uses-permission android:name=\"$perm\" />" "$MANIFEST"
            fi
          done

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon 2> output_report/gradle_err.log
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk
          else
            echo "APK not found" >> output_report/build_summary.txt
            exit 1
          fi

      - name: Validate APK Size
        run: |
          SIZE=$(stat -c%s output_report/app-debug.apk 2>/dev/null || echo 0)
          if [ $SIZE -lt 50000 ]; then
            echo "APK too small ($SIZE bytes)" >> output_report/build_summary.txt
            exit 1
          else
            echo "APK size OK ($SIZE bytes)" >> output_report/build_summary.txt
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: System-Pro-V2-Final
          path: output_report/
