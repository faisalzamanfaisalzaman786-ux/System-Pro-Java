name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TARGET_PACKAGE: "com.system.titan.pro"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Workspace & Decode Payload
        run: |
          mkdir -p output_report
          # پے لوڈ کو ڈیکوڈ کریں
          echo "${{ github.event.client_payload.payload }}" | base64 -d > app_payload.zip
          unzip -o app_payload.zip -d extracted_payload/ || true
          
          # فائلز کو صحیح جگہ پر کاپی کریں
          mkdir -p app/src/main/java/${{ env.TARGET_PACKAGE | replace('.', '/') }}
          [ -d extracted_payload ] && cp -f extracted_payload/*.java app/src/main/java/${{ env.TARGET_PACKAGE | replace('.', '/') }}/ 2>/dev/null || true
          [ -d extracted_payload ] && cp -f extracted_payload/*.xml app/src/main/res/layout/ 2>/dev/null || true

      - name: Run Static AI Fixer (Safe Mode)
        run: |
          # آپ کا اپ ڈیٹ کردہ پائتھن اسکرپٹ (جو اب محفوظ طریقے سے کوڈ فکس کرے گا)
          python3 static_fixer.py

      - name: Build and Error Capture
        id: build_step
        run: |
          chmod +x gradlew
          # بلڈ کو رن کریں اور ایررز کو build_log.txt میں سیو کریں
          if ! ./gradlew assembleDebug --no-daemon > build_log.txt 2>&1; then
            echo "BUILD_FAILED=true" >> $GITHUB_ENV
          fi

      - name: AI Auto-Fixer (Groq Integration)
        if: env.BUILD_FAILED == 'true'
        run: |
          echo "Analyzing failures with Groq AI Engineer..."
          ERR_SNIPPET=$(tail -n 100 build_log.txt)
          curl -X POST "https://api.groq.com/openai/v1/chat/completions" \
               -H "Authorization: Bearer $GROQ_API_KEY" \
               -H "Content-Type: application/json" \
               -d "{
                 \"model\": \"llama-3.3-70b-versatile\",
                 \"messages\": [
                   {\"role\": \"system\", \"content\": \"You are an expert Android Build Engineer. Fix Gradle errors, dependency conflicts, and syntax issues. Provide only concrete solutions or code snippets.\"},
                   {\"role\": \"user\", \"content\": \"The Android build failed. Here is the gradle error log: $ERR_SNIPPET. Please analyze and provide the exact fix.\"}
                 ]
               }" > ai_fix_suggestion.json

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Build-Logs-and-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            output_report/fixer_log.txt
            build_log.txt
            ai_fix_suggestion.json
          if-no-files-found: warn
