name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'zulu' }

      - name: Prepare Workspace
        run: |
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          mkdir -p gradle/wrapper app/src/main/java/com/system/pro app/src/main/res/layout app/src/main/res/mipmap-mdpi

      - name: Inject Professional Configs
        run: |
          # 1. gradle.properties
          echo "android.useAndroidX=true
          android.enableJetifier=true" > gradle.properties

          # 2. Settings.gradle
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'SystemPro'
          include ':app'" > settings.gradle
          
          # 3. Build.gradle
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          
          # 4. App Build.gradle
          echo "plugins { id 'com.android.application' }
          android {
              namespace 'com.system.pro'
              compileSdk 34
              defaultConfig { applicationId 'com.system.pro'; minSdk 24; targetSdk 34 }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }" > app/build.gradle

      - name: Setup Wrapper, Source, Launcher Icon and Manifest
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          
          # 1. ایپ کے لیے ایک عارضی مڈپائی آئیکن بنانا (یہاں اینڈرائیڈ کا ڈیفالٹ آئیکن جنریٹ ہوگا)
          echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF0000" android:pathData="M12,2L2,22h20L12,2zM12,6l6.5,13h-13L12,6z"/></vector>' > app/src/main/res/mipmap-mdpi/ic_launcher.xml

          # 2. درست اینڈرائیڈ مینی فیسٹ (جس میں لانچر اور آئیکن دونوں سیٹ ہیں)
          echo '<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application 
                  android:allowBackup="true" 
                  android:label="System Pro" 
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name="com.system.pro.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>' > app/src/main/AndroidManifest.xml
          
          # 3. جاوا کوڈ
          echo 'package com.system.pro; import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; public class MainActivity extends AppCompatActivity { @Override protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); } }' > app/src/main/java/com/system/pro/MainActivity.java

      - name: Final Build
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with: { name: System-Pro-Titan-APK, path: app/build/outputs/apk/debug/app-debug.apk }
