name: System Pro Titan Master Build (from build_assets)

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ========== NEW: Copy assets from build_assets folder ==========
      - name: Copy from build_assets to app structure
        run: |
          mkdir -p output_report
          # Remove any previous app source to avoid conflicts
          rm -rf app/src/main/java app/src/main/res app/build
          
          # Get package name from client payload
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME=${RAW_PKG:-"com.system.titan.pro"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          
          echo "TARGET_PACKAGE=$PKG_NAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$PKG_PATH" >> $GITHUB_ENV
          
          # Create target directories
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          
          # Copy the entire app folder from build_assets (if exists)
          if [ -d "build_assets/app" ]; then
            cp -rf build_assets/app/* app/
          fi
          
          # Copy individual resource files if they exist directly in build_assets
          if [ -f "build_assets/activity_main.xml" ]; then
            cp -f build_assets/activity_main.xml app/src/main/res/layout/activity_main.xml
          fi
          if [ -f "build_assets/colors.xml" ]; then
            cp -f build_assets/colors.xml app/src/main/res/values/colors.xml
          fi
          if [ -f "build_assets/AndroidManifest.xml" ]; then
            cp -f build_assets/AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi
          
          # Copy app icon if present
          if [ -f "build_assets/app_icon.png" ]; then
            cp -f build_assets/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp -f build_assets/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          fi
          
          # Copy any Java files from build_assets (they may be inside build_assets/java/ or directly)
          if [ -d "build_assets/java" ]; then
            cp -rf build_assets/java/* app/src/main/java/
          fi
          if [ -d "build_assets/src" ]; then
            cp -rf build_assets/src/* app/src/main/
          fi
          
          # Ensure that Java files are in the correct package folder
          # Move any loose Java files into the package directory
          find build_assets -maxdepth 1 -name "*.java" -exec cp -f {} "app/src/main/java/$PKG_PATH/" \;

      # ========== Fix package names and imports ==========
      - name: Fix Package Name & Imports in Java Files
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          if [ -d "$TARGET_DIR" ]; then
            # Fix package statement (allow leading whitespace)
            find "$TARGET_DIR" -type f -name "*.java" -exec sed -i "s|^[[:space:]]*package .*;|package ${{ env.TARGET_PACKAGE }};|g" {} \;
            # Fix import statements for R
            find "$TARGET_DIR" -type f -name "*.java" -exec sed -i "s|import .*\.R;|import ${{ env.TARGET_PACKAGE }}.R;|g" {} \;
            # If no package line, add it
            for file in $(find "$TARGET_DIR" -type f -name "*.java"); do
              if ! grep -q "^[[:space:]]*package" "$file"; then
                sed -i "1i package ${{ env.TARGET_PACKAGE }};" "$file"
              fi
            done
          fi

      # ========== Fallback MainActivity if missing ==========
      - name: Build Main Class (Fallback)
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          if [ ! -f "$TARGET_DIR/MainActivity.java" ]; then
            mkdir -p "$TARGET_DIR"
            cat << 'EOF' > "$TARGET_DIR/MainActivity.java"
          package ${{ env.TARGET_PACKAGE }};

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {
              private static final int PERMISSION_REQ_CODE = 2026;
              private static final int MANAGE_STORAGE_REQ_CODE = 2027;

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  setContentView(getLayoutResourceId());
                  checkAndRequestRuntimePermissions();
              }

              private int getLayoutResourceId() {
                  return getResources().getIdentifier("activity_main", "layout", getPackageName());
              }

              private void checkAndRequestRuntimePermissions() {
                  List<String> permissionsNeeded = new ArrayList<>();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      addPermissionIfMissing(permissionsNeeded, Manifest.permission.BLUETOOTH_CONNECT);
                      addPermissionIfMissing(permissionsNeeded, Manifest.permission.BLUETOOTH_SCAN);
                      addPermissionIfMissing(permissionsNeeded, Manifest.permission.BLUETOOTH_ADVERTISE);
                  }

                  addPermissionIfMissing(permissionsNeeded, Manifest.permission.CAMERA);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      addPermissionIfMissing(permissionsNeeded, "android.permission.POST_NOTIFICATIONS");
                  }

                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.TIRAMISU) {
                      addPermissionIfMissing(permissionsNeeded, Manifest.permission.READ_EXTERNAL_STORAGE);
                      addPermissionIfMissing(permissionsNeeded, Manifest.permission.WRITE_EXTERNAL_STORAGE);
                  }

                  if (!permissionsNeeded.isEmpty()) {
                      ActivityCompat.requestPermissions(this, permissionsNeeded.toArray(new String[0]), PERMISSION_REQ_CODE);
                  } else {
                      checkSpecialPermissions();
                  }
              }

              private void addPermissionIfMissing(List<String> list, String permission) {
                  if (ContextCompat.checkSelfPermission(this, permission) != PackageManager.PERMISSION_GRANTED) {
                      list.add(permission);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == PERMISSION_REQ_CODE) {
                      checkSpecialPermissions();
                  }
              }

              private void checkSpecialPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          try {
                              Intent intent = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                              intent.addCategory("android.intent.category.DEFAULT");
                              intent.setData(Uri.parse(String.format("package:%s", getPackageName())));
                              startActivityForResult(intent, MANAGE_STORAGE_REQ_CODE);
                          } catch (Exception e) {
                              Intent intent = new Intent();
                              intent.setAction(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION);
                              startActivityForResult(intent, MANAGE_STORAGE_REQ_CODE);
                          }
                      }
                  }
              }
          }
          EOF
          fi

      # ========== Core Environment Setup (Fallbacks) ==========
      - name: Core Environment Setup
        run: |
          # Create default drawable if missing
          if [ ! -f app/src/main/res/drawable/edittext_background.xml ]; then
            echo -e '<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android">\n    <solid android:color="#1AFFFFFF"/>\n    <corners android:radius="8dp"/>\n</shape>' > app/src/main/res/drawable/edittext_background.xml
          fi
          
          # Create default styles if missing
          if [ ! -f app/src/main/res/values/styles.xml ]; then
            echo -e '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="Theme.AppCompat.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">\n        <item name="windowNoTitle">true</item>\n        <item name="windowActionBar">false</item>\n    </style>\n</resources>' > app/src/main/res/values/styles.xml
          fi

          # Default colors if missing
          if [ ! -f app/src/main/res/values/colors.xml ]; then
            echo -e '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="colorPrimary">#02040c</color>\n    <color name="colorAccent">#00ffcc</color>\n</resources>' > app/src/main/res/values/colors.xml
          fi

          # Default AndroidManifest if missing
          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo -e '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="'"${{ env.TARGET_PACKAGE }}"'">\n    <application android:allowBackup="true" android:label="System Pro" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:theme="@style/Theme.AppCompat.NoActionBar">\n        <activity android:name=".MainActivity" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>' > app/src/main/AndroidManifest.xml
          fi

          # Default build.gradle if missing
          if [ ! -f app/build.gradle ]; then
            echo -e 'plugins {\n    id "com.android.application"\n}\nandroid {\n    namespace "'"${{ env.TARGET_PACKAGE }}"'"\n    compileSdk 34\n    defaultConfig {\n        applicationId "'"${{ env.TARGET_PACKAGE }}"'"\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName "1.0"\n    }\n}\ndependencies {\n    implementation "androidx.appcompat:appcompat:1.6.1"\n    implementation "com.google.android.material:material:1.11.0"\n}' > app/build.gradle
          fi

      # ========== Inject Permissions ==========
      - name: Inject Master Hardware & Background Permissions
        run: |
          MANIFEST_PATH="app/src/main/AndroidManifest.xml"
          PERMISSIONS=(
            "android.permission.INTERNET"
            "android.permission.ACCESS_WIFI_STATE"
            "android.permission.CHANGE_WIFI_STATE"
            "android.permission.ACCESS_NETWORK_STATE"
            "android.permission.BLUETOOTH"
            "android.permission.BLUETOOTH_ADMIN"
            "android.permission.BLUETOOTH_CONNECT"
            "android.permission.BLUETOOTH_SCAN"
            "android.permission.BLUETOOTH_ADVERTISE"
            "android.permission.CAMERA"
            "android.permission.READ_EXTERNAL_STORAGE"
            "android.permission.WRITE_EXTERNAL_STORAGE"
            "android.permission.MANAGE_EXTERNAL_STORAGE"
            "android.permission.FOREGROUND_SERVICE"
            "android.permission.SYSTEM_ALERT_WINDOW"
          )
          for PERM in "${PERMISSIONS[@]}"; do
            if ! grep -q "$PERM" "$MANIFEST_PATH"; then
              sed -i "/<manifest/a \    <uses-permission android:name=\"$PERM\" />" "$MANIFEST_PATH"
            fi
          done

      - name: Setup Gradle 8.5 Explicitly
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Asset APK
        run: |
          gradle assembleDebug --no-daemon 2> output_report/gradle_err.log
          cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk

      - name: Upload Artifact (Always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: System-Pro-V2-Final
          path: output_report/
