name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Lock Gradle 8.5 Environment
        run: |
          mkdir -p gradle/wrapper
          # گریڈل کے ورژن کو 8.5 پر سختی سے پابند کر دیا
          echo "distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists" > gradle/wrapper/gradle-wrapper.properties
          
          # Wrapper Jar کو ری جنریٹ کرنا تاکہ کوئی اور ورژن مداخلت نہ کرے
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew || true

      - name: Write Enterprise Gradle Files
        run: |
          # Settings.gradle
          echo "rootProject.name = 'SystemPro'
          include ':app'" > settings.gradle
          
          # Root Build.gradle (8.2.2 Plugin + 8.5 Gradle)
          echo "buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }" > build.gradle
          
          # App Build.gradle (ViewBinding + Strict Config)
          echo "plugins { id 'com.android.application' }
          android {
              namespace 'com.system.pro'
              compileSdk 34
              buildFeatures { viewBinding true }
              defaultConfig { 
                  applicationId 'com.system.pro'
                  minSdk 24
                  targetSdk 34 
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }" > app/build.gradle

      - name: Generate Professional Source Code
        run: |
          mkdir -p app/src/main/java/com/system/pro
          mkdir -p app/src/main/res/layout
          
          cat << 'EOF' > app/src/main/java/com/system/pro/MainActivity.java
          package com.system.pro;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          import com.system.pro.databinding.ActivityMainBinding;
          import android.hardware.camera2.CameraManager;
          public class MainActivity extends AppCompatActivity {
              private ActivityMainBinding binding;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  binding = ActivityMainBinding.inflate(getLayoutInflater());
                  setContentView(binding.getRoot());
                  binding.torchButton.setOnClickListener(v -> {
                      try {
                          CameraManager m = (CameraManager) getSystemService(CAMERA_SERVICE);
                          String id = m.getCameraIdList()[0];
                          m.setTorchMode(id, true);
                      } catch (Exception e) {}
                  });
              }
          }
          EOF

          echo '<RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent"><Button android:id="@+id/torchButton" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Toggle Torch" android:layout_centerInParent="true"/></RelativeLayout>' > app/src/main/res/layout/activity_main.xml

      - name: Titan Build Execution
        run: |
          # 8.5 کے ساتھ بلڈ کو رن کرنا
          ./gradlew assembleDebug --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Titan-APK
          path: app/build/outputs/apk/debug/app-debug.apk
