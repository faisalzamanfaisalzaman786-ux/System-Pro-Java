name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Prepare Workspace
        run: |
          find . -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'build_assets' ! -name '.' -exec rm -rf {} +
          mkdir -p gradle/wrapper app/src/main/java app/src/main/res/layout app/src/main/res/values app/src/main/res/mipmap-mdpi

      - name: Dynamic Package Setup
        run: |
          PKG_NAME="${{ github.event.client_payload.package_name }}"
          if [ -z "$PKG_NAME" ]; then PKG_NAME="com.system.pro"; fi
          echo "PACKAGE_NAME=$PKG_NAME" >> $GITHUB_ENV
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          echo "PKG_PATH=$PKG_PATH" >> $GITHUB_ENV

      - name: Inject Configuration and Build Scripts
        run: |
          echo "android.useAndroidX=true
          android.enableJetifier=true" > gradle.properties
          
          echo "pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'SystemPro'
          include ':app'" > settings.gradle
          
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          
          echo "plugins { id 'com.android.application' }
          android {
              namespace '${{ env.PACKAGE_NAME }}'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ env.PACKAGE_NAME }}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }" > app/build.gradle

      - name: Inject Assets from build_assets
        run: |
          if [ -d "build_assets" ]; then
            if [ -d "build_assets/app" ]; then
              cp -r build_assets/app/* app/
            fi
            if [ -f "build_assets/AndroidManifest.xml" ]; then
              cp build_assets/AndroidManifest.xml app/src/main/AndroidManifest.xml
            fi
            if [ -f "build_assets/app_icon.png" ]; then
              cp build_assets/app_icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
            fi
          fi

      - name: Fallback Resources if Missing
        run: |
          if [ ! -f "app/src/main/res/values/styles.xml" ]; then
            echo '<resources><style name="Theme.SystemPro" parent="Theme.AppCompat.Light.NoActionBar"><item name="colorPrimary">#FF0000</item><item name="android:windowBackground">#121212</item></style></resources>' > app/src/main/res/values/styles.xml
          fi
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo -e "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" package=\"${{ env.PACKAGE_NAME }}\">\n<uses-permission android:name=\"android.permission.CAMERA\" />\n<uses-permission android:name=\"android.permission.INTERNET\" />\n<application android:allowBackup=\"true\" android:label=\"System Pro\" android:icon=\"@mipmap/ic_launcher\" android:theme=\"@style/Theme.SystemPro\">\n<activity android:name=\".MainActivity\" android:exported=\"true\">\n<intent-filter>\n<action android:name=\"android.intent.action.MAIN\" />\n<category android:name=\"android.intent.category.LAUNCHER\" />\n</intent-filter>\n</activity>\n</application>\n</manifest>" > app/src/main/AndroidManifest.xml
          fi

      - name: Final Build
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final
          path: app/build/outputs/apk/debug/app-debug.apk
