name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [android_full_build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Decode payload from UI
      - name: Decode payload
        run: |
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            DECODED_PKG=$(echo "${{ github.event.client_payload.package_name }}" | base64 --decode)
            echo "CUSTOM_PACKAGE=$DECODED_PKG" >> $GITHUB_ENV
          fi
          if [ -n "${{ github.event.client_payload.app_name }}" ]; then
            DECODED_APP=$(echo "${{ github.event.client_payload.app_name }}" | base64 --decode)
            echo "CUSTOM_APPNAME=$DECODED_APP" >> $GITHUB_ENV
          fi
          if [ -n "${{ github.event.client_payload.icon_matrix }}" ]; then
            echo "ICON_MATRIX=${{ github.event.client_payload.icon_matrix }}" >> $GITHUB_ENV
          fi

      - name: Set defaults
        run: |
          if [ -z "$CUSTOM_PACKAGE" ]; then
            echo "CUSTOM_PACKAGE=com.systempro.app" >> $GITHUB_ENV
          fi
          if [ -z "$CUSTOM_APPNAME" ]; then
            echo "CUSTOM_APPNAME=SystemProApp" >> $GITHUB_ENV
          fi

      # Clean previous build artifacts
      - name: Clean old files
        run: |
          rm -rf app build.gradle settings.gradle gradle gradlew

      # Create directory structure
      - name: Create directories
        run: |
          PKG_PATH=$(echo $CUSTOM_PACKAGE | tr '.' '/')
          mkdir -p app/src/main/java/$PKG_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$density
          done

      # AndroidManifest.xml
      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="$CUSTOM_PACKAGE">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="$CUSTOM_APPNAME"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      # MainActivity.java (WebView)
      - name: Create MainActivity.java
        run: |
          PKG_PATH=$(echo $CUSTOM_PACKAGE | tr '.' '/')
          cat > app/src/main/java/$PKG_PATH/MainActivity.java << EOF
          package $CUSTOM_PACKAGE;

          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://www.google.com");
                  setContentView(webView);
              }
          }
          EOF

      # activity_main.xml (empty layout)
      - name: Create activity_main.xml
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          EOF

      # strings.xml
      - name: Create strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << EOF
          <resources>
              <string name="app_name">$CUSTOM_APPNAME</string>
          </resources>
          EOF

      # colors.xml
      - name: Create colors.xml
        run: |
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources>
              <color name="colorPrimary">#6200EE</color>
              <color name="colorPrimaryDark">#3700B3</color>
              <color name="colorAccent">#03DAC5</color>
          </resources>
          EOF

      # themes.xml
      - name: Create themes.xml
        run: |
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.AppCompat.Light.DarkActionBar" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          EOF

      # Dummy icons (overwritten by custom if present)
      - name: Create dummy icons
        run: |
          DUMMY_ICON_B64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            echo "$DUMMY_ICON_B64" | base64 -d > app/src/main/res/mipmap-$density/ic_launcher.png
            cp app/src/main/res/mipmap-$density/ic_launcher.png app/src/main/res/mipmap-$density/ic_launcher_round.png
          done

      - name: Apply custom icons
        if: env.ICON_MATRIX != ''
        run: |
          echo "$ICON_MATRIX" > /tmp/icons.json
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            b64=$(jq -r ".\"$density\"" /tmp/icons.json 2>/dev/null)
            if [ -n "$b64" ] && [ "$b64" != "null" ]; then
              echo "$b64" | base64 -d > app/src/main/res/mipmap-$density/ic_launcher.png
              cp app/src/main/res/mipmap-$density/ic_launcher.png app/src/main/res/mipmap-$density/ic_launcher_round.png
            fi
          done

      # Project build.gradle
      - name: Create project build.gradle
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.3.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      # settings.gradle
      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          rootProject.name = "SystemPro"
          include ':app'
          EOF

      # app/build.gradle
      - name: Create app/build.gradle
        run: |
          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '$CUSTOM_PACKAGE'
              compileSdk 34

              defaultConfig {
                  applicationId '$CUSTOM_PACKAGE'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      # gradle.properties (fix AndroidX)
      - name: Create gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      # Setup Gradle wrapper (version 8.5)
      - name: Setup Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x gradlew

      # Build APK using wrapper
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
