name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'zulu' }

      - name: Prepare Workspace
        run: |
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          mkdir -p gradle/wrapper app/src/main/java app/src/main/res/layout app/src/main/res/values app/src/main/res/mipmap-mdpi

      - name: Dynamic Package Setup
        run: |
          PKG_NAME="${{ github.event.client_payload.package_name }}"
          if [ -z "$PKG_NAME" ]; then PKG_NAME="com.system.pro"; fi
          echo "PACKAGE_NAME=$PKG_NAME" >> $GITHUB_ENV
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          echo "PKG_PATH=$PKG_PATH" >> $GITHUB_ENV

      - name: Inject Configuration and Build Scripts
        run: |
          echo "android.useAndroidX=true
          android.enableJetifier=true" > gradle.properties

          echo "rootProject.name = 'SystemPro'
          include ':app'" > settings.gradle
          
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          
          echo "plugins { id 'com.android.application' }
          android {
              namespace '${{ env.PACKAGE_NAME }}'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ env.PACKAGE_NAME }}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }" > app/build.gradle

      - name: Inject Assets and UI
        run: |
          if [ ! -z "${{ github.event.client_payload.app_icon_b64 }}" ]; then
            echo "${{ github.event.client_payload.app_icon_b64 }}" | base64 -d > app/src/main/res/mipmap-mdpi/ic_launcher.png
          fi
          
          echo '<resources><style name="Theme.SystemPro" parent="Theme.AppCompat.Light.NoActionBar"><item name="colorPrimary">#FF0000</item><item name="android:windowBackground">#121212</item></style></resources>' > app/src/main/res/values/styles.xml
          
          if [ ! -z "${{ github.event.client_payload.layout_xml }}" ]; then
            echo "${{ github.event.client_payload.layout_xml }}" > app/src/main/res/layout/activity_main.xml
          else
            echo -e '<?xml version="1.0" encoding="utf-8"?>\n<RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#121212"></RelativeLayout>' > app/src/main/res/layout/activity_main.xml
          fi

      - name: Setup Manifest and MainActivity
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

          echo -e "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" package=\"${{ env.PACKAGE_NAME }}\">\n<uses-permission android:name=\"android.permission.CAMERA\" />\n<uses-permission android:name=\"android.permission.INTERNET\" />\n<application android:allowBackup=\"true\" android:label=\"System Pro\" android:icon=\"@mipmap/ic_launcher\" android:theme=\"@style/Theme.SystemPro\">\n<activity android:name=\".MainActivity\" android:exported=\"true\">\n<intent-filter>\n<action android:name=\"android.intent.action.MAIN\" />\n<category android:name=\"android.intent.category.LAUNCHER\" />\n</intent-filter>\n</activity>\n</application>\n</manifest>" > app/src/main/AndroidManifest.xml

          if [ ! -z "${{ github.event.client_payload.main_activity_java }}" ]; then
            echo "${{ github.event.client_payload.main_activity_java }}" > "app/src/main/java/${{ env.PKG_PATH }}/MainActivity.java"
          else
            echo -e "package ${{ env.PACKAGE_NAME }};\nimport android.os.Bundle;\nimport androidx.appcompat.app.AppCompatActivity;\npublic class MainActivity extends AppCompatActivity {\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\nsuper.onCreate(savedInstanceState);\nsetContentView(R.layout.activity_main);\n}\n}" > "app/src/main/java/${{ env.PKG_PATH }}/MainActivity.java"
          fi

      - name: Final Build
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with: { name: System-Pro-Titan-APK, path: app/build/outputs/apk/debug/app-debug.apk }
