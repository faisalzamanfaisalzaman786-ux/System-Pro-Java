name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Base Payload Decode
        run: |
          mkdir -p output_report
          rm -rf app/src/main/java app/src/main/res app/build
          rm -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME=${RAW_PKG:-"com.system.titan.pro"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          
          echo "TARGET_PACKAGE=$PKG_NAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$PKG_PATH" >> $GITHUB_ENV
          
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          
          echo "${{ github.event.client_payload.payload }}" | base64 -d > app_payload.zip || true
          if [ -s app_payload.zip ]; then
            unzip -o app_payload.zip -d extracted_payload/ || true
          fi

      - name: Copy User Resources (No Default Override)
        run: |
          # Copy layout if provided by user
          if [ -f extracted_payload/activity_main.xml ]; then
            cp -f extracted_payload/activity_main.xml app/src/main/res/layout/activity_main.xml
            echo "Using user's activity_main.xml"
          elif [ -f extracted_payload/layout_config.txt ]; then
            cp -f extracted_payload/layout_config.txt app/src/main/res/layout/activity_main.xml
            echo "Using user's layout_config.txt as activity_main.xml"
          fi
          
          # Copy colors.xml if provided
          if [ -f extracted_payload/colors.xml ]; then
            cp -f extracted_payload/colors.xml app/src/main/res/values/colors.xml
            echo "Using user's colors.xml"
          fi
          
          # Copy any other XML resources (like drawables, etc.) but don't overwrite if already copied
          if [ -d extracted_payload ]; then
            find extracted_payload -type f -name "*.xml" ! -name "activity_main.xml" ! -name "colors.xml" ! -name "AndroidManifest.xml" -exec cp -n {} app/src/main/res/layout/ \; 2>/dev/null || true
          fi

      - name: Copy User Java Sources
        run: |
          if [ -d extracted_payload ]; then
            find extracted_payload -type f -name "*.java" -exec cp -f {} app/src/main/java/${{ env.TARGET_PATH }}/ \;
            echo "Copied Java files from payload"
          fi

      - name: Fix Package Name & Imports in Java Files
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          if [ -d "$TARGET_DIR" ]; then
            find "$TARGET_DIR" -type f -name "*.java" -exec sed -i "s|^[[:space:]]*package .*;|package ${{ env.TARGET_PACKAGE }};|g" {} \;
            find "$TARGET_DIR" -type f -name "*.java" -exec sed -i "s|import .*\.R;|import ${{ env.TARGET_PACKAGE }}.R;|g" {} \;
            for file in $(find "$TARGET_DIR" -type f -name "*.java"); do
              if ! grep -q "^[[:space:]]*package" "$file"; then
                sed -i "1i package ${{ env.TARGET_PACKAGE }};" "$file"
              fi
            done
          fi

      # ========== FALLBACK ONLY IF USER DID NOT PROVIDE MAIN ACTIVITY ==========
      - name: Fallback MainActivity (only if missing)
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          if [ ! -f "$TARGET_DIR/MainActivity.java" ]; then
            mkdir -p "$TARGET_DIR"
            cat << 'EOF' > "$TARGET_DIR/MainActivity.java"
          package ${{ env.TARGET_PACKAGE }};

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {
              private static final int PERMISSION_REQ_CODE = 2026;
              private static final int MANAGE_STORAGE_REQ_CODE = 2027;

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  setContentView(getLayoutResourceId());
                  checkAndRequestRuntimePermissions();
              }

              private int getLayoutResourceId() {
                  return getResources().getIdentifier("activity_main", "layout", getPackageName());
              }

              private void checkAndRequestRuntimePermissions() {
                  List<String> permissionsNeeded = new ArrayList<>();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      addPermissionIfMissing(permissionsNeeded, Manifest.permission.BLUETOOTH_CONNECT);
                      addPermissionIfMissing(permissionsNeeded, Manifest.permission.BLUETOOTH_SCAN);
                      addPermissionIfMissing(permissionsNeeded, Manifest.permission.BLUETOOTH_ADVERTISE);
                  }
                  addPermissionIfMissing(permissionsNeeded, Manifest.permission.CAMERA);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      addPermissionIfMissing(permissionsNeeded, "android.permission.POST_NOTIFICATIONS");
                  }
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.TIRAMISU) {
                      addPermissionIfMissing(permissionsNeeded, Manifest.permission.READ_EXTERNAL_STORAGE);
                      addPermissionIfMissing(permissionsNeeded, Manifest.permission.WRITE_EXTERNAL_STORAGE);
                  }
                  if (!permissionsNeeded.isEmpty()) {
                      ActivityCompat.requestPermissions(this, permissionsNeeded.toArray(new String[0]), PERMISSION_REQ_CODE);
                  } else {
                      checkSpecialPermissions();
                  }
              }

              private void addPermissionIfMissing(List<String> list, String permission) {
                  if (ContextCompat.checkSelfPermission(this, permission) != PackageManager.PERMISSION_GRANTED) {
                      list.add(permission);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == PERMISSION_REQ_CODE) {
                      checkSpecialPermissions();
                  }
              }

              private void checkSpecialPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          try {
                              Intent intent = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                              intent.addCategory("android.intent.category.DEFAULT");
                              intent.setData(Uri.parse(String.format("package:%s", getPackageName())));
                              startActivityForResult(intent, MANAGE_STORAGE_REQ_CODE);
                          } catch (Exception e) {
                              Intent intent = new Intent();
                              intent.setAction(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION);
                              startActivityForResult(intent, MANAGE_STORAGE_REQ_CODE);
                          }
                      }
                  }
              }
          }
          EOF
          echo "Created fallback MainActivity because user did not provide one"
          fi

      # ========== ONLY ADD MISSING RESOURCES IF THEY ARE NEEDED FOR BUILD (but never overwrite user's) ==========
      - name: Add minimal missing resources (only if build would fail without them)
        run: |
          # Check if strings.xml exists, if not create minimal one (but never overwrite)
          if [ ! -f app/src/main/res/values/strings.xml ]; then
            mkdir -p app/src/main/res/values
            cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">SystemPro</string>
          </resources>
          EOF
            echo "Created minimal strings.xml (user did not provide)"
          fi
          
          # Check if colors.xml exists, if not create minimal
          if [ ! -f app/src/main/res/values/colors.xml ]; then
            cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#6200EE</color>
              <color name="colorAccent">#03DAC5</color>
          </resources>
          EOF
            echo "Created minimal colors.xml (user did not provide)"
          fi
          
          # Check if styles.xml exists, if not create minimal
          if [ ! -f app/src/main/res/values/styles.xml ]; then
            cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          EOF
            echo "Created minimal styles.xml (user did not provide)"
          fi

      - name: Copy User App Icon
        run: |
          if [ -f extracted_payload/app_icon.png ]; then
            cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            echo "Using user's app icon"
          else
            # Create a dummy icon so build doesn't fail, but it's just a placeholder
            echo "No user icon provided, using default dummy icon"
            # Create a tiny 1x1 transparent PNG base64 (minimal)
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          fi

      - name: Create AndroidManifest (without package attribute)
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "${{ env.TARGET_PACKAGE }}"
              compileSdk 34

              defaultConfig {
                  applicationId "${{ env.TARGET_PACKAGE }}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Inject Master Permissions (add missing ones only)
        run: |
          MANIFEST_PATH="app/src/main/AndroidManifest.xml"
          PERMISSIONS=(
            "android.permission.INTERNET"
            "android.permission.ACCESS_WIFI_STATE"
            "android.permission.CHANGE_WIFI_STATE"
            "android.permission.ACCESS_NETWORK_STATE"
            "android.permission.BLUETOOTH"
            "android.permission.BLUETOOTH_ADMIN"
            "android.permission.BLUETOOTH_CONNECT"
            "android.permission.BLUETOOTH_SCAN"
            "android.permission.BLUETOOTH_ADVERTISE"
            "android.permission.CAMERA"
            "android.permission.READ_EXTERNAL_STORAGE"
            "android.permission.WRITE_EXTERNAL_STORAGE"
            "android.permission.MANAGE_EXTERNAL_STORAGE"
            "android.permission.FOREGROUND_SERVICE"
            "android.permission.SYSTEM_ALERT_WINDOW"
          )
          for PERM in "${PERMISSIONS[@]}"; do
            if ! grep -q "$PERM" "$MANIFEST_PATH"; then
              sed -i "/<manifest/a \    <uses-permission android:name=\"$PERM\" />" "$MANIFEST_PATH"
            fi
          done

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK
        id: build
        run: |
          gradle assembleDebug --no-daemon 2> output_report/gradle_err.log
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk
            echo "APK built successfully"
          else
            echo "APK not found"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: System-Pro-V2-Final
          path: output_report/
