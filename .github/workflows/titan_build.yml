name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Copy Java and Manifest from build_assets
        run: |
          mkdir -p output_report
          rm -rf app/src/main/java app/src/main/res app/build
          
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME=${RAW_PKG:-"com.system.titan.pro"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          
          echo "TARGET_PACKAGE=$PKG_NAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$PKG_PATH" >> $GITHUB_ENV
          
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          
          # Copy Java files (only from build_assets)
          if [ -d "build_assets/app/src/main/java" ]; then
            cp -rf build_assets/app/src/main/java/* app/src/main/java/
          fi
          if [ -f "build_assets/app/src/main/java/$PKG_PATH/MainActivity.java" ]; then
            cp -f "build_assets/app/src/main/java/$PKG_PATH/MainActivity.java" "app/src/main/java/$PKG_PATH/MainActivity.java"
          fi
          # Also check root build_assets for any .java
          find build_assets -maxdepth 2 -name "*.java" -exec cp -f {} "app/src/main/java/$PKG_PATH/" \;
          
          # Copy AndroidManifest if provided (otherwise we create later)
          if [ -f "build_assets/AndroidManifest.xml" ]; then
            cp -f build_assets/AndroidManifest.xml app/src/main/AndroidManifest.xml.user
          fi
          
          # Copy icon if present
          if [ -f "build_assets/app_icon.png" ]; then
            cp -f build_assets/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp -f build_assets/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          fi

      - name: Run static fixer (Python script)
        run: python3 static_fixer.py

      - name: Create default resources (fixed, reliable)
        run: |
          # Layout with toggleButton
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center">
              <Button
                  android:id="@+id/toggleButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Toggle Torch" />
          </LinearLayout>
          EOF
          
          # Strings with torch labels
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">System Pro</string>
              <string name="torch_on">Torch On</string>
              <string name="torch_off">Torch Off</string>
          </resources>
          EOF
          
          # Colors
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#6200EE</color>
              <color name="colorAccent">#03DAC5</color>
          </resources>
          EOF
          
          # Styles
          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          EOF
          
          # Button background drawable
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/button_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/colorPrimary"/>
              <corners android:radius="8dp"/>
          </shape>
          EOF
          
          # Default icon if not provided
          if [ ! -f app/src/main/res/mipmap-hdpi/ic_launcher.png ]; then
            curl -s -o app/src/main/res/mipmap-hdpi/ic_launcher.png https://raw.githubusercontent.com/actions/automating-with-github-actions/master/shared/workflow-run.png || touch app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          fi

      - name: Build AndroidManifest (clean, no package attribute)
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build Gradle file
        run: |
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace "${{ env.TARGET_PACKAGE }}"
              compileSdk 34
              defaultConfig {
                  applicationId "${{ env.TARGET_PACKAGE }}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Inject extra permissions
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          for perm in "android.permission.READ_EXTERNAL_STORAGE" "android.permission.WRITE_EXTERNAL_STORAGE" "android.permission.BLUETOOTH" "android.permission.BLUETOOTH_CONNECT" "android.permission.BLUETOOTH_SCAN"; do
            if ! grep -q "$perm" "$MANIFEST"; then
              sed -i "/<manifest/a \    <uses-permission android:name=\"$perm\" />" "$MANIFEST"
            fi
          done

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon 2> output_report/gradle_err.log
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk
          else
            echo "APK not found" >> output_report/build_summary.txt
            exit 1
          fi

      - name: Validate APK size
        run: |
          SIZE=$(stat -c%s output_report/app-debug.apk 2>/dev/null || echo 0)
          if [ $SIZE -lt 50000 ]; then
            echo "APK too small ($SIZE bytes)" >> output_report/build_summary.txt
            exit 1
          else
            echo "APK size OK ($SIZE bytes)" >> output_report/build_summary.txt
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: System-Pro-V2-Final
          path: output_report/
