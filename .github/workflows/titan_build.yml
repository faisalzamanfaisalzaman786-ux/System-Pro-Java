name: System Pro Titan Master Build (Gradle 8.5 + AGP 8.3.2)

on:
  repository_dispatch:
    types: [android_full_build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle wrapper (8.5)
        run: |
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x gradlew

      - name: Decode payload
        run: |
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            echo "CUSTOM_PACKAGE=$(echo '${{ github.event.client_payload.package_name }}' | base64 --decode)" >> $GITHUB_ENV
          fi
          if [ -n "${{ github.event.client_payload.app_name }}" ]; then
            echo "CUSTOM_APPNAME=$(echo '${{ github.event.client_payload.app_name }}' | base64 --decode)" >> $GITHUB_ENV
          fi
          if [ -n "${{ github.event.client_payload.icon_matrix }}" ]; then
            echo "ICON_MATRIX=${{ github.event.client_payload.icon_matrix }}" >> $GITHUB_ENV
          fi

      - name: Set defaults
        run: |
          if [ -z "$CUSTOM_PACKAGE" ]; then
            echo "CUSTOM_PACKAGE=com.systempro.app" >> $GITHUB_ENV
          fi
          if [ -z "$CUSTOM_APPNAME" ]; then
            echo "CUSTOM_APPNAME=SystemProApp" >> $GITHUB_ENV
          fi

      - name: Create Android project structure
        run: |
          PKG_PATH=$(echo $CUSTOM_PACKAGE | tr '.' '/')
          mkdir -p app/src/main/java/$PKG_PATH
          mkdir -p app/src/main/res/layout app/src/main/res/values

          # AndroidManifest.xml with internet permission
          cat > app/src/main/AndroidManifest.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="$CUSTOM_PACKAGE">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="$CUSTOM_APPNAME"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round">
                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity with WebView (stable)
          cat > app/src/main/java/$PKG_PATH/MainActivity.java << EOF
          package $CUSTOM_PACKAGE;

          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://www.google.com");
                  setContentView(webView);
              }
          }
          EOF

          # Empty layout (not used but required)
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          EOF

          # Strings
          cat > app/src/main/res/values/strings.xml << EOF
          <resources>
              <string name="app_name">$CUSTOM_APPNAME</string>
          </resources>
          EOF

          # Minimal colors and themes
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources><color name="purple">#6200EE</color></resources>
          EOF
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources><style name="Theme.AppCompat.Light.DarkActionBar" parent="Theme.AppCompat.Light.DarkActionBar" /></resources>
          EOF

      - name: Handle icons (using jq and base64)
        run: |
          # Create dummy icon function
          create_dummy_icon() {
            local density=$1
            mkdir -p app/src/main/res/mipmap-$density
            # 1x1 transparent PNG base64
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-$density/ic_launcher.png
            cp app/src/main/res/mipmap-$density/ic_launcher.png app/src/main/res/mipmap-$density/ic_launcher_round.png
          }

          if [ -n "$ICON_MATRIX" ]; then
            echo "$ICON_MATRIX" > /tmp/icons.json
            # Use jq to iterate over keys and base64 decode
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              b64=$(jq -r ".\"$density\"" /tmp/icons.json 2>/dev/null)
              if [ -n "$b64" ] && [ "$b64" != "null" ]; then
                mkdir -p app/src/main/res/mipmap-$density
                echo "$b64" | base64 -d > app/src/main/res/mipmap-$density/ic_launcher.png
                cp app/src/main/res/mipmap-$density/ic_launcher.png app/src/main/res/mipmap-$density/ic_launcher_round.png
                echo "Icon written for $density"
              else
                create_dummy_icon $density
              fi
            done
          else
            # No icon matrix: create dummy icons for all densities
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              create_dummy_icon $density
            done
          fi

      - name: Create app/build.gradle
        run: |
          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '$CUSTOM_PACKAGE'
              compileSdk 34

              defaultConfig {
                  applicationId '$CUSTOM_PACKAGE'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      - name: Create project build.gradle (AGP 8.3.2)
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.3.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          rootProject.name = "SystemPro"
          include ':app'
          EOF

      - name: Clean up any version conflicts
        run: |
          rm -f gradle/libs.versions.toml 2>/dev/null || true
          sed -i '/pluginManagement {/,/}/d' settings.gradle 2>/dev/null || true

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
