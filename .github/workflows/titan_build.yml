name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode Central Payload
        run: |
          mkdir -p output_report
          REPORT="output_report/build_error_report.txt"
          echo "=== SYSTEM PRO BUILD PROCESS REPORT ===" > $REPORT
          echo "Timestamp: $(date)" >> $REPORT
          
          echo "[STEP 1] Cleaning old work directories..." >> $REPORT
          rm -rf app/src/main/java
          rm -rf app/src/main/res
          rm -rf app/build
          
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME=${RAW_PKG:-"com.system.titan.pro"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          
          echo "TARGET_PACKAGE=$PKG_NAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$PKG_PATH" >> $GITHUB_ENV
          echo "Configured Package Name: $PKG_NAME" >> $REPORT
          
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          
          echo "[STEP 2] Extracting Incoming Payload ZIP..." >> $REPORT
          echo "${{ github.event.client_payload.payload }}" | base64 -d > app_payload.zip || true
          if [ -s app_payload.zip ]; then
            echo "Payload ZIP detected size: $(wc -c < app_payload.zip) bytes" >> $REPORT
            unzip -o app_payload.zip -d extracted_payload/ >> $REPORT 2>&1 || echo "ZIP extraction warning" >> $REPORT
          else
            echo "Warning: Payload ZIP was empty!" >> $REPORT
          fi

          echo "[STEP 3] Deploying Workspace Resources..." >> $REPORT
          if [ -d extracted_payload ]; then
              find extracted_payload -type f -name "activity_main.xml" -exec mv {} app/src/main/res/layout/ \; >> $REPORT 2>&1
          fi

          if [ ! -f app/src/main/res/layout/activity_main.xml ]; then
              cat << 'EOF' > app/src/main/res/layout/activity_main.xml
              <?xml version="1.0" encoding="utf-8"?>
              <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#02040c">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="System Pro Dynamic Fallback"
                      android:textColor="#00ffcc"
                      android:textSize="24sp"
                      android:layout_centerInParent="true"/>
              </RelativeLayout>
  EOF
          fi

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#02040c</color>
              <color name="colorAccent">#00ffcc</color>
              <color name="background_dark">#02040c</color>
              <color name="neon_glow">#00ffcc</color>
          </resources>
  EOF

          cat << EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="$PKG_NAME">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="System Pro"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          echo "[STEP 4] Synthesizing Auto-Generated Java Engine with Framework IDs..." >> $REPORT
          cat << 'EOF' > "app/src/main/java/$PKG_PATH/MainActivity.java"
          package placeholder;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private EditText inputField1, inputField2;
              private TextView resultDisplay;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(getResources().getIdentifier("activity_main", "layout", getPackageName()));

                  inputField1 = findViewById(android.R.id.text1);
                  inputField2 = findViewById(android.R.id.text2);
                  resultDisplay = findViewById(android.R.id.title);
                  Button btnCalculate = findViewById(android.R.id.button1);

                  if (btnCalculate != null) {
                      btnCalculate.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              if (inputField1 != null && inputField2 != null && resultDisplay != null) {
                                  String val1 = inputField1.getText().toString();
                                  String val2 = inputField2.getText().toString();
                                  if (!val1.isEmpty() && !val2.isEmpty()) {
                                      double n1 = Double.parseDouble(val1);
                                      double n2 = Double.parseDouble(val2);
                                      resultDisplay.setText("TOTAL RESULT: " + (n1 + n2));
                                  }
                              }
                          }
                      });
                  }
              }
          }
  EOF
          sed -i "s|package placeholder;|package $PKG_NAME;|g" "app/src/main/java/$PKG_PATH/MainActivity.java"
          
          if [ -f app_icon.png ] && [ -s app_icon.png ]; then
            cp app_icon.png app/src/main/res/drawable/ic_launcher.png
            cp app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp app_icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp app_icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp app_icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            mv app_icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
            curl -s -o default_icon.png https://raw.githubusercontent.com/actions/automating-with-github-actions/master/shared/workflow-run.png || touch default_icon.png
            cp default_icon.png app/src/main/res/drawable/ic_launcher.png
            cp default_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp default_icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp default_icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp default_icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            mv default_icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Inject Missing Resources and System Themes
        run: |
          REPORT="output_report/build_error_report.txt"
          echo "[STEP 5] Injecting core dependencies and layout bindings..." >> $REPORT
          echo -e '<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android">\n    <solid android:color="#1AFFFFFF"/>\n    <corners android:radius="8dp"/>\n</shape>' > app/src/main/res/drawable/edittext_background.xml
          echo -e '<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android">\n    <solid android:color="#1AFFFFFF"/>\n    <corners android:radius="8dp"/>\n</shape>' > app/src/main/res/drawable/spinner_background.xml
          
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@android:color/holo_blue_dark</item>
                  <item name="colorSecondary">@android:color/holo_blue_light</item>
                  <item name="windowNoTitle">true</item>
                  <item name="windowActionBar">false</item>
              </style>
              <style name="ShapeAppearance">
                  <item name="cornerSize">4dp</item>
              </style>
              <style name="Widget.MaterialComponents.ProgressBar" parent="android:Widget.ProgressBar"/>
              <style name="Widget.MaterialComponents.ProgressBar.Horizontal" parent="android:Widget.ProgressBar.Horizontal"/>
              <style name="Widget.MaterialComponents.Spinner" parent="android:Widget.Spinner"/>
          </resources>
          EOF

          cat << EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace '${{ env.TARGET_PACKAGE }}'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ env.TARGET_PACKAGE }}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: Setup Gradle Wrapper Explicitly
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Force Lock Wrapper Version
        run: |
          mkdir -p gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          REPORT="output_report/build_error_report.txt"
          echo "[STEP 6] Triggering Primary Framework ID Compilation..." >> $REPORT
          
          ./gradlew assembleDebug --no-daemon 2> output_report/gradle_err.log && (
            echo "BUILD_STATUS=SUCCESS" >> $REPORT
            echo "Auto-generated Framework ID core code compiled successfully!" >> $REPORT
          ) || (
            echo "BUILD_STATUS=FAIL" >> $REPORT
            cat output_report/gradle_err.log >> $REPORT
          )
          cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk

      - name: Upload Build Artifact with Detailed Report
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final
          path: output_report/
