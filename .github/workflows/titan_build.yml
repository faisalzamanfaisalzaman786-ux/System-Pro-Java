name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Package Name
        id: pkg
        run: |
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          CLEAN_PKG=$(echo "$RAW_PKG" | sed 's/[^a-zA-Z0-9._]/./g' | sed 's/\.\.*/./g' | sed 's/^\.//;s/\.$//')
          PKG_NAME=${CLEAN_PKG:-"com.systempro.torch"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          APP_NAME=$(echo "$PKG_NAME" | awk -F'.' '{print $NF}')
          echo "TARGET_PACKAGE=$PKG_NAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$PKG_PATH" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          mkdir -p output_report

      - name: Clean and Copy from build_assets (with resources)
        run: |
          # پُرانی تمام فائلیں ہٹائیں
          rm -rf app/src/main/java app/src/main/res app/src/main/AndroidManifest.xml 2>/dev/null || true
          mkdir -p app/src/main/java app/src/main/res app/src/main/res/values app/src/main/res/layout app/src/main/res/drawable app/src/main/res/mipmap-hdpi
          
          # پیکیج کے لیے ڈائریکٹری بنائیں
          TARGET_JAVA_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          mkdir -p "$TARGET_JAVA_DIR"
          
          # Java فائلیں کاپی کریں (اگر موجود ہوں)
          if [ -d "build_assets/app/src/main/java" ]; then
            find build_assets/app/src/main/java -type f -name "*.java" -exec cp -f {} "$TARGET_JAVA_DIR/" \;
          fi
          
          # لے آؤٹ کاپی کریں
          if [ -f "build_assets/app/src/main/res/layout/activity_main.xml" ]; then
            cp -f build_assets/app/src/main/res/layout/activity_main.xml app/src/main/res/layout/
          fi
          
          # تمام ویلیوز فائلیں (colors, styles, themes, dimens, strings) کاپی کریں
          if [ -d "build_assets/app/src/main/res/values" ]; then
            cp -f build_assets/app/src/main/res/values/*.xml app/src/main/res/values/ 2>/dev/null || true
          fi
          
          # ڈراایبل فائلیں (button_gradient, icons) کاپی کریں
          if [ -d "build_assets/app/src/main/res/drawable" ]; then
            cp -f build_assets/app/src/main/res/drawable/*.xml app/src/main/res/drawable/ 2>/dev/null || true
          fi
          
          # آئیکون (اگر build_assets میں ہو)
          if [ -f "build_assets/app_icon.png" ]; then
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p app/src/main/res/mipmap-$d
              cp -f build_assets/app_icon.png app/src/main/res/mipmap-$d/ic_launcher.png
              cp -f build_assets/app_icon.png app/src/main/res/mipmap-$d/ic_launcher_round.png
            done
          fi
          
          # مینی فیسٹ کاپی کریں
          if [ -f "build_assets/AndroidManifest.xml" ]; then
            cp -f build_assets/AndroidManifest.xml app/src/main/
          fi
          
          # اگر کوئی Java فائل نہ ملے تو ڈیفالٹ بنا دیں
          if [ ! -f "$TARGET_JAVA_DIR/MainActivity.java" ]; then
            cat > "$TARGET_JAVA_DIR/MainActivity.java" << 'EOF'
          package ${{ env.TARGET_PACKAGE }};
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import android.hardware.camera2.CameraManager;
          public class MainActivity extends AppCompatActivity {
              private Button toggleButton;
              private CameraManager cameraManager;
              private boolean isTorchOn = false;
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  toggleButton = findViewById(R.id.btn_toggle);
                  cameraManager = (CameraManager) getSystemService(CAMERA_SERVICE);
                  toggleButton.setOnClickListener(v -> {
                      try { String id = cameraManager.getCameraIdList()[0];
                          isTorchOn = !isTorchOn;
                          cameraManager.setTorchMode(id, isTorchOn);
                          Toast.makeText(MainActivity.this, isTorchOn ? "ON" : "OFF", Toast.LENGTH_SHORT).show();
                      } catch (Exception e) { Toast.makeText(MainActivity.this, "Error", Toast.LENGTH_SHORT).show(); }
                  });
              }
          }
          EOF
          fi
          
          # اگر مینی فیسٹ نہ ملے تو ڈیفالٹ
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="${{ env.TARGET_PACKAGE }}">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="Torch" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi
          
          # اگر لے آؤٹ نہ ملے تو ڈیفالٹ
          if [ ! -f "app/src/main/res/layout/activity_main.xml" ]; then
            mkdir -p app/src/main/res/layout
            cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:gravity="center" android:orientation="vertical" android:padding="24dp">
              <Button android:id="@+id/btn_toggle" android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="Toggle Torch" style="@style/TorchButton"/>
          </LinearLayout>
          EOF
          fi

      - name: Fix Java Files (Package, Imports)
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          if [ -d "$TARGET_DIR" ]; then
            find "$TARGET_DIR" -type f -name "*.java" -exec sed -i "s/^package .*;/package ${{ env.TARGET_PACKAGE }};/g" {} \;
            find "$TARGET_DIR" -type f -name "*.java" -exec sed -i "s/import .*\.R;/import ${{ env.TARGET_PACKAGE }}.R;/g" {} \;
          fi

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'SystemPro'
          include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          cat > app/build.gradle << EOF
          plugins { id 'com.android.application' }
          android {
              namespace "${{ env.TARGET_PACKAGE }}"
              compileSdk 34
              defaultConfig {
                  applicationId "${{ env.TARGET_PACKAGE }}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.11.0' }
          EOF
          gradle assembleDebug --no-daemon
          mkdir -p output_report
          cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          name: "Latest Build"
          files: output_report/app-debug.apk
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: System-Pro-V2-Final
          path: output_report/
