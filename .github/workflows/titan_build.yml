name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Base Payload Decode
        run: |
          mkdir -p output_report
          rm -rf app/src/main/java app/src/main/res app/build
          rm -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME=${RAW_PKG:-"com.system.titan.pro"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          
          echo "TARGET_PACKAGE=$PKG_NAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$PKG_PATH" >> $GITHUB_ENV
          
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          
          echo "${{ github.event.client_payload.payload }}" | base64 -d > app_payload.zip || true
          if [ -s app_payload.zip ]; then
            unzip -o app_payload.zip -d extracted_payload/ || true
          fi

      - name: Copy User Resources (No Default Override)
        run: |
          if [ -f extracted_payload/activity_main.xml ]; then cp -f extracted_payload/activity_main.xml app/src/main/res/layout/activity_main.xml; fi
          if [ -f extracted_payload/colors.xml ]; then cp -f extracted_payload/colors.xml app/src/main/res/values/colors.xml; fi
          if [ -d extracted_payload ]; then find extracted_payload -type f -name "*.xml" ! -name "AndroidManifest.xml" -exec cp -n {} app/src/main/res/layout/ \; 2>/dev/null || true; fi

      - name: Copy User Java Sources
        run: |
          if [ -d extracted_payload ]; then
            find extracted_payload -type f -name "*.java" -exec cp -f {} app/src/main/java/${{ env.TARGET_PATH }}/ \;
          fi

      - name: Fix Package Name & Imports in Java Files
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          if [ -d "$TARGET_DIR" ]; then
            find "$TARGET_DIR" -type f -name "*.java" -exec sed -i "s|^[[:space:]]*package .*;|package ${{ env.TARGET_PACKAGE }};|g" {} \;
            find "$TARGET_DIR" -type f -name "*.java" -exec sed -i "s|import .*\.R;|import ${{ env.TARGET_PACKAGE }}.R;|g" {} \;
            for file in $(find "$TARGET_DIR" -type f -name "*.java"); do
              if ! grep -q "^[[:space:]]*package" "$file"; then
                sed -i "1i package ${{ env.TARGET_PACKAGE }};" "$file"
              fi
            done
          fi

      - name: Fallback MainActivity (only if user didn't provide)
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          if [ ! -f "$TARGET_DIR/MainActivity.java" ]; then
            mkdir -p "$TARGET_DIR"
            cat > "$TARGET_DIR/MainActivity.java" << 'EOF'
          package ${{ env.TARGET_PACKAGE }};
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(getResources().getIdentifier("activity_main", "layout", getPackageName()));
              }
          }
          EOF
          fi

      - name: Create AndroidManifest (without package attribute)
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create build.gradle (Gradle 8.5 compatible)
        run: |
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace "${{ env.TARGET_PACKAGE }}"
              compileSdk 34
              defaultConfig {
                  applicationId "${{ env.TARGET_PACKAGE }}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Inject Master Permissions (if missing)
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          for perm in "android.permission.CAMERA" "android.permission.READ_EXTERNAL_STORAGE" "android.permission.WRITE_EXTERNAL_STORAGE" "android.permission.BLUETOOTH" "android.permission.BLUETOOTH_CONNECT" "android.permission.BLUETOOTH_SCAN"; do
            if ! grep -q "$perm" "$MANIFEST"; then
              sed -i "/<manifest/a \    <uses-permission android:name=\"$perm\" />" "$MANIFEST"
            fi
          done

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # ========== FIRST BUILD ==========
      - name: Build APK (Attempt 1)
        id: build1
        continue-on-error: true
        run: |
          gradle assembleDebug --no-daemon 2> output_report/gradle_err.log
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk
          fi

      # ========== AI AGENT FALLBACK ==========
      - name: 🤖 AI Agent Fixer (Groq)
        if: steps.build1.outcome == 'failure' && env.GROQ_API_KEY != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "First build failed. Invoking AI Agent with Gradle 8.5 instructions..."
          ERROR_LOG=$(cat output_report/gradle_err.log | tail -300 | tr '"' ' ' | tr "'" ' ')
          FILES_INFO=""
          for file in $(find app/src/main -type f \( -name "*.java" -o -name "*.xml" -o -name "*.gradle" \)); do
            FILES_INFO="$FILES_INFO\n=== $file ===\n$(cat "$file")\n"
          done
          SYSTEM_PROMPT='You are an expert Android developer. Fix the build errors. The project uses Gradle 8.5, compileSdk 34, minSdk 24, targetSdk 34. Use only AndroidX dependencies. Fix missing imports, package names, resource references (strings, layouts, IDs), and manifest issues. Return ONLY a JSON array of objects with "path" and "content". Do NOT add explanations or markdown. Ensure package name is consistent across all Java files. Add missing resources (strings.xml, colors.xml, drawables) if needed.'
          USER_PROMPT="Build error: $ERROR_LOG\nProject files:$FILES_INFO\nFix errors and return JSON array."
          RESPONSE=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H "Authorization: Bearer $GROQ_API_KEY" -H "Content-Type: application/json" \
            -d "{\"model\":\"llama-3.3-70b-versatile\",\"messages\":[{\"role\":\"system\",\"content\":\"$SYSTEM_PROMPT\"},{\"role\":\"user\",\"content\":\"$USER_PROMPT\"}],\"temperature\":0.1,\"max_tokens\":4000}")
          echo "$RESPONSE" | python3 -c "
          import sys, json, re, os
          text = sys.stdin.read()
          m = re.search(r'\[\s*\{.*?\}\s*\]', text, re.DOTALL)
          if m:
              for fix in json.loads(m.group()):
                  path = fix.get('path'); content = fix.get('content')
                  if path and content:
                      os.makedirs(os.path.dirname(path), exist_ok=True)
                      with open(path, 'w') as f: f.write(content)
                      print(f'Applied: {path}')
          else: print('No JSON found')
          "

      - name: Build APK (Attempt 2 - after AI)
        if: steps.build1.outcome == 'failure' && env.GROQ_API_KEY != ''
        run: |
          gradle assembleDebug --no-daemon 2> output_report/gradle_err.log
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk
          fi

      - name: Validate APK (check size)
        run: |
          if [ -f output_report/app-debug.apk ]; then
            SIZE=$(stat -c%s output_report/app-debug.apk)
            if [ $SIZE -lt 50000 ]; then
              echo "WARNING: APK too small ($SIZE bytes). Build may have failed." >> output_report/build_log.txt
            else
              echo "APK size: $SIZE bytes - OK" >> output_report/build_log.txt
            fi
          else
            echo "ERROR: No APK generated" >> output_report/build_log.txt
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: System-Pro-V2-Final
          path: output_report/
