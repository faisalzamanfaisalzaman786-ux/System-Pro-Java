name: Build Android APK (with Dynamic Package Name)

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Replace Package Name in All Files
        run: |
          NEW_PKG="${{ github.event.client_payload.package_name }}"
          echo "Using Package Name: $NEW_PKG"
          if [ -z "$NEW_PKG" ]; then
            NEW_PKG="com.systempro.app"
          fi
          # Fix manifest and package
          sed -i 's/<?xml version="1.0" encoding="utf-8"?>/<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android"/' app/src/main/AndroidManifest.xml
          sed -i "s/package=\"[^\"]*\"/package=\"$NEW_PKG\"/" app/src/main/AndroidManifest.xml
          # Update Java files
          find app/src/main/java -name "*.java" -exec sed -i "s/package .*;/package $NEW_PKG;/g" {} \;
          # Update app/build.gradle
          if [ -f app/build.gradle ]; then
            sed -i "s/applicationId \".*\"/applicationId \"$NEW_PKG\"/" app/build.gradle
          fi

      - name: Setup Gradle Wrapper (locked to 8.5)
        run: |
          mkdir -p gradle/wrapper
          wget -q https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
          printf '#!/bin/sh\nGRADLE_OPTS="-Dorg.gradle.appname=gradlew"\nexec java $GRADLE_OPTS -classpath "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"\n' > gradlew
          chmod +x gradlew

      - name: Generate App Icon (if present)
        if: hashFiles('build_assets/app_icon.png') != ''
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          convert build_assets/app_icon.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert build_assets/app_icon.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert build_assets/app_icon.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert build_assets/app_icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert build_assets/app_icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Create correct Android project files
        run: |
          # settings.gradle
          echo 'include ":app"' > settings.gradle

          # root build.gradle
          echo 'buildscript {' > build.gradle
          echo '    repositories { google(); mavenCentral() }' >> build.gradle
          echo '    dependencies { classpath "com.android.tools.build:gradle:7.4.2" }' >> build.gradle
          echo '}' >> build.gradle
          echo 'allprojects { repositories { google(); mavenCentral() } }' >> build.gradle

          # gradle.properties (suppress warning)
          echo 'android.suppressUnsupportedCompileSdk=34' > gradle.properties

          # app/build.gradle with namespace
          mkdir -p app
          echo "apply plugin: 'com.android.application'" > app/build.gradle
          echo 'android {' >> app/build.gradle
          echo '    compileSdk 34' >> app/build.gradle
          echo "    namespace 'com.systempro.app'" >> app/build.gradle
          echo '    defaultConfig {' >> app/build.gradle
          echo '        applicationId "com.systempro.app"' >> app/build.gradle
          echo '        minSdk 21' >> app/build.gradle
          echo '        targetSdk 34' >> app/build.gradle
          echo '        versionCode 1' >> app/build.gradle
          echo '        versionName "1.0"' >> app/build.gradle
          echo '    }' >> app/build.gradle
          echo '    buildTypes { release { minifyEnabled false } }' >> app/build.gradle
          echo '}' >> app/build.gradle
          echo 'dependencies { implementation "androidx.appcompat:appcompat:1.6.1" }' >> app/build.gradle

          # Ensure a valid AndroidManifest.xml exists
          mkdir -p app/src/main
          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"' >> app/src/main/AndroidManifest.xml
            echo '    package="com.systempro.app">' >> app/src/main/AndroidManifest.xml
            echo '    <application android:label="CodeForge App">' >> app/src/main/AndroidManifest.xml
            echo '        <activity android:name=".MainActivity" android:exported="true">' >> app/src/main/AndroidManifest.xml
            echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
            echo '                <action android:name="android.intent.action.MAIN"/>' >> app/src/main/AndroidManifest.xml
            echo '                <category android:name="android.intent.category.LAUNCHER"/>' >> app/src/main/AndroidManifest.xml
            echo '            </intent-filter>' >> app/src/main/AndroidManifest.xml
            echo '        </activity>' >> app/src/main/AndroidManifest.xml
            echo '    </application>' >> app/src/main/AndroidManifest.xml
            echo '</manifest>' >> app/src/main/AndroidManifest.xml
          fi

      - name: Build APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release and Attach APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          files: app/build/outputs/apk/debug/*.apk
