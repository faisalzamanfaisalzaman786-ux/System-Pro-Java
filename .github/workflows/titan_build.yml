name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [android_full_build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate Gradle wrapper with version 8.5
        run: |
          # Ensure gradle is installed (runner has gradle by default)
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x gradlew

      - name: Decode payload (package name and app name)
        run: |
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            DECODED_PKG=$(echo "${{ github.event.client_payload.package_name }}" | base64 --decode)
            echo "CUSTOM_PACKAGE=$DECODED_PKG" >> $GITHUB_ENV
          fi
          if [ -n "${{ github.event.client_payload.app_name }}" ]; then
            DECODED_APP=$(echo "${{ github.event.client_payload.app_name }}" | base64 --decode)
            echo "CUSTOM_APPNAME=$DECODED_APP" >> $GITHUB_ENV
          fi

      - name: Update Android files with custom package and app name
        run: |
          if [ -n "$CUSTOM_PACKAGE" ]; then
            # Update AndroidManifest.xml
            if [ -f app/src/main/AndroidManifest.xml ]; then
              sed -i "s/package=\".*\"/package=\"$CUSTOM_PACKAGE\"/" app/src/main/AndroidManifest.xml
              echo "Updated manifest package to $CUSTOM_PACKAGE"
            fi
            # Update app/build.gradle (namespace and applicationId)
            if [ -f app/build.gradle ]; then
              sed -i "s/namespace \".*\"/namespace \"$CUSTOM_PACKAGE\"/" app/build.gradle
              sed -i "s/applicationId \".*\"/applicationId \"$CUSTOM_PACKAGE\"/" app/build.gradle
              echo "Updated app/build.gradle"
            fi
          fi
          if [ -n "$CUSTOM_APPNAME" ]; then
            if [ -f app/src/main/res/values/strings.xml ]; then
              sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$CUSTOM_APPNAME<\/string>/" app/src/main/res/values/strings.xml
              echo "Updated app name to $CUSTOM_APPNAME"
            fi
          fi

      - name: Ensure project-level build.gradle uses AGP 8.5.0 (compatible with Gradle 8.5)
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          echo "Project build.gradle set to AGP 8.5.0"

      - name: Ensure app/build.gradle has correct plugin block
        run: |
          if [ -f app/build.gradle ]; then
            # Remove any version from plugin block (if exists)
            sed -i '/^plugins {/,/^}/d' app/build.gradle
            # Prepend proper plugin block
            echo "plugins {" > app/build.gradle.new
            echo "    id 'com.android.application'" >> app/build.gradle.new
            echo "}" >> app/build.gradle.new
            cat app/build.gradle >> app/build.gradle.new
            mv app/build.gradle.new app/build.gradle
            echo "Fixed app/build.gradle"
          fi

      - name: Build Debug APK with Gradle 8.5
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "APK_FILE=$APK_PATH" >> $GITHUB_ENV
          echo "APK_SIZE=$(stat -c%s "$APK_PATH")" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-APK
          path: ${{ env.APK_FILE }}
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          echo "Build completed at $(date)" >> build_summary.txt
          echo "APK size: ${{ env.APK_SIZE }} bytes" >> build_summary.txt
          PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' app/src/main/AndroidManifest.xml 2>/dev/null || echo "unknown")
          echo "Package: $PACKAGE_NAME" >> build_summary.txt
          cat build_summary.txt
