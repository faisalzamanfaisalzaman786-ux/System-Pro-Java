name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Base Payload Decode
        run: |
          mkdir -p output_report
          rm -rf app/src/main/java app/src/main/res app/build
          
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME=${RAW_PKG:-"com.system.titan.pro"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          
          echo "TARGET_PACKAGE=$PKG_NAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$PKG_PATH" >> $GITHUB_ENV
          
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          
          echo "${{ github.event.client_payload.payload }}" | base64 -d > app_payload.zip || true
          if [ -s app_payload.zip ]; then
            unzip -o app_payload.zip -d extracted_payload/ || true
          fi

      - name: Process Layouts
        run: |
          if [ -d extracted_payload ]; then
              find extracted_payload -type f -name "activity_main.xml" -exec mv {} app/src/main/res/layout/ \;
              find extracted_payload -type f -name "colors.xml" -exec mv {} app/src/main/res/values/ \;
          fi

      - name: Fallback Resource Injection
        run: |
          if [ ! -f app/src/main/res/values/colors.xml ]; then
              echo -e '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="colorPrimary">#02040c</color>\n    <color name="colorAccent">#00ffcc</color>\n</resources>' > app/src/main/res/values/colors.xml
          fi
          if [ ! -f app/src/main/res/layout/activity_main.xml ]; then
              echo -e '<?xml version="1.0" encoding="utf-8"?>\n<RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#02040c"></RelativeLayout>' > app/src/main/res/layout/activity_main.xml
          fi

      - name: Deploy Source Components
        run: |
          if [ -d extracted_payload ]; then
            cp -r extracted_payload/*.java app/src/main/java/${{ env.TARGET_PATH }}/ 2>/dev/null || true
          fi

      - name: Build Main Class
        run: |
          if [ -f "app/src/main/java/${{ env.TARGET_PATH }}/MainActivity.java" ]; then
            sed -i "s|^package .*|package ${{ env.TARGET_PACKAGE }};|g" "app/src/main/java/${{ env.TARGET_PATH }}/MainActivity.java"
          else
            echo -e "package ${{ env.TARGET_PACKAGE }};\nimport android.os.Bundle;\nimport androidx.appcompat.app.AppCompatActivity;\npublic class MainActivity extends AppCompatActivity {\n    protected void onCreate(Bundle saved) {\n        super.onCreate(saved);\n        setContentView(${{ env.TARGET_PACKAGE }}.R.layout.activity_main);\n    }\n}" > "app/src/main/java/${{ env.TARGET_PATH }}/MainActivity.java"
          fi

      - name: Core Environment Setup
        run: |
          echo -e '<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android">\n    <solid android:color="#1AFFFFFF"/>\n    <corners android:radius="8dp"/>\n</shape>' > app/src/main/res/drawable/edittext_background.xml
          
          echo -e '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="Theme.AppCompat.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">\n        <item name="windowNoTitle">true</item>\n        <item name="windowActionBar">false</item>\n    </style>\n</resources>' > app/src/main/res/values/styles.xml

          echo -e '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="'"${{ env.TARGET_PACKAGE }}"'">\n    <application android:allowBackup="true" android:label="Titan Engine" android:theme="@style/Theme.AppCompat.NoActionBar">\n        <activity android:name=".MainActivity" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>' > app/src/main/AndroidManifest.xml

          echo -e 'plugins { id "com.android.application" }\nandroid {\n    namespace "'"${{ env.TARGET_PACKAGE }}"'"\n    compileSdk 34\n    defaultConfig {\n        applicationId "'"${{ env.TARGET_PACKAGE }}"'"\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName "1.0"\n    }\n}\ndependencies {\n    implementation "androidx.appcompat:appcompat:1.6.1"\n    implementation "com.google.android.material:material:1.11.0"\n}' > app/build.gradle

          curl -s -o app/src/main/res/drawable/ic_launcher.png https://raw.githubusercontent.com/actions/automating-with-github-actions/master/shared/workflow-run.png || touch app/src/main/res/drawable/ic_launcher.png

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Asset APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2> output_report/gradle_err.log || true

      - name: Fallback Execution Mode
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            rm -rf app/src/main/java app/src/main/res
            mkdir -p app/src/main/res/layout app/src/main/res/values app/src/main/java/${{ env.TARGET_PATH }}
            
            echo -e '<?xml version="1.0" encoding="utf-8"?>\n<RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#02040c"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="FALLBACK VAULT" android:textColor="#ff4444" android:layout_centerInParent="true"/></RelativeLayout>' > app/src/main/res/layout/activity_main.xml
            echo -e '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="colorPrimary">#02040c</color></resources>' > app/src/main/res/values/colors.xml
            echo -e "package ${{ env.TARGET_PACKAGE }};\nimport android.os.Bundle;\nimport androidx.appcompat.app.AppCompatActivity;\npublic class MainActivity extends AppCompatActivity {\n    protected void onCreate(Bundle s) {\n        super.onCreate(s);\n        setContentView(${{ env.TARGET_PACKAGE }}.R.layout.activity_main);\n    }\n}" > "app/src/main/java/${{ env.TARGET_PATH }}/MainActivity.java"
            
            ./gradlew assembleDebug --no-daemon
          fi
          cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final
          path: output_report/
