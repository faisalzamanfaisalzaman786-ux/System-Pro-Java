name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [android_full_build]   # <-- یہ ایونٹ ہمارا ٹول بھیجتا ہے
  workflow_dispatch:               # (آپشنل) manual run بھی کر سکتے ہیں

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # artifact upload کے لیے

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle (use wrapper if exists, else create)
        run: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper not found, creating default wrapper (gradle 8.5)"
            gradle wrapper --gradle-version 8.5 --distribution-type bin
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      - name: Decode package name from dispatch payload (optional)
        run: |
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            DECODED_PKG=$(echo "${{ github.event.client_payload.package_name }}" | base64 --decode)
            echo "CUSTOM_PACKAGE=$DECODED_PKG" >> $GITHUB_ENV
          fi
          if [ -n "${{ github.event.client_payload.app_name }}" ]; then
            DECODED_APP=$(echo "${{ github.event.client_payload.app_name }}" | base64 --decode)
            echo "CUSTOM_APPNAME=$DECODED_APP" >> $GITHUB_ENV
          fi

      - name: Sync package name in AndroidManifest.xml (if needed)
        run: |
          if [ -n "$CUSTOM_PACKAGE" ]; then
            MANIFEST="app/src/main/AndroidManifest.xml"
            if [ -f "$MANIFEST" ]; then
              sed -i "s/package=\".*\"/package=\"$CUSTOM_PACKAGE\"/" "$MANIFEST"
              echo "Updated manifest package to $CUSTOM_PACKAGE"
            fi
            # Also update build.gradle namespace
            BUILD_GRADLE="app/build.gradle"
            if [ -f "$BUILD_GRADLE" ]; then
              sed -i "s/namespace \".*\"/namespace \"$CUSTOM_PACKAGE\"/" "$BUILD_GRADLE"
              sed -i "s/applicationId \".*\"/applicationId \"$CUSTOM_PACKAGE\"/" "$BUILD_GRADLE"
              echo "Updated app/build.gradle with new package"
            fi
          fi
          if [ -n "$CUSTOM_APPNAME" ]; then
            STRINGS="app/src/main/res/values/strings.xml"
            if [ -f "$STRINGS" ]; then
              sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$CUSTOM_APPNAME<\/string>/" "$STRINGS"
              echo "Updated app name to $CUSTOM_APPNAME"
            fi
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Check APK output
        id: check_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi
          echo "APK_FILE=$APK_PATH" >> $GITHUB_ENV
          echo "APK_SIZE=$(stat -c%s "$APK_PATH")" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-APK
          path: ${{ env.APK_FILE }}
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          echo "Build completed at $(date)" >> build_summary.txt
          echo "APK size: ${{ env.APK_SIZE }} bytes" >> build_summary.txt
          echo "Package: ${CUSTOM_PACKAGE:-$(grep -oP 'package="\K[^"]+' app/src/main/AndroidManifest.xml)}" >> build_summary.txt
          cat build_summary.txt
