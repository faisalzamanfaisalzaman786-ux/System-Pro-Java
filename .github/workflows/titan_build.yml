name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle 8.5
        run: |
          mkdir -p gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew || true

      - name: Write Enterprise Configuration
        run: |
          # 1. settings.gradle میں ریپوزٹریز کا ہونا لازمی ہے
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'" > settings.gradle
          
          # 2. Root build.gradle
          echo "buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }" > build.gradle
          
          # 3. App build.gradle
          mkdir -p app
          echo "plugins { id 'com.android.application' }
          android {
              namespace 'com.system.pro'
              compileSdk 34
              buildFeatures { viewBinding true }
              defaultConfig { 
                  applicationId 'com.system.pro'
                  minSdk 24
                  targetSdk 34 
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }" > app/build.gradle

      - name: Generate Source Code
        run: |
          mkdir -p app/src/main/java/com/system/pro
          mkdir -p app/src/main/res/layout
          
          cat << 'EOF' > app/src/main/java/com/system/pro/MainActivity.java
          package com.system.pro;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          import com.system.pro.databinding.ActivityMainBinding;
          import android.hardware.camera2.CameraManager;
          public class MainActivity extends AppCompatActivity {
              private ActivityMainBinding binding;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  binding = ActivityMainBinding.inflate(getLayoutInflater());
                  setContentView(binding.getRoot());
                  binding.torchButton.setOnClickListener(v -> {
                      try {
                          CameraManager m = (CameraManager) getSystemService(CAMERA_SERVICE);
                          String id = m.getCameraIdList()[0];
                          m.setTorchMode(id, true);
                      } catch (Exception e) {}
                  });
              }
          }
          EOF

          echo '<RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent"><Button android:id="@+id/torchButton" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Toggle Torch" android:layout_centerInParent="true"/></RelativeLayout>' > app/src/main/res/layout/activity_main.xml

      - name: Titan Build Execution
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Titan-APK
          path: app/build/outputs/apk/debug/app-debug.apk
