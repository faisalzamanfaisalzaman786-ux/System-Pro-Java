name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Package Name
        id: pkg
        run: |
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          CLEAN_PKG=$(echo "$RAW_PKG" | sed 's/[^a-zA-Z0-9._]/./g' | sed 's/\.\.*/./g' | sed 's/^\.//;s/\.$//')
          PKG_NAME=${CLEAN_PKG:-"com.systempro.torch"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          APP_NAME=$(echo "$PKG_NAME" | awk -F'.' '{print $NF}')
          echo "TARGET_PACKAGE=$PKG_NAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$PKG_PATH" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          mkdir -p output_report

      - name: Clean old package folders from build_assets (keep only current)
        run: |
          COM_DIR="build_assets/app/src/main/java/com"
          if [ -d "$COM_DIR" ]; then
            # Loop over directories inside com/
            for d in "$COM_DIR"/*/; do
              # Get the folder name (e.g. "systempro")
              dir_name=$(basename "$d")
              # Current package's first segment (e.g. "systempro" from "com.systempro.torch")
              current_base=$(echo "${{ env.TARGET_PATH }}" | cut -d'/' -f1)
              if [ "$dir_name" != "$current_base" ]; then
                echo "Removing old package folder: $dir_name"
                rm -rf "$d"
              fi
            done
          fi

      - name: Copy files from build_assets to app (only current package)
        run: |
          rm -rf app
          mkdir -p app/src/main/java app/src/main/res app/src/main/res/values app/src/main/res/layout app/src/main/res/drawable
          
          TARGET_JAVA_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          mkdir -p "$TARGET_JAVA_DIR"
          
          # Copy Java files from build_assets (any .java under the target path)
          if [ -d "build_assets/app/src/main/java" ]; then
            find build_assets/app/src/main/java -type f -name "*.java" -exec cp -f {} "$TARGET_JAVA_DIR/" \;
          fi
          
          # Copy layout
          if [ -f "build_assets/app/src/main/res/layout/activity_main.xml" ]; then
            mkdir -p app/src/main/res/layout
            cp -f "build_assets/app/src/main/res/layout/activity_main.xml" app/src/main/res/layout/
          fi
          
          # Copy all values files
          if [ -d "build_assets/app/src/main/res/values" ]; then
            cp -rf build_assets/app/src/main/res/values/* app/src/main/res/values/ 2>/dev/null || true
          fi
          
          # Copy drawable files
          if [ -d "build_assets/app/src/main/res/drawable" ]; then
            cp -rf build_assets/app/src/main/res/drawable/* app/src/main/res/drawable/ 2>/dev/null || true
          fi
          
          # Copy icon
          if [ -f "build_assets/app_icon.png" ]; then
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p app/src/main/res/mipmap-$d
              cp -f "build_assets/app_icon.png" app/src/main/res/mipmap-$d/ic_launcher.png
              cp -f "build_assets/app_icon.png" app/src/main/res/mipmap-$d/ic_launcher_round.png
            done
          fi
          
          # Copy manifest
          if [ -f "build_assets/AndroidManifest.xml" ]; then
            cp -f "build_assets/AndroidManifest.xml" app/src/main/AndroidManifest.xml
          fi

      - name: Move mis‑placed drawable XML files (from values to drawable)
        run: |
          if [ -d "app/src/main/res/values" ]; then
            for file in app/src/main/res/values/*.xml; do
              if [ -f "$file" ] && (grep -q "<vector" "$file" || grep -q "<path" "$file" || grep -q "<shape" "$file" || grep -q "<selector" "$file" || grep -q "<gradient" "$file"); then
                echo "Moving drawable XML: $(basename "$file") to drawable"
                mv "$file" app/src/main/res/drawable/
              fi
            done
          fi

      - name: Fix package name and import R (preserve all other code)
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          if [ -d "$TARGET_DIR" ]; then
            find "$TARGET_DIR" -type f -name "*.java" -exec sed -i "s/^package .*;/package ${{ env.TARGET_PACKAGE }};/g" {} \;
            find "$TARGET_DIR" -type f -name "*.java" -exec sed -i "s/import .*\.R;/import ${{ env.TARGET_PACKAGE }}.R;/g" {} \;
            # Add package line if completely missing (should not happen)
            for file in $(find "$TARGET_DIR" -type f -name "*.java"); do
              if ! grep -q "^package" "$file"; then
                sed -i "1i package ${{ env.TARGET_PACKAGE }};" "$file"
              fi
            done
          fi

      - name: Ensure basic resources exist (only if missing)
        run: |
          mkdir -p app/src/main/res/values
          if [ ! -f "app/src/main/res/values/colors.xml" ]; then
            cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="background">#121212</color>
              <color name="buttonBg">#00FFCC</color>
          </resources>
          EOF
          fi
          if [ ! -f "app/src/main/res/values/styles.xml" ]; then
            cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@color/background</item>
              </style>
              <style name="TorchButton" parent="Widget.AppCompat.Button">
                  <item name="android:backgroundTint">@color/buttonBg</item>
                  <item name="android:textSize">20sp</item>
              </style>
          </resources>
          EOF
          fi

      - name: Fix AndroidManifest (add android:exported if missing)
        run: |
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i '/<activity(?!.*android:exported)/ s/<activity/<activity android:exported="true" /' app/src/main/AndroidManifest.xml
          else
            cat > app/src/main/AndroidManifest.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="${{ env.TARGET_PACKAGE }}">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="${{ env.APP_NAME }}" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Gradle files
        run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF
          
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'SystemPro'
          include ':app'
          EOF
          
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          
          cat > app/build.gradle << EOF
          plugins { id 'com.android.application' }
          android {
              namespace "${{ env.TARGET_PACKAGE }}"
              compileSdk 34
              defaultConfig {
                  applicationId "${{ env.TARGET_PACKAGE }}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
          mkdir -p output_report
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk
            echo "✅ APK built successfully"
          else
            echo "❌ Build failed"
            exit 1
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: System-Pro-V2-Final
          path: output_report/app-debug.apk

      - name: Upload APK to Release (create/update latest-build tag)
        uses: softprops/action-gh-release@v1
        continue-on-error: true
        with:
          tag_name: latest-build
          name: "Latest Build"
          body: "APK from workflow run #${{ github.run_number }}"
          files: output_report/app-debug.apk
          prerelease: true
          overwrite: true
          token: ${{ secrets.GITHUB_TOKEN }}
