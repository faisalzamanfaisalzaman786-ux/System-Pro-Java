name: System Pro Enterprise Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cleanup and Setup
        run: |
          rm -rf app/src/main/java/com/system/pro/*
          mkdir -p app/src/main/java/com/system/pro
          mkdir -p app/src/main/res/layout

      - name: Write Gradle Files
        run: |
          echo "include ':app'" > settings.gradle
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }" > build.gradle
          echo "plugins { id 'com.android.application' }
          android {
              namespace 'com.system.pro'
              compileSdk 34
              buildFeatures { viewBinding true }
              defaultConfig { applicationId 'com.system.pro'; minSdk 24; targetSdk 34 }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }" > app/build.gradle

      - name: Write Java Code
        run: |
          printf "package com.system.pro;\nimport android.os.Bundle;\nimport androidx.appcompat.app.AppCompatActivity;\nimport com.system.pro.databinding.ActivityMainBinding;\nimport android.hardware.camera2.CameraManager;\n\npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        setContentView(binding.getRoot());\n        binding.torchButton.setOnClickListener(v -> toggleTorch());\n    }\n    private void toggleTorch() {\n        try {\n            CameraManager m = (CameraManager) getSystemService(CAMERA_SERVICE);\n            m.setTorchMode(m.getCameraIdList()[0], true);\n        } catch (Exception e) {}\n    }\n}" > app/src/main/java/com/system/pro/MainActivity.java

      - name: Write Layout
        run: |
          echo '<?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <Button
                  android:id="@+id/torchButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Toggle Torch"
                  android:layout_centerInParent="true"/>
          </RelativeLayout>' > app/src/main/res/layout/activity_main.xml

      - name: Build
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Enterprise-APK
          path: app/build/outputs/apk/debug/app-debug.apk
