name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Package Name
        id: pkg
        run: |
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          CLEAN_PKG=$(echo "$RAW_PKG" | sed 's/[^a-zA-Z0-9._]/./g' | sed 's/\.\.*/./g' | sed 's/^\.//;s/\.$//')
          PKG_NAME=${CLEAN_PKG:-"com.system.titan.pro"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          APP_NAME=$(echo "$PKG_NAME" | awk -F'.' '{print $NF}')
          echo "TARGET_PACKAGE=$PKG_NAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$PKG_PATH" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          mkdir -p output_report

      - name: Clean and Copy ONLY Target Package from build_assets
        run: |
          # 1. مکمل طور پر پرانی Java ڈائرکٹری حذف کریں
          rm -rf app/src/main/java
          mkdir -p app/src/main/java
          
          # 2. صرف موجودہ ٹارگٹ پیکیج کے لیے ڈھانچہ بنائیں
          TARGET_JAVA_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          mkdir -p "$TARGET_JAVA_DIR"
          
          # 3. build_assets سے صرف مخصوص پیکیج فولڈر کی .java فائلیں کاپی کریں
          SOURCE_PKG_DIR="build_assets/app/src/main/java/com/${{ env.TARGET_PATH }}"
          if [ -d "$SOURCE_PKG_DIR" ]; then
            echo "Copying Java files from $SOURCE_PKG_DIR"
            cp -f "$SOURCE_PKG_DIR"/*.java "$TARGET_JAVA_DIR/" 2>/dev/null || true
          else
            echo "Warning: Source package folder not found: $SOURCE_PKG_DIR"
          fi
          
          # 4. کوئی اور .java فائلیں (اگر کہیں اور ہوں) نظر انداز کریں - نہ کاپی کریں
          
          # 5. ریسورس فولڈرز (layout, values, drawable) کو کاپی کریں
          if [ -d "build_assets/app/src/main/res" ]; then
            cp -rf build_assets/app/src/main/res/* app/src/main/res/ 2>/dev/null || true
          fi
          
          # 6. AndroidManifest.xml کاپی کریں
          if [ -f "build_assets/AndroidManifest.xml" ]; then
            cp -f "build_assets/AndroidManifest.xml" app/src/main/AndroidManifest.xml
          fi
          
          # 7. آئیکون کاپی کریں
          if [ -f "build_assets/app_icon.png" ]; then
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p app/src/main/res/mipmap-$d
              cp -f "build_assets/app_icon.png" "app/src/main/res/mipmap-$d/ic_launcher.png"
              cp -f "build_assets/app_icon.png" "app/src/main/res/mipmap-$d/ic_launcher_round.png"
            done
          fi

      - name: Create Default MainActivity if Missing
        run: |
          TARGET_JAVA_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          if [ ! -f "$TARGET_JAVA_DIR/MainActivity.java" ]; then
            echo "No MainActivity found, creating default torch app"
            mkdir -p "$TARGET_JAVA_DIR"
            cat > "$TARGET_JAVA_DIR/MainActivity.java" << EOF
          package ${{ env.TARGET_PACKAGE }};
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import android.hardware.camera2.CameraManager;
          public class MainActivity extends AppCompatActivity {
              private Button toggleButton;
              private CameraManager cameraManager;
              private boolean isTorchOn = false;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  toggleButton = findViewById(R.id.toggleButton);
                  cameraManager = (CameraManager) getSystemService(CAMERA_SERVICE);
                  toggleButton.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          try {
                              String cameraId = cameraManager.getCameraIdList()[0];
                              isTorchOn = !isTorchOn;
                              cameraManager.setTorchMode(cameraId, isTorchOn);
                              Toast.makeText(MainActivity.this, isTorchOn ? "Torch ON" : "Torch OFF", Toast.LENGTH_SHORT).show();
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Torch not available", Toast.LENGTH_SHORT).show();
                          }
                      }
                  });
              }
          }
          EOF
          fi

      - name: Fix Java Files (Package, Imports, Semicolons)
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          if [ ! -d "$TARGET_DIR" ]; then
            echo "No Java directory, skipping fixes"
            exit 0
          fi
          
          # پیکیج لائن درست کریں
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i "s/^package .*;/package ${{ env.TARGET_PACKAGE }};/g" {} \;
          # امپورٹ R درست کریں
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i "s/import .*\.R;/import ${{ env.TARGET_PACKAGE }}.R;/g" {} \;
          # اگر پیکیج لائن موجود نہ ہو تو شامل کریں
          for file in $(find "$TARGET_DIR" -type f -name "*.java"); do
            if ! grep -q "^package" "$file"; then
              sed -i "1i package ${{ env.TARGET_PACKAGE }};" "$file"
            fi
          done
          # غائب سیمی کولن کی بنیادی درستی
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i '/^[[:space:]]*\(private\|public\|protected\)/ s/\([^;{}]\)$/\1;/' {} \;
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's/\(super\.[a-zA-Z]*(.*)\)$/\1;/' {} \;
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's/\(setContentView(.*)\)$/\1;/' {} \;
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's/})$/});/g' {} \;
          # بٹن ID مماثلت
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's|R\.id\.torch_button|R.id.toggleButton|g' {} \;
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's|R\.id\.btn_torch|R.id.toggleButton|g' {} \;

      - name: Ensure Layout and Resources
        run: |
          LAYOUT="app/src/main/res/layout/activity_main.xml"
          if [ ! -f "$LAYOUT" ]; then
            mkdir -p app/src/main/res/layout
            cat > "$LAYOUT" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="20dp">
              <Button
                  android:id="@+id/toggleButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Toggle Torch"
                  android:textSize="18sp"
                  android:padding="14dp" />
          </LinearLayout>
          EOF
          fi
          
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">${{ env.APP_NAME }}</string>
              <string name="torch_on">Torch On</string>
              <string name="torch_off">Torch Off</string>
          </resources>
          EOF
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#6200EE</color>
              <color name="colorPrimaryDark">#3700B3</color>
              <color name="colorAccent">#03DAC5</color>
          </resources>
          EOF
          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          EOF

      - name: Build AndroidManifest (if missing)
        run: |
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: |
          # Gradle files already created in previous steps? We need them.
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'SystemPro'
          include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          cat > app/build.gradle << EOF
          plugins { id 'com.android.application' }
          android {
              namespace "${{ env.TARGET_PACKAGE }}"
              compileSdk 34
              defaultConfig {
                  applicationId "${{ env.TARGET_PACKAGE }}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF
          
          gradle assembleDebug --no-daemon
          mkdir -p output_report
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk
          else
            echo "Build failed"
            exit 1
          fi

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          name: "Latest Build"
          body: "APK from workflow run #${{ github.run_number }}"
          files: output_report/app-debug.apk
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: System-Pro-V2-Final
          path: output_report/
