name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Package Name
        id: pkg
        run: |
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          CLEAN_PKG=$(echo "$RAW_PKG" | sed 's/[^a-zA-Z0-9._]/./g' | sed 's/\.\.*/./g' | sed 's/^\.//;s/\.$//')
          PKG_NAME=${CLEAN_PKG:-"com.system.titan.pro"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          APP_NAME=$(echo "$PKG_NAME" | awk -F'.' '{print $NF}')
          echo "TARGET_PACKAGE=$PKG_NAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$PKG_PATH" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          mkdir -p output_report

      - name: Clean and Copy from build_assets
        run: |
          # 1. مکمل طور پر پرانی Java ڈائرکٹری حذف کریں
          rm -rf app/src/main/java
          mkdir -p app/src/main/java
          
          # 2. صرف موجودہ ٹارگٹ پیکیج کے لیے ڈھانچہ بنائیں
          mkdir -p "app/src/main/java/${{ env.TARGET_PATH }}"
          mkdir -p app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-hdpi
          
          # 3. build_assets سے Java فائلیں صرف ٹارگٹ پیکیج میں کاپی کریں
          if [ -d "build_assets/app/src/main/java" ]; then
            # تمام ذیلی پیکجز سے .java فائلیں ڈھونڈ کر ٹارگٹ میں ڈالیں
            find build_assets/app/src/main/java -type f -name "*.java" -exec cp -f {} "app/src/main/java/${{ env.TARGET_PATH }}/" \;
          fi
          
          # 4. اگر build_assets میں activity_main.xml موجود ہو تو کاپی کریں
          if [ -f "build_assets/activity_main.xml" ]; then
            cp -f "build_assets/activity_main.xml" app/src/main/res/layout/activity_main.xml
          fi
          
          # 5. کوئی اور ریسورس فائلیں (drawable, values) کاپی کریں
          if [ -d "build_assets/app/src/main/res" ]; then
            cp -rf build_assets/app/src/main/res/* app/src/main/res/ 2>/dev/null || true
          fi
          
          # 6. اگر build_assets میں AndroidManifest.xml ہو تو کاپی کریں
          if [ -f "build_assets/AndroidManifest.xml" ]; then
            cp -f "build_assets/AndroidManifest.xml" app/src/main/AndroidManifest.xml
          fi

      - name: Consolidate Java files (remove extra packages)
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          # کسی بھی دوسری ڈائرکٹری میں موجود .java فائلیں ہٹائیں
          find app/src/main/java -type f -name "*.java" | while read f; do
            if [[ "$f" != "$TARGET_DIR/"* ]]; then
              echo "Removing extra Java file: $f"
              rm -f "$f"
            fi
          done
          # خالی ڈائرکٹریز حذف کریں
          find app/src/main/java -type d -empty -delete 2>/dev/null || true

      - name: Fix Java files (package, imports, semicolons)
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          if [ ! -d "$TARGET_DIR" ]; then
            echo "No Java files found, creating default MainActivity"
            mkdir -p "$TARGET_DIR"
            cat > "$TARGET_DIR/MainActivity.java" << 'EOF'
          package ${{ env.TARGET_PACKAGE }};
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import android.hardware.camera2.CameraManager;
          public class MainActivity extends AppCompatActivity {
              private Button toggleButton;
              private CameraManager cameraManager;
              private boolean isTorchOn = false;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  toggleButton = findViewById(R.id.toggleButton);
                  cameraManager = (CameraManager) getSystemService(CAMERA_SERVICE);
                  toggleButton.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          try {
                              String cameraId = cameraManager.getCameraIdList()[0];
                              isTorchOn = !isTorchOn;
                              cameraManager.setTorchMode(cameraId, isTorchOn);
                              Toast.makeText(MainActivity.this, isTorchOn ? "Torch ON" : "Torch OFF", Toast.LENGTH_SHORT).show();
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Torch not available", Toast.LENGTH_SHORT).show();
                          }
                      }
                  });
              }
          }
          EOF
          fi
          
          # پیکیج لائن درست کریں
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i "s/^package .*;/package ${{ env.TARGET_PACKAGE }};/g" {} \;
          # امپورٹ R درست کریں
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i "s/import .*\.R;/import ${{ env.TARGET_PACKAGE }}.R;/g" {} \;
          # اگر پیکیج لائن موجود نہ ہو تو شامل کریں
          for file in $(find "$TARGET_DIR" -type f -name "*.java"); do
            if ! grep -q "^package" "$file"; then
              sed -i "1i package ${{ env.TARGET_PACKAGE }};" "$file"
            fi
          done
          # غائب سیمی کولن کا سادہ حل
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i '/^[[:space:]]*\(private\|public\|protected\)/ s/\([^;{}]\)$/\1;/' {} \;
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's/\(super\.[a-zA-Z]*(.*)\)$/\1;/' {} \;
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's/\(setContentView(.*)\)$/\1;/' {} \;
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's/})$/});/g' {} \;
          # بٹن ID کی مماثلت درست کریں
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's|R\.id\.torch_button|R.id.toggleButton|g' {} \;
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's|R\.id\.btn_torch|R.id.toggleButton|g' {} \;

      - name: Ensure Layout and Resources
        run: |
          LAYOUT="app/src/main/res/layout/activity_main.xml"
          if [ ! -f "$LAYOUT" ]; then
            mkdir -p app/src/main/res/layout
            cat > "$LAYOUT" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="20dp">
              <Button
                  android:id="@+id/toggleButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Toggle Torch"
                  android:textSize="18sp"
                  android:padding="14dp" />
          </LinearLayout>
          EOF
          fi
          
          # ڈراایبل اور دیگر ریسورسز
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/button_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:startColor="#6200EE" android:endColor="#8E2DE2" android:angle="45"/>
              <corners android:radius="30dp"/>
              <stroke android:width="1dp" android:color="#FFFFFF"/>
          </shape>
          EOF
          
          # ویلیوز فائلیں
          cat > app/src/main/res/values/strings.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">${{ env.APP_NAME }}</string>
              <string name="torch_on">Torch On</string>
              <string name="torch_off">Torch Off</string>
          </resources>
          EOF
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#6200EE</color>
              <color name="colorPrimaryDark">#3700B3</color>
              <color name="colorAccent">#03DAC5</color>
          </resources>
          EOF
          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          EOF

      - name: Copy App Icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p app/src/main/res/mipmap-$d; done
          ICON=$(find build_assets -type f -name "*.png" | head -1)
          if [ -n "$ICON" ] && file "$ICON" | grep -q "PNG image data"; then
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp -f "$ICON" app/src/main/res/mipmap-$d/ic_launcher.png
              cp -f "$ICON" app/src/main/res/mipmap-$d/ic_launcher_round.png
            done
          else
            # ڈیفالٹ آئیکن (Base64 چھوٹا سا)
            echo "" | base64 -d > /tmp/icon.png
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp -f /tmp/icon.png app/src/main/res/mipmap-$d/ic_launcher.png
              cp -f /tmp/icon.png app/src/main/res/mipmap-$d/ic_launcher_round.png
            done
          fi

      - name: Build AndroidManifest
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build Gradle files
        run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'SystemPro'
          include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          cat > app/build.gradle << EOF
          plugins { id 'com.android.application' }
          android {
              namespace "${{ env.TARGET_PACKAGE }}"
              compileSdk 34
              defaultConfig {
                  applicationId "${{ env.TARGET_PACKAGE }}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon 2> output_report/gradle_err.log
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk
          else
            echo "Build failed"
            exit 1
          fi

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          name: "Latest Build"
          body: "APK from workflow run #${{ github.run_number }}"
          files: output_report/app-debug.apk
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: System-Pro-V2-Final
          path: output_report/
