name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [android_full_build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Decode payload (only package name and app name, no icon)
      - name: Decode payload
        run: |
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            DECODED_PKG=$(echo "${{ github.event.client_payload.package_name }}" | base64 --decode)
            echo "CUSTOM_PACKAGE=$DECODED_PKG" >> $GITHUB_ENV
          fi
          if [ -n "${{ github.event.client_payload.app_name }}" ]; then
            DECODED_APP=$(echo "${{ github.event.client_payload.app_name }}" | base64 --decode)
            echo "CUSTOM_APPNAME=$DECODED_APP" >> $GITHUB_ENV
          fi

      - name: Set defaults
        run: |
          if [ -z "$CUSTOM_PACKAGE" ]; then
            echo "CUSTOM_PACKAGE=com.systempro.app" >> $GITHUB_ENV
          fi
          if [ -z "$CUSTOM_APPNAME" ]; then
            echo "CUSTOM_APPNAME=SystemProApp" >> $GITHUB_ENV
          fi

      # Clean old files
      - name: Clean old project
        run: |
          rm -rf app build.gradle settings.gradle gradle gradlew

      # Create directory structure
      - name: Create directories
        run: |
          PKG_PATH=$(echo $CUSTOM_PACKAGE | tr '.' '/')
          mkdir -p app/src/main/java/$PKG_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$density
          done

      # AndroidManifest.xml
      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="$CUSTOM_PACKAGE">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="$CUSTOM_APPNAME"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      # MainActivity.java (simple TextView to avoid WebView crashes)
      - name: Create MainActivity.java
        run: |
          PKG_PATH=$(echo $CUSTOM_PACKAGE | tr '.' '/')
          cat > app/src/main/java/$PKG_PATH/MainActivity.java << EOF
          package $CUSTOM_PACKAGE;

          import android.os.Bundle;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView tv = new TextView(this);
                  tv.setText("Hello from $CUSTOM_APPNAME!");
                  tv.setTextSize(24);
                  setContentView(tv);
              }
          }
          EOF

      # Empty layout (not used, but required)
      - name: Create activity_main.xml
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          EOF

      # Resource files
      - name: Create strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << EOF
          <resources>
              <string name="app_name">$CUSTOM_APPNAME</string>
          </resources>
          EOF

      - name: Create colors.xml
        run: |
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources>
              <color name="colorPrimary">#6200EE</color>
              <color name="colorPrimaryDark">#3700B3</color>
              <color name="colorAccent">#03DAC5</color>
          </resources>
          EOF

      - name: Create themes.xml
        run: |
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.AppCompat.Light.DarkActionBar" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          EOF

      # Icons: if you have pre-committed icons in the repo under app/src/main/res/mipmap-*, they will be used.
      # No automatic dummy icons – if missing, user must add them via file explorer.
      - name: List icon directories (for debugging)
        run: |
          echo "Checking icon files:"
          ls -R app/src/main/res/mipmap-* || echo "No icons found"

      # Gradle files
      - name: Create project build.gradle
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.3.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          rootProject.name = "SystemPro"
          include ':app'
          EOF

      - name: Create app/build.gradle
        run: |
          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '$CUSTOM_PACKAGE'
              compileSdk 34

              defaultConfig {
                  applicationId '$CUSTOM_PACKAGE'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      - name: Create gradle.properties (AndroidX fix)
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      # Setup Gradle wrapper
      - name: Setup Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x gradlew

      # Build with stacktrace for debugging
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
