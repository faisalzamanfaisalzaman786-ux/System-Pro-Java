name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Copy from build_assets
        run: |
          mkdir -p output_report
          rm -rf app/src/main/java app/src/main/res app/build
          
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          # Sanitize package name: only keep alphanumeric, dot, underscore
          CLEAN_PKG=$(echo "$RAW_PKG" | sed 's/[^a-zA-Z0-9._]/./g')
          CLEAN_PKG=$(echo "$CLEAN_PKG" | sed 's/\.\.*/./g')
          CLEAN_PKG=$(echo "$CLEAN_PKG" | sed 's/^\.//;s/\.$//')
          PKG_NAME=${CLEAN_PKG:-"com.system.titan.pro"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          
          echo "TARGET_PACKAGE=$PKG_NAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$PKG_PATH" >> $GITHUB_ENV
          
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          
          # Copy all Java files
          find build_assets -type f -name "*.java" -exec cp -f {} "app/src/main/java/$PKG_PATH/" \;
          
          # Copy layout if exists
          if [ -f "build_assets/activity_main.xml" ]; then
            cp -f "build_assets/activity_main.xml" app/src/main/res/layout/activity_main.xml
          elif [ -f "build_assets/app/src/main/res/layout/activity_main.xml" ]; then
            cp -f "build_assets/app/src/main/res/layout/activity_main.xml" app/src/main/res/layout/activity_main.xml
          fi

      - name: Consolidate all Java files into target package
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          find app/src/main/java -type f -name "*.java" | while read f; do
            if [[ "$f" != *"/${{ env.TARGET_PATH }}/"* ]]; then
              mv "$f" "$TARGET_DIR/$(basename "$f")"
            fi
          done
          find app/src/main/java -type d -empty -delete 2>/dev/null || true

      - name: Fix Java files (package, import R, semicolons, button IDs)
        run: |
          TARGET_DIR="app/src/main/java/${{ env.TARGET_PATH }}"
          if [ ! -d "$TARGET_DIR" ]; then
            echo "No Java files found"
            exit 0
          fi
          
          # Fix package name
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's/^package .*;/package ${{ env.TARGET_PACKAGE }};/g' {} \;
          # Fix import R
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's/import .*\.R;/import ${{ env.TARGET_PACKAGE }}.R;/g' {} \;
          # Add missing package line
          for file in $(find "$TARGET_DIR" -type f -name "*.java"); do
            if ! grep -q "^package" "$file"; then
              sed -i "1i package ${{ env.TARGET_PACKAGE }};" "$file"
            fi
          done
          # Fix semicolons
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i '/^[[:space:]]*\(private\|public\|protected\)/ s/\([^;{}]\)$/\1;/' {} \;
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's/\(super\.[a-zA-Z]*(.*)\)$/\1;/' {} \;
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's/\(setContentView(.*)\)$/\1;/' {} \;
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's/})$/});/g' {} \;
          # Fix button ID mismatch
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's|R\.id\.torch_button|R.id.toggleButton|g' {} \;
          find "$TARGET_DIR" -type f -name "*.java" -exec sed -i 's|R\.id\.btn_torch|R.id.toggleButton|g' {} \;
          # Add missing imports
          for file in $(find "$TARGET_DIR" -name "*.java"); do
            if grep -q "CameraManager" "$file" && ! grep -q "import android.hardware.camera2.CameraManager" "$file"; then
              sed -i '/^package .*/a import android.hardware.camera2.CameraManager;' "$file"
            fi
            if grep -q "CameraCharacteristics" "$file" && ! grep -q "import android.hardware.camera2.CameraCharacteristics" "$file"; then
              sed -i '/^package .*/a import android.hardware.camera2.CameraCharacteristics;' "$file"
            fi
            if grep -q "Toast" "$file" && ! grep -q "import android.widget.Toast" "$file"; then
              sed -i '/^package .*/a import android.widget.Toast;' "$file"
            fi
          done

      - name: Ensure layout has toggleButton
        run: |
          LAYOUT="app/src/main/res/layout/activity_main.xml"
          if [ ! -f "$LAYOUT" ]; then
            mkdir -p app/src/main/res/layout
            cat > "$LAYOUT" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center">
              <Button
                  android:id="@+id/toggleButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Toggle Torch" />
          </LinearLayout>
          EOF
          else
            sed -i 's|android:id="@+id/torch_button"|android:id="@+id/toggleButton"|g' "$LAYOUT"
            sed -i 's|android:id="@+id/btn_torch"|android:id="@+id/toggleButton"|g' "$LAYOUT"
          fi

      # ========== APP ICON (all densities) ==========
      - name: Copy and validate app icon
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$density
          done
          
          USE_DEFAULT=0
          if [ -f "build_assets/app_icon.png" ] && file build_assets/app_icon.png | grep -q PNG; then
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp -f build_assets/app_icon.png app/src/main/res/mipmap-$density/ic_launcher.png
              cp -f build_assets/app_icon.png app/src/main/res/mipmap-$density/ic_launcher_round.png
            done
            echo "✅ User icon copied"
          else
            USE_DEFAULT=1
          fi
          
          if [ "$USE_DEFAULT" = "1" ]; then
            # Simple blue square icon (base64)
            echo "" | base64 -d > /tmp/default_icon.png
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp -f /tmp/default_icon.png app/src/main/res/mipmap-$density/ic_launcher.png
              cp -f /tmp/default_icon.png app/src/main/res/mipmap-$density/ic_launcher_round.png
            done
          fi

      - name: Create default resources (strings, colors, styles, drawables)
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">System Pro</string>
              <string name="torch_on">Torch On</string>
              <string name="torch_off">Torch Off</string>
          </resources>
          EOF
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#6200EE</color>
              <color name="colorAccent">#03DAC5</color>
          </resources>
          EOF
          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/button_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/colorPrimary"/>
              <corners android:radius="8dp"/>
          </shape>
          EOF

      # ========== FULL HARDWARE PERMISSIONS INJECTION ==========
      - name: Build AndroidManifest with all hardware permissions
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Basic Network -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />

              <!-- Camera / Flashlight -->
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />

              <!-- Storage -->
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />

              <!-- Bluetooth (full) -->
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />

              <!-- Location (GPS) -->
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />

              <!-- Microphone / Audio Record -->
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <!-- Phone / Cellular -->
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.CALL_PHONE" />

              <!-- Sensors (Body, Heart rate, etc.) -->
              <uses-permission android:name="android.permission.BODY_SENSORS" />

              <!-- SMS / Contacts (optional but common) -->
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.WRITE_CONTACTS" />

              <!-- Calendar -->
              <uses-permission android:name="android.permission.READ_CALENDAR" />
              <uses-permission android:name="android.permission.WRITE_CALENDAR" />

              <!-- Notification (Android 13+) -->
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <!-- Others -->
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build Gradle file
        run: |
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace "${{ env.TARGET_PACKAGE }}"
              compileSdk 34
              defaultConfig {
                  applicationId "${{ env.TARGET_PACKAGE }}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon 2> output_report/gradle_err.log
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk
          else
            echo "APK not found" >> output_report/build_summary.txt
            exit 1
          fi

      - name: Validate APK size
        run: |
          SIZE=$(stat -c%s output_report/app-debug.apk 2>/dev/null || echo 0)
          if [ $SIZE -lt 50000 ]; then
            echo "APK too small ($SIZE bytes)" >> output_report/build_summary.txt
            exit 1
          else
            echo "APK size OK ($SIZE bytes)" >> output_report/build_summary.txt
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: System-Pro-V2-Final
          path: output_report/
