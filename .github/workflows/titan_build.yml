name: System Pro Enterprise Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Cleanup & Setup Paths
        run: |
          rm -rf app/src/main/java/com/system/pro/*
          mkdir -p app/src/main/java/com/system/pro
          mkdir -p app/src/main/res/layout

      - name: Generate Configs
        run: |
          echo "include ':app'" > settings.gradle
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }" > build.gradle
          echo "plugins { id 'com.android.application' }
          android {
              namespace 'com.system.pro'
              compileSdk 34
              buildFeatures { viewBinding true }
              defaultConfig { applicationId 'com.system.pro'; minSdk 24; targetSdk 34 }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }" > app/build.gradle

      - name: Write Java Code
        run: |
          cat << 'EOF' > app/src/main/java/com/system/pro/MainActivity.java
          package com.system.pro;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          import com.system.pro.databinding.ActivityMainBinding;
          import android.hardware.camera2.CameraManager;
          import android.widget.Toast;

          public class MainActivity extends AppCompatActivity {
              private ActivityMainBinding binding;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  binding = ActivityMainBinding.inflate(getLayoutInflater());
                  setContentView(binding.getRoot());
                  binding.torchButton.setOnClickListener(v -> toggleTorch());
              }
              private void toggleTorch() {
                  try {
                      CameraManager m = (CameraManager) getSystemService(CAMERA_SERVICE);
                      String[] ids = m.getCameraIdList();
                      if (ids.length > 0) m.setTorchMode(ids[0], true);
                  } catch (Exception e) {
                      Toast.makeText(this, "Error", Toast.LENGTH_SHORT).show();
                  }
              }
          }
          EOF

      - name: Write Layout
        run: |
          echo '<?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <Button
                  android:id="@+id/torchButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Toggle Torch"
                  android:layout_centerInParent="true"/>
          </RelativeLayout>' > app/src/main/res/layout/activity_main.xml

      - name: Build
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Enterprise-APK
          path: app/build/outputs/apk/debug/app-debug.apk
