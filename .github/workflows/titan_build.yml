name: Build Android APK (with Dynamic Package Name)

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. ریپو سے کوڈ چیک کریں
      - uses: actions/checkout@v4

      # 2. JDK 17 سیٹ اپ کریں
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. ڈائنامک پیکج نیم کو تمام جگہوں پر تبدیل کریں
      - name: Replace Package Name in All Files
        run: |
          # صارف کا دیا ہوا پیکج نیم client_payload سے حاصل کریں
          NEW_PKG="${{ github.event.client_payload.package_name }}"
          echo "Using Package Name: $NEW_PKG"

          # اگر کوئی پیکج نیم نہ دیا ہو تو ڈیفالٹ استعمال کریں
          if [ -z "$NEW_PKG" ]; then
            NEW_PKG="com.systempro.app"
          fi

          # مینی فیسٹ میں پیکج نیم تبدیل کریں
          sed -i "s/package=\"[^\"]*\"/package=\"$NEW_PKG\"/" app/src/main/AndroidManifest.xml

          # MainActivity.java میں پیکج اسٹیٹمنٹ تبدیل کریں
          find app/src/main/java -name "*.java" -exec sed -i "s/package .*;/package $NEW_PKG;/g" {} \;

      # 4. لے آؤٹ فائلز میں تھیم اور آئیکن ریفرنسز چیک کریں
      - name: Validate Layout References
        run: |
          # چیک کریں کہ کوئی بھی لے آؤٹ کسی غیر موجود ڈراایبل یا آئیکن کو تو ریفرنس نہیں کر رہا
          if grep -r "ic_torch_on" app/src/main/res/layout/; then
            echo "Layout uses torch icons, ensuring drawables exist..."
          fi

      # 5. App Icon کو mipmap فولڈرز میں ریسائز کریں
      - name: Generate App Icon in All Densities
        if: hashFiles('build_assets/app_icon.png') != ''
        uses: maaslalani/android-resize-icon@v1
        with:
          icon: build_assets/app_icon.png
          output: app/src/main/res

      # 6. gradle-wrapper.jar کو یقینی بنائیں (اگر موجود نہ ہو تو ڈاؤن لوڈ کریں)
      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            wget https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          fi

      # 7. ڈیپنڈنسیز اور SDK ورژنز کو اپ ڈیٹ کریں (اگر build.gradle موجود ہے)
      - name: Update Dependencies in build.gradle
        run: |
          if [ -f app/build.gradle ]; then
            sed -i "s/minSdk .*/minSdk 21/" app/build.gradle
            sed -i "s/targetSdk .*/targetSdk 34/" app/build.gradle
            sed -i "s/compileSdk .*/compileSdk 34/" app/build.gradle
          fi

      # 8. Gradle کے ساتھ APK بلڈ کریں
      - name: Build APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 9. اگر APK تیار ہو گیا ہے تو اسے اپ لوڈ کریں
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # 10. GitHub Release تخلیق کریں اور APK منسلک کریں
      - name: Create Release and Attach APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          files: app/build/outputs/apk/debug/*.apk
