name: Build Android APK (with Dynamic Package Name)

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Replace Package Name in All Files
        run: |
          NEW_PKG="${{ github.event.client_payload.package_name }}"
          echo "Using Package Name: $NEW_PKG"
          if [ -z "$NEW_PKG" ]; then
            NEW_PKG="com.systempro.app"
          fi
          sed -i "s/package=\"[^\"]*\"/package=\"$NEW_PKG\"/" app/src/main/AndroidManifest.xml
          find app/src/main/java -name "*.java" -exec sed -i "s/package .*;/package $NEW_PKG;/g" {} \;
          if [ -f app/build.gradle ]; then
            sed -i "s/applicationId \".*\"/applicationId \"$NEW_PKG\"/" app/build.gradle
          fi

      - name: Validate Layout References
        run: |
          if grep -r "ic_torch_on" app/src/main/res/layout/; then
            echo "Layout uses torch icons, ensuring drawables exist..."
          fi

      - name: Generate App Icon in All Densities
        if: hashFiles('build_assets/app_icon.png') != ''
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          convert build_assets/app_icon.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert build_assets/app_icon.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert build_assets/app_icon.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert build_assets/app_icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert build_assets/app_icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      # FIXED: Create a complete Gradle wrapper (gradlew + gradle-wrapper.jar)
      - name: Setup Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          # Download gradle-wrapper.jar if missing
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            wget https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          fi
          # Create gradle-wrapper.properties if missing
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.2-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          fi
          # Download a standard gradlew script from Gradle's official GitHub
          wget https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar?raw=true -O gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
          # Create gradlew script
          cat > gradlew << 'EOF'
          #!/bin/sh
          GRADLE_OPTS="-Dorg.gradle.appname=gradlew"
          exec java $GRADLE_OPTS -classpath "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew
          # Create gradlew.bat for Windows (optional)
          cat > gradlew.bat << 'EOF'
          @if "%DEBUG%" == "" @echo off
          @rem ##########################################################################
          @rem Gradle startup script for Windows
          @rem ##########################################################################
          set DIRNAME=%~dp0
          set APP_BASE_NAME=%~n0
          set CLASSPATH=%DIRNAME%gradle\wrapper\gradle-wrapper.jar
          java -classpath "%CLASSPATH%" org.gradle.wrapper.GradleWrapperMain %*
          EOF
          ls -la gradlew

      - name: Update Dependencies in build.gradle
        run: |
          if [ -f app/build.gradle ]; then
            sed -i "s/minSdk .*/minSdk 21/" app/build.gradle
            sed -i "s/targetSdk .*/targetSdk 34/" app/build.gradle
            sed -i "s/compileSdk .*/compileSdk 34/" app/build.gradle
          fi

      - name: Build APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release and Attach APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          files: app/build/outputs/apk/debug/*.apk
