name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'zulu' }

      - name: Prepare Workspace
        run: |
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          mkdir -p gradle/wrapper app/src/main/res/layout app/src/main/res/values app/src/main/res/mipmap-mdpi

      - name: Dynamic Package and Folder Injection Engine
        run: |
          PKG_NAME="${{ github.event.client_payload.package_name }}"
          if [ -z "$PKG_NAME" ]; then
            PKG_NAME="com.system.pro"
          fi
          echo "PACKAGE_NAME=$PKG_NAME" >> $GITHUB_ENV
          
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          echo "PKG_PATH=$PKG_PATH" >> $GITHUB_ENV

      - name: Inject Professional Configs
        run: |
          echo "android.useAndroidX=true
          android.enableJetifier=true" > gradle.properties

          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'SystemPro'
          include ':app'" > settings.gradle
          
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          
          echo "plugins { id 'com.android.application' }
          android {
              namespace '${{ env.PACKAGE_NAME }}'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ env.PACKAGE_NAME }}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }" > app/build.gradle

      - name: Dynamic Asset and Icon Injection
        run: |
          if [ ! -z "${{ github.event.client_payload.app_icon_b64 }}" ]; then
            echo "${{ github.event.client_payload.app_icon_b64 }}" | base64 -d > app/src/main/res/mipmap-mdpi/ic_launcher.png
          else
            echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF0000" android:pathData="M12,2L2,22h20L12,2zM12,6l6.5,13h-13L12,6z"/></vector>' > app/src/main/res/mipmap-mdpi/ic_launcher.xml
          fi

      - name: Dynamic UI and Code Injection Engine
        run: |
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.SystemPro" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#FF0000</item>
                  <item name="android:windowBackground">#121212</item>
              </style>
          </resources>
          EOF

          if [ ! -z "${{ github.event.client_payload.layout_xml }}" ]; then
            echo "${{ github.event.client_payload.layout_xml }}" > app/src/main/res/layout/activity_main.xml
          else
            cat << 'EOF' > app/src/main/res/layout/activity_main.xml
            <?xml version="1.0" encoding="utf-8"?>
            <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:background="#121212">
            </RelativeLayout>
          EOF
          fi

      - name: Setup Wrapper, Master Hardware Permissions and Manifest
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              
              <uses-permission android:name="android.permission.BODY_SENSORS" />
              <uses-permission android:name="android.permission.BODY_SENSORS_BACKGROUND" />

              <application 
                  android:allowBackup="true" 
                  android:label="System Pro" 
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.SystemPro">
                  <activity android:name="${{ env.PACKAGE_NAME }}.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          if [ ! -z "${{ github.event.client_payload.main_activity_java }}" ]; then
            echo "${{ github.event.client_payload.main_activity_java }}" > "app/src/main/java/${{ env.PKG_PATH }}/MainActivity.java"
          else
            cat << 'EOF' > "app/src/main/java/${{ env.PKG_PATH }}/MainActivity.java"
            package ${{ env.PACKAGE_NAME }};
            import android.os.Bundle;
            import androidx.appcompat.app.AppCompatActivity;

            public class MainActivity extends AppCompatActivity {
                @Override
                protected void Bundle savedInstanceState) {
                    super.onCreate(savedInstanceState);
                    setContentView(R.layout.activity_main);
                }
            }
          EOF
          fi

      - name: Final Build
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with: { name: System-Pro-Titan-APK, path: app/build/outputs/apk/debug/app-debug.apk }
