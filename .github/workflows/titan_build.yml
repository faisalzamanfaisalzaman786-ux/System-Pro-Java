name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'zulu' }

      - name: Prepare Workspace
        run: |
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          mkdir -p gradle/wrapper app/src/main/java/com/system/pro app/src/main/res/layout

      - name: Inject Professional Configs
        run: |
          # 1. gradle.properties (سب سے اہم: AndroidX کو فعال کرنا)
          echo "android.useAndroidX=true
          android.enableJetifier=true" > gradle.properties

          # 2. Settings.gradle
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'SystemPro'
          include ':app'" > settings.gradle
          
          # 3. Build.gradle
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          
          # 4. App Build.gradle
          echo "plugins { id 'com.android.application' }
          android {
              namespace 'com.system.pro'
              compileSdk 34
              defaultConfig { applicationId 'com.system.pro'; minSdk 24; targetSdk 34 }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }" > app/build.gradle

      - name: Setup Wrapper and Source
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"></manifest>' > app/src/main/AndroidManifest.xml
          echo 'package com.system.pro; import androidx.appcompat.app.AppCompatActivity; public class MainActivity extends AppCompatActivity {}' > app/src/main/java/com/system/pro/MainActivity.java

      - name: Final Build
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with: { name: System-Pro-Titan-APK, path: app/build/outputs/apk/debug/app-debug.apk }
