name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode Central Payload
        run: |
          mkdir -p output_report
          REPORT="output_report/build_error_report.txt"
          echo "=== SYSTEM PRO BUILD PROCESS REPORT ===" > $REPORT
          echo "Timestamp: $(date)" >> $REPORT
          
          echo "[STEP 1] Cleaning old work directories..." >> $REPORT
          rm -rf app/src/main/java
          rm -rf app/src/main/res
          rm -rf app/build
          
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME=${RAW_PKG:-"com.system.titan.pro"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          
          echo "TARGET_PACKAGE=$PKG_NAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$PKG_PATH" >> $GITHUB_ENV
          echo "Configured Package Name: $PKG_NAME" >> $REPORT
          
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          
          echo "[STEP 2] Extracting Incoming Payload ZIP..." >> $REPORT
          echo "${{ github.event.client_payload.payload }}" | base64 -d > app_payload.zip || true
          if [ -s app_payload.zip ]; then
            echo "Payload ZIP detected size: $(wc -c < app_payload.zip) bytes" >> $REPORT
            unzip -o app_payload.zip -d extracted_payload/ >> $REPORT 2>&1 || echo "ZIP extraction warning" >> $REPORT
          else
            echo "Warning: Payload ZIP was empty!" >> $REPORT
          fi

          echo "[STEP 3] Deploying Workspace Resources..." >> $REPORT
          if [ -d extracted_payload ]; then
              find extracted_payload -type f -name "activity_main.xml" -exec mv {} app/src/main/res/layout/ \; >> $REPORT 2>&1
              find extracted_payload -type f -name "colors.xml" -exec mv {} app/src/main/res/values/ \; >> $REPORT 2>&1
              find extracted_payload -type f -name "neon_button.xml" -exec mv {} app/src/main/res/drawable/ \; >> $REPORT 2>&1
          fi

          if [ ! -f app/src/main/res/values/colors.xml ]; then
              cat << 'EOF' > app/src/main/res/values/colors.xml
              <?xml version="1.0" encoding="utf-8"?>
              <resources>
                  <color name="colorPrimary">#02040c</color>
                  <color name="colorAccent">#00ffcc</color>
                  <color name="background_dark">#02040c</color>
                  <color name="neon_glow">#00ffcc</color>
              </resources>
  EOF
          fi

          if [ ! -f app/src/main/res/layout/activity_main.xml ]; then
              cat << 'EOF' > app/src/main/res/layout/activity_main.xml
              <?xml version="1.0" encoding="utf-8"?>
              <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#02040c">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="System Pro Dynamic Fallback"
                      android:textColor="#00ffcc"
                      android:textSize="24sp"
                      android:layout_centerInParent="true"/>
              </RelativeLayout>
  EOF
          fi

          cat << EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="$PKG_NAME">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="System Pro"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          echo "[STEP 4] Scanning and re-mapping custom Java files..." >> $REPORT
          if [ -d extracted_payload ]; then
              find extracted_payload -type f -name "*.java" | while read -r java_file; do
                  basename_java=$(basename "$java_file")
                  echo "Processing Code Component: $basename_java" >> $REPORT
                  sed -i "s|^package .*|package $PKG_NAME;|g" "$java_file"
                  if ! grep -q "import $PKG_NAME.R;" "$java_file"; then
                      sed -i "/package $PKG_NAME;/a import $PKG_NAME.R;" "$java_file"
                  fi
                  mv "$java_file" "app/src/main/java/$PKG_PATH/$basename_java"
              done
          fi

          if [ ! -f "app/src/main/java/$PKG_PATH/MainActivity.java" ]; then
              cat << 'EOF' > "app/src/main/java/$PKG_PATH/MainActivity.java"
              package placeholder;
              import android.os.Bundle;
              import androidx.appcompat.app.AppCompatActivity;
              public class MainActivity extends AppCompatActivity {
                  @Override
                  protected void onCreate(Bundle savedInstanceState) {
                      super.onCreate(savedInstanceState);
                      setContentView(resources_placeholder);
                  }
              }
  EOF
              sed -i "s|package placeholder;|package $PKG_NAME;|g" "app/src/main/java/$PKG_PATH/MainActivity.java"
              sed -i "s|resources_placeholder|$PKG_NAME.R.layout.activity_main|g" "app/src/main/java/$PKG_PATH/MainActivity.java"
          fi
          
          if [ -f app_icon.png ] && [ -s app_icon.png ]; then
            cp app_icon.png app/src/main/res/drawable/ic_launcher.png
            cp app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp app_icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp app_icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp app_icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            mv app_icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
            curl -s -o default_icon.png https://raw.githubusercontent.com/actions/automating-with-github-actions/master/shared/workflow-run.png || touch default_icon.png
            cp default_icon.png app/src/main/res/drawable/ic_launcher.png
            cp default_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp default_icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp default_icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp default_icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            mv default_icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Inject Missing Resources and System Themes
        run: |
          REPORT="output_report/build_error_report.txt"
          echo "[STEP 5] Injecting core dependencies and layout bindings..." >> $REPORT
          echo -e '<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android">\n    <solid android:color="#1AFFFFFF"/>\n    <corners android:radius="8dp"/>\n</shape>' > app/src/main/res/drawable/edittext_background.xml
          echo -e '<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android">\n    <solid android:color="#1AFFFFFF"/>\n    <corners android:radius="8dp"/>\n</shape>' > app/src/main/res/drawable/spinner_background.xml
          
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@android:color/holo_blue_dark</item>
                  <item name="colorSecondary">@android:color/holo_blue_light</item>
                  <item name="windowNoTitle">true</item>
                  <item name="windowActionBar">false</item>
              </style>
              <style name="ShapeAppearance">
                  <item name="cornerSize">4dp</item>
              </style>
              <style name="Widget.MaterialComponents.ProgressBar" parent="android:Widget.ProgressBar"/>
              <style name="Widget.MaterialComponents.ProgressBar.Horizontal" parent="android:Widget.ProgressBar.Horizontal"/>
              <style name="Widget.MaterialComponents.Spinner" parent="android:Widget.Spinner"/>
          </resources>
          EOF

          cat << EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace '${{ env.TARGET_PACKAGE }}'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ env.TARGET_PACKAGE }}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: Setup Gradle Wrapper Explicitly
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Force Lock Wrapper Version
        run: |
          mkdir -p gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          REPORT="output_report/build_error_report.txt"
          echo "[STEP 6] Triggering Primary Compilation..." >> $REPORT
          
          ./gradlew assembleDebug --no-daemon 2> output_report/gradle_err.log && (
            echo "BUILD_STATUS=SUCCESS" >> $REPORT
            echo "Custom payload source code compiled successfully!" >> $REPORT
          ) || (
            echo "BUILD_STATUS=FALLBACK_TRIGGERED" >> $REPORT
            echo "=====================================" >> $REPORT
            echo "CRITICAL ERROR: Main custom code failed to build!" >> $REPORT
            echo "Deploying Smart Fallback Stack (Task Vault)..." >> $REPORT
            echo "=====================================" >> $REPORT
            cat output_report/gradle_err.log >> $REPORT
            
            rm -rf app
            mkdir -p app/src/main/res/layout
            mkdir -p app/src/main/res/values
            mkdir -p app/src/main/java/${{ env.TARGET_PATH }}
            
            cat << EOF > app/build.gradle
            plugins {
                id 'com.android.application'
            }
            android {
                namespace '${{ env.TARGET_PACKAGE }}'
                compileSdk 34
                defaultConfig {
                    applicationId '${{ env.TARGET_PACKAGE }}'
                    minSdk 24
                    targetSdk 34
                    versionCode 1
                    versionName "1.0"
                }
                buildTypes {
                    release {
                        minifyEnabled false
                    }
                }
            }
            dependencies {
                implementation 'androidx.appcompat:appcompat:1.6.1'
                implementation 'com.google.android.material:material:1.11.0'
            }
          EOF
            
            cat << EOF > app/src/main/AndroidManifest.xml
            <?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://schemas.android.com/apk/res/android"
                package="${{ env.TARGET_PACKAGE }}">
                <application
                    android:allowBackup="true"
                    android:icon="@drawable/ic_launcher"
                    android:label="Titan Task Vault"
                    android:theme="@style/Theme.AppCompat.NoActionBar">
                    <activity android:name=".MainActivity" android:exported="true">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </manifest-filter>
                    </activity>
                </application>
            </manifest>
          EOF

            cat << 'EOF' > app/src/main/res/layout/activity_main.xml
            <?xml version="1.0" encoding="utf-8"?>
            <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:background="#02040c"
                android:padding="16dp">
                <TextView
                    android:id="@+id/todo_title"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="FALLBACK TASK VAULT"
                    android:textColor="#ff4444"
                    android:textSize="20sp"
                    android:textStyle="bold"
                    android:layout_centerHorizontal="true"
                    android:layout_marginTop="10dp"/>
                <LinearLayout
                    android:id="@+id/input_container"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="horizontal"
                    android:layout_below="@id/todo_title"
                    android:layout_marginTop="20dp"
                    android:weightSum="4">
                    <EditText
                        android:id="@+id/task_input"
                        android:layout_width="0dp"
                        android:layout_height="50dp"
                        android:layout_weight="3"
                        android:hint="Backup Task Mode..."
                        android:textColor="#ffffff"
                        android:textColorHint="#556677"
                        android:padding="10dp"
                        android:background="@android:drawable/editbox_background"/>
                    <Button
                        android:id="@+id/btn_add_task"
                        android:layout_width="0dp"
                        android:layout_height="50dp"
                        android:layout_weight="1"
                        android:layout_marginLeft="8dp"
                        android:text="ADD"
                        android:backgroundTint="#ff4444"/>
                </LinearLayout>
                <ScrollView
                    android:layout_width="match_parent"
                    android:layout_height="match_parent"
                    android:layout_below="@id/input_container"
                    android:layout_marginTop="15dp"
                    android:fillViewport="true">
                    <LinearLayout
                        android:id="@+id/task_list_container"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="vertical">
                    </LinearLayout>
                </ScrollView>
            </RelativeLayout>
          EOF

            cat << 'EOF' > app/src/main/res/values/colors.xml
            <?xml version="1.0" encoding="utf-8"?>
            <resources>
                <color name="colorPrimary">#02040c</color>
                <color name="colorAccent">#ff4444</color>
            </resources>
          EOF

            cat << 'EOF' > app/src/main/java/${{ env.TARGET_PACKAGE }}/MainActivity.java
            package placeholder;
            import android.graphics.Color;
            import android.os.Bundle;
            import android.view.View;
            import android.widget.Button;
            import android.widget.EditText;
            import android.widget.LinearLayout;
            import android.widget.TextView;
            import androidx.appcompat.app.AppCompatActivity;
            public class MainActivity extends AppCompatActivity {
                private EditText taskInput;
                private LinearLayout taskListContainer;
                @Override
                protected void onCreate(Bundle savedInstanceState) {
                    super.onCreate(savedInstanceState);
                    setContentView(getResources().getIdentifier("activity_main", "layout", getPackageName()));
                    taskInput = findViewById(getResources().getIdentifier("task_input", "id", getPackageName()));
                    taskListContainer = findViewById(getResources().getIdentifier("task_list_container", "id", getPackageName()));
                    Button btnAddTask = findViewById(getResources().getIdentifier("btn_add_task", "id", getPackageName()));
                    if (btnAddTask != null) {
                        btnAddTask.setOnClickListener(new View.OnClickListener() {
                            @Override
                            public void onClick(View v) {
                                String txt = taskInput.getText().toString().trim();
                                if(!txt.isEmpty()) {
                                    final LinearLayout row = new LinearLayout(MainActivity.this);
                                    row.setPadding(10,10,10,10);
                                    TextView tv = new TextView(MainActivity.this);
                                    tv.setText(txt);
                                    tv.setTextColor(Color.WHITE);
                                    row.addView(tv);
                                    taskListContainer.addView(row);
                                    taskInput.setText("");
                                }
                            }
                        });
                    }
                }
            }
          EOF
            sed -i "s|package placeholder;|package ${{ env.TARGET_PACKAGE }};|g" app/src/main/java/${{ env.TARGET_PATH }}/MainActivity.java
            
            ./gradlew assembleDebug --no-daemon
          )
          cp app/build/outputs/apk/debug/app-debug.apk output_report/app-debug.apk

      - name: Upload Build Artifact with Detailed Report
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final
          path: output_report/
