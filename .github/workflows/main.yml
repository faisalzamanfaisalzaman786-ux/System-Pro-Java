name: System Pro Auto Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          cache-disabled: true

      - name: Prepare and Build
        run: |
          PKG_NAME="${{ github.event.client_payload.package_name || 'com.torch.systempro' }}"
          
          # مکمل صفائی
          rm -rf .gradle build app/build
          rm -rf app/src/main/java/* app/src/main/res/drawable/* app/src/main/res/mipmap-*

          # ڈیفالٹ فولڈرز بنانا (ایرر سے بچنے کے لیے ضروری ہے)
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/values

          # زپ سے ڈیٹا نکالنا
          if [ -n "${{ github.event.client_payload.zip_data }}" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            unzip -o project.zip -d temp_dir/
            
            # فائلوں کے نام ٹھیک کرنا
            find temp_dir/src/main/res -type f | while read -r file; do
                new_name=$(echo "$file" | tr ' ' '_' | tr -d '()' | tr '[:upper:]' '[:lower:]')
                mv "$file" "$new_name" 2>/dev/null || true
            done
            
            # پیکیج اور جاوا سیٹ اپ
            find temp_dir/src/main/java -name "*.java" -exec sed -i "s/^package .*;/package $PKG_NAME;/g" {} +
            PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
            mkdir -p "app/src/main/java/$PKG_PATH"
            find temp_dir/src/main/java -name "*.java" -exec cp {} "app/src/main/java/$PKG_PATH/" \;
            cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
            
            # آئیکن کو زبردستی میپ میپ (mipmap) میں کاپی کرنا
            ICON_FILE=$(find app/src/main/res/drawable -name "*.png" | head -n 1)
            if [ -n "$ICON_FILE" ]; then
                cp "$ICON_FILE" app/src/main/res/mipmap-hdpi/ic_launcher.png
            else
                # اگر زپ میں تصویر نہ ہو تو خالی فولڈر کی وجہ سے ایرر نہ آئے، اس لیے ایک سادہ فائل بنانا
                touch app/src/main/res/mipmap-hdpi/ic_launcher.png
            fi
            rm -rf temp_dir project.zip
          fi

          # مینی فیسٹ (بغیر کسی پیچیدگی کے)
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="System Pro" android:icon="@mipmap/ic_launcher" android:theme="@style/Theme.AppCompat.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

          # بلڈ فائل (8.5 کے لیے فکسڈ)
          echo "plugins { id 'com.android.application' }
          android {
              namespace '$PKG_NAME'
              compileSdk 34
              defaultConfig {
                  applicationId '$PKG_NAME'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }" > app/build.gradle

          # بلڈ رن کرنا
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Fixed
          path: app/build/outputs/apk/debug/*.apk
