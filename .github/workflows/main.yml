name: System Pro - Final APK Success

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create Android Structure
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/systempro/app
          mkdir -p app/src/main/res/values

          # HTML file check
          if [ -f "index.html" ]; then
            cp index.html app/src/main/assets/index.html
          else
            echo "<html><body style='background:#000;color:#fff;'><h1>System Pro</h1></body></html>" > app/src/main/assets/index.html
          fi

          # Themes & Resources
          echo '<resources><style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar" /></resources>' > app/src/main/res/values/styles.xml
          
          cat > app/src/main/AndroidManifest.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="System Pro" android:theme="@style/AppTheme" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create Java MainActivity
        run: |
          cat > app/src/main/java/com/systempro/app/MainActivity.java << 'EOF'
          package com.systempro.app;
          import android.os.Bundle;
          import android.webkit.*;
          import android.app.Activity;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  web.setWebViewClient(new WebViewClient());
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Setup Gradle Files
        run: |
          echo "include ':app'" > settings.gradle
          
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.systempro.app'
              compileSdk 33
              defaultConfig {
                  applicationId "com.systempro.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

      - name: Build APK (Bypass Wrapper)
        run: |
          # Is command se GitHub system ka standard gradle use karega
          gradle assembleDebug

      - name: Find and Move APK
        run: |
          # APK ko dhoond kar main folder mein laayein taake size theek aaye
          mkdir -p output
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output/SystemPro.apk \;

      - name: Upload Real APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-App-Final
          path: output/SystemPro.apk
