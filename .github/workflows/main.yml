name: HTML to Android Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize Android Project
        run: |
          mkdir -p app/src/main/java/com/systempro/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          # HTML Check
          if [ -f "index.html" ]; then
            cp index.html app/src/main/assets/
          else
            echo "<html><body><h1>System Pro App</h1></body></html>" > app/src/main/assets/index.html
          fi

          # Create Manifest
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="System Pro" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name="com.systempro.app.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Create MainActivity
          cat <<EOF > app/src/main/java/com/systempro/app/MainActivity.java
          package com.systempro.app;
          import android.os.Bundle;
          import android.webkit.WebView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView wv = new WebView(this);
                  wv.getSettings().setJavaScriptEnabled(true);
                  wv.loadUrl("file:///android_asset/index.html");
                  setContentView(wv);
              }
          }
          EOF

      - name: Setup Build Files
        run: |
          # Root build.gradle
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.1.1" }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # App build.gradle
          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.systempro.app'
              compileSdk 33
              defaultConfig {
                  applicationId "com.systempro.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation "androidx.appcompat:appcompat:1.6.1"
          }
          EOF

          echo "include ':app'" > settings.gradle

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.2
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-App
          path: app/build/outputs/apk/debug/app-debug.apk
