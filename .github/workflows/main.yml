name: System Pro Universal Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Universal Engine Execution
        run: |
          # 1. Setup Variables
          USER_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME="${USER_PKG:-com.systempro.app}"
          ZIP_DATA="${{ github.event.client_payload.zip_data }}"
          
          # 2. Clean and Create Structure
          rm -rf app temp_dir
          mkdir -p app/src/main/java app/src/main/res/layout app/src/main/res/values

          # 3. Create Permanent Universal AndroidManifest
          cat <<'EOF' > app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="REPLACE_PKG">
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.CAMERA" />
    <uses-permission android:name="android.permission.RECORD_AUDIO" />
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
    <uses-feature android:name="android.hardware.camera" android:required="true" />
    <uses-feature android:name="android.hardware.camera.flash" android:required="false" />

    <application
        android:label="System Pro"
        android:theme="@style/Theme.SystemPro"
        android:icon="@mipmap/ic_launcher"
        android:allowBackup="true"
        android:supportsRtl="true">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF

          # 4. Create Permanent Universal Theme
          cat <<'EOF' > app/src/main/res/values/themes.xml
<resources>
    <style name="Theme.SystemPro" parent="Theme.MaterialComponents.DayNight.NoActionBar">
        <item name="colorPrimary">#00FFCC</item>
        <item name="android:statusBarColor">#02040C</item>
        <item name="android:windowBackground">#02040C</item>
    </style>
</resources>
EOF

          # 5. Create Corrected settings.gradle (Root level)
          cat <<'EOF' > settings.gradle
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "SystemPro"
include ':app'
EOF

          # 6. Create Permanent app/build.gradle with all Libraries
          cat <<'EOF' > app/build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace "REPLACE_PKG"
    compileSdk 34

    defaultConfig {
        applicationId "REPLACE_PKG"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation "androidx.camera:camera-core:1.3.0"
    implementation "androidx.camera:camera-camera2:1.3.0"
    implementation "androidx.camera:camera-lifecycle:1.3.0"
    implementation "androidx.camera:camera-view:1.3.0"
    implementation 'com.google.guava:guava:31.1-android'
}
EOF

          # 7. Replace Package Name in Manifest and build.gradle
          sed -i "s/REPLACE_PKG/$PKG_NAME/g" app/src/main/AndroidManifest.xml
          sed -i "s/REPLACE_PKG/$PKG_NAME/g" app/build.gradle

          # 8. Inject custom resources and Java files from payload (if provided)
          if [ -n "$ZIP_DATA" ]; then
            echo "$ZIP_DATA" | base64 -d > project.zip
            unzip -o project.zip -d temp_dir/
            # Copy resources (res folder)
            cp -rf temp_dir/src/main/res/* app/src/main/res/ 2>/dev/null || true
            
            # Copy Java files preserving package structure
            PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
            mkdir -p "app/src/main/java/$PKG_PATH"
            # Find all .java files and copy them into the correct package directory
            find temp_dir/src/main/java -name "*.java" -type f | while read java_file; do
                # Get relative path without temp_dir/src/main/java/
                rel_path="${java_file#temp_dir/src/main/java/}"
                # Create target directory
                target_dir="app/src/main/java/$PKG_PATH/$(dirname "$rel_path")"
                mkdir -p "$target_dir"
                cp "$java_file" "$target_dir/"
                # Change package name in the copied file
                sed -i "s/^package .*;/package $PKG_NAME;/" "$target_dir/$(basename "$java_file")"
            done
          fi

          # 9. Generate Gradle Wrapper and Build
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V8-Final
          path: app/build/outputs/apk/debug/*.apk
