name: System Pro Titan Master Build
on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  GRADLE_VERSION: 8.5
  AGP_VERSION: 8.1.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Advanced Engine - Permission & Icon Fix
        run: |
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/*
          rm -rf temp_files project.zip
          
          ZIP_DATA="${{ github.event.client_payload.zip_data }}"
          if [ ! -z "$ZIP_DATA" ]; then
            echo "$ZIP_DATA" | tr -d '\n\r ' | base64 -d > project.zip
            unzip -o project.zip -d temp_files || true
            
            TARGET_JAVA=$(find temp_files -name "MainActivity.java" | head -n 1)
            if [ ! -z "$TARGET_JAVA" ]; then
              sed -i 's|editJava.setText(prefs.getString("java_code", "package .*|editJava.setText(prefs.getString("java_code", "package com.zipforge.pro;\"));|g' "$TARGET_JAVA"
              
              RAW_PKG=$(grep "package " "$TARGET_JAVA" | head -n 1 | cut -d' ' -f2 | tr -d ';')
              if [ -z "$RAW_PKG" ]; then RAW_PKG="com.system.pro"; fi
              echo "FINAL_PKG=$RAW_PKG" >> $GITHUB_ENV
              
              PKG_PATH=$(echo $RAW_PKG | tr '.' '/')
              mkdir -p app/src/main/java/$PKG_PATH
              cp -f "$TARGET_JAVA" app/src/main/java/$PKG_PATH/MainActivity.java
            else
              echo "FINAL_PKG=com.system.pro" >> $GITHUB_ENV
              mkdir -p app/src/main/java/com/system/pro
            fi
            
            mkdir -p app/src/main/res/layout
            mkdir -p app/src/main/res/values
            mkdir -p app/src/main/res/drawable
            mkdir -p app/src/main/res/mipmap-hdpi
            
            TARGET_XML=$(find temp_files -name "activity_main.xml" | head -n 1)
            if [ ! -z "$TARGET_XML" ]; then
              cp -f "$TARGET_XML" app/src/main/res/layout/activity_main.xml
            fi
            
            if [ -f temp_files/ic_launcher.png ]; then
              cp -f temp_files/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            elif [ -f temp_files/icon.png ]; then
              cp -f temp_files/icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            fi
            
            echo '<resources><style name="Theme.SystemPro" parent="Theme.AppCompat.Light.NoActionBar"/></resources>' > app/src/main/res/values/styles.xml
          fi

      - name: Master Manifest (With Permissions)
        run: |
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
              
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="System Pro"
                  android:theme="@style/Theme.SystemPro">
                  <activity android:name="${{ env.FINAL_PKG }}.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: ProGuard Size Management
        run: |
          cat <<EOF > app/proguard-rules.pro
          -dontobfuscate
          -keepattributes *Annotation*
          -keep public class * extends android.app.Activity
          -keep public class * extends android.app.Application
          -keep public class ${{ env.FINAL_PKG }}.** { *; }
          EOF

      - name: Build Shield Engine
        run: |
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:${{ env.AGP_VERSION }}' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          echo 'include ":app"' > settings.gradle
          
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace '${{ env.FINAL_PKG }}'
              compileSdk 34
              defaultConfig {
                  applicationId "${{ env.FINAL_PKG }}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildFeatures {
                  buildConfig true
              }
              buildTypes {
                  debug {
                      minifyEnabled true
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Execute Assembly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip
          unzip -q gradle-${{ env.GRADLE_VERSION }}-bin.zip
          ./gradle-${{ env.GRADLE_VERSION }}/bin/gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Deliver Final APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final
          path: app/build/outputs/apk/debug/*.apk
