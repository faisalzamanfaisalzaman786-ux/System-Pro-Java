name: System Pro Auto Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cleanup Old Files
        run: |
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/layout/*
          rm -rf app/src/main/res/drawable/*
          rm -rf app/src/main/res/values/strings.xml
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/menu

      - name: Extract Project Data
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
          unzip -o project.zip -d temp_dir/
          cp -rf temp_dir/src/main/* app/src/main/ || true
          rm -rf temp_dir project.zip

      - name: Ensure Menu Resource Exists
        run: |
          if [ ! -f "app/src/main/res/menu/main_menu.xml" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><menu xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto"><item android:id="@+id/action_settings" android:title="Settings" app:showAsAction="never" /></menu>' > app/src/main/res/menu/main_menu.xml
          fi

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx2048m -Dorg.gradle.jvmargs=-Xmx2048m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name || 'System-Pro-Release' }}
          path: app/build/outputs/apk/debug/*.apk
