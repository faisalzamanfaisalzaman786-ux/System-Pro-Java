name: System Pro Universal Strong Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Execute Universal Engine
        run: |
          # 1. ڈائنامک پیکیج نیم (کنفلکٹ سے بچنے کے لیے ٹائم اسٹیمپ کا استعمال)
          TIME_STAMP=$(date +%m%d%H%M)
          USER_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME="${USER_PKG:-com.system.pro.id$TIME_STAMP}"
          PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
          
          echo "Building for Package: $PKG_NAME"

          # 2. پرانے ڈیٹا کی صفائی اور نیا ڈھانچہ
          rm -rf app temp_dir
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi

          # 3. ڈیفالٹ ریسورسز (اگر زپ میں نہ ہوں تو یہ کام آئیں گے)
          printf "<resources>\n    <color name=\"colorPrimary\">#6200EE</color>\n    <color name=\"colorPrimaryDark\">#3700B3</color>\n    <color name=\"colorAccent\">#03DAC5</color>\n</resources>" > app/src/main/res/values/colors.xml
          printf "<resources>\n    <style name=\"Theme.SystemPro\" parent=\"Theme.AppCompat.Light.NoActionBar\">\n        <item name=\"colorPrimary\">@color/colorPrimary</item>\n        <item name=\"colorPrimaryDark\">@color/colorPrimaryDark</item>\n    </style>\n</resources>" > app/src/main/res/values/styles.xml

          # 4. زپ فائل پروسیسنگ اور کوڈ انجکشن
          if [ -n "${{ github.event.client_payload.zip_data }}" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            unzip -o project.zip -d temp_dir/
            
            # ریسورسز کاپی کرنا
            [ -d "temp_dir/src/main/res" ] && cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
            
            # جاوا فائلز منتقل کرنا
            find temp_dir -name "*.java" -exec cp {} "app/src/main/java/$PKG_PATH/" \;
            
            # آٹو امپورٹ اور پیکیج فکسر (سب سے اہم حصہ)
            find "app/src/main/java/$PKG_PATH/" -name "*.java" -type f | while read -r file; do
              # پیکیج لائن درست کریں
              sed -i "1s/^package .*;/package $PKG_NAME;/" "$file"
              # صرف R فائل کے پرانے امپورٹس ہٹائیں، باقی (کیمرہ وغیرہ) محفوظ رہیں گے
              sed -i "/import .*\.R;/d" "$file"
              # نیا درست R امپورٹ شامل کریں
              sed -i "/package $PKG_NAME;/a import $PKG_NAME.R;" "$file"
            done
          fi

          # 5. یونیورسل مینی فیسٹ (کیمرہ اور دیگر پرمیشنز کے ساتھ)
          printf "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" package=\"$PKG_NAME\">\n    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application android:label=\"System Pro\" android:icon=\"@android:drawable/ic_menu_camera\" android:theme=\"@style/Theme.SystemPro\" android:allowBackup=\"true\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>" > app/src/main/AndroidManifest.xml

          # 6. ماسٹر بلڈ گریڈل (تمام ضروری لائبریریز پہلے سے موجود ہیں)
          printf "plugins { id 'com.android.application' }\nandroid {\n    namespace '$PKG_NAME'\n    compileSdk 34\n    defaultConfig {\n        applicationId '$PKG_NAME'\n        minSdk 24\n        targetSdk 34\n        versionCode $(date +%s)\n        multiDexEnabled true\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'com.google.android.material:material:1.11.0'\n    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'\n    // CameraX Libraries\n    def camerax_version = '1.3.0'\n    implementation \"androidx.camera:camera-core:\${camerax_version}\"\n    implementation \"androidx.camera:camera-camera2:\${camerax_version}\"\n    implementation \"androidx.camera:camera-lifecycle:\${camerax_version}\"\n    implementation \"androidx.camera:camera-view:\${camerax_version}\"\n    implementation 'com.google.guava:guava:31.1-android'\n}" > app/build.gradle
          
          echo "include ':app'" > settings.gradle
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Dynamic-Build
          path: app/build/outputs/apk/debug/*.apk
