name: System Pro - Atomic Build Fix

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  atomic-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout (Fresh Start)
        uses: actions/checkout@v4
        with:
          clean: true # یہ گٹ کی تمام عارضی فائلوں کو صاف کر دے گا

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # ہم یہاں کوئی کیشے استعمال نہیں کریں گے

      - name: 3. Nuclear Cleanup & Re-structure
        run: |
          # سب کچھ صاف کریں، کچھ بھی نہ چھوڑیں
          rm -rf .gradle build app/build
          find . -name "*.iml" -type f -delete
          find . -name ".idea" -type d -exec rm -rf {} +
          
          # صرف ضروری فائلیں دوبارہ بنائیں
          mkdir -p app/src/main/java/com/systempro/ultimate
          mkdir -p app/src/main/res/values
          echo "include ':app'" > settings.gradle
          
          # پروجیکٹ لیول build.gradle
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

      - name: 4. Build with NO Cache (اصل جادو یہاں ہے)
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          # --no-build-cache اور --no-daemon گریڈل کو مجبور کریں گے کہ وہ پرانا کچھ بھی استعمال نہ کرے
          ./gradlew assembleDebug --no-build-cache --no-daemon --stacktrace

      - name: 5. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V8-Atomic
          path: app/build/outputs/apk/debug/*.apk
