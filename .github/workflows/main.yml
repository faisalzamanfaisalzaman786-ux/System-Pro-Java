name: System Pro Native APK Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Native Project Structure
      run: |
        mkdir -p app/src/main/java/com/systempro/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 1. Gradle Properties
        cat <<EOF > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        # 2. Settings
        echo "include ':app'" > settings.gradle

        # 3. Root build.gradle
        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 4. App build.gradle
        cat <<EOF > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.systempro.app'
            compileSdk 34
            defaultConfig {
                applicationId "com.systempro.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

        # 5. Strings & Styles (Manifest Merger کے لیے لازمی)
        cat <<EOF > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">System Pro</string>
        </resources>
        EOF

        cat <<EOF > app/src/main/res/values/themes.xml
        <resources>
            <style name="Theme.SystemPro" parent="Theme.MaterialComponents.DayNight.NoActionBar">
            </style>
        </resources>
        EOF

        # 6. UI Layout
        cat <<EOF > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.microsoft.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#121212">
            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_gravity="center"
                android:text="System Pro\nBuild Success!"
                android:textColor="#00FF00"
                android:textSize="24sp"
                android:gravity="center"
                android:textStyle="bold" />
        </FrameLayout>
        EOF

        # 7. Java MainActivity
        cat <<EOF > app/src/main/java/com/systempro/app/MainActivity.java
        package com.systempro.app;
        import android.os.Bundle;
        import androidx.appcompat.app.AppCompatActivity;
        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
            }
        }
        EOF

        # 8. Corrected Android Manifest
        cat <<EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.microsoft.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:icon="@mipmap/ic_launcher"
                android:theme="@style/Theme.SystemPro">
                <activity 
                    android:name=".MainActivity" 
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Build APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SystemPro-V2-Native-APK
        path: app/build/outputs/apk/debug/app-debug.apk
