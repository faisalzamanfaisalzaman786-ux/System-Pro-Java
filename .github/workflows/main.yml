name: System Pro Ultimate Strong Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Execute Strong Build Engine
        run: |
          # 1. ماحول کی تیاری
          USER_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME="${USER_PKG:-com.faisal.systempro}"
          
          rm -rf app temp_dir
          mkdir -p app/src/main/java app/src/main/res/layout app/src/main/res/values app/src/main/res/mipmap-hdpi

          # 2. ضروری اسٹائلز، رنگوں اور ڈائمنشنز کا اندراج
          printf "<resources>\n    <color name=\"colorPrimary\">#6200EE</color>\n    <color name=\"colorPrimaryDark\">#3700B3</color>\n    <color name=\"colorAccent\">#03DAC5</color>\n</resources>" > app/src/main/res/values/colors.xml
          printf "<resources>\n    <style name=\"Theme.SystemPro\" parent=\"Theme.AppCompat.Light.NoActionBar\">\n        <item name=\"colorPrimary\">@color/colorPrimary</item>\n    </style>\n</resources>" > app/src/main/res/values/styles.xml

          # 3. پراجیکٹ فائلز اور کیمرہ امپورٹس کا تحفظ
          if [ -n "${{ github.event.client_payload.zip_data }}" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            unzip -o project.zip -d temp_dir/
            
            [ -d "temp_dir/src/main/res" ] && cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
            
            PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
            mkdir -p "app/src/main/java/$PKG_PATH"
            
            # تمام جاوا فائلز کو منتقل کرنا
            find temp_dir -name "*.java" -exec cp {} "app/src/main/java/$PKG_PATH/" \;
            
            # ہر جاوا فائل کو درست کرنے کا محفوظ طریقہ (Safe Fix)
            find "app/src/main/java/$PKG_PATH/" -name "*.java" -type f | while read -r file; do
              # صرف پہلی لائن پر پیکیج تبدیل کریں
              sed -i "1s/^package .*;/package $PKG_NAME;/" "$file"
              # صرف پرانے R امپورٹ کو ڈیلیٹ کریں (باقی امپورٹس محفوظ رہیں گے)
              sed -i "/import .*\.R;/d" "$file"
              # نیا R امپورٹ پیکیج لائن کے بعد جوڑیں
              sed -i "/package $PKG_NAME;/a import $PKG_NAME.R;" "$file"
              # R کالز کو گلوبل فکس کریں
              sed -i "s/\bR\.id\./$PKG_NAME.R.id./g" "$file"
              sed -i "s/\bR\.layout\./$PKG_NAME.R.layout./g" "$file"
              sed -i "s/\bR\.style\./$PKG_NAME.R.style./g" "$file"
            done
          fi

          # 4. درست مینی فیسٹ فائل (Launcher Fix)
          printf "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" package=\"$PKG_NAME\">\n    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <application android:label=\"System Pro\" android:icon=\"@android:drawable/ic_menu_camera\" android:theme=\"@style/Theme.SystemPro\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>" > app/src/main/AndroidManifest.xml

          # 5. گریڈل سیٹنگز (کیمرہ لائبریریز کے ساتھ)
          printf "plugins { id 'com.android.application' }\nandroid {\n    namespace '$PKG_NAME'\n    compileSdk 34\n    defaultConfig {\n        applicationId '$PKG_NAME'\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        multiDexEnabled true\n    }\n}\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'com.google.android.material:material:1.11.0'\n    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'\n    def camerax_version = '1.3.0'\n    implementation \"androidx.camera:camera-core:\${camerax_version}\"\n    implementation \"androidx.camera:camera-camera2:\${camerax_version}\"\n    implementation \"androidx.camera:camera-lifecycle:\${camerax_version}\"\n    implementation \"androidx.camera:camera-view:\${camerax_version}\"\n    implementation 'com.google.guava:guava:31.1-android'\n}" > app/build.gradle
          
          echo "include ':app'" > settings.gradle
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Strong-V11
          path: app/build/outputs/apk/debug/*.apk
