name: Build System Pro (Auto Name & Multi-Format)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ایپ کا نام (مثلاً: My New App)'
        required: true
        default: 'System Pro'
      package_name:
        description: 'پیکیج آئی ڈی (مثلاً: com.faisal.myapp)'
        required: true
        default: 'com.systempro.app'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Cordova project with Auto-Inputs
        run: |
          # ان پٹ سے نام اور پیکیج لے کر پروجیکٹ بنانا
          cordova create app "${{ github.event.inputs.package_name }}" "${{ github.event.inputs.app_name }}"
          cd app
          cordova platform add android
          
          # Config.xml میں خودکار طور پر نام اور آئی ڈی اپ ڈیٹ کرنا
          sed -i "s/id=\"[^\"]*\"/id=\"${{ github.event.inputs.package_name }}\"/" config.xml
          sed -i "s|<name>.*</name>|<name>${{ github.event.inputs.app_name }}</name>|" config.xml

      - name: Prepare web content from Workflows
        run: |
          TARGET_DIR="app/www"
          rm -rf "$TARGET_DIR"/*
          
          # چیک کریں کہ کیا Index.html ورک فلو فولڈر میں ہے
          if [ -f ".github/workflows/Index.html" ]; then
            echo "Index.html found. Copying..."
            cp ".github/workflows/Index.html" "$TARGET_DIR/index.html"
            # دیگر ویب فائلیں (CSS/JS) اگر ہوں تو وہ بھی کاپی کریں
            cp .github/workflows/*.css "$TARGET_DIR/" 2>/dev/null || true
            cp .github/workflows/*.js "$TARGET_DIR/" 2>/dev/null || true
          else
            echo "Error: .github/workflows/Index.html not found!"
            exit 1
          fi

      - name: Configure AndroidManifest (Cleartext Traffic)
        run: |
          cd app/platforms/android/app/src/main
          sed -i '/<application / s|>| android:usesCleartextTraffic="true">|' AndroidManifest.xml

      - name: Build AAB and APK
        run: |
          cd app
          # پلے اسٹور کے لیے بنڈل بنانا
          cordova build android --release -- --packageType=bundle
          # موبائل انسٹالیشن کے لیے APK بنانا
          cordova build android --release -- --packageType=apk

      - name: Sign and Finalize
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            
            # Sign AAB
            jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
              -keystore keystore.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
              app/platforms/android/app/build/outputs/bundle/release/app-release.aab \
              "${{ secrets.KEY_ALIAS }}"
            
            # Sign APK
            jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
              -keystore keystore.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
              app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk \
              "${{ secrets.KEY_ALIAS }}"
              
            mv app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk app-release-signed.apk
          else
            echo "Secrets not found. Using Unsigned APK for testing."
            mv app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk app-testing.apk
          fi

      - name: Upload Final Files
        uses: actions/upload-artifact@v4
        with:
          name: "${{ github.event.inputs.app_name }}-Builds"
          path: |
            app/platforms/android/app/build/outputs/bundle/release/app-release.aab
            app-release-signed.apk
            app-testing.apk
