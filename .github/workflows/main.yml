name: Build APK from HTML

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'MyApp'
      permissions:
        description: 'Permissions (comma separated)'
        required: false
      app_icon:
        description: 'Icon base64 (optional)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Get app details from payload
        id: details
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            APP_NAME="${{ github.event.inputs.app_name }}"
            PERMISSIONS="${{ github.event.inputs.permissions }}"
            ICON_BASE64="${{ github.event.inputs.app_icon }}"
          else
            APP_NAME="${{ github.event.client_payload.app_name }}"
            PERMISSIONS="${{ github.event.client_payload.permissions }}"
            ICON_BASE64="${{ github.event.client_payload.app_icon }}"
          fi
          echo "app_name=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "permissions=${PERMISSIONS}" >> $GITHUB_OUTPUT
          echo "icon_base64=${ICON_BASE64}" >> $GITHUB_OUTPUT

      - name: Prepare HTML file (from repo)
        run: |
          if [ ! -f "index.html" ]; then
            echo "Error: index.html not found in repository root!"
            exit 1
          fi
          # Minify only whitespace, not scripts
          # We'll just copy as is (but trim)
          cp index.html index.html.original
          # Remove trailing spaces and blank lines
          sed -i 's/[ \t]*$//' index.html
          echo "HTML file prepared."

      - name: Decode and save icon
        run: |
          ICON_BASE64="${{ steps.details.outputs.icon_base64 }}"
          if [ -n "$ICON_BASE64" ]; then
            echo "$ICON_BASE64" | base64 -d > icon.png
            echo "Icon saved as icon.png"
          else
            echo "No icon provided, will use default."
          fi

      - name: Create Cordova project with custom config
        run: |
          npm install -g cordova
          cordova create myapp com.example.${{ steps.details.outputs.app_name }} "${{ steps.details.outputs.app_name }}"
          cd myapp
          # Remove default www and copy our HTML
          rm -rf www
          cp -r ../ .??* !(.git) www/ 2>/dev/null || true
          # Copy index.html explicitly
          cp ../index.html www/index.html
          
          # Add Android platform
          cordova platform add android
          
          # ===== CONFIGURE CONFIG.XML =====
          # Add permissions
          PERMS="${{ steps.details.outputs.permissions }}"
          IFS=',' read -ra PERM_ARRAY <<< "$PERMS"
          for perm in "${PERM_ARRAY[@]}"; do
            if [ -n "$perm" ]; then
              cordova plugin add cordova-plugin-android-permissions 2>/dev/null || true
              # Add to config.xml
              sed -i "/<platform name=\"android\">/a \        <config-file target=\"AndroidManifest.xml\" parent=\"/manifest\">\n            <uses-permission android:name=\"$perm\" />\n        </config-file>" config.xml
            fi
          done
          
          # Add internet access and navigation allowances
          sed -i "/<platform name=\"android\">/a \        <access origin=\"*\" />\n        <allow-navigation href=\"*\" />\n        <allow-intent href=\"http://*/*\" />\n        <allow-intent href=\"https://*/*\" />" config.xml
          
          # Set custom icon if provided
          if [ -f "../icon.png" ]; then
            # Create res folder and copy icon to all densities
            mkdir -p res
            cp ../icon.png res/icon.png
            # Add icon to config.xml (platform android)
            sed -i "/<platform name=\"android\">/a \        <icon src=\"res/icon.png\" />" config.xml
            echo "Custom icon configured."
          fi
          
          # Ensure WebView settings: allow file access, etc.
          cat >> config.xml <<EOF
          <preference name="AndroidInsecureFileModeEnabled" value="true" />
          <preference name="AllowFileAccessFromFileURLs" value="true" />
          <preference name="AllowUniversalAccessFromFileURLs" value="true" />
          <preference name="loadUrlTimeoutValue" value="700000" />
          EOF
          
          # Build debug APK (signed with debug key)
          cordova build android
          
          # Locate the debug APK
          APK_PATH=$(find platforms/android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No debug APK found."
            exit 1
          fi
          cp "$APK_PATH" ../app.apk
          cd ..
          
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.details.outputs.app_name }}
          path: app.apk

      - name: Create Release
        if: github.event_name == 'repository_dispatch'
        run: |
          RUN_ID=${{ github.run_id }}
          gh release create "run-${RUN_ID}" app.apk --title "APK Build ${{ steps.details.outputs.app_name }}" --notes "Generated from workflow run ${{ github.run_id }}" --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
