name: System Pro Auto Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # کیشے کو ابھی کے لیے ہٹا دیں تاکہ پرانی فائلز کا مسئلہ نہ ہو
          # cache: 'gradle' 

      - name: Process Zip Data
        run: |
          # فولڈرز بنائیں اگر موجود نہ ہوں
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res
          
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            # زپ ڈیٹا کو ڈی کوڈ کرنا
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            mkdir -p temp_dir
            unzip -o project.zip -d temp_dir/
            
            # فائلوں کو ڈیلیٹ کرنے کے بجائے اوور رائٹ کرنا
            if [ -d "temp_dir/src/main/java" ]; then
              cp -rf temp_dir/src/main/java/* app/src/main/java/ || true
              cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
            else
              # اگر سورس ڈائریکٹری براہ راست ہے
              cp -rf temp_dir/* app/src/main/ || true
            fi
            # عارضی فولڈر صاف کریں
            rm -rf temp_dir project.zip
          fi

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        # یہاں '--no-daemon' شامل کریں تاکہ میموری اور فائل لاکنگ کا مسئلہ نہ ہو
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Release
          path: app/build/outputs/apk/debug/*.apk
