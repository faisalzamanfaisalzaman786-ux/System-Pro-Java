name: System Pro Build System

on:
  repository_dispatch:
    types: [build_app]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clean & Generate Structure
        run: |
          # پرانے فولڈرز کو صاف کر کے نئے سرے سے بنانا تاکہ 'File exists' ایرر نہ آئے
          rm -rf app/src/main/res/mipmap-xxxhdpi
          rm -rf app/src/main/assets/www
          
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/assets/www

      - name: Inject User Data (Image & HTML)
        run: |
          # آپ کی ایپ سے آنے والی فائلز کو ان کی صحیح جگہ پر موو کرنا
          # اگر فائل موجود ہو تو ہی موو کرے گا تاکہ ایرر نہ آئے
          [ -f "ic_launcher.png" ] && mv ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || echo "Icon not found"
          [ -f "index.html" ] && mv index.html app/src/main/assets/www/index.html || echo "HTML not found"

      - name: Prepare Gradle & Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name || 'System-Pro-App' }}
          path: app/build/outputs/apk/debug/*.apk
