name: Dynamic APK Builder from ZipForge Pro

on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Decode and Extract ZIP
        run: |
          if [ -z "${{ github.event.client_payload.zip_data }}" ]; then
            echo "No zip_data" && exit 1
          fi
          mkdir -p android_project
          cd android_project
          echo "${{ github.event.client_payload.zip_data }}" | tr -d '\n\r' | base64 -d > project.zip
          unzip -o project.zip
          rm project.zip

      - name: Build Project (AppCompat only, no Material)
        working-directory: ./android_project
        run: |
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          if [ -z "$PACKAGE_NAME" ]; then
            PACKAGE_NAME="com.example.app"
          fi

          # Remove any existing resources that might cause conflicts
          rm -rf app/src/main/res/values/themes.xml app/src/main/res/values/colors.xml

          # Ensure minimal theme and colors
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources>
              <color name="purple_500">#FF6200EE</color>
          </resources>
          EOF
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.ZipForge" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/purple_500</item>
              </style>
          </resources>
          EOF

          # Generate fresh Gradle files (no Material)
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          echo 'include ":app"' > settings.gradle
          cat > app/build.gradle << EOF
          plugins { id 'com.android.application' }
          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34
              defaultConfig {
                  applicationId '$PACKAGE_NAME'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          echo 'org.gradle.jvmargs=-Xmx2048m' > gradle.properties
          echo 'android.useAndroidX=true' >> gradle.properties

          # Setup wrapper
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_project/app/build/outputs/apk/debug/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          files: android_project/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
