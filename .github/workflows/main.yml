name: System Pro Titan Master Build
on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  GRADLE_VERSION: 8.5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Centralized Engine - Payload Processing
        run: |
          REQ_PKG="${{ github.event.client_payload.package_name }}"
          REQ_NAME="${{ github.event.client_payload.app_name }}"
          ZIP_DATA="${{ github.event.client_payload.zip_data }}"
          
          if [ -z "$REQ_PKG" ]; then REQ_PKG="com.zipforge.pro"; fi
          if [ -z "$REQ_NAME" ]; then REQ_NAME="System Pro"; fi
          
          echo "FINAL_PKG=$REQ_PKG" >> $GITHUB_ENV
          echo "FINAL_NAME=$REQ_NAME" >> $GITHUB_ENV
          
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/layout/*
          rm -rf app/src/main/res/mipmap-*
          rm -rf temp_files project.zip
          
          if [ ! -z "$ZIP_DATA" ]; then
            echo "$ZIP_DATA" | tr -d '\n\r ' | base64 -d > project.zip
            unzip -o project.zip -d temp_files || true
            
            TARGET_JAVA=$(find temp_files -name "MainActivity.java" | head -n 1)
            if [ ! -z "$TARGET_JAVA" ]; then
              sed -i "s|package [^;]*;|package $REQ_PKG;|g" "$TARGET_JAVA"
              sed -i 's|editJava.setText(prefs.getString("java_code", "package .*||g' "$TARGET_JAVA"
              
              PKG_PATH=$(echo $REQ_PKG | tr '.' '/')
              mkdir -p app/src/main/java/$PKG_PATH
              cp -f "$TARGET_JAVA" app/src/main/java/$PKG_PATH/MainActivity.java
            fi
            
            mkdir -p app/src/main/res/layout
            TARGET_XML=$(find temp_files -name "activity_main.xml" | head -n 1)
            if [ ! -z "$TARGET_XML" ]; then
              cp -f "$TARGET_XML" app/src/main/res/layout/activity_main.xml
            fi
            
            mkdir -p app/src/main/res/mipmap-hdpi
            if [ -f temp_files/ic_launcher.png ]; then
              cp -f temp_files/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            elif [ -f temp_files/icon.png ]; then
              cp -f temp_files/icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            fi
          fi

      - name: Injection Dynamic Manifest
        run: |
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
              
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="${{ env.FINAL_NAME }}"
                  android:theme="@style/Theme.SystemPro">
                  <activity android:name="${{ env.FINAL_PKG }}.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Injection Dynamic Configuration
        run: |
          sed -i "s|namespace '.*'|namespace '${{ env.FINAL_PKG }}'|g" app/build.gradle
          sed -i "s|applicationId '.*'|applicationId '${{ env.FINAL_PKG }}'|g" app/build.gradle
          
          echo "-keep public class ${{ env.FINAL_PKG }}.** { *; }" >> app/proguard-rules.pro

      - name: Execute Assembly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip
          unzip -q gradle-${{ env.GRADLE_VERSION }}-bin.zip
          ./gradle-${{ env.GRADLE_VERSION }}/bin/gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Deliver Final APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final
          path: app/build/outputs/apk/debug/*.apk
