name: System Pro Titan Master Build
on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  GRADLE_VERSION: 8.5
  AGP_VERSION: 8.1.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dynamic Package & Force Resource Fix
        run: |
          ZIP_DATA="${{ github.event.client_payload.zip_data }}"
          if [ ! -z "$ZIP_DATA" ]; then
            echo "$ZIP_DATA" | tr -d '\n\r ' | base64 -d > project.zip
            unzip -o project.zip -d temp_files || true
            
            RAW_PKG=$(grep "package " temp_files/MainActivity.java | head -n 1 | cut -d' ' -f2 | tr -d ';')
            if [ -z "$RAW_PKG" ]; then RAW_PKG="com.system.pro"; fi
            echo "FINAL_PKG=$RAW_PKG" >> $GITHUB_ENV
            
            PKG_PATH=$(echo $RAW_PKG | tr '.' '/')
            mkdir -p app/src/main/java/$PKG_PATH
            mkdir -p app/src/main/res/layout
            mkdir -p app/src/main/res/values
            mkdir -p app/src/main/res/drawable
            mkdir -p app/src/main/res/mipmap-hdpi
            
            cp -f temp_files/MainActivity.java app/src/main/java/$PKG_PATH/ || true
            cp -f temp_files/activity_main.xml app/src/main/res/layout/ || true
            
            # ایرر ختم کرنے کے لیے مصنوعی ریسورسز بنائیں
            echo '<resources><style name="ShapeAppearance"/></resources>' > app/src/main/res/values/fix_resources.xml
            echo '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#2c3d62"/></shape>' > app/src/main/res/drawable/edittext_background.xml
            echo '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#2c3d62"/></shape>' > app/src/main/res/drawable/spinner_background.xml
          fi

      - name: Master Theme Injection
        run: |
          cat <<EOF > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.SystemPro" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#00FFCC</item>
                  <item name="android:statusBarColor">#02040c</item>
              </style>
          </resources>
          EOF

      - name: Build Engine (The Final Lock)
        run: |
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:${{ env.AGP_VERSION }}' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          echo 'include ":app"' > settings.gradle
          
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace '${{ env.FINAL_PKG }}'
              compileSdk 34
              defaultConfig {
                  applicationId "${{ env.FINAL_PKG }}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug {
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF
          touch app/proguard-rules.pro

      - name: Run Final Assembly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip
          unzip -q gradle-${{ env.GRADLE_VERSION }}-bin.zip
          ./gradle-${{ env.GRADLE_VERSION }}/bin/gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Deliver Fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Fixed-Build
          path: app/build/outputs/apk/debug/*.apk
