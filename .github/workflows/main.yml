name: Organized Android Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Project Directory Structure
        run: |
          # تمام ضروری فولڈرز ایک ساتھ بنانا
          mkdir -p android_project/app/src/main/java/com/systempro/app
          mkdir -p android_project/app/src/main/assets
          mkdir -p android_project/app/src/main/res/layout
          mkdir -p android_project/app/src/main/res/values

      - name: Generate Source Files in Folders
        run: |
          # HTML فائل
          echo "<html><body style='background:#000;color:#0f0;text-align:center;padding-top:50px;font-family:sans-serif;'><h1>SYSTEM PRO V2</h1><p>Folder Structure: Active</p></body></html>" > android_project/app/src/main/assets/index.html

          # Android Manifest
          cat <<EOF > android_project/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.systempro.app">
              <application android:label="System Pro" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Java Activity
          cat <<EOF > android_project/app/src/main/java/com/systempro/app/MainActivity.java
          package com.systempro.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          # Resources
          echo '<resources><string name="app_name">System Pro</string></resources>' > android_project/app/src/main/res/values/strings.xml

      - name: Create Build Configuration Files
        run: |
          cd android_project
          echo "include ':app'" > settings.gradle
          
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.systempro.app'
              compileSdk 33
              defaultConfig {
                  applicationId "com.systempro.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build APK from Folder
        run: |
          cd android_project
          gradle :app:assembleDebug

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Folder-Build
          path: android_project/app/build/outputs/apk/debug/*.apk
