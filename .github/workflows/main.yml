name: System Pro Master APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ایپ کا نام'
        required: true
      pkg_name:
        description: 'پیکج نیم'
        required: true
      java_code:
        description: 'MainActivity.java کا کوڈ'
        required: true
      xml_code:
        description: 'activity_main.xml کا کوڈ'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout
      uses: actions/checkout@v4

    - name: 2. Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. Create Clean Structure
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const pkg = "${{ github.event.inputs.pkg_name }}";
          const pkgPath = pkg.replace(/\./g, '/');
          
          // پرانی فائلز ہٹانا اور نئے فولڈرز بنانا
          fs.rmSync('app/src/main', { recursive: true, force: true });
          fs.mkdirSync(`app/src/main/java/${pkgPath}`, { recursive: true });
          fs.mkdirSync(`app/src/main/res/layout`, { recursive: true });
          fs.mkdirSync(`app/src/main/res/values`, { recursive: true });
          
          // کوڈ سیو کرنا
          fs.writeFileSync(`app/src/main/java/${pkgPath}/MainActivity.java`, process.env.JAVA_CODE);
          fs.writeFileSync(`app/src/main/res/layout/activity_main.xml`, process.env.XML_CODE);
      env:
        JAVA_CODE: ${{ github.event.inputs.java_code }}
        XML_CODE: ${{ github.event.inputs.xml_code }}

    - name: 4. Fix Gradle & Plugin Repositories
      run: |
        # settings.gradle میں گوگل ریپوزٹری شامل کرنا لازمی ہے
        cat << EOF > settings.gradle
        pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "SystemPro"
        include ':app'
        EOF

        # Root build.gradle (پلگ ان ورژن کے ساتھ)
        cat << EOF > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'com.android.library' version '8.2.2' apply false
        }
        EOF

        # App build.gradle (پلگ ان اپلائی کرنا)
        cat << EOF > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace '${{ github.event.inputs.pkg_name }}'
            compileSdk 34
            defaultConfig {
                applicationId '${{ github.event.inputs.pkg_name }}'
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName '1.0'
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

        # Strings & Manifest
        printf '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">%s</string></resources>' "${{ github.event.inputs.app_name }}" > app/src/main/res/values/strings.xml
        cat << EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="@string/app_name" android:allowBackup="true">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: 5. Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: 6. Upload Result
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name }}
        path: app/build/outputs/apk/debug/app-debug.apk
