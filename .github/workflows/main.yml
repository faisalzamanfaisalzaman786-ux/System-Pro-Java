name: "Ultimate APK Builder (All-In-One)"

on:
  repository_dispatch:
    types: [build-app]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      # 1. پراجیکٹ کا ڈھانچہ تیار کرنا
      - name: "Initialize Structure"
        run: |
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

      # 2. ڈائنامک ریسورسز (Theme, Colors, Strings) سیٹ کرنا
      - name: "Update UI & Resources"
        run: |
          # Colors Update
          if [ -n "${{ github.event.client_payload.colors }}" ]; then
            echo "${{ github.event.client_payload.colors }}" > app/src/main/res/values/colors.xml
          fi
          
          # Styles & Themes Update
          if [ -n "${{ github.event.client_payload.styles }}" ]; then
            echo "${{ github.event.client_payload.styles }}" > app/src/main/res/values/styles.xml
          fi

          # Strings Update
          if [ -n "${{ github.event.client_payload.strings }}" ]; then
            echo "${{ github.event.client_payload.strings }}" > app/src/main/res/values/strings.xml
          fi

      # 3. کوڈ اور مینی فیسٹ کی تیاری
      - name: "Inject Code & Manifest"
        id: prep
        run: |
          PKG="${{ github.event.client_payload.package_name || 'com.systempro.app' }}"
          APP_NAME="${{ github.event.client_payload.app_name || 'SystemPro' }}"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"

          echo "${{ github.event.client_payload.java }}" > "app/src/main/java/$PKG_PATH/MainActivity.java"
          echo "${{ github.event.client_payload.xml }}" > app/src/main/res/layout/activity_main.xml
          echo "${{ github.event.client_payload.manifest }}" > app/src/main/AndroidManifest.xml
          
          # تمام جاوا فائلز میں پیکیج کا نام خودکار ٹھیک کریں
          find app/src/main/java -name "*.java" -exec sed -i "s/package .*;/package $PKG;/" {} \;
          
          echo "PKG=$PKG" >> $GITHUB_OUTPUT
          echo "APP_NAME=$APP_NAME" >> $GITHUB_OUTPUT

      # 4. ڈائنامک ڈیپنڈینسیز (Libraries) سیٹ کرنا
      - name: "Configure Build & Dependencies"
        run: |
          # ڈیپنڈینسیز کو پے لوڈ سے حاصل کریں یا ڈیفالٹ استعمال کریں
          DEPS="${{ github.event.client_payload.dependencies }}"
          if [ -z "$DEPS" ]; then
            DEPS="implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'com.google.android.material:material:1.11.0'"
          fi

          cat > app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace '${{ steps.prep.outputs.PKG }}'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ steps.prep.outputs.PKG }}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildFeatures { viewBinding true }
          }
          dependencies {
              $DEPS
          }
          EOF

      # 5. بلڈ پروسیس (Gradle)
      - name: "Setup Java & Build"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Grant Execute Permission"
        run: chmod +x gradlew

      - name: "Build APK"
        run: ./gradlew assembleDebug --stacktrace

      # 6. آرٹفیکٹ اپ لوڈ
      - name: "Upload Result"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.APP_NAME }}
          path: app/build/outputs/apk/debug/*.apk

      # 7. مکمل صفائی (Post-Build Cleanup)
      - name: "Final Cleaning"
        if: always()
        run: |
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/layout/*
          rm -rf app/src/main/res/values/*
          rm -rf app/build/
          rm -rf .gradle/
          echo "All temporary files cleaned."
