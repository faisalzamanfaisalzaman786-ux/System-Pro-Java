name: Build Direct APK (No Gradle)

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Create APK structure
        run: |
          # Create directory structure
          mkdir -p app/AndroidManifest.xml
          mkdir -p app/res/drawable
          mkdir -p app/res/layout
          mkdir -p app/res/values
          mkdir -p app/assets
          mkdir -p app/classes

          # Create AndroidManifest.xml
          cat > app/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.myapp">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/icon"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Create strings.xml
          cat > app/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">MyApp</string>
          </resources>
          EOF

          # Create styles.xml
          cat > app/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          # Create MainActivity.java
          cat > MainActivity.java << 'EOF'
          package com.myapp;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Place HTML content
        run: |
          cat << 'HTML' > app/assets/index.html
          ${{ github.event.client_payload.app_html }}
          HTML

      - name: Update app name and package
        run: |
          APP_NAME='${{ github.event.client_payload.app_name }}'
          # Clean package name
          CLEAN_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g' | cut -c1-30)
          PACKAGE_NAME="com.${CLEAN_NAME}"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          # Update strings.xml
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APP_NAME<\/string>/" app/res/values/strings.xml
          # Update manifest package
          sed -i "s/package=\"com\.myapp\"/package=\"$PACKAGE_NAME\"/" app/AndroidManifest.xml

      - name: Add icon if provided
        run: |
          ICON_BASE64='${{ github.event.client_payload.app_icon }}'
          if [ -n "$ICON_BASE64" ]; then
            echo "$ICON_BASE64" | base64 -d > icon.png
            cp icon.png app/res/drawable/icon.png
          else
            # Create a dummy icon
            convert -size 96x96 xc:gray app/res/drawable/icon.png
          fi

      - name: Add permissions
        run: |
          PERMISSIONS_JSON='${{ toJSON(github.event.client_payload.permissions) }}'
          echo "$PERMISSIONS_JSON" | jq -r '.[]' | while read perm; do
            if [ -n "$perm" ]; then
              sed -i "/<\/manifest>/i <uses-permission android:name=\"$perm\" />" app/AndroidManifest.xml
            fi
          done

      - name: Compile Java and build APK
        run: |
          # Compile Java
          javac -d app/classes -cp "$ANDROID_HOME/platforms/android-34/android.jar" MainActivity.java
          
          # Generate R.java
          mkdir -p app/classes/com/myapp
          $ANDROID_HOME/build-tools/34.0.0/aapt package -f -m -J app/classes -M app/AndroidManifest.xml -S app/res -I $ANDROID_HOME/platforms/android-34/android.jar
          
          # Compile with R.java
          javac -d app/classes -cp "app/classes:$ANDROID_HOME/platforms/android-34/android.jar" app/classes/com/myapp/R.java MainActivity.java
          
          # Create dex file
          $ANDROID_HOME/build-tools/34.0.0/dx --dex --output=app/classes.dex app/classes
          
          # Build APK
          $ANDROID_HOME/build-tools/34.0.0/aapt package -f -M app/AndroidManifest.xml -S app/res -I $ANDROID_HOME/platforms/android-34/android.jar -F app-unsigned.apk app/assets app/classes.dex
          
          # Align APK
          $ANDROID_HOME/build-tools/34.0.0/zipalign -f -p 4 app-unsigned.apk app-aligned.apk
          
          # Generate key
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug, O=Android, C=US" -validity 10000
          
          # Sign APK
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android app-aligned.apk
          
          cp app-aligned.apk MyApp.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: MyApp.apk
