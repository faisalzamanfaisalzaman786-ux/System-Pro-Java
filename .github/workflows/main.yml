name: Build APK from HTML

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'MyApp'
      permissions:
        description: 'Permissions (comma separated)'
        required: false
      app_icon:
        description: 'Icon base64 (optional)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Get app details
        id: details
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            APP_NAME="${{ github.event.inputs.app_name }}"
            PERMISSIONS="${{ github.event.inputs.permissions }}"
            ICON_BASE64="${{ github.event.inputs.app_icon }}"
          else
            APP_NAME="${{ github.event.client_payload.app_name }}"
            PERMISSIONS="${{ github.event.client_payload.permissions }}"
            ICON_BASE64="${{ github.event.client_payload.app_icon }}"
          fi
          # Package name: only lowercase letters, numbers, underscores
          PKG_NAME=$(echo "$APP_NAME" | sed 's/[^a-zA-Z0-9]/_/g' | tr '[:upper:]' '[:lower:]')
          if [ -z "$PKG_NAME" ]; then PKG_NAME="myapp"; fi
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "package_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "permissions=$PERMISSIONS" >> $GITHUB_OUTPUT
          echo "icon_base64=$ICON_BASE64" >> $GITHUB_OUTPUT

      - name: Decode icon if provided
        run: |
          if [ -n "${{ steps.details.outputs.icon_base64 }}" ]; then
            echo "${{ steps.details.outputs.icon_base64 }}" | base64 -d > icon.png
            echo "Icon saved."
          fi

      - name: Prepare HTML with permissive CSP
        run: |
          # Add meta CSP to allow everything (for WebView)
          # Also ensure viewport is set
          cat > index_with_csp.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
            <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src *; img-src * data:; style-src * 'unsafe-inline';">
          </head>
          <body>
          $(cat index.html)
          </body>
          </html>
          EOF
          mv index_with_csp.html index.html

      - name: Build APK with Cordova
        run: |
          set -e
          npm install -g cordova

          APP_NAME="${{ steps.details.outputs.app_name }}"
          PKG_NAME="${{ steps.details.outputs.package_name }}"

          # Create project
          cordova create myapp "com.example.$PKG_NAME" "$APP_NAME"
          cd myapp

          # Copy HTML
          rm -rf www
          mkdir -p www
          cp ../index.html www/index.html

          # Add Android platform
          cordova platform add android

          # ========== Add all necessary preferences to config.xml ==========
          # Insert before </widget>
          sed -i '/<\/widget>/i \
          <access origin="*" />\
          <allow-navigation href="*" />\
          <allow-intent href="http://*/*" />\
          <allow-intent href="https://*/*" />\
          <preference name="AndroidInsecureFileModeEnabled" value="true" />\
          <preference name="AllowFileAccessFromFileURLs" value="true" />\
          <preference name="AllowUniversalAccessFromFileURLs" value="true" />\
          <preference name="loadUrlTimeoutValue" value="700000" />\
          <preference name="JavaScriptEnabled" value="true" />\
          <preference name="MixedContentMode" value="2" />\
          <preference name="OverrideUserAgent" value="Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.120 Mobile Safari/537.36" />\
          <preference name="AllowInlineMediaPlayback" value="true" />' config.xml

          # ========== Add permissions using config-file ==========
          PERMS="${{ steps.details.outputs.permissions }}"
          if [ -n "$PERMS" ]; then
            IFS=',' read -ra PERM_ARRAY <<< "$PERMS"
            for perm in "${PERM_ARRAY[@]}"; do
              if [ -n "$perm" ]; then
                # Insert before </platform> inside platform android
                sed -i "/<\/platform>/i \        <config-file target=\"AndroidManifest.xml\" parent=\"/manifest\">\n            <uses-permission android:name=\"$perm\" />\n        </config-file>" config.xml
              fi
            done
          fi

          # ========== Enable cleartext traffic and add internet permission ==========
          # Add INTERNET permission if not already
          if ! grep -q "android.permission.INTERNET" config.xml; then
            sed -i "/<\/platform>/i \        <config-file target=\"AndroidManifest.xml\" parent=\"/manifest\">\n            <uses-permission android:name=\"android.permission.INTERNET\" />\n        </config-file>" config.xml
          fi
          # Add android:usesCleartextTraffic="true" to application tag
          sed -i "/<\/platform>/i \        <config-file target=\"AndroidManifest.xml\" parent=\"/manifest/application\">\n            <android:usesCleartextTraffic=\"true\" />\n        </config-file>" config.xml

          # ========== Set icon if provided ==========
          if [ -f "../icon.png" ]; then
            # Copy icon to all mipmap folders
            TARGET_DIR="platforms/android/app/src/main/res"
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "$TARGET_DIR/mipmap-$density"
              cp ../icon.png "$TARGET_DIR/mipmap-$density/ic_launcher.png"
              cp ../icon.png "$TARGET_DIR/mipmap-$density/ic_launcher_round.png"
            done
            # Add icon reference in config.xml inside platform android
            sed -i "/<platform name=\"android\">/a \        <icon src=\"res/icon.png\" />" config.xml
          fi

          # Build debug APK
          cordova build android

          # Locate APK
          APK_PATH=$(find platforms/android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found"
            exit 1
          fi
          cp "$APK_PATH" ../app.apk
          cd ..

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.details.outputs.package_name }}
          path: app.apk

      - name: Create Release
        if: github.event_name == 'repository_dispatch'
        run: |
          RUN_ID=${{ github.run_id }}
          gh release create "run-${RUN_ID}" app.apk --title "APK Build ${{ steps.details.outputs.app_name }}" --notes "Generated from workflow run ${{ github.run_id }}" --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
