name: System Pro Build Engine

on:
  repository_dispatch:
    types: [build-from-b64]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Decode Base64 Payload
        run: |
          echo "Decoding ZIP data from client payload..."
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project_data.zip
          unzip -o project_data.zip -d app/src/main/

      - name: Inject Custom Resources
        run: |
          # پیکیج نیم اور ایپ کا نام اپ ڈیٹ کرنا
          sed -i "s/com.system.pro/${{ github.event.client_payload.package_name }}/g" app/build.gradle
          sed -i "s/System Pro/${{ github.event.client_payload.app_name }}/g" app/src/main/res/values/strings.xml
          
          # اگر آئیکون موجود ہے تو اسے ریپلیس کریں
          if [ -f "app/src/main/ic_launcher.png" ]; then
            mkdir -p app/src/main/res/mipmap-xxxhdpi/
            mv app/src/main/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Generate Release Tag
        id: tag
        run: echo "tag_name=build_$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT

      - name: Upload APK to Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
