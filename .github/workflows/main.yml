name: Build APK from HTML

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'MyApp'
      permissions:
        description: 'Permissions (comma separated)'
        required: false
      app_icon:
        description: 'Icon base64 (optional)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl

      - name: Setup Node.js (for building)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Get app details from payload (or workflow inputs)
        id: details
        run: |
          # Use inputs if workflow_dispatch, else use client_payload
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            APP_NAME="${{ github.event.inputs.app_name }}"
            PERMISSIONS="${{ github.event.inputs.permissions }}"
            ICON_BASE64="${{ github.event.inputs.app_icon }}"
          else
            APP_NAME="${{ github.event.client_payload.app_name }}"
            PERMISSIONS="${{ github.event.client_payload.permissions }}"
            ICON_BASE64="${{ github.event.client_payload.app_icon }}"
          fi
          echo "app_name=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "permissions=${PERMISSIONS}" >> $GITHUB_OUTPUT
          echo "icon_base64=${ICON_BASE64}" >> $GITHUB_OUTPUT

      - name: Prepare HTML file (from repo)
        run: |
          # HTML file is already in repo as index.html
          # Ensure it exists
          if [ ! -f "index.html" ]; then
            echo "Error: index.html not found in repository root!"
            exit 1
          fi
          # Create a working directory
          mkdir -p app
          cp index.html app/index.html
          echo "HTML file copied from repository."

      - name: Decode and save icon (if provided)
        run: |
          ICON_BASE64="${{ steps.details.outputs.icon_base64 }}"
          if [ -n "$ICON_BASE64" ]; then
            echo "$ICON_BASE64" | base64 -d > app/icon.png
            echo "Icon saved."
          else
            echo "No icon provided, using default."
          fi

      - name: Create AndroidManifest.xml with permissions
        run: |
          PERMISSIONS="${{ steps.details.outputs.permissions }}"
          cat > app/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.${{ steps.details.outputs.app_name }}">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="${{ steps.details.outputs.app_name }}"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity"
                      android:configChanges="orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          EOF
          # Add permissions
          IFS=',' read -ra PERM_ARRAY <<< "$PERMISSIONS"
          for perm in "${PERM_ARRAY[@]}"; do
            if [ -n "$perm" ]; then
              sed -i "/<\/application>/i \    <uses-permission android:name=\"$perm\" />" app/AndroidManifest.xml
            fi
          done
          echo "AndroidManifest.xml created with permissions."

      - name: Install Cordova and build APK/AAB
        run: |
          npm install -g cordova
          cordova create myapp com.example.${{ steps.details.outputs.app_name }} "${{ steps.details.outputs.app_name }}"
          cd myapp
          # Replace www with our app folder
          rm -rf www
          cp -r ../app www
          # Add Android platform
          cordova platform add android
          # Build release (will generate AAB)
          cordova build android --release
          cd ..

      - name: Convert AAB to APK using bundletool
        run: |
          # Download bundletool
          wget -q https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar -O bundletool.jar
          # Locate AAB file
          AAB_PATH=$(find . -name "*.aab" | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            echo "Error: No AAB file found."
            exit 1
          fi
          echo "Found AAB: $AAB_PATH"
          # Generate universal APK from AAB
          java -jar bundletool.jar build-apks --bundle="$AAB_PATH" --output=output.apks --mode=universal
          # Extract the universal APK
          unzip -p output.apks universal.apk > app.apk
          echo "APK generated successfully."

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.details.outputs.app_name }}
          path: app.apk

      - name: Create Release (optional)
        if: github.event_name == 'repository_dispatch'
        run: |
          # Create a tag and release for the APK
          RUN_ID=${{ github.run_id }}
          gh release create "run-${RUN_ID}" app.apk --title "APK Build ${{ steps.details.outputs.app_name }}" --notes "Generated from workflow run ${{ github.run_id }}" --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
