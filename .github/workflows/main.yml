name: System Pro APK Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # یہ بڑے پراجیکٹس کی رفتار بڑھاتا ہے

      - name: Initialize Project Structure
        run: |
          mkdir -p app/src/main/java/com/system/pro
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/libs
          # ضروری فائلیں بنانا اگر موجود نہ ہوں
          touch app/src/main/java/com/system/pro/MainActivity.java
          touch app/src/main/res/layout/activity_main.xml

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || echo "No gradlew found yet"

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace --info
        # '--stacktrace' بڑے ایررز کو پکڑنے کے لیے ضروری ہے

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
