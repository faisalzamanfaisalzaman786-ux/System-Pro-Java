name: System Pro Build Engine

on:
  repository_dispatch:
    types: [build-from-b64]

jobs:
  clean-wash-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Initialize Android Project Structure
        run: |
          # بنیادی فولڈرز بنانا
          mkdir -p app/src/main/java/com/system/pro
          mkdir -p app/src/main/res/layout
          mkdir -p gradle/wrapper

          # گریڈل کی ضروری فائلیں خودکار طور پر تیار کرنا
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.2.2" }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat <<EOF > settings.gradle
          include ':app'
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.system.pro'
              compileSdk 34
              defaultConfig {
                  applicationId "${{ github.event.client_payload.package_name }}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

      - name: Decode and Inject Source
        run: |
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > source.zip
          unzip -o source.zip -d temp_src/
          
          # فائلیں ان کی صحیح جگہ منتقل کرنا
          cp temp_src/MainActivity.java app/src/main/java/com/system/pro/ 2>/dev/null || true
          cp temp_src/activity_main.xml app/src/main/res/layout/ 2>/dev/null || true
          cp temp_src/AndroidManifest.xml app/src/main/ 2>/dev/null || true
          
          rm -rf temp_src source.zip

      - name: Setup Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v${{ github.run_number }}"
          name: "System Pro Build #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
