name: System Pro Build Engine

on:
  repository_dispatch:
    types: [build-from-b64]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Project Structure
        run: |
          mkdir -p app/src/main/java/com/system/pro
          mkdir -p app/src/main/res/layout
          
          printf "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }\nallprojects { repositories { google(); mavenCentral() } }" > build.gradle
          printf "include ':app'" > settings.gradle
          printf "plugins { id 'com.android.application' }\nandroid { namespace 'com.system.pro'; compileSdk 34; defaultConfig { applicationId '${{ github.event.client_payload.package_name }}'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' } }\ndependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.9.0' }" > app/build.gradle

      - name: Sanitized Injection Process
        run: |
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > source.zip
          unzip -o source.zip -d temp_src/
          
          # نمبر 1: تمام جاوا فائلز کا پیکج نیم ایک ہی جگہ پر سیٹ کریں
          find temp_src/ -name "*.java" -exec sed -i '1s/^/package com.system.pro;\n/' {} +
          find temp_src/ -name "*.java" -exec sed -i '/^package /!b;n; s/^package .*;$//' {} +
          
          # نمبر 2: اب فکس شدہ فائلز کو ان کے صحیح مقام پر کاپی کریں
          cp temp_src/*.java app/src/main/java/com/system/pro/ || true
          cp temp_src/*.xml app/src/main/res/layout/ || true
          
          # نمبر 3: مینی فیسٹ کو خودکار جنریٹ کریں
          printf "<?xml version='1.0' encoding='utf-8'?>\n<manifest xmlns:android='http://schemas.android.com/apk/res/android'>\n    <application android:allowBackup='true' android:label='System Pro' android:theme='@style/Theme.AppCompat.Light.NoActionBar'>\n        <activity android:name='.MainActivity' android:exported='true'>\n            <intent-filter>\n                <action android:name='android.intent.action.MAIN' />\n                <category android:name='android.intent.category.LAUNCHER' />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>" > app/src/main/AndroidManifest.xml
          
          rm -rf temp_src source.zip

      - name: Build and Release
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v${{ github.run_number }}"
          name: "System Pro Build #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
