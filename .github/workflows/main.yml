name: System Pro Master APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ایپ کا نام (مثلاً My System Pro)'
        required: true
        default: 'System Pro App'
      pkg_name:
        description: 'پیکج نیم (مثلاً com.systempro.apk)'
        required: true
        default: 'com.systempro.apk'
      java_code:
        description: 'MainActivity.java کا مکمل کوڈ'
        required: true
      xml_code:
        description: 'activity_main.xml کا مکمل کوڈ'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout Physical Structure
      uses: actions/checkout@v4

    - name: 2. Setup Java Environment
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 3. Dynamic Path Alignment
      run: |
        # آپ کے فزیکل اسٹرکچر کے مطابق فولڈر ایڈجسٹمنٹ
        PKG_PATH=$(echo "${{ github.event.inputs.pkg_name }}" | tr '.' '/')
        rm -rf app/src/main/java/* # پرانے ٹیسٹ فولڈرز کی صفائی
        mkdir -p app/src/main/java/$PKG_PATH
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

    - name: 4. Secure Code Injection
      run: |
        PKG_PATH=$(echo "${{ github.event.inputs.pkg_name }}" | tr '.' '/')
        
        # آپ کے فراہم کردہ کوڈ کو فزیکل فائلوں میں لکھنا
        cat << 'EOF' > app/src/main/java/$PKG_PATH/MainActivity.java
        ${{ github.event.inputs.java_code }}
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        ${{ github.event.inputs.xml_code }}
        EOF

    - name: 5. Force Update Manifest & Resources
      run: |
        # ایپ کا نام اور تھیم سیٹ کرنا
        printf '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">%s</string></resources>' "${{ github.event.inputs.app_name }}" > app/src/main/res/values/strings.xml
        echo '<?xml version="1.0" encoding="utf-8"?><resources><style name="Theme.SystemPro" parent="Theme.MaterialComponents.DayNight.NoActionBar"></style></resources>' > app/src/main/res/values/themes.xml

        # مینی فیسٹ فائل کو پیکج نیم کے مطابق اپڈیٹ کرنا
        cat << EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="@string/app_name" android:theme="@style/Theme.SystemPro" android:allowBackup="true">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: 6. Intelligent Build Script Update
      run: |
        # build.gradle کو موجودہ انجن کے مطابق سیٹ کرنا
        cat << EOF > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace '${{ github.event.inputs.pkg_name }}'
            compileSdk 34
            defaultConfig {
                applicationId '${{ github.event.inputs.pkg_name }}'
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName '1.0'
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

    - name: 7. Execute Build using Physical Wrapper
      run: |
        # آپ کی ریپوزٹری میں موجود gradlew کا استعمال
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --parallel --stacktrace

    - name: 8. Upload System Pro APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name }}
        path: app/build/outputs/apk/debug/app-debug.apk
