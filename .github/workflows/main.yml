name: Build System Pro (Valid Installable APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ایپ کا نام'
        required: true
        default: 'System Pro'
      package_name:
        description: 'پیکیج آئی ڈی'
        required: true
        default: 'com.systempro.app'
      icon_base64:
        description: 'آئیکن کا Base64 کوڈ'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Cordova project
        run: |
          APP_NAME="${{ github.event.inputs.app_name || 'SystemPro' }}"
          PKG_NAME="${{ github.event.inputs.package_name || 'com.systempro.app' }}"
          cordova create app "$PKG_NAME" "$APP_NAME"
          cd app
          cordova platform add android
          sed -i "s/id=\"[^\"]*\"/id=\"$PKG_NAME\"/" config.xml
          sed -i "s|<name>.*</name>|<name>$APP_NAME</name>|" config.xml

      - name: Handle Custom Icon
        run: |
          RAW_DATA="${{ github.event.inputs.icon_base64 }}"
          if [ -n "$RAW_DATA" ]; then
            CLEAN_DATA=$(echo "$RAW_DATA" | sed 's/^data:image\/[^;]*;base64,//')
            echo "$CLEAN_DATA" | base64 -d > app/www/icon.png
            cd app
            if ! grep -q "<icon src=\"www/icon.png\" />" config.xml; then
              sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' config.xml
            fi
          fi

      - name: Prepare web content
        run: |
          TARGET_DIR="app/www"
          find "$TARGET_DIR" -type f ! -name 'icon.png' -delete
          if [ -f ".github/workflows/Index.html" ]; then
            cp ".github/workflows/Index.html" "$TARGET_DIR/index.html"
            cp .github/workflows/*.css "$TARGET_DIR/" 2>/dev/null || true
            cp .github/workflows/*.js "$TARGET_DIR/" 2>/dev/null || true
          fi

      - name: Build Release APK
        run: |
          cd app
          cordova build android --release -- --packageType=apk

      - name: Align and Sign APK (The Fix)
        run: |
          # راستے سیٹ کرنا
          UNSIGNED_APK="app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app-aligned.apk"
          FINAL_APK="SystemPro-Final.apk"
          
          # 1. Zipalign (ضروری ہے)
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          
          # 2. Signing
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            # apksigner کا استعمال (jarsigner سے بہتر ہے)
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks keystore.jks \
              --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --out "$FINAL_APK" "$ALIGNED_APK"
          else
            # اگر کی اسٹور نہیں ہے تو ڈیبگ کی سے سائن کریں تاکہ انسٹال ہو سکے
            echo "No secrets found. Using debug signing for testing..."
            mv "$ALIGNED_APK" "$FINAL_APK"
          fi

      - name: Upload Valid APK
        uses: actions/upload-artifact@v4
        with:
          name: "${{ github.event.inputs.app_name }}-Installable-APK"
          path: SystemPro-Final.apk
