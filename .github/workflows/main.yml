name: System Pro Build Engine

on:
  repository_dispatch:
    types: [build-from-b64, build-from-zip]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Gradle 8.5
        run: |
          mkdir -p gradle/wrapper
          cat <<EOF > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Decode and Unzip Project
        run: |
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project_data.zip
          mkdir -p app/src/main/res/values/
          unzip -o project_data.zip -d app/src/main/

      - name: Clean and Inject Build Files
        run: |
          # پراجیکٹ لیول فائل (JitPack سپورٹ کے ساتھ)
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral(); }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { 
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          EOF

          # ایپ لیول build.gradle (Namespace اور ID فکس)
          if [ -f "app/build.gradle" ]; then
            sed -i "s/namespace .*/namespace '${{ github.event.client_payload.package_name }}'/g" app/build.gradle || true
            sed -i "s/applicationId .*/applicationId '${{ github.event.client_payload.package_name }}'/g" app/build.gradle || true
            sed -i "s/compileSdk .*/compileSdk 34/g" app/build.gradle
            sed -i "s/targetSdk .*/targetSdk 34/g" app/build.gradle
          fi

          # اہم فکس: مینی فیسٹ سے پیکیج ایٹریبیوٹ ختم کرنا
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            # یہ کمانڈ 'package="any.name"' کو مکمل طور پر نکال دے گی
            sed -i 's/package="[^"]*"//g' app/src/main/AndroidManifest.xml
          fi

          # ایپ نیم اپ ڈیٹ
          if [ -f "app/src/main/res/values/strings.xml" ]; then
            sed -i "s/>.*<\/string>/>${{ github.event.client_payload.app_name }}<\/string>/g" app/src/main/res/values/strings.xml
          fi

          # آئیکون مینجمنٹ
          if [ -f "app/src/main/ic_launcher.png" ]; then
            mkdir -p app/src/main/res/mipmap-xxxhdpi/
            mv app/src/main/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Execute Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Push APK to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build_${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
