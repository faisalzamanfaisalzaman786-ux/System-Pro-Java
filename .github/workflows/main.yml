name: System Pro Titan Master Build
on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  COMPILE_SDK: 34
  TARGET_SDK: 34
  MIN_SDK: 21
  GRADLE_VERSION: 8.5
  AGP_VERSION: 8.1.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Initialize Smart Structure
        run: |
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout

      - name: Decode and Sync Source
        run: |
          ZIP_DATA="${{ github.event.client_payload.zip_data }}"
          if [ ! -z "$ZIP_DATA" ]; then
            echo "$ZIP_DATA" | tr -d '\n\r ' | base64 -d > project.zip
            unzip -o project.zip -d temp_src || true
            
            # اصلی لاجک: سورس فائلز کو منتقل کرنا اور ان کا ڈھانچہ برقرار رکھنا
            cp -rf temp_src/app/src/main/java/* app/src/main/java/ || true
            cp -rf temp_src/app/src/main/res/* app/src/main/res/ || true
            
            # ری فیکٹرنگ: تمام جاوا فائلوں میں پیکج اور R کلاس کو درست کرنا
            find app/src/main/java -name "*.java" -exec sed -i 's/import .*\.R;/import com.systempro.master.R;/g' {} \;
          fi

      - name: Inject Master Attributes (Real Linking)
        run: |
          echo '<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <attr name="progressTint" format="color|reference" />
              <attr name="actionTextColor" format="color|reference" />
              <style name="Theme.SystemPro" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#FF00E5FF</item>
                  <item name="android:statusBarColor">#000000</item>
              </style>
          </resources>' > app/src/main/res/values/system_pro_master.xml

      - name: Build Engine (Fixed Versions)
        run: |
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:${{ env.AGP_VERSION }}' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          echo 'include ":app"' > settings.gradle

          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { 
            namespace 'com.systempro.master'
            compileSdk ${{ env.COMPILE_SDK }}
            defaultConfig { 
              applicationId 'com.systempro.master'
              minSdk ${{ env.MIN_SDK }}
              targetSdk ${{ env.TARGET_SDK }}
              versionCode 1
              versionName '1.0'
            }
          }" >> app/build.gradle

          echo "dependencies { 
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }" >> app/build.gradle
          
          echo 'android.useAndroidX=true' > gradle.properties
          echo 'android.enableJetifier=true' >> gradle.properties

      - name: Execute Verified Build
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip
          unzip -q gradle-${{ env.GRADLE_VERSION }}-bin.zip
          ./gradle-${{ env.GRADLE_VERSION }}/bin/gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Deliver Result
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Verified-Build
          path: app/build/outputs/apk/debug/*.apk
