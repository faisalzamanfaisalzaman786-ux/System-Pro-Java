name: Build System Pro APK

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch: # یہ آپ کو GitHub پر "Run Workflow" کا بٹن دے گا

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Initialize Capacitor Project
        run: |
          # ضروری کنفیگریشن فائلز بنانا
          echo '{
            "name": "system-pro-app",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "^5.0.0",
              "@capacitor/android": "^5.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^5.0.0"
            }
          }' > package.json

          echo '{
            "appId": "com.systempro.faisal",
            "appName": "System Pro",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json

      - name: Install Dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Web Assets
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
