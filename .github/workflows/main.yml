name: Build WebView APK (Cordova)

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Create Cordova project from scratch
        run: |
          npx cordova create MyApp com.example.myapp "MyApp"
          cd MyApp
          npx cordova platform add android

      - name: Place HTML content
        run: |
          cat << 'EOF' > MyApp/www/index.html
          ${{ github.event.client_payload.app_html }}
          EOF

      - name: Update app name and package name
        run: |
          APP_NAME='${{ github.event.client_payload.app_name }}'
          cd MyApp
          # Update config.xml name
          sed -i "s/<name>.*<\/name>/<name>$APP_NAME<\/name>/" config.xml
          # Generate package name from app name (clean)
          CLEAN_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g' | cut -c1-30)
          PACKAGE_NAME="com.${CLEAN_NAME}"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          # Update config.xml id
          sed -i "s/id=\".*\"/id=\"$PACKAGE_NAME\"/" config.xml

      - name: Set Android package name in build files
        run: |
          cd MyApp
          # AndroidManifest.xml
          sed -i "s/package=\".*\"/package=\"$PACKAGE_NAME\"/" platforms/android/app/src/main/AndroidManifest.xml
          # build.gradle
          sed -i "s/applicationId \".*\"/applicationId \"$PACKAGE_NAME\"/" platforms/android/app/build.gradle

      - name: Decode and set app icon if provided
        run: |
          ICON_BASE64='${{ github.event.client_payload.app_icon }}'
          if [ -n "$ICON_BASE64" ]; then
            echo "$ICON_BASE64" | base64 -d > icon.png
            cd MyApp
            # Remove existing default icons
            rm -f platforms/android/app/src/main/res/mipmap-*/*
            # Create directories if missing
            for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p platforms/android/app/src/main/res/$dir
            done
            # Copy same icon to all densities (you can improve scaling later)
            cp ../icon.png platforms/android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp ../icon.png platforms/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp ../icon.png platforms/android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp ../icon.png platforms/android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp ../icon.png platforms/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Add permissions to AndroidManifest
        run: |
          # Convert permissions array to proper JSON string
          PERMISSIONS_JSON='${{ toJSON(github.event.client_payload.permissions) }}'
          echo "$PERMISSIONS_JSON" | jq -r '.[]' | while read perm; do
            if [ -n "$perm" ]; then
              sed -i "/<\/manifest>/i <uses-permission android:name=\"$perm\" />" MyApp/platforms/android/app/src/main/AndroidManifest.xml
            fi
          done

      - name: Build APK
        run: |
          cd MyApp
          npx cordova build android --release -- --packageType=apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: MyApp/platforms/android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release (optional)
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: run-${{ github.run_id }}
          name: Build ${{ github.run_id }}
          files: MyApp/platforms/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
