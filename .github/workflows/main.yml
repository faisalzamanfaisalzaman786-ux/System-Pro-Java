name: Dynamic APK Builder from ZipForge Pro

on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # === STABLE VERSIONS ===
  COMPILE_SDK: 34
  BUILD_TOOLS: 34.0.0
  MIN_SDK: 21
  TARGET_SDK: 34
  GRADLE_VERSION: 8.5
  AGP_VERSION: 8.1.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-${{ env.COMPILE_SDK }} build-tools;${{ env.BUILD_TOOLS }}"
          accept-android-sdk-licenses: true

      - name: Decode and Extract ZIP
        run: |
          ZIP_DATA="${{ github.event.client_payload.zip_data }}"
          if [ -z "$ZIP_DATA" ]; then
            echo "❌ No zip_data"
            exit 1
          fi
          mkdir -p android_project
          cd android_project
          echo "$ZIP_DATA" | tr -d '\n\r ' | base64 -d > project.zip
          unzip -o project.zip
          rm project.zip
          echo "✅ Extraction complete"

      - name: Prepare Android Project (Fix Package, Java, Icon)
        working-directory: ./android_project
        run: |
          # Get package name
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          if [ -z "$PACKAGE_NAME" ]; then
            if [ -f "src/main/AndroidManifest.xml" ]; then
              PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' src/main/AndroidManifest.xml | head -1)
            fi
            if [ -z "$PACKAGE_NAME" ]; then
              PACKAGE_NAME="com.zipforge.app"
            fi
          fi
          echo "📦 Package: $PACKAGE_NAME"

          # Create app structure
          mkdir -p app/src/main
          if [ -d "src/main" ]; then
            cp -rf src/main/* app/src/main/
          fi

          # Move Java files to correct package directory
          PKG_PATH=$(echo $PACKAGE_NAME | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          find app/src/main/java -name "*.java" -type f | while read file; do
            filename=$(basename "$file")
            mv "$file" "app/src/main/java/$PKG_PATH/$filename" 2>/dev/null || true
          done
          if [ -f "MainActivity.java" ]; then
            mv MainActivity.java "app/src/main/java/$PKG_PATH/MainActivity.java"
          fi

          # Fix package line and add R import
          find "app/src/main/java/$PKG_PATH" -name "*.java" -type f | while read file; do
            sed -i "1s/^package .*;/package $PACKAGE_NAME;/" "$file"
            if ! grep -q "import $PACKAGE_NAME.R;" "$file"; then
              sed -i "/package $PACKAGE_NAME;/a import $PACKAGE_NAME.R;" "$file"
            fi
          done

          # Update AndroidManifest.xml
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i "s/package=\"[^\"]*\"/package=\"$PACKAGE_NAME\"/" app/src/main/AndroidManifest.xml
            sed -i 's/android:name="[^"]*MainActivity[^"]*"/android:name=".MainActivity"/' app/src/main/AndroidManifest.xml
            # Ensure icon references (use mipmap/ic_launcher)
            if ! grep -q "android:icon=" app/src/main/AndroidManifest.xml; then
              sed -i '/<application /a \        android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher_round"' app/src/main/AndroidManifest.xml
            fi
          else
            cat > app/src/main/AndroidManifest.xml << MANIFEST
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="$PACKAGE_NAME">
              <application android:label="ZipForge"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST
          fi

          # Provide fallback resources (colors, theme, layout)
          mkdir -p app/src/main/res/values app/src/main/res/layout
          if [ ! -f "app/src/main/res/values/colors.xml" ]; then
            cat > app/src/main/res/values/colors.xml << 'COLORS'
          <resources>
              <color name="purple_500">#FF6200EE</color>
              <color name="purple_700">#FF3700B3</color>
              <color name="teal_200">#FF03DAC5</color>
          </resources>
          COLORS
          fi

          if [ ! -f "app/src/main/res/values/themes.xml" ]; then
            cat > app/src/main/res/values/themes.xml << 'THEME'
          <resources>
              <style name="Theme.Zip" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/purple_500</item>
                  <item name="colorPrimaryDark">@color/purple_700</item>
                  <item name="colorAccent">@color/teal_200</item>
              </style>
          </resources>
          THEME
          fi

          if [ ! -f "app/src/main/res/layout/activity_main.xml" ]; then
            cat > app/src/main/res/layout/activity_main.xml << 'LAYOUT'
          <?xml version="1.0" encoding="utf-8"?>
          <TextView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:text="Hello from ZipForge"
              android:textSize="24sp"
              android:layout_gravity="center"/>
          LAYOUT
          fi

          # === ICON HANDLING (ALL DENSITIES) ===
          ICON_SOURCE=""
          if [ -f "app/src/main/res/mipmap-hdpi/ic_launcher.png" ]; then
            ICON_SOURCE="app/src/main/res/mipmap-hdpi/ic_launcher.png"
          elif [ -f "src/main/ic_launcher.png" ]; then
            ICON_SOURCE="src/main/ic_launcher.png"
          elif [ -f "ic_launcher.png" ]; then
            ICON_SOURCE="ic_launcher.png"
          fi

          if [ -n "$ICON_SOURCE" ] && [ -f "$ICON_SOURCE" ]; then
            echo "✅ Installing icon to all densities"
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p app/src/main/res/mipmap-$density
              cp "$ICON_SOURCE" "app/src/main/res/mipmap-$density/ic_launcher.png"
            done
            # Also create round icon (same image, but needed for Android)
            cp "$ICON_SOURCE" app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png 2>/dev/null || true
          else
            echo "⚠️ No icon provided, using default Android icon"
          fi

          # Debug: list Java files
          echo "Java files after preparation:"
          find app/src/main/java -name "*.java"

      - name: Generate Gradle Files (Stable Versions)
        working-directory: ./android_project
        run: |
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          if [ -z "$PACKAGE_NAME" ]; then
            PACKAGE_NAME="com.zipforge.app"
          fi

          # Root build.gradle with fixed AGP version
          cat > build.gradle << EOF
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:${{ env.AGP_VERSION }}'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # settings.gradle
          echo 'include ":app"' > settings.gradle

          # app/build.gradle with fixed SDK versions
          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }
          android {
              namespace '$PACKAGE_NAME'
              compileSdk ${{ env.COMPILE_SDK }}
              defaultConfig {
                  applicationId '$PACKAGE_NAME'
                  minSdk ${{ env.MIN_SDK }}
                  targetSdk ${{ env.TARGET_SDK }}
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # gradle.properties
          cat > gradle.properties << 'PROP'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=false
          PROP

          # Dummy proguard file
          echo '# no rules' > app/proguard-rules.pro

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android_project/**/*.gradle*', 'android_project/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle Wrapper (Fixed Version)
        working-directory: ./android_project
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip
          unzip -q gradle-${{ env.GRADLE_VERSION }}-bin.zip
          export PATH=$PWD/gradle-${{ env.GRADLE_VERSION }}/bin:$PATH
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew

      - name: Build APK
        working-directory: ./android_project
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_project/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "ZipForge Build ${{ github.run_id }}"
          files: android_project/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
