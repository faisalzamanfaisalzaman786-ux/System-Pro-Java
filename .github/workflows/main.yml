name: Build APK from HTML

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'MyApp'
      permissions:
        description: 'Permissions (comma separated)'
        required: false
      app_icon:
        description: 'Icon base64 (optional)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Get app details from payload
        id: details
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            APP_NAME="${{ github.event.inputs.app_name }}"
            PERMISSIONS="${{ github.event.inputs.permissions }}"
            ICON_BASE64="${{ github.event.inputs.app_icon }}"
          else
            APP_NAME="${{ github.event.client_payload.app_name }}"
            PERMISSIONS="${{ github.event.client_payload.permissions }}"
            ICON_BASE64="${{ github.event.client_payload.app_icon }}"
          fi
          # Sanitize app name for package (only alphanumeric and underscore)
          SANITIZED_NAME=$(echo "$APP_NAME" | sed 's/[^a-zA-Z0-9]/_/g')
          if [ -z "$SANITIZED_NAME" ]; then
            SANITIZED_NAME="MyApp"
          fi
          echo "app_name_raw=$APP_NAME" >> $GITHUB_OUTPUT
          echo "app_name_sanitized=$SANITIZED_NAME" >> $GITHUB_OUTPUT
          echo "permissions=${PERMISSIONS}" >> $GITHUB_OUTPUT
          echo "icon_base64=${ICON_BASE64}" >> $GITHUB_OUTPUT

      - name: Decode and save icon (if provided)
        run: |
          ICON_BASE64="${{ steps.details.outputs.icon_base64 }}"
          if [ -n "$ICON_BASE64" ]; then
            echo "$ICON_BASE64" | base64 -d > icon.png
            echo "Icon saved as icon.png"
          else
            echo "No icon provided."
          fi

      - name: Create Cordova project with custom config
        run: |
          set -e  # Exit on error
          npm install -g cordova
          
          APP_NAME_RAW="${{ steps.details.outputs.app_name_raw }}"
          APP_NAME_SAN="${{ steps.details.outputs.app_name_sanitized }}"
          
          # Create project
          cordova create myapp "com.example.$APP_NAME_SAN" "$APP_NAME_RAW"
          cd myapp
          
          # Remove default www and copy our HTML
          rm -rf www
          mkdir -p www
          cp ../index.html www/index.html
          
          # Copy icon if provided
          if [ -f "../icon.png" ]; then
            cp ../icon.png www/icon.png
          fi
          
          # Add Android platform
          cordova platform add android
          
          # ===== FIX CONFIG.XML =====
          # We will insert all customizations before the closing </widget> tag
          
          # Prepare a temporary file with the lines to insert
          cat > custom_config.txt <<'EOF'
          <access origin="*" />
          <allow-navigation href="*" />
          <allow-intent href="http://*/*" />
          <allow-intent href="https://*/*" />
          <preference name="AndroidInsecureFileModeEnabled" value="true" />
          <preference name="AllowFileAccessFromFileURLs" value="true" />
          <preference name="AllowUniversalAccessFromFileURLs" value="true" />
          <preference name="loadUrlTimeoutValue" value="700000" />
          EOF
          
          # Insert these lines before </widget>
          sed -i '/<\/widget>/e cat custom_config.txt' config.xml
          
          # Add permissions via edit-config
          PERMS="${{ steps.details.outputs.permissions }}"
          if [ -n "$PERMS" ]; then
            IFS=',' read -ra PERM_ARRAY <<< "$PERMS"
            for perm in "${PERM_ARRAY[@]}"; do
              if [ -n "$perm" ]; then
                # Insert edit-config for each permission before </widget>
                sed -i "/<\/widget>/i \        <edit-config file=\"app/src/main/AndroidManifest.xml\" target=\"/manifest\" mode=\"merge\">\n            <uses-permission android:name=\"$perm\" />\n        </edit-config>" config.xml
              fi
            done
          fi
          
          # Add custom icon in config.xml (if exists)
          if [ -f "../icon.png" ]; then
            # Insert icon tag inside platform android
            sed -i "/<platform name=\"android\">/a \        <icon src=\"res/icon.png\" />" config.xml
            # Also copy icon to mipmap folders for launcher
            TARGET_DIR="platforms/android/app/src/main/res"
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "$TARGET_DIR/mipmap-$density"
              cp ../icon.png "$TARGET_DIR/mipmap-$density/ic_launcher.png"
              cp ../icon.png "$TARGET_DIR/mipmap-$density/ic_launcher_round.png"
            done
            echo "Custom icon applied."
          fi
          
          # Build debug APK
          cordova build android
          
          # Locate the APK
          APK_PATH=$(find platforms/android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No debug APK found."
            exit 1
          fi
          cp "$APK_PATH" ../app.apk
          cd ..
          
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.details.outputs.app_name_sanitized }}
          path: app.apk

      - name: Create Release
        if: github.event_name == 'repository_dispatch'
        run: |
          RUN_ID=${{ github.run_id }}
          gh release create "run-${RUN_ID}" app.apk --title "APK Build ${{ steps.details.outputs.app_name_raw }}" --notes "Generated from workflow run ${{ github.run_id }}" --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
