name: Dynamic APK Builder from ZipForge Pro
on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  COMPILE_SDK: 34
  BUILD_TOOLS: 34.0.0
  MIN_SDK: 21
  TARGET_SDK: 34
  GRADLE_VERSION: 8.5
  AGP_VERSION: 8.1.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-${{ env.COMPILE_SDK }} build-tools;${{ env.BUILD_TOOLS }}"
          accept-android-sdk-licenses: true

      - name: Decode and Extract ZIP
        run: |
          ZIP_DATA="${{ github.event.client_payload.zip_data }}"
          if [ -z "$ZIP_DATA" ]; then echo "❌ No zip_data"; exit 1; fi
          mkdir -p android_project
          cd android_project
          echo "$ZIP_DATA" | tr -d '\n\r ' | base64 -d > project.zip
          unzip -o project.zip
          rm project.zip
          echo "✅ Extraction complete"

      - name: Prepare Android Project (Fix Package, Java, Icon, App Name)
        working-directory: ./android_project
        run: |
          # پیکیج اور ایپ کا نام حاصل کرنا
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          [ -z "$PACKAGE_NAME" ] && PACKAGE_NAME="com.zipforge.app"
          APP_NAME="${{ github.event.client_payload.app_name }}"
          [ -z "$APP_NAME" ] && APP_NAME="ZipForge"

          # فولڈر اسٹرکچر بنانا
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
          if [ -d "src/main" ]; then
            cp -rf src/main/* app/src/main/
          fi

          # جاوا فائلز کو صحیح پیکیج فولڈر میں منتقل کرنا
          PKG_PATH=$(echo $PACKAGE_NAME | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          find app/src/main/java -name "*.java" -type f -exec mv {} "app/src/main/java/$PKG_PATH/" \; 2>/dev/null || true

          # پیکیج لائن اور بٹن کی آئی ڈی کے لیے کوڈ فکس کرنا
          find "app/src/main/java/$PKG_PATH" -name "*.java" -type f | while read file; do
            sed -i "1s/^package .*;/package $PACKAGE_NAME;/" "$file"
            if ! grep -q "import $PACKAGE_NAME.R;" "$file"; then
              sed -i "/package $PACKAGE_NAME;/a import $PACKAGE_NAME.R;" "$file"
            fi
          done

          # لے آؤٹ چیک کرنا: اگر بٹن والا لے آؤٹ نہیں ہے تو نیا بنانا
          if [ ! -f "app/src/main/res/layout/activity_main.xml" ]; then
            cat > app/src/main/res/layout/activity_main.xml << 'LAYOUT'
<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:orientation="vertical"
    android:gravity="center"
    android:padding="16dp">
    <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="Welcome to ZipForge"
        android:textSize="22sp"
        android:layout_marginBottom="20dp"/>
    <Button
        android:id="@+id/mainButton"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="Click Me" />
</LinearLayout>
LAYOUT
          fi

          # مینی فیسٹ فائل کی درستگی
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i "s/package=\"[^\"]*\"/package=\"$PACKAGE_NAME\"/" app/src/main/AndroidManifest.xml
            sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/" app/src/main/AndroidManifest.xml
          fi

      - name: Generate Gradle Files
        working-directory: ./android_project
        run: |
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          [ -z "$PACKAGE_NAME" ] && PACKAGE_NAME="com.zipforge.app"
          
          cat > build.gradle << EOF
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:${{ env.AGP_VERSION }}' }
          }
          allprojects { repositories { google(); mavenCentral() } }
EOF

          echo 'include ":app"' > settings.gradle
          cat > app/build.gradle << EOF
          plugins { id 'com.android.application' }
          android {
            namespace '$PACKAGE_NAME'
            compileSdk ${{ env.COMPILE_SDK }}
            defaultConfig {
              applicationId '$PACKAGE_NAME'
              minSdk ${{ env.MIN_SDK }}
              targetSdk ${{ env.TARGET_SDK }}
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
          }
EOF
          echo 'org.gradle.jvmargs=-Xmx2048m' > gradle.properties
          echo 'android.useAndroidX=true' >> gradle.properties

      - name: Setup Gradle Wrapper
        working-directory: ./android_project
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip
          unzip -q gradle-${{ env.GRADLE_VERSION }}-bin.zip
          export PATH=$PWD/gradle-${{ env.GRADLE_VERSION }}/bin:$PATH
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew

      - name: Build APK
        working-directory: ./android_project
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_project/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "System Pro Build ${{ github.run_id }}"
          files: android_project/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
