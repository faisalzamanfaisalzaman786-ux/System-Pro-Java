name: System Pro Build Engine

on:
  repository_dispatch:
    types: [build-from-b64]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Gradle 8.5
        run: |
          mkdir -p gradle/wrapper
          cat <<EOF > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Decode and Unzip
        run: |
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
          mkdir -p app/src/main/res/values/
          unzip -o project.zip -d app/src/main/

      - name: Clean and Inject Repositories
        run: |
          # پراجیکٹ لیول build.gradle میں JitPack شامل کرنا (بہت ضروری)
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral(); }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { 
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          EOF

          # ایپ لیول build.gradle کی ترتیبات
          if [ -f "app/build.gradle" ]; then
            # پیکیج نیم سیٹ کرنا
            sed -i "s/namespace .*/namespace '${{ github.event.client_payload.package_name }}'/g" app/build.gradle
            sed -i "s/applicationId .*/applicationId '${{ github.event.client_payload.package_name }}'/g" app/build.gradle
            
            # SDK ورژن فکس کرنا
            sed -i "s/compileSdk .*/compileSdk 34/g" app/build.gradle
            sed -i "s/targetSdk .*/targetSdk 34/g" app/build.gradle
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build_${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
