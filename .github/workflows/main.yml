name: System Pro - Real APK Delivery

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Force Gradle 7.5
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 7.5

      - name: Create Project Files
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/systempro/app
          mkdir -p app/src/main/res/values
          
          # HTML and Styles
          echo "<html><body style='background:#000;color:#fff;text-align:center;'><h1>System Pro V2 Loaded</h1></body></html>" > app/src/main/assets/index.html
          echo '<resources><style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar" /></resources>' > app/src/main/res/values/styles.xml

          # Manifest
          cat > app/src/main/AndroidManifest.xml << EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.systempro.app">
              <application android:label="System Pro" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Java MainActivity
          cat > app/src/main/java/com/systempro/app/MainActivity.java << 'EOF'
          package com.systempro.app;
          import android.os.Bundle;
          import android.webkit.*;
          import android.app.Activity;
          public class MainActivity extends Activity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView web = new WebView(this);
                  setContentView(web);
                  web.getSettings().setJavaScriptEnabled(true);
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Setup Build Scripts
        run: |
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              compileSdk 32
              namespace 'com.systempro.app'
              defaultConfig {
                  applicationId "com.systempro.app"
                  minSdk 21
                  targetSdk 32
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

      - name: Build and Locate APK
        run: |
          gradle assembleDebug --no-daemon
          # Sab se important step: APK ko dhoond kar bahar lana
          mkdir -p final_apk_folder
          find . -name "*.apk" -exec cp {} final_apk_folder/SystemPro.apk \;

      - name: Upload Real APK File
        uses: actions/upload-artifact@v4
        with:
          name: SystemPro-Full-App
          path: final_apk_folder/SystemPro.apk
          if-no-files-found: error
