name: System Pro Auto Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Preparation and Clean Setup
        run: |
          PKG_NAME="${{ github.event.client_payload.package_name || 'com.torch.systempro' }}"
          echo "Building for: $PKG_NAME"

          # پرانے ڈیٹا کی صفائی
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/layout/*
          rm -rf app/src/main/res/drawable/*

          if [ -n "${{ github.event.client_payload.zip_data }}" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            unzip -o project.zip -d temp_dir/
            
            # امیج فائلوں کے ناموں کو فکس کرنا
            find temp_dir/src/main/res/drawable -type f | while read -r file; do
              new_name=$(basename "$file" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._]/_/g')
              mv "$file" "$(dirname "$file")/$new_name" 2>/dev/null || true
            done

            # جاوا فائلوں میں پیکیج نیم درست کرنا
            find temp_dir/src/main/java -name "*.java" -exec sed -i "s/^package .*;/package $PKG_NAME;/g" {} +
            
            # صحیح ڈائریکٹری سٹرکچر بنانا
            PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
            mkdir -p "app/src/main/java/$PKG_PATH"
            find temp_dir/src/main/java -name "*.java" -exec cp {} "app/src/main/java/$PKG_PATH/" \;
            cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
            rm -rf temp_dir project.zip
          fi

      - name: Static Build Configuration
        run: |
          PKG_NAME="${{ github.event.client_payload.package_name || 'com.torch.systempro' }}"
          
          # مکمل نئی build.gradle فائل لکھنا (تاکہ کوئی Mutation نہ ہو)
          cat <<'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace project.property("PKG_NAME")
              compileSdk 34

              defaultConfig {
                  applicationId project.property("PKG_NAME")
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: Generate Android Manifest
        run: |
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <application android:allowBackup="true" android:label="System Pro" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Execute Gradle Build with Properties
        run: |
          PKG_NAME="${{ github.event.client_payload.package_name || 'com.torch.systempro' }}"
          chmod +x gradlew
          # اب ہم پیکیج نیم کو گریڈل پراپرٹی کے طور پر پاس کریں گے
          ./gradlew assembleDebug -PPKG_NAME="$PKG_NAME" --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Build-V3
          path: app/build/outputs/apk/debug/*.apk
