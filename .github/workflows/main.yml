name: System Pro Ultimate - 100% Fix

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  ultimate-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force Rewrite All Configs
        run: |
          # پرانے کیشے کی مکمل صفائی
          rm -rf .gradle build app/build
          
          # 1. پروجیکٹ لیول build.gradle
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # 2. ایپ لیول build.gradle (Android 14 کے لیے)
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.systempro.ultimate'
              compileSdk 34
              defaultConfig {
                  applicationId "com.systempro.ultimate"
                  minSdk 24
                  targetSdk 34
                  versionCode 8
                  versionName "8.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 3. Settings File
          echo "include ':app'" > settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and Fix Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V8-Final
          path: app/build/outputs/apk/debug/*.apk
