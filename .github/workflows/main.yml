name: System Pro Titan Master Build
on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  COMPILE_SDK: 34
  TARGET_SDK: 34
  MIN_SDK: 21
  GRADLE_VERSION: 8.5
  AGP_VERSION: 8.1.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Workspace
        run: |
          mkdir -p app/src/main/java/com/systempro/master
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          
      - name: Sync Payload (Priority One)
        run: |
          ZIP_DATA="${{ github.event.client_payload.zip_data }}"
          if [ ! -z "$ZIP_DATA" ]; then
            echo "$ZIP_DATA" | tr -d '\n\r ' | base64 -d > project.zip
            unzip -o project.zip -d temp_src || true
            
            # صرف جاوا اور ریسورسز کو اوور رائٹ کرنا
            cp -rf temp_src/app/src/main/java/* app/src/main/java/ || true
            cp -rf temp_src/app/src/main/res/* app/src/main/res/ || true
            
            # تمام جاوا فائلز میں R کلاس کو ماسٹر نیم اسپیس کے ساتھ جوڑنا
            find app/src/main/java -name "*.java" -exec sed -i '/import .*\.R;/d' {} \;
            find app/src/main/java -name "*.java" -exec sed -i '/package /a import com.systempro.master.R;' {} \;
          fi

      - name: Generate Master Shield Assets
        run: |
          # اگر پے لوڈ میں آئیکن نہیں ہے تو ڈیفالٹ لگائیں
          if [ ! -f app/src/main/res/mipmap-hdpi/ic_launcher.xml ] && [ ! -f app/src/main/res/mipmap-hdpi/ic_launcher.png ]; then
             echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF00E5FF" android:pathData="M12,2L4,5V11C4,16.55 7.84,21.74 12,23C16.16,21.74 20,16.55 20,11V5L12,2Z"/></vector>' > app/src/main/res/mipmap-hdpi/ic_launcher.xml
          fi

          # مینی فیسٹ کی پکی درستگی
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="System Pro"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity
                      android:name="com.system.pro.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build Engine (Total Alignment)
        run: |
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:${{ env.AGP_VERSION }}' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          echo 'include ":app"' > settings.gradle
          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { 
            namespace 'com.systempro.master'
            compileSdk ${{ env.COMPILE_SDK }}
            defaultConfig { 
              applicationId 'com.systempro.master'
              minSdk ${{ env.MIN_SDK }}
              targetSdk ${{ env.TARGET_SDK }}
              versionCode 1
              versionName '1.0'
            }
          }" >> app/build.gradle
          echo "dependencies { 
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'com.google.android.flexbox:flexbox:3.0.0'
          }" >> app/build.gradle

      - name: Execute Assembly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip
          unzip -q gradle-${{ env.GRADLE_VERSION }}-bin.zip
          ./gradle-${{ env.GRADLE_VERSION }}/bin/gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Final Delivery
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
