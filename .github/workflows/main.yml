name: Dynamic APK Builder from ZipForge Pro

on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Decode and Extract ZIP
        run: |
          ZIP_DATA="${{ github.event.client_payload.zip_data }}"
          if [ -z "$ZIP_DATA" ]; then
            echo "❌ No zip_data received"
            exit 1
          fi
          mkdir -p android_project
          cd android_project
          # Remove whitespace and newlines from base64
          echo "$ZIP_DATA" | tr -d '\n\r ' | base64 -d > project.zip
          unzip -o project.zip
          rm project.zip
          echo "✅ Extraction complete"
          ls -la

      - name: Prepare Android Project with User Files
        working-directory: ./android_project
        run: |
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          if [ -z "$PACKAGE_NAME" ]; then
            # Try to read from manifest if present
            if [ -f "src/main/AndroidManifest.xml" ]; then
              PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' src/main/AndroidManifest.xml | head -1)
            fi
            if [ -z "$PACKAGE_NAME" ]; then
              PACKAGE_NAME="com.zipforge.app"
            fi
          fi
          echo "Using package: $PACKAGE_NAME"

          # Create app structure
          mkdir -p app/src/main
          # Copy all user files (if any) from src/main to app/src/main
          if [ -d "src/main" ]; then
            cp -rf src/main/* app/src/main/
          fi

          # Ensure necessary directories exist
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-hdpi

          # Fix package name in all Java files
          find app/src/main/java -name "*.java" -type f | while read file; do
            sed -i "1s/^package .*;/package $PACKAGE_NAME;/" "$file"
            if ! grep -q "import $PACKAGE_NAME.R;" "$file"; then
              sed -i "/package $PACKAGE_NAME;/a import $PACKAGE_NAME.R;" "$file"
            fi
          done

          # Fix AndroidManifest.xml package attribute
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i "s/package=\"[^\"]*\"/package=\"$PACKAGE_NAME\"/" app/src/main/AndroidManifest.xml
          else
            # Create minimal manifest if missing
            cat > app/src/main/AndroidManifest.xml << MANIFEST
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="$PACKAGE_NAME">
              <application android:label="ZipForgeApp" android:theme="@style/Theme.ZipForge">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST
          fi

          # Provide fallback theme and colors (in case user didn't provide)
          if [ ! -f "app/src/main/res/values/colors.xml" ]; then
            cat > app/src/main/res/values/colors.xml << COLORS
          <resources>
              <color name="purple_500">#FF6200EE</color>
              <color name="purple_700">#FF3700B3</color>
              <color name="teal_200">#FF03DAC5</color>
          </resources>
          COLORS
          fi

          if [ ! -f "app/src/main/res/values/themes.xml" ]; then
            cat > app/src/main/res/values/themes.xml << THEME
          <resources>
              <style name="Theme.ZipForge" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/purple_500</item>
                  <item name="colorPrimaryDark">@color/purple_700</item>
                  <item name="colorAccent">@color/teal_200</item>
              </style>
          </resources>
          THEME
          fi

          # If user provided icon, copy to proper density
          if [ -f "app/src/main/res/mipmap-hdpi/ic_launcher.png" ]; then
            echo "✅ User icon found"
          elif [ -f "src/main/ic_launcher.png" ]; then
            cp src/main/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi

      - name: Generate Gradle Build Files (AppCompat only)
        working-directory: ./android_project
        run: |
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          if [ -z "$PACKAGE_NAME" ]; then
            PACKAGE_NAME="com.zipforge.app"
          fi

          # Root build.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # settings.gradle
          echo 'include ":app"' > settings.gradle

          # app/build.gradle (no Material)
          cat > app/build.gradle << EOF
          plugins { id 'com.android.application' }
          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34
              defaultConfig {
                  applicationId '$PACKAGE_NAME'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # gradle.properties
          cat > gradle.properties << 'PROP'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          PROP

          # Dummy proguard
          echo "# no rules" > app/proguard-rules.pro

      - name: Setup Gradle Wrapper
        working-directory: ./android_project
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build APK
        working-directory: ./android_project
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_project/app/build/outputs/apk/debug/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "ZipForge Build ${{ github.run_id }}"
          files: android_project/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
