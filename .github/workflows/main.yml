name: System Pro APK Builder
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle
        
    - name: Setup directories
      run: |
        mkdir -p app/src/main/{assets,res/{drawable,layout,values},java}
        
    - name: Copy HTML from repo
      run: |
        if [ -f index.html ]; then
          cp index.html app/src/main/assets/
        else
          echo "<!DOCTYPE html><html><body><h1>System Pro</h1></body></html>" > app/src/main/assets/index.html
        fi
        
    - name: Setup app data
      run: |
        echo "${{ github.event.client_payload.app_name || 'System Pro' }}" > app_name.txt || echo "System Pro" > app_name.txt
        echo "${{ github.event.client_payload.permissions || '' }}" > permissions.txt || touch permissions.txt
        
    - name: Create gradle.properties
      run: |
        cat > gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx2048m
        android.useAndroidX=true
        android.enableJetifier=true
        EOF
        
    - name: Create root build.gradle
      run: |
        cat > build.gradle << 'EOF'
        buildscript {
          repositories { google() mavenCentral() }
          dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
        }
        allprojects { repositories { google() mavenCentral() } }
        EOF
        
    - name: Create settings.gradle
      run: |
        cat > settings.gradle << 'EOF'
        include ':app'
        EOF
        
    - name: Create app build.gradle
      run: |
        APP_NAME=$(cat app_name.txt)
        PKG="com.systempro.$(echo $APP_NAME | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9')"
        cat > app/build.gradle << EOF
        plugins { id 'com.android.application' }
        android {
          namespace '$PKG'
          compileSdk 34
          defaultConfig {
            applicationId '$PKG'
            minSdk 24
            targetSdk 34
            versionCode 1
            versionName '1.0'
          }
        }
        dependencies {
          implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF
        
    - name: Create AndroidManifest.xml
      run: |
        APP_NAME=$(cat app_name.txt)
        cat > app/src/main/AndroidManifest.xml << EOF
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
EOF
        if [ -f permissions.txt ] && [ -s permissions.txt ]; then
          cat permissions.txt | tr ',' '
' | grep -v '^$' | sed 's/^/  <uses-permission android:name="/;s/$/" />/' >> app/src/main/AndroidManifest.xml
        fi
        cat >> app/src/main/AndroidManifest.xml << EOF
          <application android:allowBackup="true" android:icon="@drawable/ic_launcher"
            android:label="$APP_NAME" android:usesCleartextTraffic="true">
            <activity android:name=".MainActivity" android:exported="true">
              <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
              </intent-filter>
            </activity>
          </application>
        </manifest>
        EOF
        
    - name: Create MainActivity.java
      run: |
        APP_NAME=$(cat app_name.txt)
        PKG="com.systempro.$(echo $APP_NAME | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9')"
        mkdir -p "app/src/main/java/$PKG"
        cat > "app/src/main/java/$PKG/MainActivity.java" << 'EOF'
        package com.systempro.app;
        import android.os.Bundle;
        import android.webkit.*;
        import androidx.appcompat.app.AppCompatActivity;
        public class MainActivity extends AppCompatActivity {
          @Override protected void onCreate(Bundle savedInstanceState) {
            super.onCreate(savedInstanceState);
            setContentView(R.layout.activity_main);
            WebView wv = findViewById(R.id.webview);
            wv.getSettings().setJavaScriptEnabled(true);
            wv.getSettings().setDomStorageEnabled(true);
            wv.loadUrl("file:///android_asset/index.html");
          }
        }
        EOF
        
    - name: Create layout
      run: |
        mkdir -p app/src/main/res/layout
        cat > app/src/main/res/layout/activity_main.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <WebView xmlns:android="http://schemas.android.com/apk/res/android"
          android:id="@+id/webview" android:layout_width="match_parent"
          android:layout_height="match_parent" />
        EOF
        
    - name: Create styles.xml
      run: |
        mkdir -p app/src/main/res/values
        cat > app/src/main/res/values/styles.xml << 'EOF'
        <resources><style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar"/></resources>
        EOF
        
    - name: Create default icon
      run: |
        mkdir -p app/src/main/res/drawable
        printf "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/drawable/ic_launcher.png
        
    - name: Generate Gradle wrapper
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        
    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: APK-${{ github.run_id }}
        path: app/build/outputs/apk/debug/*.apk
