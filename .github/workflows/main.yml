name: System Pro Master Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          # 1. فائلز کو اپنی جگہ پر سیٹ کرنا
          mkdir -p www
          cp *.html www/index.html 2>/dev/null || true
          cp *.png icon.png 2>/dev/null || true
          
          # 2. انوکھا پیکج نیم بنانا
          NEW_PKG="com.systempro.app$(date +%s)"
          
          # 3. Capacitor سیٹ اپ (صرف وہی جو ضروری ہے)
          npm install @capacitor/cli @capacitor/android
          npx cap init "System Pro" "$NEW_PKG" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SystemPro-APK
          path: "android/app/build/outputs/apk/release/*.apk"
