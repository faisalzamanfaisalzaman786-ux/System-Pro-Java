name: System Pro Auto Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Process Project and Fix Zip
        run: |
          # پیکیج نیم حاصل کرنا
          PKG_NAME="${{ github.event.client_payload.package_name || 'com.faisalzar.systempro' }}"
          echo "Building for: $PKG_NAME"

          # پرانا ڈیٹا صاف کرنا
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/layout/*
          rm -rf app/src/main/res/drawable/*

          # زپ ڈیٹا کو چیک کرنا اور نکالنا
          if [ -z "${{ github.event.client_payload.zip_data }}" ]; then
            echo "Error: No zip data received from app!"
            exit 1
          fi

          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
          
          # زپ فائل کی صحت چیک کرنا
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "Error: project.zip is corrupted or not a valid zip file."
            exit 1
          fi

          unzip -o project.zip -d temp_dir/

          # جاوا پیکج اپ ڈیٹ کرنا
          find temp_dir/src/main/java -name "*.java" -exec sed -i "s/^package .*;/package $PKG_NAME;/g" {} +
          
          # ڈائنامک فولڈر بنانا
          PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          
          # فائلیں منتقل کرنا
          find temp_dir/src/main/java -name "*.java" -exec cp {} "app/src/main/java/$PKG_PATH/" \;
          cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
          
          rm -rf temp_dir project.zip

      - name: Auto-Generate Manifest
        run: |
          PKG_NAME="${{ github.event.client_payload.package_name || 'com.faisalzar.systempro' }}"
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="$PKG_NAME">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
              <application android:allowBackup="true" android:label="System Pro" android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build System Pro
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Release
          path: app/build/outputs/apk/debug/*.apk
