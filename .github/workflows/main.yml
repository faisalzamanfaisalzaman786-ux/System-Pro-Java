name: Build React Native WebView App from HTML

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (just to have a workspace)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20   # اب Node 20 استعمال کریں

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Android SDK already pre-installed on runner, but we set ANDROID_HOME
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Create React Native project (without skip-install)
        run: |
          npx react-native@0.72.0 init MyWebViewApp
          cd MyWebViewApp
          npm install react-native-webview

      - name: Decode and place HTML
        run: |
          mkdir -p MyWebViewApp/android/app/src/main/assets/
          cat << 'EOF' > MyWebViewApp/android/app/src/main/assets/index.html
          ${{ github.event.client_payload.app_html }}
          EOF

      - name: Decode and set app icon (if provided)
        run: |
          ICON_BASE64='${{ github.event.client_payload.app_icon }}'
          if [ -n "$ICON_BASE64" ]; then
            echo "$ICON_BASE64" | base64 -d > ic_launcher.png
            for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p MyWebViewApp/android/app/src/main/res/$dir
              cp ic_launcher.png MyWebViewApp/android/app/src/main/res/$dir/ic_launcher.png
            done
          fi

      - name: Set app name
        run: |
          APP_NAME='${{ github.event.client_payload.app_name }}'
          cd MyWebViewApp
          sed -i "s/\"name\": \".*\"/\"name\": \"$APP_NAME\"/" app.json
          sed -i "s/\"displayName\": \".*\"/\"displayName\": \"$APP_NAME\"/" app.json
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APP_NAME<\/string>/" android/app/src/main/res/values/strings.xml

      - name: Generate package name
        run: |
          APP_NAME='${{ github.event.client_payload.app_name }}'
          CLEAN_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g' | cut -c1-30)
          PACKAGE_NAME="com.${CLEAN_NAME}"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV

      - name: Set Android package name
        run: |
          cd MyWebViewApp/android
          sed -i "s/applicationId \".*\"/applicationId \"$PACKAGE_NAME\"/" app/build.gradle
          sed -i "s/package=\".*\"/package=\"$PACKAGE_NAME\"/" app/src/main/AndroidManifest.xml

      - name: Add permissions
        run: |
          PERMISSIONS_STR='${{ github.event.client_payload.permissions }}'
          echo "$PERMISSIONS_STR" | jq -r '.[]' | while read perm; do
            if [ -n "$perm" ]; then
              sed -i "/<\/manifest>/i <uses-permission android:name=\"$perm\" />" MyWebViewApp/android/app/src/main/AndroidManifest.xml
            fi
          done

      - name: Create custom App.js with WebView
        run: |
          cat > MyWebViewApp/App.js << 'EOF'
          import React from 'react';
          import { SafeAreaView, StatusBar, StyleSheet } from 'react-native';
          import { WebView } from 'react-native-webview';

          const App = () => {
            return (
              <SafeAreaView style={styles.container}>
                <StatusBar barStyle="dark-content" />
                <WebView
                  source={{ uri: 'file:///android_asset/index.html' }}
                  style={styles.webview}
                  javaScriptEnabled={true}
                  domStorageEnabled={true}
                  startInLoadingState={true}
                />
              </SafeAreaView>
            );
          };

          const styles = StyleSheet.create({
            container: { flex: 1 },
            webview: { flex: 1 },
          });

          export default App;
          EOF

      - name: Build Android APK
        run: |
          cd MyWebViewApp/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: MyWebViewApp/android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release (optional)
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: run-${{ github.run_id }}
          name: Build ${{ github.run_id }}
          files: MyWebViewApp/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
