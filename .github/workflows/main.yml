name: Android APK Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Generate a unique version code (e.g., based on run number or timestamp)
      - name: Generate version code
        id: version
        run: |
          # Use GitHub run number as version code (always increments)
          VERSION_CODE=${{ github.run_number }}
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Version code set to $VERSION_CODE"

      # Optional: If you use product flavors, set the flavor here
      # - name: Set build flavor
      #   run: echo "FLAVOR=prod" >> $GITHUB_ENV

      # Build the APK
      - name: Build release APK
        run: |
          # If you have flavors, use assemble${FLAVOR}Release
          ./gradlew assembleRelease \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName="1.0.${{ github.run_number }}"

      # Rename the APK to include version and run details
      - name: Rename APK
        run: |
          ORIGINAL_APK="app/build/outputs/apk/release/app-release.apk"
          # If you use flavors, adjust path accordingly, e.g.:
          # app/build/outputs/apk/prod/release/app-prod-release.apk
          if [ -f "$ORIGINAL_APK" ]; then
            NEW_NAME="app-${GITHUB_RUN_ID}-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
            mv "$ORIGINAL_APK" "app/build/outputs/apk/release/$NEW_NAME"
            echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV
          else
            echo "APK not found at expected path!"
            exit 1
          fi

      # Upload the APK as an artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
