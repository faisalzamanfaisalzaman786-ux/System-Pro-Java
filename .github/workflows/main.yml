name: System-Pro-Structure-Fix

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # یہ لائن بہت ضروری ہے تاکہ گتھب کو لکھنے کی اجازت ملے

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create System-Pro Folders
        run: |
          # پروفیشنل اسٹرکچر بنانا
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          
          # خالی فولڈر گتھب پر نظر نہیں آتے، اس لیے ایک عارضی فائل ڈالنا ضروری ہے
          touch app/src/main/assets/.gitkeep
          touch app/src/main/res/drawable/.gitkeep
          
          echo "Folders created successfully."

      - name: Auto-Move Files
        run: |
          # اگر باہر کوئی HTML یا Image پڑی ہے تو اسے اندر منتقل کرو
          find . -maxdepth 1 -name "*.html" -exec mv {} app/src/main/assets/ \;
          find . -maxdepth 1 -name "*.png" -o -name "*.jpg" | xargs -I {} mv {} app/src/main/res/drawable/ || true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Faisal Zaman"
          git config --global user.email "faisal@example.com"
          git add .
          git commit -m "System Pro: Professional Folder Structure Created" || echo "No changes to commit"
          git push
