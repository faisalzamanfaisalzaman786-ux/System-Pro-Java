# .github/workflows/build-apk.yml
name: Dynamic APK Builder from ZipForge Pro

on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_NAME: ${{ github.event.client_payload.app_name }}
  PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
  ZIP_B64: ${{ github.event.client_payload.zip_data }}
  ANDROID_COMPILE_SDK: 34
  ANDROID_BUILD_TOOLS: 34.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-${{ env.ANDROID_COMPILE_SDK }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Decode and extract source zip
        run: |
          set -e
          mkdir -p input_source
          echo "$ZIP_B64" | base64 -d > project_src.zip
          unzip -q project_src.zip -d input_source
          ls -la input_source/
          if [ ! -f input_source/MainActivity.java ]; then
            echo "❌ MainActivity.java not found!" && exit 1
          fi
          if [ ! -f input_source/activity_main.xml ]; then
            echo "❌ activity_main.xml not found!" && exit 1
          fi

      - name: Create Android project structure with dynamic package
        run: |
          set -e
          PKG="$PACKAGE_NAME"
          if [[ ! "$PKG" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "❌ Invalid package name: $PKG" && exit 1
          fi

          APP_PATH=$(echo "$PKG" | tr '.' '/')
          mkdir -p app/src/main/java/$APP_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-{hdpi,mdpi,xhdpi,xxhdpi,xxxhdpi}

          # MainActivity.java
          cp input_source/MainActivity.java app/src/main/java/$APP_PATH/MainActivity.java
          sed -i "s/^package .*;/package $PKG;/" app/src/main/java/$APP_PATH/MainActivity.java

          # Layout
          cp input_source/activity_main.xml app/src/main/res/layout/activity_main.xml

          # Custom colors.xml to avoid missing attributes
          cat > app/src/main/res/values/colors.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="purple_200">#FFBB86FC</color>
              <color name="purple_500">#FF6200EE</color>
              <color name="purple_700">#FF3700B3</color>
              <color name="teal_200">#FF03DAC5</color>
              <color name="teal_700">#FF018786</color>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
          </resources>
          EOF

          # themes.xml with simple AppCompat theme (no MaterialComponents)
          cat > app/src/main/res/values/themes.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.MyApp" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/purple_500</item>
                  <item name="colorPrimaryDark">@color/purple_700</item>
                  <item name="colorAccent">@color/teal_200</item>
              </style>
          </resources>
          EOF

          # AndroidManifest.xml (remove package attribute, use updated theme)
          if [ -f input_source/AndroidManifest.xml ]; then
            cp input_source/AndroidManifest.xml app/src/main/AndroidManifest.xml
            # Remove package line from manifest tag (keep only xmlns)
            sed -i 's/package="[^"]*"//' app/src/main/AndroidManifest.xml
            # Replace theme with our custom theme
            sed -i 's|android:theme="[^"]*"|android:theme="@style/Theme.MyApp"|' app/src/main/AndroidManifest.xml
            # If no theme line exists, add it
            if ! grep -q "android:theme" app/src/main/AndroidManifest.xml; then
              sed -i 's|<application |<application android:theme="@style/Theme.MyApp" |' app/src/main/AndroidManifest.xml
            fi
            # Ensure label uses APP_NAME if provided
            if [ -n "$APP_NAME" ]; then
              sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/" app/src/main/AndroidManifest.xml
            fi
          else
            cat > app/src/main/AndroidManifest.xml << EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="${APP_NAME:-ZipForgeApp}"
                  android:theme="@style/Theme.MyApp">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

          # Icon if present
          if [ -f input_source/ic_launcher.png ]; then
            for density in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
              cp input_source/ic_launcher.png app/src/main/res/mipmap-$density/ic_launcher.png
            done
          fi

      - name: Generate Gradle build files (without material dependency)
        run: |
          set -e
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          tasks.register('clean', Delete) { delete rootProject.buildDir }
          EOF

          echo 'include ":app"' > settings.gradle

          cat > app/build.gradle << EOF
          plugins { id 'com.android.application' }
          android {
              namespace '$PACKAGE_NAME'
              compileSdk $ANDROID_COMPILE_SDK
              defaultConfig {
                  applicationId "$PACKAGE_NAME"
                  minSdk 21
                  targetSdk $ANDROID_COMPILE_SDK
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          echo "# no rules" > app/proguard-rules.pro

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

      - name: Setup Gradle wrapper (version 8.5)
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build debug APK
        run: |
          set -e
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "${{ env.APP_NAME || 'ZipForgeApp' }} v1.0-${{ github.run_number }}"
          body: |
            🚀 APK built dynamically from ZipForge Pro
            - Package: ${{ env.PACKAGE_NAME }}
            - Triggered by: ZipForge dispatch
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
