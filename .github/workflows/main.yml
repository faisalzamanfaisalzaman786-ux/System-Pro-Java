name: System Pro Enterprise Builder

on:
  repository_dispatch:
    types: [build-from-zip, build-from-b64]

jobs:
  clean-wash-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🧹 Deep Clean Environment
        uses: actions/checkout@v4
        with:
          clean: true # ہر بار پچھلے تمام نشانات مٹانے کے لیے

      - name: ☕ Setup Java 17 (Industry Standard)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🏗️ Atomic Structure Builder (The Wash)
        run: |
          # مکمل صفائی تاکہ کوئی پرانی فائل مداخلت نہ کرے
          rm -rf * 
          
          # آفیشل اینڈرائیڈ سٹرکچر کی تعمیر
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/drawable
          mkdir -p gradle/wrapper

      - name: 🔩 Force Lock Gradle 8.5
        run: |
          cat <<EOF > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: 📥 Source Injection & Decoding
        run: |
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > source.zip
          unzip -o source.zip -d app/src/main/

      - name: 📜 Master Build.gradle (SDK 21-34)
        run: |
          # روٹ لیول کنفیگریشن
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral(); }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
          }
          EOF

          # ایپ لیول کنفیگریشن - مکمل کنٹرول
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace '${{ github.event.client_payload.package_name }}'
              compileSdk 34
              
              defaultConfig {
                  applicationId '${{ github.event.client_payload.package_name }}'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  
                  # NDK اور ABI فلٹرز تاکہ کریش نہ ہو
                  ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: 🛡️ Resource Auto-Correct
        run: |
          # اگر آئیکن غائب ہے تو بلڈ فیل ہونے سے بچائیں
          if [ ! -f "app/src/main/res/mipmap-hdpi/ic_launcher.png" ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAAAAACPAi4CAAAALElEQVRo3u3BAQ0AAADCoPdPbQ8HFAAAAAAAAAAAAAAAAAAAAAAAAAAAAOAPBy4AAf99mZAAAAAASUVORK5CYII=" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi
          
          # پیکیج نیم کا ٹکراؤ ختم کرنا
          find app/src/main/ -name "AndroidManifest.xml" -exec sed -i 's/package="[^"]*"//g' {} +

      - name: 🚀 Turbo Build Execution
        run: |
          touch gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 📦 Delivery
        uses: softprops/action-gh-release@v1
        with:
          tag_name: SystemPro_V${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
