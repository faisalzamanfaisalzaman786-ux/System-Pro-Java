name: System Pro Auto Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Static Project Setup
        run: |
          PKG_NAME="${{ github.event.client_payload.package_name || 'com.torch.systempro' }}"
          echo "Target Package: $PKG_NAME"

          # 1. تمام پرانے کیشے اور فولڈرز کی مکمل صفائی
          rm -rf .gradle build app/build
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/layout/*
          rm -rf app/src/main/res/drawable/*
          rm -rf app/src/main/res/mipmap-*

          # 2. زپ ڈیٹا پروسیسنگ (اگر موجود ہو)
          if [ -n "${{ github.event.client_payload.zip_data }}" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            unzip -o project.zip -d temp_dir/
            
            # امیج فائلز کے نام فکس کرنا
            find temp_dir/src/main/res -type f | while read -r file; do
                new_name=$(echo "$file" | tr ' ' '_' | tr -d '()' | tr '[:upper:]' '[:lower:]')
                mv "$file" "$new_name" 2>/dev/null || true
            done

            # جاوا فائلوں میں پیکیج نیم بدلنا
            find temp_dir/src/main/java -name "*.java" -exec sed -i "s/^package .*;/package $PKG_NAME;/g" {} +
            
            # صحیح فولڈر سٹرکچر بنانا
            PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
            mkdir -p "app/src/main/java/$PKG_PATH"
            find temp_dir/src/main/java -name "*.java" -exec cp {} "app/src/main/java/$PKG_PATH/" \;
            cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
            
            # آئیکن فکس
            mkdir -p app/src/main/res/mipmap-hdpi
            ICON_FILE=$(find app/src/main/res/drawable -name "*.png" | head -n 1)
            if [ -n "$ICON_FILE" ]; then
                cp "$ICON_FILE" app/src/main/res/mipmap-hdpi/ic_launcher.png
                cp "$ICON_FILE" app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            fi
            rm -rf temp_dir project.zip
          fi

          # 3. گریڈل ورژن کو 8.5 پر مجبور کرنا (9.4.1 سے بچنے کے لیے)
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.5

          # 4. بالکل سادہ اور سٹیٹک build.gradle لکھنا
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace "$PKG_NAME"
              compileSdk 34
              defaultConfig {
                  applicationId "$PKG_NAME"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Build APK (Static Mode)
        run: |
          # بغیر کسی اضافی فیچر اور کیشے کے بلڈ کرنا
          ./gradlew clean assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final
          path: app/build/outputs/apk/debug/*.apk
