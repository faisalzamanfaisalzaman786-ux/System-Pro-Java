name: "Ultimate APK Builder (All-In-One)"

on:
  repository_dispatch:
    types: [build-app]
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      # 1. ماحول کی صفائی
      - name: "Full System Cleanup"
        run: |
          rm -rf app/src/main/res/*
          rm -rf app/src/main/java/*
          mkdir -p app/src/main/java/temp_pkg
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/values

      # 2. پے لوڈ انجیکشن (Direct Pipe Injection)
      - name: "Inject Payload Data"
        env:
          JAVA_CODE: ${{ github.event.client_payload.java }}
          XML_LAYOUT: ${{ github.event.client_payload.xml }}
          MANIFEST_XML: ${{ github.event.client_payload.manifest }}
          MENU_XML: ${{ github.event.client_payload.menu }}
        run: |
          echo "$JAVA_CODE" > app/src/main/java/temp_pkg/MainActivity.java
          echo "$XML_LAYOUT" > app/src/main/res/layout/activity_main.xml
          
          if [ -n "$MANIFEST_XML" ]; then
            echo "$MANIFEST_XML" > app/src/main/AndroidManifest.xml
          else
            echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.systempro.app"><application android:label="SystemPro"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          fi
          
          if [ -n "$MENU_XML" ]; then
            echo "$MENU_XML" > app/src/main/res/menu/main_menu.xml
          fi

      # 3. پیکیج سنک اور آٹو نیم اسپیس
      - name: "Detect and Sync Package"
        id: sync
        run: |
          RAW_PKG=$(grep -m 1 "^package " app/src/main/java/temp_pkg/MainActivity.java | sed 's/package //' | sed 's/;//' | xargs)
          if [ -z "$RAW_PKG" ]; then RAW_PKG="com.systempro.app"; fi
          
          PKG_PATH=$(echo "$RAW_PKG" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          mv app/src/main/java/temp_pkg/MainActivity.java "app/src/main/java/$PKG_PATH/"
          rm -rf app/src/main/java/temp_pkg
          
          # XML فکسر
          find app/src/main/res -name "*.xml" -type f | while read file; do
            if grep -q "app:" "$file" && ! grep -q "xmlns:app" "$file"; then
              sed -i 's|\(<[a-zA-Z]\+\)|\1 xmlns:app="http://schemas.android.com/apk/res-auto"|' "$file"
            fi
          done

          echo "PKG=$RAW_PKG" >> $GITHUB_OUTPUT
          echo "APP_NAME=${{ github.event.client_payload.app_name || 'SystemPro' }}" >> $GITHUB_OUTPUT

      # 4. گریڈل 8.5 اور جاوا 17 سیٹ اپ
      - name: "Setup Java & Build Engine"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: "Generate Build Files"
        run: |
          cat > settings.gradle <<EOF
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { 
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() } 
          }
          rootProject.name = "${{ steps.sync.outputs.APP_NAME }}"
          include ':app'
          EOF

          # گریڈل پلگ ان 8.2.2 (Gradle 8.5 کے لیے بہترین ہے)
          cat > build.gradle <<EOF
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          cat > app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace '${{ steps.sync.outputs.PKG }}'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ steps.sync.outputs.PKG }}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildFeatures { viewBinding true }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      # 5. میموری آپٹیمائزیشن اور بلڈ
      - name: "Build APK"
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      # 6. آرٹفیکٹ اپ لوڈ
      - name: "Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sync.outputs.APP_NAME }}
          path: app/build/outputs/apk/debug/*.apk

      # 7. صفائی
      - name: "Post-Build Cleanup"
        if: always()
        run: rm -rf app/build/ .gradle/
