name: System Pro Master APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ایپ کا نام'
        required: true
        default: 'SystemProClock'
      pkg_name:
        description: 'پیکج نیم'
        required: true
        default: 'com.systempro.simple'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout
      uses: actions/checkout@v4

    - name: 2. Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. Clean & Create Folder Structure
      run: |
        # پرانی فائلیں ہٹائیں لیکن gradlew کو نہیں چھوئیں گے
        rm -rf app settings.gradle build.gradle gradle.properties
        PKG_PATH="app/src/main/java/$(echo "${{ github.event.inputs.pkg_name }}" | sed 's/\./\//g')"
        mkdir -p "$PKG_PATH"
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        echo "✅ فولڈر تیار ہے"

    - name: 4. Create Gradle Configuration (with pluginManagement)
      run: |
        # AndroidX support
        cat << EOF > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        # ✅ درست settings.gradle (pluginManagement ضروری)
        cat << EOF > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        include ':app'
        EOF

        # ✅ app/build.gradle (پلگِن کا ورژن شامل)
        cat << EOF > app/build.gradle
        plugins {
            id 'com.android.application' version '8.2.0'
        }

        android {
            namespace '${{ github.event.inputs.pkg_name }}'
            compileSdk 34

            defaultConfig {
                applicationId '${{ github.event.inputs.pkg_name }}'
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName '1.0'
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

    - name: 5. Create MainActivity & Manifest
      run: |
        PKG_PATH="app/src/main/java/$(echo "${{ github.event.inputs.pkg_name }}" | sed 's/\./\//g')"
        
        # MainActivity (ڈائنامک ٹیکسٹ کلاک)
        cat << EOF > "$PKG_PATH/MainActivity.java"
        package ${{ github.event.inputs.pkg_name }};
        import android.os.Bundle;
        import android.view.Gravity;
        import android.widget.LinearLayout;
        import android.widget.TextClock;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                LinearLayout layout = new LinearLayout(this);
                layout.setGravity(Gravity.CENTER);
                layout.setBackgroundColor(0xFF222222);
                TextClock clock = new TextClock(this);
                clock.setTextSize(60);
                clock.setTextColor(0xFF00FF00);
                layout.addView(clock);
                setContentView(layout);
            }
        }
        EOF

        # AndroidManifest.xml
        cat << EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="${{ github.event.inputs.app_name }}" android:allowBackup="true">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: 6. Build APK using existing gradlew
      run: |
        # اگر gradlew موجود نہ ہو تو خود بنا لیں (لیکن ریپوزٹری میں ہونا چاہیے)
        if [ ! -f "gradlew" ]; then
          echo "⚠️ gradlew نہیں ملا، نیا wrapper ڈاؤن لوڈ کیا جا رہا ہے"
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
          echo '#!/bin/bash' > gradlew
          echo 'exec java -cp "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
          chmod +x gradlew
        fi
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: 7. Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name }}
        path: app/build/outputs/apk/debug/app-debug.apk
