name: Setup Physical Structure

on:
  workflow_dispatch: # اسے آپ خود بٹن دبا کر رن کریں گے

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Physical Folders
      run: |
        # بنیادی فولڈرز بنانا
        mkdir -p app/src/main/java/com/systempro/apk
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p gradle/wrapper

        # بنیادی فائلیں بنانا تاکہ سٹرکچر خالی نہ رہے
        echo "include ':app'" > settings.gradle
        echo "android.useAndroidX=true" > gradle.properties
        touch app/src/main/java/com/systempro/apk/.gitkeep
        
        # گریڈل ریپر بنانا (بہت ضروری)
        gradle wrapper --gradle-version 8.5

    - name: Commit Physical Structure
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "Initial Physical Structure for System Pro"
        git push
