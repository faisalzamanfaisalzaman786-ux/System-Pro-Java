name: System Pro Ultimate Auto-Handler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js & JDK
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Intelligent File Router
        run: |
          # 1. ویب فائلوں کو درست جگہ پر منتقل کرنا
          mkdir -p www
          # یہ کمانڈ پوری ریپوزٹری میں HTML/JS/CSS ڈھونڈ کر www میں ڈال دے گی
          find . -maxdepth 2 -name "*.html" -exec mv {} www/ \; || true
          find . -maxdepth 2 -name "*.js" -exec mv {} www/ \; || true
          find . -maxdepth 2 -name "*.css" -exec mv {} www/ \; || true
          
          # 2. کسی بھی اپلوڈ شدہ امیج کو آئیکن بنانا
          IMAGE_FILE=$(find . -maxdepth 1 -name "*.png" -o -name "*.jpg" | head -n 1)
          if [ ! -z "$IMAGE_FILE" ]; then
            echo "Found Image: $IMAGE_FILE, using as Icon."
            cp "$IMAGE_FILE" icon.png
          fi

      - name: Install Capacitor & Fix Package
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets --save-dev
          
          # نیا پیکج نیم (Unique)
          NEW_PKG="com.systempro.app_$(date +'%s')"
          
          # کنفگریشن اپڈیٹ کرنا
          if [ -f "capacitor.config.json" ]; then
            sed -i "s/\"appId\": \".*\"/\"appId\": \"$NEW_PKG\"/g" capacitor.config.json
          fi

          # Capacitor Sync
          npx cap sync android || echo "Sync failed, but continuing..."

          # آئیکن بنانا (اگر امیج موجود ہو)
          if [ -f "icon.png" ]; then
            npx capacitor-assets generate --android || true
          fi

      - name: Force Fix Android Package
        run: |
          NEW_PKG="com.systempro.app_$(date +'%s')"
          # یہ کمانڈ اینڈرائیڈ فولڈر کے اندر گھس کر ہر جگہ نیا پیکج نیم ڈال دے گی
          if [ -d "android" ]; then
            find android -name "build.gradle" -exec sed -i "s/applicationId \".*\"/applicationId \"$NEW_PKG\"/g" {} + || true
            find android -name "AndroidManifest.xml" -exec sed -i "s/package=\".*\"/package=\"$NEW_PKG\"/g" {} + || true
          fi

      - name: Build and Upload APK
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "Android folder not found! Check your capacitor init."
            exit 1
          fi

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SystemPro-Auto-Build
          path: "android/app/build/outputs/apk/release/*.apk"
