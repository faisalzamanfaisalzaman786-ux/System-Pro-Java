name: Ultimate APK Builder (GPS + Notifications + Services)

on:
  repository_dispatch:
    types: [build-app]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/placeholder
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml

      - name: Write MainActivity.java
        run: echo '${{ github.event.client_payload.java }}' > app/src/main/java/com/placeholder/MainActivity.java

      - name: Write activity_main.xml
        run: echo '${{ github.event.client_payload.xml }}' > app/src/main/res/layout/activity_main.xml

      - name: Write AndroidManifest.xml
        run: echo '${{ github.event.client_payload.manifest }}' > app/src/main/AndroidManifest.xml

      - name: Extract package and app name
        id: extract
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          PKG=$(grep -oP 'package="\K[^"]+' $MANIFEST | head -1)
          APP_NAME=$(grep -oP 'android:label="\K[^"]+' $MANIFEST | head -1)
          [ -z "$PKG" ] && PKG="com.example.app"
          [ -z "$APP_NAME" ] && APP_NAME="MyApp"
          echo "PKG=$PKG" >> $GITHUB_OUTPUT
          echo "APP_NAME=$APP_NAME" >> $GITHUB_OUTPUT
          PKG_PATH=$(echo $PKG | tr '.' '/')
          mkdir -p app/src/main/java/$PKG_PATH
          mv app/src/main/java/com/placeholder/MainActivity.java app/src/main/java/$PKG_PATH/

      - name: Write extra resources (styles, colors, strings)
        run: |
          [ -n "${{ github.event.client_payload.styles }}" ] && echo '${{ github.event.client_payload.styles }}' > app/src/main/res/values/styles.xml
          [ -n "${{ github.event.client_payload.colors }}" ] && echo '${{ github.event.client_payload.colors }}' > app/src/main/res/values/colors.xml
          [ -n "${{ github.event.client_payload.strings }}" ] && echo '${{ github.event.client_payload.strings }}' > app/src/main/res/values/strings.xml

      - name: Handle images
        run: |
          if [ -n "${{ github.event.client_payload.images_base64 }}" ]; then
            echo '${{ github.event.client_payload.images_base64 }}' | base64 -d > images.zip
            unzip -o images.zip -d app/src/main/res/
          else
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi

      - name: Auto-detect all dependencies
        id: detect
        run: |
          JAVA_FILE="app/src/main/java/${{ steps.extract.outputs.PKG_PATH }}/MainActivity.java"
          JAVA_CODE=$(cat $JAVA_FILE)
          MANIFEST=$(cat app/src/main/AndroidManifest.xml)

          DEPS="implementation 'androidx.appcompat:appcompat:1.6.1'"
          PLUGINS=""
          MANIFEST_ADD=""

          # Location / GPS
          if echo "$JAVA_CODE" | grep -qi "FusedLocationProviderClient\|LocationManager\|LocationRequest"; then
            DEPS="$DEPS\n    implementation 'com.google.android.gms:play-services-location:21.3.0'"
          fi

          # Notifications (FCM)
          if echo "$JAVA_CODE" | grep -qi "FirebaseMessaging\|RemoteMessage"; then
            DEPS="$DEPS\n    implementation platform('com.google.firebase:firebase-bom:33.1.0')\n    implementation 'com.google.firebase:firebase-messaging'"
            PLUGINS="$PLUGINS\napply plugin: 'com.google.gms.google-services'"
          fi

          # Background Services (WorkManager, Service)
          if echo "$JAVA_CODE" | grep -qi "WorkManager\|Worker\|Service"; then
            DEPS="$DEPS\n    implementation 'androidx.work:work-runtime:2.9.1'"
          fi

          # Camera
          if echo "$MANIFEST" | grep -qi "CAMERA\|camera"; then
            DEPS="$DEPS\n    implementation 'androidx.camera:camera-camera2:1.3.0'\n    implementation 'androidx.camera:camera-lifecycle:1.3.0'"
          fi

          # Storage (Media, Files)
          if echo "$MANIFEST" | grep -qi "READ_EXTERNAL_STORAGE\|WRITE_EXTERNAL_STORAGE"; then
            DEPS="$DEPS\n    implementation 'androidx.documentfile:documentfile:1.0.1'"
          fi

          # Internet / Networking
          if echo "$MANIFEST" | grep -qi "INTERNET"; then
            DEPS="$DEPS\n    implementation 'com.squareup.okhttp3:okhttp:4.12.0'"
            if echo "$JAVA_CODE" | grep -qi "Retrofit"; then
              DEPS="$DEPS\n    implementation 'com.squareup.retrofit2:retrofit:2.11.0'\n    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'"
            fi
          fi

          # Room Database
          if echo "$JAVA_CODE" | grep -qi "RoomDatabase\|@Entity\|@Dao"; then
            DEPS="$DEPS\n    implementation 'androidx.room:room-runtime:2.6.1'\n    annotationProcessor 'androidx.room:room-compiler:2.6.1'"
          fi

          # Firebase Auth / Database (general)
          if echo "$JAVA_CODE" | grep -qi "FirebaseAuth\|FirebaseDatabase"; then
            DEPS="$DEPS\n    implementation platform('com.google.firebase:firebase-bom:33.1.0')\n    implementation 'com.google.firebase:firebase-auth'\n    implementation 'com.google.firebase:firebase-database'"
            PLUGINS="$PLUGINS\napply plugin: 'com.google.gms.google-services'"
          fi

          # Bluetooth
          if echo "$MANIFEST" | grep -qi "BLUETOOTH"; then
            DEPS="$DEPS\n    implementation 'androidx.bluetooth:bluetooth:1.0.0'"
          fi

          # NFC
          if echo "$MANIFEST" | grep -qi "NFC"; then
            DEPS="$DEPS\n    implementation 'androidx.nfc:nfc:1.0.0'"
          fi

          echo "DEPS=$DEPS" >> $GITHUB_OUTPUT
          echo "PLUGINS=$PLUGINS" >> $GITHUB_OUTPUT

      - name: Generate app/build.gradle
        run: |
          cat > app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace '${{ steps.extract.outputs.PKG }}'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ steps.extract.outputs.PKG }}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              ${{ steps.detect.outputs.DEPS }}
          }
          ${{ steps.detect.outputs.PLUGINS }}
          EOF

      - name: Generate top-level build.gradle
        run: |
          cat > build.gradle <<EOF
          plugins {
              id 'com.android.application' version '8.9.0' apply false
          }
          EOF

      - name: Generate settings.gradle
        run: |
          cat > settings.gradle <<EOF
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "UltimateApp"
          include ':app'
          EOF

      - name: Generate gradle.properties
        run: |
          cat > gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk "${{ steps.extract.outputs.APP_NAME }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.extract.outputs.APP_NAME }}
          path: ${{ steps.extract.outputs.APP_NAME }}.apk
