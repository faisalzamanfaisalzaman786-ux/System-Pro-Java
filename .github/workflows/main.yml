name: System Pro Auto-Build (No-Wrapper Fix)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # یہ سٹیپ خودکار طریقے سے گریڈل سیٹ اپ کرے گا چاہے gradlew فائل نہ بھی ہو
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Auto-Gradle
        run: |
          # اگر gradlew نہیں ہے تو براہ راست انسٹال شدہ 'gradle' کمانڈ استعمال کریں
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found, using system gradle..."
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: rm -rf ~/.gradle/caches/
