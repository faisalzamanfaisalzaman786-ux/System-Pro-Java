name: System Pro Universal Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Universal Prepare and Build
        run: |
          RANDOM_ID=$(date +%s | tail -c 4)
          USER_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME="${USER_PKG:-com.systempro.app.v$RANDOM_ID}"
          
          rm -rf .gradle build app/build gradle/ temp_dir/
          mkdir -p app/src/main/java app/src/main/res app/src/main/assets

          if [ -n "${{ github.event.client_payload.zip_data }}" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            unzip -o project.zip -d temp_dir/
            
            if [ -d "temp_dir/src/main/res" ]; then
                cp -rf temp_dir/src/main/res/* app/src/main/res/
            fi

            PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
            mkdir -p "app/src/main/java/$PKG_PATH"
            
            find temp_dir/src/main/java -name "*.java" | while read -r file; do
                sed -i "s/^package .*;/package $PKG_NAME;/g" "$file"
                cp "$file" "app/src/main/java/$PKG_PATH/"
            done

            # Manifest Creation - Fixed Indentation
            cat <<EOF > app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="$PKG_NAME">
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.CAMERA" />
    <uses-feature android:name="android.hardware.camera" android:required="true" />
    <application android:label="System Pro App" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF
          fi

          echo "include ':app'" > settings.gradle

          cat <<EOF > app/build.gradle
plugins { id 'com.android.application' }
android {
    namespace "$PKG_NAME"
    compileSdk 34
    defaultConfig {
        applicationId "$PKG_NAME"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation "androidx.camera:camera-core:1.3.0"
    implementation "androidx.camera:camera-camera2:1.3.0"
    implementation "androidx.camera:camera-lifecycle:1.3.0"
    implementation "androidx.camera:camera-view:1.3.0"
    implementation 'com.google.guava:guava:31.1-android'
}
EOF

          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Universal-APK
          path: app/build/outputs/apk/debug/*.apk
