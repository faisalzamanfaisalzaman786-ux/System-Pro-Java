name: HTML to Android Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create App Structure
        run: |
          # فولڈرز کی درست ترتیب
          mkdir -p src/main/java/com/systempro/app
          mkdir -p src/main/assets
          mkdir -p src/main/res/values

          # HTML فائل کو ایسیٹس میں منتقل کرنا
          if [ -f "index.html" ]; then
            cp index.html src/main/assets/
          else
            echo "<html><body style='text-align:center;'><h1>System Pro Final</h1></body></html>" > src/main/assets/index.html
          fi

          # مینی فیسٹ فائل
          cat <<EOF > src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.systempro.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="System Pro" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # جاوا کوڈ
          cat <<EOF > src/main/java/com/systempro/app/MainActivity.java
          package com.systempro.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

          # ریسورس فائل
          echo '<resources><string name="app_name">System Pro</string></resources>' > src/main/res/values/strings.xml

      - name: Setup Build Configuration
        run: |
          # سنگل ماڈیول build.gradle
          cat <<EOF > build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.systempro.app'
              compileSdk 33
              
              defaultConfig {
                  applicationId "com.systempro.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              sourceSets {
                  main {
                      manifest.srcFile 'src/main/AndroidManifest.xml'
                      java.srcDirs = ['src/main/java']
                      res.srcDirs = ['src/main/res']
                      assets.srcDirs = ['src/main/assets']
                  }
              }
          }

          repositories {
              google()
              mavenCentral()
          }
          EOF

          echo "" > settings.gradle

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2
          arguments: assembleDebug

      - name: Upload Real APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Working-APK
          path: build/outputs/apk/debug/*.apk
