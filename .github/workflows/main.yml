name: System Pro Universal Strong Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [android-studio-build] # HTML میں یہی ٹائپ استعمال ہوئی ہے

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Execute Universal Engine
        run: |
          # 1. پیکیج اور ایپ ڈیٹا حاصل کرنا
          USER_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME="${USER_PKG:-com.system.pro.universal}"
          PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
          
          APP_NAME="${{ github.event.client_payload.app_name }}"
          FINAL_APP_NAME="${APP_NAME:-System Pro App}"
          
          echo "Building: $FINAL_APP_NAME"

          # 2. ڈائریکٹری سٹرکچر کی تیاری
          rm -rf app temp_dir
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # 3. ڈیفالٹ ریسورسز (اگر زپ میں نہ ہوں)
          printf "<resources>\n    <color name=\"colorPrimary\">#2196F3</color>\n    <color name=\"colorPrimaryDark\">#1976D2</color>\n    <color name=\"colorAccent\">#FF4081</color>\n    <color name=\"purple_200\">#FFBB86FC</color>\n</resources>" > app/src/main/res/values/colors.xml
          
          printf "<resources>\n    <style name=\"Theme.SystemPro\" parent=\"Theme.MaterialComponents.Light.NoActionBar\">\n        <item name=\"colorPrimary\">@color/colorPrimary</item>\n        <item name=\"colorPrimaryDark\">@color/colorPrimaryDark</item>\n    </style>\n</resources>" > app/src/main/res/values/styles.xml
          
          printf "<resources>\n    <string name=\"app_name\">$FINAL_APP_NAME</string>\n</resources>" > app/src/main/res/values/strings.xml

          # 4. زپ فائل پروسیسنگ (HTML کے مطابق)
          if [ -n "${{ github.event.client_payload.zip_data }}" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            unzip -o project.zip -d temp_dir/
            
            # زپ سے ریسورسز (Icons, Layouts) کاپی کرنا
            if [ -d "temp_dir/src/main/res" ]; then
              cp -rf temp_dir/src/main/res/* app/src/main/res/
            fi
            
            # مینی فیسٹ فائل کو کاپی کرنا (جو HTML میں ایڈٹ کی گئی ہے)
            if [ -f "temp_dir/src/main/AndroidManifest.xml" ]; then
              mkdir -p app/src/main/
              cp -f temp_dir/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml
            fi
            
            # تمام جاوا فائلز کو نئے پیکیج پاتھ میں منتقل کرنا
            find temp_dir -name "*.java" -exec cp {} "app/src/main/java/$PKG_PATH/" \;
            
            # پیکیج فکسر: فائلز کے اندر پیکیج نیم درست کرنا
            find "app/src/main/java/$PKG_PATH/" -name "*.java" -type f | while read -r file; do
              sed -i "1s|^package .*|package $PKG_NAME;|" "$file"
              sed -i "/import .*\.R;/d" "$file"
              sed -i "/package $PKG_NAME;/a import $PKG_NAME.R;" "$file"
            done
          fi

          # 5. گریڈل کنفیگریشن
          printf "plugins { id 'com.android.application' }\nandroid {\n    namespace '$PKG_NAME'\n    compileSdk 34\n    defaultConfig {\n        applicationId '$PKG_NAME'\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName '1.0'\n        multiDexEnabled true\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'com.google.android.material:material:1.11.0'\n    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'\n}" > app/build.gradle
          
          echo "include ':app'" > settings.gradle
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name || 'System-Pro-Build' }}
          path: app/build/outputs/apk/debug/*.apk
