name: System Pro Auto Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Process Zip Data
        run: |
          # پرانی فائلیں صاف کرنا
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/*
          
          # زپ ڈیٹا کو ڈی کوڈ کرنا (اگر repository_dispatch کے ذریعے آ رہا ہے)
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            mkdir -p temp_dir
            unzip -o project.zip -d temp_dir/
            
            # فائلوں کو درست جگہ منتقل کرنا
            if [ -d "temp_dir/src/main/java" ]; then
              cp -rv temp_dir/src/main/java/* app/src/main/java/ || true
              cp -rv temp_dir/src/main/res/* app/src/main/res/ || true
            else
              cp -rv temp_dir/* app/src/main/ || true
            fi
          fi

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Release
          path: app/build/outputs/apk/debug/*.apk
