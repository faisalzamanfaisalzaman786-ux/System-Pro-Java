name: System Pro Auto Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Workspace
        run: |
          mkdir -p app/src/main/java/com/faisalzar/systempro
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          
          # مینیو فائل کا لازمی فکس
          cat <<EOF > app/src/main/res/menu/main_menu.xml
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android"
                xmlns:app="http://schemas.android.com/apk/res-auto">
              <item android:id="@+id/action_settings" android:title="Settings" app:showAsAction="never" />
          </menu>
          EOF

      - name: Force Gradle Wrapper Version
        # اگر آپ کا ریپوزٹری ورژن 9.4 استعمال کر رہا ہے، تو اسے 8.5 پر لانا بہتر ہے
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew wrapper --gradle-version 8.5
          fi

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx2048m -Dorg.gradle.jvmargs=-Xmx2048m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Release
          path: app/build/outputs/apk/debug/*.apk
