name: HTML to Android Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android Project
        run: |
          # فولڈرز بنائیں
          mkdir -p app/src/main/java/com/systempro/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          # اپنی HTML فائل کاپی کریں
          if [ -f "index.html" ]; then
            cp index.html app/src/main/assets/
          else
            echo "<html><body><h1>System Pro V2 Ready</h1></body></html>" > app/src/main/assets/index.html
          fi

          # اینڈرائیڈ مینی فیسٹ
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.systempro.app">
              <application android:label="System Pro" android:theme="@android:style/Theme.NoTitleBar" android:icon="@android:drawable/sym_def_app_icon">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # جاوا کوڈ
          cat <<EOF > app/src/main/java/com/systempro/app/MainActivity.java
          package com.systempro.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView wv = new WebView(this);
                  wv.getSettings().setJavaScriptEnabled(true);
                  wv.setWebViewClient(new WebViewClient());
                  wv.loadUrl("file:///android_asset/index.html");
                  setContentView(wv);
              }
          }
          EOF

          echo '<resources><string name="app_name">System Pro</string></resources>' > app/src/main/res/values/strings.xml

      - name: Setup Gradle Files
        run: |
          cat <<EOF > settings.gradle
          include ':app'
          rootProject.name = "System-Pro-v2"
          EOF

          cat <<EOF > build.gradle
          plugins {
              id 'com.android.application' version '8.1.1' apply false
          }
          EOF

          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.systempro.app'
              compileSdk 33
              defaultConfig {
                  applicationId "com.systempro.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final-Package
          path: app/build/outputs/apk/debug/*.apk
