name: Build Android APK (System Pro Fix)

on:
  push:
    branches: [ "main", "master" ]
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # اگر gradlew فائل موجود ہے تو اسے پرمیشن دیں، ورنہ یہ اسٹیپ سکپ ہو جائے گا
    - name: Grant Execute Permission
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
        elif [ -f "app/gradlew" ]; then
          chmod +x app/gradlew
        else
          echo "gradlew not found in root or app folder"
        fi

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        else
          # اگر فائل کسی اور فولڈر میں ہے تو وہاں جا کر چلائیں
          cd $(find . -name gradlew -exec dirname {} \;) && ./gradlew assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: System-Pro-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"

    - name: Cleanup Environment
      if: always()
      run: rm -rf ~/.gradle/caches/
