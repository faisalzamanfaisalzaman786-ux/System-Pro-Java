        name: Prepare and Build
        run: |
          PKG_NAME="${{ github.event.client_payload.package_name || 'com.faisal.systempro' }}"
          
          rm -rf .gradle build app/build
          rm -rf app/src/main/java/* app/src/main/res/drawable/* app/src/main/res/mipmap-*

          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java

          if [ -n "${{ github.event.client_payload.zip_data }}" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            unzip -o project.zip -d temp_dir/
            
            find temp_dir/src/main/res -type f | while read -r file; do
                new_name=$(echo "$file" | tr ' ' '_' | tr -d '()' | tr '[:upper:]' '[:lower:]')
                if [ "$file" != "$new_name" ]; then
                    mv "$file" "$new_name" 2>/dev/null || true
                fi
            done
            
            find temp_dir/src/main/java -name "*.java" -exec sed -i "s/^package .*;/package $PKG_NAME;/g" {} +
            
            PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
            mkdir -p "app/src/main/java/$PKG_PATH"
            find temp_dir/src/main/java -name "*.java" -exec cp {} "app/src/main/java/$PKG_PATH/" \;
            cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
          fi

          # فکس: یہاں 'cp' کا ایرر ختم کیا گیا ہے
          ICON_FOUND=$(find app/src/main/res -name "ic_launcher.png" | head -n 1)
          TARGET_ICON="app/src/main/res/mipmap-hdpi/ic_launcher.png"

          if [ -n "$ICON_FOUND" ]; then
              if [ "$ICON_FOUND" != "$TARGET_ICON" ]; then
                  cp "$ICON_FOUND" "$TARGET_ICON"
              fi
          else
              touch "$TARGET_ICON"
          fi

          cat <<EOF > settings.gradle
          rootProject.name = "System Pro"
          include ':app'
          EOF

          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <application 
                  android:label="System Pro" 
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace "$PKG_NAME"
              compileSdk 34
              defaultConfig {
                  applicationId "$PKG_NAME"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              def camerax_version = "1.3.0"
              implementation "androidx.camera:camera-core:\${camerax_version}"
              implementation "androidx.camera:camera-camera2:\${camerax_version}"
              implementation "androidx.camera:camera-lifecycle:\${camerax_version}"
              implementation "androidx.camera:camera-view:\${camerax_version}"
              implementation 'com.google.guava:guava:31.1-android'
          }
          EOF

          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon
