name: System Pro Titan Master Build
on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  GRADLE_VERSION: 8.5
  AGP_VERSION: 8.1.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Total Purge & Force Package Sync
        run: |
          # مکمل صفائی
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/*
          
          ZIP_DATA="${{ github.event.client_payload.zip_data }}"
          if [ ! -z "$ZIP_DATA" ]; then
            echo "$ZIP_DATA" | tr -d '\n\r ' | base64 -d > project.zip
            unzip -o project.zip -d temp_files || true
            
            # پیکیج نیم نکالیں (com.system.pro3 وغیرہ)
            RAW_PKG=$(grep "package " temp_files/MainActivity.java | head -n 1 | cut -d' ' -f2 | tr -d ';')
            if [ -z "$RAW_PKG" ]; then RAW_PKG="com.system.pro"; fi
            echo "FINAL_PKG=$RAW_PKG" >> $GITHUB_ENV
            
            # نیا سٹرکچر بنائیں
            PKG_PATH=$(echo $RAW_PKG | tr '.' '/')
            mkdir -p app/src/main/java/$PKG_PATH
            mkdir -p app/src/main/res/layout
            mkdir -p app/src/main/res/values
            mkdir -p app/src/main/res/drawable
            mkdir -p app/src/main/res/mipmap-anydpi-v26
            mkdir -p app/src/main/res/mipmap-hdpi
            
            # فائلیں کاپی کریں
            cp -f temp_files/MainActivity.java app/src/main/java/$PKG_PATH/ || true
            cp -f temp_files/activity_main.xml app/src/main/res/layout/ || true
            
            # پیکیج اور امپورٹس فکس کریں
            sed -i "s/package .*;/package $RAW_PKG;/g" app/src/main/java/$PKG_PATH/MainActivity.java
            sed -i "s/import .*\.R;/import $RAW_PKG.R;/g" app/src/main/java/$PKG_PATH/MainActivity.java
            
            # فیل سیف آئیکن (ic_launcher fix)
            if [ -f temp_files/ic_launcher.png ]; then
              cp -f temp_files/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            else
              # اگر آئیکن غائب ہے تو ایک سادہ رنگ والا آئیکن خود بنائیں
              echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#00FFCC" android:pathData="M0,0h108v108h-108z"/></vector>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            fi
            
            # ضروری اسٹائلز
            echo '<resources><style name="ShapeAppearance"/></resources>' > app/src/main/res/values/styles.xml
          fi

      - name: Generate Fixed Manifest
        run: |
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="System Pro"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name="${{ env.FINAL_PKG }}.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Master Build Engine
        run: |
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:${{ env.AGP_VERSION }}' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          echo 'include ":app"' > settings.gradle
          
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace '${{ env.FINAL_PKG }}'
              compileSdk 34
              defaultConfig {
                  applicationId "${{ env.FINAL_PKG }}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Execute Clean Build
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip
          unzip -q gradle-${{ env.GRADLE_VERSION }}-bin.zip
          ./gradle-${{ env.GRADLE_VERSION }}/bin/gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Deliver Final APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_PKG }}-Build
          path: app/build/outputs/apk/debug/*.apk
