name: System Pro Final Verified Build

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # سیکیورٹی کے لیے پرمیشنز سیٹ کرنا بہتر ہے
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Verified)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build with System Gradle
        run: |
          # اگر gradlew فائل موجود ہے تو اسے استعمال کریں، ورنہ سسٹم کا گریڈل انسٹال کریں
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradlew not found. Installing and using system gradle..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle assembleDebug --stacktrace
          fi

      - name: Verify and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7

      - name: Final Cleanup
        if: always()
        run: rm -rf ~/.gradle/caches/
