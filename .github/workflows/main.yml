name: System Pro Auto Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Process Zip Data
        run: |
          # ضروری فولڈرز بنانا
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            mkdir -p temp_dir
            unzip -o project.zip -d temp_dir/
            
            if [ -d "temp_dir/app/src/main/java" ]; then
              cp -rf temp_dir/app/src/main/java/* app/src/main/java/ || true
              cp -rf temp_dir/app/src/main/res/* app/src/main/res/ || true
            elif [ -d "temp_dir/src/main/java" ]; then
              cp -rf temp_dir/src/main/java/* app/src/main/java/ || true
              cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
            else
              cp -rf temp_dir/* app/src/main/ || true
            fi
            rm -rf temp_dir project.zip
          fi

      - name: Fix Menu Resource Error
        run: |
          # مینیو فائل کو درست نیم اسپیس کے ساتھ دوبارہ لکھنا تاکہ AttributePrefixUnbound ایرر نہ آئے
          cat <<EOF > app/src/main/res/menu/main_menu.xml
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android"
                xmlns:app="http://schemas.android.com/apk/res-auto">
              <item
                  android:id="@+id/action_settings"
                  android:title="Settings"
                  android:orderInCategory="100"
                  app:showAsAction="never" />
          </menu>
          EOF

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        # 'clean' کا استعمال پرانے کیشے اور ایررز کو ختم کر دے گا
        run: ./gradlew clean assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Release
          path: app/build/outputs/apk/debug/*.apk
