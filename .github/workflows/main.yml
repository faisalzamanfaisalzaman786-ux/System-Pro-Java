name: System Pro Final Fixed

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Full Application Structure
        run: |
          mkdir -p app/src/main/java/com/systempro/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat <<EOF > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"><title>System Pro V2</title></head>
          <body style="background:#000;color:#fff;text-align:center;margin-top:30vh;">
            <h1>SYSTEM PRO V2</h1>
            <p>Build Verified & Assets Included</p>
          </body>
          </html>
          EOF

          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/webview"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          EOF

          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.systempro.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="System Pro"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<EOF > app/src/main/java/com/systempro/app/MainActivity.java
          package com.systempro.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  WebView webView = findViewById(R.id.webview);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          cat <<EOF > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">System Pro</string>
          </resources>
          EOF

      - name: Create Gradle Build Scripts
        run: |
          echo "include ':app'" > settings.gradle
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.systempro.app'
              compileSdk 33
              buildToolsVersion "33.0.1"

              defaultConfig {
                  applicationId "com.systempro.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Clean Previous Build
        run: gradle clean

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Inspect Intermediate Resources
        run: |
          echo "=== Compiled resources (res) ==="
          find app/build/intermediates -type d -name "res" | head -5
          echo "=== Merged assets ==="
          find app/build/intermediates -type f -name "index.html" 2>/dev/null || echo "index.html not found in intermediates"

      - name: Inspect APK Contents
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -f "$APK_PATH" ]; then
            echo "=== APK Size ==="
            ls -lh "$APK_PATH"
            echo "=== APK Contents (first 40 lines) ==="
            unzip -l "$APK_PATH" | head -40
            echo "=== Check assets in APK ==="
            unzip -l "$APK_PATH" | grep "assets/" || echo "No assets/ directory found in APK!"
            echo "=== Check layout in APK ==="
            unzip -l "$APK_PATH" | grep "res/layout/" || echo "No layout resources found in APK!"
          else
            echo "ERROR: APK not found!"
            exit 1
          fi

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final
          path: app/build/outputs/apk/debug/*.apk
