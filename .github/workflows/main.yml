name: System Pro Master APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ایپ کا نام'
        required: true
        default: 'System Pro App'
      pkg_name:
        description: 'پیکج نیم'
        required: true
        default: 'com.systempro.apk'
      java_code:
        description: 'MainActivity.java کا مکمل کوڈ'
        required: true
      xml_code:
        description: 'activity_main.xml کا مکمل کوڈ'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Faisal Folder Structure
      run: |
        # پیکج نیم سے فولڈر پاتھ بنانا
        PKG_PATH=$(echo "${{ github.event.inputs.pkg_name }}" | tr '.' '/')
        mkdir -p app/src/main/java/$PKG_PATH
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p gradle/wrapper

    - name: Generate Build Configurations
      run: |
        echo "android.useAndroidX=true" > gradle.properties
        echo "include ':app'" > settings.gradle
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        cat << EOF > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace '${{ github.event.inputs.pkg_name }}'
            compileSdk 34
            defaultConfig {
                applicationId '${{ github.event.inputs.pkg_name }}'
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName '1.0'
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

    - name: Write User Files (Secure Mode)
      env:
        JAVA_DATA: ${{ github.event.inputs.java_code }}
        XML_DATA: ${{ github.event.inputs.xml_code }}
      run: |
        PKG_PATH=$(echo "${{ github.event.inputs.pkg_name }}" | tr '.' '/')
        
        # جاوا فائل لکھنا
        echo "$JAVA_DATA" > app/src/main/java/$PKG_PATH/MainActivity.java
        
        # XML فائل لکھنا (محفوظ طریقے سے)
        echo "$XML_DATA" > app/src/main/res/layout/activity_main.xml

        # ریسورسز بنانا
        echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">${{ github.event.inputs.app_name }}</string></resources>' > app/src/main/res/values/strings.xml
        echo '<?xml version="1.0" encoding="utf-8"?><resources><style name="Theme.SystemPro" parent="Theme.MaterialComponents.DayNight.NoActionBar"></style></resources>' > app/src/main/res/values/themes.xml

    - name: Generate Manifest
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:theme="@style/Theme.SystemPro">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Setup Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5

    - name: Build APK
      run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name }}
        path: app/build/outputs/apk/debug/app-debug.apk
