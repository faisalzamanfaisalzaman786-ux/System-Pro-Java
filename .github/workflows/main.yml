name: System Pro Titan Master Build
on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  GRADLE_VERSION: 8.5
  AGP_VERSION: 8.1.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dynamic Payload Processing
        run: |
          rm -rf app/src/main/java
          rm -rf app/src/main/res
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res
          
          ZIP_DATA="${{ github.event.client_payload.zip_data }}"
          if [ ! -z "$ZIP_DATA" ]; then
            echo "$ZIP_DATA" | tr -d '\n\r ' | base64 -d > project.zip
            unzip -o project.zip -d temp_src || true
            
            if [ -d temp_src/app/src/main/java ]; then
              cp -rf temp_src/app/src/main/java/* app/src/main/java/
            fi
            
            if [ -d temp_src/app/src/main/res ]; then
              cp -rf temp_src/app/src/main/res/* app/src/main/res/
            fi
            
            if [ -f temp_src/app/src/main/AndroidManifest.xml ]; then
              cp -f temp_src/app/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml
            fi
          fi

      - name: Build Engine
        run: |
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:${{ env.AGP_VERSION }}' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          echo 'include ":app"' > settings.gradle
          
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.systempro.master'
              compileSdk 34
              defaultConfig {
                  applicationId "com.systempro.master"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: Execute Assembly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip
          unzip -q gradle-${{ env.GRADLE_VERSION }}-bin.zip
          ./gradle-${{ env.GRADLE_VERSION }}/bin/gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SystemPro-Dynamic-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
