name: System Pro Titan Master Build
on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  COMPILE_SDK: 34
  TARGET_SDK: 34
  MIN_SDK: 21
  GRADLE_VERSION: 8.5
  AGP_VERSION: 8.1.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Initialize Centralized Structure
        run: |
          mkdir -p app/src/main/java/com/systempro/master
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout

      - name: Inject Master Resources & Fix Missing Assets
        run: |
          curl -Lo app/src/main/res/mipmap-hdpi/ic_launcher.png https://raw.githubusercontent.com/google/material-design-icons/master/png/action/settings/android/res/mipmap-hdpi/ic_launcher_settings_white_24dp.png
          
          echo '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#22FFFFFF"/><corners android:radius="8dp"/><stroke android:width="1dp" android:color="#44FFFFFF"/></shape>' > app/src/main/res/drawable/edittext_background.xml
          echo '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#22FFFFFF"/><corners android:radius="8dp"/></shape>' > app/src/main/res/drawable/spinner_background.xml

          echo '<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.SystemPro" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="colorPrimary">#FF00E5FF</item>
                  <item name="colorSecondary">#FF00FF00</item>
                  <item name="android:statusBarColor">#000000</item>
              </style>
          </resources>' > app/src/main/res/values/themes.xml

          echo '<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="System Pro"
                  android:theme="@style/Theme.SystemPro">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>' > app/src/main/AndroidManifest.xml

      - name: Decode and Extract Source
        run: |
          ZIP_DATA="${{ github.event.client_payload.zip_data }}"
          if [ ! -z "$ZIP_DATA" ]; then
            echo "$ZIP_DATA" | tr -d '\n\r ' | base64 -d > project.zip
            unzip -o project.zip -d temp_src || true
            cp -rf temp_src/app/src/main/java/* app/src/main/java/ || true
            cp -rf temp_src/app/src/main/res/layout/* app/src/main/res/layout/ || true
            if [ -f temp_src/app/src/main/AndroidManifest.xml ]; then
              cp -f temp_src/app/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml
            fi
          fi

      - name: Centralized Dependency Engine
        run: |
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:${{ env.AGP_VERSION }}' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          echo 'include ":app"' > settings.gradle

          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { 
            namespace 'com.systempro.master'
            compileSdk ${{ env.COMPILE_SDK }}
            defaultConfig { 
              applicationId 'com.systempro.master'
              minSdk ${{ env.MIN_SDK }}
              targetSdk ${{ env.TARGET_SDK }}
              versionCode 1
              versionName '1.0'
            }
            buildFeatures { viewBinding true }
            configurations.all { 
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
            }
          }" >> app/build.gradle

          echo "dependencies { 
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.camera:camera-camera2:1.3.0'
            implementation 'androidx.camera:camera-lifecycle:1.3.0'
            implementation 'androidx.camera:camera-view:1.3.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'com.google.guava:guava:31.1-android'
          }" >> app/build.gradle
          
          echo 'android.useAndroidX=true' > gradle.properties
          echo 'android.enableJetifier=true' >> gradle.properties

      - name: Build System Pro APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip
          unzip -q gradle-${{ env.GRADLE_VERSION }}-bin.zip
          ./gradle-${{ env.GRADLE_VERSION }}/bin/gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload System Pro Output
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Titan-Build
          path: app/build/outputs/apk/debug/*.apk

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "System Pro Titan V1400"
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
