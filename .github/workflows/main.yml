name: System Pro Ultimate - Auto Repair & Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Deep Cleanup
        run: |
          rm -rf .gradle build app/build
          # پرانی تمام گریڈل فائلز ہٹا دیں تاکہ نئی بن سکیں
          rm -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Physically Generate Gradle Wrapper
        # یہ مرحلہ 'gradlew' فائل کو خود پیدا کرے گا
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: 5. Final Build
        run: |
          ./gradlew clean assembleDebug --no-build-cache --stacktrace

      - name: 6. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V8-Fixed
          path: app/build/outputs/apk/debug/*.apk
