name: System Pro Master APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ایپ کا نام'
        required: true
      pkg_name:
        description: 'پیکج نیم (مثلاً com.systempro.apk)'
        required: true
      java_code_base64:
        description: 'Java Code (Base64 میں)'
        required: true
      xml_code_base64:
        description: 'XML Code (Base64 میں)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout
      uses: actions/checkout@v4

    - name: 2. Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. Wipe Old Files & Setup Structure
      run: |
        # پرانی فائلوں کا مکمل خاتمہ
        rm -rf app settings.gradle build.gradle gradlew gradlew.bat gradle .gradle
        
        PKG_PATH=$(echo "${{ github.event.inputs.pkg_name }}" | sed 's/\./\//g')
        mkdir -p app/src/main/java/$PKG_PATH
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # Base64 ڈیکوڈ کرنا
        echo "${{ github.event.inputs.java_code_base64 }}" | base64 --decode > app/src/main/java/$PKG_PATH/MainActivity.java
        echo "${{ github.event.inputs.xml_code_base64 }}" | base64 --decode > app/src/main/res/layout/activity_main.xml

    - name: 4. Create Project Files
      run: |
        # settings.gradle
        cat << EOF > settings.gradle
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
        }
        include ':app'
        EOF

        # app/build.gradle
        cat << EOF > app/build.gradle
        plugins { id 'com.android.application' version '8.2.0' }
        android {
            namespace '${{ github.event.inputs.pkg_name }}'
            compileSdk 34
            defaultConfig {
                applicationId '${{ github.event.inputs.pkg_name }}'
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName '1.0'
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

        # Strings & Manifest
        echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">${{ github.event.inputs.app_name }}</string></resources>' > app/src/main/res/values/strings.xml
        cat << EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="@string/app_name" android:allowBackup="true" android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: 5. Generate Wrapper & Build
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: 6. Deliver APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name }}
        path: app/build/outputs/apk/debug/app-debug.apk
