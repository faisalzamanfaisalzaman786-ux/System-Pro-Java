name: Build Signed AAB for Play Store

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ایپ کا نام'
        required: true
        default: 'System Pro'
      package_name:
        description: 'پیکیج کا نام'
        required: true
        default: 'com.systempro.app'
      app_url:
        description: 'ویب سائٹ کا لنک (اگر ہو، ورنہ خالی چھوڑ دیں)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Cordova project
        run: |
          cordova create app "${{ github.event.inputs.package_name }}" "${{ github.event.inputs.app_name }}"
          cd app
          cordova platform add android

      - name: Prepare web content (Picking from Workflows)
        run: |
          cat > prepare_content.sh << 'EOF'
          #!/bin/bash
          set -e
          
          TARGET_DIR="app/www"
          rm -rf "$TARGET_DIR"/*

          # 1. اگر صارف نے URL دیا ہو تو اسے استعمال کریں
          if [ -n "$1" ]; then
            echo "Downloading from URL: $1"
            wget -r -np -nH --cut-dirs=1 -P "$TARGET_DIR" "$1"
          
          # 2. اگر ورک فلو فولڈر میں Index.html موجود ہو (جیسا کہ آپ کی تصویر میں ہے)
          elif [ -f ".github/workflows/Index.html" ]; then
            echo "Index.html found in workflows folder. Copying..."
            cp ".github/workflows/Index.html" "$TARGET_DIR/index.html"
            
            # اگر وہاں کوئی CSS یا JS فائلز بھی ہوں تو وہ بھی کاپی ہو جائیں گی
            cp .github/workflows/*.css "$TARGET_DIR/" 2>/dev/null || true
            cp .github/workflows/*.js "$TARGET_DIR/" 2>/dev/null || true
          
          # 3. اگر کچھ نہ ملے تو یہ ڈیفالٹ میسج دکھائے
          else
            echo "No file found. Creating fallback HTML."
            echo "<html><body><h1 style='text-align:center;'>System Pro Ready</h1></body></html>" > "$TARGET_DIR/index.html"
          fi
          EOF
          chmod +x prepare_content.sh
          ./prepare_content.sh "${{ github.event.inputs.app_url }}"

      - name: Configure AndroidManifest
        run: |
          cd app/platforms/android/app/src/main
          sed -i '/<application / s|>| android:usesCleartextTraffic="true">|' AndroidManifest.xml

      - name: Build release AAB
        run: |
          cd app
          cordova build android --release -- --packageType=bundle

      - name: Sign AAB
        run: |
          # سائننگ کا عمل یہاں جاری رہے گا جیسا کہ پہلے تھا
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
              -keystore keystore.jks \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
              app/platforms/android/app/build/outputs/bundle/release/app-release.aab \
              "${{ secrets.KEY_ALIAS }}"
          else
            echo "No secrets found. Skipping signing."
          fi

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: system-pro-v2-aab
          path: app/platforms/android/app/build/outputs/bundle/release/app-release.aab
