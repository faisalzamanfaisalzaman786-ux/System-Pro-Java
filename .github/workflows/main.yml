name: HTML to Android Final Fixed

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/systempro/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # HTML File
          echo "<html><body style='background:#121212;color:white;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;'><div><h1>System Pro V2</h1><p>Build Successful with Gradle 8.2</p></div></body></html>" > app/src/main/assets/index.html

          # Layout
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/webview"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          EOF

          # Manifest
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.systempro.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="System Pro" android:theme="@android:style/Theme.NoTitleBar" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Java MainActivity
          cat <<EOF > app/src/main/java/com/systempro/app/MainActivity.java
          package com.systempro.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  WebView wv = findViewById(R.id.webview);
                  wv.getSettings().setJavaScriptEnabled(true);
                  wv.getSettings().setDomStorageEnabled(true);
                  wv.setWebViewClient(new WebViewClient());
                  wv.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          echo '<resources><string name="app_name">System Pro</string></resources>' > app/src/main/res/values/strings.xml

      - name: Generate Build Configuration
        run: |
          cat <<EOF > settings.gradle
          include ':app'
          EOF

          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.systempro.app'
              compileSdk 33
              defaultConfig {
                  applicationId "com.systempro.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2 # آپ کی تجویز کے مطابق 8.2 پر فکس کر دیا گیا ہے

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Verify and Inspect
        run: |
          echo "Checking APK Size..."
          ls -lh app/build/outputs/apk/debug/*.apk
          echo "Verifying Assets..."
          unzip -l app/build/outputs/apk/debug/*.apk | grep "index.html"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final
          path: app/build/outputs/apk/debug/*.apk
