name: Build System Pro APK

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Save payload data
        run: |
          echo '${{ toJSON(github.event.client_payload) }}' > payload.json
          APP_NAME=$(jq -r '.app_name // "SystemPro"' payload.json)
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "PACKAGE_NAME=com.systempro.app" >> $GITHUB_ENV

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/systempro/app
          mkdir -p app/src/main/res/values

          # 1. gradle.properties (AndroidX fix)
          cat > gradle.properties <<EOF
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          EOF

          # 2. build.gradle (Project level)
          cat > build.gradle <<EOF
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { 
                  classpath 'com.android.tools.build:gradle:8.2.0'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # 3. app/build.gradle (JVM target fix)
          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.systempro.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.systempro.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          # 4. AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="$APP_NAME" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. MainActivity.kt
          cat > app/src/main/java/com/systempro/app/MainActivity.kt <<EOF
          package com.systempro.app
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.webkit.WebView
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val web = WebView(this)
                  web.loadUrl("https://google.com")
                  setContentView(web)
              }
          }
          EOF

          echo "include ':app'" > settings.gradle

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: SystemPro-APK
          path: app/build/outputs/apk/debug/*.apk
