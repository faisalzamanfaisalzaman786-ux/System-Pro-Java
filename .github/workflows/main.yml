name: "Ultimate APK Builder (All-In-One)"

on:
  repository_dispatch:
    types: [build-app]
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      # 1. فولڈر اسٹرکچر تیار کرنا
      - name: "Initialize Project Folders"
        run: |
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

      # 2. پے لوڈ ڈیٹا کو فائلز میں محفوظ کرنا
      - name: "Inject Payload Data"
        id: prep
        run: |
          PKG="${{ github.event.client_payload.package_name || 'com.systempro.app' }}"
          APP_NAME="${{ github.event.client_payload.app_name || 'SystemPro' }}"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"

          # Java File کو محفوظ کرنا
          cat <<'EOF' > "app/src/main/java/$PKG_PATH/MainActivity.java"
          ${{ github.event.client_payload.java }}
          EOF

          # XML Layout کو محفوظ کرنا
          cat <<'EOF' > app/src/main/res/layout/activity_main.xml
          ${{ github.event.client_payload.xml }}
          EOF

          # Manifest کو محفوظ کرنا
          cat <<'EOF' > app/src/main/AndroidManifest.xml
          ${{ github.event.client_payload.manifest }}
          EOF

          # Colors اور Styles (صرف تب لکھے گا جب ڈیٹا موجود ہو)
          if [ -n "${{ github.event.client_payload.colors }}" ]; then
            echo "${{ github.event.client_payload.colors }}" > app/src/main/res/values/colors.xml
          fi

          if [ -n "${{ github.event.client_payload.styles }}" ]; then
            echo "${{ github.event.client_payload.styles }}" > app/src/main/res/values/styles.xml
          fi

          # تمام جاوا فائلز میں پیکیج کا نام آٹو اپڈیٹ کرنا
          find app/src/main/java -name "*.java" -exec sed -i "s/package .*;/package $PKG;/" {} \;
          
          echo "PKG=$PKG" >> $GITHUB_OUTPUT
          echo "APP_NAME=$APP_NAME" >> $GITHUB_OUTPUT

      # 3. گریڈل فائلز تیار کرنا (Dependencies کے ساتھ)
      - name: "Generate Build Files"
        run: |
          # ڈیپنڈینسیز اگر پے لوڈ میں نہ ہوں تو ڈیفالٹ استعمال ہوں گی
          DEPS="${{ github.event.client_payload.dependencies }}"
          if [ -z "$DEPS" ]; then
            DEPS="implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'com.google.android.material:material:1.11.0'"
          fi

          cat > build.gradle <<EOF
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF

          cat > settings.gradle <<EOF
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { 
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() } 
          }
          include ':app'
          EOF

          cat > app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace '${{ steps.prep.outputs.PKG }}'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ steps.prep.outputs.PKG }}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildFeatures { viewBinding true }
          }
          dependencies {
              $DEPS
          }
          EOF

      # 4. جاوا سیٹ اپ (JDK 17)
      - name: "Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. بلڈ پروسیس
      - name: "Build APK"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 6. آرٹفیکٹ اپ لوڈ (APK Download)
      - name: "Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.APP_NAME }}
          path: app/build/outputs/apk/debug/*.apk

      # 7. صفائی (Post-Build Cleanup)
      - name: "Post-Build Cleanup"
        if: always()
        run: |
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/layout/*
          rm -rf app/src/main/res/values/*
          rm -rf app/build/
          rm -rf .gradle/
          echo "Cleanup finished successfully."
