name: Auto Build APK from Three Files

on:
  repository_dispatch:
    types: [build-from-three-files]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project structure
        run: |
          mkdir -p app/src/main/java/com/example/myapp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/values

      - name: Write Java file
        run: echo '${{ github.event.client_payload.java_code }}' > app/src/main/java/com/example/myapp/MainActivity.java

      - name: Write XML layout
        run: echo '${{ github.event.client_payload.xml_layout }}' > app/src/main/res/layout/activity_main.xml

      - name: Write AndroidManifest
        run: echo '${{ github.event.client_payload.manifest }}' > app/src/main/AndroidManifest.xml

      - name: Create dummy icon (1x1 pixel)
        run: |
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Create build.gradle (app level)
        run: |
          cat > app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.myapp'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.myapp'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      - name: Create top-level build.gradle
        run: |
          cat > build.gradle <<EOF
          plugins {
              id 'com.android.application' version '8.9.0' apply false
          }
          EOF

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<EOF
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AutoBuilder"
          include ':app'
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
