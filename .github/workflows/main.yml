name: "Ultimate APK Builder (Locked Edition)"

on:
  repository_dispatch:
    types: [build-app] # فرنٹ اینڈ کے ایونٹ سے میچ کرنا ضروری ہے

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Environment Reset"
        run: |
          rm -rf app
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable-xxhdpi

      - name: "Decode and Extract Payload"
        id: sync
        env:
          ZIP_DATA: ${{ github.event.client_payload.zip_data }}
        run: |
          echo "$ZIP_DATA" | base64 -d > payload.zip
          unzip payload.zip -d extracted_data/
          cp extracted_data/MainActivity.java app/src/main/java/temp_main.java
          cp extracted_data/activity_main.xml app/src/main/res/layout/activity_main.xml
          cp extracted_data/AndroidManifest.xml app/src/main/AndroidManifest.xml

          RAW_PKG=$(grep -m 1 "^package " app/src/main/java/temp_main.java | sed 's/package //' | sed 's/;//' | xargs)
          if [ -z "$RAW_PKG" ]; then RAW_PKG="${{ github.event.client_payload.package_name }}"; fi
          
          python3 -c "import re; data = open('app/src/main/AndroidManifest.xml').read(); cleaned = re.sub(r'package=\"[^\"]*\"', '', data); open('app/src/main/AndroidManifest.xml', 'w').write(cleaned)"

          PKG_PATH=$(echo "$RAW_PKG" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          mv app/src/main/java/temp_main.java "app/src/main/java/$PKG_PATH/MainActivity.java"

          echo "PKG=$RAW_PKG" >> $GITHUB_OUTPUT
          echo "APP_NAME=${{ github.event.client_payload.app_name }}" >> $GITHUB_OUTPUT

      - name: "Generate Build Config"
        run: |
          cat > settings.gradle <<EOF
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { 
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() } 
          }
          rootProject.name = "${{ steps.sync.outputs.APP_NAME }}"
          include ':app'
          EOF

          cat > build.gradle <<EOF
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          cat > app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace '${{ steps.sync.outputs.PKG }}'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ steps.sync.outputs.PKG }}'
                  minSdk 24
                  targetSdk 34
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: "Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: "Force Lock Gradle 8.5 & Build"
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: "Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sync.outputs.APP_NAME }}
          path: app/build/outputs/apk/debug/*.apk
