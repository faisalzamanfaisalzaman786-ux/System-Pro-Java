name: Build System Pro (Final Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ایپ کا نام'
        required: true
        default: 'System Pro'
      package_name:
        description: 'پیکیج آئی ڈی'
        required: true
        default: 'com.systempro.app'
      icon_base64:
        description: 'آئیکن کا Base64 کوڈ'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Cordova project
        run: |
          APP_NAME="${{ github.event.inputs.app_name || 'SystemPro' }}"
          PKG_NAME="${{ github.event.inputs.package_name || 'com.systempro.app' }}"
          cordova create app "$PKG_NAME" "$APP_NAME"
          cd app
          cordova platform add android
          sed -i "s/id=\"[^\"]*\"/id=\"$PKG_NAME\"/" config.xml
          sed -i "s|<name>.*</name>|<name>$APP_NAME</name>|" config.xml

      - name: Handle Custom Icon
        run: |
          RAW_DATA="${{ github.event.inputs.icon_base64 }}"
          if [ -n "$RAW_DATA" ]; then
            CLEAN_DATA=$(echo "$RAW_DATA" | sed 's/^data:image\/[^;]*;base64,//')
            echo "$CLEAN_DATA" | base64 -d > app/www/icon.png
            cd app
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' config.xml
          fi

      - name: Prepare web content
        run: |
          TARGET_DIR="app/www"
          find "$TARGET_DIR" -type f ! -name 'icon.png' -delete
          if [ -f ".github/workflows/Index.html" ]; then
            cp ".github/workflows/Index.html" "$TARGET_DIR/index.html"
          fi

      - name: Build Release APK
        run: |
          cd app
          cordova build android --release -- --packageType=apk

      - name: Sign APK (Strong Fix)
        run: |
          UNSIGNED_APK="app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app-aligned.apk"
          FINAL_APK="SystemPro-Final.apk"
          BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
          
          # 1. Zipalign
          $BUILD_TOOLS/zipalign -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          
          # 2. Key Generation (اگر سیکرٹس نہ ہوں تو)
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Generating temporary key for testing..."
            keytool -genkey -v -keystore test.keystore -alias testkey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Test"
            $BUILD_TOOLS/apksigner sign --ks test.keystore --ks-pass pass:123456 --out "$FINAL_APK" "$ALIGNED_APK"
          else
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my.keystore
            $BUILD_TOOLS/apksigner sign --ks my.keystore --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" --ks-key-alias "${{ secrets.KEY_ALIAS }}" --out "$FINAL_APK" "$ALIGNED_APK"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "${{ github.event.inputs.app_name }}-APK"
          path: SystemPro-Final.apk
