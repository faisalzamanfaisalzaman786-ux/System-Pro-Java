name: System Pro Ultimate Fix

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Wrapper and Build
        run: |
          # گریڈل انسٹال کریں اگر ضرورت ہو
          sudo apt-get update && sudo apt-get install -y gradle
          
          # ریپر جنریٹ کریں تاکہ پروجیکٹ کے مطابق ورژن سیٹ ہو جائے
          gradle wrapper
          chmod +x gradlew
          
          # اب بلڈ شروع کریں
          ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final
          path: "**/build/outputs/apk/debug/*.apk"

      - name: Cleanup
        if: always()
        run: rm -rf ~/.gradle/caches/
