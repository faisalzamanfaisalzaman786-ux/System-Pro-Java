name: System Pro Smart Studio Build

on:
  repository_dispatch:
    types: [build-apk] # آپ کی ایپ یہی ایونٹ ٹریگر کر رہی ہے

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Folder Structure & Inject Data
        run: |
          # 1. پروفیشنل اینڈرائیڈ اسٹرکچر بنانا
          mkdir -p app/src/main/assets/www
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          
          # 2. ایپ سے آنے والا HTML محفوظ کرنا
          echo "${{ github.event.client_payload.app_html }}" > app/src/main/assets/www/index.html
          
          # 3. اگر امیج (Icon) آیا ہے تو اسے سیٹ کرنا
          if [ ! -z "${{ github.event.client_payload.app_icon }}" ]; then
            echo "${{ github.event.client_payload.app_icon }}" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

      - name: Handle Permissions (Dynamic)
        run: |
          # ایپ سے آنے والی پرمیشنز کو AndroidManifest میں شامل کرنا
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            for perm in ${{ join(github.event.client_payload.permissions, ' ') }}; do
              sed -i "/<\/manifest>/i <uses-permission android:name=\"$perm\" />" $MANIFEST
            done
          fi

      - name: Auto Rename Package
        run: |
          # ہر بلڈ کے لیے نیا پیکج نیم
          NEW_PKG="com.systempro.app_$(date +'%s')"
          find . -name "build.gradle" -exec sed -i "s/applicationId \".*\"/applicationId \"$NEW_PKG\"/g" {} + || true

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: run-${{ github.run_id }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
