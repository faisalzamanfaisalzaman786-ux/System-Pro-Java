name: Build System Pro (Crash Fixed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ایپ کا نام'
        required: true
        default: 'System Pro'
      package_name:
        description: 'پیکیج آئی ڈی'
        required: true
        default: 'com.systempro.app'
      icon_base64:
        description: 'آئیکن کا Base64 کوڈ'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Cordova project
        run: |
          APP_NAME="${{ github.event.inputs.app_name || 'SystemPro' }}"
          PKG_NAME="${{ github.event.inputs.package_name || 'com.systempro.app' }}"
          cordova create app "$PKG_NAME" "$APP_NAME"
          cd app
          cordova platform add android
          # Config.xml کی بنیادی ترتیبات
          sed -i "s/id=\"[^\"]*\"/id=\"$PKG_NAME\"/" config.xml
          sed -i "s|<name>.*</name>|<name>$APP_NAME</name>|" config.xml

      - name: Handle Custom Icon
        run: |
          RAW_DATA="${{ github.event.inputs.icon_base64 }}"
          if [ -n "$RAW_DATA" ]; then
            CLEAN_DATA=$(echo "$RAW_DATA" | sed 's/^data:image\/[^;]*;base64,//')
            echo "$CLEAN_DATA" | base64 -d > app/www/icon.png
            cd app
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' config.xml
          fi

      - name: Prepare Web Content (Anti-Crash Fix)
        run: |
          TARGET_DIR="app/www"
          # صرف انڈیکس فائل کو تبدیل کریں، کورڈووا کی اپنی ضروری فائلوں کو نہ چھیڑیں
          if [ -f ".github/workflows/Index.html" ]; then
            # اپنی انڈیکس فائل کاپی کریں لیکن اس بات کو یقینی بنائیں کہ وہ لوکل فائلوں کو سپورٹ کرے
            cp ".github/workflows/Index.html" "$TARGET_DIR/index.html"
            # سی ایس ایس اور جے ایس فائلیں اگر موجود ہوں
            cp .github/workflows/*.css "$TARGET_DIR/" 2>/dev/null || true
            cp .github/workflows/*.js "$TARGET_DIR/" 2>/dev/null || true
          fi

      - name: Configure AndroidManifest & Network Security
        run: |
          cd app/platforms/android/app/src/main
          # نیٹ ورک ٹریفک اور کریش سے بچاؤ کی سیٹنگز
          sed -i '/<application / s|>| android:usesCleartextTraffic="true" android:hardwareAccelerated="true">|' AndroidManifest.xml

      - name: Build and Sign APK
        run: |
          cd app
          cordova build android --release -- --packageType=apk
          
          UNSIGNED_APK="platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="../app-aligned.apk"
          FINAL_APK="../SystemPro-Final.apk"
          BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
          
          # Zipalign
          $BUILD_TOOLS/zipalign -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          
          # Signing (Debug Key for immediate fix)
          keytool -genkey -v -keystore test.keystore -alias testkey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Test"
          $BUILD_TOOLS/apksigner sign --ks test.keystore --ks-pass pass:123456 --out "$FINAL_APK" "$ALIGNED_APK"

      - name: Upload Fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: "${{ github.event.inputs.app_name }}-Fixed"
          path: SystemPro-Final.apk
