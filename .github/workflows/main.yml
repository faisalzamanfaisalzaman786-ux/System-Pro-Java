name: System Pro Enterprise Builder

on:
  repository_dispatch:
    types: [build-from-zip, build-from-b64]

jobs:
  clean-wash-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🧹 Deep Clean Environment
        uses: actions/checkout@v4
        with:
          clean: true # یہ گٹ ہب کا آفیشل طریقہ ہے کلین واش کرنے کا

      - name: ☕ Setup Java 17 (Official Standard)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # یہ بلڈ کو تیز کرے گا لیکن ڈیٹا مکس نہیں ہونے دے گا

      - name: 🏗️ Atomic Structure Builder (The "Wash" Step)
        run: |
          # مکمل صفائی
          rm -rf * 
          
          # اینڈرائیڈ کا سٹینڈرڈ سٹرکچر دوبارہ کھڑا کرنا
          mkdir -p app/src/main/java/com/system/pro
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/drawable
          mkdir -p gradle/wrapper

      - name: 🔩 Force Stable Gradle 8.5 & Wrapper
        run: |
          cat <<EOF > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: 📥 Project Data Injection
        run: |
          # آپ کی UI سے آنے والا ڈیٹا ڈی کوڈ کریں
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > source.zip
          unzip -o source.zip -d app/src/main/

      - name: 📜 Master Build.gradle Configuration (SDK 21-34)
        run: |
          # روٹ لیول بلڈ فائل
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral(); }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
          }
          EOF

          # ایپ لیول بلڈ فائل - یہاں SDK لاک کر دی گئی ہے
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace '${{ github.event.client_payload.package_name }}'
              compileSdk 34
              
              defaultConfig {
                  applicationId '${{ github.event.client_payload.package_name }}'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  
                  # NDK اور ABI فلٹرز تاکہ سائز کم رہے اور کریش نہ ہو
                  ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: 🛡️ Auto-Correction Engine
        run: |
          # اگر آئیکن غائب ہے تو خود بخود بنانا (تاکہ AAPT2 فیل نہ ہو)
          if [ ! -f "app/src/main/res/mipmap-hdpi/ic_launcher.png" ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAAAAACPAi4CAAAALElEQVRo3u3BAQ0AAADCoPdPbQ8HFAAAAAAAAAAAAAAAAAAAAAAAAAAAAOAPBy4AAf99mZAAAAAASUVORK5CYII=" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi
          
          # پیکیج نیم کی خودکار درستگی
          find app/src/main/ -name "AndroidManifest.xml" -exec sed -i 's/package="[^"]*"//g' {} +

      - name: 🚀 Turbo Build Execution
        run: |
          # گریڈل کو ایگزیکیوٹیبل بنانا
          touch gradlew
          chmod +x gradlew
          # کلین بلڈ رن کرنا
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 📦 Deliver Artifact
        uses: softprops/action-gh-release@v1
        with:
          tag_name: SystemPro_V${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
