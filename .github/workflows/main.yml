name: Build System Pro (APK with Custom Icon)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ایپ کا نام'
        required: true
        default: 'System Pro'
      package_name:
        description: 'پیکیج آئی ڈی'
        required: true
        default: 'com.systempro.app'
      icon_base64:
        description: 'آئیکن کا Base64 کوڈ یہاں پیسٹ کریں (اختیاری)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Cordova project
        run: |
          APP_NAME="${{ github.event.inputs.app_name || 'SystemPro' }}"
          PKG_NAME="${{ github.event.inputs.package_name || 'com.systempro.app' }}"
          
          cordova create app "$PKG_NAME" "$APP_NAME"
          cd app
          cordova platform add android
          
          # Config.xml میں نام اور آئی ڈی سیٹ کریں
          sed -i "s/id=\"[^\"]*\"/id=\"$PKG_NAME\"/" config.xml
          sed -i "s|<name>.*</name>|<name>$APP_NAME</name>|" config.xml

      - name: Handle Custom Icon (Base64)
        run: |
          ICON_DATA="${{ github.event.inputs.icon_base64 }}"
          if [ -n "$ICON_DATA" ]; then
            echo "Custom icon found. Converting Base64 to image..."
            # Base64 کو تصویر میں تبدیل کر کے app/www/icon.png کے طور پر محفوظ کرنا
            echo "$ICON_DATA" | base64 -d > app/www/icon.png
            
            # config.xml میں آئیکن کا ٹیگ شامل کرنا
            cd app
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' config.xml
          else
            echo "No custom icon provided. Using default."
          fi

      - name: Prepare web content
        run: |
          TARGET_DIR="app/www"
          # صرف index.html وغیرہ صاف کریں، icon.png کو محفوظ رکھیں
          find "$TARGET_DIR" -type f ! -name 'icon.png' -delete
          
          if [ -f ".github/workflows/Index.html" ]; then
            cp ".github/workflows/Index.html" "$TARGET_DIR/index.html"
            cp .github/workflows/*.css "$TARGET_DIR/" 2>/dev/null || true
            cp .github/workflows/*.js "$TARGET_DIR/" 2>/dev/null || true
          else
            echo "<html><body style='text-align:center;'><h1>System Pro Ready</h1></body></html>" > "$TARGET_DIR/index.html"
          fi

      - name: Configure AndroidManifest
        run: |
          cd app/platforms/android/app/src/main
          sed -i '/<application / s|>| android:usesCleartextTraffic="true">|' AndroidManifest.xml

      - name: Build APK Only
        run: |
          cd app
          cordova build android --release -- --packageType=apk

      - name: Sign APK
        run: |
          APK_PATH="app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
              -keystore keystore.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
              "$APK_PATH" \
              "${{ secrets.KEY_ALIAS }}"
            mv "$APK_PATH" app-release-signed.apk
          else
            mv "$APK_PATH" app-testing.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ github.event.inputs.app_name }}-APK"
          path: |
            app-release-signed.apk
            app-testing.apk
