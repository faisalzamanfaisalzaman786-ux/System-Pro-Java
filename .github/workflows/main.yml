name: Build Capacitor WebView APK

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Create Capacitor app
        run: |
          npm init @capacitor/app@latest MyApp -- --package-id=com.myapp --app-name=MyApp
          cd MyApp
          npm install @capacitor/android

      - name: Copy HTML to www
        run: |
          cat << 'EOF' > MyApp/www/index.html
          ${{ github.event.client_payload.app_html }}
          EOF

      - name: Set app name and package
        run: |
          APP_NAME='${{ github.event.client_payload.app_name }}'
          cd MyApp
          # Update capacitor.config.json
          sed -i "s/\"appName\": \".*\"/\"appName\": \"$APP_NAME\"/" capacitor.config.json
          
          # Generate package name from app name
          CLEAN_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g' | cut -c1-30)
          PACKAGE_NAME="com.${CLEAN_NAME}"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          
          # Update capacitor config with package id
          sed -i "s/\"appId\": \".*\"/\"appId\": \"$PACKAGE_NAME\"/" capacitor.config.json

      - name: Add icon if provided
        run: |
          ICON_BASE64='${{ github.event.client_payload.app_icon }}'
          if [ -n "$ICON_BASE64" ]; then
            echo "$ICON_BASE64" | base64 -d > app_icon.png
            cd MyApp
            npx capacitor-assets generate --iconBackgroundColor "#A52A2A" --iconBackgroundColorDark "#A52A2A"
          fi

      - name: Add Android platform
        run: |
          cd MyApp
          npx cap add android
          npx cap sync android

      - name: Set package name in Android files
        run: |
          cd MyApp/android
          sed -i "s/applicationId \".*\"/applicationId \"$PACKAGE_NAME\"/" app/build.gradle
          sed -i "s/package=\".*\"/package=\"$PACKAGE_NAME\"/" app/src/main/AndroidManifest.xml

      - name: Add permissions
        run: |
          PERMISSIONS_STR='${{ github.event.client_payload.permissions }}'
          echo "$PERMISSIONS_STR" | jq -r '.[]' | while read perm; do
            if [ -n "$perm" ]; then
              sed -i "/<\/manifest>/i <uses-permission android:name=\"$perm\" />" MyApp/android/app/src/main/AndroidManifest.xml
            fi
          done

      - name: Build APK
        run: |
          cd MyApp/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: MyApp/android/app/build/outputs/apk/release/*.apk
