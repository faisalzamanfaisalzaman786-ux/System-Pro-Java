name: Build and Auto-Rename APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto Rename Package & Prepare Data
        run: |
          # موجودہ وقت کے حساب سے نیا پیکج نیم بنانا
          NEW_PKG="com.systempro.app_$(date +'%Y%m%d%H%M%S')"
          echo "Building with New Package: $NEW_PKG"
          
          # فائلز کے پاتھ کو آپ کی ریپوزٹری کے مطابق سیٹ کرنا
          # یہاں ہم build.gradle اور Manifest دونوں میں تبدیلی کر رہے ہیں
          find . -name "build.gradle" -exec sed -i "s/applicationId \".*\"/applicationId \"$NEW_PKG\"/g" {} +
          find . -name "AndroidManifest.xml" -exec sed -i "s/package=\".*\"/package=\"$NEW_PKG\"/g" {}+

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SystemPro-Release
          path: app/build/outputs/apk/release/*.apk
