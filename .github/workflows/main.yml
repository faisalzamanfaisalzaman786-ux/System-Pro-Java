name: Dynamic APK Builder from ZipForge Pro
on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  COMPILE_SDK: 34
  BUILD_TOOLS: 34.0.0
  MIN_SDK: 21
  TARGET_SDK: 34
  GRADLE_VERSION: 8.5
  AGP_VERSION: 8.1.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-${{ env.COMPILE_SDK }} build-tools;${{ env.BUILD_TOOLS }}"
          accept-android-sdk-licenses: true

      - name: Decode and Extract ZIP
        run: |
          ZIP_DATA="${{ github.event.client_payload.zip_data }}"
          if [ -z "$ZIP_DATA" ]; then echo "❌ No zip_data"; exit 1; fi
          mkdir -p android_project
          cd android_project
          echo "$ZIP_DATA" | tr -d '\n\r ' | base64 -d > project.zip
          unzip -o project.zip
          rm project.zip

      - name: Prepare Android Project
        working-directory: ./android_project
        run: |
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          [ -z "$PACKAGE_NAME" ] && PACKAGE_NAME="com.zipforge.app"
          APP_NAME="${{ github.event.client_payload.app_name }}"
          [ -z "$APP_NAME" ] && APP_NAME="ZipForge"

          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
          if [ -d "src/main" ]; then
            cp -rf src/main/* app/src/main/
          fi

          PKG_PATH=$(echo $PACKAGE_NAME | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          find app/src/main/java -name "*.java" -type f -exec mv {} "app/src/main/java/$PKG_PATH/" \; 2>/dev/null || true

          find "app/src/main/java/$PKG_PATH" -name "*.java" -type f | while read file; do
            sed -i "1s/^package .*;/package $PACKAGE_NAME;/" "$file"
          done

          # یہاں ہم نے layout بنانے کا طریقہ بدل دیا ہے تاکہ EOF کا مسئلہ نہ آئے
          echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/res/layout/activity_main.xml
          echo '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center">' >> app/src/main/res/layout/activity_main.xml
          echo '<Button android:id="@+id/mainButton" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Click Me" />' >> app/src/main/res/layout/activity_main.xml
          echo '</LinearLayout>' >> app/src/main/res/layout/activity_main.xml

          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i "s/package=\"[^\"]*\"/package=\"$PACKAGE_NAME\"/" app/src/main/AndroidManifest.xml
          fi

      - name: Generate Gradle Files
        working-directory: ./android_project
        run: |
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          [ -z "$PACKAGE_NAME" ] && PACKAGE_NAME="com.zipforge.app"
          
          # Gradle files creation without complex EOF
          printf "buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { classpath 'com.android.tools.build:gradle:${{ env.AGP_VERSION }}' }\n}\nallprojects {\n    repositories { google(); mavenCentral() }\n}" > build.gradle
          echo 'include ":app"' > settings.gradle
          
          printf "plugins { id 'com.android.application' }\nandroid {\n    namespace '$PACKAGE_NAME'\n    compileSdk ${{ env.COMPILE_SDK }}\n    defaultConfig {\n        applicationId '$PACKAGE_NAME'\n        minSdk ${{ env.MIN_SDK }}\n        targetSdk ${{ env.TARGET_SDK }}\n        versionCode 1\n        versionName '1.0'\n    }\n}\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'com.google.android.material:material:1.9.0'\n}" > app/build.gradle
          
          echo 'org.gradle.jvmargs=-Xmx2048m' > gradle.properties
          echo 'android.useAndroidX=true' >> gradle.properties

      - name: Setup Gradle Wrapper
        working-directory: ./android_project
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip
          unzip -q gradle-${{ env.GRADLE_VERSION }}-bin.zip
          export PATH=$PWD/gradle-${{ env.GRADLE_VERSION }}/bin:$PATH
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew

      - name: Build APK
        working-directory: ./android_project
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_project/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "System Pro Build ${{ github.run_id }}"
          files: android_project/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
