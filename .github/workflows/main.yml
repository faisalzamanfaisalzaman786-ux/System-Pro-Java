name: System Pro Build Fixed

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Project Structure
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

      - name: Handle Payload
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "${{ github.event.client_payload.app_html }}" > app/src/main/assets/index.html
          echo "${{ github.event.client_payload.app_name }}" > app_name.txt
          echo "${{ github.event.client_payload.permissions }}" > permissions.txt
          if [ -n "${{ github.event.client_payload.app_icon }}" ]; then
            echo "${{ github.event.client_payload.app_icon }}" | base64 --decode > app/src/main/res/drawable/ic_launcher.png
          fi

      - name: Create Base Files
        run: |
          # Default files if missing
          [ ! -s app/src/main/assets/index.html ] && echo "<h1>System Pro Ready</h1>" > app/src/main/assets/index.html
          APP_NAME=$(cat app_name.txt 2>/dev/null || echo "System Pro")
          PACKAGE_NAME="com.systempro.app$(date +%s)"
          
          # 1. AndroidManifest.xml
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="$PACKAGE_NAME">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="$APP_NAME" android:icon="@drawable/ic_launcher" android:theme="@style/Theme.AppCompat.Light.DarkActionBar" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 2. MainActivity.java
          PKG_PATH=$(echo $PACKAGE_NAME | tr . /)
          mkdir -p app/src/main/java/$PKG_PATH
          cat <<EOF > app/src/main/java/$PKG_PATH/MainActivity.java
          package $PACKAGE_NAME;
          import android.os.Bundle;
          import android.webkit.*;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  setContentView(webView);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface public void openSettings() { /* Logic */ }
                  }, "Android");
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Build Assets
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "rootProject.name='System Pro'" > settings.gradle
          echo "include ':app'" >> settings.gradle
          
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.systempro.generated'
              compileSdk 34
              defaultConfig { applicationId 'com.systempro.generated'; minSdk 24; targetSdk 34; versionCode 5; versionName '1.5' }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

      - name: Assemble APK
        run: |
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleDebug --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2
          path: app/build/outputs/apk/debug/*.apk
