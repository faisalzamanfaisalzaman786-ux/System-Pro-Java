name: System Pro - Maven Sync Fix

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  sync-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Nuclear Cleanup & Repo Sync
        run: |
          rm -rf .gradle build app/build
          
          # 1. پروجیکٹ لیول build.gradle (ریپوزٹریز کا صحیح آرڈر)
          cat <<EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://plugins.gradle.org/m2/" }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }
          EOF

          # 2. settings.gradle (نئے گریڈل کے لیے لازمی سیٹنگ)
          cat <<EOF > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'
          EOF

      - name: 4. Build with Full Logs
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          # --stacktrace ہمیں اصل ایرر کی جڑ تک لے جائے گا
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 5. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V8-Final
          path: app/build/outputs/apk/debug/*.apk
