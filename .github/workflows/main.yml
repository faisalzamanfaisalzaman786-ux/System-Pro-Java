name: System Pro Master APK Builder

on:
  workflow_dispatch: # Manual trigger as seen in your image

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Optimizes speed for large Java files

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build with Powerful Memory Allocation
        # Use -Xmx to give the engine more RAM for large XML/Java processing
        run: ./gradlew assembleDebug --stacktrace --info -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload System Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Master-Build
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
