name: System Pro - Dynamic APK Builder

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]

concurrency:
  group: build-apk-single
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare directories
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

      - name: Process client payload (HTML, icon, permissions)
        if: github.event_name == 'repository_dispatch'
        run: |
          # Debug: Show what we received
          echo "=== DEBUG: Checking client_payload ==="
          if [ -n "${{ github.event.client_payload.app_html_base64 }}" ]; then
            echo "app_html_base64 length: ${#app_html_base64}"
            # Save raw base64 to file for inspection
            echo "${{ github.event.client_payload.app_html_base64 }}" > /tmp/raw_base64.txt
            # Decode
            cat /tmp/raw_base64.txt | base64 --decode > app/src/main/assets/index.html
            if [ $? -eq 0 ]; then
              echo "✅ HTML decoded successfully, size: $(wc -c < app/src/main/assets/index.html) bytes"
            else
              echo "❌ Failed to decode Base64"
              exit 1
            fi
          else
            echo "⚠️ No app_html_base64 provided"
          fi

          if [ -n "${{ github.event.client_payload.app_icon }}" ]; then
            echo "app_icon length: ${#app_icon}"
            printf '%s' "${{ github.event.client_payload.app_icon }}" | base64 --decode > app/src/main/res/drawable/ic_launcher.png
            echo "✅ Icon decoded"
          fi

          if [ -n "${{ github.event.client_payload.permissions }}" ]; then
            echo "Permissions: ${{ github.event.client_payload.permissions }}"
            printf '%s' "${{ github.event.client_payload.permissions }}" > permissions.txt
          fi

          # Debug: Show first 200 chars of decoded HTML
          if [ -f app/src/main/assets/index.html ]; then
            echo "=== First 200 chars of index.html ==="
            head -c 200 app/src/main/assets/index.html
            echo ""
          fi

      - name: Provide default HTML, icon, permissions if missing (only for non-dispatch triggers)
        if: github.event_name != 'repository_dispatch'
        run: |
          if [ ! -s app/src/main/assets/index.html ]; then
            printf '%s' "" | base64 --decode > app/src/main/assets/index.html
            echo "Default HTML created"
          fi
          ICON_PATH="app/src/main/res/drawable/ic_launcher.png"
          if [ ! -f "$ICON_PATH" ] || [ $(wc -c < "$ICON_PATH") -lt 100 ]; then
            printf '%s' "iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAABmJLR0QA/wD/AP+gvaeTAAAAAXRSTlMAQObYZgAAAAlwSFlzAAAOxAAADsQBlSsOGwAAABlJREFUaN7t0DEBAAAAg6D7vzQNwAMtBAAAnwP9AABYF2RJAAAAAElFTkSuQmCC" | base64 --decode > "$ICON_PATH"
            echo "Default icon created"
          fi
          if [ ! -f permissions.txt ]; then
            echo "android.permission.INTERNET,android.permission.ACCESS_NETWORK_STATE" > permissions.txt
          fi

      - name: Clean previous builds
        run: rm -rf .gradle build app/build gradlew gradlew.bat gradle/

      - name: Create gradle.properties
        run: |
          printf '%s\n' "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          printf '%s\n' "android.useAndroidX=true" >> gradle.properties
          printf '%s\n' "android.enableJetifier=true" >> gradle.properties

      - name: Create project build.gradle
        run: |
          printf '%s\n' "buildscript {" > build.gradle
          printf '%s\n' "    repositories {" >> build.gradle
          printf '%s\n' "        google()" >> build.gradle
          printf '%s\n' "        mavenCentral()" >> build.gradle
          printf '%s\n' "    }" >> build.gradle
          printf '%s\n' "    dependencies {" >> build.gradle
          printf '%s\n' "        classpath 'com.android.tools.build:gradle:8.2.2'" >> build.gradle
          printf '%s\n' "    }" >> build.gradle
          printf '%s\n' "}" >> build.gradle
          printf '%s\n' "allprojects {" >> build.gradle
          printf '%s\n' "    repositories {" >> build.gradle
          printf '%s\n' "        google()" >> build.gradle
          printf '%s\n' "        mavenCentral()" >> build.gradle
          printf '%s\n' "    }" >> build.gradle
          printf '%s\n' "}" >> build.gradle

      - name: Create settings.gradle
        run: |
          printf '%s\n' "pluginManagement {" > settings.gradle
          printf '%s\n' "    repositories {" >> settings.gradle
          printf '%s\n' "        google()" >> settings.gradle
          printf '%s\n' "        mavenCentral()" >> settings.gradle
          printf '%s\n' "        gradlePluginPortal()" >> settings.gradle
          printf '%s\n' "    }" >> settings.gradle
          printf '%s\n' "}" >> settings.gradle
          printf '%s\n' "dependencyResolutionManagement {" >> settings.gradle
          printf '%s\n' "    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)" >> settings.gradle
          printf '%s\n' "    repositories {" >> settings.gradle
          printf '%s\n' "        google()" >> settings.gradle
          printf '%s\n' "        mavenCentral()" >> settings.gradle
          printf '%s\n' "    }" >> settings.gradle
          printf '%s\n' "}" >> settings.gradle
          printf '%s\n' "rootProject.name = \"System Pro\"" >> settings.gradle
          printf '%s\n' "include ':app'" >> settings.gradle

      - name: Create app build.gradle with dynamic namespace
        run: |
          if [ -n "${{ github.event.client_payload.app_name }}" ]; then
            APP_NAME="${{ github.event.client_payload.app_name }}"
          else
            APP_NAME="System Pro"
          fi
          PACKAGE_BASE=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')
          PACKAGE_NAME="com.systempro.${PACKAGE_BASE}"
          echo "Using package name: $PACKAGE_NAME"

          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34

              defaultConfig {
                  applicationId "$PACKAGE_NAME"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable true
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: Create AndroidManifest.xml with dynamic permissions
        run: |
          if [ -n "${{ github.event.client_payload.app_name }}" ]; then
            APP_NAME="${{ github.event.client_payload.app_name }}"
          else
            APP_NAME="System Pro"
          fi
          PERMISSIONS=$(cat permissions.txt 2>/dev/null | tr ',' '\n' || echo "")

          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
          printf '%s\n' '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' >> app/src/main/AndroidManifest.xml
          printf '%s\n' '    <uses-permission android:name="android.permission.INTERNET" />' >> app/src/main/AndroidManifest.xml
          printf '%s\n' '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' >> app/src/main/AndroidManifest.xml

          for perm in $PERMISSIONS; do
            if [ -n "$perm" ]; then
              printf '    <uses-permission android:name="%s" />\n' "$perm" >> app/src/main/AndroidManifest.xml
            fi
          done

          cat >> app/src/main/AndroidManifest.xml << EOF

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="$APP_NAME"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

      - name: Create MainActivity.java with dynamic package
        run: |
          if [ -n "${{ github.event.client_payload.app_name }}" ]; then
            APP_NAME="${{ github.event.client_payload.app_name }}"
          else
            APP_NAME="System Pro"
          fi
          PACKAGE_BASE=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')
          PACKAGE_NAME="com.systempro.${PACKAGE_BASE}"
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')
          mkdir -p "app/src/main/java/$PACKAGE_PATH"

          cat > "app/src/main/java/$PACKAGE_PATH/MainActivity.java" << EOF
          package $PACKAGE_NAME;

          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.net.Uri;
          import android.content.Intent;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webview);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowContentAccess(true);
                  webView.getSettings().setAllowFileAccessFromFileURLs(true);
                  webView.getSettings().setAllowUniversalAccessFromFileURLs(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback,
                                                       FileChooserParams fileChooserParams) {
                          MainActivity.this.filePathCallback = filePathCallback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          startActivityForResult(intent, FILE_CHOOSER_REQUEST_CODE);
                          return true;
                      }

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      if (resultCode == RESULT_OK && data != null) {
                          Uri[] uris = new Uri[]{data.getData()};
                          filePathCallback.onReceiveValue(uris);
                      } else {
                          filePathCallback.onReceiveValue(null);
                      }
                      filePathCallback = null;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }
          }
          EOF

      - name: Create activity_main.xml
        run: |
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/res/layout/activity_main.xml
          printf '%s\n' '<WebView xmlns:android="http://schemas.android.com/apk/res/android"' >> app/src/main/res/layout/activity_main.xml
          printf '%s\n' '    android:id="@+id/webview"' >> app/src/main/res/layout/activity_main.xml
          printf '%s\n' '    android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
          printf '%s\n' '    android:layout_height="match_parent" />' >> app/src/main/res/layout/activity_main.xml

      - name: Create minimal styles.xml
        run: |
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/res/values/styles.xml
          printf '%s\n' '<resources>' >> app/src/main/res/values/styles.xml
          printf '%s\n' '    <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light">' >> app/src/main/res/values/styles.xml
          printf '%s\n' '        <item name="windowActionBar">false</item>' >> app/src/main/res/values/styles.xml
          printf '%s\n' '        <item name="windowNoTitle">true</item>' >> app/src/main/res/values/styles.xml
          printf '%s\n' '    </style>' >> app/src/main/res/values/styles.xml
          printf '%s\n' '</resources>' >> app/src/main/res/values/styles.xml

      - name: Generate gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.5 --distribution-type all
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Get APK size
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(stat -c%s "$APK_PATH")
            echo "APK size: $APK_SIZE bytes ($(($APK_SIZE / 1024)) KB)"
          else
            echo "APK not found!"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-App
          path: app/build/outputs/apk/debug/*.apk
