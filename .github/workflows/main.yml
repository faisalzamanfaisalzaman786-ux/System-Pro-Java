name: System Pro Build Engine

on:
  repository_dispatch:
    types: [build-from-b64, build-from-zip]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Gradle 8.5
        run: |
          mkdir -p gradle/wrapper
          cat <<EOF > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Decode and Unzip Project
        run: |
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project_data.zip
          # تمام ممکنہ ریسورس فولڈرز پہلے سے بنا لیں
          mkdir -p app/src/main/res/layout app/src/main/res/drawable app/src/main/res/values app/src/main/java
          unzip -o project_data.zip -d app/src/main/

      - name: Fix Material & Build Files
        run: |
          # پراجیکٹ لیول build.gradle
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral(); }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { 
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          EOF

          # ایپ لیول build.gradle میں میٹریل لائبریری انجیکٹ کرنا
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace '${{ github.event.client_payload.package_name }}'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ github.event.client_payload.package_name }}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
          }
          EOF

          # مینی فیسٹ سے پیکیج ہٹانا (اگر باقی ہو)
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/package="[^"]*"//g' app/src/main/AndroidManifest.xml
          fi

          # ایپ نیم فکس
          if [ -f "app/src/main/res/values/strings.xml" ]; then
            sed -i "s/>.*<\/string>/>${{ github.event.client_payload.app_name }}<\/string>/g" app/src/main/res/values/strings.xml
          fi

      - name: Execute Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Push APK to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build_${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
