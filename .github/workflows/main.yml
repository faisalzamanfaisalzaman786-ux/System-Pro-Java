name: System Pro Universal Strong Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [android-studio-build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Execute Universal Engine
        run: |
          # 1. Variables Setup
          USER_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME="${USER_PKG:-com.system.pro.universal}"
          PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
          APP_NAME="${{ github.event.client_payload.app_name }}"
          FINAL_APP_NAME="${APP_NAME:-System Pro App}"

          # 2. Clean and Create Directory Structure
          rm -rf app temp_dir
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p "app/src/main/res/values"
          mkdir -p "app/src/main/res/drawable"
          mkdir -p "app/src/main"

          # 3. Zip Extraction and Merging
          if [ -n "${{ github.event.client_payload.zip_data }}" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            unzip -o project.zip -d temp_dir/
            
            # Copy Resources
            [ -d "temp_dir/src/main/res" ] && cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
            
            # Copy Manifest if exists
            [ -f "temp_dir/src/main/AndroidManifest.xml" ] && cp -f temp_dir/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml || true
            
            # Copy and Fix Java Files
            find temp_dir -name "*.java" -exec cp {} "app/src/main/java/$PKG_PATH/" \;
            find "app/src/main/java/$PKG_PATH/" -name "*.java" -type f | while read -r file; do
              sed -i "1s|^package .*|package $PKG_NAME;|" "$file"
              sed -i "/import .*\.R;/d" "$file"
              sed -i "/package $PKG_NAME;/a import $PKG_NAME.R;" "$file"
            done
          fi

          # 4. Mandatory Files Check (Safety Net)
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            printf "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" package=\"$PKG_NAME\">\n    <application android:label=\"@string/app_name\" android:theme=\"@style/Theme.MaterialComponents.Light.NoActionBar\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>" > app/src/main/AndroidManifest.xml
          fi

          # 5. Build Script Generation
          printf "plugins { id 'com.android.application' }\nandroid {\n    namespace '$PKG_NAME'\n    compileSdk 34\n    defaultConfig {\n        applicationId '$PKG_NAME'\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName '1.0'\n    }\n}\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'com.google.android.material:material:1.11.0'\n}" > app/build.gradle
          
          printf "<resources>\n    <string name=\"app_name\">$FINAL_APP_NAME</string>\n</resources>" > app/src/main/res/values/strings.xml
          echo "include ':app'" > settings.gradle

          # 6. Build Command
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name || 'System-Pro-Build' }}
          path: app/build/outputs/apk/debug/*.apk
