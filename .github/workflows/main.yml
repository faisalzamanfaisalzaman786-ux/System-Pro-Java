name: System Pro - Dynamic APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]

# یہ کنکرنسی گروپ اس بات کو یقینی بناتا ہے کہ ایک وقت میں صرف ایک بلڈ چلے
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false   # پہلے سے چل رہا بلڈ منسوخ نہیں ہوگا، نیا انتظار کرے گا

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK (with licenses)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Prepare directories
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

      - name: Fetch uploaded HTML and icon (if any)
        if: github.event_name == 'repository_dispatch'
        run: |
          # HTML فائل ڈاؤن لوڈ کریں
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o index.html \
               "https://api.github.com/repos/${{ github.repository }}/contents/${{ github.event.client_payload.html_file }}"

          # اگر آئیکون موجود ہو تو ڈاؤن لوڈ کریں
          if [ -n "${{ github.event.client_payload.icon_file }}" ]; then
            curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                 -H "Accept: application/vnd.github.v3.raw" \
                 -o icon_base64.txt \
                 "https://api.github.com/repos/${{ github.repository }}/contents/${{ github.event.client_payload.icon_file }}"
          fi

      - name: Provide default files (if missing)
        run: |
          # اگر HTML موجود نہیں تو ڈیفالٹ بنا دیں
          if [ ! -f index.html ]; then
            cat <<EOF > index.html
          <!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"><title>System Pro</title></head>
          <body><h1>System Pro</h1><p>یہ ڈیفالٹ HTML ہے۔</p></body>
          </html>
          EOF
          fi

          # اگر آئیکون موجود نہیں تو 1x1 سفید PNG بنا دیں
          if [ ! -f icon_base64.txt ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" > icon_base64.txt
          fi

          # پرمیشنز کی فائل بنائیں (اگر dispatch سے آئیں)
          if [ -n "${{ github.event.client_payload.permissions }}" ]; then
            echo "${{ join(github.event.client_payload.permissions, '\n') }}" > permissions.txt
          else
            touch permissions.txt
          fi

          # ایپ کا نام (اگر dispatch سے آئے)
          if [ -n "${{ github.event.client_payload.app_name }}" ]; then
            echo "${{ github.event.client_payload.app_name }}" > app_name.txt
          else
            echo "System Pro" > app_name.txt
          fi

      - name: Copy HTML to assets
        run: |
          cp index.html app/src/main/assets/index.html

      - name: Decode and copy icon
        run: |
          base64 -d icon_base64.txt > app/src/main/res/drawable/ic_launcher.png

      - name: Create gradle.properties
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Create project build.gradle
        run: |
          cat <<EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://plugins.gradle.org/m2/" }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }
          EOF

      - name: Create settings.gradle
        run: |
          cat <<EOF > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }
          rootProject.name = "System Pro"
          include ':app'
          EOF

      - name: Create app build.gradle with unique package name
        run: |
          APP_NAME=$(cat app_name.txt)
          # پیکیج نام بنائیں: صرف حروف تہجی، اعداد، انڈر اسکور۔ پہلا حرف حرف ہو۔
          PACKAGE_BASE=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')
          if [[ "$PACKAGE_BASE" =~ ^[0-9] ]]; then
            PACKAGE_BASE="a_$PACKAGE_BASE"
          fi
          # منفرد بنانے کے لیے run_id شامل کریں
          PACKAGE_NAME="com.systempro.${PACKAGE_BASE}_${{ github.run_id }}"
          echo "Using package name: $PACKAGE_NAME"

          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34

              defaultConfig {
                  applicationId "$PACKAGE_NAME"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable true
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: Create AndroidManifest.xml with dynamic permissions
        run: |
          APP_NAME=$(cat app_name.txt)
          PERMISSIONS=$(cat permissions.txt)

          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          EOF

          # اضافی پرمیشنز شامل کریں (اگر موجود ہوں)
          if [ -s permissions.txt ]; then
            while IFS= read -r perm; do
              if [ -n "$perm" ]; then
                echo "    <uses-permission android:name=\"$perm\" />" >> app/src/main/AndroidManifest.xml
              fi
            done < permissions.txt
          fi

          cat <<EOF >> app/src/main/AndroidManifest.xml

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="$APP_NAME"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

      - name: Create MainActivity.java with dynamic package
        run: |
          APP_NAME=$(cat app_name.txt)
          PACKAGE_BASE=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')
          if [[ "$PACKAGE_BASE" =~ ^[0-9] ]]; then
            PACKAGE_BASE="a_$PACKAGE_BASE"
          fi
          PACKAGE_NAME="com.systempro.${PACKAGE_BASE}_${{ github.run_id }}"
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')
          mkdir -p "app/src/main/java/$PACKAGE_PATH"

          cat <<EOF > "app/src/main/java/$PACKAGE_PATH/MainActivity.java"
          package $PACKAGE_NAME;

          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.ValueCallback;
          import android.net.Uri;
          import android.content.Intent;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webview);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowContentAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback,
                                                       FileChooserParams fileChooserParams) {
                          MainActivity.this.filePathCallback = filePathCallback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("image/*");
                          startActivityForResult(intent, FILE_CHOOSER_REQUEST_CODE);
                          return true;
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      if (resultCode == RESULT_OK && data != null) {
                          Uri[] uris = new Uri[]{data.getData()};
                          filePathCallback.onReceiveValue(uris);
                      } else {
                          filePathCallback.onReceiveValue(null);
                      }
                      filePathCallback = null;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }
          }
          EOF

      - name: Create activity_main.xml
        run: |
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/webview"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          EOF

      - name: Create minimal styles.xml
        run: |
          cat <<EOF > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>
          </resources>
          EOF

      - name: Generate gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.5 --distribution-type all
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-App-${{ github.run_id }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Cleanup temp files (if from dispatch)
        if: github.event_name == 'repository_dispatch'
        run: |
          # HTML فائل ڈیلیٹ کریں (اگر موجود ہو)
          if [ -n "${{ github.event.client_payload.html_file }}" ] && [ -n "${{ github.event.client_payload.html_sha }}" ]; then
            curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                 "https://api.github.com/repos/${{ github.repository }}/contents/${{ github.event.client_payload.html_file }}?message=Cleanup&sha=${{ github.event.client_payload.html_sha }}"
          fi
          # آئیکون فائل ڈیلیٹ کریں (اگر موجود ہو)
          if [ -n "${{ github.event.client_payload.icon_file }}" ] && [ -n "${{ github.event.client_payload.icon_sha }}" ]; then
            curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                 "https://api.github.com/repos/${{ github.repository }}/contents/${{ github.event.client_payload.icon_file }}?message=Cleanup&sha=${{ github.event.client_payload.icon_sha }}"
          fi
