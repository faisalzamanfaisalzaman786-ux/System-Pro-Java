name: System Pro Native APK Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Native Project Structure
      run: |
        mkdir -p app/src/main/java/com/systempro/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 1. Gradle Properties
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

        # 2. Settings
        echo "include ':app'" > settings.gradle

        # 3. Root build.gradle
        cat <<'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 4. App build.gradle
        cat <<'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.systempro.app'
            compileSdk 34
            defaultConfig {
                applicationId "com.systempro.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

        # 5. Resources (Strings & Themes)
        echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">System Pro</string></resources>' > app/src/main/res/values/strings.xml
        
        echo '<?xml version="1.0" encoding="utf-8"?><resources><style name="Theme.SystemPro" parent="Theme.MaterialComponents.DayNight.NoActionBar"></style></resources>' > app/src/main/res/values/themes.xml

        # 6. UI Layout
        echo '<?xml version="1.0" encoding="utf-8"?><FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#121212"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="center" android:text="System Pro Build Success" android:textColor="#00FF00" android:textSize="20sp" /></FrameLayout>' > app/src/main/res/layout/activity_main.xml

        # 7. Java Activity
        echo 'package com.systempro.app; import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; public class MainActivity extends AppCompatActivity { @Override protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); setContentView(R.layout.activity_main); } }' > app/src/main/java/com/systempro/app/MainActivity.java

        # 8. Android Manifest (Echo method for stability)
        echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
        echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' >> app/src/main/AndroidManifest.xml
        echo '    <application' >> app/src/main/AndroidManifest.xml
        echo '        android:label="@string/app_name"' >> app/src/main/AndroidManifest.xml
        echo '        android:theme="@style/Theme.SystemPro">' >> app/src/main/AndroidManifest.xml
        echo '        <activity' >> app/src/main/AndroidManifest.xml
        echo '            android:name=".MainActivity"' >> app/src/main/AndroidManifest.xml
        echo '            android:exported="true">' >> app/src/main/AndroidManifest.xml
        echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
        echo '                <action android:name="android.intent.action.MAIN" />' >> app/src/main/AndroidManifest.xml
        echo '                <category android:name="android.intent.category.LAUNCHER" />' >> app/src/main/AndroidManifest.xml
        echo '            </intent-filter>' >> app/src/main/AndroidManifest.xml
        echo '        </activity>' >> app/src/main/AndroidManifest.xml
        echo '    </application>' >> app/src/main/AndroidManifest.xml
        echo '</manifest>' >> app/src/main/AndroidManifest.xml

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Build APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SystemPro-Success-APK
        path: app/build/outputs/apk/debug/app-debug.apk
