name: System Pro Universal Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Universal APK
        run: |
          PKG_NAME="${1:-com.systempro.app}"
          PKG_NAME="${PKG_NAME//\"/}"
          echo "Using package: $PKG_NAME"

          # Clean and create directories
          rm -rf app temp_dir build.gradle
          mkdir -p app/src/main/java app/src/main/res/values app/src/main/res/layout

          # Create AndroidManifest.xml
          echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"' >> app/src/main/AndroidManifest.xml
          echo "    package=\"$PKG_NAME\">" >> app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.INTERNET" />' >> app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.CAMERA" />' >> app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.RECORD_AUDIO" />' >> app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' >> app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' >> app/src/main/AndroidManifest.xml
          echo '    <uses-feature android:name="android.hardware.camera" android:required="true" />' >> app/src/main/AndroidManifest.xml
          echo '    <application android:label="System Pro" android:theme="@style/Theme.SystemPro" android:icon="@mipmap/ic_launcher" android:allowBackup="true" android:supportsRtl="true">' >> app/src/main/AndroidManifest.xml
          echo '        <activity android:name=".MainActivity" android:exported="true">' >> app/src/main/AndroidManifest.xml
          echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
          echo '                <action android:name="android.intent.action.MAIN" />' >> app/src/main/AndroidManifest.xml
          echo '                <category android:name="android.intent.category.LAUNCHER" />' >> app/src/main/AndroidManifest.xml
          echo '            </intent-filter>' >> app/src/main/AndroidManifest.xml
          echo '        </activity>' >> app/src/main/AndroidManifest.xml
          echo '    </application>' >> app/src/main/AndroidManifest.xml
          echo '</manifest>' >> app/src/main/AndroidManifest.xml

          # Create themes.xml
          echo '<resources>' > app/src/main/res/values/themes.xml
          echo '    <style name="Theme.SystemPro" parent="Theme.MaterialComponents.DayNight.NoActionBar">' >> app/src/main/res/values/themes.xml
          echo '        <item name="colorPrimary">#00FFCC</item>' >> app/src/main/res/values/themes.xml
          echo '        <item name="android:statusBarColor">#02040C</item>' >> app/src/main/res/values/themes.xml
          echo '        <item name="android:windowBackground">#02040C</item>' >> app/src/main/res/values/themes.xml
          echo '    </style>' >> app/src/main/res/values/themes.xml
          echo '</resources>' >> app/src/main/res/values/themes.xml

          # Create settings.gradle
          echo 'pluginManagement {' > settings.gradle
          echo '    repositories {' >> settings.gradle
          echo '        google()' >> settings.gradle
          echo '        mavenCentral()' >> settings.gradle
          echo '        gradlePluginPortal()' >> settings.gradle
          echo '    }' >> settings.gradle
          echo '}' >> settings.gradle
          echo 'dependencyResolutionManagement {' >> settings.gradle
          echo '    repositories {' >> settings.gradle
          echo '        google()' >> settings.gradle
          echo '        mavenCentral()' >> settings.gradle
          echo '    }' >> settings.gradle
          echo '}' >> settings.gradle
          echo 'rootProject.name = "SystemPro"' >> settings.gradle
          echo 'include ":app"' >> settings.gradle

          # Create app/build.gradle
          echo 'plugins {' > app/build.gradle
          echo '    id "com.android.application"' >> app/build.gradle
          echo '}' >> app/build.gradle
          echo '' >> app/build.gradle
          echo 'android {' >> app/build.gradle
          echo "    namespace \"$PKG_NAME\"" >> app/build.gradle
          echo '    compileSdk 34' >> app/build.gradle
          echo '' >> app/build.gradle
          echo '    defaultConfig {' >> app/build.gradle
          echo "        applicationId \"$PKG_NAME\"" >> app/build.gradle
          echo '        minSdk 21' >> app/build.gradle
          echo '        targetSdk 34' >> app/build.gradle
          echo '        versionCode 1' >> app/build.gradle
          echo '        versionName "1.0"' >> app/build.gradle
          echo '    }' >> app/build.gradle
          echo '' >> app/build.gradle
          echo '    compileOptions {' >> app/build.gradle
          echo '        sourceCompatibility JavaVersion.VERSION_17' >> app/build.gradle
          echo '        targetCompatibility JavaVersion.VERSION_17' >> app/build.gradle
          echo '    }' >> app/build.gradle
          echo '}' >> app/build.gradle
          echo '' >> app/build.gradle
          echo 'dependencies {' >> app/build.gradle
          echo '    implementation "androidx.appcompat:appcompat:1.6.1"' >> app/build.gradle
          echo '    implementation "com.google.android.material:material:1.11.0"' >> app/build.gradle
          echo '    implementation "androidx.camera:camera-core:1.3.0"' >> app/build.gradle
          echo '    implementation "androidx.camera:camera-camera2:1.3.0"' >> app/build.gradle
          echo '    implementation "androidx.camera:camera-lifecycle:1.3.0"' >> app/build.gradle
          echo '    implementation "androidx.camera:camera-view:1.3.0"' >> app/build.gradle
          echo '    implementation "com.google.guava:guava:31.1-android"' >> app/build.gradle
          echo '}' >> app/build.gradle

          # If payload zip provided, inject custom code
          if [ -n "${{ github.event.client_payload.zip_data }}" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            unzip -o project.zip -d temp_dir/
            cp -rf temp_dir/src/main/res/* app/src/main/res/ 2>/dev/null || true
            mkdir -p "app/src/main/java/$(echo $PKG_NAME | tr '.' '/')"
            find temp_dir/src/main/java -name "*.java" -exec cp {} "app/src/main/java/$(echo $PKG_NAME | tr '.' '/')/" \;
            sed -i "s/^package .*;/package $PKG_NAME;/" app/src/main/java/$(echo $PKG_NAME | tr '.' '/')/*.java 2>/dev/null || true
          fi

          # Build
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-APK
          path: app/build/outputs/apk/debug/*.apk
