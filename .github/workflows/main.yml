name: Build APK from HTML (Manual Dispatch)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App name (shown below the icon)'
        required: true
        default: 'MyWebApp'
      package_name:
        description: 'Package name (optional, auto‑generated if empty)'
        required: false
        default: ''
      html_content:
        description: 'Full HTML source code'
        required: true
        default: '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>My App</title></head><body><h1>Hello from GitHub Actions!</h1></body></html>'
      icon_base64:
        description: 'Base64 encoded PNG icon (max 8 KB) – optional'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write HTML file
        run: echo "${{ inputs.html_content }}" > index.html

      - name: Write app name
        run: echo "${{ inputs.app_name }}" > app_name.txt

      - name: Write package name (auto if empty)
        run: |
          if [ -z "${{ inputs.package_name }}" ]; then
            # Generate a safe package name from app name
            PACKAGE=$(echo "${{ inputs.app_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')
            echo "com.example.${PACKAGE}" > package_name.txt
          else
            echo "${{ inputs.package_name }}" > package_name.txt
          fi

      - name: Decode icon (if provided)
        run: |
          if [ -n "${{ inputs.icon_base64 }}" ]; then
            echo "${{ inputs.icon_base64 }}" | base64 --decode > icon.png
          fi

      - name: Build APK using VivekWeb2013/android-webview-apk
        uses: VivekWeb2013/android-webview-apk@v1.0
        with:
          html: index.html
          app_name: ${{ inputs.app_name }}
          package_name: $(cat package_name.txt)
          icon: icon.png   # will be ignored if not present

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-webapp-apk
          path: app.apk
          retention-days: 5
