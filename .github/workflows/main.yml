name: System Pro Universal Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Build
        run: |
          # Variables
          USER_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME="${USER_PKG:-com.systempro.app}"
          
          # Structure
          rm -rf app temp_dir
          mkdir -p app/src/main/java app/src/main/res/layout

          # Manifest
          cat <<'EOF' > app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="REPLACE_PKG">
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.CAMERA" />
    <application android:label="System Pro App" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF
          sed -i "s/REPLACE_PKG/$PKG_NAME/g" app/src/main/AndroidManifest.xml

          # Gradle
          echo "include ':app'" > settings.gradle
          cat <<'EOF' > app/build.gradle
plugins { id 'com.android.application' }
android {
    namespace "REPLACE_PKG"
    compileSdk 34
    defaultConfig {
        applicationId "REPLACE_PKG"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation "androidx.camera:camera-core:1.3.0"
    implementation "androidx.camera:camera-camera2:1.3.0"
    implementation "androidx.camera:camera-lifecycle:1.3.0"
    implementation "androidx.camera:camera-view:1.3.0"
}
EOF
          sed -i "s/REPLACE_PKG/$PKG_NAME/g" app/build.gradle

          # Process Source
          if [ -n "${{ github.event.client_payload.zip_data }}" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            unzip -o project.zip -d temp_dir/
            cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
            PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
            mkdir -p "app/src/main/java/$PKG_PATH"
            find temp_dir/src/main/java -name "*.java" -exec cp {} "app/src/main/java/$PKG_PATH/" \;
            find "app/src/main/java/$PKG_PATH/" -name "*.java" -exec sed -i "s/^package .*;/package $PKG_NAME;/g" {} \;
          fi

          # Compile
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-APK
          path: app/build/outputs/apk/debug/*.apk
