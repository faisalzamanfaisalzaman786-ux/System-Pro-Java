name: System Pro - Ultra Stable Fix

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android Project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/systempro/app
          mkdir -p app/src/main/res/values

          # HTML Setup
          if [ -f "index.html" ]; then
            cp index.html app/src/main/assets/index.html
          else
            echo "<html><body><h1>System Pro Loaded</h1></body></html>" > app/src/main/assets/index.html
          fi

          # Theme fix
          echo '<resources><style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar" /></resources>' > app/src/main/res/values/styles.xml
          
          # Manifest
          cat > app/src/main/AndroidManifest.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="System Pro" android:theme="@style/AppTheme" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create Java Bridge
        run: |
          cat > app/src/main/java/com/systempro/app/MainActivity.java << 'EOF'
          package com.systempro.app;
          import android.os.Bundle;
          import android.webkit.*;
          import android.app.Activity;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView web = new WebView(this);
                  setContentView(web);
                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(true);
                  web.getSettings().setAllowFileAccess(true);
                  web.setWebViewClient(new WebViewClient());
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Hard Reset Gradle Version
        run: |
          # settings.gradle
          echo "include ':app'" > settings.gradle
          
          # root build.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # app build.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.systempro.app'
              compileSdk 33
              defaultConfig {
                  applicationId "com.systempro.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

      - name: Execute Build (Version Force)
        run: |
          # Is line se GitHub majboor ho jayega purana version use karne par
          wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip
          unzip -q gradle-7.5-bin.zip
          export PATH=$PWD/gradle-7.5/bin:$PATH
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SystemPro-Success-APK
          path: app/build/outputs/apk/debug/*.apk
