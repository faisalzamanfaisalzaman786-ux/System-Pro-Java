name: "Ultimate APK Builder (All-In-One)"

on:
  repository_dispatch:
    types: [build-app]
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      # 1. فولڈرز کی تیاری
      - name: "Initialize Project Folders"
        run: |
          mkdir -p app/src/main/java/temp_pkg
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

      # 2. ڈیٹا انجیکشن (Safe Writing)
      - name: "Save Payload Data"
        run: |
          cat <<'EOF' > app/src/main/java/temp_pkg/MainActivity.java
          ${{ github.event.client_payload.java }}
          EOF

          cat <<'EOF' > app/src/main/res/layout/activity_main.xml
          ${{ github.event.client_payload.xml }}
          EOF

          cat <<'EOF' > app/src/main/AndroidManifest.xml
          ${{ github.event.client_payload.manifest }}
          EOF

      # 3. پیکیج ڈٹیکشن
      - name: "Detect Package Name"
        id: detect
        run: |
          RAW_PKG=$(grep -m 1 "^package " app/src/main/java/temp_pkg/MainActivity.java | sed 's/package //' | sed 's/;//' | xargs)
          if [ -z "$RAW_PKG" ]; then RAW_PKG="com.systempro.app"; fi
          
          APP_NAME="${{ github.event.client_payload.app_name || 'SystemPro' }}"
          PKG_PATH=$(echo "$RAW_PKG" | tr '.' '/')
          
          echo "DETECTED_PKG=$RAW_PKG" >> $GITHUB_OUTPUT
          echo "APP_NAME=$APP_NAME" >> $GITHUB_OUTPUT
          
          mkdir -p "app/src/main/java/$PKG_PATH"
          mv app/src/main/java/temp_pkg/MainActivity.java "app/src/main/java/$PKG_PATH/"
          rm -rf app/src/main/java/temp_pkg

      # 4. تھیم اور ریسورسز
      - name: "Update UI Resources"
        run: |
          if [ -n "${{ github.event.client_payload.colors }}" ]; then
            echo "${{ github.event.client_payload.colors }}" > app/src/main/res/values/colors.xml
          fi
          if [ -n "${{ github.event.client_payload.styles }}" ]; then
            echo "${{ github.event.client_payload.styles }}" > app/src/main/res/values/styles.xml
          fi

      # 5. گریڈل کنفیگریشن (Fixing the \n dependency error)
      - name: "Generate Build Environment"
        run: |
          cat > settings.gradle <<EOF
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { 
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() } 
          }
          rootProject.name = "${{ steps.detect.outputs.APP_NAME }}"
          include ':app'
          EOF

          cat > build.gradle <<EOF
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF

          # ڈیپنڈینسیز کو ایک عارضی فائل میں محفوظ کریں تاکہ گریڈل ایرر نہ دے
          if [ -n "${{ github.event.client_payload.dependencies }}" ]; then
            echo "${{ github.event.client_payload.dependencies }}" > app/deps.gradle
          else
            echo "implementation 'androidx.appcompat:appcompat:1.6.1'" > app/deps.gradle
            echo "implementation 'com.google.android.material:material:1.11.0'" >> app/deps.gradle
          fi

          cat > app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace '${{ steps.detect.outputs.DETECTED_PKG }}'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ steps.detect.outputs.DETECTED_PKG }}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              apply from: 'deps.gradle'
          }
          EOF

      # 6. جاوا سیٹ اپ اور انجن
      - name: "Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Setup Gradle Wrapper"
        run: gradle wrapper --gradle-version 8.2

      # 7. بلڈ
      - name: "Build APK"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 8. اپ لوڈ
      - name: "Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.detect.outputs.APP_NAME }}
          path: app/build/outputs/apk/debug/*.apk

      # 9. صفائی
      - name: "Post-Build Cleanup"
        if: always()
        run: |
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/layout/*
          rm -rf app/build/
          rm -rf .gradle/
          echo "Success."
