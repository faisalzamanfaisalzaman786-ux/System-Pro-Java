name: Build Cordova WebView APK

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create MyApp com.example.myapp "MyApp"
          cd MyApp
          cordova platform add android

      - name: Copy HTML to www
        run: |
          cat << 'EOF' > MyApp/www/index.html
          ${{ github.event.client_payload.app_html }}
          EOF

      - name: Set app name and generate package name
        run: |
          APP_NAME='${{ github.event.client_payload.app_name }}'
          cd MyApp
          # Update config.xml with app name
          sed -i "s/<name>.*<\/name>/<name>$APP_NAME<\/name>/" config.xml
          
          # Generate package name from app name
          CLEAN_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g' | cut -c1-30)
          PACKAGE_NAME="com.${CLEAN_NAME}"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          
          # Update package name in config.xml
          sed -i "s/id=\".*\"/id=\"$PACKAGE_NAME\"/" config.xml

      - name: Add icon if provided
        run: |
          ICON_BASE64='${{ github.event.client_payload.app_icon }}'
          if [ -n "$ICON_BASE64" ]; then
            echo "$ICON_BASE64" | base64 -d > icon.png
            cd MyApp
            # Create icons for all Android densities
            mkdir -p platforms/android/app/src/main/res/mipmap-hdpi
            mkdir -p platforms/android/app/src/main/res/mipmap-mdpi
            mkdir -p platforms/android/app/src/main/res/mipmap-xhdpi
            mkdir -p platforms/android/app/src/main/res/mipmap-xxhdpi
            mkdir -p platforms/android/app/src/main/res/mipmap-xxxhdpi
            cp ../icon.png platforms/android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp ../icon.png platforms/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp ../icon.png platforms/android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp ../icon.png platforms/android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp ../icon.png platforms/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Add permissions to AndroidManifest
        run: |
          PERMISSIONS_STR='${{ github.event.client_payload.permissions }}'
          echo "$PERMISSIONS_STR" | jq -r '.[]' | while read perm; do
            if [ -n "$perm" ]; then
              # Insert permission before closing manifest tag
              sed -i "/<\/manifest>/i <uses-permission android:name=\"$perm\" />" MyApp/platforms/android/app/src/main/AndroidManifest.xml
            fi
          done

      - name: Build APK
        run: |
          cd MyApp
          cordova build android --release -- --packageType=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: MyApp/platforms/android/app/build/outputs/apk/release/*.apk
