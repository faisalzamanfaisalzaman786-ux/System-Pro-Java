name: System Pro Titan Master Build
on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  COMPILE_SDK: 34
  TARGET_SDK: 34
  MIN_SDK: 21
  GRADLE_VERSION: 8.5
  AGP_VERSION: 8.1.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Force Clean Structure & Payload Sync
        run: |
          # پرانا سارا کچرا صاف کریں
          rm -rf app/src/main/java app/src/main/res
          mkdir -p app/src/main/java app/src/main/res/values app/src/main/res/mipmap-hdpi
          
          ZIP_DATA="${{ github.event.client_payload.zip_data }}"
          if [ ! -z "$ZIP_DATA" ]; then
            echo "$ZIP_DATA" | tr -d '\n\r ' | base64 -d > project.zip
            unzip -o project.zip -d temp_src || true
            
            # صرف جاوا اور ریسورسز اٹھائیں
            cp -rf temp_src/app/src/main/java/* app/src/main/java/ || true
            cp -rf temp_src/app/src/main/res/* app/src/main/res/ || true
            
            # جاوا میں R کلاس کی میپنگ (یہ بٹنز لنک کرنے کے لیے لازمی ہے)
            find app/src/main/java -name "*.java" -exec sed -i '/import .*\.R;/d' {} \;
            find app/src/main/java -name "*.java" -exec sed -i '/package /a import com.systempro.master.R;' {} \;
          fi

      - name: Atomic Manifest Injection
        run: |
          # مینی فیسٹ اب ہم خود لکھیں گے تاکہ پارسنگ ایرر نہ آئے
          # یہ مینی فیسٹ آپ کے پے لوڈ کی MainActivity اور آئیکن کو خود بخود ڈھونڈ لے گا
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="System Pro"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name="com.system.pro.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build Engine (With ViewBinding)
        run: |
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:${{ env.AGP_VERSION }}' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          echo 'include ":app"' > settings.gradle
          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { 
            namespace 'com.systempro.master'
            compileSdk ${{ env.COMPILE_SDK }}
            defaultConfig { 
              applicationId 'com.systempro.master'
              minSdk ${{ env.MIN_SDK }}
              targetSdk ${{ env.TARGET_SDK }}
              versionCode 1
              versionName '1.0'
            }
            buildFeatures { viewBinding true }
          }" >> app/build.gradle
          echo "dependencies { 
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }" >> app/build.gradle

      - name: Execute Assembly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip
          unzip -q gradle-${{ env.GRADLE_VERSION }}-bin.zip
          ./gradle-${{ env.GRADLE_VERSION }}/bin/gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
