name: System Pro Master APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'System Pro App'
      pkg_name:
        description: 'Package Name'
        required: true
        default: 'com.systempro.apk'
      java_code:
        description: 'MainActivity Java Code'
        required: true
      xml_code:
        description: 'Activity Main XML Code'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Project Structure
      run: |
        PKG_DIR=$(echo "${{ github.event.inputs.pkg_name }}" | tr '.' '/')
        mkdir -p app/src/main/java/$PKG_DIR
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

    - name: Generate Build Files
      run: |
        # Gradle Files
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "include ':app'" > settings.gradle

        # Root build.gradle
        printf "buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }\n}\nallprojects {\n    repositories { google(); mavenCentral() }\n}" > build.gradle

        # App build.gradle
        printf "plugins { id 'com.android.application' }\nandroid {\n    namespace '${{ github.event.inputs.pkg_name }}'\n    compileSdk 34\n    defaultConfig {\n        applicationId '${{ github.event.inputs.pkg_name }}'\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName '1.0'\n    }\n}\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'com.google.android.material:material:1.11.0'\n}" > app/build.gradle

    - name: Write User Code and Resources
      run: |
        # Write Java Code
        PKG_DIR=$(echo "${{ github.event.inputs.pkg_name }}" | tr '.' '/')
        cat <<'EOF' > app/src/main/java/$PKG_DIR/MainActivity.java
        ${{ github.event.inputs.java_code }}
        EOF

        # Write XML Layout
        cat <<'EOF' > app/src/main/res/layout/activity_main.xml
        ${{ github.event.inputs.xml_code }}
        EOF

        # Write Values
        echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">${{ github.event.inputs.app_name }}</string></resources>' > app/src/main/res/values/strings.xml
        echo '<?xml version="1.0" encoding="utf-8"?><resources><style name="Theme.SystemPro" parent="Theme.MaterialComponents.DayNight.NoActionBar"></style></resources>' > app/src/main/res/values/themes.xml

    - name: Generate Secure Android Manifest
      run: |
        # مینی فیسٹ فائل کو محفوظ طریقے سے بنانا
        printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <application\n        android:label="@string/app_name"\n        android:theme="@style/Theme.SystemPro">\n        <activity\n            android:name=".MainActivity"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>' > app/src/main/AndroidManifest.xml

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Build APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name }}
        path: app/build/outputs/apk/debug/app-debug.apk
