name: System Pro - Dynamic APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Process client payload
        if: github.event_name == 'repository_dispatch'
        run: |
          # HTML کوڈ کو ڈی کوڈ کریں (بیس 64 نہیں، سیدھا متن ہے)
          echo "${{ github.event.client_payload.app_html }}" > app/src/main/assets/index.html

          # اگر آئیکون بیس 64 میں بھیجا گیا ہو تو اسے ڈی کوڈ کریں
          if [ -n "${{ github.event.client_payload.app_icon }}" ]; then
            echo "${{ github.event.client_payload.app_icon }}" | base64 --decode > app/src/main/res/drawable/ic_launcher.png
          fi

          # پرمیشنز کو ایک فائل میں محفوظ کریں
          echo "${{ github.event.client_payload.permissions }}" > permissions.txt

          # ایپ کا نام بھی محفوظ کریں (بعد میں پیکج نام بنانے کے لیے)
          echo "${{ github.event.client_payload.app_name }}" > app_name.txt

      - name: Clean previous builds
        run: |
          rm -rf .gradle build app/build gradlew gradlew.bat gradle/

      - name: Create gradle.properties
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Create project build.gradle
        run: |
          cat <<EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://plugins.gradle.org/m2/" }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }
          EOF

      - name: Create settings.gradle
        run: |
          cat <<EOF > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }
          rootProject.name = "System Pro"
          include ':app'
          EOF

      - name: Create app build.gradle with dynamic package name and permissions
        run: |
          # ایپ کا نام پڑھیں، پیکج نام بنائیں
          if [ -f app_name.txt ]; then
            APP_NAME=$(cat app_name.txt)
            PACKAGE_BASE=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')
            PACKAGE_NAME="com.systempro.${PACKAGE_BASE}"
          else
            PACKAGE_NAME="com.systempro.ultimate"
          fi
          echo "Using package name: $PACKAGE_NAME"

          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              compileSdk 34

              defaultConfig {
                  applicationId "$PACKAGE_NAME"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable true
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: Create AndroidManifest.xml with permissions
        run: |
          # پرمیشنز پڑھیں
          if [ -f permissions.txt ]; then
            PERMISSIONS=$(cat permissions.txt | tr ',' '\n')
          fi

          # بیس مینی فیسٹ بنائیں
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.systempro.ultimate">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          EOF

          # اضافی پرمیشنز شامل کریں
          if [ -f permissions.txt ]; then
            for perm in $(echo $PERMISSIONS); do
              echo "    <uses-permission android:name=\"$perm\" />" >> app/src/main/AndroidManifest.xml
            done
          fi

          # ایپلیکیشن ٹیگ بند کریں
          cat <<EOF >> app/src/main/AndroidManifest.xml

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="$APP_NAME"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

      - name: Create MainActivity.java
        run: |
          mkdir -p app/src/main/java/com/systempro/ultimate
          cat <<EOF > app/src/main/java/com/systempro/ultimate/MainActivity.java
          package com.systempro.ultimate;

          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.ValueCallback;
          import android.net.Uri;
          import android.content.Intent;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webview);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowContentAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback,
                                                       FileChooserParams fileChooserParams) {
                          MainActivity.this.filePathCallback = filePathCallback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("image/*");
                          startActivityForResult(intent, FILE_CHOOSER_REQUEST_CODE);
                          return true;
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      if (resultCode == RESULT_OK && data != null) {
                          Uri[] uris = new Uri[]{data.getData()};
                          filePathCallback.onReceiveValue(uris);
                      } else {
                          filePathCallback.onReceiveValue(null);
                      }
                      filePathCallback = null;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }
          }
          EOF

      - name: Create activity_main.xml
        run: |
          mkdir -p app/src/main/res/layout
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/webview"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          EOF

      - name: Create minimal styles.xml (to avoid errors)
        run: |
          mkdir -p app/src/main/res/values
          cat <<EOF > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>
          </resources>
          EOF

      - name: Generate gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.5 --distribution-type all
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-App
          path: app/build/outputs/apk/debug/*.apk
