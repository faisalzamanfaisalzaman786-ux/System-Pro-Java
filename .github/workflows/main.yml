name: System Pro Auto Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Reset Workspace
        run: |
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/layout/*
          rm -rf app/src/main/res/drawable/*
          rm -rf app/src/main/res/mipmap*
          rm -rf app/src/main/res/values/strings.xml
          mkdir -p app/src/main/java app/src/main/res/layout app/src/main/res/drawable app/src/main/res/values app/src/main/res/menu

      - name: Process Resources and Code
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
          unzip -o project.zip -d temp_dir/

          # 1. آئیکون فکس: پہلی امیج کو ic_launcher بنانا
          count=0
          find temp_dir/src/main/res/drawable -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) | while read -r file; do
            count=$((count+1))
            new_name="img_${count}.png"
            if [ $count -eq 1 ]; then new_name="ic_launcher.png"; fi
            mv "$file" "temp_dir/src/main/res/drawable/${new_name}" 2>/dev/null || true
          done

          # 2. جاوا فائلز کا پیکج نیم درست کرنا
          # یہ کمانڈ جاوا فائل کے اندر 'package ...' والی لائن کو خود بخود ٹھیک کر دے گی
          find temp_dir/src/main/java -name "*.java" -exec sed -i "s/^package .*;/package com.faisalzar.systempro;/g" {} +

          # 3. فائلوں کو منتقل کرنا
          mkdir -p app/src/main/java/com/faisalzar/systempro
          find temp_dir/src/main/java -name "*.java" -exec cp {} app/src/main/java/com/faisalzar/systempro/ \;
          cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
          cp -f temp_dir/src/main/AndroidManifest.xml app/src/main/ || true
          
          rm -rf temp_dir project.zip

      - name: System Pro Final Fixes
        run: |
          # مینیو اور آئیکون کی موجودگی یقینی بنانا
          if [ ! -f "app/src/main/res/menu/main_menu.xml" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><menu xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto"><item android:id="@+id/action_settings" android:title="Settings" app:showAsAction="never" /></menu>' > app/src/main/res/menu/main_menu.xml
          fi
          if [ ! -f "app/src/main/res/drawable/ic_launcher.png" ]; then
            touch app/src/main/res/drawable/ic_launcher.png
          fi

          # مینی فیسٹ میں پیکج نیم اور آئیکون پاتھ درست کرنا
          sed -i 's/package="[^"]*"/package="com.faisalzar.systempro"/' app/src/main/AndroidManifest.xml || true
          sed -i 's/mipmap\/ic_launcher/drawable\/ic_launcher/g' app/src/main/AndroidManifest.xml || true

          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.5
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name || 'System-Pro-Release' }}
          path: app/build/outputs/apk/debug/*.apk
