name: System Pro Auto Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Sync and Dynamic Package Fix
        run: |
          # پیکیج نیم کو پے لوڈ سے حاصل کرنا (ڈیفالٹ: com.faisalzar.systempro)
          PKG_NAME="${{ github.event.client_payload.package_name || 'com.faisalzar.systempro' }}"
          echo "Building with package: $PKG_NAME"
          
          # پرانا ڈیٹا صاف کرنا
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/layout/*
          rm -rf app/src/main/res/drawable/*
          
          # زپ فائل نکالنا
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
          unzip -o project.zip -d temp_dir/

          # جاوا فائلوں میں پیکیج نیم تبدیل کرنا
          find temp_dir/src/main/java -name "*.java" -exec sed -i "s/^package .*;/package $PKG_NAME;/g" {} +
          
          # صحیح فولڈر سٹرکچر بنانا
          PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          
          # فائلیں منتقل کرنا
          find temp_dir/src/main/java -name "*.java" -exec cp {} "app/src/main/java/$PKG_PATH/" \;
          cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
          
          # مینی فیسٹ کو ڈائنامک پیکیج کے ساتھ لکھنا
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="$PKG_NAME">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
              <application android:allowBackup="true" android:label="System Pro" android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --no-build-cache

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Dynamic-Build
          path: app/build/outputs/apk/debug/*.apk
