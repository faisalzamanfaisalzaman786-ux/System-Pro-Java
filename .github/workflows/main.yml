name: Dynamic APK Builder

on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
          accept-android-sdk-licenses: true

      - name: Decode and extract project
        run: |
          mkdir -p android_project
          cd android_project
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
          unzip -q project.zip
          rm project.zip

      - name: Prepare project and fix missing button
        working-directory: ./android_project
        run: |
          PKG="${{ github.event.client_payload.package_name }}"
          [ -z "$PKG" ] && PKG="com.zipforge.app"
          APP="${{ github.event.client_payload.app_name }}"
          [ -z "$APP" ] && APP="ZipForge"

          mkdir -p app/src/main
          [ -d "src/main" ] && cp -rf src/main/* app/src/main/

          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          find app/src/main/java -name "*.java" -exec mv {} "app/src/main/java/$PKG_PATH/" \; 2>/dev/null || true
          [ -f "MainActivity.java" ] && mv MainActivity.java "app/src/main/java/$PKG_PATH/"

          # Fix package declaration and add R import
          find "app/src/main/java/$PKG_PATH" -name "*.java" -exec sed -i "s/package .*;/package $PKG;/" {} \;
          find "app/src/main/java/$PKG_PATH" -name "*.java" -exec sed -i "/package $PKG;/a import $PKG.R;" {} \;

          # Fix AndroidManifest
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i "s/package=\"[^\"]*\"/package=\"$PKG\"/" app/src/main/AndroidManifest.xml
            sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP\"/" app/src/main/AndroidManifest.xml
          else
            cat > app/src/main/AndroidManifest.xml << EOF
<manifest package="$PKG">
    <application android:label="$APP">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF
          fi

          # Ensure layout has the missing button
          LAYOUT="app/src/main/res/layout/activity_main.xml"
          if [ -f "$LAYOUT" ] && grep -q 'R\.id\.btn_toggle_torch' "app/src/main/java/$PKG_PATH/MainActivity.java" 2>/dev/null; then
            if ! grep -q 'btn_toggle_torch' "$LAYOUT"; then
              echo "Adding missing button btn_toggle_torch to layout"
              # Find root tag and add button before closing
              ROOT=$(grep -oP '^\s*<\K\w+' "$LAYOUT" | head -1)
              sed -i "/<\/$ROOT>/i \ \ \ \ <Button\n        android:id=\"@+id/btn_toggle_torch\"\n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:text=\"Torch\" />\n" "$LAYOUT"
            fi
          fi

          # Fallback resources if missing
          mkdir -p app/src/main/res/values app/src/main/res/layout
          [ ! -f "app/src/main/res/values/colors.xml" ] && echo '<resources><color name="purple">#6200EE</color></resources>' > app/src/main/res/values/colors.xml
          [ ! -f "app/src/main/res/values/themes.xml" ] && echo '<resources><style name="AppTheme" parent="Theme.AppCompat.Light"/></resources>' > app/src/main/res/values/themes.xml
          [ ! -f "$LAYOUT" ] && echo '<TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Hello" xmlns:android="http://schemas.android.com/apk/res/android"/>' > "$LAYOUT"

      - name: Generate Gradle files
        working-directory: ./android_project
        run: |
          PKG="${{ github.event.client_payload.package_name }}"
          [ -z "$PKG" ] && PKG="com.zipforge.app"
          echo 'buildscript { repositories { google() } dependencies { classpath "com.android.tools.build:gradle:8.1.4" } }' > build.gradle
          echo 'allprojects { repositories { google() } }' >> build.gradle
          echo 'include ":app"' > settings.gradle
          cat > app/build.gradle << EOF
          plugins { id("com.android.application") }
          android {
              namespace '$PKG'
              compileSdk 34
              defaultConfig {
                  applicationId '$PKG'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          echo 'org.gradle.jvmargs=-Xmx2048m' > gradle.properties
          echo 'android.useAndroidX=true' >> gradle.properties
          touch app/proguard-rules.pro

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: gradle-cache

      - name: Setup Gradle wrapper
        working-directory: ./android_project
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build APK
        working-directory: ./android_project
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_project/app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          files: android_project/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
