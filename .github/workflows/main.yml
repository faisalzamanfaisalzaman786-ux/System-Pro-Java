name: Dynamic APK Builder from ZipForge Pro

on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Decode and Extract ZIP
        run: |
          ZIP_DATA="${{ github.event.client_payload.zip_data }}"
          if [ -z "$ZIP_DATA" ]; then
            echo "❌ No zip_data"
            exit 1
          fi
          mkdir -p android_project
          cd android_project
          echo "$ZIP_DATA" | tr -d '\n\r ' | base64 -d > project.zip
          unzip -o project.zip
          rm project.zip
          echo "✅ Extraction complete"

      - name: Prepare Android Project (Fix Package & Move Java Files)
        working-directory: ./android_project
        run: |
          # Get package name from payload
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          if [ -z "$PACKAGE_NAME" ]; then
            # Fallback: try to read from manifest
            if [ -f "src/main/AndroidManifest.xml" ]; then
              PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' src/main/AndroidManifest.xml | head -1)
            fi
            if [ -z "$PACKAGE_NAME" ]; then
              PACKAGE_NAME="com.zipforge.app"
            fi
          fi
          echo "📦 Target package: $PACKAGE_NAME"

          # Create app structure
          mkdir -p app/src/main
          # Copy all user files from src/main (if any) to app/src/main
          if [ -d "src/main" ]; then
            cp -rf src/main/* app/src/main/
          fi

          # Convert package name to directory path (e.g., com.system.pro -> com/system/pro)
          PKG_PATH=$(echo $PACKAGE_NAME | tr '.' '/')
          
          # Create target package directory under app/src/main/java
          mkdir -p "app/src/main/java/$PKG_PATH"

          # Find ALL Java files anywhere in app/src/main/java and move to correct package dir
          find app/src/main/java -name "*.java" -type f | while read file; do
            filename=$(basename "$file")
            echo "Moving $filename to $PKG_PATH/"
            mv "$file" "app/src/main/java/$PKG_PATH/$filename" 2>/dev/null || true
          done

          # Also check if there are Java files at root level (outside src/main)
          if [ -f "MainActivity.java" ]; then
            mv MainActivity.java "app/src/main/java/$PKG_PATH/MainActivity.java"
          fi

          # Now fix the package line and add R import for all Java files in correct directory
          find "app/src/main/java/$PKG_PATH" -name "*.java" -type f | while read file; do
            echo "Fixing $file"
            # Replace package line
            sed -i "1s/^package .*;/package $PACKAGE_NAME;/" "$file"
            # Add R import if not present
            if ! grep -q "import $PACKAGE_NAME.R;" "$file"; then
              sed -i "/package $PACKAGE_NAME;/a import $PACKAGE_NAME.R;" "$file"
            fi
          done

          # Update AndroidManifest.xml
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            # Fix package attribute
            sed -i "s/package=\"[^\"]*\"/package=\"$PACKAGE_NAME\"/" app/src/main/AndroidManifest.xml
            # Ensure activity name is relative (starts with dot)
            sed -i 's/android:name="[^"]*MainActivity[^"]*"/android:name=".MainActivity"/' app/src/main/AndroidManifest.xml
          else
            # Create minimal manifest if missing
            cat > app/src/main/AndroidManifest.xml << MANIFEST
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="$PACKAGE_NAME">
              <application android:label="ZipForge" android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST
          fi

          # Provide fallback resources (colors, layout, theme)
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout

          if [ ! -f "app/src/main/res/values/colors.xml" ]; then
            cat > app/src/main/res/values/colors.xml << COLORS
          <resources>
              <color name="purple_500">#FF6200EE</color>
              <color name="purple_700">#FF3700B3</color>
              <color name="teal_200">#FF03DAC5</color>
          </resources>
          COLORS
          fi

          if [ ! -f "app/src/main/res/values/themes.xml" ]; then
            cat > app/src/main/res/values/themes.xml << THEME
          <resources>
              <style name="Theme.Zip" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/purple_500</item>
                  <item name="colorPrimaryDark">@color/purple_700</item>
                  <item name="colorAccent">@color/teal_200</item>
              </style>
          </resources>
          THEME
          fi

          if [ ! -f "app/src/main/res/layout/activity_main.xml" ]; then
            cat > app/src/main/res/layout/activity_main.xml << LAYOUT
          <?xml version="1.0" encoding="utf-8"?>
          <TextView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:text="Hello from ZipForge"
              android:textSize="24sp"
              android:layout_gravity="center"/>
          LAYOUT
          fi

          # Handle icon: copy to all mipmap densities
          ICON_FILE=""
          if [ -f "app/src/main/res/mipmap-hdpi/ic_launcher.png" ]; then
            ICON_FILE="app/src/main/res/mipmap-hdpi/ic_launcher.png"
          elif [ -f "src/main/ic_launcher.png" ]; then
            ICON_FILE="src/main/ic_launcher.png"
          elif [ -f "ic_launcher.png" ]; then
            ICON_FILE="ic_launcher.png"
          fi

          if [ -n "$ICON_FILE" ] && [ -f "$ICON_FILE" ]; then
            echo "✅ Installing icon to all densities"
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p app/src/main/res/mipmap-$density
              cp "$ICON_FILE" app/src/main/res/mipmap-$density/ic_launcher.png
            done
            # Round icon fallback
            cp "$ICON_FILE" app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png 2>/dev/null || true
          else
            echo "⚠️ No icon provided"
          fi

          # Debug: list Java files to verify
          echo "Java files after preparation:"
          find app/src/main/java -name "*.java"

      - name: Generate Gradle Files (No Material Components)
        working-directory: ./android_project
        run: |
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          if [ -z "$PACKAGE_NAME" ]; then
            PACKAGE_NAME="com.zipforge.app"
          fi

          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          echo 'include ":app"' > settings.gradle

          cat > app/build.gradle << EOF
          plugins { id 'com.android.application' }
          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34
              defaultConfig {
                  applicationId '$PACKAGE_NAME'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          echo 'org.gradle.jvmargs=-Xmx2048m' > gradle.properties
          echo 'android.useAndroidX=true' >> gradle.properties
          echo '# no rules' > app/proguard-rules.pro

      - name: Setup Gradle Wrapper
        working-directory: ./android_project
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build APK
        working-directory: ./android_project
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_project/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "ZipForge Build ${{ github.run_id }}"
          files: android_project/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
