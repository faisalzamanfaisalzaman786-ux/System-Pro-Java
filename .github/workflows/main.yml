      - name: Force Icon and Manifest Update
        run: |
          PKG_NAME="${{ github.event.client_payload.package_name || 'com.torch.systempro' }}"
          
          # 1. پرانے ڈیفالٹ آئیکنز کو ہر جگہ سے ڈیلیٹ کریں
          find app/src/main/res -name "ic_launcher*" -delete
          
          # 2. نئے آئیکن فولڈرز بنائیں
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # 3. آپ کے فراہم کردہ زپ سے تصویر تلاش کریں
          ICON_SOURCE=$(find app/src/main/res/drawable -name "*.png" | head -n 1)

          if [ -n "$ICON_SOURCE" ]; then
            echo "Setting Icon from: $ICON_SOURCE"
            # سادہ آئیکن کے لیے
            cp "$ICON_SOURCE" app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp "$ICON_SOURCE" app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            
            # ایڈپٹیو آئیکن (Adaptive Icon) کے لیے تاکہ ہر موبائل پر نظر آئے
            cat <<EOF > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            <?xml version="1.0" encoding="utf-8"?>
            <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                <background android:drawable="@android:color/white"/>
                <foreground android:drawable="@drawable/$(basename "$ICON_SOURCE" .png)"/>
            </adaptive-icon>
            EOF
            cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi

          # 4. مینی فیسٹ میں آئیکن کا صحیح لنک دینا
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application 
                  android:label="System Pro" 
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:allowBackup="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
