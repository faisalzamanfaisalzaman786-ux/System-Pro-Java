name: System Pro - Dynamic APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'System Pro'
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Android Project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/java/com/systempro/app
          
          # اگر ریپوزٹری میں index.html موجود ہے تو اسے اثاثوں میں منتقل کریں
          if [ -f "index.html" ]; then
            cp index.html app/src/main/assets/index.html
          else
            echo "<html><body><h1>System Pro Ready</h1></body></html>" > app/src/main/assets/index.html
          fi

      - name: Handle Payload Assets (Icon & Config)
        run: |
          # آئیکن پروسیسنگ
          ICON_DATA="${{ github.event.client_payload.app_icon }}"
          if [ -n "$ICON_DATA" ]; then
            printf '%s' "$ICON_DATA" | base64 --decode > app/src/main/res/drawable/ic_launcher.png
          else
            # ڈیفالٹ خالی آئیکن (ایرر سے بچنے کے لیے)
            printf 'iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAABmJLR0QA/wD/AP+gvaeTAAAAAXRSTlMAQObYZgAAAAlwSFlzAAAOxAAADsQBlSsOGwAAABlJREFUaN7t0DEBAAAAg6D7vzQNwAMtBAAAnwP9AABYF2RJAAAAAElFTkSuQmCC' | base64 --decode > app/src/main/res/drawable/ic_launcher.png
          fi

      - name: Generate Manifest with Permissions
        run: |
          # پے لوڈ سے پرمیشنز لینا (UI کے چیک باکسز سے)
          PERMS="${{ github.event.client_payload.permissions }}"
          
          cat > app/src/main/AndroidManifest.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              $(echo $PERMS | sed 's/,/\n/g' | xargs -I {} echo '<uses-permission android:name="{}" />')

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="${{ github.event.client_payload.app_name || 'System Pro' }}"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/systempro/app/MainActivity.java << 'EOF'
          package com.systempro.app;
          import android.os.Bundle;
          import android.webkit.*;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Build and Sign APK
        run: |
          # Gradle files setup
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          echo "include ':app'" > settings.gradle
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.systempro.app'
              compileSdk 34
              defaultConfig { applicationId "com.systempro.app"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name }}-Release
          path: app/build/outputs/apk/debug/*.apk
