name: System-Pro-App-Build

on:
  repository_dispatch:
    types: [build-apk]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android Structure & Wrapper
        run: |
          # 1. فولڈرز کی تیاری
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/java/com/systempro/app

          # 2. ان پٹ ڈیٹا پروسیسنگ
          APP_NAME="${{ github.event.client_payload.app_name }}"
          echo "${{ github.event.client_payload.app_html }}" > app/src/main/assets/index.html

          if [ ! -z "${{ github.event.client_payload.app_icon }}" ]; then
            echo "${{ github.event.client_payload.app_icon }}" | base64 --decode > app/src/main/res/drawable/app_icon.png
          fi

          # 3. گریڈل ریپر (Gradle Wrapper) خود بخود انسٹال کرنا
          gradle wrapper --gradle-version 8.2

          # 4. آٹو پیکج نیم
          BUILD_ID=$(date +%s)
          NEW_PACKAGE="com.systempro.v${BUILD_ID}"
          sed -i "s/applicationId \".*\"/applicationId \"$NEW_PACKAGE\"/" app/build.gradle

          # 5. مینی فیسٹ اور پرمیشنز
          PERMS_XML=""
          for perm in ${{ join(github.event.client_payload.permissions, ' ') }}; do
            PERMS_XML="${PERMS_XML}<uses-permission android:name=\"$perm\" />\n"
          done

          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              ${PERMS_XML}
              <uses-permission android:name="android.permission.INTERNET" />
              <application 
                  android:label="${APP_NAME}" 
                  android:icon="@drawable/app_icon"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name="com.systempro.app.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Commit Fixed Structure
        run: |
          git config --global user.name "Faisal Zaman"
          git config --global user.email "faisal@systempro.com"
          git add .
          git commit -m "Fix: Added Gradle Wrapper and Build APK" || echo "No changes"
          git push

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name }}-APK
          path: app/build/outputs/apk/debug/*.apk
