name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode Central Payload
        run: |
          echo "${{ github.event.client_payload.payload }}" | base64 -d > app_payload.zip
          mkdir -p app/src/main/java/com/diagnostic/tool
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          unzip -o app_payload.zip
          
          [ -f MainActivity.java ] && mv MainActivity.java app/src/main/java/com/diagnostic/tool/
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f activity_main.xml ] && mv activity_main.xml app/src/main/res/layout/
          [ -f colors.xml ] && mv colors.xml app/src/main/res/values/
          [ -f neon_button.xml ] && mv neon_button.xml app/src/main/res/drawable/
          [ -f app_icon.png ] && mv app_icon.png app/src/main/res/drawable/ic_launcher.png || true

      - name: Setup Gradle Wrapper Explicitly
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Force Lock Wrapper Version
        run: |
          mkdir -p gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final
          path: app/build/outputs/apk/debug/app-debug.apk
