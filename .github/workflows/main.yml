name: System Pro Build Engine

on:
  workflow_dispatch:

jobs:
  build:
    name: Compiling APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Professional Folder Structure
        run: |
          mkdir -p Data/app/src/main/res/layout
          mkdir -p Data/app/src/main/java/com/system/pro
          
          # Create basic build.gradle for the project
          cat <<EOF > Data/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.1.0" }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # Create settings.gradle
          echo "include ':app'" > Data/settings.gradle

          # Create app level build.gradle
          cat <<EOF > Data/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.system.pro'
              compileSdk 33
              defaultConfig {
                  applicationId "com.system.pro"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # Create Android Manifest
          cat <<EOF > Data/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="System Pro" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Generate Gradle Wrapper
        run: gradle wrapper
        working-directory: ./Data

      - name: Grant Execute Permission
        run: chmod +x ./Data/gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: ./Data

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Build
          path: "Data/app/build/outputs/apk/debug/*.apk"
