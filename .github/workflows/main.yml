name: System Pro Dynamic Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name (e.g., MySuperApp)'
        required: true
        default: 'SystemProApp'
      package_name:
        description: 'Package Name (e.g., com.faisal.pro)'
        required: true
        default: 'com.system.pro'
      java_code:
        description: 'Paste your MainActivity Java code here'
        required: false
      xml_layout:
        description: 'Paste your activity_main.xml code here'
        required: false

jobs:
  initialize-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dynamic Structure
        run: |
          # پیکیج نیم سے ڈائریکٹری پاتھ بنانا (com.abc.xyz -> com/abc/xyz)
          PKG_PATH=$(echo "${{ github.event.inputs.package_name }}" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/libs

          # 1. AndroidManifest.xml بنانا (متحرک نام کے ساتھ)
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="${{ github.event.inputs.package_name }}">
              <application android:label="${{ github.event.inputs.app_name }}" android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 2. Java فائل ہینڈلنگ
          if [ -n "${{ github.event.inputs.java_code }}" ]; then
            echo "${{ github.event.inputs.java_code }}" > "app/src/main/java/$PKG_PATH/MainActivity.java"
          else
            cat <<EOF > "app/src/main/java/$PKG_PATH/MainActivity.java"
            package ${{ github.event.inputs.package_name }};
            import android.app.Activity;
            import android.os.Bundle;
            public class MainActivity extends Activity {
                @Override protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); setContentView(R.layout.activity_main); }
            }
          EOF
          fi

          # 3. XML فائل ہینڈلنگ
          if [ -n "${{ github.event.inputs.xml_layout }}" ]; then
            echo "${{ github.event.inputs.xml_layout }}" > app/src/main/res/layout/activity_main.xml
          else
            cat <<EOF > app/src/main/res/layout/activity_main.xml
            <?xml version="1.0" encoding="utf-8"?>
            <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent">
                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Welcome to ${{ github.event.inputs.app_name }}!" android:layout_centerInParent="true"/>
            </RelativeLayout>
          EOF
          fi

          # 4. ضروری Gradle فائلیں
          echo "include ':app'" > settings.gradle
          
          cat <<EOF > build.gradle
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.0' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace '${{ github.event.inputs.package_name }}'
              compileSdk 34
              defaultConfig {
                  applicationId "${{ github.event.inputs.package_name }}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

      - name: Commit and Push to Repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "System-Pro-Bot"
          git add .
          git commit -m "Initialize: ${{ github.event.inputs.app_name }} (${{ github.event.inputs.package_name }})" || echo "No changes"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/*.apk
