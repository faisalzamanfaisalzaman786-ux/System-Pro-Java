name: Build System Pro APK

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Save and parse payload
        run: |
          # محفوظ طریقے سے payload کو فائل میں لکھیں
          cat <<'EOF' > payload.json
          ${{ toJSON(github.event.client_payload) }}
          EOF
          
          APP_NAME=$(jq -r '.app_name // "SystemPro"' payload.json)
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          
          jq -r '.app_html // ""' payload.json > app_html.txt
          {
            echo "APP_HTML<<EOF"
            cat app_html.txt
            echo "EOF"
          } >> $GITHUB_ENV
          
          jq -r '.app_css // ""' payload.json > app_css.txt
          {
            echo "APP_CSS<<EOF"
            cat app_css.txt
            echo "EOF"
          } >> $GITHUB_ENV
          
          jq -r '.app_js // ""' payload.json > app_js.txt
          {
            echo "APP_JS<<EOF"
            cat app_js.txt
            echo "EOF"
          } >> $GITHUB_ENV
          
          APP_ICON_BASE64=$(jq -r '.app_icon // ""' payload.json)
          echo "APP_ICON_BASE64=$APP_ICON_BASE64" >> $GITHUB_ENV
          
          # پرمیشنز کو JSON array کے طور پر پڑھیں
          PERMISSIONS_JSON=$(jq -c '.permissions // []' payload.json)
          echo "PERMISSIONS_JSON=$PERMISSIONS_JSON" >> $GITHUB_ENV
          
          echo "UNIQUE_ID=${{ github.run_id }}" >> $GITHUB_ENV

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/systempro/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/raw

          # gradle.properties
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # Project build.gradle
          cat > build.gradle <<'EOF'
          buildscript {
              ext.kotlin_version = '1.9.22'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.3.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          EOF

          # settings.gradle
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SystemPro"
          include ':app'
          EOF

          touch app/proguard-rules.pro

          # App build.gradle
          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.systempro.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.systempro.app.run${UNIQUE_ID}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug { }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              aaptOptions { cruncherEnabled = false }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          # پرمیشنز کو AndroidManifest میں شامل کریں
          # پہلے بنیادی مینی فیسٹ بنائیں (بغیر پرمیشنز کے)
          cat > app/src/main/AndroidManifest_base.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="$APP_NAME"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # پرمیشنز کو JSON سے نکال کر AndroidManifest میں شامل کریں
          PERMS=$(echo "$PERMISSIONS_JSON" | jq -r '.[]')
          cp app/src/main/AndroidManifest_base.xml app/src/main/AndroidManifest.xml
          for perm in $PERMS; do
            # پرمیشن لائن کو مینی فیسٹ میں داخل کریں (پہلے <application> سے پہلے)
            sed -i "/<application>/i \    <uses-permission android:name=\"$perm\" />" app/src/main/AndroidManifest.xml
          done
          
          # Icon (Base64 PNG)
          if [ -n "$APP_ICON_BASE64" ]; then
            if echo "$APP_ICON_BASE64" | base64 -d > app/src/main/res/drawable/ic_launcher.png 2>/dev/null; then
              echo "✅ Icon saved as PNG"
            else
              # اگر PNG نہ بنے تو ڈیفالٹ ویکٹر استعمال کریں
              cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_VEC'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#A52A2A"
                android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM12,5c1.66,0 3,1.34 3,3s-1.34,3 -3,3 -3,-1.34 -3,-3 1.34,-3 3,-3zM18,15.2c0,2.37 -3.67,3.8 -6,3.8 -2.33,0 -6,-1.43 -6,-3.8 0,-0.22 0.16,-0.44 0.44,-0.63 1.42,-0.94 3.51,-1.57 5.56,-1.57 2.05,0 4.14,0.63 5.56,1.57 0.28,0.19 0.44,0.41 0.44,0.63z"/>
          </vector>
          EOF_VEC
            fi
          else
            # ڈیفالٹ ویکٹر
            cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_VEC'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#A52A2A"
                android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM12,5c1.66,0 3,1.34 3,3s-1.34,3 -3,3 -3,-1.34 -3,-3 1.34,-3 3,-3zM18,15.2c0,2.37 -3.67,3.8 -6,3.8 -2.33,0 -6,-1.43 -6,-3.8 0,-0.22 0.16,-0.44 0.44,-0.63 1.42,-0.94 3.51,-1.57 5.56,-1.57 2.05,0 4.14,0.63 5.56,1.57 0.28,0.19 0.44,0.41 0.44,0.63z"/>
          </vector>
          EOF_VEC
          fi

          # HTML, CSS, JS files
          echo "$APP_HTML" > app/src/main/res/raw/index.html
          echo "$APP_CSS" > app/src/main/res/raw/style.css
          echo "$APP_JS" > app/src/main/res/raw/script.js

          # MainActivity.kt (بہتر ورژن: WebChromeClient + پرمیشنز)
          cat > app/src/main/java/com/systempro/app/MainActivity.kt <<'EOF'
          package com.systempro.app

          import android.Manifest
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.webkit.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              
              // مطلوبہ پرمیشنز کی فہرست (صرف خطرناک پرمیشنز)
              private val requiredPermissions = listOf(
                  Manifest.permission.CAMERA,
                  Manifest.permission.ACCESS_FINE_LOCATION,
                  Manifest.permission.RECORD_AUDIO,
                  Manifest.permission.READ_EXTERNAL_STORAGE,
                  Manifest.permission.WRITE_EXTERNAL_STORAGE,
                  Manifest.permission.CALL_PHONE,
                  Manifest.permission.READ_CONTACTS
              )
              private val permissionRequestCode = 100

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  webView = WebView(this)
                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.allowFileAccess = true
                  webView.settings.allowContentAccess = true
                  
                  // WebChromeClient کیمرہ، مائیک، لوکیشن کی درخواستوں کو ہینڈل کرتا ہے
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onGeolocationPermissionsShowPrompt(origin: String, callback: GeolocationPermissions.Callback) {
                          // لوکیشن پرمیشن کی درخواست
                          if (ContextCompat.checkSelfPermission(this@MainActivity, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              callback.invoke(origin, true, false)
                          } else {
                              requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION), 101)
                              // بعد میں callback invoke کریں گے onRequestPermissionsResult میں
                          }
                      }
                      
                      override fun onPermissionRequest(request: PermissionRequest) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                              request.grant(request.resources)
                          }
                      }
                  }
                  
                  webView.webViewClient = WebViewClient()
                  
                  // HTML لوڈ کریں
                  val html = resources.openRawResource(R.raw.index).bufferedReader().readText()
                  webView.loadDataWithBaseURL("file:///android_res/raw/", html, "text/html", "UTF-8", null)
                  
                  setContentView(webView)
                  
                  // رن ٹائم پرمیشنز چیک کریں (اگر کچھ نہ دی ہوں)
                  checkAndRequestPermissions()
              }
              
              private fun checkAndRequestPermissions() {
                  val missingPermissions = requiredPermissions.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missingPermissions.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, missingPermissions.toTypedArray(), permissionRequestCode)
                  }
              }
              
              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == permissionRequestCode) {
                      // صارف کے جواب کے بعد ویب ویو کو ریفریش نہیں کر رہے، بس لاگ کر سکتے ہیں
                      android.util.Log.d("MainActivity", "Permissions result")
                  } else if (requestCode == 101) {
                      // لوکیشن پرمیشن کا جواب
                      if (grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          // اگر لوکیشن مل گیا تو geolocation callback کو مطلع کریں
                          // یہاں ہم سادہ طریقہ استعمال کر رہے ہیں: ویب ویو کو دوبارہ لوڈ کرنا
                          webView.reload()
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SystemPro-APK-${{ github.run_id }}
          path: app/build/outputs/apk/debug/*.apk
