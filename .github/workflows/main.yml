      - name: Setup Gradle Files
        run: |
          cat <<EOF > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "System-Pro-v2"
          EOF

          cat <<EOF > build.gradle
          plugins {
              id 'com.android.application' version '8.1.1'
          }

          android {
              namespace 'com.systempro.app'
              compileSdk 33
              
              defaultConfig {
                  applicationId "com.systempro.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              # یہ حصہ فائلوں کو APK میں شامل کرنے کے لیے بہت ضروری ہے
              sourceSets {
                  main {
                      manifest.srcFile 'src/main/AndroidManifest.xml'
                      java.srcDirs = ['src/main/java']
                      res.srcDirs = ['src/main/res']
                      assets.srcDirs = ['src/main/assets']
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false # فائل کا سائز برقرار رکھنے کے لیے
                  }
                  debug {
                      debuggable true
                  }
              }
          }
          EOF
