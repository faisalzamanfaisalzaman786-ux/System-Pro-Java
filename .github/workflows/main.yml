name: System Pro Master Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Dynamic Package
        run: |
          # یونیک پیکج نیم بنانا
          NEW_PKG="com.systempro.app_$(date +'%Y%m%d%H%M%S')"
          echo "Building with: $NEW_PKG"
          
          # اب ہم 'sed' کو فائلز نہ ملنے پر فیل ہونے سے بچائیں گے
          # یہ کمانڈ تمام build.gradle فائلز میں applicationId کو اپڈیٹ کرے گی
          find . -name "build.gradle" -exec sed -i "s/applicationId \".*\"/applicationId \"$NEW_PKG\"/g" {} + || true
          
          # یہ کمانڈ تمام AndroidManifest.xml فائلز میں package name کو اپڈیٹ کرے گی
          find . -name "AndroidManifest.xml" -exec sed -i "s/package=\".*\"/package=\"$NEW_PKG\"/g" {} + || true

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SystemPro-Release-${{ github.run_id }}
          path: app/build/outputs/apk/release/*.apk
