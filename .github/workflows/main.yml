name: HTML to Android Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize Android Project
        run: |
          # خودکار طور پر اینڈرائیڈ سٹرکچر تیار کرنا
          mkdir -p app/src/main/java/com/systempro/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # HTML فائل کو ایسیٹس میں منتقل کرنا
          if [ -f "index.html" ]; then
            cp index.html app/src/main/assets/
          else
            echo "<html><body><h1>System Pro Auto App</h1></body></html>" > app/src/main/assets/index.html
          fi

      - name: Create Manifest and Resources
        run: |
          # Android Manifest فائل کی تخلیق
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.systempro.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="System Pro App" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Strings XML
          echo '<resources><string name="app_name">System Pro App</string></resources>' > app/src/main/res/values/strings.xml

      - name: Generate MainActivity (Kotlin)
        run: |
          cat <<EOF > app/src/main/java/com/systempro/app/MainActivity.kt
          package com.systempro.app
          import android.os.Bundle
          import android.webkit.WebView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState: Bundle?)
                  val webView = WebView(this)
                  webView.settings.javaScriptEnabled = true
                  webView.loadUrl("file:///android_asset/index.html")
                  setContentView(webView)
              }
          }
          EOF

      - name: Setup Gradle Build Files
        run: |
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.1.1" }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.systempro.app'
              compileSdk 33
              defaultConfig {
                  applicationId "com.systempro.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          echo "include ':app'" > settings.gradle

      - name: Build Android APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-App
          path: app/build/outputs/apk/debug/app-debug.apk
