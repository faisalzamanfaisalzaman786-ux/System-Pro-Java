name: System Pro Auto Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Unique Package Name
      run: |
        # وقت اور تاریخ کی بنیاد پر ایک یونیک آئی ڈی بنانا
        UNIQUE_ID=$(date +%s)
        NEW_PACKAGE="com.systempro.app.v${UNIQUE_ID}"
        echo "NEW_PACKAGE=$NEW_PACKAGE" >> $GITHUB_ENV
        
        # تمام ضروری فائلوں میں پیکیج نیم کو ری پلیس کرنا
        find . -type f \( -name "AndroidManifest.xml" -o -name "build.gradle" -o -name "*.java" -o -name "*.kt" \) -exec sed -i "s/com.example.placeholder/$NEW_PACKAGE/g" {} +
        echo "Package name updated to: $NEW_PACKAGE"

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SystemPro-Auto-Build-${{ env.NEW_PACKAGE }}
        path: app/build/outputs/apk/debug/*.apk
