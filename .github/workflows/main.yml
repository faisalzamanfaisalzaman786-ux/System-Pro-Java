name: System Pro Auto Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # کیشے کو فی الحال بند رکھا ہے تاکہ بلڈ بالکل تازہ (clean) ہو
          cache: 'gradle'

      - name: Process Zip Data
        run: |
          # یقینی بنائیں کہ ضروری فولڈرز موجود ہیں
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res
          
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            # زپ ڈیٹا کو ڈی کوڈ اور ان زپ کرنا
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            mkdir -p temp_dir
            unzip -o project.zip -d temp_dir/
            
            # فائلوں کو درست جگہ منتقل کرنے کی محفوظ منطق
            if [ -d "temp_dir/app/src/main/java" ]; then
              cp -rf temp_dir/app/src/main/java/* app/src/main/java/ || true
              cp -rf temp_dir/app/src/main/res/* app/src/main/res/ || true
            elif [ -d "temp_dir/src/main/java" ]; then
              cp -rf temp_dir/src/main/java/* app/src/main/java/ || true
              cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
            else
              # اگر فولڈر اسٹرکچر مختلف ہو تو براہ راست کاپی
              cp -rf temp_dir/* app/src/main/ || true
            fi
            
            # عارضی ڈیٹا صاف کرنا
            rm -rf temp_dir project.zip
          fi

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        # 'clean' اور '--no-build-cache' پچھلے تمام ایررز کو صاف کر دے گا
        run: ./gradlew clean assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Release
          path: app/build/outputs/apk/debug/*.apk
