name: "ZipForge APK Builder"

on:
  repository_dispatch:
    types: [build-from-zip] # یہ وہی ٹائپ ہے جو آپ کے کوڈ میں 'event_type' ہے

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      # 1. ماحول کو صاف کرنا اور ڈائریکٹریز بنانا
      - name: "Prepare Directories"
        run: |
          rm -rf app_files bundle.zip
          mkdir -p app_files
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

      # 2. زپ فائل ڈاؤن لوڈ اور ایکسٹریکٹ کرنا
      - name: "Download & Extract Source"
        run: |
          curl -L -o bundle.zip "${{ github.event.client_payload.zip_asset_url }}"
          unzip bundle.zip -d app_files/

      # 3. فائلوں کو درست جگہ پر منتقل کرنا (Namespace Fix)
      - name: "Organize Project"
        id: sync
        run: |
          # میٹا ڈیٹا سے پیکیج نیم نکالنا
          PKG=$(jq -r '.package_name' app_files/build_metadata.json)
          APP_NAME=$(jq -r '.app_name' app_files/build_metadata.json)
          
          if [ -z "$PKG" ]; then PKG="com.systempro.app"; fi
          
          # جاوا فائل کو پیکج فولڈر میں ڈالنا
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          cp app_files/MainActivity.java "app/src/main/java/$PKG_PATH/MainActivity.java"
          
          # ریسورسز اور مینی فیسٹ
          cp app_files/res/layout/activity_main.xml app/src/main/res/layout/
          cp app_files/AndroidManifest.xml app/src/main/AndroidManifest.xml
          
          # اگر آئیکن موجود ہے تو اسے کاپی کریں
          if [ -f "app_files/res/drawable/ic_launcher.png" ]; then
            cp app_files/res/drawable/ic_launcher.png app/src/main/res/drawable/
          fi

          echo "PKG=$PKG" >> $GITHUB_OUTPUT
          echo "APP_NAME=$APP_NAME" >> $GITHUB_OUTPUT

      # 4. گریڈل 8.5 کنفیگریشن
      - name: "Build Gradle Config"
        run: |
          cat > settings.gradle <<EOF
          rootProject.name = "${{ steps.sync.outputs.APP_NAME }}"
          include ':app'
          EOF

          cat > build.gradle <<EOF
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          cat > app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace '${{ steps.sync.outputs.PKG }}'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ steps.sync.outputs.PKG }}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      # 5. جاوا سیٹ اپ اور بلڈ
      - name: "Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Build APK"
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 6. آرٹیکٹ اپ لوڈ
      - name: "Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sync.outputs.APP_NAME }}
          path: app/build/outputs/apk/debug/*.apk
