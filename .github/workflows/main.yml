name: System Pro - Dynamic APK Builder

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]

concurrency:
  group: build-apk-single
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Android SDK Command Line Tools
        run: |
          # Set up Android SDK location
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME
          cd $ANDROID_HOME

          # Download command line tools (latest version)
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-latest.zip
          unzip -q commandlinetools-linux-latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-latest.zip

          # Add sdkmanager to PATH
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

          # Accept licenses non-interactively
          yes | sdkmanager --licenses

          # Install required platforms and build-tools
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

          # Write environment variables for subsequent steps
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Prepare directories
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

      - name: Process client payload (HTML, icon, permissions, app name)
        if: github.event_name == 'repository_dispatch'
        env:
          APP_HTML: ${{ github.event.client_payload.app_html }}
          APP_ICON: ${{ github.event.client_payload.app_icon }}
          PERMISSIONS: ${{ github.event.client_payload.permissions }}
          APP_NAME: ${{ github.event.client_payload.app_name }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os, base64
          # Write HTML
          with open('app/src/main/assets/index.html', 'w') as f:
              f.write(os.environ.get('APP_HTML', ''))
          # Write icon if provided
          icon_data = os.environ.get('APP_ICON')
          if icon_data:
              with open('app/src/main/res/drawable/ic_launcher.png', 'wb') as f:
                  f.write(base64.b64decode(icon_data))
          # Write permissions
          with open('permissions.txt', 'w') as f:
              f.write(os.environ.get('PERMISSIONS', ''))
          # Write app name
          with open('app_name.txt', 'w') as f:
              f.write(os.environ.get('APP_NAME', ''))
          PYTHON_SCRIPT

      - name: Verify and fix HTML & Icon
        run: |
          # ---------- Fix HTML ----------
          if [ ! -s app/src/main/assets/index.html ]; then
            echo "Warning: index.html empty, using default."
            cat << 'DEFAULT_HTML' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"><title>System Pro</title></head>
          <body><h1>System Pro</h1><p>Default content</p></body>
          </html>
          DEFAULT_HTML
          fi
          echo "HTML size: $(wc -c < app/src/main/assets/index.html) bytes"

          # ---------- Fix Icon ----------
          ICON_PATH="app/src/main/res/drawable/ic_launcher.png"

          if [ -f "$ICON_PATH" ]; then
            SIZE=$(wc -c < "$ICON_PATH")
            if [ "$SIZE" -lt 100 ]; then
              echo "Icon too small ($SIZE bytes), replacing with default."
              rm -f "$ICON_PATH"
            else
              echo "Icon file size: $SIZE bytes"
            fi
          fi

          if [ ! -f "$ICON_PATH" ]; then
            echo "Creating default blue icon (48x48)."
            if command -v convert >/dev/null 2>&1; then
              convert -size 48x48 xc:blue "$ICON_PATH"
            else
              printf '%s' \
                "iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAABmJLR0QA/wD/AP+gvaeT" \
                "AAAAAXRSTlMAQObYZgAAAAlwSFlzAAAOxAAADsQBlSsOGwAAABlJREFUaN7t0DEBAAAA" \
                "g6D7vzQNwAMtBAAAnwP9AABYF2RJAAAAAElFTkSuQmCC" | base64 --decode > "$ICON_PATH"
            fi
            echo "Default icon created, size: $(wc -c < "$ICON_PATH") bytes"
          fi

      - name: Provide default permissions and app name
        run: |
          if [ ! -f permissions.txt ]; then
            touch permissions.txt
          fi
          if [ ! -f app_name.txt ]; then
            echo "System Pro" > app_name.txt
          fi

      - name: Add background location permission if location is selected
        run: |
          # If location permission is selected, add background location (Android 10+)
          if grep -q "android.permission.ACCESS_FINE_LOCATION" permissions.txt; then
            if ! grep -q "android.permission.ACCESS_BACKGROUND_LOCATION" permissions.txt; then
              echo "android.permission.ACCESS_BACKGROUND_LOCATION" >> permissions.txt
              echo "Added background location permission"
            fi
          fi

      - name: Clean previous builds
        run: rm -rf .gradle build app/build gradlew gradlew.bat gradle/

      - name: Create gradle.properties
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Create project build.gradle
        run: |
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://plugins.gradle.org/m2/" }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }
          EOF

      - name: Create settings.gradle
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }
          rootProject.name = "System Pro"
          include ':app'
          EOF

      - name: Create app build.gradle with dynamic namespace
        run: |
          APP_NAME=$(cat app_name.txt)
          PACKAGE_BASE=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')
          PACKAGE_NAME="com.systempro.${PACKAGE_BASE}"
          echo "Using package name: $PACKAGE_NAME"

          cat << EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34

              defaultConfig {
                  applicationId "$PACKAGE_NAME"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable true
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: Create AndroidManifest.xml with dynamic permissions and icon
        run: |
          APP_NAME=$(cat app_name.txt)
          PERMISSIONS=$(cat permissions.txt | tr ',' '\n' || true)

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          EOF

          for perm in $PERMISSIONS; do
            if [ -n "$perm" ]; then
              echo "    <uses-permission android:name=\"$perm\" />" >> app/src/main/AndroidManifest.xml
            fi
          done

          cat << EOF >> app/src/main/AndroidManifest.xml

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="$APP_NAME"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

      - name: Create MainActivity.java with dynamic package and runtime permissions
        run: |
          APP_NAME=$(cat app_name.txt)
          PACKAGE_BASE=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')
          PACKAGE_NAME="com.systempro.${PACKAGE_BASE}"
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')
          mkdir -p "app/src/main/java/$PACKAGE_PATH"

          cat << EOF > "app/src/main/java/$PACKAGE_PATH/MainActivity.java"
          package $PACKAGE_NAME;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1;
              private static final int PERMISSION_REQUEST_CODE = 100;
              private PermissionRequest currentPermissionRequest;
              private String geoOrigin;
              private GeolocationPermissions.Callback geoCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webview);
                  WebSettings webSettings = webView.getSettings();

                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  webSettings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                      WebView.setWebContentsDebuggingEnabled(true);
                  }

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("http") || url.startsWith("file")) {
                              view.loadUrl(url);
                              return true;
                          }
                          return false;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      // File chooser
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback,
                                                       FileChooserParams fileChooserParams) {
                          MainActivity.this.filePathCallback = filePathCallback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          startActivityForResult(intent, FILE_CHOOSER_REQUEST_CODE);
                          return true;
                      }

                      // Geolocation
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          MainActivity.this.geoOrigin = origin;
                          MainActivity.this.geoCallback = callback;
                          requestLocationPermissions();
                      }

                      // Camera / Microphone (WebRTC)
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                              String[] resources = request.getResources();
                              List<String> neededPermissions = new ArrayList<>();
                              for (String resource : resources) {
                                  switch (resource) {
                                      case PermissionRequest.RESOURCE_VIDEO_CAPTURE:
                                          neededPermissions.add(Manifest.permission.CAMERA);
                                          break;
                                      case PermissionRequest.RESOURCE_AUDIO_CAPTURE:
                                          neededPermissions.add(Manifest.permission.RECORD_AUDIO);
                                          break;
                                  }
                              }
                              if (neededPermissions.isEmpty()) {
                                  request.grant(request.getResources());
                                  return;
                              }
                              currentPermissionRequest = request;
                              ActivityCompat.requestPermissions(MainActivity.this,
                                      neededPermissions.toArray(new String[0]),
                                      PERMISSION_REQUEST_CODE);
                          } else {
                              request.grant(request.getResources());
                          }
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void requestLocationPermissions() {
                  List<String> perms = new ArrayList<>();
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {
                      perms.add(Manifest.permission.ACCESS_FINE_LOCATION);
                  }
                  // For Android 10+, background location permission is separate
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_BACKGROUND_LOCATION)
                              != PackageManager.PERMISSION_GRANTED) {
                          perms.add(Manifest.permission.ACCESS_BACKGROUND_LOCATION);
                      }
                  }
                  if (!perms.isEmpty()) {
                      ActivityCompat.requestPermissions(this,
                              perms.toArray(new String[0]),
                              PERMISSION_REQUEST_CODE);
                  } else {
                      // Already granted
                      if (geoCallback != null && geoOrigin != null) {
                          geoCallback.invoke(geoOrigin, true, false);
                          geoCallback = null;
                          geoOrigin = null;
                      }
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions,
                                                     @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == PERMISSION_REQUEST_CODE) {
                      // Handle geolocation
                      if (geoCallback != null && geoOrigin != null) {
                          boolean granted = true;
                          // Check if any required location permission was denied
                          for (int i = 0; i < permissions.length; i++) {
                              if (permissions[i].equals(Manifest.permission.ACCESS_FINE_LOCATION) ||
                                      permissions[i].equals(Manifest.permission.ACCESS_BACKGROUND_LOCATION)) {
                                  if (grantResults[i] != PackageManager.PERMISSION_GRANTED) {
                                      granted = false;
                                      break;
                                  }
                              }
                          }
                          geoCallback.invoke(geoOrigin, granted, false);
                          geoCallback = null;
                          geoOrigin = null;
                      }

                      // Handle WebRTC (camera/microphone)
                      if (currentPermissionRequest != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          boolean allGranted = true;
                          for (int result : grantResults) {
                              if (result != PackageManager.PERMISSION_GRANTED) {
                                  allGranted = false;
                                  break;
                              }
                          }
                          if (allGranted) {
                              currentPermissionRequest.grant(currentPermissionRequest.getResources());
                          } else {
                              currentPermissionRequest.deny();
                          }
                          currentPermissionRequest = null;
                      }

                      // Optionally show toast for missing permissions
                      if (!allPermissionsGranted(permissions, grantResults)) {
                          Toast.makeText(this, "کچھ پرمیشنز نہیں دی گئیں۔ کچھ فیچرز کام نہیں کریں گے۔", Toast.LENGTH_LONG).show();
                      }
                  }
              }

              private boolean allPermissionsGranted(String[] permissions, int[] grantResults) {
                  for (int i = 0; i < permissions.length; i++) {
                      if (grantResults[i] != PackageManager.PERMISSION_GRANTED) {
                          return false;
                      }
                  }
                  return true;
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      if (resultCode == RESULT_OK && data != null) {
                          Uri[] uris = new Uri[]{data.getData()};
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(uris);
                          }
                      } else {
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }
                      }
                      filePathCallback = null;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }
          }
          EOF

      - name: Create activity_main.xml
        run: |
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/webview"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          EOF

      - name: Create minimal styles.xml
        run: |
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>
          </resources>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-App
          path: app/build/outputs/apk/debug/*.apk
