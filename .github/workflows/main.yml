name: "Ultimate APK Builder (All-In-One)"

on:
  repository_dispatch:
    types: [build-app]
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      # 1. مکمل صفائی اور فولڈر کی تیاری
      - name: "Environment Reset"
        run: |
          rm -rf app/src/main/res/*
          rm -rf app/src/main/java/*
          mkdir -p app/src/main/java/temp_pkg
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/drawable

      # 2. ڈیٹا انجیکشن اور مسنگ ریسورس فکسر
      - name: "Inject and Auto-Generate Resources"
        id: sync
        env:
          JAVA_CODE: ${{ github.event.client_payload.java }}
          XML_LAYOUT: ${{ github.event.client_payload.xml }}
          MANIFEST_XML: ${{ github.event.client_payload.manifest }}
        run: |
          # کوڈ سیو کرنا
          echo "$JAVA_CODE" > app/src/main/java/temp_pkg/MainActivity.java
          echo "$XML_LAYOUT" > app/src/main/res/layout/activity_main.xml
          
          # پیکیج ڈٹیکشن
          RAW_PKG=$(grep -m 1 "^package " app/src/main/java/temp_pkg/MainActivity.java | sed 's/package //' | sed 's/;//' | xargs)
          if [ -z "$RAW_PKG" ]; then RAW_PKG="com.systempro.app"; fi
          
          # مسنگ آئیکن کا حل (آئیکن کی جگہ ایک خالی Drawable بنانا تاکہ AAPT فیل نہ ہو)
          echo '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF000000" android:pathData="M12,2L4.5,20.29L5.21,21L12,18L18.79,21L19.5,20.29L12,2Z"/></vector>' > app/src/main/res/drawable/ic_launcher_background.xml
          # مینی فیسٹ میں اگر آئیکن مسنگ ہے تو اسے ڈراایبل سے بدل دیں یا فولڈر بنا دیں
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cp app/src/main/res/drawable/ic_launcher_background.xml app/src/main/res/mipmap-mdpi/ic_launcher.xml

          # مینی فیسٹ کی اصلاح
          if [ -n "$MANIFEST_XML" ]; then
            echo "$MANIFEST_XML" > app/src/main/AndroidManifest.xml
            # مینی فیسٹ سے آئیکن کے ریفرنس کو زبردستی ٹھیک کرنا اگر وہ ایرر دے رہا ہو
            sed -i 's|@mipmap/ic_launcher|@drawable/ic_launcher_background|g' app/src/main/AndroidManifest.xml
          else
            echo "<?xml version='1.0' encoding='utf-8'?><manifest xmlns:android='http://schemas.android.com/apk/res/android' package='$RAW_PKG'><application android:label='SystemPro' android:icon='@drawable/ic_launcher_background'><activity android:name='.MainActivity' android:exported='true'><intent-filter><action android:name='android.intent.action.MAIN' /><category android:name='android.intent.category.LAUNCHER' /></intent-filter></activity></application></manifest>" > app/src/main/AndroidManifest.xml
          fi

          # پیکیج سنک
          PKG_PATH=$(echo "$RAW_PKG" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          mv app/src/main/java/temp_pkg/MainActivity.java "app/src/main/java/$PKG_PATH/"
          
          echo "PKG=$RAW_PKG" >> $GITHUB_OUTPUT
          echo "APP_NAME=${{ github.event.client_payload.app_name || 'SystemPro' }}" >> $GITHUB_OUTPUT

      # 3. گریڈل 8.5 اور جاوا 17
      - name: "Build Engine Setup"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: "Generate Build Config"
        run: |
          cat > settings.gradle <<EOF
          include ':app'
          EOF

          cat > build.gradle <<EOF
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          cat > app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace '${{ steps.sync.outputs.PKG }}'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ steps.sync.outputs.PKG }}'
                  minSdk 24
                  targetSdk 34
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      # 4. بلڈ پروسیس
      - name: "Assemble APK"
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      # 5. اپ لوڈ
      - name: "Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sync.outputs.APP_NAME }}
          path: app/build/outputs/apk/debug/*.apk
