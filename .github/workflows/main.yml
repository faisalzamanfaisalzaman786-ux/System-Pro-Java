name: System Pro - Total Wipeout & Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  wipe-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Total Wipeout (مکمل صفائی)
        run: |
          # اینڈرائیڈ کے تمام کوڈ فولڈرز کو مکمل ڈیلیٹ کریں
          rm -rf app/src/main/java
          rm -rf app/src/main/res
          rm -rf app/src/main/AndroidManifest.xml
          
          # نئے سرے سے فولڈر بنائیں
          mkdir -p app/src/main/java/com/systempro/ultimate
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

      - name: 3. Create Guaranteed Working Files
        run: |
          # 1. New Manifest
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="System Pro" android:theme="@style/Theme.AppCompat">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 2. Basic Styles
          echo '<resources><style name="Theme.AppCompat" parent="Theme.AppCompat.Light.NoActionBar" /></resources>' > app/src/main/res/values/styles.xml

          # 3. Simple Java File
          cat <<EOF > app/src/main/java/com/systempro/ultimate/MainActivity.java
          package com.systempro.ultimate;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: 4. Build with Gradle 8.5
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 5. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V8-Final
          path: app/build/outputs/apk/debug/*.apk
