name: System Pro Master APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ایپ کا نام'
        required: true
        default: 'System Pro App'
      pkg_name:
        description: 'پیکج نیم (مثلاً com.system.pro)'
        required: true
        default: 'com.systempro.apk'
      java_code:
        description: 'MainActivity.java کا کوڈ'
        required: true
      xml_code:
        description: 'activity_main.xml کا کوڈ'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Official Android Structure
      run: |
        # پیکج نیم کے مطابق ڈائریکٹری بنانا
        PKG_PATH=$(echo "${{ github.event.inputs.pkg_name }}" | tr '.' '/')
        
        # تمام ضروری فولڈرز بنانا
        mkdir -p app/src/main/java/$PKG_PATH
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        mkdir -p gradle/wrapper

    - name: Generate Root Build Files
      run: |
        # root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # settings.gradle
        echo "include ':app'" > settings.gradle
        
        # gradle.properties
        echo "android.useAndroidX=true" > gradle.properties

    - name: Generate App Module Files
        # app/build.gradle
      run: |
        cat << EOF > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace '${{ github.event.inputs.pkg_name }}'
            compileSdk 34
            defaultConfig {
                applicationId '${{ github.event.inputs.pkg_name }}'
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName '1.0'
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

    - name: Write Android Manifest
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Write Java and XML Code
      shell: bash
      run: |
        PKG_PATH=$(echo "${{ github.event.inputs.pkg_name }}" | tr '.' '/')
        
        # MainActivity.java لکھنا
        printf "%s" "${{ github.event.inputs.java_code }}" > app/src/main/java/$PKG_PATH/MainActivity.java

        # Layout XML لکھنا
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        ${{ github.event.inputs.xml_code }}
        EOF

        # Strings.xml
        echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">${{ github.event.inputs.app_name }}</string></resources>' > app/src/main/res/values/strings.xml

    - name: Setup Gradle wrapper
      run: gradle wrapper --gradle-version 8.5

    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name }}
        path: app/build/outputs/apk/debug/app-debug.apk
