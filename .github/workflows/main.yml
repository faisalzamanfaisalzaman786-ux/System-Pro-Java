name: "Ultimate APK Builder (All-In-One)"

on:
  repository_dispatch:
    types: [build-app]
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      # 1. ماحول صاف کریں
      - name: "Full System Cleanup"
        run: |
          rm -rf app/src/main/res/*
          rm -rf app/src/main/java/*
          mkdir -p app/src/main/java/temp_pkg
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/values

      # 2. ڈیٹا انجیکشن (Safe Writing without EOF issues)
      - name: "Inject Payload"
        env:
          JAVA_CODE: ${{ github.event.client_payload.java }}
          XML_LAYOUT: ${{ github.event.client_payload.xml }}
          MANIFEST_XML: ${{ github.event.client_payload.manifest }}
          MENU_XML: ${{ github.event.client_payload.menu }}
        run: |
          # EOF کے بجائے براہ راست پائپ استعمال کریں تاکہ سینٹیکس ایرر نہ آئے
          printf "%s" "$JAVA_CODE" > app/src/main/java/temp_pkg/MainActivity.java
          printf "%s" "$XML_LAYOUT" > app/src/main/res/layout/activity_main.xml
          
          if [ -n "$MANIFEST_XML" ]; then
            printf "%s" "$MANIFEST_XML" > app/src/main/AndroidManifest.xml
          else
            echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="App"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          fi
          
          if [ -n "$MENU_XML" ]; then
            printf "%s" "$MENU_XML" > app/src/main/res/menu/main_menu.xml
          fi

      # 3. پیکیج سنک (Robust sed handling)
      - name: "Package & Resource Auto-Fix"
        id: sync
        run: |
          # پیکیج نیم نکالنا
          RAW_PKG=$(grep -m 1 "^package " app/src/main/java/temp_pkg/MainActivity.java | sed 's/package //' | sed 's/;//' | xargs)
          if [ -z "$RAW_PKG" ]; then RAW_PKG="com.systempro.app"; fi
          
          PKG_PATH=$(echo "$RAW_PKG" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          mv app/src/main/java/temp_pkg/MainActivity.java "app/src/main/java/$PKG_PATH/"
          rm -rf app/src/main/java/temp_pkg
          
          # XML فکسنگ: سلیش کے بجائے پائپ (|) استعمال کریں تاکہ sed ایرر نہ دے
          find app/src/main/res -name "*.xml" -type f | while read file; do
            if grep -q "app:" "$file" && ! grep -q "xmlns:app" "$file"; then
              sed -i 's|\(<[a-zA-Z]\+\)|\1 xmlns:app="http://schemas.android.com/apk/res-auto"|' "$file"
            fi
            if ! grep -q "xmlns:android" "$file"; then
              sed -i 's|\(<[a-zA-Z]\+\)|\1 xmlns:android="http://schemas.android.com/apk/res/android"|' "$file"
            fi
          done

          echo "PKG=$RAW_PKG" >> $GITHUB_OUTPUT
          echo "APP_NAME=${{ github.event.client_payload.app_name || 'SystemPro' }}" >> $GITHUB_OUTPUT

      # 4. گریڈل 8.5 ماحول
      - name: "Setup Build Environment"
        run: |
          cat > settings.gradle <<EOF
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { 
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() } 
          }
          rootProject.name = "${{ steps.sync.outputs.APP_NAME }}"
          include ':app'
          EOF

          cat > build.gradle <<EOF
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          cat > app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace '${{ steps.sync.outputs.PKG }}'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ steps.sync.outputs.PKG }}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      # 5. جاوا اور بلڈ
      - name: "Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Setup Gradle 8.5"
        run: gradle wrapper --gradle-version 8.5

      - name: "Build & Clean APK"
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      # 6. اپ لوڈ
      - name: "Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sync.outputs.APP_NAME }}
          path: app/build/outputs/apk/debug/*.apk
