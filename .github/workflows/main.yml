name: System Pro Master Build

on:
  workflow_dispatch: # API کال کے لیے یہ لازمی ہے

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # پوری ہسٹری نکالنے کے لیے تاکہ فائلز مس نہ ہوں

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto Rename Package & Prepare Data
        run: |
          # ٹائم سٹیمپ کے ساتھ یونیک پیکج نیم
          NEW_PKG="com.systempro.app_$(date +'%s')"
          echo "Target Package: $NEW_PKG"
          
          # فائلز کو ڈھونڈ کر تبدیل کرنا (بغیر کسی ایرر کے)
          # ہم صرف ان فائلز کو ٹارگٹ کر رہے ہیں جو اینڈرائیڈ پروجیکٹ کا حصہ ہیں
          find . -type f \( -name "build.gradle" -o -name "AndroidManifest.xml" \) -exec sed -i "s/com.systempro.app[a-zA-Z0-9._]*/$NEW_PKG/g" {} +
          
          echo "Package name updated successfully."

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SystemPro-Build
          path: "**/build/outputs/apk/release/*.apk"
