name: System Pro Ultimate Strong Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Execute Strong Build Engine
        run: |
          # 1. ماحول کی تیاری
          USER_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME="${USER_PKG:-com.system.pro.id$(date +%s)}"
          
          rm -rf app temp_dir
          mkdir -p app/src/main/java app/src/main/res/layout app/src/main/res/values app/src/main/res/mipmap-hdpi

          # 2. ضروری اسٹائلز اور رنگوں کا اندراج
          printf "<resources>\n    <color name=\"colorPrimary\">#6200EE</color>\n    <color name=\"colorPrimaryDark\">#3700B3</color>\n    <color name=\"colorAccent\">#03DAC5</color>\n</resources>" > app/src/main/res/values/colors.xml
          printf "<resources>\n    <style name=\"CalcButton\">\n        <item name=\"android:layout_width\">0dp</item>\n        <item name=\"android:layout_height\">80dp</item>\n        <item name=\"android:layout_columnWeight\">1</item>\n        <item name=\"android:textAllCaps\">false</item>\n    </style>\n</resources>" > app/src/main/res/values/styles.xml

          # 3. پراجیکٹ فائلز پر کام
          if [ -n "${{ github.event.client_payload.zip_data }}" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            unzip -o project.zip -d temp_dir/
            
            [ -d "temp_dir/src/main/res" ] && cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
            
            PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
            mkdir -p "app/src/main/java/$PKG_PATH"
            
            find temp_dir -name "*.java" -exec cp {} "app/src/main/java/$PKG_PATH/" \;
            
            # ہر جاوا فائل کو درست کرنے کا لوپ
            find "app/src/main/java/$PKG_PATH/" -name "*.java" -type f | while read -r file; do
              sed -i "s/^package .*;/package $PKG_NAME;/g" "$file"
              sed -i "/import .*\.R;/d" "$file"
              sed -i "/package $PKG_NAME;/a import $PKG_NAME.R;" "$file"
              sed -i "s/\bR\.id\./$PKG_NAME.R.id./g" "$file"
              sed -i "s/\bR\.layout\./$PKG_NAME.R.layout./g" "$file"
              sed -i "s/\bR\.style\./$PKG_NAME.R.style./g" "$file"
            done
          fi

          # 4. مینی فیسٹ فائل
          printf "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <application android:label=\"System Pro\" android:icon=\"@mipmap/ic_launcher\" android:theme=\"@style/Theme.AppCompat.Light.NoActionBar\">\n        <activity android:name=\"$PKG_NAME.MainActivity\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHer\" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>" > app/src/main/AndroidManifest.xml

          # 5. گریڈل سیٹنگز
          printf "plugins { id 'com.android.application' }\nandroid {\n    namespace '$PKG_NAME'\n    compileSdk 34\n    defaultConfig {\n        applicationId '$PKG_NAME'\n        minSdk 21\n        targetSdk 34\n        versionCode $(date +%s)\n    }\n}\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'com.google.android.material:material:1.11.0'\n}" > app/build.gradle
          
          echo "include ':app'" > settings.gradle
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Strong-V11
          path: app/build/outputs/apk/debug/*.apk
