name: System Pro Build System

on:
  repository_dispatch:
    types: [build_app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Structure & Inject Data
        run: |
          # پرانے فولڈرز کا مسئلہ حل کرنے کے لیے -p استعمال کیا گیا ہے
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/assets/www
          
          # یہاں وہ فائلز ڈالیں جو ایپلیکیشن سے آ رہی ہیں
          # مثال کے طور پر اگر index.html اور امیج آ رہے ہیں:
          # mv user_data/index.html app/src/main/assets/www/
          # mv user_data/icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          echo "Structure generated and data injected successfully."

      - name: Dynamic Permissions & Package Rename
        run: |
          # یہاں ہم ضرورت کے مطابق پیکج نیم یا پرمیشنز چینج کر سکتے ہیں
          sed -i 's/com.old.package/com.systempro.master/g' app/build.gradle

      - name: Prepare Gradle & Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Master-v1
          path: app/build/outputs/apk/debug/*.apk
