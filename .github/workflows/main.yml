name: ZipForge Pro Build Engine

on:
  repository_dispatch:
    types: [build-from-b64]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -d /opt/gradle gradle-8.5-bin.zip
          export PATH=$PATH:/opt/gradle/gradle-8.5/bin

      - name: Decode and Prepare Project
        run: |
          # Create project directories
          mkdir -p app/src/main/java/com/system/pro
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-hdpi

          # Decode the base64 ZIP data from UI
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project_data.zip
          
          # Unzip files to appropriate locations
          unzip -o project_data.zip -d temp_extract/
          
          # Move files to their Android structure
          cp temp_extract/MainActivity.java app/src/main/java/com/system/pro/
          cp temp_extract/activity_main.xml app/src/main/res/layout/
          cp temp_extract/AndroidManifest.xml app/src/main/
          
          # Check if icon exists and move it
          if [ -f "temp_extract/ic_launcher.png" ]; then
            cp temp_extract/ic_launcher.png app/src/main/res/mipmap-hdpi/
          fi

      - name: Generate Build Files
        run: |
          # Create build.gradle (Module: app)
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace "com.system.pro"
              compileSdk 34
              defaultConfig {
                  applicationId "${{ github.event.client_payload.package_name }}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

      - name: Build APK with Gradle 8.5
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name }}-v1400
          path: app/build/outputs/apk/release/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
