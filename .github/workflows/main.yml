name: Build APK

on:
  repository_dispatch:
    types: [build-apk]
  # Optional: also allow manual trigger with URL input
  workflow_dispatch:
    inputs:
      icon_url:
        description: 'Public URL of the app icon (PNG)'
        required: true
      app_name:
        description: 'App name'
        required: true
        default: 'MyApp'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show payload (debug)
        run: |
          echo "App name: ${{ github.event.client_payload.app_name || github.event.inputs.app_name }}"
          echo "Icon URL: ${{ github.event.client_payload.icon_url || github.event.inputs.icon_url }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download icon from URL
        run: |
          ICON_URL="${{ github.event.client_payload.icon_url || github.event.inputs.icon_url }}"
          if [ -z "$ICON_URL" ]; then
            echo "Error: No icon URL provided"
            exit 1
          fi
          curl -L -o app_icon.png "$ICON_URL"
          file app_icon.png
          # Optionally resize/optimize icon here (e.g., with ImageMagick)
          # convert app_icon.png -resize 512x512 icon.png

      - name: Write code files (generate Android project)
        run: |
          # Your existing code generation steps here
          # Use the downloaded icon (now at icon.png or app_icon.png)
          cp app_icon.png app/src/main/res/drawable/ic_launcher.png
          # ... rest of your project generation

      - name: Build APK
        run: |
          # Example: build with Gradle
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release (optional)
        if: github.event_name == 'repository_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: build-${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
