name: System Pro Auto Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Workspace and Resources
        run: |
          # 1. پرانی فائلیں صاف کرنا (تاکہ نیا پیکج نیم مکس نہ ہو)
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/layout/*
          rm -rf app/src/main/res/drawable/*
          rm -rf app/src/main/res/values/strings.xml

          # 2. ضروری فولڈرز بنانا
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/menu

          # 3. اگر ڈیٹا زپ فائل سے آ رہا ہے (HTML UI Trigger)
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            mkdir -p temp_dir
            unzip -o project.zip -d temp_dir/
            
            # ڈیٹا کو مین ایپ فولڈر میں منتقل کرنا
            cp -rf temp_dir/src/main/* app/src/main/ || true
            rm -rf temp_dir project.zip
          fi

          # 4. مینیو فائل کا لازمی فکس (اگر زپ میں نہ ہو)
          if [ ! -f "app/src/main/res/menu/main_menu.xml" ]; then
            cat <<EOF > app/src/main/res/menu/main_menu.xml
            <?xml version="1.0" encoding="utf-8"?>
            <menu xmlns:android="http://schemas.android.com/apk/res/android"
                  xmlns:app="http://schemas.android.com/apk/res-auto">
                <item android:id="@+id/action_settings" android:title="Settings" app:showAsAction="never" />
            </menu>
            EOF
          fi

      - name: Force Gradle Wrapper Version
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew wrapper --gradle-version 8.5
          fi

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx2048m -Dorg.gradle.jvmargs=-Xmx2048m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name || 'System-Pro-Release' }}
          path: app/build/outputs/apk/debug/*.apk
