name: Build HTML to Native APK

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch: # تاکہ آپ خود بھی بٹن دبا کر رن کر سکیں

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/view-node@v3
        with:
          node-version: '18'

      - name: Create Capacitor Config Files
        run: |
          # خودکار طور پر package.json بنانا
          echo '{
            "name": "system-pro-app",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "^5.0.0",
              "@capacitor/android": "^5.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^5.0.0"
            }
          }' > package.json

          # خودکار طور پر capacitor.config.json بنانا
          echo '{
            "appId": "com.systempro.app",
            "appName": "System Pro",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json

      - name: Install Dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android

      - name: Copy Web Assets
        run: npx cap copy android

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: System-Pro-Release
          path: android/app/build/outputs/apk/debug/app-debug.apk
