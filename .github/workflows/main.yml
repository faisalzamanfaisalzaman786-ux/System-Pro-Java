      - name: Process Zip Data
        run: |
          # پرانی فائلیں صاف کرنا
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/*
          
          # زپ ڈیٹا کو ڈی کوڈ کرنا
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
          mkdir -p temp_dir
          unzip -o project.zip -d temp_dir/
          
          # فائلوں کو صحیح اینڈرائیڈ اسٹرکچر میں منتقل کرنا
          # اگر زپ میں 'java' اور 'res' فولڈرز ہیں
          if [ -d "temp_dir/java" ]; then
            cp -rv temp_dir/java/* app/src/main/java/ || true
          fi
          if [ -d "temp_dir/res" ]; then
            cp -rv temp_dir/res/* app/src/main/res/ || true
          fi
          # اگر زپ میں 'src' ہے تو اسے ترجیح دیں
          if [ -d "temp_dir/src" ]; then
            cp -rv temp_dir/src/main/java/* app/src/main/java/ || true
            cp -rv temp_dir/src/main/res/* app/src/main/res/ || true
          fi
