name: Build System Pro (Fixed Inputs)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ایپ کا نام'
        required: true
        default: 'System Pro'
      package_name:
        description: 'پیکیج آئی ڈی'
        required: true
        default: 'com.systempro.app'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Cordova project
        run: |
          # یہاں ہم چیک کر رہے ہیں کہ اگر ان پٹ خالی ہے تو ڈیفالٹ نام استعمال کریں
          APP_NAME="${{ github.event.inputs.app_name || 'SystemPro' }}"
          PKG_NAME="${{ github.event.inputs.package_name || 'com.systempro.app' }}"
          
          cordova create app "$PKG_NAME" "$APP_NAME"
          cd app
          cordova platform add android
          
          # Config.xml کو اپ ڈیٹ کریں
          sed -i "s/id=\"[^\"]*\"/id=\"$PKG_NAME\"/" config.xml
          sed -i "s|<name>.*</name>|<name>$APP_NAME</name>|" config.xml

      - name: Prepare web content
        run: |
          TARGET_DIR="app/www"
          rm -rf "$TARGET_DIR"/*
          if [ -f ".github/workflows/Index.html" ]; then
            cp ".github/workflows/Index.html" "$TARGET_DIR/index.html"
            cp .github/workflows/*.css "$TARGET_DIR/" 2>/dev/null || true
            cp .github/workflows/*.js "$TARGET_DIR/" 2>/dev/null || true
          else
            echo "<html><body><h1>System Pro Ready</h1></body></html>" > "$TARGET_DIR/index.html"
          fi

      - name: Configure AndroidManifest
        run: |
          cd app/platforms/android/app/src/main
          sed -i '/<application / s|>| android:usesCleartextTraffic="true">|' AndroidManifest.xml

      - name: Build AAB and APK
        run: |
          cd app
          # اب یہ کمانڈ ایرر نہیں دے گی
          cordova build android --release -- --packageType=bundle
          cordova build android --release -- --packageType=apk

      - name: Sign and Finalize
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            
            jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
              -keystore keystore.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
              app/platforms/android/app/build/outputs/bundle/release/app-release.aab \
              "${{ secrets.KEY_ALIAS }}"
            
            jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
              -keystore keystore.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
              app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk \
              "${{ secrets.KEY_ALIAS }}"
              
            mv app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk app-release-signed.apk
          else
            mv app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk app-testing.apk
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "System-Pro-Builds"
          path: |
            app/platforms/android/app/build/outputs/bundle/release/app-release.aab
            app-release-signed.apk
            app-testing.apk
