name: System Pro Auto Build

on:
  workflow_dispatch: # یہ لائن API کال کے ذریعے ورک فلو چلانے کے لیے لازمی ہے

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto Rename Package & Prepare Data
        run: |
          # موجودہ وقت (Timestamp) کے حساب سے نیا پیکج نیم بنانا
          NEW_PKG="com.systempro.app_$(date +'%Y%m%d%H%M%S')"
          echo "Building with New Package: $NEW_PKG"
          
          # ریپوزٹری میں جہاں بھی applicationId یا package name ہے اسے تبدیل کرنا
          # یہ کمانڈ خود فائلز ڈھونڈ لے گی تاکہ 'no input files' کا ایرر نہ آئے
          find . -name "build.gradle" -exec sed -i "s/applicationId \".*\"/applicationId \"$NEW_PKG\"/g" {} +
          find . -name "AndroidManifest.xml" -exec sed -i "s/package=\".*\"/package=\"$NEW_PKG\"/g" {} +

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SystemPro-Build-${{ github.run_id }}
          path: app/build/outputs/apk/release/*.apk
