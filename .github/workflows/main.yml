name: System Pro Official Build

on:
  repository_dispatch:
    types: [build-from-b64]

jobs:
  assemble-official-apk:
    name: "System Pro: Official APK Generation"
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Initialize Project Structure
        run: |
          # مکمل کلین اپ
          rm -rf .gradle app/build build
          mkdir -p app/src/main/java/com/system/pro
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
          # پروفیشنل گریڈل کنفیگریشن
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          echo "include ':app'" > settings.gradle

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.system.pro'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ github.event.client_payload.package_name }}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

      - name: Precise Injection & Package Correction
        run: |
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > source.zip
          unzip -o source.zip -d temp_src/
          
          # پیکیج نیم کی پہلے سے درستی (Pre-Correction)
          find temp_src/ -name "*.java" -type f -exec sed -i '/^package /d' {} +
          find temp_src/ -name "*.java" -type f -exec sed -i '1i package com.system.pro;' {} +
          
          # فائلز کی ان کے مخصوص فولڈرز میں منتقلی
          # صرف جاوا فائلز جاوا فولڈر میں جائیں گی
          find temp_src/ -name "*.java" -exec cp {} app/src/main/java/com/system/pro/ \;
          # صرف XML لے آؤٹ فائلز layout فولڈر میں جائیں گی (سوائے Manifest کے)
          find temp_src/ -name "*.xml" ! -name "AndroidManifest.xml" -exec cp {} app/src/main/res/layout/ \; || true
          
          # مینی فیسٹ کو اس کے درست مقام (src/main/) پر لکھنا
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="true" android:label="System Pro" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          rm -rf temp_src source.zip

      - name: Build Official Debug APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload System Pro Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name || 'System-Pro-Official-Build' }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Success Summary
        if: success()
        run: |
          echo "## ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "Fixed Resource naming issue. APK generated with Gradle 8.5." >> $GITHUB_STEP_SUMMARY
