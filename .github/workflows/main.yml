name: System Pro - Maven Sync Fix

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  sync-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 3. Nuclear Cleanup & Repo Sync
        run: |
          # پرانی گریڈل فائلز کو مکمل ختم کرنا
          rm -rf .gradle build app/build gradlew gradlew.bat gradle/
          
          # ضروری پراپرٹیز سیٹ کرنا
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          # 1. Project level build.gradle
          cat <<EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://plugins.gradle.org/m2/" }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }
          EOF

          # 2. settings.gradle
          cat <<EOF > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }
          rootProject.name = "System Pro"
          include ':app'
          EOF

      - name: 4. Generate Wrapper and Build
        run: |
          # گریڈل ریپر دوبارہ بنانا
          gradle wrapper --gradle-version 8.5 --distribution-type all
          chmod +x gradlew
          
          # مکمل لاگز کے ساتھ بلڈ رن کرنا
          ./gradlew assembleDebug --stacktrace --info --no-daemon

      - name: 5. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V8-Final
          path: app/build/outputs/apk/debug/*.apk
