name: System Pro Auto Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          cache-disabled: true

      - name: Prepare and Build
        run: |
          # 1. متحرک پیکیج نیم اور ورژننگ
          RANDOM_ID=$(date +%s | tail -c 4)
          USER_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME="${USER_PKG:-com.faisal.systempro.b$RANDOM_ID}"
          
          echo "Building with Package Name: $PKG_NAME"

          # صفائی اور فولڈرز کی تیاری
          rm -rf .gradle build app/build gradle/ temp_dir/
          rm -f gradlew gradlew.bat
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-hdpi app/src/main/res/values app/src/main/java

          # 2. زپ فائل پروسیسنگ اور جاوا فکسر
          if [ -n "${{ github.event.client_payload.zip_data }}" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            unzip -o project.zip -d temp_dir/
            
            # جاوا فائلز میں پیکیج اور امپورٹس فکس کرنا
            find temp_dir/src/main/java -name "*.java" | while read -r java_file; do
                # پیکیج نیم بدلنا
                sed -i "s/^package .*;/package $PKG_NAME;/g" "$java_file"
                
                # ContentValues اور ضروری امپورٹس چیک کرنا اور شامل کرنا (اگر غائب ہوں)
                grep -q "android.content.ContentValues" "$java_file" || sed -i "/package $PKG_NAME;/a import android.content.ContentValues;" "$java_file"
                grep -q "android.provider.MediaStore" "$java_file" || sed -i "/package $PKG_NAME;/a import android.provider.MediaStore;" "$java_file"
                grep -q "androidx.annotation.NonNull" "$java_file" || sed -i "/package $PKG_NAME;/a import androidx.annotation.NonNull;" "$java_file"
            done
            
            # فولڈر سٹرکچر کے مطابق فائلز منتقل کرنا
            PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
            mkdir -p "app/src/main/java/$PKG_PATH"
            find temp_dir/src/main/java -name "*.java" -exec cp {} "app/src/main/java/$PKG_PATH/" \;
            cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
          fi

          # 3. آئیکن اور میفیسٹ فکسر
          TARGET_ICON="app/src/main/res/mipmap-hdpi/ic_launcher.png"
          ICON_FOUND=$(find app/src/main/res -name "ic_launcher.png" | head -n 1)
          [ -n "$ICON_FOUND" ] && [ "$ICON_FOUND" != "$TARGET_ICON" ] && cp "$ICON_FOUND" "$TARGET_ICON" || touch "$TARGET_ICON"

          cat <<EOF > settings.gradle
          rootProject.name = "System Pro"
          include ':app'
          EOF

          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <application 
                  android:label="System Pro" 
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 4. مضبوط build.gradle
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace "$PKG_NAME"
              compileSdk 34
              defaultConfig {
                  applicationId "$PKG_NAME"
                  minSdk 21
                  targetSdk 34
                  versionCode $(date +%s | tail -c 8)
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation "androidx.camera:camera-core:1.3.0"
              implementation "androidx.camera:camera-camera2:1.3.0"
              implementation "androidx.camera:camera-lifecycle:1.3.0"
              implementation "androidx.camera:camera-view:1.3.0"
              implementation 'com.google.guava:guava:31.1-android'
          }
          EOF

          # 5. بلڈ ایگزیکیوشن
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final
          path: app/build/outputs/apk/debug/*.apk
