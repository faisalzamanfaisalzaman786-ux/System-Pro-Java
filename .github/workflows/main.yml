name: System Pro - Original Fix

on:
  workflow_dispatch:
  repository_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build APK
        run: |
          # وہی سادہ کمانڈ جو آپ کی پہلی فائل میں تھی
          bash ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon

      - name: Delivery (The Main Fix)
        uses: actions/upload-artifact@v4
        with:
          name: SystemPro-App
          # یہ وہ سیٹنگ ہے جو ہم بدل رہے ہیں تاکہ اصلی APK ملے
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
