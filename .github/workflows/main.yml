name: System Pro - Dynamic APK Builder

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]

concurrency:
  group: build-apk-single
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare directories
        run: mkdir -p app/src/main/assets app/src/main/res/drawable app/src/main/res/layout app/src/main/res/values

      - name: Copy HTML and permissions from repo
        run: |
          # Copy HTML (fail if missing)
          if [ ! -f index.html ]; then
            echo "Error: index.html not found in repository root"
            exit 1
          fi
          cp index.html app/src/main/assets/index.html
          
          # Use permissions.txt if exists, otherwise create default
          if [ ! -f permissions.txt ]; then
            echo "android.permission.INTERNET,android.permission.ACCESS_NETWORK_STATE" > permissions.txt
          fi
          
          # Default icon if not present
          if [ ! -f app/src/main/res/drawable/ic_launcher.png ]; then
            printf '%s' "iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAABmJLR0QA/wD/AP+gvaeTAAAAAXRSTlMAQObYZgAAAAlwSFlzAAAOxAAADsQBlSsOGwAAABlJREFUaN7t0DEBAAAAg6D7vzQNwAMtBAAAnwP9AABYF2RJAAAAAElFTkSuQmCC" | base64 --decode > app/src/main/res/drawable/ic_launcher.png
          fi

      - name: Build Android project
        env:
          APP_NAME: ${{ github.event.client_payload.app_name }}
        run: |
          # Use provided app name or default
          APP_NAME_VAL="${APP_NAME:-System Pro}"
          PACKAGE_BASE=$(echo "$APP_NAME_VAL" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')
          PACKAGE_NAME="com.systempro.${PACKAGE_BASE}"
          echo "Package name: $PACKAGE_NAME"

          # Gradle wrapper
          gradle wrapper --gradle-version 8.5 --distribution-type all
          chmod +x gradlew

          # gradle.properties
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # build.gradle (project)
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # settings.gradle
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "System Pro"
          include ':app'
          EOF

          # app/build.gradle
          cat > app/build.gradle << EOF
          plugins { id 'com.android.application' }
          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34
              defaultConfig {
                  applicationId "$PACKAGE_NAME"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug { debuggable true }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          # AndroidManifest.xml
          PERMISSIONS=$(cat permissions.txt | tr ',' '\n')
          cat > app/src/main/AndroidManifest.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          EOF
          for perm in $PERMISSIONS; do
            echo "    <uses-permission android:name=\"$perm\" />" >> app/src/main/AndroidManifest.xml
          done
          cat >> app/src/main/AndroidManifest.xml << EOF
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="$APP_NAME_VAL"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java (no placeholder, direct variable substitution)
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')
          mkdir -p "app/src/main/java/$PACKAGE_PATH"
          cat > "app/src/main/java/$PACKAGE_PATH/MainActivity.java" << EOF
          package $PACKAGE_NAME;

          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.net.Uri;
          import android.content.Intent;
          import android.webkit.WebSettings;
          import android.util.Log;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1;
              private static final String TAG = "WebViewApp";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  webView = findViewById(R.id.webview);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedError(WebView view, int errorCode, String description, String failingUrl) {
                          Log.e(TAG, "Error: " + errorCode + " - " + description);
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback,
                                                       FileChooserParams fileChooserParams) {
                          MainActivity.this.filePathCallback = filePathCallback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          startActivityForResult(intent, FILE_CHOOSER_REQUEST_CODE);
                          return true;
                      }
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                      @Override
                      public boolean onConsoleMessage(android.webkit.ConsoleMessage consoleMessage) {
                          Log.d(TAG, "JS: " + consoleMessage.message());
                          return true;
                      }
                  });
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      if (resultCode == RESULT_OK && data != null) {
                          filePathCallback.onReceiveValue(new Uri[]{data.getData()});
                      } else {
                          filePathCallback.onReceiveValue(null);
                      }
                      filePathCallback = null;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }
          }
          EOF

          # Layout
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/webview"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          EOF

          # Styles
          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>
          </resources>
          EOF

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-App
          path: app/build/outputs/apk/debug/*.apk
