name: System Pro - Dynamic APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: build-apk-single
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare directories
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

      - name: Create default index.html
        run: |
          cat <<'DEFAULT_HTML' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>System Pro</title>
              <style>
                  body { font-family: sans-serif; text-align: center; padding: 2rem; }
                  button { padding: 1rem; font-size: 1.2rem; margin-top: 2rem; }
              </style>
          </head>
          <body>
              <h1>System Pro</h1>
              <p>Default content – replace this HTML as needed.</p>
              <button onclick="alert('Hello from WebView!')">Click Me</button>
          </body>
          </html>
          DEFAULT_HTML

      - name: Create default icon
        run: |
          ICON_PATH="app/src/main/res/drawable/ic_launcher.png"
          # Create a simple blue square 48x48 PNG using ImageMagick (if available)
          if command -v convert >/dev/null 2>&1; then
            convert -size 48x48 xc:blue "$ICON_PATH"
          else
            # Fallback: embed a tiny valid PNG (48x48 blue) as Base64
            printf '%s' \
              "iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAABmJLR0QA/wD/AP+gvaeT" \
              "AAAAAXRSTlMAQObYZgAAAAlwSFlzAAAOxAAADsQBlSsOGwAAABlJREFUaN7t0DEBAAAA" \
              "g6D7vzQNwAMtBAAAnwP9AABYF2RJAAAAAElFTkSuQmCC" | base64 --decode > "$ICON_PATH"
          fi
          echo "Default icon created, size: $(wc -c < "$ICON_PATH") bytes"

      - name: Clean previous builds
        run: rm -rf .gradle build app/build gradlew gradlew.bat gradle/

      - name: Create gradle.properties
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Create project build.gradle
        run: |
          cat <<'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Create settings.gradle
        run: |
          cat <<'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "System Pro"
          include ':app'
          EOF

      - name: Create app build.gradle
        run: |
          cat <<'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.systempro.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.systempro.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable true
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="System Pro"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

      - name: Create MainActivity.java
        run: |
          PACKAGE_NAME="com.systempro.app"
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')
          mkdir -p "app/src/main/java/$PACKAGE_PATH"

          cat <<'EOF' > "app/src/main/java/$PACKAGE_PATH/MainActivity.java"
          package com.systempro.app;

          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.net.Uri;
          import android.content.Intent;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webview);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowContentAccess(true);
                  // Enable cross-origin and file access for local HTML
                  webView.getSettings().setAllowFileAccessFromFileURLs(true);
                  webView.getSettings().setAllowUniversalAccessFromFileURLs(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback,
                                                       FileChooserParams fileChooserParams) {
                          MainActivity.this.filePathCallback = filePathCallback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          startActivityForResult(intent, FILE_CHOOSER_REQUEST_CODE);
                          return true;
                      }

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          // Grant all requested permissions automatically for simplicity
                          // (For production, you should show a dialog)
                          request.grant(request.getResources());
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      if (resultCode == RESULT_OK && data != null) {
                          Uri[] uris = new Uri[]{data.getData()};
                          filePathCallback.onReceiveValue(uris);
                      } else {
                          filePathCallback.onReceiveValue(null);
                      }
                      filePathCallback = null;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }
          }
          EOF

      - name: Create activity_main.xml
        run: |
          cat <<'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/webview"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          EOF

      - name: Create minimal styles.xml
        run: |
          cat <<'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>
          </resources>
          EOF

      - name: Generate gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.5 --distribution-type all
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Get APK size
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(stat -c%s "$APK_PATH")
            echo "APK size: $APK_SIZE bytes ($(($APK_SIZE / 1024)) KB)"
          else
            echo "APK not found!"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-App
          path: app/build/outputs/apk/debug/*.apk
