name: Build APK from HTML

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'MyApp'
      permissions:
        description: 'Permissions (comma separated)'
        required: false
      app_icon:
        description: 'Icon base64 (optional)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Get app details from payload
        id: details
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            APP_NAME="${{ github.event.inputs.app_name }}"
            PERMISSIONS="${{ github.event.inputs.permissions }}"
            ICON_BASE64="${{ github.event.inputs.app_icon }}"
          else
            APP_NAME="${{ github.event.client_payload.app_name }}"
            PERMISSIONS="${{ github.event.client_payload.permissions }}"
            ICON_BASE64="${{ github.event.client_payload.app_icon }}"
          fi
          echo "app_name=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "permissions=${PERMISSIONS}" >> $GITHUB_OUTPUT
          echo "icon_base64=${ICON_BASE64}" >> $GITHUB_OUTPUT

      - name: Prepare HTML file (from repo)
        run: |
          if [ ! -f "index.html" ]; then
            echo "Error: index.html not found in repository root!"
            exit 1
          fi
          mkdir -p app
          cp index.html app/index.html
          echo "HTML file copied."

      - name: Decode and save icon (if provided)
        run: |
          ICON_BASE64="${{ steps.details.outputs.icon_base64 }}"
          if [ -n "$ICON_BASE64" ]; then
            echo "$ICON_BASE64" | base64 -d > app/icon.png
            echo "Icon saved."
          else
            echo "No icon provided, using default."
          fi

      - name: Create AndroidManifest.xml with permissions
        run: |
          PERMISSIONS="${{ steps.details.outputs.permissions }}"
          cat > app/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.${{ steps.details.outputs.app_name }}">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="${{ steps.details.outputs.app_name }}"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity"
                      android:configChanges="orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          EOF
          IFS=',' read -ra PERM_ARRAY <<< "$PERMISSIONS"
          for perm in "${PERM_ARRAY[@]}"; do
            if [ -n "$perm" ]; then
              sed -i "/<\/application>/i \    <uses-permission android:name=\"$perm\" />" app/AndroidManifest.xml
            fi
          done
          echo "AndroidManifest.xml created."

      - name: Install Cordova and build APK (debug)
        run: |
          npm install -g cordova
          cordova create myapp com.example.${{ steps.details.outputs.app_name }} "${{ steps.details.outputs.app_name }}"
          cd myapp
          rm -rf www
          cp -r ../app www
          cordova platform add android

          # Set custom icon if provided
          if [ -f "../app/icon.png" ]; then
            # Create mipmap folders and copy icon
            mkdir -p platforms/android/app/src/main/res/mipmap-hdpi
            mkdir -p platforms/android/app/src/main/res/mipmap-mdpi
            mkdir -p platforms/android/app/src/main/res/mipmap-xhdpi
            mkdir -p platforms/android/app/src/main/res/mipmap-xxhdpi
            mkdir -p platforms/android/app/src/main/res/mipmap-xxxhdpi
            cp ../app/icon.png platforms/android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp ../app/icon.png platforms/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp ../app/icon.png platforms/android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp ../app/icon.png platforms/android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp ../app/icon.png platforms/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            # Update config.xml to use custom icon
            if ! grep -q '<icon' config.xml; then
              sed -i '/<platform name="android">/a \        <icon src="res\/mipmap\/ic_launcher.png" />' config.xml
            fi
            echo "Custom icon applied."
          fi

          # Build debug APK (signed with debug key)
          cordova build android
          cd ..

          # Locate the debug APK
          DEBUG_APK=$(find . -path "*/app/build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$DEBUG_APK" ]; then
            echo "Error: No debug APK found."
            exit 1
          fi
          echo "Found debug APK: $DEBUG_APK"
          cp "$DEBUG_APK" app.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.details.outputs.app_name }}
          path: app.apk

      - name: Create Release
        if: github.event_name == 'repository_dispatch'
        run: |
          RUN_ID=${{ github.run_id }}
          gh release create "run-${RUN_ID}" app.apk --title "APK Build ${{ steps.details.outputs.app_name }}" --notes "Generated from workflow run ${{ github.run_id }}" --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
