name: System Pro Auto Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          cache-disabled: true

      - name: Prepare and Build
        run: |
          # پیکیج نیم کا تعین
          PKG_NAME="${{ github.event.client_payload.package_name || 'com.faisal.systempro' }}"
          
          # پرانے ڈیٹا کی صفائی
          rm -rf .gradle build app/build
          rm -rf app/src/main/java/* app/src/main/res/drawable/* app/src/main/res/mipmap-*

          # فولڈرز کی تیاری
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/values

          # اگر زپ فائل موجود ہو تو اسے ایکسٹریکٹ اور سیٹ اپ کرنا
          if [ -n "${{ github.event.client_payload.zip_data }}" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            unzip -o project.zip -d temp_dir/
            
            # فائل نیمز کو درست کرنا (لوئر کیس اور سپیس ختم کرنا)
            find temp_dir/src/main/res -type f | while read -r file; do
                new_name=$(echo "$file" | tr ' ' '_' | tr -d '()' | tr '[:upper:]' '[:lower:]')
                mv "$file" "$new_name" 2>/dev/null || true
            done
            
            # پیکیج نیم اپ ڈیٹ کرنا
            find temp_dir/src/main/java -name "*.java" -exec sed -i "s/^package .*;/package $PKG_NAME;/g" {} +
            
            # جاوا فائلز کو درست ڈائریکٹری میں منتقل کرنا
            PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
            mkdir -p "app/src/main/java/$PKG_PATH"
            find temp_dir/src/main/java -name "*.java" -exec cp {} "app/src/main/java/$PKG_PATH/" \;
            cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
          fi

          # آئیکن سیٹ اپ
          ICON_FOUND=$(find app/src/main/res/drawable -name "*.png" | head -n 1)
          if [ -n "$ICON_FOUND" ]; then
              cp "$ICON_FOUND" app/src/main/res/mipmap-hdpi/ic_launcher.png
          else
              touch app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi

          # Android Manifest (تمام ضروری پرمیشنز کے ساتھ)
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="$PKG_NAME">
              
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <application 
                  android:label="System Pro" 
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # build.gradle (CameraX ڈیپنڈنسیز کے ساتھ)
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace "$PKG_NAME"
              compileSdk 34
              defaultConfig {
                  applicationId "$PKG_NAME"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              
              // CameraX Core Libraries
              def camerax_version = "1.3.0"
              implementation "androidx.camera:camera-core:\${camerax_version}"
              implementation "androidx.camera:camera-camera2:\${camerax_version}"
              implementation "androidx.camera:camera-lifecycle:\${camerax_version}"
              implementation "androidx.camera:camera-view:\${camerax_version}"
              
              // Guava (Required for ListenableFuture)
              implementation 'com.google.guava:guava:31.1-android'
          }
          EOF

          # بلڈ شروع کریں
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final
          path: app/build/outputs/apk/debug/*.apk
