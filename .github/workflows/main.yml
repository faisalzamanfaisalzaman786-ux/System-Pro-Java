name: System Pro - Dynamic APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]

concurrency:
  group: build-apk-single
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        run: |
          SDK_PATH="$ANDROID_HOME"
          if [ ! -d "$SDK_PATH" ]; then
            echo "SDK not found at $SDK_PATH"
            exit 1
          fi
          echo "Android SDK found at $SDK_PATH"

          SDKMANAGER=""
          if [ -f "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_PATH/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$SDK_PATH/cmdline-tools/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_PATH/cmdline-tools/tools/bin/sdkmanager"
          elif [ -f "$SDK_PATH/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_PATH/tools/bin/sdkmanager"
          else
            echo "sdkmanager not found"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Prepare directories
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

      - name: Process client payload (HTML, icon, permissions, app name)
        if: github.event_name == 'repository_dispatch'
        run: |
          printf '%s' "${{ github.event.client_payload.app_html }}" > app/src/main/assets/index.html
          if [ -n "${{ github.event.client_payload.app_icon }}" ]; then
            printf '%s' "${{ github.event.client_payload.app_icon }}" | base64 --decode > app/src/main/res/drawable/ic_launcher.png
          fi
          printf '%s' "${{ github.event.client_payload.permissions }}" > permissions.txt
          printf '%s' "${{ github.event.client_payload.app_name }}" > app_name.txt

      - name: Verify and fix HTML & Icon
        run: |
          if [ ! -s app/src/main/assets/index.html ]; then
            echo "Error: index.html is empty! Please provide HTML content."
            exit 1
          fi
          echo "HTML size: $(wc -c < app/src/main/assets/index.html) bytes"

          ICON_PATH="app/src/main/res/drawable/ic_launcher.png"
          if [ -f "$ICON_PATH" ]; then
            SIZE=$(wc -c < "$ICON_PATH")
            if [ "$SIZE" -lt 100 ]; then
              echo "Icon too small ($SIZE bytes), replacing with default."
              rm -f "$ICON_PATH"
            else
              echo "Icon file size: $SIZE bytes"
            fi
          fi
          if [ ! -f "$ICON_PATH" ]; then
            echo "Creating default blue icon (48x48)."
            if command -v convert >/dev/null 2>&1; then
              convert -size 48x48 xc:blue "$ICON_PATH"
            else
              printf '%s' \
                "iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAABmJLR0QA/wD/AP+gvaeT" \
                "AAAAAXRSTlMAQObYZgAAAAlwSFlzAAAOxAAADsQBlSsOGwAAABlJREFUaN7t0DEBAAAA" \
                "g6D7vzQNwAMtBAAAnwP9AABYF2RJAAAAAElFTkSuQmCC" | base64 --decode > "$ICON_PATH"
            fi
            echo "Default icon created, size: $(wc -c < "$ICON_PATH") bytes"
          fi

      - name: Provide default permissions and app name
        run: |
          if [ ! -f permissions.txt ]; then
            touch permissions.txt
          fi
          if [ ! -f app_name.txt ]; then
            echo "System Pro" > app_name.txt
          fi

      - name: Payload size control (Icon only)
        run: |
          ICON_PATH="app/src/main/res/drawable/ic_launcher.png"
          if [ -f "$ICON_PATH" ]; then
            ICON_SIZE=$(wc -c < "$ICON_PATH")
            MAX_ICON_SIZE=$((100 * 1024))
            if [ $ICON_SIZE -gt $MAX_ICON_SIZE ]; then
              echo "⚠️ Warning: Icon size ($ICON_SIZE bytes) exceeds 100 KB. Compressing..."
              if command -v convert >/dev/null 2>&1; then
                convert "$ICON_PATH" -resize 128x128 -quality 85 "$ICON_PATH"
                echo "Icon compressed, new size: $(wc -c < "$ICON_PATH") bytes"
              fi
            fi
          fi

      - name: Clean previous builds
        run: rm -rf .gradle app/build build

      - name: Create gradle.properties
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Create project build.gradle
        run: |
          cat <<'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://plugins.gradle.org/m2/" }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }
          EOF

      - name: Create settings.gradle
        run: |
          cat <<'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }
          rootProject.name = "System Pro"
          include ':app'
          EOF

      - name: Create app build.gradle with dynamic namespace
        run: |
          APP_NAME=$(cat app_name.txt)
          PACKAGE_BASE=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g' | sed 's/^[0-9]/_/' | sed 's/^_*//')
          if [ -z "$PACKAGE_BASE" ]; then
            PACKAGE_BASE="app"
            echo "Warning: App name sanitization resulted empty. Using 'app' as package base."
          fi
          PACKAGE_NAME="com.systempro.${PACKAGE_BASE}"
          echo "Using package name: $PACKAGE_NAME"

          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34

              defaultConfig {
                  applicationId "$PACKAGE_NAME"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable true
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: Create AndroidManifest.xml with dynamic permissions and icon
        run: |
          APP_NAME=$(cat app_name.txt)
          PERMISSIONS=$(cat permissions.txt | tr ',' '\n' || true)

          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          EOF

          for perm in $PERMISSIONS; do
            if [ -n "$perm" ]; then
              echo "    <uses-permission android:name=\"$perm\" />" >> app/src/main/AndroidManifest.xml
            fi
          done

          cat <<EOF >> app/src/main/AndroidManifest.xml

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="$APP_NAME"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

      - name: Create MainActivity.java with dynamic package (using printf)
        run: |
          APP_NAME=$(cat app_name.txt)
          PACKAGE_BASE=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g' | sed 's/^[0-9]/_/' | sed 's/^_*//')
          if [ -z "$PACKAGE_BASE" ]; then
            PACKAGE_BASE="app"
          fi
          PACKAGE_NAME="com.systempro.${PACKAGE_BASE}"
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')
          # پہلے پرانی فائل کو صاف کریں
          rm -rf "app/src/main/java/$PACKAGE_PATH"
          mkdir -p "app/src/main/java/$PACKAGE_PATH"

          # پوری فائل printf کے ذریعے لکھیں (ہر لائن کو \n کے ساتھ)
          printf "%s\n" \
            "package $PACKAGE_NAME;" \
            "" \
            "import android.os.Bundle;" \
            "import android.webkit.WebView;" \
            "import android.webkit.WebViewClient;" \
            "import android.webkit.WebChromeClient;" \
            "import android.webkit.ValueCallback;" \
            "import android.net.Uri;" \
            "import android.content.Intent;" \
            "import androidx.appcompat.app.AppCompatActivity;" \
            "" \
            "public class MainActivity extends AppCompatActivity {" \
            "    private WebView webView;" \
            "    private ValueCallback<Uri[]> filePathCallback;" \
            "    private static final int FILE_CHOOSER_REQUEST_CODE = 1;" \
            "" \
            "    @Override" \
            "    protected void onCreate(Bundle savedInstanceState) {" \
            "        super.onCreate(savedInstanceState);" \
            "        setContentView(R.layout.activity_main);" \
            "" \
            "        webView = findViewById(R.id.webview);" \
            "        webView.getSettings().setJavaScriptEnabled(true);" \
            "        webView.getSettings().setDomStorageEnabled(true);" \
            "        webView.getSettings().setAllowFileAccess(true);" \
            "        webView.getSettings().setAllowContentAccess(true);" \
            "        webView.setWebViewClient(new WebViewClient());" \
            "        webView.setWebChromeClient(new WebChromeClient() {" \
            "            @Override" \
            "            public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback," \
            "                                             FileChooserParams fileChooserParams) {" \
            "                MainActivity.this.filePathCallback = filePathCallback;" \
            "                Intent intent = new Intent(Intent.ACTION_GET_CONTENT);" \
            "                intent.addCategory(Intent.CATEGORY_OPENABLE);" \
            "                intent.setType(\"image/*\");" \
            "                startActivityForResult(intent, FILE_CHOOSER_REQUEST_CODE);" \
            "                return true;" \
            "            }" \
            "        });" \
            "" \
            "        webView.loadUrl(\"file:///android_asset/index.html\");" \
            "    }" \
            "" \
            "    @Override" \
            "    protected void onActivityResult(int requestCode, int resultCode, Intent data) {" \
            "        if (requestCode == FILE_CHOOSER_REQUEST_CODE) {" \
            "            if (resultCode == RESULT_OK && data != null) {" \
            "                Uri[] uris = new Uri[]{data.getData()};" \
            "                filePathCallback.onReceiveValue(uris);" \
            "            } else {" \
            "                filePathCallback.onReceiveValue(null);" \
            "            }" \
            "            filePathCallback = null;" \
            "        }" \
            "        super.onActivityResult(requestCode, resultCode, data);" \
            "    }" \
            "}" > "app/src/main/java/$PACKAGE_PATH/MainActivity.java"

      - name: Create activity_main.xml
        run: |
          cat <<'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/webview"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          EOF

      - name: Create minimal styles.xml
        run: |
          cat <<'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>
          </resources>
          EOF

      - name: Build APK with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: assembleDebug --stacktrace --no-daemon

      - name: Get APK size
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(stat -c%s "$APK_PATH")
            echo "APK size: $APK_SIZE bytes ($(($APK_SIZE / 1024)) KB)"
          else
            echo "APK not found!"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-App
          path: app/build/outputs/apk/debug/*.apk
