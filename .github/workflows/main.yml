name: System Pro Ultimate Auto-Handler

on:
  workflow_dispatch: # ویب ویو ایپ سے ٹریگر کرنے کے لیے

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js & JDK
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Automatic Data Router (File Handling)
        run: |
          # 1. ویب فائلوں کو سنبھالنا (HTML/JS/CSS)
          # اگر آپ کی فائلیں روٹ میں اپلوڈ ہوئی ہیں، تو یہ انہیں Capacitor کے 'www' فولڈر میں ڈال دے گا
          mkdir -p www
          find . -maxdepth 1 -name "*.html" -exec mv {} www/ \;
          find . -maxdepth 1 -name "*.js" -exec mv {} www/ \;
          find . -maxdepth 1 -name "*.css" -exec mv {} www/ \;
          
          # 2. امیج/آئیکن کو سنبھالنا
          # جو بھی امیج اپلوڈ ہو (چاہے وہ کسی بھی نام سے ہو)، اسے 'icon.png' بنا کر ریسورسز میں ڈال دے گا
          mkdir -p resources
          IMAGE_FILE=$(find . -maxdepth 1 -name "*.png" -o -name "*.jpg" | head -n 1)
          if [ ! -z "$IMAGE_FILE" ]; then
            cp "$IMAGE_FILE" resources/icon.png
            cp "$IMAGE_FILE" icon.png
          fi

      - name: Install & Generate Assets
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets --save-dev
          # آئیکنز کو خودکار طریقے سے اینڈرائیڈ سائز کے مطابق ڈھالنا
          if [ -f "icon.png" ]; then
            npx capacitor-assets generate --android
          fi

      - name: Capacitor Sync & Auto-Rename
        run: |
          # نیا پیکج نیم خود بخود بنانا
          NEW_PKG="com.systempro.app_$(date +'%s')"
          
          # کنفگریشن اپڈیٹ کرنا
          if [ -f "capacitor.config.json" ]; then
            sed -i "s/\"appId\": \".*\"/\"appId\": \"$NEW_PKG\"/g" capacitor.config.json
          fi

          npx cap sync android

          # اینڈرائیڈ نیٹو فائلز میں پیکج نیم فٹ کرنا
          find android -name "build.gradle" -exec sed -i "s/applicationId \".*\"/applicationId \"$NEW_PKG\"/g" {} + || true
          find android -name "AndroidManifest.xml" -exec sed -i "s/package=\".*\"/package=\"$NEW_PKG\"/g" {} + || true

      - name: Final Build Execution
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SystemPro-Auto-Build
          path: "android/app/build/outputs/apk/release/*.apk"
