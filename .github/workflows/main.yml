name: System Pro Auto Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Clean Environment
        run: |
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/layout/*
          rm -rf app/src/main/res/drawable/*
          mkdir -p app/src/main/java/com/faisalzar/systempro
          mkdir -p app/src/main/res/layout app/src/main/res/drawable app/src/main/res/values

      - name: Inject Project Data
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
          unzip -o project.zip -d temp_dir/

          # جاوا فائلوں کے اندر پیکج نیم کو زبردستی ٹھیک کرنا
          find temp_dir/src/main/java -name "*.java" -exec sed -i "s/^package .*;/package com.faisalzar.systempro;/g" {} +
          
          # فائلز کو صحیح جگہ منتقل کرنا
          find temp_dir/src/main/java -name "*.java" -exec cp {} app/src/main/java/com/faisalzar/systempro/ \;
          cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
          
          rm -rf temp_dir project.zip

      - name: Auto-Correct Manifest and Resources
        run: |
          # ریسورس فائلوں کے نام اینڈرائیڈ کے مطابق کرنا (lowercase only)
          find app/src/main/res/drawable -type f | while read -r file; do
            new_name=$(basename "$file" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._]/_/g')
            mv "$file" "$(dirname "$file")/$new_name" 2>/dev/null || true
          done

          # مینی فیسٹ کو زیرو سے دوبارہ لکھنا تاکہ اسکیما کا کوئی مسئلہ نہ رہے
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.faisalzar.systempro">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:label="System Pro"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Execute Build
        run: |
          chmod +x gradlew
          # گریڈل کیشے کو نظر انداز کر کے تازہ بلڈ بنانا
          ./gradlew clean assembleDebug --no-daemon --no-build-cache

      - name: Archive System Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-v2-Build
          path: app/build/outputs/apk/debug/*.apk
