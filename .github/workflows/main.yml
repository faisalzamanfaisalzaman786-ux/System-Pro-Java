name: Build APK from Smart Studio

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (optional)
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Create Android project structure
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/example/myapp   # fallback package

      # Save client payload to files for easy reference
      - name: Write client payload to files
        run: |
          echo '${{ toJson(github.event.client_payload) }}' > payload.json
          APPS_NAME=$(jq -r '.app_name' payload.json)
          echo "APP_NAME=$APPS_NAME" >> $GITHUB_ENV

          echo '${{ github.event.client_payload.app_icon }}' | base64 -d > app/src/main/res/drawable/ic_launcher_foreground.png

          # Create HTML with CSS/JS embedded
          HTML_CONTENT='${{ github.event.client_payload.app_html }}'
          CSS_CONTENT='${{ github.event.client_payload.app_css }}'
          JS_CONTENT='${{ github.event.client_payload.app_js }}'
          cat > app/src/main/assets/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8">
          <style>${CSS_CONTENT}</style>
          </head>
          <body>${HTML_CONTENT}
          <script>${JS_CONTENT}</script>
          </body>
          </html>
          EOF

          # Write XML as strings.xml (if it looks like resources, else save as raw)
          XML_CONTENT='${{ github.event.client_payload.app_xml }}'
          echo "$XML_CONTENT" > app/src/main/res/values/strings.xml

          # Write Kotlin file
          KOTLIN_CONTENT='${{ github.event.client_payload.app_kotlin }}'
          # Extract package name from Kotlin content
          PACKAGE_NAME=$(echo "$KOTLIN_CONTENT" | grep -oP 'package\s+\K[^;]+' | head -1)
          if [ -z "$PACKAGE_NAME" ]; then
            PACKAGE_NAME="com.example.myapp"
          fi
          PACKAGE_PATH=$(echo $PACKAGE_NAME | tr '.' '/')
          mkdir -p app/src/main/java/$PACKAGE_PATH
          echo "$KOTLIN_CONTENT" > app/src/main/java/$PACKAGE_PATH/MainActivity.kt
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV

      - name: Generate AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="${{ env.PACKAGE_NAME }}">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="${{ env.APP_NAME }}"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Generate build.gradle (app level)
        run: |
          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace '${{ env.PACKAGE_NAME }}'
              compileSdk 34

              defaultConfig {
                  applicationId "${{ env.PACKAGE_NAME }}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

      - name: Generate settings.gradle and top-level build.gradle
        run: |
          cat > settings.gradle <<EOF
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmartStudioApp"
          include ':app'
          EOF

          cat > build.gradle <<EOF
          // Top-level build file
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'com.android.library' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

      - name: Generate style and launcher icons
        run: |
          cat > app/src/main/res/values/styles.xml <<EOF
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
          </resources>
          EOF

          # Create launcher icons from the uploaded icon (simple resize – for production use ImageMagick or Android asset tool)
          cp app/src/main/res/drawable/ic_launcher_foreground.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp app/src/main/res/drawable/ic_launcher_foreground.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/res/drawable/ic_launcher_foreground.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp app/src/main/res/drawable/ic_launcher_foreground.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp app/src/main/res/drawable/ic_launcher_foreground.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release (optional)
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_id }}
          name: Build ${{ github.run_id }} – ${{ env.APP_NAME }}
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
