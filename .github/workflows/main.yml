name: System Pro Auto Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Pre-Build Preparation
        run: |
          PKG_NAME="${{ github.event.client_payload.package_name || 'com.torch.systempro' }}"
          echo "Building for: $PKG_NAME"

          # 1. پرانے ڈیٹا اور گریڈل کیشے کی مکمل صفائی
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/layout/*
          rm -rf app/src/main/res/drawable/*
          rm -rf app/src/main/res/mipmap-*
          rm -rf .gradle build app/build

          # 2. پیکیج نیم کو پراپرٹیز فائل میں محفوظ کرنا
          echo "PKG_NAME=$PKG_NAME" > gradle.properties

          # 3. زپ ڈیٹا پروسیسنگ
          if [ -n "${{ github.event.client_payload.zip_data }}" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            unzip -o project.zip -d temp_dir/
            
            # امیجز کے نام درست کرنا
            find temp_dir/src/main/res -type f | while read -r file; do
                new_name=$(echo "$file" | tr ' ' '_' | tr -d '()' | tr '[:upper:]' '[:lower:]')
                mv "$file" "$new_name" 2>/dev/null || true
            done

            # جاوا فائلز میں پیکیج نیم فکس کرنا
            find temp_dir/src/main/java -name "*.java" -exec sed -i "s/^package .*;/package $PKG_NAME;/g" {} +
            
            # صحیح فولڈر سٹرکچر بنانا
            PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
            mkdir -p "app/src/main/java/$PKG_PATH"
            find temp_dir/src/main/java -name "*.java" -exec cp {} "app/src/main/java/$PKG_PATH/" \;
            cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
            
            # آئیکن فکس
            mkdir -p app/src/main/res/mipmap-hdpi
            ICON_FILE=$(find app/src/main/res/drawable -name "*.png" | head -n 1)
            if [ -n "$ICON_FILE" ]; then
                cp "$ICON_FILE" app/src/main/res/mipmap-hdpi/ic_launcher.png
                cp "$ICON_FILE" app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            fi
            rm -rf temp_dir project.zip
          fi

      - name: Generate Static Build Script
        run: |
          PKG_NAME="${{ github.event.client_payload.package_name || 'com.torch.systempro' }}"
          
          # build.gradle کو مکمل طور پر دوبارہ لکھنا تاکہ کوئی ویریبل رن ٹائم پر نہ بدلے
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "$PKG_NAME"
              compileSdk 34
              defaultConfig {
                  applicationId "$PKG_NAME"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildFeatures {
                  viewBinding true
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Execute Clean Build
        run: |
          chmod +x gradlew
          # بغیر کسی کیشے اور ڈیمن کے بلڈ کرنا
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Success
          path: app/build/outputs/apk/debug/*.apk
