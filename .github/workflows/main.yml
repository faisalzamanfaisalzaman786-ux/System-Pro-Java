name: Dynamic APK Builder from ZipForge Pro
on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  COMPILE_SDK: 34
  BUILD_TOOLS: 34.0.0
  MIN_SDK: 21
  TARGET_SDK: 34
  GRADLE_VERSION: 8.5
  AGP_VERSION: 8.1.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-${{ env.COMPILE_SDK }} build-tools;${{ env.BUILD_TOOLS }}"
          accept-android-sdk-licenses: true

      - name: Decode and Extract ZIP
        run: |
          ZIP_DATA="${{ github.event.client_payload.zip_data }}"
          if [ -z "$ZIP_DATA" ]; then exit 1; fi
          mkdir -p android_project
          cd android_project
          echo "$ZIP_DATA" | tr -d '\n\r ' | base64 -d > project.zip
          unzip -o project.zip || true
          rm project.zip

      - name: Prepare Android Project
        working-directory: ./android_project
        run: |
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          [ -z "$PACKAGE_NAME" ] && PACKAGE_NAME="com.zipforge.app"
          APP_NAME="${{ github.event.client_payload.app_name }}"
          [ -z "$APP_NAME" ] && APP_NAME="ZipForge"
          PKG_PATH=$(echo $PACKAGE_NAME | tr '.' '/')

          mkdir -p app/src/main/java/$PKG_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          if [ -d "src/main" ]; then cp -rf src/main/* app/src/main/ || true; fi
          find app/src/main/java -name "*.java" -type f -exec mv {} "app/src/main/java/$PKG_PATH/" \; 2>/dev/null || true

          # AndroidManifest.xml بنانا (بغیر EOF کے)
          echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="'$PACKAGE_NAME'">' >> app/src/main/AndroidManifest.xml
          echo '<application android:label="'$APP_NAME'" android:theme="@style/Theme.AppCompat.Light.DarkActionBar">' >> app/src/main/AndroidManifest.xml
          echo '<activity android:name=".MainActivity" android:exported="true">' >> app/src/main/AndroidManifest.xml
          echo '<intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>' >> app/src/main/AndroidManifest.xml
          echo '</activity></application></manifest>' >> app/src/main/AndroidManifest.xml

          # بٹن والا لے آؤٹ بنانا
          echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/res/layout/activity_main.xml
          echo '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center">' >> app/src/main/res/layout/activity_main.xml
          echo '<Button android:id="@+id/mainButton" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Click Me" />' >> app/src/main/res/layout/activity_main.xml
          echo '</LinearLayout>' >> app/src/main/res/layout/activity_main.xml

      - name: Generate Gradle Files
        working-directory: ./android_project
        run: |
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          [ -z "$PACKAGE_NAME" ] && PACKAGE_NAME="com.zipforge.app"

          # build.gradle فائلز بنانا
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:${{ env.AGP_VERSION }}' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          echo 'include ":app"' > settings.gradle

          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { namespace '$PACKAGE_NAME'; compileSdk ${{ env.COMPILE_SDK }}; defaultConfig { applicationId '$PACKAGE_NAME'; minSdk ${{ env.MIN_SDK }}; targetSdk ${{ env.TARGET_SDK }}; versionCode 1; versionName '1.0' } }" >> app/build.gradle
          echo "dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.9.0' }" >> app/build.gradle
          
          echo 'android.useAndroidX=true' > gradle.properties

      - name: Setup Gradle Wrapper
        working-directory: ./android_project
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip
          unzip -q gradle-${{ env.GRADLE_VERSION }}-bin.zip
          ./gradle-${{ env.GRADLE_VERSION }}/bin/gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew

      - name: Build APK
        working-directory: ./android_project
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_project/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "System Pro Build ${{ github.run_id }}"
          files: android_project/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
