name: System Pro Dynamic Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Name of the App'
        required: true
        default: 'SystemProApp'
      package_name:
        description: 'Package Name (e.g., com.systempro.app)'
        required: true
        default: 'com.systempro.app'
      java_code:
        description: 'Main Activity Java Code'
        required: true
      xml_layout:
        description: 'Activity Main XML Layout'
        required: true

jobs:
  initialize-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Create Project Structure and Process Files
        run: |
          # Convert package name dots to slashes for the folder structure
          PACKAGE_PATH=$(echo "${{ github.event.inputs.package_name }}" | tr '.' '/')
          
          # Create the necessary directories
          mkdir -p app/src/main/java/$PACKAGE_PATH
          mkdir -p app/src/main/res/layout

          # Save the XML (cleaning leading whitespace/newlines)
          echo "${{ github.event.inputs.xml_layout }}" | sed '1{/^$/d;}' > app/src/main/res/layout/activity_main.xml
          
          # Save the Java code
          echo "${{ github.event.inputs.java_code }}" > app/src/main/java/$PACKAGE_PATH/MainActivity.java

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-Debug
          path: app/build/outputs/apk/debug/*.apk
