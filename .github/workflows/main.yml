name: Build APK

on:
  workflow_dispatch:
    inputs:
      icon_url:
        description: 'URL of the app icon (PNG recommended)'
        required: false
        default: 'https://placehold.co/512x512/3a86ff/ffffff/png?text=App'
      app_name:
        description: 'Application name'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package name (e.g., com.example.myapp)'
        required: true
        default: 'com.example.myapp'
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show payload (debug)
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Icon URL (input): ${{ github.event.inputs.icon_url }}"
          echo "App name (input): ${{ github.event.inputs.app_name }}"
          echo "Package name (input): ${{ github.event.inputs.package_name }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Download icon from URL
        id: download_icon
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ICON_URL="https://placehold.co/512x512/3a86ff/ffffff/png?text=App"
          else
            ICON_URL="${{ github.event.inputs.icon_url }}"
          fi
          echo "Downloading icon from $ICON_URL"
          curl -f -o app-icon.png "$ICON_URL" || { echo "Failed to download icon"; exit 1; }
          echo "Icon downloaded successfully."

      - name: Set app variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "APP_NAME=MyApp" >> $GITHUB_ENV
            echo "PACKAGE_NAME=com.example.myapp" >> $GITHUB_ENV
          else
            echo "APP_NAME=${{ github.event.inputs.app_name }}" >> $GITHUB_ENV
            echo "PACKAGE_NAME=${{ github.event.inputs.package_name }}" >> $GITHUB_ENV
          fi

      - name: Generate Android project
        run: |
          APP_NAME="$APP_NAME"
          PACKAGE_NAME="$PACKAGE_NAME"
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          mkdir -p app/src/main/java/$PACKAGE_PATH
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cp app-icon.png app/src/main/res/drawable/ic_launcher.png
          cp app-icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp app-icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app-icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp app-icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp app-icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > gradle.properties <<EOF
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="$PACKAGE_NAME">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="$APP_NAME"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/$PACKAGE_PATH/MainActivity.java <<EOF
          package $PACKAGE_NAME;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView tv = new TextView(this);
                  tv.setText("Hello from $APP_NAME!");
                  setContentView(tv);
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical">
              <TextView
                  android:id="@+id/text"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Hello World!" />
          </LinearLayout>
          EOF

          cat > app/src/main/res/values/styles.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Light">
              </style>
          </resources>
          EOF

          cat > app/build.gradle <<EOF
          apply plugin: 'com.android.application'

          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34
              defaultConfig {
                  applicationId "$PACKAGE_NAME"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > build.gradle <<EOF
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat > settings.gradle <<EOF
          rootProject.name = "$APP_NAME"
          include ':app'
          EOF

          echo "Android project generated."

      - name: Check Gradle configuration
        run: gradle assembleDebug --dry-run --stacktrace

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # خودکار GitHub Release تخلیق کریں (صرف main برانچ پر push ہونے پر)
      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          body: |
            خودکار APK بلڈ از commit ${{ github.sha }}
            ایپ کا نام: ${{ env.APP_NAME }}
            پیکج: ${{ env.PACKAGE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
