name: System Pro Build Engine

on:
  workflow_dispatch:

jobs:
  build:
    name: Compiling APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize Android Project
        run: |
          mkdir -p Data/app/src/main/java/com/system/pro
          mkdir -p Data/app/src/main/res/layout
          
          # Root build.gradle
          cat <<EOF > Data/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.2.0" }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # settings.gradle
          echo "include ':app'" > Data/settings.gradle

          # App build.gradle
          cat <<EOF > Data/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.system.pro'
              compileSdk 34
              defaultConfig {
                  applicationId "com.system.pro"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          # AndroidManifest.xml
          cat <<EOF > Data/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="System Pro">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Basic MainActivity.java
          cat <<EOF > Data/app/src/main/java/com/system/pro/MainActivity.java
          package com.system.pro;
          import android.app.Activity;
          import android.os.Bundle;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Build with Gradle
        run: gradle assembleDebug --no-daemon
        working-directory: ./Data

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Build
          path: "Data/app/build/outputs/apk/debug/*.apk"
