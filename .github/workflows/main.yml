name: System Pro Universal Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ultra-Flexible Build Engine
        run: |
          # 1. Cleanup
          rm -rf app temp_dir project.zip
          mkdir -p app/src/main/res/layout app/src/main/res/values

          # 2. Extract ZIP
          if [ -n "${{ github.event.client_payload.zip_data }}" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            unzip -o project.zip -d temp_dir/
            
            # 3. Dynamic Package Detection (جاوا فائل سے پیکیج نیم خود ڈھونڈنا)
            # یہ کمانڈ پہلی جاوا فائل سے پیکیج نیم نکالے گی
            DETECTED_PKG=$(grep -m 1 "^package " $(find temp_dir/src/main/java -name "*.java" | head -n 1) | sed 's/package //' | sed 's/;//' | xargs)
            PKG_NAME="${DETECTED_PKG:-com.systempro.app}"
            echo "Detected Package: $PKG_NAME"

            # 4. Create Folders based on Detected Package
            PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
            mkdir -p "app/src/main/java/$PKG_PATH"

            # 5. Move Files to Correct Locations
            find temp_dir/src/main/java -name "*.java" -exec cp {} "app/src/main/java/$PKG_PATH/" \;
            cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
            
            # Icon handling
            cp -f temp_dir/src/main/res/mipmap-*/ic_launcher* app/src/main/res/mipmap-hdpi/ 2>/dev/null || true
          else
            PKG_NAME="com.systempro.app"
          fi

          # 6. Generate Manifest & Gradle with Dynamic Package
          printf "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" package=\"$PKG_NAME\">\n    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.CAMERA\"/>\n    <application android:label=\"System Pro\" android:icon=\"@mipmap/ic_launcher\" android:theme=\"@style/Theme.AppCompat.Light.NoActionBar\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"/>\n                <category android:name=\"android.intent.category.LAUNCHER\"/>\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>" > app/src/main/AndroidManifest.xml

          printf "plugins { id 'com.android.application' }\nandroid {\n    namespace '$PKG_NAME'\n    compileSdk 34\n    defaultConfig {\n        applicationId '$PKG_NAME'\n        minSdk 21\n        targetSdk 34\n        versionCode 1\n        versionName '1.0'\n    }\n}\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'com.google.android.material:material:1.11.0'\n    implementation 'androidx.camera:camera-core:1.3.0'\n    implementation 'androidx.camera:camera-camera2:1.3.0'\n    implementation 'androidx.camera:camera-lifecycle:1.3.0'\n    implementation 'androidx.camera:camera-view:1.3.0'\n}" > app/build.gradle

          # 7. Final Build Execute
          echo "include ':app'" > settings.gradle
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Flexible-APK
          path: app/build/outputs/apk/debug/*.apk
