name: System Pro Titan Master Build
on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  COMPILE_SDK: 34
  TARGET_SDK: 34
  MIN_SDK: 21
  GRADLE_VERSION: 8.5
  AGP_VERSION: 8.1.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Initialize Offline Core
        run: |
          mkdir -p SystemPro-Core/res/values
          mkdir -p SystemPro-Core/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

      - name: Master Resource Patch (No Duplicates)
        run: |
          # بنیادی کلرز اور ایٹریبیوٹس جو کبھی ڈپلیکیٹ نہیں ہونے چاہئیں
          echo '<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#FF00E5FF</color>
              <color name="colorSecondary">#FF00FF00</color>
              <attr name="progressTint" format="color|reference" />
              <attr name="actionTextColor" format="color|reference" />
              <style name="Theme.SystemPro" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="android:statusBarColor">#000000</item>
              </style>
          </resources>' > SystemPro-Core/res/values/system_pro_master.xml

      - name: Sync and Deduplicate Source
        run: |
          ZIP_DATA="${{ github.event.client_payload.zip_data }}"
          if [ ! -z "$ZIP_DATA" ]; then
            echo "$ZIP_DATA" | tr -d '\n\r ' | base64 -d > project.zip
            unzip -o project.zip -d temp_src || true
            
            # پہلے زپ فائل سے ڈیٹا کاپی کریں
            mkdir -p app/src/main/java
            cp -rf temp_src/app/src/main/java/* app/src/main/java/ || true
            cp -rf temp_src/app/src/main/res/* app/src/main/res/ || true
            
            # اب 'Deduplication Patch' چلائیں: 
            # کور لائبریری کی فائلز کو زپ فائل کی فائلز پر اوور رائٹ کریں تاکہ ترجیح ماسٹر سسٹم کو ملے
            cp -f SystemPro-Core/res/drawable/* app/src/main/res/drawable/ || true
            cp -f SystemPro-Core/res/values/system_pro_master.xml app/src/main/res/values/ || true
            
            # جاوا کوڈ میں پیکج ری فیکٹرنگ
            find app/src/main/java -name "*.java" -exec sed -i 's/import .*\.R;/import com.systempro.master.R;/g' {} \;
          fi

      - name: Build and Assembly
        run: |
          # بلڈ انجن کی کنفیگریشن
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:${{ env.AGP_VERSION }}' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          echo 'include ":app"' > settings.gradle
          
          # ایپ لیول گریڈل
          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { 
            namespace 'com.systempro.master'
            compileSdk ${{ env.COMPILE_SDK }}
            defaultConfig { 
              applicationId 'com.systempro.master'
              minSdk ${{ env.MIN_SDK }}
              targetSdk ${{ env.TARGET_SDK }}
            }
          }" >> app/build.gradle
          
          echo "dependencies { 
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
          }" >> app/build.gradle

          wget -q https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip
          unzip -q gradle-${{ env.GRADLE_VERSION }}-bin.zip
          ./gradle-${{ env.GRADLE_VERSION }}/bin/gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Commit Changes to Master Library
        run: |
          git config --global user.name "System Pro Bot"
          git config --global user.email "bot@systempro.com"
          git add SystemPro-Core/
          git commit -m "Cleanup and Deduplicate Master Library" || echo "No changes"
          git push || echo "Push skipped"

      - name: Deliver APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
