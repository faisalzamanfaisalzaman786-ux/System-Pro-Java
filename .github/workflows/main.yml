name: System Pro Titan Master Build
on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write
  actions: read

env:
  COMPILE_SDK: 34
  TARGET_SDK: 34
  MIN_SDK: 21
  GRADLE_VERSION: 8.5
  AGP_VERSION: 8.1.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Initialize Core Library
        run: |
          mkdir -p SystemPro-Core/res/values
          mkdir -p SystemPro-Core/res/drawable
          mkdir -p app/src/main/res/values

      - name: Build Smart Library (Auto-Research & Generate)
        run: |
          # اگر کور لائبریری میں بنیادی فائلز نہیں ہیں تو خودکار بناؤ
          if [ ! -f "SystemPro-Core/res/values/colors.xml" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="colorPrimary">#00E5FF</color><color name="colorSecondary">#00FF00</color><color name="textColor">#FFFFFF</color></resources>' > SystemPro-Core/res/values/colors.xml
          fi
          
          # ہر قسم کے بیک گراؤنڈز کا آٹو انجکشن
          echo '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#22FFFFFF"/><corners android:radius="12dp"/><stroke android:width="1dp" android:color="#44FFFFFF"/></shape>' > SystemPro-Core/res/drawable/universal_bg.xml

      - name: Sync and Refactor Source
        run: |
          ZIP_DATA="${{ github.event.client_payload.zip_data }}"
          if [ ! -z "$ZIP_DATA" ]; then
            echo "$ZIP_DATA" | tr -d '\n\r ' | base64 -d > project.zip
            unzip -o project.zip -d temp_src || true
            
            mkdir -p app/src/main/java
            cp -rf temp_src/app/src/main/java/* app/src/main/java/ || true
            cp -rf temp_src/app/src/main/res/* app/src/main/res/ || true
            
            # کور لائبریری سے مسنگ فائلز کو ایپ میں منتقل کرنا
            cp -n SystemPro-Core/res/drawable/* app/src/main/res/drawable/ || true
            cp -n SystemPro-Core/res/values/* app/src/main/res/values/ || true
          fi

      - name: Finalize Build Engine
        run: |
          # مینی فیسٹ اور گریڈل کی سیٹنگز جو ہم نے پہلے فائنل کی تھیں
          echo 'android { namespace "com.systempro.master" }' >> app/build.gradle
          # (باقی گریڈل لاجک یہاں آئے گی)

      - name: Execute Assembly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip
          unzip -q gradle-${{ env.GRADLE_VERSION }}-bin.zip
          ./gradle-${{ env.GRADLE_VERSION }}/bin/gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Save New Resources to Repository
        run: |
          git config --global user.name "System Pro Bot"
          git config --global user.email "bot@systempro.com"
          git add SystemPro-Core/
          git commit -m "Auto-update Core Library with new resources" || echo "No new resources to commit"
          git push || echo "Push failed or not needed"

      - name: Release Build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
