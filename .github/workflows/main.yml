name: Dynamic APK Builder from ZipForge Pro

on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write

env:
  APP_NAME: ${{ github.event.client_payload.app_name }}
  PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
  ZIP_B64: ${{ github.event.client_payload.zip_data }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"
          accept-android-sdk-licenses: true

      - name: Extract source
        run: |
          mkdir -p input
          echo "$ZIP_B64" | base64 -d > src.zip
          unzip -q src.zip -d input

      - name: Build Project
        run: |
          PKG="${PACKAGE_NAME:-com.example.app}"
          mkdir -p app/src/main/java/$(echo $PKG | tr . /)
          mkdir -p app/src/main/res/layout app/src/main/res/values

          cat > app/src/main/java/$(echo $PKG | tr . /)/MainActivity.java << JAVA
          package $PKG;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
              }
          }
          JAVA

          cat > app/src/main/res/layout/activity_main.xml << XML
          <TextView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:text="Hello from ZipForge"
              android:textSize="24sp"
              android:layout_gravity="center"/>
          XML

          cat > app/src/main/res/values/colors.xml << COL
          <resources><color name="purple">#FF6200EE</color></resources>
          COL

          cat > app/src/main/res/values/themes.xml << THEME
          <resources>
              <style name="Theme.Zip" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/purple</item>
              </style>
          </resources>
          THEME

          cat > app/src/main/AndroidManifest.xml << MANIFEST
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="${APP_NAME:-ZipForge}" android:theme="@style/Theme.Zip">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          cat > build.gradle << GRADLE
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE

          echo 'include ":app"' > settings.gradle

          cat > app/build.gradle << APPGRADLE
          plugins { id 'com.android.application' }
          android {
              namespace '$PKG'
              compileSdk 34
              defaultConfig {
                  applicationId '$PKG'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          APPGRADLE

          # درست gradle.properties - یہاں android.useAndroidX=true لازمی ہے
          cat > gradle.properties << PROP
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          PROP

          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
