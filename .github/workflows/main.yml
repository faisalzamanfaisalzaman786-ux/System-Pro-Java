name: Build APK from Dispatch

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch uploaded HTML and icon
        run: |
          # HTML فائل حاصل کریں
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o index.html \
               "https://api.github.com/repos/${{ github.repository }}/contents/${{ github.event.client_payload.html_file }}"
          
          # اگر آئیکون اپ لوڈ کیا گیا ہو تو اسے ڈاؤن لوڈ کریں
          if [ -n "${{ github.event.client_payload.icon_file }}" ]; then
            curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                 -H "Accept: application/vnd.github.v3.raw" \
                 -o icon_base64.txt \
                 "https://api.github.com/repos/${{ github.repository }}/contents/${{ github.event.client_payload.icon_file }}"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # یہاں آپ کا اصل APK بنانے کا اسکرپٹ چلے گا
      - name: Build APK
        run: |
          # مثال: اگر آپ کے پاس Python اسکرپٹ ہے جو index.html اور icon_base64.txt سے APK بناتا ہے
          # python build.py --html index.html --icon icon_base64.txt --permissions "${{ join(github.event.client_payload.permissions, ',') }}" --name "${{ github.event.client_payload.app_name }}"
          echo "Building APK for ${{ github.event.client_payload.app_name }}"
          # یہاں اپنے بلڈ کمانڈ لگائیں
          # اگر بلڈ کے بعد output.apk فائل بنتی ہے تو اسے output/ فولڈر میں رکھیں

          # ڈیمو کے طور پر صرف ایک ڈمی فائل بناتے ہیں
          mkdir -p output
          echo "APK content would be here" > output/app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.run_id }}
          path: output/*.apk

      - name: Cleanup temp files (optional)
        if: always()
        run: |
          # HTML فائل حذف کریں
          curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               "https://api.github.com/repos/${{ github.repository }}/contents/${{ github.event.client_payload.html_file }}?message=Cleanup&sha=${{ github.event.client_payload.html_sha }}"
          # اگر آئیکون فائل موجود ہو تو حذف کریں
          if [ -n "${{ github.event.client_payload.icon_file }}" ] && [ -n "${{ github.event.client_payload.icon_sha }}" ]; then
            curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                 "https://api.github.com/repos/${{ github.repository }}/contents/${{ github.event.client_payload.icon_file }}?message=Cleanup&sha=${{ github.event.client_payload.icon_sha }}"
          fi
