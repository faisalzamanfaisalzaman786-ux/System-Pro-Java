name: System Pro Ultimate Fix V8

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install and Upgrade Gradle
        run: |
          # پرانا گریڈل ہٹائیں اور نیا ورژن (8.5) سیٹ اپ کریں
          wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -d /opt/gradle gradle-8.5-bin.zip
          export PATH=$PATH:/opt/gradle/gradle-8.5/bin
          
          # اب ریپر جنریٹ کریں تاکہ پروجیکٹ اسی ورژن پر چلے
          /opt/gradle/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          
          # بلڈ شروع کریں
          ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final
          path: "**/build/outputs/apk/debug/*.apk"

      - name: Cleanup
        if: always()
        run: rm -rf ~/.gradle/caches/
