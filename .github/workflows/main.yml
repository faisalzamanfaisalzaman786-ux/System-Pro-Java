name: System Pro Dynamic Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Name of the App'
        required: true
        default: 'SystemProApp'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.systempro.app'
      java_code:
        description: 'Main Activity Java Code'
        required: true
      xml_layout:
        description: 'Activity Main XML Layout'
        required: true

jobs:
  initialize-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Process and Save Files
        run: |
          # پیکیج نیم کو فولڈر سٹرکچر میں بدلنا
          PACKAGE_PATH=$(echo "${{ github.event.inputs.package_name }}" | tr '.' '/')
          mkdir -p app/src/main/java/$PACKAGE_PATH
          mkdir -p app/src/main/res/layout

          # XML فائل کو محفوظ کرنا (بغیر کسی تبدیلی کے)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          ${{ github.event.inputs.xml_layout }}
          EOF

          # پہلی لائن سے خالی جگہ ختم کرنا تاکہ پرانا ایرر نہ آئے
          sed -i '1{/^$/d;}' app/src/main/res/layout/activity_main.xml

          # Java فائل کو محفوظ کرنا
          cat << 'EOF' > app/src/main/java/$PACKAGE_PATH/MainActivity.java
          ${{ github.event.inputs.java_code }}
          EOF

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-Debug
          path: app/build/outputs/apk/debug/*.apk
