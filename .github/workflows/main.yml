name: Build Android APK

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    name: Build webview APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          echo "App name: ${{ github.event.client_payload.app_name }}"
          mkdir -p output
          echo "${{ github.event.client_payload.permissions }}" > permissions.txt

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Android project
        run: |
          git clone https://github.com/faisalzamanfaisalzaman786-ux/base-apk-template android-project
          cd android-project
          echo "${{ github.event.client_payload.app_name }}" > APP_NAME.txt

          # Put uploaded HTML into project assets
          cp ../index.html ./app/src/main/assets/index.html

          # Save icon if provided
          if [ -n "${{ github.event.client_payload.app_icon }}" ]; then
            echo "${{ github.event.client_payload.app_icon }}" | base64 --decode > ./app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Build APK
        run: |
          cd android-project
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../output/${{ github.event.client_payload.app_name }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name }}-apk
          path: output/*.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-${{ github.run_id }}
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
