name: System Pro Simple Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ایپ کا نام'
        required: true
        default: 'MySimpleClock'
      pkg_name:
        description: 'پیکج نیم'
        required: true
        default: 'com.systempro.simple'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create App Structure
      run: |
        # پرانی فائلیں صاف کرنا
        rm -rf app settings.gradle build.gradle gradlew gradle
        
        # ڈائریکٹری بنانا
        PKG_PATH=$(echo "${{ github.event.inputs.pkg_name }}" | sed 's/\./\//g')
        mkdir -p app/src/main/java/$PKG_PATH
        mkdir -p app/src/main/res/layout

        # سادہ کلاک کا جاوا کوڈ (ڈائریکٹ لکھنا)
        cat << EOF > app/src/main/java/$PKG_PATH/MainActivity.java
        package ${{ github.event.inputs.pkg_name }};
        import android.os.Bundle;
        import android.widget.TextClock;
        import androidx.appcompat.app.AppCompatActivity;
        import android.view.Gravity;
        import android.widget.LinearLayout;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                LinearLayout layout = new LinearLayout(this);
                layout.setGravity(Gravity.CENTER);
                TextClock clock = new TextClock(this);
                clock.setTextSize(50);
                layout.addView(clock);
                setContentView(layout);
            }
        }
        EOF

        # تنظیمات (Gradle Files)
        echo "include ':app'" > settings.gradle
        cat << EOF > app/build.gradle
        plugins { id 'com.android.application' version '8.2.0' }
        android {
            namespace '${{ github.event.inputs.pkg_name }}'
            compileSdk 34
            defaultConfig {
                applicationId '${{ github.event.inputs.pkg_name }}'
                minSdk 24
                targetSdk 34
            }
        }
        EOF

        # مینی فیسٹ (Manifest)
        mkdir -p app/src/main
        cat << EOF > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="${{ github.event.inputs.app_name }}">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Build APK
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name }}
        path: app/build/outputs/apk/debug/app-debug.apk
