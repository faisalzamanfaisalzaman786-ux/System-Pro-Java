name: System Pro Official Build

on:
  repository_dispatch:
    types: [build-from-b64]

jobs:
  assemble-official-apk:
    name: "System Pro: Official APK Generation"
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # کیشے کو عارضی طور پر ہٹایا گیا ہے تاکہ پاتھ ایرر نہ آئے
          cache: 'gradle'

      - name: Hard Reset & Structure Setup
        run: |
          # پرانے تمام نشانات مٹانا
          rm -rf .gradle app/build build
          mkdir -p app/src/main/java/com/system/pro
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
          # پروفیشنل اور سادہ گریڈل فائلز
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          echo "include ':app'" > settings.gradle

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.system.pro'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ github.event.client_payload.package_name }}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              # ریسورس مرجر ایررز سے بچنے کے لیے سیٹنگ
              aaptOptions {
                  namespaced = false
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

      - name: Package-First Injection
        run: |
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > source.zip
          unzip -o source.zip -d temp_src/
          
          # سٹیپ 1: پیکیج نیم کی مکمل درستی
          find temp_src/ -name "*.java" -type f -exec sed -i '/^package /d' {} +
          find temp_src/ -name "*.java" -type f -exec sed -i '1i package com.system.pro;' {} +
          
          # سٹیپ 2: فائلوں کی منتقلی (بغیر کسی تضاد کے)
          find temp_src/ -name "*.java" -exec cp {} app/src/main/java/com/system/pro/ \;
          find temp_src/ -name "*.xml" ! -name "AndroidManifest.xml" -exec cp {} app/src/main/res/layout/ \; || true
          
          # سٹیپ 3: مینی فیسٹ کی جنریشن
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="true" android:label="System Pro" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          rm -rf temp_src source.zip

      - name: Execute Fresh Build
        run: |
          # گریڈل 8.5 کا استعمال اور تمام کیشے کو نظر انداز کرنا
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          # --no-build-cache اور --no-daemon اس پاتھ ایرر کو ختم کرنے کے لیے ضروری ہیں
          ./gradlew :app:assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name || 'System-Pro-Official-Build' }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Success Summary
        if: success()
        run: |
          echo "## ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "Path Mapping issue resolved using --no-build-cache." >> $GITHUB_STEP_SUMMARY
