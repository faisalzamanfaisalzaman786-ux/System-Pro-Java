name: Dynamic APK Builder from ZipForge Pro

on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_NAME: ${{ github.event.client_payload.app_name }}
  PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
  ZIP_B64: ${{ github.event.client_payload.zip_data }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"
          accept-android-sdk-licenses: true

      - name: Extract source and wipe old builds
        run: |
          set -e
          rm -rf .gradle app/build build
          mkdir -p input
          echo "$ZIP_B64" | base64 -d > src.zip
          unzip -q src.zip -d input
          ls -la input/

      - name: Create clean project (ignore user resources completely)
        run: |
          set -e
          PKG="${PACKAGE_NAME:-com.example.app}"
          if [[ ! "$PKG" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "Invalid package name, using default"
            PKG="com.zipforge.app"
          fi

          # Wipe existing main to remove any user-provided resources
          rm -rf app/src/main
          mkdir -p app/src/main
          APP_PATH=$(echo $PKG | tr . /)
          mkdir -p app/src/main/java/$APP_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi

          # Use user's MainActivity.java if exists
          if [ -f input/MainActivity.java ]; then
            cp input/MainActivity.java app/src/main/java/$APP_PATH/MainActivity.java
            sed -i "s/^package .*;/package $PKG;/" app/src/main/java/$APP_PATH/MainActivity.java
          else
            cat > app/src/main/java/$APP_PATH/MainActivity.java << JAVA
          package $PKG;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
              }
          }
          JAVA
          fi

          # Simple layout (no Material Components)
          cat > app/src/main/res/layout/activity_main.xml << LAYOUT
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:gravity="center"
              android:orientation="vertical">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Hello from ZipForge"
                  android:textSize="24sp"
                  android:textColor="#FF6200EE" />
          </LinearLayout>
          LAYOUT

          # Minimal colors
          cat > app/src/main/res/values/colors.xml << COLORS
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="purple_500">#FF6200EE</color>
              <color name="purple_700">#FF3700B3</color>
              <color name="teal_200">#FF03DAC5</color>
          </resources>
          COLORS

          # Clean AppCompat theme (no Material)
          cat > app/src/main/res/values/themes.xml << THEME
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.ZipForge" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/purple_500</item>
                  <item name="colorPrimaryDark">@color/purple_700</item>
                  <item name="colorAccent">@color/teal_200</item>
              </style>
          </resources>
          THEME

          # Clean manifest (no package attribute, no Material theme)
          cat > app/src/main/AndroidManifest.xml << MANIFEST
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="${APP_NAME:-ZipForgeApp}"
                  android:theme="@style/Theme.ZipForge">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          # User icon if provided
          if [ -f input/ic_launcher.png ]; then
            cp input/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi

      - name: Generate Gradle files (only AppCompat)
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          tasks.register('clean', Delete) { delete rootProject.buildDir }
          EOF

          echo 'include ":app"' > settings.gradle

          cat > app/build.gradle << EOF
          plugins { id 'com.android.application' }
          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34
              defaultConfig {
                  applicationId "$PACKAGE_NAME"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          echo "# no rules" > app/proguard-rules.pro

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

      - name: Setup Gradle Wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "${{ env.APP_NAME || 'ZipForgeApp' }} v1.0"
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
