name: System Pro Build Engine

on:
  repository_dispatch:
    types: [build-from-b64]

jobs:
  clean-wash-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Reset and Initialize Environment
        run: |
          # پرانے کیشے اور ادھورے بلڈز کی مکمل صفائی
          rm -rf .gradle app/build build
          
          mkdir -p app/src/main/java/com/system/pro
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # گوگل اور میون کے آفیشل پاتھ کا مرکزی سیٹ اپ
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.2.2" }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat <<EOF > settings.gradle
          include ':app'
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.system.pro'
              compileSdk 34
              defaultConfig {
                  applicationId "${{ github.event.client_payload.package_name }}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

      - name: Smart Inject and Path Sync
        run: |
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > source.zip
          unzip -o source.zip -d temp_src/
          
          # فائلیں جہاں بھی ہوں، انہیں ڈھونڈ کر صحیح اینڈرائیڈ پاتھ پر لانا
          find temp_src/ -name "MainActivity.java" -exec cp {} app/src/main/java/com/system/pro/ \;
          find temp_src/ -name "activity_main.xml" -exec cp {} app/src/main/res/layout/ \;
          find temp_src/ -name "AndroidManifest.xml" -exec cp {} app/src/main/ \;
          
          # اگر ریسورسز غائب ہوں تو بلڈ فیل ہونے سے بچانے کے لیے بنیادی فائلز
          [ ! -f app/src/main/res/values/themes.xml ] && echo '<resources><style name="Theme.SystemPro" parent="Theme.MaterialComponents.DayNight.NoActionBar" /></resources>' > app/src/main/res/values/themes.xml
          
          rm -rf temp_src source.zip

      - name: Build Execution with Auto-Wrapper
        run: |
          # گریڈل کو آپ کی ضرورت کے مطابق 8.5 پر لاک کرنا (اسٹبلٹی کے لیے)
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          # کلین بلڈ تاکہ پرانا ڈیٹا مداخلت نہ کرے
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v${{ github.run_number }}"
          name: "System Pro Build #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
