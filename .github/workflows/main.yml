name: Dynamic APK Builder from ZipForge Pro

on:
  repository_dispatch:
    types: [build-from-b64]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_NAME: ${{ github.event.client_payload.app_name }}
  PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
  JAVA_B64: ${{ github.event.client_payload.java_code }}
  XML_B64: ${{ github.event.client_payload.xml_code }}
  MANIFEST_B64: ${{ github.event.client_payload.manifest_code }}
  ICON_B64: ${{ github.event.client_payload.icon_b64 }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"
          accept-android-sdk-licenses: true
      - name: Decode and build project
        run: |
          set -e
          rm -rf .gradle app/build build
          PKG="${PACKAGE_NAME:-com.example.app}"
          APP_PATH=$(echo $PKG | tr . /)
          mkdir -p app/src/main/java/$APP_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          
          # Decode Java file
          echo "$JAVA_B64" | base64 -d > app/src/main/java/$APP_PATH/MainActivity.java
          sed -i "s/^package .*;/package $PKG;/" app/src/main/java/$APP_PATH/MainActivity.java
          
          # Decode XML layout
          echo "$XML_B64" | base64 -d > app/src/main/res/layout/activity_main.xml
          
          # Decode AndroidManifest.xml
          echo "$MANIFEST_B64" | base64 -d > app/src/main/AndroidManifest.xml
          sed -i "s/package=\"[^\"]*\"/package=\"$PKG\"/" app/src/main/AndroidManifest.xml
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"${APP_NAME:-ZipForgeApp}\"/" app/src/main/AndroidManifest.xml
          
          # Icon
          if [ -n "$ICON_B64" ]; then
            echo "$ICON_B64" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi
          
          # Minimal colors and theme (if not provided)
          cat > app/src/main/res/values/colors.xml << EOF
          <resources><color name="purple_500">#FF6200EE</color></resources>
          EOF
          cat > app/src/main/res/values/themes.xml << EOF
          <resources><style name="Theme.Zip" parent="Theme.AppCompat.Light.DarkActionBar">
              <item name="colorPrimary">@color/purple_500</item>
          </style></resources>
          EOF
          
          # Gradle files
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          echo 'include ":app"' > settings.gradle
          cat > app/build.gradle << EOF
          plugins { id 'com.android.application' }
          android {
              namespace '$PKG'
              compileSdk 34
              defaultConfig {
                  applicationId '$PKG'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          echo '# no rules' > app/proguard-rules.pro
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF
          
          # Setup wrapper
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
