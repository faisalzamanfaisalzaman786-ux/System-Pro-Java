name: System-Pro-Master-Manager

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ایپ کا نام (مثلاً: System Pro My App)'
        default: 'System Pro Master'
        required: true
      package_suffix:
        description: 'پیکج نیم کے لیے کوئی خاص لفظ (مثلاً: shop, game)'
        default: 'app'
        required: true

permissions:
  contents: write

jobs:
  manage-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Manage Assets & Packaging
        run: |
          # 1. امیج اور ایچ ٹی ایم ایل کی منتقلی
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          
          find . -maxdepth 1 -name "*.html" -exec mv {} app/src/main/assets/index.html \;
          find . -maxdepth 1 -name "*.png" -o -name "*.jpg" | xargs -I {} mv {} app/src/main/res/drawable/app_icon.png || true

          # 2. آٹو پیکج نیم اور ایپ نیم (Dynamic Update)
          # وقت کی بنیاد پر ایک یونیک نمبر بنانا
          BUILD_ID=$(date +%s)
          NEW_PACKAGE="com.systempro.${{ github.event.inputs.package_suffix }}.v${BUILD_ID}"
          
          # build.gradle میں پیکج نیم اپ ڈیٹ کرنا
          sed -i "s/applicationId \".*\"/applicationId \"$NEW_PACKAGE\"/" app/build.gradle
          
          # AndroidManifest میں ایپ کا نام اور پرمیشنز سیٹ کرنا
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application 
                  android:label="${{ github.event.inputs.app_name }}" 
                  android:icon="@drawable/app_icon"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name="com.systempro.app.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK (Capacitor Style Setup)
        run: |
          # یہاں گریڈل بلڈ چلے گا
          chmod +x gradlew || echo "No gradlew"
          ./gradlew assembleDebug || echo "Build failed - Check Gradle"

      - name: Commit Changes to Repo
        run: |
          git config --global user.name "Faisal Zaman"
          git config --global user.email "faisal@systempro.com"
          git add .
          git commit -m "Build: ${{ github.event.inputs.app_name }} with Package: $NEW_PACKAGE" || echo "No changes"
          git push

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/*.apk
