name: Build APK from Dispatch

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Extract payload
        id: payload
        run: |
          echo "APP_NAME=${{ github.event.client_payload.app_name }}" >> $GITHUB_ENV
          echo "ICON_BASE64=${{ github.event.client_payload.app_icon }}" >> $GITHUB_ENV
          echo "HTML=${{ github.event.client_payload.app_html }}" >> $GITHUB_ENV
          echo "CSS=${{ github.event.client_payload.app_css }}" >> $GITHUB_ENV
          echo "JS=${{ github.event.client_payload.app_js }}" >> $GITHUB_ENV
          echo "XML=${{ github.event.client_payload.app_xml }}" >> $GITHUB_ENV
          echo "KOTLIN=${{ github.event.client_payload.app_kotlin }}" >> $GITHUB_ENV

      - name: Decode icon
        run: echo "$ICON_BASE64" | base64 -d > app-icon.png

      - name: Generate Android project
        run: |
          # اپنا پروجیکٹ بنانے کے احکامات یہ لکھیں
          # (اوپر دیے گئے مکمل YAML میں سے کاپی کر لیں)
          # ...

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: run-${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
