name: System Pro Build Engine

on:
  repository_dispatch:
    types: [build-from-b64]

jobs:
  clean-wash-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Auto-Sync Project Assets
        run: |
          mkdir -p app/src/main/java/com/system/pro
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # تمام ضروری پلگ انز اور گوگل لائبریریز کا مرکزی لنک (Dynamic Script)
          cat <<EOF > build.gradle
          buildscript {
              repositories { 
                  google() 
                  mavenCentral() 
              }
              dependencies { 
                  // یہ پلگ ان خود بخود بہترین ورژن تلاش کرے گا
                  classpath "com.android.tools.build:gradle:8.2.2" 
              }
          }
          allprojects {
              repositories { 
                  google() 
                  mavenCentral() 
              }
          }
          EOF

          cat <<EOF > settings.gradle
          include ':app'
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.system.pro'
              compileSdk 34
              defaultConfig {
                  applicationId "${{ github.event.client_payload.package_name }}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { 
                  release { 
                      minifyEnabled false 
                  } 
              }
          }
          // یہ حصہ تمام ضروری UI لائبریریز کو خودکار طور پر شامل کرتا ہے
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          # اسٹائلز کا مسئلہ حل کرنے کے لیے بنیادی تھیم کی تخلیق
          cat <<EOF > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.SystemPro" parent="Theme.MaterialComponents.DayNight.NoActionBar" />
          </resources>
          EOF
          
          cat <<EOF > app/src/main/res/values/colors.xml
          <resources>
              <color name="purple_500">#FF6200EE</color>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
          </resources>
          EOF

      - name: Decode and Inject Custom Source
        run: |
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > source.zip
          unzip -o source.zip -d temp_src/
          
          # فائلیں سرچ کر کے ان کی منزل تک پہنچانا
          find temp_src/ -name "MainActivity.java" -exec cp {} app/src/main/java/com/system/pro/ \;
          find temp_src/ -name "activity_main.xml" -exec cp {} app/src/main/res/layout/ \;
          find temp_src/ -name "AndroidManifest.xml" -exec cp {} app/src/main/ \;
          
          rm -rf temp_src source.zip

      - name: Build with Auto-Configured Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Release Successful Build
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Success Build #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
