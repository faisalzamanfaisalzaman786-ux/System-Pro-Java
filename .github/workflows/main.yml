name: System Pro Official Build

on:
  repository_dispatch:
    types: [build-from-b64]

jobs:
  assemble-official-apk:
    name: "System Pro: Official APK Generation"
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Initialize Industry Structure
        run: |
          # مکمل صفائی اور معیاری فولڈرز کی تخلیق
          rm -rf .gradle app/build build
          mkdir -p app/src/main/java/com/system/pro
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
          # اسٹیبل گریڈل کنفیگریشن (8.5 Version کے مطابق)
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          echo "include ':app'" > settings.gradle

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.system.pro'
              compileSdk 34
              defaultConfig {
                  applicationId '${{ github.event.client_payload.package_name }}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

      - name: Deep Package Correction & Injection
        run: |
          # زپ ڈیٹا کو عارضی فولڈر میں نکالنا
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > source.zip
          unzip -o source.zip -d temp_src/
          
          # کروشل سٹیپ: فائلز کو منتقل کرنے سے پہلے تمام جگہوں پر پیکیج نیم کی درستگی
          # تمام جاوا فائلز سے پرانی پیکیج لائنز ختم کر کے نئی پروفیشنل لائن لگانا
          find temp_src/ -name "*.java" -type f -exec sed -i '/^package /d' {} +
          find temp_src/ -name "*.java" -type f -exec sed -i '1i package com.system.pro;' {} +
          
          # اب صاف شدہ فائلز کو ان کے پروفیشنل مقام پر منتقل کرنا
          find temp_src/ -name "*.java" -exec cp {} app/src/main/java/com/system/pro/ \;
          find temp_src/ -name "*.xml" -exec cp {} app/src/main/res/layout/ \; 2>/dev/null || true
          
          # آفیشل مینی فیسٹ کی تخلیق
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="true" android:label="System Pro" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          rm -rf temp_src source.zip

      - name: Build Official Debug APK
        run: |
          # گریڈل 8.5 کو فورس کرنا جیسا کہ آپ کی ریکوائرمنٹ ہے
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload System Pro Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name || 'System-Pro-Official-Build' }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Success Summary
        if: success()
        run: |
          echo "## ✅ System Pro: Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "Official APK generated with Gradle 8.5 and deep package correction." >> $GITHUB_STEP_SUMMARY
