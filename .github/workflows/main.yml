name: System Pro Master APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ایپ کا نام'
        required: true
      pkg_name:
        description: 'پیکج نیم'
        required: true
      java_code:
        description: 'Java Code'
        required: true
      xml_code:
        description: 'XML Code'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout
      uses: actions/checkout@v4

    - name: 2. Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. Deep Clean & Structure
      run: |
        rm -rf .gradle app/build
        PKG_PATH=$(echo "${{ github.event.inputs.pkg_name }}" | tr '.' '/')
        mkdir -p app/src/main/java/$PKG_PATH
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

    - name: 4. Secure Injection (No-Fail Logic)
      env:
        JAVA_DATA: ${{ github.event.inputs.java_code }}
        XML_DATA: ${{ github.event.inputs.xml_code }}
      run: |
        PKG_PATH=$(echo "${{ github.event.inputs.pkg_name }}" | tr '.' '/')
        
        # محفوظ طریقے سے کوڈ رائٹنگ
        echo "$JAVA_DATA" > app/src/main/java/$PKG_PATH/MainActivity.java
        echo "$XML_DATA" > app/src/main/res/layout/activity_main.xml

        # ریسورس فائلز
        printf '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">%s</string></resources>' "${{ github.event.inputs.app_name }}" > app/src/main/res/values/strings.xml
        echo '<?xml version="1.0" encoding="utf-8"?><resources><style name="Theme.SystemPro" parent="Theme.MaterialComponents.DayNight.NoActionBar"></style></resources>' > app/src/main/res/values/themes.xml

    - name: 5. Force Overwrite Configs
      run: |
        cat << EOF > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace '${{ github.event.inputs.pkg_name }}'
            compileSdk 34
            defaultConfig {
                applicationId '${{ github.event.inputs.pkg_name }}'
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName '1.0'
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

        cat << EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="@string/app_name" android:theme="@style/Theme.SystemPro" android:allowBackup="true">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: 6. Master Turbo Build
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: 7. Deliver System Pro APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name }}
        path: app/build/outputs/apk/debug/app-debug.apk
