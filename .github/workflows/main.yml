name: System Pro Smart Studio Build

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch: # مینوئل ٹیسٹنگ کے لیے

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Structure & Inject Data
        run: |
          # فولڈرز بنانا (صرف اگر موجود نہ ہوں)
          mkdir -p app/src/main/assets/www
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          
          # HTML ڈیٹا انجیکٹ کرنا
          if [ ! -z "${{ github.event.client_payload.app_html }}" ]; then
            echo "${{ github.event.client_payload.app_html }}" > app/src/main/assets/www/index.html
          fi
          
          # آئیکون انجیکٹ کرنا (Base64 چیک کے ساتھ)
          if [ ! -z "${{ github.event.client_payload.app_icon }}" ]; then
            echo "${{ github.event.client_payload.app_icon }}" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png || true
          fi

      - name: Dynamic Permissions
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # پرمیشنز کی لسٹ کو محفوظ طریقے سے لوپ کرنا
            for perm in ${{ join(github.event.client_payload.permissions, ' ') }}; do
              if ! grep -q "$perm" "$MANIFEST"; then
                sed -i "/<application/i \    <uses-permission android:name=\"$perm\" />" $MANIFEST
              fi
            done
          fi

      - name: Prepare Gradlew & Build
        run: |
          # gradlew فائل کو ڈھونڈنا اور اسے چلانے کی اجازت دینا
          GRADLEW_PATH=$(find . -name gradlew | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found anywhere in the repo!"
            exit 1
          fi
          chmod +x "$GRADLEW_PATH"
          
          # بلڈ کمانڈ چلانا
          $GRADLEW_PATH assembleRelease

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: SystemPro-Final-APK
          path: "**/build/outputs/apk/release/*.apk"
