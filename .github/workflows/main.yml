name: System Pro Build Engine

# یہ سیکشن مینوئل رن کا بٹن (Run workflow) ظاہر کرے گا
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build_job:
    name: Compiling System Pro APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        # اگر آپ کے ڈیٹا فولڈر میں کوئی خاص اسکرپٹ ہے تو یہاں اس کا پاتھ دیں
        # run: chmod +x ./Data/your-script.sh

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
