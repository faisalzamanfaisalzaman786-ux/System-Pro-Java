name: Build APK from Dispatch

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch uploaded HTML and icon
        run: |
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o index.html \
               "https://api.github.com/repos/${{ github.repository }}/contents/${{ github.event.client_payload.html_file }}"
          
          if [ -n "${{ github.event.client_payload.icon_file }}" ]; then
            curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                 -H "Accept: application/vnd.github.v3.raw" \
                 -o icon_base64.txt \
                 "https://api.github.com/repos/${{ github.repository }}/contents/${{ github.event.client_payload.icon_file }}"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build APK using Cordova
        run: |
          APP_NAME="${{ github.event.client_payload.app_name }}"
          cordova create app com.example.myapp "$APP_NAME"
          cd app
          cp ../index.html www/index.html
          
          if [ -f ../icon_base64.txt ]; then
            base64 -d ../icon_base64.txt > www/img/icon.png
            mkdir -p res/icon/android
            cp www/img/icon.png res/icon/android/icon.png
            sed -i 's|<icon src="[^"]*" />|<icon src="res/icon/android/icon.png" />|' config.xml
          fi
          
          cordova platform add android
          cordova build android --release
          mkdir -p ../output
          cp platforms/android/app/build/outputs/apk/release/app-release.apk ../output/app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.run_id }}
          path: output/*.apk

      - name: Cleanup temp files
        if: always()
        run: |
          curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               "https://api.github.com/repos/${{ github.repository }}/contents/${{ github.event.client_payload.html_file }}?message=Cleanup&sha=${{ github.event.client_payload.html_sha }}"
          if [ -n "${{ github.event.client_payload.icon_file }}" ] && [ -n "${{ github.event.client_payload.icon_sha }}" ]; then
            curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                 "https://api.github.com/repos/${{ github.repository }}/contents/${{ github.event.client_payload.icon_file }}?message=Cleanup&sha=${{ github.event.client_payload.icon_sha }}"
          fi
