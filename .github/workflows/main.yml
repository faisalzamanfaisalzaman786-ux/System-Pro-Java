name: System Pro Auto Builder

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build-zip-project]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Sync Data and Assets
        run: |
          PKG_NAME="${{ github.event.client_payload.package_name || 'com.torch.systempro' }}"
          echo "Target Package: $PKG_NAME"

          # صفائی
          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/layout/*
          rm -rf app/src/main/res/drawable/*
          rm -rf app/src/main/res/mipmap-*

          if [ -n "${{ github.event.client_payload.zip_data }}" ]; then
            echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project.zip
            unzip -o project.zip -d temp_dir/
            
            # نام درست کرنا (سپیس اور بریکٹ ختم)
            find temp_dir/src/main/res -type f | while read -r file; do
                new_name=$(echo "$file" | tr ' ' '_' | tr -d '()' | tr '[:upper:]' '[:lower:]')
                mv "$file" "$new_name" 2>/dev/null || true
            done

            # آئیکن سیٹ کرنا
            mkdir -p app/src/main/res/mipmap-hdpi
            ICON_FILE=$(find temp_dir/src/main/res/drawable -name "*.png" | head -n 1)
            if [ -n "$ICON_FILE" ]; then
                cp "$ICON_FILE" app/src/main/res/mipmap-hdpi/ic_launcher.png
                cp "$ICON_FILE" app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            fi

            # پیکیج نیم ٹھیک کرنا
            find temp_dir/src/main/java -name "*.java" -exec sed -i "s/^package .*;/package $PKG_NAME;/g" {} +
            
            PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
            mkdir -p "app/src/main/java/$PKG_PATH"
            find temp_dir/src/main/java -name "*.java" -exec cp {} "app/src/main/java/$PKG_PATH/" \;
            cp -rf temp_dir/src/main/res/* app/src/main/res/ || true
            rm -rf temp_dir project.zip
          fi

      - name: Hardcode Project Config
        run: |
          PKG_NAME="${{ github.event.client_payload.package_name || 'com.torch.systempro' }}"
          
          # 1. gradle.properties میں پیکیج نیم ڈالنا (سب سے اہم سٹیپ)
          echo "PKG_NAME=$PKG_NAME" >> gradle.properties

          # 2. build.gradle کو دوبارہ لکھنا تاکہ وہ پراپرٹی استعمال کرے
          cat <<'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace project.findProperty("PKG_NAME") ?: "com.torch.systempro"
              compileSdk 34
              defaultConfig {
                  applicationId project.findProperty("PKG_NAME") ?: "com.torch.systempro"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 3. مینی فیسٹ فکس
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application 
                  android:label="System Pro" 
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Clean Build Execution
        run: |
          chmod +x gradlew
          # اب کوئی ایکسٹرا کمانڈ نہیں، سادہ بلڈ
          ./gradlew clean assembleDebug --no-daemon

      - name: Download Link
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final
          path: app/build/outputs/apk/debug/*.apk
