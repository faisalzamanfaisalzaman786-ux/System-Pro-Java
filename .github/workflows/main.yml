name: System Pro Final Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Project Folder Structure
        run: |
          mkdir -p my_app/app/src/main/java/com/systempro/app
          mkdir -p my_app/app/src/main/assets
          mkdir -p my_app/app/src/main/res/layout
          mkdir -p my_app/app/src/main/res/values

      - name: Generate Default App Files
        run: |
          # 1. HTML Content (Asset)
          echo "<html><body style='background:#121212;color:#00ff00;text-align:center;font-family:sans-serif;'><h1>SYSTEM PRO V2</h1><p>Status: Active & Verified</p></body></html>" > my_app/app/src/main/assets/index.html

          # 2. Android Manifest
          cat <<EOF > my_app/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.systempro.app">
              <application android:label="System Pro" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 3. Java Code (Main Logic)
          cat <<EOF > my_app/app/src/main/java/com/systempro/app/MainActivity.java
          package com.systempro.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          # 4. Strings Resource
          echo '<resources><string name="app_name">System Pro</string></resources>' > my_app/app/src/main/res/values/strings.xml

      - name: Configure Gradle Files
        run: |
          cd my_app
          echo "include ':app'" > settings.gradle
          
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.systempro.app'
              compileSdk 33
              defaultConfig {
                  applicationId "com.systempro.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              // یہ وہ حصہ ہے جو APK کا سائز اور کوڈ یقینی بنائے گا
              sourceSets {
                  main {
                      manifest.srcFile 'src/main/AndroidManifest.xml'
                      java.srcDirs = ['src/main/java']
                      res.srcDirs = ['src/main/res']
                      assets.srcDirs = ['src/main/assets']
                  }
              }
          }
          EOF

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build Final APK
        run: |
          cd my_app
          gradle :app:assembleDebug

      - name: Verify APK Size
        run: |
          APK_FILE=$(find my_app/app/build/outputs/apk/debug/ -name "*.apk")
          echo "Final APK Size:"
          du -h "$APK_FILE"

      - name: Upload System Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V2-Final
          path: my_app/app/build/outputs/apk/debug/*.apk
