name: System Pro Build Engine

on:
  repository_dispatch:
    types: [build-from-b64]

jobs:
  clean-wash-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode and Prepare Source
        run: |
          echo "Decoding Base64 data..."
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > source.zip
          
          echo "Creating directory structure..."
          mkdir -p app/src/main/java/com/system/pro
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-hdpi

          echo "Extracting files..."
          unzip -o source.zip -d temp_source/
          
          # موصول شدہ فائلوں کو ان کی درست جگہ پر منتقل کرنا
          mv temp_source/MainActivity.java app/src/main/java/com/system/pro/ 2>/dev/null || true
          mv temp_source/activity_main.xml app/src/main/res/layout/ 2>/dev/null || true
          mv temp_source/AndroidManifest.xml app/src/main/ 2>/dev/null || true
          mv temp_source/ic_launcher.png app/src/main/res/mipmap-hdpi/ 2>/dev/null || true
          
          rm source.zip
          rm -rf temp_source

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build with Gradle 8.5
        run: ./gradlew assembleDebug --stacktrace
        # ہم نے آپ کی ہدایت کے مطابق اسے مستحکم ورژن پر رکھا ہے

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name }}-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Build #${{ github.run_number }} - ${{ github.event.client_payload.app_name }}"
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
