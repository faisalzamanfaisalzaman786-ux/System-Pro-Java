name: System Pro - HTML to Native Wrapper

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch: # دستی ٹیسٹنگ کے لیے

jobs:
  create-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Initialize Project Structure
        run: |
          # 1. بنیادی فائلیں بنانا
          echo '{
            "name": "system-pro-app",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/android": "^5.0.0",
              "@capacitor/cli": "^5.0.0",
              "@capacitor/core": "^5.0.0"
            }
          }' > package.json

          # 2. Capacitor کنفیگریشن بنانا
          echo '{
            "appId": "com.systempro.master",
            "appName": "${{ github.event.client_payload.app_name || 'SystemPro' }}",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json

          # 3. ویب فولڈر (www) بنانا اور ڈیٹا ڈالنا
          mkdir -p www
          echo "${{ github.event.client_payload.app_html }}" > www/index.html
          
          # اگر امیج (Icon) بھیجی گئی ہے تو اسے ڈیکوڈ کرنا
          if [ ! -z "${{ github.event.client_payload.app_icon }}" ]; then
            echo "${{ github.event.client_payload.app_icon }}" | base64 -d > www/icon.png
          fi

      - name: Install Dependencies
        run: npm install

      - name: Build Android Platform
        run: |
          npx cap add android
          npx cap copy android

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Final APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload System Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name || 'System-Pro-Build' }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
