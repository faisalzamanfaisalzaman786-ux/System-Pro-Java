name: System Pro Build Engine

on:
  repository_dispatch:
    types: [build-from-b64]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Gradle 8.5
        run: |
          # گریڈل ورژرن کو سختی سے 8.5 پر سیٹ کرنا
          mkdir -p gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties

      - name: Decode and Unzip Project
        run: |
          echo "${{ github.event.client_payload.zip_data }}" | base64 -d > project_data.zip
          mkdir -p app/src/main/res/values/
          unzip -o project_data.zip -d app/src/main/

      - name: Fix Missing Repository & Inject Resources
        run: |
          # build.gradle میں JitPack شامل کرنا تاکہ MPAndroidChart مل سکے
          if [ -f "app/build.gradle" ]; then
            sed -i "s/repositories {/repositories {\n        maven { url 'https:\/\/jitpack.io' }/g" app/build.gradle
          fi

          # پیکیج نیم اور ایپ کا نام اپ ڈیٹ کرنا
          sed -i "s/com.system.pro/${{ github.event.client_payload.package_name }}/g" app/build.gradle || true
          
          if [ -f "app/src/main/res/values/strings.xml" ]; then
            sed -i "s/>.*<\/string>/>${{ github.event.client_payload.app_name }}<\/string>/g" app/src/main/res/values/strings.xml
          fi

      - name: Build APK with Gradle 8.5
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Generate Release Tag
        id: tag
        run: echo "tag_name=build_$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT

      - name: Upload APK to Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
