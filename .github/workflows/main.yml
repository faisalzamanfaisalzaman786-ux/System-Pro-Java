name: Build System Pro (No-Crash Edition)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'ایپ کا نام'
        required: true
        default: 'System Pro'
      package_name:
        description: 'پیکیج آئی ڈی'
        required: true
        default: 'com.systempro.app'
      icon_base64:
        description: 'آئیکن کا Base64 کوڈ'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Project and Configure
        run: |
          APP_NAME="${{ github.event.inputs.app_name || 'SystemPro' }}"
          PKG_NAME="${{ github.event.inputs.package_name || 'com.systempro.app' }}"
          cordova create app "$PKG_NAME" "$APP_NAME"
          cd app
          cordova platform add android
          
          # کریش روکنے کے لیے جدید اینڈرائیڈ ترتیبات (Scheme Fix)
          # یہ اینڈرائیڈ کو بتاتا ہے کہ فائلوں کو 'app://localhost' کے طور پر لوڈ کرے
          sed -i "s/id=\"[^\"]*\"/id=\"$PKG_NAME\"/" config.xml
          sed -i "s|<name>.*</name>|<name>$APP_NAME</name>|" config.xml
          
          # سیکیورٹی اور نیویگیشن رولز کا اضافہ
          sed -i '/<\/widget>/i \    <preference name="Scheme" value="app" />\n    <preference name="Hostname" value="localhost" />\n    <access origin="*" />\n    <allow-navigation href="*" />\n    <allow-intent href="*" />' config.xml

      - name: Handle Icon & Web Assets
        run: |
          TARGET_DIR="app/www"
          RAW_DATA="${{ github.event.inputs.icon_base64 }}"
          if [ -n "$RAW_DATA" ]; then
            CLEAN_DATA=$(echo "$RAW_DATA" | sed 's/^data:image\/[^;]*;base64,//')
            echo "$CLEAN_DATA" | base64 -d > "$TARGET_DIR/icon.png"
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' app/config.xml
          fi
          
          # اپنی انڈیکس فائل کو محفوظ کرنا
          if [ -f ".github/workflows/Index.html" ]; then
            cp ".github/workflows/Index.html" "$TARGET_DIR/index.html"
            cp .github/workflows/*.css "$TARGET_DIR/" 2>/dev/null || true
            cp .github/workflows/*.js "$TARGET_DIR/" 2>/dev/null || true
          fi

      - name: Android Manifest Patch
        run: |
          # کریش سے بچاؤ کے لیے ہارڈ ویئر ایکسلریشن اور نیٹ ورک اجازت
          FILE="app/platforms/android/app/src/main/AndroidManifest.xml"
          sed -i '/<application / s|>| android:usesCleartextTraffic="true" android:hardwareAccelerated="true">|' $FILE

      - name: Build and Sign APK
        run: |
          cd app
          cordova build android --release -- --packageType=apk
          
          UNSIGNED_APK="platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          FINAL_APK="../SystemPro-Final.apk"
          BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
          
          # Zipalign اور نئی سائننگ
          $BUILD_TOOLS/zipalign -f -v 4 "$UNSIGNED_APK" aligned.apk
          keytool -genkey -v -keystore final.keystore -alias appkey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=SystemPro"
          $BUILD_TOOLS/apksigner sign --ks final.keystore --ks-pass pass:123456 --out "$FINAL_APK" aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "SystemPro-NoCrash"
          path: SystemPro-Final.apk
