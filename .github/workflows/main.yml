name: Build System Pro APK

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Update App Data
        run: |
          # ایپ کا نام سیٹ کرنا
          sed -i "s/app_name\">.*</app_name\">${{ github.event.client_payload.app_name }}</" app/src/main/res/values/strings.xml
          
          # HTML فائل کو 'www' فولڈر میں ڈالنا (جیسا کہ آپ کی ریپو میں ہے)
          echo '${{ github.event.client_payload.app_html }}' > www/index.html
          
          # آئیکون کو نئے بنائے گئے فولڈر میں محفوظ کرنا
          if [ ! -z "${{ github.event.client_payload.app_icon }}" ]; then
            echo "${{ github.event.client_payload.app_icon }}" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Inject Permissions
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          PERMISSIONS='${{ toJson(github.event.client_payload.permissions) }}'
          for row in $(echo "${PERMISSIONS}" | jq -r '.[]'); do
            sed -i "/<\/manifest>/i \    <uses-permission android:name=\"$row\" />" $MANIFEST
          done

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name }}-APK
          path: app/build/outputs/apk/release/*.apk
