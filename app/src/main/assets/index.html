<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>System Pro - Ultimate Theme Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-primary: #00b4d8;
            --accent-secondary: #f97316;
            --card-bg: rgba(0, 180, 216, 0.08);
            --border-color: #e2e8f0;
            --btn-primary-bg: #00b4d8;
            --btn-primary-text: #0f172a;
            --btn-secondary-bg: #f1f5f9;
            --btn-secondary-text: #1e293b;
            --success-bg: #10b981;
            --danger-bg: #ef4444;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --accent-primary: #2dd4bf;
            --accent-secondary: #fb923c;
            --card-bg: rgba(45, 212, 191, 0.1);
            --border-color: #334155;
            --btn-primary-bg: #2dd4bf;
            --btn-primary-text: #0f172a;
            --btn-secondary-bg: #334155;
            --btn-secondary-text: #f1f5f9;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
            min-height: 100vh;
            transition: background-color 0.2s, color 0.2s;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            color: var(--accent-primary);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .section {
            background-color: var(--bg-secondary);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-primary);
        }

        .theme-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .theme-btn {
            padding: 8px 20px;
            border-radius: 40px;
            background-color: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .theme-btn.active {
            background-color: var(--accent-primary);
            color: var(--btn-primary-text);
            border-color: var(--accent-primary);
        }

        .color-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .color-label {
            font-weight: 500;
            min-width: 120px;
        }

        input[type="color"] {
            width: 60px;
            height: 40px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            background: var(--bg-primary);
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            padding: 10px 20px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            background-color: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background-color: var(--btn-primary-bg);
            color: var(--btn-primary-text);
        }

        .btn-success {
            background-color: var(--success-bg);
            color: white;
        }

        .dynamic-buttons-area {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        .dynamic-btn {
            background-color: var(--accent-secondary);
            color: white;
            padding: 6px 14px;
            font-size: 14px;
        }

        footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 32px;
        }

        .apk-status {
            margin-top: 12px;
            font-size: 14px;
            padding: 8px;
            border-radius: 12px;
            background: var(--card-bg);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎨 System Pro Studio</h1>
    <p style="color: var(--text-secondary); margin-bottom: 24px;">مکمل تھیم کنٹرول + اپنے رنگ + APK جنریشن</p>

    <!-- تھیم سلیکشن -->
    <div class="section">
        <div class="section-title">📁 پری سیٹ تھیمز</div>
        <div class="theme-grid" id="themeGrid">
            <button class="theme-btn" data-theme="light">روشنی</button>
            <button class="theme-btn" data-theme="dark">اندھیرا</button>
            <button class="theme-btn" data-theme="custom">اپنا تھیم (کسٹم)</button>
        </div>
        <div class="color-row">
            <span class="color-label">✨ پرائمری کلر:</span>
            <input type="color" id="primaryColorPicker" value="#00b4d8">
        </div>
        <div class="color-row">
            <span class="color-label">🌟 سیکنڈری کلر:</span>
            <input type="color" id="secondaryColorPicker" value="#f97316">
        </div>
        <div class="button-group">
            <button id="applyCustomBtn" class="btn-primary">اپنے رنگ لگائیں</button>
            <button id="resetCustomBtn">ری سیٹ</button>
        </div>
    </div>

    <!-- ڈائنامک بٹن اور ٹیکسٹ -->
    <div class="section">
        <div class="section-title">⚡ ڈائنامک کنٹرولز</div>
        <div class="button-group">
            <button id="changeTextBtn" class="btn-primary">ہیڈنگ بدلیں</button>
            <button id="addDynamicBtn" class="btn-primary">نیا بٹن بنائیں</button>
            <button id="resetDynamicBtns" class="btn-primary">تمام نئے بٹن ہٹائیں</button>
        </div>
        <div id="dynamicButtonsContainer" class="dynamic-buttons-area"></div>
    </div>

    <!-- APK جنریشن سیکشن (Android کے ساتھ انٹرفیس) -->
    <div class="section">
        <div class="section-title">📦 اے پی کے جنریٹر</div>
        <p>موجودہ تھیم اور ڈیزائن کے ساتھ ایک نیا APK تیار کریں۔</p>
        <div class="button-group">
            <button id="generateApkBtn" class="btn-success">✨ Generate APK from Current Theme</button>
        </div>
        <div id="apkStatus" class="apk-status"></div>
    </div>

    <footer>
        <span id="versionText">System Pro v3.0 | Custom Colors + APK Bridge</span>
    </footer>
</div>

<script>
    // ---------- مضبوط تھیم اور کلر سکیم ہینڈلنگ ----------
    const defaultLight = {
        primary: "#00b4d8",
        secondary: "#f97316"
    };
    const defaultDark = {
        primary: "#2dd4bf",
        secondary: "#fb923c"
    };

    // محفوظ کردہ ویلیوز لوڈ کریں
    let currentThemeType = localStorage.getItem("current_theme_type") || "light";
    let customPrimary = localStorage.getItem("custom_primary") || defaultLight.primary;
    let customSecondary = localStorage.getItem("custom_secondary") || defaultLight.secondary;

    // DOM عناصر
    const root = document.documentElement;
    const primaryPicker = document.getElementById("primaryColorPicker");
    const secondaryPicker = document.getElementById("secondaryColorPicker");
    const applyCustomBtn = document.getElementById("applyCustomBtn");
    const resetCustomBtn = document.getElementById("resetCustomBtn");
    const themeBtns = document.querySelectorAll(".theme-btn");

    // تھیم لگانے کا فنکشن
    function applyTheme(themeType, primaryColor = null, secondaryColor = null) {
        let pri = primaryColor, sec = secondaryColor;
        if (themeType === "light") {
            pri = defaultLight.primary;
            sec = defaultLight.secondary;
        } else if (themeType === "dark") {
            pri = defaultDark.primary;
            sec = defaultDark.secondary;
        } else if (themeType === "custom") {
            if (!pri) pri = customPrimary;
            if (!sec) sec = customSecondary;
        }
        // CSS متغیرات اپ ڈیٹ کریں
        root.style.setProperty("--accent-primary", pri);
        root.style.setProperty("--accent-secondary", sec);
        root.style.setProperty("--btn-primary-bg", pri);
        // اگر تھیم ڈارک ہے تو بیس کلرز بھی سیٹ کریں
        if (themeType === "dark") {
            root.setAttribute("data-theme", "dark");
        } else if (themeType === "light") {
            root.setAttribute("data-theme", "light");
        } else {
            // کسٹم تھیم میں data-theme ہٹا دیں تاکہ وہ اوور رائڈ نہ ہو
            root.removeAttribute("data-theme");
        }
        // محفوظ کریں
        localStorage.setItem("current_theme_type", themeType);
        if (themeType === "custom") {
            localStorage.setItem("custom_primary", pri);
            localStorage.setItem("custom_secondary", sec);
            customPrimary = pri;
            customSecondary = sec;
            primaryPicker.value = pri;
            secondaryPicker.value = sec;
        }
        // ایکٹو بٹن کو نمایاں کریں
        themeBtns.forEach(btn => {
            if (btn.getAttribute("data-theme") === themeType) {
                btn.classList.add("active");
            } else {
                btn.classList.remove("active");
            }
        });
    }

    // کسٹم کلرز لگائیں
    function applyCustomColors() {
        const pri = primaryPicker.value;
        const sec = secondaryPicker.value;
        applyTheme("custom", pri, sec);
    }

    // ری سیٹ کسٹم (پہلے لائٹ پر جائیں)
    function resetToLight() {
        applyTheme("light");
        primaryPicker.value = defaultLight.primary;
        secondaryPicker.value = defaultLight.secondary;
    }

    // تھیم بٹنوں کے ایونٹس
    themeBtns.forEach(btn => {
        btn.addEventListener("click", () => {
            const theme = btn.getAttribute("data-theme");
            if (theme === "custom") {
                applyCustomColors();
            } else {
                applyTheme(theme);
            }
        });
    });

    applyCustomBtn.addEventListener("click", applyCustomColors);
    resetCustomBtn.addEventListener("click", resetToLight);

    // پہلے سے محفوظ تھیم لوڈ کریں
    function loadSavedTheme() {
        const savedType = localStorage.getItem("current_theme_type");
        if (savedType === "light") applyTheme("light");
        else if (savedType === "dark") applyTheme("dark");
        else if (savedType === "custom") {
            const pri = localStorage.getItem("custom_primary") || defaultLight.primary;
            const sec = localStorage.getItem("custom_secondary") || defaultLight.secondary;
            applyTheme("custom", pri, sec);
        } else {
            applyTheme("light");
        }
    }

    // ---------- ڈائنامک بٹن ہینڈلنگ (مستقل) ----------
    let dynamicButtons = [];
    let buttonCounter = parseInt(localStorage.getItem("dynamic_button_counter") || "0");

    function saveDynamicButtons() {
        // بٹنوں کے ٹیکسٹ کو محفوظ کریں
        const btnTexts = dynamicButtons.map(btn => btn.innerText);
        localStorage.setItem("dynamic_buttons_texts", JSON.stringify(btnTexts));
        localStorage.setItem("dynamic_button_counter", buttonCounter);
    }

    function createDynamicButton(text = null) {
        buttonCounter++;
        const btnText = text || `نیا بٹن ${buttonCounter}`;
        const newBtn = document.createElement("button");
        newBtn.innerText = btnText;
        newBtn.classList.add("dynamic-btn");
        newBtn.addEventListener("click", () => {
            alert(`آپ نے "${btnText}" دبایا!`);
        });
        document.getElementById("dynamicButtonsContainer").appendChild(newBtn);
        dynamicButtons.push(newBtn);
        saveDynamicButtons();
    }

    function restoreDynamicButtons() {
        const savedTexts = localStorage.getItem("dynamic_buttons_texts");
        if (savedTexts) {
            const texts = JSON.parse(savedTexts);
            texts.forEach(txt => {
                buttonCounter++;
                const btn = document.createElement("button");
                btn.innerText = txt;
                btn.classList.add("dynamic-btn");
                btn.addEventListener("click", () => alert(`آپ نے "${txt}" دبایا!`));
                document.getElementById("dynamicButtonsContainer").appendChild(btn);
                dynamicButtons.push(btn);
            });
            const savedCounter = localStorage.getItem("dynamic_button_counter");
            if (savedCounter) buttonCounter = parseInt(savedCounter);
        }
    }

    function resetAllDynamicButtons() {
        dynamicButtons.forEach(btn => btn.remove());
        dynamicButtons = [];
        buttonCounter = 0;
        localStorage.removeItem("dynamic_buttons_texts");
        localStorage.removeItem("dynamic_button_counter");
    }

    // ہیڈنگ ٹیکسٹ بدلیں
    let headingIndex = parseInt(localStorage.getItem("heading_index") || "0");
    const headings = ["System Pro Studio", "Colorful Themes", "APK Builder", "Your Own App"];
    function changeHeading() {
        const h1 = document.querySelector("h1");
        headingIndex = (headingIndex + 1) % headings.length;
        h1.innerText = headings[headingIndex];
        localStorage.setItem("heading_index", headingIndex);
    }
    function restoreHeading() {
        const h1 = document.querySelector("h1");
        h1.innerText = headings[headingIndex % headings.length];
    }

    // ---------- Android کے ساتھ APK جنریشن انٹرفیس ----------
    const generateBtn = document.getElementById("generateApkBtn");
    const apkStatusDiv = document.getElementById("apkStatus");

    function sendToAndroidForApk() {
        // موجودہ تھیم کی معلومات جمع کریں
        const themeData = {
            themeType: localStorage.getItem("current_theme_type") || "light",
            primaryColor: getComputedStyle(root).getPropertyValue("--accent-primary").trim(),
            secondaryColor: getComputedStyle(root).getPropertyValue("--accent-secondary").trim(),
            headingText: document.querySelector("h1").innerText,
            dynamicButtonsCount: dynamicButtons.length,
            timestamp: Date.now()
        };
        // اگر Android WebView میں JavaScript interface موجود ہو تو اسے کال کریں
        if (window.AndroidBridge && typeof window.AndroidBridge.generateApk === "function") {
            window.AndroidBridge.generateApk(JSON.stringify(themeData));
            apkStatusDiv.innerHTML = "⏳ APK تیار ہو رہا ہے... براہ کرم صبر کریں۔";
        } else {
            // ڈیمو موڈ - صارف کو بتائیں کہ یہ اصلی Android ایپ میں کام کرے گا
            apkStatusDiv.innerHTML = "⚠️ یہ فیچر صرف Android ایپ میں کام کرے گا جب JavaScript interface شامل ہو۔ ڈیمو ڈیٹا: " + JSON.stringify(themeData);
            console.log("APK Request Data:", themeData);
        }
    }

    generateBtn.addEventListener("click", sendToAndroidForApk);

    // Android سے پیغام وصول کرنے کے لیے (اگر APK بننے کی اطلاع دی جائے)
    window.receiveApkStatus = function(status) {
        apkStatusDiv.innerHTML = status;
        setTimeout(() => {
            if (apkStatusDiv.innerHTML === status) apkStatusDiv.innerHTML = "✅ تیار!";
        }, 3000);
    };

    // ---------- انیشیلائزیشن ----------
    function init() {
        loadSavedTheme();
        restoreDynamicButtons();
        restoreHeading();
        document.getElementById("changeTextBtn").addEventListener("click", changeHeading);
        document.getElementById("addDynamicBtn").addEventListener("click", () => createDynamicButton());
        document.getElementById("resetDynamicBtns").addEventListener("click", resetAllDynamicButtons);
    }

    init();
</script>
</body>
</html>
