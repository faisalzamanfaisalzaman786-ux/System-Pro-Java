<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>System Pro - Dynamic UI</title>
    <style>
        /* ----- CSS Custom Properties (Variables) ----- */
        :root {
            /* Light theme (default) */
            --bg-primary: #ffffff;
            --bg-secondary: #f5f7fa;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --accent-cyan: #00b4d8;
            --accent-orange: #f97316;
            --accent-purple: #8b5cf6;
            --card-bg: rgba(0, 180, 216, 0.08);
            --border-color: #e2e8f0;
            --btn-primary-bg: #00b4d8;
            --btn-primary-text: #0f172a;
            --btn-secondary-bg: #f1f5f9;
            --btn-secondary-text: #1e293b;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: all 0.2s ease;
        }

        /* Dark theme */
        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --accent-cyan: #2dd4bf;
            --accent-orange: #fb923c;
            --accent-purple: #a78bfa;
            --card-bg: rgba(45, 212, 191, 0.1);
            --border-color: #334155;
            --btn-primary-bg: #2dd4bf;
            --btn-primary-text: #0f172a;
            --btn-secondary-bg: #334155;
            --btn-secondary-text: #f1f5f9;
        }

        /* Blue theme */
        [data-theme="blue"] {
            --bg-primary: #eef2ff;
            --bg-secondary: #e0e7ff;
            --text-primary: #1e3a8a;
            --text-secondary: #1e40af;
            --accent-cyan: #3b82f6;
            --accent-orange: #f59e0b;
            --accent-purple: #8b5cf6;
            --card-bg: rgba(59, 130, 246, 0.1);
            --border-color: #bfdbfe;
            --btn-primary-bg: #2563eb;
            --btn-primary-text: #ffffff;
            --btn-secondary-bg: #bfdbfe;
            --btn-secondary-text: #1e3a8a;
        }

        /* Midnight theme */
        [data-theme="midnight"] {
            --bg-primary: #0c0a2a;
            --bg-secondary: #1e1b4b;
            --text-primary: #e0e7ff;
            --text-secondary: #a5b4fc;
            --accent-cyan: #c084fc;
            --accent-orange: #fbbf24;
            --accent-purple: #d8b4fe;
            --card-bg: rgba(192, 132, 252, 0.1);
            --border-color: #4c1d95;
            --btn-primary-bg: #8b5cf6;
            --btn-primary-text: #ffffff;
            --btn-secondary-bg: #2e1065;
            --btn-secondary-text: #e9d5ff;
        }

        /* Forest theme */
        [data-theme="forest"] {
            --bg-primary: #ecfdf5;
            --bg-secondary: #d1fae5;
            --text-primary: #064e3b;
            --text-secondary: #047857;
            --accent-cyan: #10b981;
            --accent-orange: #f97316;
            --accent-purple: #a78bfa;
            --card-bg: rgba(16, 185, 129, 0.08);
            --border-color: #a7f3d0;
            --btn-primary-bg: #059669;
            --btn-primary-text: #ffffff;
            --btn-secondary-bg: #a7f3d0;
            --btn-secondary-text: #064e3b;
        }

        /* Apply variables */
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.2s ease;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: var(--accent-cyan);
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            background-color: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
            box-shadow: var(--shadow-sm);
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background-color: var(--btn-primary-bg);
            color: var(--btn-primary-text);
        }

        .btn-secondary {
            background-color: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(4px);
            padding: 20px;
            border-radius: 24px;
            margin-top: 24px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
        }

        .theme-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }

        .theme-btn {
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 14px;
            background-color: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
            border: 1px solid var(--border-color);
        }

        .theme-btn.active {
            background-color: var(--accent-cyan);
            color: var(--btn-primary-text);
            border-color: var(--accent-cyan);
        }

        .dynamic-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }

        footer {
            margin-top: 40px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        select {
            padding: 8px 16px;
            border-radius: 40px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="heading">System Pro Studio</h1>
        <p class="subtitle">مکمل تھیم اور کلر سکیم ہینڈلنگ</p>

        <!-- Theme dropdown (additional) -->
        <div>
            <select id="themeSelect" aria-label="تھیم منتخب کریں">
                <option value="light">روشنی (Light)</option>
                <option value="dark">اندھیرا (Dark)</option>
                <option value="blue">نیلا (Blue)</option>
                <option value="midnight">نصف شب (Midnight)</option>
                <option value="forest">جنگل (Forest)</option>
            </select>
        </div>

        <!-- Quick theme buttons -->
        <div class="theme-selector" id="themeButtons">
            <button class="theme-btn" data-theme="light">روشنی</button>
            <button class="theme-btn" data-theme="dark">اندھیرا</button>
            <button class="theme-btn" data-theme="blue">نیلا</button>
            <button class="theme-btn" data-theme="midnight">نصف شب</button>
            <button class="theme-btn" data-theme="forest">جنگل</button>
        </div>

        <div class="dynamic-buttons">
            <button class="btn-primary" id="changeTextBtn">ٹیکسٹ بدلیں</button>
            <button class="btn-secondary" id="addButtonBtn">نیا بٹن شامل کریں</button>
            <button class="btn-secondary" id="resetDynamicBtn">ڈائنامک بٹن ری سیٹ</button>
        </div>

        <div id="dynamicArea" class="card">
            <p>یہاں آپ ڈائنامک تبدیلیاں دیکھ سکتے ہیں۔</p>
            <p>تھیم تبدیل کریں، نیے بٹن بنائیں، اور تمام تبدیلیاں <strong>محفوظ</strong> ہو جائیں گی۔</p>
        </div>

        <footer>
            <span id="version">System Pro v2.0 - تھیمز اب زیادہ مضبوط</span>
        </footer>
    </div>

    <script>
        // ---------- مضبوط تھیم ہینڈلنگ ----------
        // تمام دستیاب تھیمز
        const THEMES = ['light', 'dark', 'blue', 'midnight', 'forest'];
        
        // محفوظ کردہ تھیم حاصل کریں یا سسٹم کی ترجیح
        function getSavedTheme() {
            const saved = localStorage.getItem('app_theme');
            if (saved && THEMES.includes(saved)) return saved;
            // سسٹم کی ترجیح چیک کریں (اگر ڈارک موڈ پسند ہو)
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                return 'dark';
            }
            return 'light';  // ڈیفالٹ
        }

        // تھیم لگائیں
        function applyTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('app_theme', themeName);
            
            // تھیم سلیکٹ ڈراپ ڈاؤن کو اپ ڈیٹ کریں
            const select = document.getElementById('themeSelect');
            if (select) select.value = themeName;
            
            // ایکٹو تھیم بٹن کو نمایاں کریں
            document.querySelectorAll('.theme-btn').forEach(btn => {
                if (btn.getAttribute('data-theme') === themeName) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // تھیم تبدیل کرنے کے لیے ایونٹ لسٹنرز
        function setupThemeListeners() {
            // ڈراپ ڈاؤن سے
            const select = document.getElementById('themeSelect');
            if (select) {
                select.addEventListener('change', (e) => {
                    applyTheme(e.target.value);
                });
            }
            
            // بٹنوں سے
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const theme = btn.getAttribute('data-theme');
                    if (theme) applyTheme(theme);
                });
            });
        }

        // ---------- ٹیکسٹ چینج ہینڈلنگ (مضبوط) ----------
        let textIndex = 0;
        const texts = [
            "System Pro Studio", 
            "اپنی مرضی کی ایپ", 
            "Dynamic UI with Themes", 
            "No Server Needed", 
            "Powerful & Reliable"
        ];
        
        function changeHeadingText() {
            const heading = document.getElementById('heading');
            textIndex = (textIndex + 1) % texts.length;
            heading.innerText = texts[textIndex];
            // صارف کی ترجیح محفوظ کریں
            localStorage.setItem('last_text_index', textIndex);
        }
        
        // محفوظ شدہ ٹیکسٹ انڈیکس لوڈ کریں
        function loadSavedText() {
            const savedIndex = localStorage.getItem('last_text_index');
            if (savedIndex !== null && !isNaN(parseInt(savedIndex))) {
                textIndex = parseInt(savedIndex) % texts.length;
                document.getElementById('heading').innerText = texts[textIndex];
            }
        }

        // ---------- ڈائنامک بٹن ہینڈلنگ (مضبوط) ----------
        let dynamicButtons = [];  // بٹن ریفرنسز کو ٹریک کرنے کے لیے
        let buttonCounter = parseInt(localStorage.getItem('button_counter') || '0');
        
        function createNewButton() {
            buttonCounter++;
            const newBtn = document.createElement('button');
            newBtn.innerText = `نیا بٹن ${buttonCounter}`;
            newBtn.className = 'btn-secondary';
            // ہر بٹن پر کلک کرنے پر کچھ ایکشن
            newBtn.addEventListener('click', () => {
                alert(`آپ نے بٹن ${buttonCounter} دبایا! تھیم: ${document.documentElement.getAttribute('data-theme')}`);
            });
            // اسے body میں container کے اندر شامل کریں
            const container = document.querySelector('.container');
            // dynamicArea سے پہلے شامل کریں یا آخر میں
            const dynamicArea = document.getElementById('dynamicArea');
            container.insertBefore(newBtn, dynamicArea);
            dynamicButtons.push(newBtn);
            // کاؤنٹر محفوظ کریں
            localStorage.setItem('button_counter', buttonCounter);
            // بٹنوں کی لسٹ محفوظ کریں (صرف تعداد محفوظ ہے، نئے بٹن دوبارہ بن جائیں گے)
            saveButtonsList();
        }
        
        // تمام ڈائنامک بٹن ہٹائیں
        function resetDynamicButtons() {
            dynamicButtons.forEach(btn => btn.remove());
            dynamicButtons = [];
            buttonCounter = 0;
            localStorage.setItem('button_counter', 0);
            localStorage.removeItem('saved_buttons');
        }
        
        // بٹنوں کی موجودہ تعداد محفوظ کریں (ری لوڈ پر دوبارہ بنانے کے لیے)
        function saveButtonsList() {
            localStorage.setItem('saved_buttons', JSON.stringify(dynamicButtons.map(btn => btn.innerText)));
        }
        
        // محفوظ بٹنوں کو بحال کریں (صرف تعداد کی بنیاد پر)
        function restoreDynamicButtons() {
            const savedCount = localStorage.getItem('button_counter');
            if (savedCount && !isNaN(parseInt(savedCount))) {
                const count = parseInt(savedCount);
                for (let i = 1; i <= count; i++) {
                    buttonCounter = i;
                    const newBtn = document.createElement('button');
                    newBtn.innerText = `نیا بٹن ${i}`;
                    newBtn.className = 'btn-secondary';
                    newBtn.addEventListener('click', () => {
                        alert(`آپ نے بٹن ${i} دبایا! تھیم: ${document.documentElement.getAttribute('data-theme')}`);
                    });
                    const container = document.querySelector('.container');
                    const dynamicArea = document.getElementById('dynamicArea');
                    container.insertBefore(newBtn, dynamicArea);
                    dynamicButtons.push(newBtn);
                }
                buttonCounter = count;
            }
        }

        // ---------- سسٹم تھیم میں تبدیلی سنیں (مثلاً ڈیوائس ڈارک موڈ) ----------
        function watchSystemTheme() {
            const darkModeMedia = window.matchMedia('(prefers-color-scheme: dark)');
            darkModeMedia.addEventListener('change', (e) => {
                // صرف اس صورت میں جب صارف نے پہلے سے کوئی تھیم محفوظ نہ کیا ہو
                const saved = localStorage.getItem('app_theme');
                if (!saved) {
                    const newTheme = e.matches ? 'dark' : 'light';
                    applyTheme(newTheme);
                }
            });
        }

        // ---------- انیشیلائزیشن ----------
        function init() {
            // پہلے محفوظ شدہ تھیم لگائیں
            const savedTheme = getSavedTheme();
            applyTheme(savedTheme);
            
            // تھیم لسٹنرز سیٹ اپ کریں
            setupThemeListeners();
            
            // ٹیکسٹ بحال کریں
            loadSavedText();
            
            // ڈائنامک بٹن بحال کریں
            restoreDynamicButtons();
            
            // ایونٹ لسٹنرز
            document.getElementById('changeTextBtn').addEventListener('click', changeHeadingText);
            document.getElementById('addButtonBtn').addEventListener('click', createNewButton);
            document.getElementById('resetDynamicBtn').addEventListener('click', resetDynamicButtons);
            
            // سسٹم تھیم چینج سنیں
            watchSystemTheme();
        }
        
        // جب صفحہ مکمل لوڈ ہو جائے
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
