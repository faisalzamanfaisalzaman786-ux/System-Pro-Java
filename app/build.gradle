name: System Pro Ultimate - Structural Fix

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Force Physical Re-structure (تین گنا صفائی اور تعمیر)
        run: |
          # پرانے تمام غیر ضروری فولڈرز ڈیلیٹ کریں
          rm -rf .gradle build app/build
          
          # پروفیشنل فولڈر اسٹرکچر بنائیں
          mkdir -p app/src/main/java/com/systempro/ultimate
          mkdir -p app/src/main/res/layout
          mkdir -p gradle/wrapper

          # مین سیٹنگ فائل کو دوبارہ لکھیں تاکہ کنفلکٹ نہ آئے
          echo "include ':app'" > settings.gradle
          
          # پروجیکٹ لیول build.gradle کو فکس کریں
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Re-generate Gradle Wrapper (8.5)
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: 5. Final Deep Clean Build
        run: |
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: 6. Upload Fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-V8-Final
          path: app/build/outputs/apk/debug/*.apk
