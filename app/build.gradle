dependencies {
    // اینڈرائیڈ کی بنیادی لائبریریز جن میں ٹکراؤ ہو رہا ہے
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // ان لائبریریز کو زبردستی ایک ہی ورژن پر لانے کے لیے (Conflict Resolution)
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'androidx.activity:activity-ktx:1.6.0'
}

// یہ بلاک گریڈل کو مجبور کرے گا کہ وہ متصادم ورژنز کو نظر انداز کرے
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.9.0'
        force 'androidx.lifecycle:lifecycle-livedata-core:2.5.1'
        force 'androidx.cursoradapter:cursoradapter:1.0.0'
    }
}
