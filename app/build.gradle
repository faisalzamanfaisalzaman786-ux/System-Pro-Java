plugins {
    id 'com.android.application'
}

android {
    namespace 'com.system.pro'
    compileSdk 34

    defaultConfig {
        applicationId "com.system.pro"
        minSdk 21
        targetSdk 34 // اسے 34 پر رکھیں تاکہ compileSdk کے ساتھ ہم آہنگ رہے
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // یہ حصہ لائبریری کے تنازعات (Conflicts) کو ختم کرنے کے لیے شامل کیا گیا ہے
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.9.0'
            force 'androidx.appcompat:appcompat:1.6.1'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // بنیادی اینڈرائیڈ ٹیسٹنگ کے لیے
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
