// یہ لائن سب سے اوپر ہونا لازمی ہے، ورنہ 'android()' میتھڈ نہیں ملے گا
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.faisal.systempro' // اپنے پروجیکٹ کا اصل پیکیج نام یہاں لکھیں
    compileSdk 34

    defaultConfig {
        applicationId "com.faisal.systempro"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // لائبریریز کے ٹکراؤ کو روکنے کے لیے یہ بلاک ضروری ہے
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.9.0'
            force 'androidx.appcompat:appcompat:1.6.1'
            force 'androidx.lifecycle:lifecycle-livedata-core:2.5.1'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // کٹلن اور دیگر ضروری سپورٹ
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'androidx.activity:activity-ktx:1.6.0'
}
