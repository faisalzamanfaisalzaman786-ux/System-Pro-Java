plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    // namespace will be replaced dynamically by workflow
    namespace 'com.systempro.app'

    defaultConfig {
        // applicationId will be replaced dynamically
        applicationId "com.systempro.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No extra dependencies to keep it minimal and compatible
}
