plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace 'com.systempro.app'  // آپ کی مرضی کے پیکج نیم سے بدل سکتے ہیں

    defaultConfig {
        applicationId "com.systempro.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // کوئی بھی ڈیپنڈنسی اگر چاہیں تو ڈالیں، ورنہ خالی رکھیں
    // implementation 'androidx.appcompat:appcompat:1.6.1'
}
