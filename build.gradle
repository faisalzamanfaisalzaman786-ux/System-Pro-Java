plugins {
    id 'java'
    id 'application'
}

group = 'com.faisalzar'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

application {
    mainClass = 'com.faisalzar.Main'
}

test {
    useJUnitPlatform()
}
