<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SystemPro AI – Puter.js (Free & Unlimited)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Puter.js library - no API key needed -->
    <script src="https://js.puter.com/v2/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #02040c; color: #eef5ff; height: 100dvh; display: flex; flex-direction: column; padding: 10px; overflow: hidden; }
        .app-container { flex: 1; display: flex; flex-direction: column; gap: 10px; max-width: 1000px; margin: 0 auto; width: 100%; min-height: 0; overflow: hidden; }
        .main-title h1 { font-size: 1.5rem; font-weight: 800; background: linear-gradient(125deg, #00FFCC, #a855f7); -webkit-background-clip: text; color: transparent; text-align: center; }
        .action-row { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
        .action-btn { flex: 1; background: rgba(0, 255, 204, 0.05); border: 1px solid #00FFCC; padding: 10px 0; border-radius: 15px; color: #00FFCC; font-weight: 600; font-size: 0.75rem; cursor: pointer; text-align: center; transition: 0.2s; }
        .action-btn:hover { background: rgba(0, 255, 204, 0.15); }
        .action-btn.danger { border-color: #ff5555; color: #ff5555; }
        .action-btn.copy { border-color: #ffaa33; color: #ffaa33; }
        .tab-bar { display: flex; gap: 5px; border-bottom: 1px solid #2a3a60; padding-bottom: 5px; overflow-x: auto; flex-shrink: 0; }
        .tab { background: none; border: none; padding: 8px 12px; border-radius: 12px; color: #9bb3e0; cursor: pointer; font-size: 0.7rem; white-space: nowrap; transition: 0.2s; }
        .tab.active { background: rgba(0, 255, 204, 0.15); color: #00FFCC; font-weight: bold; }
        .editor-container { background: #010612; border: 1px solid #2c3d62; border-radius: 15px; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
        .editor, .ai-assistant, #iconTabArea, #historyTabArea, .resource-subtabs { width: 100%; height: 100%; background: transparent; overflow-y: auto; display: none; }
        .editor.active, .ai-assistant.active, #iconTabArea.active, #historyTabArea.active { display: block; }
        .resource-subtabs.active { display: flex; flex-direction: column; padding: 12px; gap: 16px; overflow-y: auto; }
        .editor textarea { width: 100%; height: 100%; background: transparent; border: none; padding: 12px; font-family: monospace; color: #d6e6ff; outline: none; resize: none; font-size: 0.8rem; }
        .resource-subtabs .section { background: #0d1426; border-radius: 12px; padding: 10px; border: 1px solid #2f4170; flex-shrink: 0; }
        .resource-subtabs .section h3 { font-size: 0.9rem; color: #00FFCC; margin-bottom: 8px; }
        .resource-subtabs textarea { width: 100%; background: #030617; border: 1px solid #2f4170; border-radius: 8px; padding: 10px; font-family: monospace; color: #d6e6ff; outline: none; resize: vertical; font-size: 0.75rem; margin-top: 5px; min-height: 120px; }
        .ai-assistant { display: none; flex-direction: column; height: 100%; padding: 12px; gap: 12px; overflow-y: auto; background: #010612; }
        .ai-assistant.active { display: flex; }
        .ai-assistant textarea { width: 100%; flex: 1; min-height: 55vh; background: #030617; border: 2px solid #a855f7; border-radius: 20px; padding: 16px; color: white; font-family: monospace; font-size: 1rem; resize: vertical; outline: none; }
        .ai-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
        button { background: #a855f7; border: none; padding: 10px 20px; border-radius: 40px; color: white; font-weight: bold; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
        button:hover { background: #7c3aed; }
        .status-card { background: rgba(13, 20, 38, 0.8); border: 1px solid #1e293b; border-radius: 15px; padding: 10px; flex-shrink: 0; min-height: 140px; display: flex; flex-direction: column; transition: 0.2s; }
        .status-card.hide-log { display: none; }
        .progress-bar { width: 100%; background: #0f172a; height: 6px; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
        #fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00FFCC, #a855f7); transition: 0.4s; }
        .log { flex: 1; overflow-y: auto; font-size: 0.7rem; color: #a8b2d1; font-family: monospace; line-height: 1.4; }
        .build-row { display: flex; gap: 10px; flex-shrink: 0; margin-top: 5px; }
        .btn-primary { flex: 1.2; background: linear-gradient(95deg, #00FFCC, #1c9eff); color: #02040c; border: none; padding: 14px 0; border-radius: 20px; font-weight: 800; cursor: pointer; }
        .btn-secondary { flex: 1; background: #a855f7; color: white; border: none; padding: 14px 0; border-radius: 20px; font-weight: 800; cursor: pointer; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal { background: #0f172a; padding: 25px; border-radius: 25px; border: 1px solid #00FFCC; width: 100%; max-width: 450px; }
        .modal input { width: 100%; background: #030617; border: 1px solid #2f4170; padding: 12px; border-radius: 15px; color: white; margin-bottom: 12px; outline: none; }
        .toast-msg { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #0f172a; border: 1px solid #00FFCC; padding: 8px 20px; border-radius: 30px; color: white; font-size: 0.8rem; z-index: 300; transition: 0.3s; }
        .toast-msg.show { transform: translateX(-50%) translateY(0); }
        .icon-preview { width: 60px; height: 60px; border-radius: 12px; border: 1px solid #00FFCC; object-fit: cover; margin-top: 5px; }
        .download-link { font-size: 0.75rem; margin-top: 8px; padding: 6px; background: #0d1426; border-radius: 8px; word-break: break-all; display: none; }
        .copy-link-btn { background: #334155; border: none; padding: 2px 8px; border-radius: 12px; color: white; font-size: 0.65rem; cursor: pointer; margin-left: 8px; }
        .instructions-box { background: #0d1426; border-radius: 12px; padding: 8px; margin-top: 8px; }
        .instructions-box label { font-size: 0.7rem; color: #00FFCC; }
        .instructions-box textarea { width: 100%; background: #030617; border: 1px solid #2f4170; border-radius: 8px; padding: 6px; color: #d6e6ff; font-size: 0.7rem; font-family: monospace; resize: vertical; margin-top: 4px; }
        .small-btn { background: #334155; border: none; padding: 4px 8px; border-radius: 12px; color: white; font-size: 0.65rem; cursor: pointer; margin-top: 4px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="main-title"><h1>⚡ SystemPro AI – Puter.js (Free & Unlimited)</h1></div>
    
    <div class="action-row">
        <button class="action-btn" onclick="saveAllData()"><i class="fas fa-save"></i> SAVE ALL</button>
        <button class="action-btn" onclick="toggleModal(true)"><i class="fas fa-cog"></i> SETTINGS</button>
        <button class="action-btn" onclick="clearLogs()"><i class="fas fa-trash-alt"></i> CLEAR LOG</button>
        <button class="action-btn copy" onclick="copyAllCode()"><i class="fas fa-copy"></i> COPY ALL CODE</button>
        <button class="action-btn danger" onclick="clearCodeOnly()"><i class="fas fa-times-circle"></i> CLEAR DATA (Code only)</button>
    </div>

    <div class="tab-bar">
        <button class="tab active" onclick="switchTab('java', this)">MainActivity.java</button>
        <button class="tab" onclick="switchTab('xml', this)">activity_main.xml</button>
        <button class="tab" onclick="switchTab('manifest', this)">AndroidManifest.xml</button>
        <button class="tab" onclick="switchTab('resources', this)">🎨 All Resources</button>
        <button class="tab" onclick="switchTab('ai', this)">🤖 AI Assistant (Puter.js)</button>
        <button class="tab" onclick="switchTab('icon', this)">App Icon</button>
        <button class="tab" onclick="switchTab('history', this)">History</button>
    </div>

    <div class="editor-container">
        <div id="javaEditor" class="editor active"><textarea id="javaCode" placeholder="MainActivity.java (empty)"></textarea></div>
        <div id="xmlEditor" class="editor"><textarea id="xmlCode" placeholder="activity_main.xml (empty)"></textarea></div>
        <div id="manifestEditor" class="editor"><textarea id="manifestCode" placeholder="AndroidManifest.xml (empty)"></textarea></div>
        <div id="resourcesTab" class="resource-subtabs">
            <div class="section"><h3>🎨 colors.xml</h3><textarea id="colorsXml" placeholder="colors.xml"></textarea></div>
            <div class="section"><h3>📝 styles.xml</h3><textarea id="stylesXml" placeholder="styles.xml"></textarea></div>
            <div class="section"><h3>🎭 themes.xml</h3><textarea id="themesXml" placeholder="themes.xml"></textarea></div>
            <div class="section"><h3>📐 dimens.xml</h3><textarea id="dimensXml" placeholder="dimens.xml"></textarea></div>
            <div class="section"><h3>📜 strings.xml</h3><textarea id="stringsXml" placeholder="strings.xml"></textarea></div>
            <div class="section"><h3>🖌️ button_gradient.xml</h3><textarea id="buttonGradientXml" placeholder="button_gradient.xml"></textarea></div>
            <div class="section"><h3>💡 ic_torch_on.xml</h3><textarea id="icTorchOnXml" placeholder="ic_torch_on.xml"></textarea></div>
            <div class="section"><h3>💡 ic_torch_off.xml</h3><textarea id="icTorchOffXml" placeholder="ic_torch_off.xml"></textarea></div>
        </div>
        <div id="aiAssistantArea" class="ai-assistant">
            <textarea id="aiPromptArea" placeholder="Describe your app... e.g., 'A simple To-Do List app with add, delete, and complete functionality.'"></textarea>
            <div class="ai-controls">
                <button onclick="generateWithPuter()">⚡ Generate Code (Puter.js - Free)</button>
            </div>
            <div class="instructions-box">
                <label>✏️ System Instructions (ultra precise – do not change unless needed):</label>
                <textarea id="systemInstructionsText" rows="6"></textarea>
                <button class="small-btn" onclick="resetInstructionsToDefault()">Reset to Precise Instructions</button>
            </div>
            <div id="aiStatus" class="ai-status"></div>
        </div>
        <div id="iconTabArea">
            <input type="file" id="iconInput" accept="image/png" style="display:none" onchange="processIcon(this)">
            <button class="action-btn" onclick="document.getElementById('iconInput').click()">Upload PNG Icon (96x96)</button>
            <center><img id="iconPreview" class="icon-preview" style="display:none"></center>
        </div>
        <div id="historyTabArea"><div id="historyList"></div></div>
    </div>

    <div class="status-card" id="statusCard">
        <div class="progress-bar"><div id="fill"></div></div>
        <div class="log" id="logs">Ready. Using Puter.js – free, no API key needed.</div>
        <div id="downloadLinkBox" class="download-link"></div>
    </div>

    <div class="build-row">
        <button class="btn-primary" onclick="startFullProcess()">🚀 Upload & Build</button>
        <button class="btn-secondary" onclick="downloadLatestApk()">📥 DOWNLOAD APK</button>
    </div>
</div>

<div id="settingsModal" class="modal-overlay">
    <div class="modal">
        <h3>⚙️ Settings</h3>
        <input type="text" id="pkgName" placeholder="Package name (e.g., com.systempro.todolist)">
        <input type="password" id="ghToken" placeholder="GitHub Token (repo + actions)">
        <input type="text" id="ghRepo" placeholder="owner/repo">
        <button class="btn-primary" onclick="saveSettings()">SAVE SETTINGS</button>
    </div>
</div>
<div id="toastMsg" class="toast-msg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
    // ======================= GLOBALS =======================
    let processedIconB64 = "";
    let pollingInterval = null;
    let lastClickTime = 0;

    // ULTRA PRECISE SYSTEM INSTRUCTIONS – same as before
    const ULTRA_PRECISE_INSTRUCTIONS = `You are an expert Android developer. Generate a COMPLETE, WORKING Android app based EXACTLY on the user's request. You MUST output exactly THREE files: MainActivity.java, activity_main.xml, and AndroidManifest.xml. No other files.

**CRITICAL RULES – SELF-CONTAINED CODE:**
- The Java file MUST be self-contained. Include ALL necessary classes (DatabaseHelper, Adapter, Model) as INNER CLASSES inside MainActivity.java.
- For RecyclerView items, create the item view PROGRAMMATICALLY inside the adapter's onCreateViewHolder. Use LinearLayout with LayoutParams (width = MATCH_PARENT, height = WRAP_CONTENT). Add child views (CheckBox, TextView, ImageButton, etc.) with proper LayoutParams. NEVER create a separate XML file for the item layout.
- Include ALL required imports: android.view.ViewGroup, android.database.Cursor, android.database.sqlite.SQLiteDatabase, android.database.sqlite.SQLiteOpenHelper, android.graphics.Paint, android.widget.*, androidx.recyclerview.widget.*, and any other needed. Do NOT rely on the workflow to add missing imports.
- The layout XML must contain only the main layout (EditText, Button, RecyclerView). No item layout.
- The manifest MUST NOT contain a package attribute (e.g., package="com.example.app") in the <manifest> tag. The workflow will add it. Also add android:exported="true" for the launcher activity. Use a standard theme like @style/Theme.AppCompat.Light.DarkActionBar – do not invent custom theme names.
- Do NOT add any extra features beyond what the user asked for.
- Data persistence (if needed): Load existing data from database when app starts (in onCreate). Use SQLite with unique id column for updates/deletions. Never use title or name for updates.
- SQL CREATE TABLE: Write as a single line string to avoid syntax errors.
- Model class: Include constructor(s), getters, and setters (e.g., setCompleted).
- Delete functionality: When deleting an item, first get its position in the list, then remove from the list, then call notifyItemRemoved(position). Do NOT remove before getting position.
- Checkbox toggle (strikethrough): Update the database and refresh the item's appearance using notifyItemChanged(position). In onBindViewHolder, set initial paint flags based on task.isCompleted().
- Error handling: Show Toast for empty input, database errors, etc.
- Prevent adding empty tasks.

**APP-SPECIFIC GUIDELINES:**
- To-Do List: SQLite with Task (id, title, completed). Add, delete, toggle completion. Delete button present.
- Torch/Camera: CameraManager, CAMERA permission. Toggle button. No database.
- Calculator: Basic arithmetic (+, -, *, /). No permissions. No database.
- Compass: Use SensorManager with TYPE_ORIENTATION or TYPE_MAGNETIC_FIELD. Show direction. No database.

**OUTPUT FORMAT:**
Return ONLY a valid JSON array with exactly three objects. DO NOT include any extra text, markdown, or code fences outside the JSON.
Example:
[
  {"path":"app/src/main/java/{pkg_path}/MainActivity.java","content":"package ...;"},
  {"path":"app/src/main/res/layout/activity_main.xml","content":"<?xml...?>"},
  {"path":"app/src/main/AndroidManifest.xml","content":"<?xml...?>"}
]
Replace {pkg_path} with the actual package path (dots replaced by slashes). The user will provide the package name in the request.

**REMEMBER: Follow the user's request exactly. Generate fresh code for each new app. Do not mix features. Ensure all imports and layout parameters are correct.**`;

    function getStorage() { return JSON.parse(localStorage.getItem('syspro_data')) || {}; }
    function showToast(msg) { let t = document.getElementById('toastMsg'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
    function addLog(msg, color="#a8b2d1") { let l = document.getElementById('logs'); let t = new Date().toLocaleTimeString(); l.innerHTML += `<div><span style="color:#00FFCC">[${t}]</span> <span style="color:${color}">${msg}</span></div>`; l.scrollTop = l.scrollHeight; }
    function clearLogs() { document.getElementById('logs').innerHTML = ''; addLog("Logs cleared."); }
    function toggleModal(show) {
        const modal = document.getElementById('settingsModal');
        if (show) {
            const saved = getStorage();
            document.getElementById('pkgName').value = saved.pkg || '';
            document.getElementById('ghToken').value = saved.token || '';
            document.getElementById('ghRepo').value = saved.repo || '';
            modal.style.display = 'flex';
        } else {
            modal.style.display = 'none';
        }
    }
    
    // ========== TAB SWITCHING ==========
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        const panels = ['.editor', '.ai-assistant', '#iconTabArea', '#historyTabArea', '.resource-subtabs'];
        panels.forEach(selector => {
            document.querySelectorAll(selector).forEach(panel => panel.classList.remove('active'));
        });
        if (tabId === 'java') document.getElementById('javaEditor').classList.add('active');
        else if (tabId === 'xml') document.getElementById('xmlEditor').classList.add('active');
        else if (tabId === 'manifest') document.getElementById('manifestEditor').classList.add('active');
        else if (tabId === 'resources') document.getElementById('resourcesTab').classList.add('active');
        else if (tabId === 'ai') document.getElementById('aiAssistantArea').classList.add('active');
        else if (tabId === 'icon') document.getElementById('iconTabArea').classList.add('active');
        else if (tabId === 'history') document.getElementById('historyTabArea').classList.add('active');
        const statusCard = document.getElementById('statusCard');
        if (tabId === 'ai') statusCard.classList.add('hide-log');
        else statusCard.classList.remove('hide-log');
    }
    
    function copyAllCode() {
        let java = document.getElementById('javaCode').value;
        let xml = document.getElementById('xmlCode').value;
        let manifest = document.getElementById('manifestCode').value;
        navigator.clipboard.writeText(java + "\n\n" + xml + "\n\n" + manifest);
        showToast("Copied all code!");
    }
    
    // ========== CLEAR ONLY CODE (preserve settings & instructions) ==========
    function clearCodeOnly() {
        document.getElementById('javaCode').value = "";
        document.getElementById('xmlCode').value = "";
        document.getElementById('manifestCode').value = "";
        document.getElementById('colorsXml').value = "";
        document.getElementById('stylesXml').value = "";
        document.getElementById('themesXml').value = "";
        document.getElementById('dimensXml').value = "";
        document.getElementById('stringsXml').value = "";
        document.getElementById('buttonGradientXml').value = "";
        document.getElementById('icTorchOnXml').value = "";
        document.getElementById('icTorchOffXml').value = "";
        processedIconB64 = "";
        document.getElementById('iconPreview').style.display = 'none';
        document.getElementById('iconPreview').src = "";
        const saved = getStorage();
        saved.java = ""; saved.xml = ""; saved.manifest = "";
        saved.colors = ""; saved.styles = ""; saved.themes = ""; saved.dimens = ""; saved.strings = "";
        saved.buttonGradient = ""; saved.icTorchOn = ""; saved.icTorchOff = "";
        saved.iconB64 = "";
        localStorage.setItem('syspro_data', JSON.stringify(saved));
        showToast("Code and resources cleared. Settings and instructions preserved.");
        addLog("Cleared Java, XML, Manifest, Resources, Icon. Settings unchanged.");
    }
    
    function processIcon(input) {
        let file = input.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = e => {
            let img = new Image();
            img.onload = () => {
                let canvas = document.createElement('canvas');
                canvas.width = 96; canvas.height = 96;
                let ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, 96, 96);
                let b64 = canvas.toDataURL('image/png').split(',')[1];
                if (b64 && b64.startsWith('iVBORw0KGgo')) {
                    processedIconB64 = b64;
                    document.getElementById('iconPreview').src = canvas.toDataURL();
                    document.getElementById('iconPreview').style.display = 'block';
                    addLog("Icon processed (96x96 PNG)");
                    showToast("Icon uploaded!");
                } else addLog("Invalid PNG");
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }
    
    function resetInstructionsToDefault() { 
        document.getElementById('systemInstructionsText').value = ULTRA_PRECISE_INSTRUCTIONS; 
        showToast("Instructions reset to ultra-precise version"); 
    }
    
    // ========== AI FUNCTION USING PUTER.JS (FREE, NO API KEY) ==========
    function extractJSONArray(text) {
        let cleaned = text.replace(/```json\s*/gi, '').replace(/```\s*/g, '').trim();
        let start = cleaned.indexOf('[');
        let end = cleaned.lastIndexOf(']');
        if (start === -1 || end === -1) return null;
        try { return JSON.parse(cleaned.substring(start, end+1)); } catch(e) { return null; }
    }
    
    async function generateWithPuter() {
        const prompt = document.getElementById('aiPromptArea').value.trim();
        if (!prompt) { addLog("⚠️ Please describe your app.", "#ffcc00"); return; }
        let pkg = document.getElementById('pkgName').value.trim();
        if (!pkg) pkg = "com.systempro.app";
        let sys = document.getElementById('systemInstructionsText').value || ULTRA_PRECISE_INSTRUCTIONS;
        sys = sys.replace(/\{pkg_path\}/g, pkg.replace(/\./g, '/'));
        const fullPrompt = `${sys}\n\nUser request: ${prompt}\nPackage name: ${pkg}`;
        
        const statusDiv = document.getElementById('aiStatus');
        statusDiv.innerText = "⏳ Generating with Puter.js (free AI)...";
        addLog("Calling Puter.js API (Claude 3.5 Haiku)...");
        
        try {
            // Puter.js chat function - no API key required
            const response = await puter.ai.chat(fullPrompt, { 
                model: 'claude-3.5-haiku'  // You can also use 'gpt-4o', 'llama-3.1-70b', etc.
            });
            
            // Response is a string? Actually puter.ai.chat returns an object with message/content
            const raw = response.message?.content || response;
            addLog("Raw response received, parsing JSON...", "#a8b2d1");
            
            const files = extractJSONArray(raw);
            if (!files) { 
                addLog("❌ AI response not valid JSON. Please try again.", "#ff4444"); 
                statusDiv.innerText = "❌ Invalid response format";
                return; 
            }
            for (let f of files) {
                if (f.path.endsWith("MainActivity.java")) document.getElementById('javaCode').value = f.content;
                else if (f.path.endsWith("activity_main.xml")) document.getElementById('xmlCode').value = f.content;
                else if (f.path.endsWith("AndroidManifest.xml")) document.getElementById('manifestCode').value = f.content;
            }
            addLog("✅ Puter.js generated code successfully!", "#00FFCC");
            statusDiv.innerText = "✅ Done. Check your code tabs.";
        } catch(e) {
            addLog(`❌ Puter.js error: ${e.message}`, "#ff4444");
            statusDiv.innerText = "❌ API call failed";
        }
    }
    
    // ========== GITHUB UPLOAD & BUILD (with auto-clean) ==========
    async function deleteOldPackageFolders(token, owner, repo, currentPkgPath) {
        const comDirPath = "build_assets/app/src/main/java/com";
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${comDirPath}`;
        try {
            const res = await fetch(url, { headers: { Authorization: `token ${token}` } });
            if (!res.ok) return;
            const items = await res.json();
            const currentBase = currentPkgPath.split('/')[0];
            for (const item of items) {
                if (item.type === "dir" && item.name !== currentBase) {
                    addLog(`Deleting old package folder: ${item.name}`, "#ffaa33");
                    const deleteUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${comDirPath}/${item.name}`;
                    const getRes = await fetch(deleteUrl, { headers: { Authorization: `token ${token}` } });
                    if (getRes.ok) {
                        const data = await getRes.json();
                        const sha = data.sha;
                        await fetch(deleteUrl, {
                            method: "DELETE",
                            headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
                            body: JSON.stringify({ message: `Delete ${item.name}`, sha: sha, branch: "main" })
                        });
                        addLog(`Deleted: ${item.name}`, "#ffaa33");
                    }
                }
            }
        } catch(e) { addLog(`Cleanup error: ${e.message}`, "#ffcc00"); }
    }
    
    async function uploadFileToRepo(path, content, token, owner, repo) {
        let url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
        let encoded = (typeof content === 'string' && content.startsWith('iVBORw0KGgo')) ? content : btoa(unescape(encodeURIComponent(content)));
        let sha = null;
        try { let r = await fetch(`${url}?ref=main`, { headers: { Authorization: `token ${token}` } }); if (r.status === 200) { let d = await r.json(); sha = d.sha; } } catch(e) {}
        let body = { message: `Update ${path}`, content: encoded, branch: "main" };
        if (sha) body.sha = sha;
        let res = await fetch(url, { method: "PUT", headers: { Authorization: `token ${token}`, "Content-Type": "application/json" }, body: JSON.stringify(body) });
        return res.status === 200 || res.status === 201;
    }
    
    async function startFullProcess() {
        if (Date.now() - lastClickTime < 5000) { addLog("Please wait 5s"); return; }
        lastClickTime = Date.now();
        let saved = getStorage();
        if (!saved.token || !saved.repo || !saved.pkg) { addLog("Missing GitHub settings", "#ff4444"); return; }
        let [owner, repo] = saved.repo.split('/');
        if (pollingInterval) clearInterval(pollingInterval);
        document.getElementById('fill').style.width = "5%";
        
        addLog("Cleaning old package folders...");
        await deleteOldPackageFolders(saved.token, owner, repo, saved.pkg.replace(/\./g, '/'));
        
        addLog("Uploading files...");
        let pkgPath = saved.pkg.replace(/\./g, '/');
        let resourceFiles = [];
        const resMap = {
            colorsXml: 'build_assets/app/src/main/res/values/colors.xml',
            stylesXml: 'build_assets/app/src/main/res/values/styles.xml',
            themesXml: 'build_assets/app/src/main/res/values/themes.xml',
            dimensXml: 'build_assets/app/src/main/res/values/dimens.xml',
            stringsXml: 'build_assets/app/src/main/res/values/strings.xml',
            buttonGradientXml: 'build_assets/app/src/main/res/drawable/button_gradient.xml',
            icTorchOnXml: 'build_assets/app/src/main/res/drawable/ic_torch_on.xml',
            icTorchOffXml: 'build_assets/app/src/main/res/drawable/ic_torch_off.xml'
        };
        for (const [id, path] of Object.entries(resMap)) {
            let val = document.getElementById(id).value.trim();
            if (val) resourceFiles.push({ path: path, content: val });
        }
        let files = [
            { path: `build_assets/app/src/main/java/${pkgPath}/MainActivity.java`, content: document.getElementById('javaCode').value },
            { path: `build_assets/app/src/main/res/layout/activity_main.xml`, content: document.getElementById('xmlCode').value },
            { path: `build_assets/AndroidManifest.xml`, content: document.getElementById('manifestCode').value },
            ...resourceFiles
        ];
        if (processedIconB64) files.push({ path: `build_assets/app_icon.png`, content: processedIconB64 });
        for (let f of files) {
            let ok = await uploadFileToRepo(f.path, f.content, saved.token, owner, repo);
            if (!ok) { addLog(`Upload failed: ${f.path}`); return; }
            addLog(`Uploaded: ${f.path}`);
            await new Promise(r => setTimeout(r, 200));
        }
        addLog("Triggering workflow...");
        let dispatch = await fetch(`https://api.github.com/repos/${owner}/${repo}/dispatches`, {
            method: "POST", headers: { Authorization: `token ${saved.token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ event_type: "trigger_b64_build", client_payload: { package_name: saved.pkg } })
        });
        if (dispatch.ok) { addLog("Workflow triggered, monitoring..."); document.getElementById('fill').style.width = "50%"; monitorBuild(owner, repo, saved.token); }
        else addLog("Dispatch failed");
    }
    
    async function monitorBuild(owner, repo, token) {
        let lastRunId = null;
        const linkDiv = document.getElementById('downloadLinkBox');
        pollingInterval = setInterval(async () => {
            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs?per_page=1`, { headers: { Authorization: `token ${token}` } });
                const data = await res.json();
                const run = data.workflow_runs?.[0];
                if (run && run.id !== lastRunId) {
                    lastRunId = run.id;
                    if (run.status === 'completed' && run.conclusion === 'success') {
                        clearInterval(pollingInterval);
                        document.getElementById('fill').style.width = "100%";
                        addLog("✅ Build successful!", "#00FFCC");
                        const releaseUrl = `https://github.com/${owner}/${repo}/releases/download/latest-build/app-debug.apk`;
                        linkDiv.innerHTML = `<strong>📦 Download APK:</strong> <a href="${releaseUrl}" target="_blank">${releaseUrl}</a> <button class="copy-link-btn" onclick="copyToClipboard('${releaseUrl}')">Copy</button>`;
                        linkDiv.style.display = 'block';
                    } else if (run.status === 'completed' && run.conclusion !== 'success') {
                        clearInterval(pollingInterval);
                        addLog(`❌ Build failed: ${run.conclusion}`, "#ff4444");
                    }
                }
            } catch(e) {}
        }, 8000);
    }
    
    async function downloadLatestApk() {
        const saved = getStorage();
        if (!saved.repo) return;
        const [owner, repo] = saved.repo.split('/');
        const url = `https://github.com/${owner}/${repo}/releases/download/latest-build/app-debug.apk`;
        window.open(url, '_blank');
    }
    
    function copyToClipboard(text) { navigator.clipboard.writeText(text).then(() => showToast("Copied!")); }
    
    function saveAllData() {
        const data = {
            java: document.getElementById('javaCode').value,
            xml: document.getElementById('xmlCode').value,
            manifest: document.getElementById('manifestCode').value,
            colors: document.getElementById('colorsXml').value,
            styles: document.getElementById('stylesXml').value,
            themes: document.getElementById('themesXml').value,
            dimens: document.getElementById('dimensXml').value,
            strings: document.getElementById('stringsXml').value,
            buttonGradient: document.getElementById('buttonGradientXml').value,
            icTorchOn: document.getElementById('icTorchOnXml').value,
            icTorchOff: document.getElementById('icTorchOffXml').value,
            pkg: document.getElementById('pkgName').value,
            token: document.getElementById('ghToken').value,
            repo: document.getElementById('ghRepo').value,
            iconB64: processedIconB64,
            systemInstructions: document.getElementById('systemInstructionsText').value
        };
        localStorage.setItem('syspro_data', JSON.stringify(data));
        showToast("✅ All data saved!");
        addLog("All data saved to localStorage.");
    }
    
    function saveSettings() {
        saveAllData();
        toggleModal(false);
        showToast("Settings saved!");
    }
    
    window.onload = () => {
        const saved = getStorage();
        if (saved && Object.keys(saved).length > 0) {
            document.getElementById('javaCode').value = saved.java || "";
            document.getElementById('xmlCode').value = saved.xml || "";
            document.getElementById('manifestCode').value = saved.manifest || "";
            document.getElementById('colorsXml').value = saved.colors || "";
            document.getElementById('stylesXml').value = saved.styles || "";
            document.getElementById('themesXml').value = saved.themes || "";
            document.getElementById('dimensXml').value = saved.dimens || "";
            document.getElementById('stringsXml').value = saved.strings || "";
            document.getElementById('buttonGradientXml').value = saved.buttonGradient || "";
            document.getElementById('icTorchOnXml').value = saved.icTorchOn || "";
            document.getElementById('icTorchOffXml').value = saved.icTorchOff || "";
            document.getElementById('pkgName').value = saved.pkg || "";
            document.getElementById('ghToken').value = saved.token || "";
            document.getElementById('ghRepo').value = saved.repo || "";
            if (saved.systemInstructions) document.getElementById('systemInstructionsText').value = saved.systemInstructions;
            else document.getElementById('systemInstructionsText').value = ULTRA_PRECISE_INSTRUCTIONS;
            if (saved.iconB64) {
                processedIconB64 = saved.iconB64;
                document.getElementById('iconPreview').src = "data:image/png;base64,"+saved.iconB64;
                document.getElementById('iconPreview').style.display = 'block';
            }
            addLog("Previous data loaded from localStorage.", "#00FFCC");
        } else {
            document.getElementById('systemInstructionsText').value = ULTRA_PRECISE_INSTRUCTIONS;
            addLog("First time – ultra-precise instructions loaded. No API key needed for AI.", "#a8b2d1");
        }
        addLog("UI ready. Using Puter.js – free, unlimited, no API key required.", "#00FFCC");
    };
    
    window.saveAllData = saveAllData; window.clearCodeOnly = clearCodeOnly; window.switchTab = switchTab;
    window.processIcon = processIcon; window.generateWithPuter = generateWithPuter;
    window.startFullProcess = startFullProcess; window.downloadLatestApk = downloadLatestApk;
    window.saveSettings = saveSettings; window.toggleModal = toggleModal; window.clearLogs = clearLogs;
    window.copyToClipboard = copyToClipboard; window.copyAllCode = copyAllCode; window.resetInstructionsToDefault = resetInstructionsToDefault;
</script>
</body>
